<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正負數乘除</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        /* 數學式樣式 */
        .math {
            font-size: 36px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }

        /* 填答格樣式 */
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border: 4px dashed #cbd5e1;
            border-radius: 16px;
            margin: 0 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: white;
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
            vertical-align: middle;
        }

        .slot.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2);
            animation: pulse-slot 1.5s infinite;
        }

        .slot.filled {
            border-style: solid;
            border-color: #3b82f6;
            background-color: #f0f9ff;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #16a34a;
            cursor: default;
        }

        @keyframes pulse-slot {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* 選項按鈕 */
        .option-btn {
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .option-btn:active {
            transform: scale(0.92);
        }

        /* 捲動軸隱藏 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 步驟出現動畫 */
        .step-card {
            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.6s ease-out forwards;
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 側邊欄漸層 */
        .aside-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b">
        <div class="max-w-[1400px] mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-x-auto no-scrollbar flex-1 mr-4" id="nav-tabs">
                <span class="text-indigo-600 font-black whitespace-nowrap border-r-2 pr-4 text-lg">正負數乘除</span>
                <!-- 題目切換按鈕由 JS 生成 -->
            </div>
            <div class="flex items-center space-x-6 text-slate-600 shrink-0">
                <div class="flex items-center bg-slate-100 px-4 py-1.5 rounded-full font-mono font-bold">
                    <svg class="w-4 h-4 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="timer">07:00</span>
                </div>
                <div class="flex items-center bg-indigo-50 px-4 py-1.5 rounded-full text-indigo-700 font-black">
                    <span class="text-xs mr-2 opacity-70">SCORE</span>
                    <span id="score-display">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主內容區：左右佈局 -->
    <main class="flex-1 max-w-[1400px] mx-auto w-full flex flex-col md:flex-row">

        <!-- 左側：題目資訊固定區 -->
        <aside class="md:w-[400px] p-6 md:p-10 border-b md:border-b-0 md:border-r border-slate-200 aside-gradient">
            <div class="sticky top-28 space-y-8">
                <div>
                    <span
                        class="inline-block px-4 py-1 bg-indigo-600 text-white rounded-full text-xs font-black tracking-widest mb-4">QUESTION
                        <span id="current-q-num">1</span></span>
                    <div id="problem-area" class="py-4">
                        <!-- 題目內容 -->
                    </div>
                </div>

                <div class="p-6 bg-white/50 rounded-3xl border border-white shadow-sm">
                    <h4 class="text-sm font-black text-slate-400 mb-4 flex items-center uppercase tracking-wider">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1a1 1 0 112 0v1a1 1 0 11-2 0zM14.243 14.243a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 111.414-1.414l.707.707zM16 10a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1z" />
                        </svg>
                        解題重點
                    </h4>
                    <p class="text-slate-600 font-medium leading-relaxed" id="teacher-hint">
                        口訣：同號得正，異號得負！
                    </p>
                </div>

                <div class="hidden md:block pt-4">
                    <div class="flex space-x-2 text-[10px] font-bold text-slate-300">
                        <span>SPEDMIX MATH TOOL</span>
                        <span>•</span>
                        <span>2026 EDITION</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右側：互動解題區 -->
        <section class="flex-1 p-6 md:p-12 space-y-8 overflow-y-auto" id="steps-container">
            <!-- 步驟內容由 JS 動態插入 -->
        </section>

    </main>

    <!-- 完成視窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div
            class="bg-white rounded-[40px] shadow-2xl max-w-sm w-full p-10 text-center relative overflow-hidden border border-white/20">
            <div
                class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">任務達成！</h2>
            <p class="text-slate-500 mb-8 font-medium">你完成了所有的乘除練習</p>

            <div class="bg-slate-50 rounded-3xl p-6 mb-8 grid grid-cols-2 gap-4 border border-slate-100">
                <div>
                    <p class="text-[10px] text-slate-400 font-black uppercase mb-1">最終分數</p>
                    <p class="text-3xl font-black text-indigo-600" id="final-score">0</p>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-black uppercase mb-1">完成時間</p>
                    <p class="text-3xl font-black text-slate-700" id="final-time">00:00</p>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="resetApp()"
                    class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black transition-all shadow-lg shadow-indigo-200">再玩一次</button>
                <button onclick="closeModal()"
                    class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-bold transition-all">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        // 音效
        const playSfx = (isCorrect) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (isCorrect) {
                osc.frequency.setValueAtTime(523, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
            }
            osc.start(); osc.stop(ctx.currentTime + 0.4);
        };

        // 題目資料（乘除 7 題）
        const problems = [
            {
                id: 1, text: "32 ÷ (-4) =", hint: "正數除以負數。口訣：異號得負。", steps: [
                    { label: "步驟 1：決定結果的符號", template: "符號是 [s]", answers: ["-"], options: ["+", "-"] },
                    { label: "步驟 2：進行數值計算", template: "32 ÷ 4 = [s]", answers: ["8"], options: ["4", "8", "12", "32"] },
                    { label: "步驟 3：寫出最終答案", template: "答案等於 [s]", answers: ["-8"], options: ["8", "-8", "28", "-28"] }
                ]
            },
            {
                id: 2, text: "(-30) ÷ 6 =", hint: "負數除以正數。口訣：異號得負。", steps: [
                    { label: "步驟 1：決定符號", template: "符號是 [s]", answers: ["-"], options: ["+", "-"] },
                    { label: "步驟 2：計算數值", template: "30 ÷ 6 = [s]", answers: ["5"], options: ["5", "6", "10", "30"] },
                    { label: "步驟 3：合併答案", template: "答案 = [s]", answers: ["-5"], options: ["5", "-5", "24", "-24"] }
                ]
            },
            {
                id: 3, text: "63 ÷ 9 =", hint: "兩個都是正數，直接除法運算即可。", steps: [
                    { label: "步驟 1：直接得出答案", template: "63 ÷ 9 = [s]", answers: ["7"], options: ["6", "7", "8", "9"] }
                ]
            },
            {
                id: 4, text: "(-8) ÷ 2 =", hint: "負數除以正數。異號得負。", steps: [
                    { label: "步驟 1：判定符號", template: "符號是 [s]", answers: ["-"], options: ["+", "-"] },
                    { label: "步驟 2：計算 8 ÷ 2", template: "8 ÷ 2 = [s]", answers: ["4"], options: ["2", "4", "6", "8"] },
                    { label: "步驟 3：寫出答案", template: "答案 = [s]", answers: ["-4"], options: ["4", "-4", "10", "-10"] }
                ]
            },
            {
                id: 5, text: "(-40) ÷ 10 =", hint: "除以 10 可以看成去掉一個 0。", steps: [
                    { label: "步驟 1：判定符號", template: "符號 [s]", answers: ["-"], options: ["+", "-"] },
                    { label: "步驟 2：計算 40 ÷ 10", template: "40 ÷ 10 = [s]", answers: ["4"], options: ["4", "10", "40", "0"] },
                    { label: "步驟 3：最後答案", template: "答案 [s]", answers: ["-4"], options: ["4", "-4", "30", "-30"] }
                ]
            },
            {
                id: 6, text: "(-10) × 8 =", hint: "注意！這是乘法運算。異號相乘得負。", steps: [
                    { label: "步驟 1：判定符號", template: "乘法結果符號 [s]", answers: ["-"], options: ["+", "-"] },
                    { label: "步驟 2：數值相乘", template: "10 × 8 = [s]", answers: ["80"], options: ["18", "80", "8", "2"] },
                    { label: "步驟 3：最終答案", template: "答案 = [s]", answers: ["-80"], options: ["80", "-80", "18", "-18"] }
                ]
            },
            {
                id: 7, text: "(-8) ÷ (-8) =", hint: "負數除以負數。口訣：同號得正！", steps: [
                    { label: "步驟 1：決定符號", template: "負負得 [s]", answers: ["+"], options: ["+", "-"] },
                    { label: "步驟 2：數值計算", template: "8 ÷ 8 = [s]", answers: ["1"], options: ["0", "1", "8", "16"] },
                    { label: "步驟 3：得出答案", template: "答案是 [s]", answers: ["1"], options: ["1", "-1", "0", "8"] }
                ]
            }
        ];

        let curIdx = 0;
        let score = 0;
        let timerSec = 420;
        let timerInterval;
        let curAnswers = [];
        let solvedSteps = new Set();

        function init() {
            renderNav();
            loadProb(0);
            startTimer();
        }

        function renderNav() {
            const nav = document.getElementById('nav-tabs');
            nav.innerHTML = '<span class="text-indigo-600 font-black whitespace-nowrap border-r-2 pr-4 text-lg">正負數乘除</span>';
            problems.forEach((p, i) => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2 rounded-xl whitespace-nowrap font-bold transition-all ${i === curIdx ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`;
                btn.innerText = `題目 ${i + 1}`;
                btn.onclick = () => loadProb(i);
                nav.appendChild(btn);
            });
        }

        function loadProb(idx) {
            curIdx = idx;
            renderNav();
            const p = problems[idx];
            document.getElementById('current-q-num').innerText = idx + 1;
            document.getElementById('problem-area').innerHTML = `<div class="math">${p.text}</div>`;
            document.getElementById('teacher-hint').innerText = p.hint;
            document.getElementById('steps-container').innerHTML = '';
            renderStep(0);
        }

        function renderStep(sIdx) {
            const step = problems[curIdx].steps[sIdx];
            curAnswers = new Array(step.answers.length).fill(null);

            const card = document.createElement('div');
            card.className = 'bg-white p-8 md:p-10 rounded-[40px] shadow-sm border border-slate-100 step-card';
            card.id = `step-box-${sIdx}`;

            card.innerHTML = `
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center font-black italic shadow-lg">S${sIdx + 1}</div>
                        <h3 class="text-xl font-black text-slate-700">${step.label}</h3>
                    </div>
                    <div id="status-${sIdx}" class="hidden flex items-center text-green-500 font-black bg-green-50 px-4 py-2 rounded-full text-xs tracking-wider">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
                        COMPLETED
                    </div>
                </div>
                <div id="content-${sIdx}" class="math mb-10 text-slate-500"></div>
                <div id="options-${sIdx}" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
                <button id="check-${sIdx}" class="mt-10 w-full py-5 bg-slate-900 text-white rounded-[24px] font-black text-lg hover:bg-slate-800 transition-all shadow-xl shadow-slate-200">檢查我的答案</button>
            `;

            document.getElementById('steps-container').appendChild(card);

            // 處理 template
            const content = document.getElementById(`content-${sIdx}`);
            step.template.split('[s]').forEach((part, i, arr) => {
                content.appendChild(document.createTextNode(part));
                if (i < arr.length - 1) {
                    const slot = document.createElement('div');
                    slot.className = `slot ${i === 0 ? 'active' : ''}`;
                    slot.onclick = () => clearSlot(i, sIdx);
                    content.appendChild(slot);
                }
            });

            // 選項
            const opts = document.getElementById(`options-${sIdx}`);
            [...step.options].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = 'option-btn bg-slate-50 border-2 border-slate-100 py-4 rounded-3xl font-black text-2xl text-slate-700 hover:border-indigo-400 hover:bg-white transition-all shadow-sm';
                b.innerText = o;
                b.onclick = () => fillSlot(o, sIdx);
                opts.appendChild(b);
            });

            document.getElementById(`check-${sIdx}`).onclick = () => checkAnswer(sIdx);
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fillSlot(val, sIdx) {
            const slots = document.querySelectorAll(`#step-box-${sIdx} .slot`);
            const target = curAnswers.indexOf(null);
            if (target !== -1) {
                curAnswers[target] = val;
                slots[target].innerText = val;
                slots[target].classList.add('filled');
                slots[target].classList.remove('active');
                if (target + 1 < curAnswers.length) slots[target + 1].classList.add('active');
            }
        }

        function clearSlot(idx, sIdx) {
            const slots = document.querySelectorAll(`#step-box-${sIdx} .slot`);
            if (slots[idx].classList.contains('correct')) return;
            curAnswers[idx] = null;
            slots[idx].innerText = '';
            slots[idx].classList.remove('filled');
            slots.forEach(s => s.classList.remove('active'));
            const next = curAnswers.indexOf(null);
            if (next !== -1) slots[next].classList.add('active');
        }

        function checkAnswer(sIdx) {
            if (curAnswers.includes(null)) {
                showToast("還有空格沒填喔！", "warning");
                return;
            }
            const step = problems[curIdx].steps[sIdx];
            const isOk = curAnswers.every((v, i) => v === step.answers[i]);

            if (isOk) {
                playSfx(true);
                const slots = document.querySelectorAll(`#step-box-${sIdx} .slot`);
                slots.forEach(s => s.classList.add('correct'));
                document.getElementById(`status-${sIdx}`).classList.remove('hidden');
                document.getElementById(`options-${sIdx}`).classList.add('hidden');
                document.getElementById(`check-${sIdx}`).classList.add('hidden');

                if (!solvedSteps.has(`${curIdx}-${sIdx}`)) {
                    score += 1;
                    document.getElementById('score-display').innerText = score;
                    solvedSteps.add(`${curIdx}-${sIdx}`);
                }

                if (sIdx + 1 < problems[curIdx].steps.length) {
                    setTimeout(() => renderStep(sIdx + 1), 600);
                } else {
                    if (curIdx === problems.length - 1) {
                        endGame();
                    } else {
                        const nextBtn = document.createElement('button');
                        nextBtn.className = 'w-full py-5 bg-indigo-600 text-white rounded-[30px] font-black text-xl mt-6 shadow-xl shadow-indigo-100 hover:bg-indigo-700 transform hover:scale-[1.02] transition-all';
                        nextBtn.innerText = '本題完成！下一題 ➔';
                        nextBtn.onclick = () => loadProb(curIdx + 1);
                        document.getElementById('steps-container').appendChild(nextBtn);
                        nextBtn.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } else {
                playSfx(false);
                showToast("再想想看喔，答案不太對！", "error");
            }
        }

        function showToast(m, type) {
            const t = document.createElement('div');
            t.className = `fixed bottom-12 left-1/2 -translate-x-1/2 px-10 py-5 rounded-[30px] text-white font-black shadow-2xl z-[200] animate-bounce ${type === 'error' ? 'bg-red-500' : 'bg-orange-500'}`;
            t.innerText = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSec--;
                const m = Math.floor(timerSec / 60).toString().padStart(2, '0');
                const s = (timerSec % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                if (timerSec <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('final-score').innerText = score;
            const use = 420 - timerSec;
            document.getElementById('final-time').innerText = `${Math.floor(use / 60)}分${use % 60}秒`;
            document.getElementById('finish-modal').classList.remove('hidden');
        }

        function resetApp() {
            score = 0; timerSec = 420; solvedSteps.clear();
            document.getElementById('score-display').innerText = '0';
            document.getElementById('finish-modal').classList.add('hidden');
            loadProb(0);
            startTimer();
        }

        function closeModal() { document.getElementById('finish-modal').classList.add('hidden'); }

        window.onload = init;
    </script>
</body>

</html>
