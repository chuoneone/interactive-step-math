<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 負數的次方運算</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }

        /* 數學式樣式 */
        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .power {
            font-size: 18px;
            vertical-align: super;
            margin-left: 2px;
            color: #e63946;
        }

        /* 填答格樣式 */
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 55px;
            height: 50px;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            margin: 0 4px;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s;
            font-weight: bold;
            font-size: 22px;
        }

        .slot.filled {
            border-style: solid;
            border-color: #3b82f6;
            color: #1e40af;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #166534;
        }

        /* 按鈕樣式 */
        .option-btn {
            background-color: #fff;
            border: 2px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .option-btn:hover:not(:disabled) {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            background-color: #f1f5f9;
            border-style: dashed;
        }

        /* 動畫 */
        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .tada {
            animation: tada 0.5s;
        }

        .step-locked {
            opacity: 0.3;
            pointer-events: none;
            filter: blur(1px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b shadow-md z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 overflow-hidden">
                <span class="font-bold text-indigo-600 shrink-0 hidden sm:inline text-lg">負數的次方運算</span>
                <nav id="nav-tabs" class="flex gap-2 overflow-x-auto no-scrollbar py-2">
                    <!-- Tabs generated here -->
                </nav>
            </div>
            <div class="flex items-center gap-4 shrink-0 font-bold ml-4">
                <div class="text-rose-600 bg-rose-50 px-4 py-1 rounded-full border border-rose-100">得分: <span
                        id="total-score">0</span></div>
                <div class="text-gray-600 bg-gray-100 px-4 py-1 rounded-full border border-gray-200">⏳ <span
                        id="timer">07:00</span></div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左側：題目區 (固定) -->
        <aside id="problem-side" class="w-full md:w-1/3 bg-indigo-50 p-8 border-r-2 border-indigo-100 overflow-y-auto">
            <div class="sticky top-0">
                <div
                    class="inline-flex items-center gap-2 bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-bold mb-6">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    當前題目
                </div>
                <div id="problem-text" class="text-3xl font-black text-slate-800 leading-relaxed mb-8">
                    <!-- Problem injected -->
                </div>

                <div class="space-y-4">
                    <div class="p-5 bg-white rounded-2xl border-2 border-indigo-100 shadow-sm">
                        <p class="text-xs text-indigo-400 mb-3 font-black uppercase tracking-widest">重要觀念</p>
                        <div id="problem-hints" class="flex flex-col gap-2">
                            <span class="text-slate-700 font-bold leading-relaxed">💡 負數的<mark
                                    class="bg-yellow-200">奇數次方</mark>，結果為負數。</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右側：填答區 (捲動) -->
        <section id="step-side" class="flex-1 p-6 md:p-10 overflow-y-auto bg-slate-50">
            <div id="steps-container" class="max-w-3xl mx-auto space-y-10 pb-40">
                <!-- Steps generated here -->
            </div>
        </section>

    </main>

    <!-- 完成視窗 -->
    <div id="modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] p-10 max-w-md w-full text-center shadow-2xl border-4 border-indigo-100">
            <div class="text-8xl mb-6">🏆</div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">挑戰成功！</h2>
            <p class="text-slate-500 text-lg mb-8 font-medium">你已經掌握了負數次方的規則！</p>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="restartApp()"
                    class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">重新挑戰</button>
                <button onclick="closeModal()"
                    class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-black text-xl hover:bg-slate-200 transition-all">檢視結果</button>
            </div>
        </div>
    </div>

    <script>
        // 更新後的資料集，確保 options 中有足夠的重複按鈕
        const PROBLEMS = [
            {
                id: 1,
                title: "題目 1",
                text: "(−3)<span class='power'>3</span> 之值為何？",
                steps: [
                    {
                        title: "Step 1: 連乘展開",
                        template: "= ( <span class='slot' data-ans='-3'></span> ) × ( <span class='slot' data-ans='-3'></span> ) × ( <span class='slot' data-ans='-3'></span> )",
                        // 需要三個 -3
                        options: ["-3", "-3", "-3", "3", "3"]
                    },
                    {
                        title: "Step 2: 算出最終答案",
                        template: "= <span class='slot' data-ans='-27'></span>",
                        options: ["27", "-27", "9", "-9"]
                    }
                ]
            },
            {
                id: 2,
                title: "題目 2",
                text: "(−2)<span class='power'>3</span> 之值為何？",
                steps: [
                    {
                        title: "Step 1: 連乘展開",
                        template: "= ( <span class='slot' data-ans='-2'></span> ) × ( <span class='slot' data-ans='-2'></span> ) × ( <span class='slot' data-ans='-2'></span> )",
                        options: ["-2", "-2", "-2", "2", "2"]
                    },
                    {
                        title: "Step 2: 算出最後答案",
                        template: "= <span class='slot' data-ans='-8'></span>",
                        options: ["8", "-8", "6", "-6"]
                    }
                ]
            },
            {
                id: 3,
                title: "題目 3",
                text: "(−5)<span class='power'>3</span> 之值為何？",
                steps: [
                    {
                        title: "Step 1: 連乘展開",
                        template: "= ( <span class='slot' data-ans='-5'></span> ) × ( <span class='slot' data-ans='-5'></span> ) × ( <span class='slot' data-ans='-5'></span> )",
                        options: ["-5", "-5", "-5", "5", "5"]
                    },
                    {
                        title: "Step 2: 算出答案",
                        template: "= <span class='slot' data-ans='-125'></span>",
                        options: ["125", "-125", "25", "-25"]
                    }
                ]
            },
            {
                id: 4,
                title: "題目 4",
                text: "(−4)<span class='power'>3</span> 之值為何？",
                steps: [
                    {
                        title: "Step 1: 嘗試展開算式",
                        template: "= ( <span class='slot' data-ans='-4'></span> ) × ( <span class='slot' data-ans='-4'></span> ) × ( <span class='slot' data-ans='-4'></span> )",
                        options: ["-4", "-4", "-4", "4", "4"]
                    },
                    {
                        title: "Step 2: 算出結果",
                        template: "= <span class='slot' data-ans='-64'></span>",
                        options: ["64", "-64", "16", "-16"]
                    }
                ]
            },
            {
                id: 5,
                title: "題目 5",
                text: "(−10)<span class='power'>3</span> 之值為何？",
                steps: [
                    {
                        title: "Step 1: 連乘展開",
                        template: "= ( <span class='slot' data-ans='-10'></span> ) × ( <span class='slot' data-ans='-10'></span> ) × ( <span class='slot' data-ans='-10'></span> )",
                        options: ["-10", "-10", "-10", "10", "10"]
                    },
                    {
                        title: "Step 2: 算出結果",
                        template: "= <span class='slot' data-ans='-1000'></span>",
                        options: ["1000", "-1000", "30", "-100"]
                    }
                ]
            }
        ];

        let currentIdx = 0;
        let unlockedStepIdx = 0;
        let score = 0;
        let timeLeft = 420;
        let timerInterval;

        window.onload = () => {
            initTabs();
            loadProblem(0);
            startTimer();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    return;
                }
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function initTabs() {
            const nav = document.getElementById('nav-tabs');
            nav.innerHTML = '';
            PROBLEMS.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-${idx}`;
                btn.className = `tab-btn shrink-0 px-6 py-2 rounded-full border-2 transition-all font-black text-sm shadow-sm ${idx === 0 ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-400 border-slate-100 hover:border-indigo-200'}`;
                btn.innerText = p.title;
                btn.onclick = () => switchProblem(idx);
                nav.appendChild(btn);
            });
        }

        function switchProblem(idx) {
            currentIdx = idx;
            unlockedStepIdx = 0;
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                if (i === idx) {
                    b.classList.replace('bg-white', 'bg-indigo-600');
                    b.classList.replace('text-slate-400', 'text-white');
                    b.classList.replace('border-slate-100', 'border-indigo-600');
                } else {
                    b.classList.add('bg-white', 'text-slate-400', 'border-slate-100');
                    b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                }
            });
            loadProblem(idx);
        }

        function loadProblem(idx) {
            const prob = PROBLEMS[idx];
            document.getElementById('problem-text').innerHTML = prob.text;
            renderSteps(idx);
        }

        function renderSteps(probIdx) {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            const prob = PROBLEMS[probIdx];

            prob.steps.forEach((step, sIdx) => {
                const stepDiv = document.createElement('div');
                stepDiv.id = `step-card-${sIdx}`;
                stepDiv.className = `bg-white rounded-[32px] p-8 transition-all duration-500 border-2 ${sIdx > unlockedStepIdx ? 'step-locked border-transparent' : 'border-white shadow-xl shadow-slate-200/50'}`;

                const titleHtml = `
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex items-center gap-4">
                            <span class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-lg">${sIdx + 1}</span>
                            <h3 class="font-black text-slate-700 text-xl">${step.title}</h3>
                        </div>
                        <div id="check-icon-${sIdx}" class="hidden flex items-center gap-2 text-green-500 font-black">
                            <div class="w-6 h-6 rounded-full bg-green-100 flex items-center justify-center">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg>
                            </div>
                            完成
                        </div>
                    </div>
                `;

                const contentHtml = `<div class="mb-10 text-center py-6 bg-slate-50/50 rounded-2xl border border-slate-100 math">${step.template}</div>`;

                const optionsHtml = `
                    <div id="options-wrap-${sIdx}" class="flex flex-wrap items-center gap-3 pt-6 border-t-2 border-slate-50 border-dashed">
                        <div class="w-full text-xs font-black text-slate-300 uppercase tracking-widest mb-2">點選正確答案填入</div>
                        ${step.options.map((opt, optIdx) => `<button class="option-btn" onclick="fillSlot('${opt}', ${sIdx}, this, ${optIdx})">${opt}</button>`).join('')}
                        <button onclick="checkStep(${sIdx})" class="ml-auto bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">檢查答案</button>
                    </div>
                `;

                stepDiv.innerHTML = titleHtml + contentHtml + optionsHtml;
                container.appendChild(stepDiv);

                stepDiv.querySelectorAll('.slot').forEach(slot => {
                    slot.onclick = () => clearSlot(slot, sIdx);
                });
            });
        }

        // 修改後的填入邏輯，使用唯一標記來追蹤按鈕
        function fillSlot(val, stepIdx, btn, optIdx) {
            const stepCard = document.getElementById(`step-card-${stepIdx}`);
            const slots = stepCard.querySelectorAll('.slot');
            for (let s of slots) {
                if (!s.innerText) {
                    s.innerText = val;
                    s.classList.add('filled');
                    s.dataset.btnIndex = optIdx; // 記憶是點擊哪個按鈕填入的
                    btn.disabled = true;
                    btn.classList.add('scale-95');
                    break;
                }
            }
        }

        function clearSlot(slot, stepIdx) {
            if (!slot.innerText || slot.classList.contains('correct')) return;
            const optIdx = slot.dataset.btnIndex;
            slot.innerText = '';
            slot.classList.remove('filled');

            const optionsWrap = document.getElementById(`options-wrap-${stepIdx}`);
            const btns = optionsWrap.querySelectorAll('.option-btn');
            // 透過索引精準恢復按鈕
            if (btns[optIdx]) {
                btns[optIdx].disabled = false;
                btns[optIdx].classList.remove('scale-95');
            }
        }

        function checkStep(sIdx) {
            const stepCard = document.getElementById(`step-card-${sIdx}`);
            const slots = stepCard.querySelectorAll('.slot');
            let allFilled = true;
            let allCorrect = true;

            slots.forEach(slot => {
                if (!slot.innerText) allFilled = false;
                if (slot.innerText !== slot.dataset.ans) allCorrect = false;
            });

            if (!allFilled) {
                showToast("還有格子沒填完喔！", "orange");
                return;
            }

            if (allCorrect) {
                slots.forEach(s => s.classList.add('correct'));
                document.getElementById(`check-icon-${sIdx}`).classList.remove('hidden');
                document.getElementById(`options-wrap-${sIdx}`).classList.add('hidden');
                stepCard.classList.add('tada', 'border-green-200');

                score += 1;
                document.getElementById('total-score').innerText = score;

                if (sIdx < PROBLEMS[currentIdx].steps.length - 1) {
                    unlockedStepIdx = sIdx + 1;
                    setTimeout(() => {
                        const nextStep = document.getElementById(`step-card-${unlockedStepIdx}`);
                        nextStep.classList.remove('step-locked');
                        nextStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 600);
                } else {
                    if (currentIdx === PROBLEMS.length - 1) {
                        setTimeout(() => document.getElementById('modal').classList.remove('hidden'), 1000);
                    } else {
                        showToast("太棒了！本題完成，繼續下一題！", "green");
                    }
                }
            } else {
                showToast("再檢查一下計算結果喔！", "red");
            }
        }

        function showToast(text, color) {
            const toast = document.createElement('div');
            toast.className = `fixed top-24 left-1/2 -translate-x-1/2 px-8 py-4 rounded-3xl text-white font-black shadow-2xl z-50 transition-all duration-300`;
            const bg = { green: 'bg-green-500', red: 'bg-rose-500', orange: 'bg-amber-500' };
            toast.classList.add(bg[color]);
            toast.innerText = text;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function restartApp() {
            location.reload();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>

</html>
