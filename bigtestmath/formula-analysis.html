<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學互動學習單：乘法公式歷屆試題</title>
    <link rel="icon" href="../images/dog.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- KaTeX Auto-render Extension -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        .step-hidden {
            display: none;
        }

        .step-visible {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 針對特教需求加強可讀性 */
        .math-text {
            font-family: 'Times New Roman', serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen p-4 md:p-8 font-sans text-gray-900">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-900 mb-2">國中數學歷屆試題：乘法公式篇</h1>
            <div class="inline-block px-4 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">
                互動式步驟解析學習單 (Powered by KaTeX)
            </div>
        </header>

        <!-- Question List -->
        <div id="app" class="space-y-8">
            <!-- Questions will be generated here -->
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 13,
                year: "100 基測II 第26 題",
                title: "第 13 題：平方差計算",
                content: "計算 $(250＋0.9＋0.7＋0.8)^2－(250－0.9－0.7－0.8)^2$ 之值為何？",
                options: ["(A) 11.52", "(B) 23.04", "(C) 1200", "(D) 2400"],
                steps: [
                    { label: "核心公式", text: "本題使用平方差公式：$a^2 - b^2 = (a + b)(a - b)$。" },
                    { label: "步驟 1：簡化算式", text: "觀察到 $0.9 + 0.8 + 0.7 = 2.4$。<br>原式變為：$(250 + 2.4)^2 - (250 - 2.4)^2$。" },
                    { label: "步驟 2：代入公式", text: "設 $a = (250 + 2.4)$， $b = (250 - 2.4)$。<br>原式 $= [(250 + 2.4) + (250 - 2.4)] \\times [(250 + 2.4) - (250 - 2.4)]$" },
                    { label: "步驟 3：化簡括號", text: "前面括號：$250 + 2.4 + 250 - 2.4 = 500$<br>後面括號：$250 + 2.4 - 250 + 2.4 = 4.8$" },
                    { label: "步驟 4：最後計算", text: "$500 \\times 4.8 = 2400$" },
                    { label: "正確答案", text: "**(D) 2400**" }
                ]
            },
            {
                id: 14,
                year: "102 基測第32 題",
                title: "第 14 題：數字規律化簡",
                content: "若 $A＝101 \\times 9996 \\times 10005$，$B＝10004 \\times 9997 \\times 101$，則 $A－B$ 之值為何？",
                options: ["(A) 101", "(B)－101", "(C) 808", "(D)－808"],
                steps: [
                    { label: "策略分析", text: "先提取公因數 $101$，再將大數字設為變數簡化。" },
                    { label: "步驟 1：提取公因數", text: "$A - B = 101 \\times (9996 \\times 10005 - 10004 \\times 9997)$" },
                    { label: "步驟 2：設變數簡化", text: "設 $x = 10000$。<br>數字變成：$(x-4)(x+5) - (x+4)(x-3)$" },
                    { label: "步驟 3：展開計算", text: "$(x^2 + x - 20) - (x^2 + x - 12)$<br>$= x^2 + x - 20 - x^2 - x + 12 = -8$" },
                    { label: "步驟 4：最終運算", text: "$101 \\times (-8) = -808$" },
                    { label: "正確答案", text: "**(D) -808**" }
                ]
            },
            {
                id: 15,
                year: "103 會考第5 題",
                title: "第 15 題：數字拆解法",
                content: "算式 $743 \\times 369 － 741 \\times 370$ 之值為何？",
                options: ["(A)－3", "(B)－2", "(C) 2", "(D) 3"],
                steps: [
                    { label: "策略分析", text: "尋找基準數。設 $a = 741$，$b = 369$。" },
                    { label: "步驟 1：改寫算式", text: "原式可看成：$(a + 2)b - a(b + 1)$" },
                    { label: "步驟 2：展開括號", text: "$(ab + 2b) - (ab + a) = ab + 2b - ab - a = 2b - a$" },
                    { label: "步驟 3：代回數字", text: "$2 \\times 369 - 741 = 738 - 741 = -3$" },
                    { label: "正確答案", text: "**(A) -3**" }
                ]
            },
            {
                id: 16,
                year: "104 會考第16 題",
                title: "第 16 題：比較大小",
                content: "判斷下列各式的值，何者最大？",
                options: ["(A) $25 \\times 13^2 － 15^2$", "(B) $16 \\times 17^2 － 18^2$", "(C) $9 \\times 21^2 － 13^2$", "(D) $4 \\times 31^2 － 12^2$"],
                steps: [
                    { label: "核心公式", text: "利用 $k^2 \\cdot a^2 = (ka)^2$ 轉換後再用平方差。" },
                    { label: "選項 (A)", text: "$5^2 \\times 13^2 - 15^2 = 65^2 - 15^2 = (65+15)(65-15) = 80 \\times 50 = 4000$" },
                    { label: "選項 (B)", text: "$4^2 \\times 17^2 - 18^2 = 68^2 - 18^2 = (68+18)(68-18) = 86 \\times 50 = 4300$" },
                    { label: "選項 (C)", text: "$3^2 \\times 21^2 - 13^2 = 63^2 - 13^2 = (63+13)(63-13) = 76 \\times 50 = 3800$" },
                    { label: "選項 (D)", text: "$2^2 \\times 31^2 - 12^2 = 62^2 - 12^2 = (62+12)(62-12) = 74 \\times 50 = 3700$" },
                    { label: "正確答案", text: "**(B) 最大**" }
                ]
            },
            {
                id: 17,
                year: "106 會考第17 題",
                title: "第 17 題：質數與平方公式",
                content: "若 $a, b$ 為兩質數且相差 2，則 $ab＋1$ 之值可能為何？",
                options: ["(A) $39^2$", "(B) $40^2$", "(C) $41^2$", "(D) $42^2$"],
                steps: [
                    { label: "步驟 1：模型建立", text: "設兩質數中間的偶數為 $x$，則 $a = x-1, b = x+1$。" },
                    { label: "步驟 2：公式轉換", text: "$ab + 1 = (x-1)(x+1) + 1 = (x^2 - 1) + 1 = x^2$。<br>這代表答案必須是某個數字 $x$ 的平方。" },
                    { label: "步驟 3：驗證性質", text: "題目說 $a, b$（也就是 $x-1$ 和 $x+1$）必須是「質數」。" },
                    { label: "步驟 4：檢查選項", text: "選項 (D) 為 $42^2$，則 $x=42$。<br>檢查其左右：$41$ 和 $43$ 皆為質數，符合條件！" },
                    { label: "正確答案", text: "**(D) $42^2$**" }
                ]
            },
            {
                id: 18,
                year: "110 會考第 8 題",
                title: "第 18 題：判斷成立的等式",
                content: "利用乘法公式判斷，下列等式何者成立？",
                options: ["(A) $248^2 + 248 \\times 52 + 52^2 = 300^2$", "(B) $248^2 - 248 \\times 48 - 48^2 = 200^2$", "(C) $248^2 + 2 \\times 248 \\times 52 + 52^2 = 300^2$", "(D) $248^2 - 2 \\times 248 \\times 48 - 48^2 = 200^2$"],
                steps: [
                    { label: "核心公式", text: "和的平方：$(a+b)^2 = a^2 + 2ab + b^2$<br>差的平方：$(a-b)^2 = a^2 - 2ab + b^2$" },
                    { label: "診斷選項 (A)", text: "$a^2 + ab + b^2$ 缺少中間項的 $2$，所以不等於 $(a+b)^2$。" },
                    { label: "診斷選項 (B)", text: "中間項缺少 $2$，且尾項應為「加」$b^2$。" },
                    { label: "診斷選項 (C)", text: "符合 $a^2 + 2ab + b^2$。<br>計算結果：$(248+52)^2 = 300^2$。**正確！**" },
                    { label: "診斷選項 (D)", text: "尾項符號錯誤。公式應為 $+b^2$，選項中是 $-48^2$。" },
                    { label: "正確答案", text: "**(C)**" }
                ]
            },
            {
                id: 19,
                year: "114 會考第 10 題",
                title: "第 19 題：找出不相同的算式",
                content: "利用乘法公式判斷，下列算式之值，何者與其他不相同？",
                options: ["(A) $(106^2-4^2) \\times (108^2-2^2)$", "(B) $(107^2-3^2) \\times (107^2-1^2)$", "(C) $(108^2-2^2) \\times (106^2-2^2)$", "(D) $(109^2-1^2) \\times (105^2-1^2)$"],
                steps: [
                    { label: "核心公式", text: "平方差公式：$a^2 - b^2 = (a-b)(a+b)$。" },
                    { label: "展開 (A)", text: "$(102 \\times 110) \\times (106 \\times 110) = 102 \\times 106 \\times 110^2$" },
                    { label: "展開 (B)", text: "$(104 \\times 110) \\times (106 \\times 108) = 104 \\times 106 \\times 108 \\times 110$" },
                    { label: "展開 (C)", text: "$(106 \\times 110) \\times (104 \\times 108) = 104 \\times 106 \\times 108 \\times 110$" },
                    { label: "展開 (D)", text: "$(108 \\times 110) \\times (104 \\times 106) = 104 \\times 106 \\times 108 \\times 110$" },
                    { label: "比較與發現", text: "觀察 (B)(C)(D) 的結果皆相同，只有 (A) 的組成數字不對。" },
                    { label: "正確答案", text: "**(A)**" }
                ]
            }
        ];

        const app = document.getElementById('app');

        function renderMath(element) {
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        function renderQuestions() {
            questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-200 mb-8";

                let stepsHtml = '';
                q.steps.forEach((step, sIndex) => {
                    stepsHtml += `
                        <div id="q${qIndex}-step${sIndex}" class="step-hidden mt-4 p-4 bg-blue-50 rounded-lg border-l-4 border-blue-400">
                            <span class="font-bold text-blue-800 mr-2">${step.label}:</span>
                            <span class="text-gray-800">${step.text}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-xl font-bold text-gray-800">${q.title}</h2>
                            <span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-medium">${q.year}</span>
                        </div>
                        <div class="text-lg bg-gray-50 p-5 rounded-xl mb-4 text-gray-700 leading-relaxed border border-gray-100">
                            ${q.content}
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-5 text-sm font-semibold text-blue-600">
                                ${q.options.map(opt => `<div class="bg-white p-2 rounded border border-blue-50">${opt}</div>`).join('')}
                            </div>
                        </div>
                        <div id="q${qIndex}-steps-container" class="mb-6">
                            ${stepsHtml}
                        </div>
                        <div class="flex gap-3">
                            <button onclick="nextStep(${qIndex})" id="q${qIndex}-btn" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md active:scale-95">
                                查看解題步驟 (0/${q.steps.length})
                            </button>
                            <button onclick="resetSteps(${qIndex})" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 px-4 rounded-xl transition-all">
                                重置
                            </button>
                        </div>
                    </div>
                `;
                app.appendChild(card);
            });
            renderMath(document.body);
        }

        let currentSteps = questions.map(() => -1);

        window.nextStep = function (qIndex) {
            const nextIdx = currentSteps[qIndex] + 1;
            if (nextIdx < questions[qIndex].steps.length) {
                const stepEl = document.getElementById(`q${qIndex}-step${nextIdx}`);
                stepEl.classList.remove('step-hidden');
                stepEl.classList.add('step-visible');
                currentSteps[qIndex] = nextIdx;

                const btn = document.getElementById(`q${qIndex}-btn`);
                btn.innerText = `下一步 (${nextIdx + 1}/${questions[qIndex].steps.length})`;

                if (nextIdx === questions[qIndex].steps.length - 1) {
                    btn.innerText = "本題解析完畢";
                    btn.disabled = true;
                    btn.className = "flex-[2] bg-green-500 text-white font-bold py-3 px-6 rounded-xl cursor-not-allowed";
                }

                renderMath(stepEl);
            }
        };

        window.resetSteps = function (qIndex) {
            currentSteps[qIndex] = -1;
            for (let i = 0; i < questions[qIndex].steps.length; i++) {
                const stepEl = document.getElementById(`q${qIndex}-step${i}`);
                stepEl.classList.remove('step-visible');
                stepEl.classList.add('step-hidden');
            }
            const btn = document.getElementById(`q${qIndex}-btn`);
            btn.innerText = `查看解題步驟 (0/${questions[qIndex].steps.length})`;
            btn.disabled = false;
            btn.className = "flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md active:scale-95";
        };

        document.addEventListener("DOMContentLoaded", function () {
            renderQuestions();
        });
    </script>
</body>

</html>
