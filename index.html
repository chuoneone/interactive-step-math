  <script src="main.js"></script>

  <script>
    // PWA 註冊
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw_learning.js')
          .then(reg => console.log('學習網 PWA 註冊成功'))
          .catch(err => console.log('註冊失敗', err));
      });
    }

    // Title Screen Logic
    const startBtn = document.getElementById('start-btn');
    const titleScreen = document.getElementById('title-screen');
    const mainView = document.getElementById('main-view');

    function startGame() {
      localStorage.setItem('spedmix_visited', '1');
      titleScreen.style.display = 'none';
      mainView.classList.remove('hidden');
      window.dispatchEvent(new Event('resize'));
    }

    // 回訪者直接跳過 title screen
    if (localStorage.getItem('spedmix_visited')) {
      startGame();
    }

    startBtn.addEventListener('click', startGame);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && titleScreen.style.display !== 'none') startGame();
    });

    // Modal Logic (因為 Modal 內容在 HTML 裡，直接寫在這裡最方便)
    const modal = document.getElementById("other-modal");
    const otherBtn = document.getElementById("other-btn");
    const closeSpan = document.querySelector(".close-modal");

    otherBtn.onclick = () => modal.style.display = "block";
    closeSpan.onclick = () => modal.style.display = "none";
    window.onclick = (event) => {
      if (event.target == modal) modal.style.display = "none";
    }
  </script>
