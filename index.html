<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest_learning.json">
  <meta name="theme-color" content="#5C94FC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/dog.png">
  <title>SPEDMIX 學習平台</title>
  <meta name="description" content="專為國中特教生設計的數位學習系統。由米克師製作，提供七八九年級國文、數學、英文數位教材。">
  <meta name="keywords" content="米克師, 國中特教, 數位學習, 特教教材, SPEDMIX, SPED">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="icon" type="image/png" href="images/dog.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=Noto+Sans+TC&display=swap"
    rel="stylesheet">


</head>

<body>
  <div id="main-view">
    <header class="navbar"></header>

    <main class="button-section">
      <div class="intro-text">請選擇科目......</div>

      <div class="grade-row">
        <a href="7ch.html" class="big-button"><i class="fas fa-book"></i> 7年級國文</a>
        <a href="7.html" class="big-button"><i class="fas fa-calculator"></i> 7年級數學</a>
        <a href="7eng.html" class="big-button"><i class="fas fa-language"></i> 7年級英文</a>
      </div>
      <div class="grade-row">
        <a href="8ch.html" class="big-button"><i class="fas fa-book"></i> 8年級國文</a>
        <a href="8.html" class="big-button"><i class="fas fa-calculator"></i> 8年級數學</a>
        <a href="8eng.html" class="big-button"><i class="fas fa-language"></i> 8年級英文</a>
      </div>
      <div class="grade-row">
        <a href="9ch.html" class="big-button"><i class="fas fa-book"></i> 9年級國文</a>
        <a href="9.html" class="big-button"><i class="fas fa-calculator"></i> 9年級數學</a>
        <a href="9eng.html" class="big-button"><i class="fas fa-language"></i> 9年級英文</a>
      </div>

      <footer class="sticky-footer"></footer>
    </main>

    <!-- 頁面背景與裝飾 -->
    <div class="pipe-decoration">
      <div class="pipe-blocks">
        <div class="block brick"></div>
        <div class="block question-box">?</div>
      </div>
    </div>
    <div class="pipe-decoration right">
      <div class="pipe-blocks">
        <div class="block question-box">?</div>
        <div class="block brick"></div>
      </div>
    </div>
  </div>
  </div>

  <div id="other-modal" class="modal"></div>

  <script src="main.js"></script>
  <script src="tracking.js"></script>
  <script src="progress.js"></script>
  <script>
    // PWA 註冊
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw_learning.js')
          .then(reg => console.log('學習網 PWA 註冊成功'))
          .catch(err => console.log('註冊失敗', err));
      });
    }

    // 當前直接進入主畫面，不需要額外邏輯
    window.dispatchEvent(new Event('resize'));
  </script>

</body>


</html>
