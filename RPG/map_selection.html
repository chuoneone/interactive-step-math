<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狗狗冒險之旅 - 地圖選擇</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map_selection_styles.css">
</head>

<body>
    <div class="container map-page-container">

        <div class="map-wrapper">
            <!-- 地圖背景圖 -->
            <img src="images/map.png" alt="校園地圖" id="adventure-map-img">

            <!-- HUD 資訊欄（角色 + 肉乾 + 重置） -->
            <div class="character-reminder character-reminder-overlay">
                <div style="display:flex;align-items:center;">
                    <img id="selected-char-img-map" src="" alt="角色頭像" class="char-avatar-small">
                    <span class="reminder-text">
                        選擇 <strong id="selected-char-name-map">角色名稱</strong> 的探索地點
                    </span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="map-meat-jerky-counter">
                        🦴 肉乾：<strong id="map-meat-jerky-display">0</strong>
                    </span>
                    <button id="reset-game-btn-map" class="reset-game-btn">重新開始</button>
                </div>
            </div>

            <!-- 地點熱點按鈕 -->
            <button class="map-location-btn" id="loc-gate" style="top:28%;left:15%;" data-location-name="🏫 校門口"
                data-location-intro="冒險的起點！這裡有最基礎的暖身挑戰，非常適合剛入學的新同學。" data-target-page="quiz.html?map=gate"
                data-action-type="quiz">校門口</button>

            <button class="map-location-btn" id="loc-library" style="top:40%;left:60%;" data-location-name="📚 圖書館"
                data-location-intro="圖書館藏有許多秘密。你可以在這裡累積基本功！" data-target-page="quiz.html?map=library"
                data-action-type="quiz">圖書館</button>

            <button class="map-location-btn" id="loc-playground" style="top:55%;left:15%;" data-location-name="🏃 操場"
                data-location-intro="操場是個提升體能的好地方，提升熟練度。晚上這裡會出現大份肉乾！" data-target-page="quiz.html?map=playground"
                data-action-type="quiz">操場</button>

            <button class="map-location-btn" id="loc-lab" style="top:80%;left:60%;" data-location-name="🧪 實驗室"
                data-location-intro="實驗室裡充滿了奇特肉乾，但這裡的實驗有些難度..." data-target-page="quiz.html?map=lab"
                data-action-type="quiz">實驗室</button>

            <button class="map-location-btn" id="loc-forest" style="top:85%;left:20%;" data-location-name="🌳 後山林道"
                data-location-intro="幽靜的後山林道充滿了謎題，據說它是通往「校園遺跡」的必經之路。傳說中，強大的「尾語之石」就藏在這附近。"
                data-target-page="quiz.html?map=forest" data-action-type="quiz">後山林道</button>

            <button class="map-location-btn" id="loc-basement" style="top:95%;left:70%;" data-location-name="🔒 地下室"
                data-location-intro="陰森的地下室，據說是舊校長室的所在地，現在被嚴密封鎖。傳聞這裡藏著揭露校史真相的「黑盒子」。只有在故事的終章，你才能進入此地，面對戰鬥與解密的最終考驗。"
                data-target-page="quiz.html?map=basement" data-action-type="quiz" data-locked="true"
                title="目前無法進入">地下室</button>
        </div>

        <!-- 地點介紹 Modal -->
        <div id="location-details-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal-btn">×</span>
                <h3 id="modal-location-name">地點名稱</h3>
                <img id="modal-location-image" src="" alt="地點圖片" class="hidden mb-15">
                <p id="modal-location-intro">地點介紹和考驗內容會顯示在這裡。</p>
                <div class="modal-buttons-container">
                    <button id="confirm-enter-location-btn">確定進入</button>
                    <button id="cancel-modal-btn">取消</button>
                </div>
            </div>
        </div>

    </div>

    <script src="js/map_select.js"></script>
</body>

</html>
