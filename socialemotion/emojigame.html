<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貼圖心情解碼器</title>
    <link rel="icon" href="../image/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        .bounce {
            animation: bounce 0.5s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- 標題與資訊區 -->
        <div class="text-center mb-6">
            <div class="flex justify-center gap-2 mb-4">
                <span id="level-badge"
                    class="px-4 py-1 rounded-full text-sm font-bold bg-blue-500 text-white shadow-sm">第一關：看貼圖</span>
                <span class="px-4 py-1 rounded-full text-sm font-bold bg-yellow-400 text-yellow-900 shadow-sm">
                    得分：<span id="score">0</span>
                </span>
            </div>
            <h1 id="main-title" class="text-3xl font-black text-slate-800 mb-2 cursor-pointer" onclick="speakTitle()">✨
                貼圖心情解碼器 🔊</h1>
            <p id="sub-title" class="text-slate-600 text-lg">選一個訊息，找出它正確的心情！</p>
        </div>

        <!-- 遊戲主區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <!-- 左側：題目 -->
            <div class="space-y-3">
                <div class="text-center text-slate-500 font-bold mb-2 flex items-center justify-center gap-2">
                    1. 點一下訊息 <button onclick="speak('點一下訊息')" class="text-blue-500">🔊</button>
                </div>
                <div id="left-column" class="space-y-3">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <!-- 右側：答案 -->
            <div class="space-y-3">
                <div class="text-center text-slate-500 font-bold mb-2 flex items-center justify-center gap-2">
                    2. 選出它的意思 <button onclick="speak('選出它的意思')" class="text-blue-500">🔊</button>
                </div>
                <div id="right-column" class="space-y-3">
                    <!-- JS 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 訊息回饋區 -->
        <div id="feedback" class="mt-8 h-16 flex items-center justify-center invisible">
            <div id="feedback-content" class="px-6 py-3 rounded-2xl border-2 font-bold text-xl shadow-sm">
                訊息回饋
            </div>
        </div>

        <!-- 歷史紀錄區 -->
        <div class="mt-12 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fas fa-history"></i> 最近挑戰紀錄
            </h3>
            <div id="history-list" class="space-y-2 text-sm text-slate-500">
                <!-- JS 動態生成 -->
                暫無紀錄
            </div>
            <button onclick="clearHistory()"
                class="mt-4 text-xs text-red-400 hover:text-red-600 underline">清除紀錄</button>
        </div>

        <!-- 關卡結束彈窗 -->
        <div id="modal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-b-8 border-slate-200">
                <div id="modal-icon" class="text-6xl mb-4">🏆</div>
                <h2 id="modal-title" class="text-3xl font-black text-slate-800 mb-2">太棒了！</h2>
                <p id="modal-text" class="text-slate-600 mb-6 font-bold">你已經學會了分辨貼圖喔！</p>
                <div class="text-2xl font-black text-yellow-500 mb-6">最終分數：<span id="final-score">0</span></div>
                <button id="modal-btn"
                    class="w-full py-4 bg-blue-500 text-white rounded-2xl font-black text-xl hover:bg-blue-600 transition-all shadow-lg active:scale-95">
                    進入下一關
                </button>
            </div>
        </div>

        <!-- 頁尾 -->
        <div class="mt-12 text-slate-400 text-sm text-center">
            朱一老師設計 ‧ 特教教學輔助素材
        </div>
    </div>

    <script>
        // 資料定義
        const level1Data = [
            { id: 101, display: '😊', label: '開心 / 好喔' },
            { id: 102, display: '😡', label: '我現在很生氣' },
            { id: 103, display: '😭', label: '我很難過 / 痛痛' },
            { id: 104, display: '👍', label: '你很棒 / 知道了' }
        ];

        const level2Data = [
            { id: 201, display: '快一點喔 😊', label: '溫柔的提醒' },
            { id: 202, display: '快一點 😡', label: '生氣地催促' },
            { id: 203, display: '我不理你了 😭', label: '有一點開玩笑' },
            { id: 204, display: '我不理你了 😡', label: '真的很討厭你' }
        ];

        // 語音功能
        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function speakTitle() {
            const title = document.getElementById('main-title').textContent.replace('🔊', '');
            const subTitle = document.getElementById('sub-title').textContent;
            speak(title + "。" + subTitle);
        }

        // 遊戲狀態
        let currentLevel = 1;
        let score = 0;
        let selectedItem = null;
        let matches = [];
        let isLevelComplete = false;

        // DOM 元素
        const leftCol = document.getElementById('left-column');
        const rightCol = document.getElementById('right-column');
        const scoreDisplay = document.getElementById('score');
        const feedback = document.getElementById('feedback');
        const feedbackContent = document.getElementById('feedback-content');
        const modal = document.getElementById('modal');
        const levelBadge = document.getElementById('level-badge');
        const historyList = document.getElementById('history-list');

        // 初始化遊戲
        function initLevel(level) {
            const data = level === 1 ? level1Data : level2Data;
            const shuffledOptions = [...data].sort(() => Math.random() - 0.5);

            matches = [];
            selectedItem = null;
            isLevelComplete = false;

            // 更新 UI 標題
            const levelText = level === 1 ? "第一關：看貼圖" : "第二關：看語氣";
            const subText = level === 1 ? "選一個貼圖，找出它的心情！" : "注意文字和貼圖，感覺有什麼不同？";
            levelBadge.textContent = levelText;
            levelBadge.className = `px-4 py-1 rounded-full text-sm font-bold text-white shadow-sm ${level === 1 ? 'bg-blue-500' : 'bg-purple-600'}`;
            document.getElementById('sub-title').textContent = subText;

            speak(levelText + "。" + subText);

            // 生成左側按鈕
            leftCol.innerHTML = '';
            data.forEach(item => {
                const btn = document.createElement('button');
                btn.id = `left-${item.id}`;
                btn.className = `w-full flex items-center justify-center p-5 rounded-2xl border-4 transition-all duration-200 bg-white border-white shadow-sm hover:border-slate-200 relative`;
                btn.innerHTML = `<span class="${level === 1 ? 'text-6xl' : 'text-2xl font-bold text-slate-700'}">${item.display}</span>`;
                btn.onclick = () => handleLeftClick(item);
                leftCol.appendChild(btn);
            });

            // 生成右側按鈕
            rightCol.innerHTML = '';
            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.id = `right-${option.id}`;
                btn.className = `w-full p-5 text-xl font-bold rounded-2xl border-4 transition-all duration-200 bg-white border-white shadow-sm text-slate-700 active:scale-95 hover:border-blue-200`;
                btn.textContent = option.label;
                btn.onclick = () => handleRightClick(option);
                rightCol.appendChild(btn);
            });

            hideFeedback();
            updateHistoryDisplay();
        }

        function handleLeftClick(item) {
            if (matches.includes(item.id)) return;

            // 清除之前的選取樣式
            const allLeft = leftCol.querySelectorAll('button');
            allLeft.forEach(b => b.classList.remove('border-blue-400', 'bg-blue-50', 'scale-105', 'shadow-xl'));

            selectedItem = item;
            const btn = document.getElementById(`left-${item.id}`);
            btn.classList.add('border-blue-400', 'bg-blue-50', 'scale-105', 'shadow-xl');

            // 語音朗讀
            if (currentLevel === 2) {
                speak(item.display);
            } else {
                speak("這張貼圖是什麼心情呢？");
            }

            hideFeedback();
        }

        function handleRightClick(option) {
            if (!selectedItem) {
                const msg = '請先點選左邊的訊息喔！';
                showFeedback(msg, 'blue');
                speak(msg);
                return;
            }

            // 朗讀點選的答案
            speak(option.label);

            if (selectedItem.id === option.id) {
                // 配對正確
                matches.push(option.id);
                score += 10;
                updateScore();

                const leftBtn = document.getElementById(`left-${selectedItem.id}`);
                const rightBtn = document.getElementById(`right-${option.id}`);

                // 鎖定按鈕樣式
                [leftBtn, rightBtn].forEach(btn => {
                    btn.disabled = true;
                    btn.className = `w-full p-5 rounded-2xl border-4 bg-green-50 border-green-200 text-green-600 opacity-50 cursor-not-allowed flex items-center justify-center`;
                });
                leftBtn.innerHTML += `<span class="absolute top-2 right-2 text-green-500">✅</span>`;

                selectedItem = null;
                const msg = '太棒了！答對了';
                showFeedback(msg + ' ✨', 'green');
                setTimeout(() => speak(msg), 500);

                if (matches.length === (currentLevel === 1 ? level1Data.length : level2Data.length)) {
                    setTimeout(showModal, 1500);
                }
            } else {
                // 配對錯誤
                score = Math.max(0, score - 2); // 錯誤小扣分增加挑戰性
                updateScore();
                const msg = '再想一想，這句話感覺是什麼？';
                showFeedback(msg, 'orange');
                setTimeout(() => speak(msg), 500);
            }
        }

        function showFeedback(text, color) {
            feedback.classList.remove('invisible');
            feedbackContent.textContent = text;

            const colors = {
                green: 'bg-green-100 border-green-400 text-green-800',
                orange: 'bg-orange-100 border-orange-400 text-orange-800',
                blue: 'bg-blue-100 border-blue-400 text-blue-800'
            };
            feedbackContent.className = `px-6 py-3 rounded-2xl border-2 font-bold text-xl shadow-sm bounce ${colors[color]}`;
        }

        function hideFeedback() {
            feedback.classList.add('invisible');
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function showModal() {
            modal.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            const btn = document.getElementById('modal-btn');

            let title, text;

            if (currentLevel === 1) {
                title = "第一關完成！";
                text = "你已經看懂貼圖的心情了！";
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-text').textContent = text;
                btn.textContent = "進入第二關";
                btn.onclick = () => {
                    currentLevel = 2;
                    modal.classList.add('hidden');
                    initLevel(2);
                };
            } else {
                title = "恭喜大通關！";
                text = "你現在是溝通小達人囉！";
                document.getElementById('modal-icon').textContent = "🏆";
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-text').textContent = text;
                btn.textContent = "重新挑戰";
                btn.onclick = () => {
                    score = 0;
                    updateScore();
                    currentLevel = 1;
                    modal.classList.add('hidden');
                    initLevel(1);
                };
                saveScore(score);
            }
            speak(title + "。" + text + "。最終分數是" + score + "分");
        }

        // 成績儲存功能
        function saveScore(finalScore) {
            const history = JSON.parse(localStorage.getItem('emojiGameHistory') || '[]');
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            history.unshift({ date: dateStr, score: finalScore });
            localStorage.setItem('emojiGameHistory', JSON.stringify(history.slice(0, 5))); // 只存最近 5 筆
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            const history = JSON.parse(localStorage.getItem('emojiGameHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '暫無紀錄';
                return;
            }
            historyList.innerHTML = history.map(item =>
                `<div class="flex justify-between border-b border-slate-50 pb-1">
                    <span>${item.date}</span>
                    <span class="font-bold text-blue-500">${item.score} 分</span>
                </div>`
            ).join('');
        }

        function clearHistory() {
            if (confirm('確定要清除所有紀錄嗎？')) {
                localStorage.removeItem('emojiGameHistory');
                updateHistoryDisplay();
            }
        }

        // 初始啟動
        window.onload = () => {
            initLevel(1);
            updateHistoryDisplay();
        };
    </script>
</body>

</html>
