<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 一般動詞過去式規則變化挑戰</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <!-- 引入 Tailwind CSS 進行現代化響應式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts 中英文字型 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        /* 規則區塊的漸層標題設計 */
        .rule-header-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .rule-header-2 {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .rule-header-3 {
            background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
            color: white;
        }

        .rule-header-4 {
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
            color: white;
        }

        /* 字尾 Y 的呼吸燈高亮動畫 */
        .y-highlight {
            color: #ef4444;
            font-weight: 900;
            animation: pulseY 1.2s infinite alternate;
            display: inline-block;
        }

        @keyframes pulseY {
            0% {
                transform: scale(1);
                text-shadow: 0 0 2px rgba(239, 68, 68, 0.2);
            }

            100% {
                transform: scale(1.25);
                text-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            }
        }

        /* 答錯按鈕的搖晃效果 */
        .shake {
            animation: shakeBtn 0.4s ease-in-out;
        }

        @keyframes shakeBtn {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* 答對大卡片的放大反彈效果 */
        .row-success {
            animation: successRowPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes successRowPop {
            0% {
                transform: scale(1);
                background-color: transparent;
            }

            50% {
                transform: scale(1.02);
                background-color: rgba(240, 253, 244, 0.8);
            }

            100% {
                transform: scale(1);
                background-color: rgba(240, 253, 244, 1);
            }
        }

        /* 鎖定按鈕樣式 */
        .btn-locked {
            pointer-events: none;
            opacity: 0.6;
        }

        /* 滿分彈出視窗 */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body class="py-6 px-4 md:px-8">

    <!-- 主容器 -->
    <div class="max-w-4xl mx-auto">

        <!-- 頂部標題與遊戲資訊 -->
        <div class="text-center mb-6">
            <h1
                class="text-2xl md:text-4xl font-extrabold text-slate-800 drop-shadow-sm mb-2 tracking-wide flex items-center justify-center gap-2">
                🎮 Unit 5 過去式規則變化挑戰
            </h1>
            <p class="text-slate-600 text-sm md:text-base font-semibold">
                📖 搭配課本 p.100 • <span class="text-rose-600">免用鍵盤，點選正確答案即可！</span>
            </p>

            <!-- 即時進度條與分數 -->
            <div class="bg-white/80 p-4 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto mt-4">
                <div class="flex justify-between text-slate-700 font-bold mb-1 text-sm md:text-base">
                    <span class="flex items-center gap-1">🌟 挑戰進度</span>
                    <span id="progress-text" class="text-blue-600">0 / 10 題</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden border border-slate-300">
                    <div id="progress-bar"
                        class="bg-gradient-to-r from-blue-500 to-emerald-500 h-4 rounded-full transition-all duration-500 ease-out"
                        style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 遊戲主要看板 (動態填入四種規則) -->
        <div id="game-board" class="space-y-6">
            <!-- 規則一到四卡片會在這裡用 JS 動態生成 -->
        </div>
    </div>

    <!-- 滿分慶祝彈出視窗 -->
    <div id="success-modal">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm mx-4 transform transition-all scale-0 duration-300"
            id="modal-content">
            <div class="text-7xl mb-4 animate-bounce">🏆</div>
            <h2
                class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-blue-500 mb-2">
                好棒！挑戰成功</h2>
            <p class="text-slate-600 font-bold mb-6">你已經完美學會所有一般動詞的規則過去式變化囉！</p>
            <div class="flex flex-col gap-3">
                <button onclick="resetGame()"
                    class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-black py-4 px-8 rounded-2xl shadow-lg hover:shadow-xl transition-all transform active:scale-95 text-lg">
                    🔄 再玩一次
                </button>
                <button onclick="closeModalOnly()"
                    class="w-full bg-white hover:bg-slate-50 text-slate-600 border-2 border-slate-200 font-bold py-3 px-8 rounded-2xl transition-all transform active:scale-95 text-base">
                    檢視答案
                </button>
            </div>
        </div>
    </div>

    <script>
        // 音效系統：使用瀏覽器內建 Web Audio API 動態產生音效，不需外接檔案
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    // 答對音效：清脆雙和弦上揚音
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    // 答錯音效：沉悶下墜低音
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25); // A2
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'victory') {
                    // 勝利扇形大音效
                    const freqs = [523.25, 659.25, 783.99, 1046.5]; // C E G C
                    freqs.forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.4);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.4);
                    });
                }
            } catch (e) {
                console.log("Audio contexts pending user interaction.", e);
            }
        }

        // 互動遊戲資料庫：定義規則、單字、正確答案與誘答選項
        const gameData = [
            {
                id: "rule1",
                title: "規則一：字尾直接加 -ed",
                styleClass: "rule-header-1",
                words: [
                    { ch: "想要", base: "want", past: "wanted", isExample: true },
                    { ch: "走路", base: "walk", past: "walked", options: ["walked", "walkked", "walkd"] },
                    { ch: "拜訪", base: "visit", past: "visited", options: ["visited", "visitted", "visitied"] },
                    { ch: "清洗", base: "wash", past: "washed", options: ["washed", "washhed", "washd"] }
                ]
            },
            {
                id: "rule2",
                title: "規則二：字尾已有 e，直接加 -d",
                styleClass: "rule-header-2",
                words: [
                    { ch: "關閉", base: "close", past: "closed", isExample: true },
                    { ch: "喜歡", base: "like", past: "liked", options: ["liked", "likked", "likeed"] },
                    { ch: "居住", base: "live", past: "lived", options: ["lived", "livved", "liveed"] },
                    { ch: "喜愛", base: "love", past: "loved", options: ["loved", "lovved", "loveed"] }
                ]
            },
            {
                id: "rule3",
                title: "規則三：短母音 + 子音，重複字尾加 -ed",
                styleClass: "rule-header-3",
                instruction: "💡 什麼是短母音？就是發音短促的 a, e, i, o, u！遇到「短母音 + 子音」結尾，記得要重複最後一個字母喔！",
                words: [
                    { ch: "慢跑", base: "jog", past: "jogged", isExample: true },
                    { ch: "停止", base: "stop", past: "stopped", options: ["stopped", "stoped", "stopied"] },
                    { ch: "聊天", base: "chat", past: "chatted", options: ["chatted", "chated", "chatied"] },
                    { ch: "計畫", base: "plan", past: "planned", options: ["planned", "planed", "planied"] }
                ]
            },
            {
                id: "rule4",
                title: "規則四：子音 + y，去 y 加 -ied",
                styleClass: "rule-header-4",
                instruction: "⚠️ 觀察提示：遇到「子音 + y」，要把字尾 <span>y</span> 改成 <span>ied</span> 喔！",
                words: [
                    { ch: "研讀", base: "study", past: "studied", isExample: true, ruleY: true },
                    { ch: "擔心", base: "worry", past: "worried", options: ["worried", "worryed", "worriedd"], ruleY: true }
                ]
            }
        ];

        let totalQuestions = 0;
        let answeredQuestions = 0;

        // 渲染遊戲看板
        function renderGame() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            totalQuestions = 0;

            gameData.forEach(ruleGroup => {
                // 計算此區塊題目數量 (排除 example)
                const questionsInGroup = ruleGroup.words.filter(w => !w.isExample).length;
                totalQuestions += questionsInGroup;

                // 建立卡片外部容器
                const card = document.createElement('div');
                card.className = 'glass-card overflow-hidden';

                // 建立精美漸層 Header
                const header = document.createElement('div');
                header.className = `p-4 font-black text-base md:text-lg tracking-wider ${ruleGroup.styleClass} flex justify-between items-center`;
                header.innerHTML = `<span>💡 ${ruleGroup.title}</span>`;
                card.appendChild(header);

                // 若有特殊規則提示 (例如去 y + ied)
                if (ruleGroup.instruction) {
                    const inst = document.createElement('div');
                    inst.className = 'bg-orange-50 text-orange-800 p-3 text-xs md:text-sm font-bold text-center border-b border-orange-100';
                    inst.innerHTML = ruleGroup.instruction
                        .replace('<span>y</span>', '<span class="y-highlight px-1 text-base">y</span>')
                        .replace('<span>ied</span>', '<span class="text-blue-600 font-black text-base underline">ied</span>');
                    card.appendChild(inst);
                }

                // 建立表格結構
                const tableContainer = document.createElement('div');
                tableContainer.className = 'overflow-x-auto';

                const table = document.createElement('table');
                table.className = 'w-full text-center border-collapse min-w-[340px]';

                // 表頭
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr class="text-slate-500 bg-slate-50/50 text-xs md:text-sm border-b border-slate-200">
                        <th class="py-3 px-2 font-bold w-1/4">中文</th>
                        <th class="py-3 px-2 font-bold w-1/4">原形動詞</th>
                        <th class="py-3 px-2 font-bold w-2/4">選擇正確的過去式</th>
                    </tr>
                `;
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                ruleGroup.words.forEach((word, index) => {
                    const tr = document.createElement('tr');
                    const rowId = `${ruleGroup.id}-row-${index}`;
                    tr.id = rowId;
                    tr.className = 'border-b border-slate-100 last:border-0 hover:bg-slate-50/40 transition-colors';

                    // 原形處理：如果含有子音 + y，將 y 特效化
                    let displayBase = word.base;
                    if (word.ruleY) {
                        displayBase = word.base.slice(0, -1) + '<span class="y-highlight">y</span>';
                    }

                    let actionContent = '';
                    if (word.isExample) {
                        // 範例列顯示
                        if (word.ruleY) {
                            actionContent = `
                                <div class="flex items-center justify-center gap-2 py-2">
                                    <span class="text-slate-400 line-through text-sm">${word.base}</span>
                                    <span class="text-slate-400">➔</span>
                                    <span class="text-emerald-600 font-extrabold text-base md:text-lg">
                                        ${word.base.slice(0, -1)}<span class="text-blue-600 underline">ied</span>
                                    </span>
                                    <span class="bg-slate-200 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold ml-1">範例</span>
                                </div>
                            `;
                        } else {
                            actionContent = `
                                <div class="flex items-center justify-center gap-2 py-2">
                                    <span class="text-emerald-600 font-extrabold text-base md:text-lg">${word.past}</span>
                                    <span class="bg-slate-200 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold ml-1">範例</span>
                                </div>
                            `;
                        }
                    } else {
                        // 互動答題列：提供免輸入的按鈕組
                        // 洗牌一下選項，避免每次順序固定
                        const shuffledOptions = [...word.options].sort(() => Math.random() - 0.5);

                        let buttonsHtml = shuffledOptions.map(opt => {
                            // 若是選項本身含有 ied 且原字含 y，將 ied 部份特別渲染加深學習印象
                            let optDisplay = opt;
                            if (word.ruleY && opt.endsWith('ied')) {
                                optDisplay = `${opt.slice(0, -3)}<span class="text-blue-600 font-black">ied</span>`;
                            }
                            return `
                                <button onclick="checkSelection('${rowId}', '${opt}', '${word.past}', this)" 
                                    class="option-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 text-slate-700 border border-slate-300 font-bold py-2 px-3 md:px-5 rounded-xl text-sm md:text-base transition-all shadow-sm flex items-center justify-center gap-1">
                                    ${optDisplay}
                                </button>
                            `;
                        }).join('');

                        actionContent = `
                            <div class="flex flex-wrap gap-2 justify-center py-2 px-1">
                                ${buttonsHtml}
                            </div>
                        `;
                    }

                    tr.innerHTML = `
                        <td class="py-4 px-2 text-slate-600 font-bold text-sm md:text-base">${word.ch}</td>
                        <td class="py-4 px-2 font-mono text-base md:text-lg font-bold text-slate-800 tracking-wider">${displayBase}</td>
                        <td class="py-4 px-2">${actionContent}</td>
                    `;
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                tableContainer.appendChild(table);
                card.appendChild(tableContainer);
                board.appendChild(card);
            });

            updateProgress();
        }

        // 單選檢查邏輯
        function checkSelection(rowId, selectedValue, correctValue, buttonElement) {
            initAudio(); // 確保使用者互動時啟動音訊環境
            const row = document.getElementById(rowId);

            if (selectedValue === correctValue) {
                // 答對了！
                playSound('correct');

                // 標記該橫列成功樣式
                row.classList.add('row-success');

                // 鎖定該橫列內所有按鈕，並將正確的按鈕美化
                const buttons = row.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    btn.classList.add('btn-locked');
                    if (btn === buttonElement) {
                        btn.className = "option-btn bg-emerald-500 text-white font-extrabold border-2 border-emerald-600 py-2 px-3 md:px-5 rounded-xl text-sm md:text-base shadow-inner flex items-center justify-center gap-1 scale-105 transition-transform duration-300";
                        btn.innerHTML = `🎉 ${selectedValue} <svg class="w-4 h-4 fill-current inline" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
                    } else {
                        btn.className = "option-btn bg-slate-100 text-slate-400 border border-slate-200 py-2 px-3 md:px-5 rounded-xl text-xs md:text-sm line-through opacity-40";
                    }
                });

                answeredQuestions++;
                updateProgress();
            } else {
                // 答錯了！
                playSound('wrong');

                // 按鈕抖動並變紅
                buttonElement.classList.add('shake', 'bg-red-50', 'text-red-500', 'border-red-400');

                // 移除 hover 特效以防混淆
                buttonElement.classList.remove('hover:bg-indigo-50', 'active:bg-indigo-100');

                // 動畫結束後移除 shake 樣式，使學生能重複點選
                setTimeout(() => {
                    buttonElement.classList.remove('shake');
                }, 400);
            }
        }

        // 更新進度與滿分動畫
        function updateProgress() {
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');

            progressText.innerText = `${answeredQuestions} / ${totalQuestions} 題`;
            const percentage = (answeredQuestions / totalQuestions) * 100;
            progressBar.style.width = `${percentage}%`;

            if (answeredQuestions === totalQuestions && totalQuestions > 0) {
                setTimeout(showSuccessModal, 1200);
            }
        }

        // 彈出滿分視窗
        function showSuccessModal() {
            playSound('victory');
            const modal = document.getElementById('success-modal');
            const content = document.getElementById('modal-content');
            modal.style.display = 'flex';

            setTimeout(() => {
                content.classList.remove('scale-0');
                content.classList.add('scale-100');
            }, 50);

            createConfetti();
        }

        // 重設遊戲
        function resetGame() {
            const modal = document.getElementById('success-modal');
            const content = document.getElementById('modal-content');

            content.classList.remove('scale-100');
            content.classList.add('scale-0');

            setTimeout(() => {
                modal.style.display = 'none';
                answeredQuestions = 0;
                renderGame();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        // 關閉視窗但不重設遊戲 (檢視答案)
        function closeModalOnly() {
            const modal = document.getElementById('success-modal');
            const content = document.getElementById('modal-content');

            content.classList.remove('scale-100');
            content.classList.add('scale-0');

            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // 純 JS 微型五彩碎紙屑特效
        function createConfetti() {
            const colors = ['#38bdf8', '#34d399', '#fb7185', '#fbbf24', '#818cf8', '#a78bfa'];
            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.zIndex = '120';
                confetti.style.pointerEvents = 'none';

                document.body.appendChild(confetti);

                const duration = Math.random() * 2.5 + 2;
                const endY = window.innerHeight;

                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random() * 300 - 150}px, ${endY}px, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(.1, .8, .3, 1)',
                    fill: 'forwards'
                });

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }

        // 網頁載入後立即初始化
        window.onload = function () {
            renderGame();
        };
    </script>
</body>

</html>
