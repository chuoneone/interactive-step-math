<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G7S2 UNIT 1 習作</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }

        .word {
            position: relative;
            cursor: pointer;
            border-bottom: 1px dotted #a8a29e;
            transition: color .2s;
        }

        .word:hover {
            color: #d97706;
        }

        .word .tooltip {
            visibility: hidden;
            width: max-content;
            max-width: 140px;
            background: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 4px 8px;
            position: absolute;
            z-index: 20;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            font-size: .75rem;
        }

        .word:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .sb-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: .875rem;
            color: #78716c;
            cursor: pointer;
            transition: all .2s;
            background: transparent;
            border: 2px solid transparent;
            text-align: left;
        }

        .sb-btn:hover {
            background: #fef3c7;
            color: #92400e;
        }

        .sb-btn.active {
            background: #fde68a;
            color: #92400e;
            border-color: #fcd34d;
        }

        .badge {
            font-size: .65rem;
            border-radius: 999px;
            padding: 2px 7px;
            font-weight: 700;
        }

        .badge-ok {
            background: #dcfce7;
            color: #16a34a;
        }

        .badge-fail {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-none {
            background: #f5f5f4;
            color: #a8a29e;
        }

        /* Matching game */
        .match-card {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d6d3d1;
            border-radius: 12px;
            cursor: pointer;
            transition: all .2s;
            user-select: none;
            min-height: 70px;
            padding: 10px;
            font-weight: 700;
            font-size: 1rem;
        }

        .match-card:hover {
            border-color: #fbbf24;
            background: #fefce8;
        }

        .match-card.selected {
            border-color: #f59e0b;
            background: #fef3c7;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, .3);
        }

        .match-card.matched {
            border-color: #22c55e;
            background: #dcfce7;
            pointer-events: none;
            opacity: .7;
        }

        .match-card.wrong {
            border-color: #ef4444;
            background: #fee2e2;
            animation: shake .4s;
        }

        .match-emoji {
            font-size: 2.5rem;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        /* Reorder game */
        .reorder-word {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: .95rem;
            transition: all .15s;
            border: 2px solid #d6d3d1;
            background: #fff;
            color: #44403c;
            user-select: none;
        }

        .reorder-word:hover {
            border-color: #fbbf24;
            background: #fefce8;
        }

        .reorder-word.used {
            opacity: .3;
            pointer-events: none;
            border-style: dashed;
        }

        .answer-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: .95rem;
            transition: all .15s;
            border: 2px solid #f59e0b;
            background: #fef3c7;
            color: #92400e;
        }

        .answer-slot:hover {
            background: #fde68a;
        }

        .answer-zone {
            min-height: 52px;
            border: 2px dashed #d6d3d1;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #fafaf9;
        }

        .answer-zone.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }

        .answer-zone.wrong {
            border-color: #ef4444;
            background: #fee2e2;
            animation: shake .4s;
        }
    </style>
</head>

<body class="bg-amber-50 min-h-screen">
    <div class="flex min-h-screen">

        <!-- ===== Sidebar ===== -->
        <aside class="w-52 bg-white shadow-lg flex flex-col p-4 fixed h-full overflow-y-auto z-10">
            <div class="mb-5">
                <p class="text-xs font-bold text-amber-500 tracking-widest uppercase">G7S2 · Unit 1</p>
                <h1 class="text-base font-bold text-stone-800 leading-snug mt-1">英語習作<br><span
                        class="text-amber-600">What Do You Do<br>in Your Free Time?</span></h1>
            </div>
            <p class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">選擇大題</p>
            <div id="sidebar-nav" class="flex flex-col gap-1"></div>

            <!-- Score summary -->
            <div class="mt-auto border-t border-stone-200 pt-4">
                <p class="text-xs font-bold text-stone-400 mb-2">📊 歷史成績</p>
                <div id="score-summary" class="flex flex-col gap-2 text-xs"></div>
                <button id="clear-btn" class="mt-3 text-xs text-red-400 hover:text-red-600 transition-colors">🗑
                    清除所有成績</button>
            </div>
        </aside>

        <!-- ===== Main ===== -->
        <main class="ml-52 flex-1 p-4 sm:p-8 flex justify-center items-start">
            <div class="w-full max-w-2xl">
                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg">

                    <!-- Header row -->
                    <div class="flex items-start justify-between mb-1">
                        <div>
                            <h2 id="sec-title" class="text-xl font-bold text-amber-700"></h2>
                            <p id="sec-sub" class="text-xs text-stone-400 mt-0.5"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-stone-400">本次得分</p>
                            <p class="text-3xl font-bold text-amber-600">
                                <span id="live-score">0</span><span class="text-stone-300 text-xl"> / </span><span
                                    id="live-total" class="text-stone-500 text-xl">0</span>
                            </p>
                        </div>
                    </div>

                    <!-- Progress -->
                    <div class="flex items-center gap-3 my-4">
                        <div class="flex-1 bg-stone-200 rounded-full h-2">
                            <div id="prog-bar" class="bg-amber-500 h-2 rounded-full transition-all duration-500"
                                style="width:0%"></div>
                        </div>
                        <span id="prog-text" class="text-xs text-stone-400 whitespace-nowrap">0 / 0</span>
                    </div>

                    <div id="q-wrap"></div>
                    <div id="controls" class="mt-8 text-center"></div>
                    <div id="score-disp" class="mt-6 text-center hidden"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Alert modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-30">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
            <p id="alert-msg" class="text-lg text-gray-800 mb-4"></p>
            <button id="alert-close"
                class="bg-amber-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-amber-600">知道了</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STORE = 'g7s2u1_scores';

            const tr = {
                "what's": "什麼是", "what": "什麼", "the": "這個", "it's": "它是", "time": "時間", "is": "是",
                "this": "這個", "book": "書", "has": "有", "pages": "頁數", "there": "那裡", "are": "是",
                "five": "五", "people": "人們", "on": "在", "team": "隊伍", "mr": "先生", "depp": "德普",
                "billy": "比利", "don't": "不要", "talk": "說話", "with": "和", "your": "你的", "mouth": "嘴巴",
                "full": "滿的", "please": "請", "sorry": "抱歉", "dad": "爸爸", "max": "麥克斯",
                "height": "身高", "eva": "伊娃", "i'm": "我是", "cm": "公分", "tall": "高的",
                "elephants": "大象們", "very": "非常", "different": "不同的", "from": "從", "other": "其他的",
                "animals": "動物們", "they": "他們", "have": "有", "large": "大的", "ears": "耳朵",
                "and": "和", "a": "一個", "really": "真的", "long": "長的", "nose": "鼻子",
                "nora": "諾拉", "oliver": "奥利弗", "i": "我", "play": "玩/打", "baseball": "棒球",
                "every": "每個", "saturday": "星期六", "finn": "芬恩", "too": "也", "can": "能夠",
                "join": "加入", "you": "你", "guys": "各位", "sure": "當然",
                "cake": "蛋糕", "guitar": "吉他", "kite": "風箏", "ball": "球", "cup": "杯子",
                "thick": "厚的", "thin": "薄的",
                "doesn't": "不(三單)", "do": "做", "does": "做(三單)", "make": "製作", "makes": "製作(三單)",
                "can't": "不能", "study": "學習", "studies": "學習(三單)", "sports": "運動",
                "brother": "哥哥/弟弟", "sister": "姊妹", "ken": "肯", "ann": "安", "leah": "莉雅", "jack": "傑克",
                "english": "英語", "weekend": "週末", "yes": "是的", "mornings": "早晨",
                "charlotte": "夏洛特", "friend": "朋友", "she": "她", "poland": "波蘭", "small": "小的",
                "eyes": "眼睛", "short": "短的", "hair": "頭髮", "cute": "可愛的", "girl": "女孩",
                "music": "音樂", "practices": "練習(三單)", "hour": "小時", "class": "課堂",
                "tuesday": "星期二", "thursday": "星期四", "not": "不", "like": "喜歡", "only": "只",
                "favorite": "最喜愛的", "basketball": "籃球", "after": "之後", "school": "學校",
                "much": "很多", "common": "共同的", "but": "但是", "we": "我們", "good": "好的",
                "friends": "朋友們", "go": "去", "goes": "去(三單)", "come": "來", "comes": "來(三單)",
                "likes": "喜歡(三單)", "practice": "練習", "in": "在...裡面", "my": "我的", "for": "為了",
                "or": "或者", "to": "去", "it": "它", "no": "不是", "at": "在",
                "hour": "小時", "have": "有", "has": "有(三單)",
                "nigel": "奈傑爾", "lips": "嘴唇", "daughter": "女兒",
                "ted": "泰德", "amy": "艾米", "hundred": "百", "fifty": "五十", "four": "四", "centimeters": "公分",
                "sam": "山姆", "meg": "梅格", "paints": "畫畫", "swims": "游泳",
                "how": "如何", "old": "年老的", "strong": "強壯的", "weekends": "週末",
                "arms": "手臂"
            };

            // ---- Quiz Data ----
            const DATA = {
                A: [
                    { em: "🎂", word: "cake" },
                    { em: "🎸", word: "guitar" },
                    { em: "🪁", word: "kite" }
                ],
                B: [
                    {
                        q: "This book is ______; it has 980 pages.",
                        opts: ["thin", "thick", "those", "through"], ans: "B", hint: "這本書有 980 頁，代表它很「厚」= thick。"
                    },
                    {
                        q: "There are five people on this ______.",
                        opts: ["time", "team", "term", "tram"], ans: "B", hint: "這個______有五個人，「隊伍」= team。"
                    },
                    {
                        q: "Mr. Depp: Billy, don't talk with your ______ full, please.  Billy: Sorry, Dad.",
                        opts: ["math", "month", "mouth", "match"], ans: "C", hint: "嘴巴含食物說話，「嘴巴」= mouth。"
                    },
                    {
                        q: "Max: What's your ______?  Eva: I'm 175 cm tall.",
                        opts: ["heat", "heart", "height", "habit"], ans: "C", hint: "Eva 回答身高，Max 問的是「身高」= height。"
                    },
                    {
                        q: "Elephants are very ______ from other animals; they have ______ ears and a really long nose.",
                        opts: ["different / large", "distant / little", "difficult / long", "direct / loud"], ans: "A",
                        hint: "大象「不同於」其他動物 (different)，有「大」耳朵 (large)。"
                    },
                    {
                        q: "Nora: Oliver and I play baseball every Saturday.  Finn: I play baseball, too. Can I ______ you guys?  Nora: Sure.",
                        opts: ["jump", "join", "just", "jog"], ans: "B", hint: "Finn 想「加入」他們，「加入」= join。"
                    }
                ],
                C: [
                    {
                        q: "I ______ play sports, but my brother ______.",
                        ctx: "① I ( don't / doesn't ) play sports, but my brother ( do / does ).",
                        opts: ["don't, do", "doesn't, do", "don't, does", "doesn't, does"], ans: "C",
                        hint: "主詞「I」用 don't；「my brother」是三單，用 does。"
                    },
                    {
                        q: "Ken: Can your sister ______ a cake?  Ann: No, she ______.",
                        ctx: "② Ken: Can your sister ( make / makes ) a cake?   Ann: No, she ( doesn't / can't ).",
                        opts: ["makes, doesn't", "make, doesn't", "makes, can't", "make, can't"], ans: "D",
                        hint: "Can 後面接原形動詞 make；Ann 說能力上「不能」，用 can't。"
                    },
                    {
                        q: "Leah: ______ you study English every weekend?  Jack: Yes. I ______ English on Saturday mornings.",
                        ctx: "③ Leah: ( Do / Does ) you study English every weekend?\n   Jack: Yes. I ( study / studies ) English on Saturday mornings.",
                        opts: ["Does, studies", "Do, studies", "Does, study", "Do, study"], ans: "D",
                        hint: "問句主詞「you」用 Do；Jack 的「I」是一人稱，動詞用原形 study。"
                    }
                ],
                D: [
                    {
                        q: "Charlotte is my good friend.  She ① ______ from Poland.",
                        opts: ["come", "comes", "go", "goes"], ans: "B",
                        hint: "主詞「She」三單，come → comes。"
                    },
                    {
                        q: "She ② ______ small eyes and short hair.  She is a cute girl.",
                        opts: ["have", "has", "is", "are"], ans: "B",
                        hint: "主詞「She」三單，have 的三單不規則變化是 has。"
                    },
                    {
                        q: "Charlotte ③ ______ music and English.",
                        opts: ["like", "likes", "is like", "liking"], ans: "B",
                        hint: "主詞「Charlotte」三單，like → likes。"
                    },
                    {
                        q: "She ④ ______ the guitar for an hour every day.",
                        opts: ["practice", "go", "comes", "practices"], ans: "D",
                        hint: "主詞「She」三單，practice → practices。"
                    },
                    {
                        q: "She ⑤ ______ to English class every Tuesday and Thursday.",
                        opts: ["comes", "goes", "practices", "likes"], ans: "B",
                        hint: "主詞「She」三單，go 的三單不規則變化是 goes。"
                    },
                    {
                        q: "I'm not like her.  I only ⑥ ______ sports.",
                        opts: ["likes", "goes", "like", "comes"], ans: "C",
                        hint: "主詞「I」一人稱，動詞用原形 like。"
                    },
                    {
                        q: "My favorite sport is basketball.  I ⑦ ______ basketball after school.",
                        opts: ["practices", "goes", "likes", "practice"], ans: "D",
                        hint: "主詞「I」一人稱，動詞用原形 practice。"
                    }
                ],
                E: [
                    {
                        q: "Nigel has thin lips, but his daughter ______.",
                        opts: ["do", "don't", "does", "doesn't"], ans: "D",
                        hint: "daughter 是三單，否定用 doesn't。句意：Nigel 嘴唇薄，但他女兒不是。"
                    },
                    {
                        q: "Ted: ______ are you, Amy?  Amy: One hundred and fifty-four centimeters.",
                        opts: ["How old", "How tall", "How long", "How strong"], ans: "B",
                        hint: "Amy 回答 154 公分，是在回答身高，所以問句用「How tall」。"
                    },
                    {
                        q: "Sam: ______  Meg: She paints or swims.",
                        opts: ["What can she do?", "Does she play sports?", "Does she have strong arms?", "What does she do on weekends?"], ans: "D",
                        hint: "Meg 回答她畫畫或游泳，描述的是平時週末做的事，所以問句是「What does she do on weekends?」。"
                    }
                ],
                F: [
                    {
                        prompt: "A: What can the girl do? 🎹👧",
                        answer: ["She", "can", "play", "the", "piano."],
                        hint: "女孩在彈鋼琴 → She can play the piano."
                    },
                    {
                        prompt: "A: What does the boy do in his free time? 🪁👦",
                        answer: ["He", "flies", "a", "kite."],
                        hint: "男孩在放風箏 → He flies a kite."
                    },
                    {
                        prompt: "A: How tall is the baseball player? ⚾🧑 156cm",
                        answer: ["He", "is", "156", "centimeters", "tall."],
                        hint: "棒球選手 156 公分 → He is 156 centimeters tall."
                    }
                ]
            };

            const SECINFO = {
                A: { title: "大題 A", sub: "Look and Write｜看圖配對單字" },
                B: { title: "大題 B", sub: "Read and Write｜依文意選出正確的單字" },
                C: { title: "大題 C", sub: "Circle the Correct Answer｜選出正確的動詞形式" },
                D: { title: "大題 D", sub: "Fill in the Blanks｜填入正確的動詞（須做適當的變化）" },
                E: { title: "大題 E", sub: "Choose｜選出正確的答案" },
                F: { title: "大題 F", sub: "Look and Answer｜看圖重組句子" }
            };

            const WORDBANK = ["come", "go", "have", "practice", "like"];

            let curSec = 'A', curIdx = 0, score = 0;

            // --- DOM ---
            const qWrap = document.getElementById('q-wrap');
            const controls = document.getElementById('controls');
            const scoredisp = document.getElementById('score-disp');
            const progBar = document.getElementById('prog-bar');
            const progText = document.getElementById('prog-text');
            const secTitle = document.getElementById('sec-title');
            const secSub = document.getElementById('sec-sub');
            const sidebarNav = document.getElementById('sidebar-nav');
            const scoreSummary = document.getElementById('score-summary');
            const liveScore = document.getElementById('live-score');
            const liveTotal = document.getElementById('live-total');
            const alertModal = document.getElementById('alert-modal');
            const alertMsg = document.getElementById('alert-msg');
            const alertClose = document.getElementById('alert-close');
            const clearBtn = document.getElementById('clear-btn');

            // --- Storage ---
            function loadScores() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }
            function saveScore(sec, sc, tot) {
                const d = loadScores();
                d[sec] = { score: sc, total: tot, pct: Math.round(sc / tot * 100), at: (new Date()).toLocaleString('zh-TW') };
                localStorage.setItem(STORE, JSON.stringify(d));
            }

            // --- Helpers ---
            function mkInteractive(text) {
                return text.split(/([a-zA-Z']+)/).map(p => {
                    const k = p.toLowerCase().replace(/'/g, "'");
                    return tr[k] ? `<span class="word">${p}<span class="tooltip">${tr[k]}</span></span>` : p;
                }).join('');
            }

            function speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text.replace(/_{2,}/g, '').replace(/[①②③④⑤⑥⑦]/g, '').trim());
                u.lang = 'en-US'; u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }

            function mkSpeaker(txt) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("class", "h-5 w-5 text-amber-500 hover:text-amber-700 cursor-pointer flex-shrink-0");
                svg.setAttribute("viewBox", "0 0 20 20"); svg.setAttribute("fill", "currentColor");
                svg.setAttribute("title", "朗讀");
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("fill-rule", "evenodd");
                p.setAttribute("d", "M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.016 5.39a.75.75 0 01.016 1.046l-1.04 1.04a.75.75 0 11-1.06-1.06l1.04-1.04a.75.75 0 011.044-.026zM14.07 3.33a.75.75 0 01.016 1.046l-1.04 1.04a.75.75 0 01-1.06-1.06l1.04-1.04a.75.75 0 011.044-.026z");
                p.setAttribute("clip-rule", "evenodd");
                svg.appendChild(p);
                svg.onclick = e => { e.stopPropagation(); speak(txt); };
                return svg;
            }

            function updateLive() {
                liveScore.textContent = score;
                liveTotal.textContent = DATA[curSec].length;
            }

            // --- Render Sidebar ---
            function renderSidebar() {
                const scores = loadScores();
                sidebarNav.innerHTML = '';
                Object.keys(DATA).forEach(sec => {
                    const btn = document.createElement('button');
                    btn.className = 'sb-btn' + (sec === curSec ? ' active' : '');
                    btn.dataset.sec = sec;
                    const sc = scores[sec];
                    const badge = sc
                        ? `<span class="badge ${sc.pct >= 60 ? 'badge-ok' : 'badge-fail'}">${sc.pct}%</span>`
                        : `<span class="badge badge-none">—</span>`;
                    btn.innerHTML = `<span>${SECINFO[sec].title}</span>${badge}`;
                    btn.onclick = () => switchSection(sec);
                    sidebarNav.appendChild(btn);
                });

                // Score summary
                scoreSummary.innerHTML = '';
                const scores2 = loadScores();
                Object.keys(DATA).forEach(sec => {
                    const sc = scores2[sec];
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between';
                    row.innerHTML = sc
                        ? `<span class="text-stone-500">${SECINFO[sec].title}</span><span class="badge ${sc.pct >= 60 ? 'badge-ok' : 'badge-fail'}">${sc.score}/${sc.total} (${sc.pct}%)</span>`
                        : `<span class="text-stone-400">${SECINFO[sec].title}</span><span class="badge badge-none">未作答</span>`;
                    scoreSummary.appendChild(row);
                });
            }

            // --- Display Matching Game (Section A) ---
            function displayMatching() {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO.A.title;
                secSub.textContent = SECINFO.A.sub;
                progBar.style.width = '0%';
                progText.textContent = `0 / ${DATA.A.length}`;
                updateLive();

                const pairs = DATA.A;
                let selected = null; // { type:'emoji'|'word', idx, el }
                let matched = 0;

                const block = document.createElement('div');
                block.id = 'qblock';

                const title = document.createElement('p');
                title.className = 'text-base text-stone-700 mb-4 font-bold text-center';
                title.textContent = '點選圖片，再點選對應的英文單字來配對';
                block.appendChild(title);

                // Build two columns: emojis left, words right (shuffled)
                const wordOrder = [...pairs.map((p, i) => i)].sort(() => Math.random() - 0.5);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 gap-4';

                const leftCol = document.createElement('div');
                leftCol.className = 'flex flex-col gap-3';
                const rightCol = document.createElement('div');
                rightCol.className = 'flex flex-col gap-3';

                // Emoji cards
                pairs.forEach((p, i) => {
                    const card = document.createElement('div');
                    card.className = 'match-card match-emoji';
                    card.textContent = p.em;
                    card.dataset.type = 'emoji';
                    card.dataset.idx = i;
                    card.onclick = () => handleMatchClick('emoji', i, card);
                    leftCol.appendChild(card);
                });

                // Word cards (shuffled)
                wordOrder.forEach(i => {
                    const p = pairs[i];
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.textContent = p.word;
                    card.dataset.type = 'word';
                    card.dataset.idx = i;
                    card.onclick = () => { speak(p.word); handleMatchClick('word', i, card); };
                    rightCol.appendChild(card);
                });

                grid.appendChild(leftCol); grid.appendChild(rightCol);
                block.appendChild(grid);
                qWrap.appendChild(block);

                function handleMatchClick(type, idx, el) {
                    if (el.classList.contains('matched')) return;

                    // If nothing selected, select this
                    if (!selected) {
                        selected = { type, idx, el };
                        el.classList.add('selected');
                        return;
                    }

                    // If same type, switch selection
                    if (selected.type === type) {
                        selected.el.classList.remove('selected');
                        selected = { type, idx, el };
                        el.classList.add('selected');
                        return;
                    }

                    // Different types: check match
                    if (selected.idx === idx) {
                        // Correct match!
                        score++;
                        matched++;
                        selected.el.classList.remove('selected');
                        selected.el.classList.add('matched');
                        el.classList.add('matched');
                        selected = null;
                        updateLive();
                        progBar.style.width = (matched / pairs.length * 100) + '%';
                        progText.textContent = `${matched} / ${pairs.length}`;

                        if (matched === pairs.length) {
                            // All matched!
                            setTimeout(() => {
                                saveScore('A', score, pairs.length);
                                progBar.style.width = '100%';
                                qWrap.innerHTML = '';
                                const pct = Math.round(score / pairs.length * 100);
                                const em2 = pct === 100 ? '🎉' : '👍';
                                scoredisp.innerHTML = `
                                    <div class="py-4">
                                        <p class="text-5xl mb-3">${em2}</p>
                                        <p class="text-stone-400 mb-1">配對完成！</p>
                                        <p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${pairs.length}</span></p>
                                        <p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p>
                                        <p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p>
                                    </div>`;
                                scoredisp.classList.remove('hidden');
                                const rb = document.createElement('button');
                                rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                                rb.textContent = '重新練習';
                                rb.onclick = restart;
                                scoredisp.appendChild(rb);
                                renderSidebar();
                            }, 400);
                        }
                    } else {
                        // Wrong match
                        selected.el.classList.remove('selected');
                        el.classList.add('wrong');
                        selected.el.classList.add('wrong');
                        const prevEl = selected.el;
                        selected = null;
                        setTimeout(() => { el.classList.remove('wrong'); prevEl.classList.remove('wrong'); }, 500);
                    }
                }
            }

            // --- Display Reorder Game (Section F) ---
            function displayReorder(idx) {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA.F;
                secTitle.textContent = SECINFO.F.title;
                secSub.textContent = SECINFO.F.sub;
                progBar.style.width = (idx / list.length * 100) + '%';
                progText.textContent = `${idx} / ${list.length}`;
                updateLive();

                const q = list[idx];
                const block = document.createElement('div');
                block.id = 'qblock';

                // Prompt (question)
                const promptP = document.createElement('p');
                promptP.className = 'text-base text-stone-700 mb-2 flex items-start gap-2';
                promptP.appendChild(mkSpeaker(q.prompt));
                const pSpan = document.createElement('span');
                pSpan.innerHTML = `<strong>${idx + 1}.</strong> ${mkInteractive(q.prompt)}`;
                promptP.appendChild(pSpan);
                block.appendChild(promptP);

                const instrP = document.createElement('p');
                instrP.className = 'text-xs text-stone-400 mb-3';
                instrP.textContent = '👆 點擊下方單字，按正確順序排列成句子（點擊已放入的單字可移除）';
                block.appendChild(instrP);

                // Answer zone
                const ansZone = document.createElement('div');
                ansZone.className = 'answer-zone mb-4';
                ansZone.id = 'ans-zone';
                const placeholder = document.createElement('span');
                placeholder.className = 'text-stone-300 text-sm';
                placeholder.id = 'ans-placeholder';
                placeholder.textContent = '點擊單字放到這裡...';
                ansZone.appendChild(placeholder);
                block.appendChild(ansZone);

                // Shuffled word pool
                const shuffled = [...q.answer].sort(() => Math.random() - 0.5);
                const poolDiv = document.createElement('div');
                poolDiv.className = 'flex flex-wrap gap-2 justify-center mb-4';
                poolDiv.id = 'word-pool';

                const userAnswer = []; // track order

                shuffled.forEach((word, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'reorder-word';
                    btn.textContent = word;
                    btn.dataset.poolIdx = i;
                    btn.onclick = () => {
                        if (btn.classList.contains('used')) return;
                        speak(word);
                        btn.classList.add('used');
                        userAnswer.push({ word, poolIdx: i });
                        renderAnswerZone();
                    };
                    poolDiv.appendChild(btn);
                });
                block.appendChild(poolDiv);

                // Hint
                const hintWrap = document.createElement('div');
                hintWrap.className = 'mt-2';
                const hintBtn = document.createElement('button');
                hintBtn.className = 'text-sm text-amber-600 hover:text-amber-800';
                hintBtn.textContent = '💡 提示';
                const hintTxt = document.createElement('p');
                hintTxt.className = 'hidden mt-2 text-sm text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                hintTxt.textContent = q.hint;
                hintBtn.onclick = () => hintTxt.classList.toggle('hidden');
                hintWrap.appendChild(hintBtn);
                hintWrap.appendChild(hintTxt);
                block.appendChild(hintWrap);

                qWrap.appendChild(block);

                function renderAnswerZone() {
                    ansZone.innerHTML = '';
                    if (userAnswer.length === 0) {
                        const ph = document.createElement('span');
                        ph.className = 'text-stone-300 text-sm';
                        ph.textContent = '點擊單字放到這裡...';
                        ansZone.appendChild(ph);
                        return;
                    }
                    userAnswer.forEach((item, ai) => {
                        const slot = document.createElement('button');
                        slot.className = 'answer-slot';
                        slot.textContent = item.word;
                        slot.onclick = () => {
                            // Remove from answer, restore to pool
                            userAnswer.splice(ai, 1);
                            const poolBtns = poolDiv.querySelectorAll('.reorder-word');
                            poolBtns[item.poolIdx].classList.remove('used');
                            renderAnswerZone();
                        };
                        ansZone.appendChild(slot);
                    });
                }

                // Check button
                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (userAnswer.length !== q.answer.length) {
                        alertMsg.textContent = '請將所有單字排列完成！';
                        alertModal.classList.remove('hidden');
                        return;
                    }
                    const isCorrect = userAnswer.every((item, i) => item.word === q.answer[i]);
                    // Disable pool
                    poolDiv.querySelectorAll('.reorder-word').forEach(b => { b.onclick = null; b.style.cursor = 'default'; });
                    // Disable answer zone clicks
                    ansZone.querySelectorAll('.answer-slot').forEach(s => { s.onclick = null; s.style.cursor = 'default'; });

                    if (isCorrect) {
                        score++;
                        ansZone.classList.add('correct');
                        ansZone.innerHTML += '<span class="text-green-600 font-bold text-lg ml-2">✔️</span>';
                    } else {
                        ansZone.classList.add('wrong');
                        // Show correct answer
                        const corrP = document.createElement('p');
                        corrP.className = 'mt-2 text-sm text-green-700 bg-green-50 border border-green-200 p-2 rounded-md';
                        corrP.innerHTML = `<strong>正確答案：</strong>${q.answer.join(' ')}`;
                        block.appendChild(corrP);
                    }
                    updateLive();

                    controls.innerHTML = '';
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                    if (curIdx < list.length - 1) {
                        nextBtn.textContent = '下一題 →';
                        nextBtn.onclick = () => { curIdx++; displayReorder(curIdx); };
                    } else {
                        nextBtn.textContent = '完成測驗 🎉';
                        nextBtn.onclick = showScore;
                    }
                    controls.appendChild(nextBtn);
                };
                controls.appendChild(checkBtn);
            }

            // --- Display Question (B-E) ---
            function displayQ(idx) {
                // Section A uses matching game
                if (curSec === 'A') { displayMatching(); return; }
                // Section F uses reorder game
                if (curSec === 'F') { displayReorder(idx); return; }

                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA[curSec];
                secTitle.textContent = SECINFO[curSec].title;
                secSub.textContent = SECINFO[curSec].sub;
                progBar.style.width = (idx / list.length * 100) + '%';
                progText.textContent = `${idx} / ${list.length}`;
                updateLive();

                const q = list[idx];
                const block = document.createElement('div');
                block.id = 'qblock';

                // D: word bank
                if (curSec === 'D') {
                    const wb = document.createElement('div');
                    wb.className = 'bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4';
                    wb.innerHTML = '<p class="text-xs font-bold text-blue-500 text-center mb-2">📖 Word Bank</p>';
                    const tags = document.createElement('div');
                    tags.className = 'flex flex-wrap gap-2 justify-center';
                    WORDBANK.forEach(w => {
                        const t = document.createElement('span');
                        t.className = 'bg-amber-100 text-amber-800 font-semibold px-3 py-1 rounded-full text-sm';
                        t.textContent = w;
                        tags.appendChild(t);
                    });
                    wb.appendChild(tags);
                    block.appendChild(wb);
                }

                // C: context box
                if (curSec === 'C' && q.ctx) {
                    const ctx = document.createElement('div');
                    ctx.className = 'bg-stone-50 border border-stone-200 rounded-lg p-3 mb-4 text-sm text-stone-600 whitespace-pre-line leading-relaxed';
                    ctx.textContent = q.ctx;
                    block.appendChild(ctx);
                }



                // Question text
                const qp = document.createElement('p');
                qp.className = 'text-base text-stone-700 mb-4 flex items-start gap-2';
                const span = document.createElement('span');
                span.innerHTML = `<strong>${idx + 1}.</strong> ${mkInteractive(q.q)}`;
                qp.appendChild(mkSpeaker(q.q));
                qp.appendChild(span);

                // Options
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';
                q.opts.forEach((opt, i) => {
                    const ch = String.fromCharCode(65 + i);
                    const row = document.createElement('div');
                    row.className = 'flex items-center p-3 border border-stone-300 rounded-lg cursor-pointer hover:bg-amber-50 transition-all';
                    const radio = document.createElement('input');
                    radio.type = 'radio'; radio.id = `q${idx}-${ch}`; radio.name = `q${idx}`; radio.value = ch;
                    radio.className = 'h-4 w-4 text-amber-600 border-gray-300 flex-shrink-0';
                    const label = document.createElement('label');
                    label.htmlFor = `q${idx}-${ch}`;
                    label.className = 'ml-3 text-sm text-stone-800 flex-1 cursor-pointer';
                    label.innerHTML = `(${ch}) ${mkInteractive(opt)}`;
                    row.onclick = () => { radio.checked = true; speak(opt); };
                    row.appendChild(radio); row.appendChild(label);
                    grid.appendChild(row);
                });

                // Hint
                const hintWrap = document.createElement('div');
                hintWrap.className = 'mt-4';
                const hintBtn = document.createElement('button');
                hintBtn.className = 'text-sm text-amber-600 hover:text-amber-800'; hintBtn.textContent = '💡 提示';
                const hintTxt = document.createElement('p');
                hintTxt.className = 'hidden mt-2 text-sm text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                hintTxt.textContent = q.hint;
                hintBtn.onclick = () => hintTxt.classList.toggle('hidden');
                hintWrap.appendChild(hintBtn); hintWrap.appendChild(hintTxt);

                block.appendChild(qp); block.appendChild(grid); block.appendChild(hintWrap);
                qWrap.appendChild(block);

                const submitBtn = document.createElement('button');
                submitBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                submitBtn.textContent = '檢查答案';
                submitBtn.onclick = () => checkAns(idx);
                controls.appendChild(submitBtn);
            }

            // --- Check Answer ---
            function checkAns(idx) {
                const sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if (!sel) { alertMsg.textContent = '請先選擇一個答案！'; alertModal.classList.remove('hidden'); return; }
                const q = DATA[curSec][idx];
                const block = document.getElementById('qblock');
                block.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                block.querySelectorAll('div.flex.items-center').forEach(d => { d.onclick = null; d.classList.remove('hover:bg-amber-50'); d.style.cursor = 'default'; });
                const corrLabel = document.querySelector(`label[for="q${idx}-${q.ans}"]`);
                const userLabel = sel.nextElementSibling;
                if (sel.value === q.ans) {
                    score++;
                    userLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400', 'ring-2', 'ring-yellow-300');
                    userLabel.innerHTML += ' <span class="text-green-600 font-bold">✔️</span>';
                } else {
                    userLabel.parentElement.classList.add('bg-red-100', 'border-red-400', 'ring-2', 'ring-red-300');
                    userLabel.innerHTML += ' <span class="text-red-600 font-bold">❌</span>';
                    corrLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400');
                }
                updateLive();
                controls.innerHTML = '';
                const nextBtn = document.createElement('button');
                nextBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                const list = DATA[curSec];
                if (curIdx < list.length - 1) {
                    nextBtn.textContent = '下一題 →';
                    nextBtn.onclick = () => { curIdx++; displayQ(curIdx); };
                } else {
                    nextBtn.textContent = '完成測驗 🎉';
                    nextBtn.onclick = showScore;
                }
                controls.appendChild(nextBtn);
            }

            // --- Show Final Score ---
            function showScore() {
                const list = DATA[curSec]; const tot = list.length;
                saveScore(curSec, score, tot);
                progBar.style.width = '100%'; progText.textContent = `${tot} / ${tot}`;
                qWrap.innerHTML = ''; controls.innerHTML = '';
                const pct = Math.round(score / tot * 100);
                const em = pct === 100 ? '🎉' : pct >= 80 ? '👏' : pct >= 60 ? '👍' : '💪';
                scoredisp.innerHTML = `
      <div class="py-4">
        <p class="text-5xl mb-3">${em}</p>
        <p class="text-stone-400 mb-1">測驗完成！</p>
        <p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${tot}</span></p>
        <p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p>
        <p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p>
      </div>`;
                scoredisp.classList.remove('hidden');
                const rb = document.createElement('button');
                rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                rb.textContent = '重新練習此大題'; rb.onclick = restart;
                scoredisp.appendChild(rb);
                renderSidebar();
            }

            function restart() {
                score = 0; curIdx = 0;
                scoredisp.classList.add('hidden'); scoredisp.innerHTML = '';
                displayQ(0);
            }

            function switchSection(sec) {
                curSec = sec; score = 0; curIdx = 0;
                scoredisp.classList.add('hidden'); scoredisp.innerHTML = '';
                sidebarNav.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
                displayQ(0);
            }

            // --- Init ---
            alertClose.onclick = () => alertModal.classList.add('hidden');
            clearBtn.onclick = () => { if (confirm('確定要清除所有大題的成績嗎？')) { localStorage.removeItem(STORE); renderSidebar(); } };

            renderSidebar();
            displayQ(0);
        });
    </script>
<script src="../progress.js"></script>
</body>

</html>
