<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 Grammar Focus 2 (一般動詞過去式)</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <!-- 使用 Tailwind CSS 進行現代化響應式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入教育級與特教友善字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;    /* 經典靛藍 */
            --secondary-color: #3b82f6;  /* 活力天藍 */
            --accent-color: #f59e0b;     /* 溫暖琥珀 */
            --success-color: #10b981;    /* 信心翡翠綠 */
            --error-color: #ef4444;      /* 警示亮紅 */
        }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f5f3ff;
            /* 輕柔淡雅點狀底圖，減少視覺壓力 */
            background-image: radial-gradient(#ddd6fe 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #1f2937;
            /* 優化觸控手勢，防止手機長按文字干擾拼圖操作 */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 3D 質感特教友善字卡 */
        .word-item {
            display: inline-block;
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            padding: 0.65rem 1.15rem;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            color: #1e293b;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 沉穩的 3D 陰影設計 */
            box-shadow: 0 5px 0 #cbd5e1;
            font-size: 1.15rem;
            margin: 6px;
            touch-action: manipulation;
        }

        /* 按下時的實體按鈕回饋 */
        .word-item:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #cbd5e1;
            background-color: #f1f5f9;
        }

        /* 懸停時高亮邊框 */
        .word-item:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        /* 作答放置區 */
        .drop-zone {
            min-height: 76px;
            background-color: #f8fafc;
            border: 3px dashed #cbd5e1;
            border-radius: 16px;
            transition: all 0.25s ease;
            display: flex;
            flex-wrap: wrap;
            gap: 4px; /* 對於英文單字，依靠 word-item 的 margin 以及此處 gap 排列 */
            align-items: center;
            padding: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        /* 尚未拖入時的提示文字 */
        .drop-zone:empty::before {
            content: attr(data-placeholder);
            color: #94a3b8;
            font-size: 1rem;
            width: 100%;
            text-align: center;
            font-weight: 500;
        }

        /* 答對樣式 */
        .drop-zone.correct {
            background-color: #f0fdf4;
            border-color: var(--success-color);
            border-style: solid;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
        }

        /* 答錯震動樣式 */
        .drop-zone.incorrect {
            background-color: #fef2f2;
            border-color: var(--error-color);
            border-style: solid;
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
        }

        /* 震動動畫 */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 動作按鍵縮放回饋 */
        .btn-action {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-action:active {
            transform: scale(0.93);
        }

        /* 喇叭與輔助圓形按鈕 */
        .speaker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #e0e7ff;
            color: var(--primary-color);
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.1);
        }
        .speaker-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.08);
        }

        /* 電腦端浮動字典視窗 */
        #tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            background: #1e293b;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
            transform: translate(-50%, -125%);
            white-space: nowrap;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 700;
        }
        #tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        /* 五彩紙片與過關動畫 */
        .checkmark-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        .checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 80px #10b981; } }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 4s linear forwards;
            pointer-events: none;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 進度條星星小圖示動畫 */
        #progress-star {
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 pb-20">

    <!-- 浮動翻譯 Tooltip (電腦版) -->
    <div id="tooltip"></div>

    <!-- 恭喜通關全螢幕遮罩 -->
    <div id="completion-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-[32px] shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative overflow-hidden" id="completion-modal">
            <div class="checkmark-wrapper mb-6">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="text-3xl md:text-4xl font-black text-gray-800 mb-3 animate-bounce tracking-wide">太厲害了！🎉</h2>
            <p class="text-gray-600 text-lg mb-8 font-medium">你已經完美解答了所有過去式造句練習題！</p>
            <div class="flex gap-4">
                <button onclick="closeOverlay()" class="flex-1 bg-indigo-600 text-white text-lg py-4 rounded-2xl font-extrabold hover:bg-indigo-700 active:scale-95 transition shadow-lg shadow-indigo-200">
                    再次練習
                </button>
                <button onclick="viewResultsOnly()" class="flex-1 bg-slate-100 text-slate-700 text-lg py-4 rounded-2xl font-extrabold hover:bg-slate-200 active:scale-95 transition border border-slate-200">
                    檢視答案
                </button>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="max-w-4xl mx-auto">
        
        <!-- 頂端控制面板與標題 -->
        <header class="bg-white/95 backdrop-blur rounded-[24px] p-5 md:p-8 shadow-md border border-white/60 mb-8 text-center relative">
            <div class="inline-block p-1 rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 mb-3">
                <div class="bg-white rounded-full px-5 py-1.5">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-600 font-extrabold tracking-widest text-xs sm:text-sm">
                        ENGLISH LESSON
                    </span>
                </div>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">Unit 5 Grammar Focus 2</h1>
            <p class="text-md sm:text-lg text-indigo-600 font-bold mt-1">一般動詞過去式造句練習 (課本 p.99-100)</p>

            <!-- 聽力與語音設定 (特教貼心設計) -->
            <div class="mt-6 flex flex-wrap gap-4 items-center justify-center bg-indigo-50/50 p-3 rounded-2xl border border-indigo-100 max-w-lg mx-auto">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">📢</span>
                    <span class="text-sm font-bold text-slate-700">發音語速調節：</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-bold text-slate-500">🐢 慢速</span>
                    <input type="range" id="speed-slider" min="0.5" max="1.1" step="0.15" value="0.8" class="w-32 h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <span class="text-sm font-bold text-slate-500">⚡ 快速</span>
                </div>
                <div id="speed-indicator" class="text-xs bg-indigo-600 text-white font-extrabold px-2.5 py-0.5 rounded-full">0.8x (特教推薦)</div>
            </div>

            <!-- 動態進度條 (附帶跑動星星) -->
            <div class="mt-8 max-w-md mx-auto relative px-4">
                <div class="flex justify-between text-xs text-indigo-900 font-extrabold mb-2 px-1">
                    <span>開始起跑 🚩</span>
                    <span id="progress-text">完成進度: 0/7 題</span>
                </div>
                <div class="h-4 bg-slate-100 rounded-full border border-slate-200 relative shadow-inner overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500 transition-all duration-500 ease-out shadow-lg" style="width: 0%"></div>
                </div>
                <!-- 跑動小標誌 -->
                <div id="progress-star" class="absolute -top-1 text-xl pointer-events-none transition-all duration-500" style="left: calc(0% + 8px);">⭐</div>
            </div>
        </header>

        <!-- 練習區主體 -->
        <main class="space-y-10">
            <!-- 肯定句區域 -->
            <section class="bg-white rounded-3xl p-6 shadow-md border border-indigo-100/40">
                <div class="flex items-center gap-3 border-b border-indigo-50 pb-4 mb-6">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-black text-sm">A</span>
                    <h2 class="text-xl font-extrabold text-slate-800">肯定句造句練習 (動詞過去式規律變化)</h2>
                </div>
                <div id="section-positive" class="space-y-8"></div>
            </section>

            <!-- 否定句區域 -->
            <section class="bg-white rounded-3xl p-6 shadow-md border border-pink-100/40">
                <div class="flex items-center gap-3 border-b border-pink-50 pb-4 mb-6">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-pink-100 text-pink-700 font-black text-sm">B</span>
                    <h2 class="text-xl font-extrabold text-slate-800">否定句造句練習 (需使用助動詞 did + 原形動詞)</h2>
                </div>
                <div id="section-negative" class="space-y-8"></div>
            </section>

            <!-- 疑問句與問答區域 -->
            <section class="bg-white rounded-3xl p-6 shadow-md border border-emerald-100/40">
                <div class="flex items-center gap-3 border-b border-emerald-50 pb-4 mb-6">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-black text-sm">C</span>
                    <h2 class="text-xl font-extrabold text-slate-800">過去式疑問句、問答與簡/詳答練習</h2>
                </div>
                <div id="section-question" class="space-y-8"></div>
            </section>
        </main>
    </div>

    <script>
        // --- 字典庫 (提供懸浮與點選翻譯) ---
        const dictionary = {
            'Henry': '亨利 (男子名)',
            'study': '學習',
            'studied': '學習 (study 的過去式)',
            'hard': '努力地',
            'last': '上一個的 / 剛過去的',
            'weekend': '週末',
            'Benson': '班森 (男子名)',
            'plant': '種植',
            'planted': '種植 (plant 的過去式)',
            'trees': '樹木',
            'a': '一個 / 一次',
            'month': '個月',
            'ago': '以前',
            'We': '我們',
            'did': '助動詞 (do/does 的過去式，用於問句與否定)',
            'not': '不 / 沒有',
            'enjoy': '享受 / 喜愛',
            'great': '極好的 / 美味的',
            'food': '食物',
            'night': '夜晚',
            'Ken': '肯 (男子名)',
            'practice': '練習',
            'baseball': '棒球',
            'Tim': '提姆 (男子名)',
            'visit': '拜訪 / 探望',
            'his': '他的',
            'Grandma': '祖母 / 外婆',
            'the': '這 / 那',
            'day': '天',
            'before': '在...之前',
            'yesterday': '昨天',
            'No': '不 / 不是',
            'he': '他',
            "didn't": '沒有 (did not 的過去縮寫)',
            'Jolin': '喬琳 / 蔡依林',
            'play': '彈奏 / 演奏 / 玩',
            'piano': '鋼琴',
            'this': '這個 / 這個時間',
            'Sunday': '星期日',
            'Yes': '是的',
            'she': '她',
            'What': '什麼',
            'Kelly': '凱莉 (女子名)',
            'do': '做',
            'at': '在 (某處)',
            'lake': '湖泊',
            'She': '她',
            'had': '有 / 吃 / 進行 (have 的過去式)',
            'picnic': '野餐',
            '.': '。 (句號)',
            '?': '？ (問號)',
            ',': '， (逗號)'
        };

        // --- 完整教材結構資料 (符合使用者提供的教材，無增減) ---
        const exercises = [
            {
                id: 'ex1',
                category: 'positive',
                prompt: '1. Henry / study hard / last weekend',
                type: 'affirmative',
                parts: [
                    {
                        subId: 'ex1_s',
                        label: '肯定句答案拼裝',
                        answer: 'Henry studied hard last weekend.',
                        chunks: ['Henry', 'studied', 'hard', 'last', 'weekend', '.']
                    }
                ]
            },
            {
                id: 'ex2',
                category: 'positive',
                prompt: '2. Benson / plant trees / a month ago /',
                type: 'affirmative',
                parts: [
                    {
                        subId: 'ex2_s',
                        label: '肯定句答案拼裝',
                        answer: 'Benson planted trees a month ago.',
                        chunks: ['Benson', 'planted', 'trees', 'a', 'month', 'ago', '.']
                    }
                ]
            },
            {
                id: 'ex3',
                category: 'negative',
                prompt: '3. We / not enjoy great food / last night',
                type: 'negative',
                parts: [
                    {
                        subId: 'ex3_s',
                        label: '否定句答案拼裝 (需使用助動詞 did)',
                        answer: 'We did not enjoy great food last night.',
                        chunks: ['We', 'did', 'not', 'enjoy', 'great', 'food', 'last', 'night', '.']
                    }
                ]
            },
            {
                id: 'ex4',
                category: 'negative',
                prompt: '4. Ken / not practice baseball / last weekend',
                type: 'negative',
                parts: [
                    {
                        subId: 'ex4_s',
                        label: '否定句答案拼裝 (需使用助動詞 did)',
                        answer: 'Ken did not practice baseball last weekend.',
                        chunks: ['Ken', 'did', 'not', 'practice', 'baseball', 'last', 'weekend', '.']
                    }
                ]
            },
            {
                id: 'ex5',
                category: 'question',
                prompt: '5. Tim / visit his Grandma / the day before yesterday / ? (用否定簡答)',
                type: 'qa',
                parts: [
                    {
                        subId: 'ex5_q',
                        label: '(問) 疑問句拼裝',
                        answer: 'Did Tim visit his Grandma the day before yesterday?',
                        chunks: ['Did', 'Tim', 'visit', 'his', 'Grandma', 'the', 'day', 'before', 'yesterday', '?']
                    },
                    {
                        subId: 'ex5_a',
                        label: '(答) 否定簡答拼裝',
                        answer: "No, he didn't.",
                        chunks: ['No', ',', 'he', "didn't", '.']
                    }
                ]
            },
            {
                id: 'ex6',
                category: 'question',
                prompt: '6. Jolin / play the piano / this Sunday / ? (用肯定簡答)',
                type: 'qa',
                parts: [
                    {
                        subId: 'ex6_q',
                        label: '(問) 疑問句拼裝',
                        answer: 'Did Jolin play the piano this Sunday?',
                        chunks: ['Did', 'Jolin', 'play', 'the', 'piano', 'this', 'Sunday', '?']
                    },
                    {
                        subId: 'ex6_a',
                        label: '(答) 肯定簡答拼裝',
                        answer: 'Yes, she did.',
                        chunks: ['Yes', ',', 'she', 'did', '.']
                    }
                ]
            },
            {
                id: 'ex7',
                category: 'question',
                prompt: '7. What / Kelly / do / at the lake / last weekend / ? (用 picnic 詳答)',
                type: 'qa',
                parts: [
                    {
                        subId: 'ex7_q',
                        label: '(問) 疑問句拼裝',
                        answer: 'What did Kelly do at the lake last weekend?',
                        chunks: ['What', 'did', 'Kelly', 'do', 'at', 'the', 'lake', 'last', 'weekend', '?']
                    },
                    {
                        subId: 'ex7_a',
                        label: '(答) 過去式詳答拼裝 (使用 picnic)',
                        answer: 'She had a picnic at the lake last weekend.',
                        chunks: ['She', 'had', 'a', 'picnic', 'at', 'the', 'lake', 'last', 'weekend', '.']
                    }
                ]
            }
        ];

        let completedCount = 0;
        const totalCount = exercises.length;
        const synth = window.speechSynthesis;
        let globalSpeechRate = 0.8; // 預設 0.8x 專為學習障礙或發展遲緩學生設計

        // --- 費雪-耶茲隨機排序演算法 (確保不與原句相同) ---
        function shuffleChunks(array) {
            let shuffled = [...array];
            do {
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
            } while (shuffled.join(' ') === array.join(' ') && array.length > 1);
            return shuffled;
        }

        // --- 智慧型中英文發音器 (Web Speech API) ---
        function speak(text) {
            if (!text) return;
            synth.cancel(); // 停止目前正在播放的聲音，避免聲音疊加混亂

            // 過濾並清理不發音的標點符號
            const cleanText = text.replace(/[.,?!:;，。！？：；、]/g, '').trim();
            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            // 偵測是否包含中文字，決定發音語系
            const hasChinese = /[\u4e00-\u9fa5]/.test(cleanText);
            utterance.lang = hasChinese ? 'zh-TW' : 'en-US';
            utterance.rate = globalSpeechRate;
            
            synth.speak(utterance);
        }

        // --- 初始化頁面渲染 ---
        function renderApp() {
            exercises.forEach((ex) => {
                const targetSectionId = `section-${ex.category}`;
                const container = document.getElementById(targetSectionId);

                const card = document.createElement('div');
                card.id = `card-${ex.id}`;
                card.dataset.id = ex.id;
                // 特教友善：大面積、寬鬆排版
                card.className = 'bg-slate-50/70 border border-slate-100 rounded-2xl p-4 md:p-6 mb-6 transition-all duration-300 relative';

                // 生成題幹標題
                let promptHtml = `
                    <div class="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3.5 rounded-xl border border-slate-100">
                        <div class="flex items-center gap-3">
                            <span class="text-lg font-black text-indigo-700 bg-indigo-50 w-7 h-7 rounded-full flex items-center justify-center">${ex.id.replace('ex', '')}</span>
                            <span class="text-md md:text-lg font-bold text-slate-800 tracking-wide">${ex.prompt}</span>
                        </div>
                        <button class="speaker-btn speak-prompt-btn flex-shrink-0" data-text="${ex.prompt}" title="聽整題提示">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                            </svg>
                        </button>
                    </div>
                `;

                // 拼裝子題（如問與答分開，或單一句子）
                let partsHtml = '';
                ex.parts.forEach((part) => {
                    const shuffled = shuffleChunks(part.chunks);
                    const isQuestionType = part.subId.endsWith('_q');
                    const badgeColor = isQuestionType 
                        ? 'bg-blue-100 text-blue-800 border-blue-200' 
                        : 'bg-emerald-100 text-emerald-800 border-emerald-200';

                    partsHtml += `
                        <div class="sub-exercise-container mb-4" data-subid="${part.subId}">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs md:text-sm font-extrabold px-2.5 py-1 rounded-full border ${badgeColor}">
                                        ${part.label}
                                    </span>
                                    <!-- 專屬聽音按鈕 -->
                                    <button class="speaker-btn" data-text="${part.answer.replace(/"/g, '&quot;')}" title="聽正確句子">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- 詞語儲存庫 (Shuffled Bank) -->
                            <div class="word-bank flex flex-wrap gap-1 bg-white p-3 rounded-2xl border border-slate-100 mb-3" id="bank-${part.subId}">
                                ${shuffled.map(word => `<div class="word-item" role="button" tabindex="0">${word}</div>`).join('')}
                            </div>

                            <!-- 作答拖放放置區 -->
                            <div class="drop-zone" id="zone-${part.subId}" data-placeholder="💡 點選上方英文字卡拼出通順句子"></div>
                        </div>
                    `;
                });

                // 控制按鍵與結果回饋
                const actionHtml = `
                    <div class="flex flex-wrap items-center gap-3 mt-4">
                        <button class="btn-action check-btn bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-8 rounded-2xl shadow-md text-md flex-grow sm:flex-grow-0" data-id="${ex.id}">
                            檢查答案
                        </button>
                        <button class="btn-action reset-btn bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-2xl border border-slate-200 text-md" data-id="${ex.id}">
                            重置
                        </button>
                        <!-- 特教貼心設計：手機裝置無滑鼠懸停，可用此專區顯示即時點擊字卡翻譯 -->
                        <div class="mobile-translation-banner hidden flex-grow bg-amber-50 border border-amber-200/60 px-4 py-2.5 rounded-xl text-amber-900 text-sm font-bold flex items-center gap-2">
                            <span>🔍 字典小老師：</span>
                            <span class="translation-text"></span>
                        </div>
                    </div>
                    <div class="feedback-area mt-4 h-6 text-sm font-black flex items-center justify-center"></div>
                `;

                card.innerHTML = promptHtml + partsHtml + actionHtml;
                container.appendChild(card);
            });
            updateProgress(0);
        }

        // --- 全域事件委託，完美兼顧點擊與觸控設備 ---
        document.body.addEventListener('click', (e) => {
            const target = e.target;

            // 1. 點擊字詞卡片
            if (target.classList.contains('word-item')) {
                const subExercise = target.closest('.sub-exercise-container');
                if (!subExercise) return;
                
                const subId = subExercise.dataset.subid;
                const bank = document.getElementById(`bank-${subId}`);
                const zone = document.getElementById(`zone-${subId}`);
                const parentCard = target.closest('.bg-slate-50/70');

                // 觸發音效發音
                speak(target.innerText);

                // 更新手機版的即時字詞翻譯 banner
                const transBanner = parentCard.querySelector('.mobile-translation-banner');
                const transText = transBanner.querySelector('.translation-text');
                const cleanWord = target.innerText.replace(/[.,?]/g, '').trim();
                const dictResult = dictionary[cleanWord];
                if (dictResult) {
                    transText.innerText = `「${cleanWord}」 ➔ ${dictResult}`;
                    transBanner.classList.remove('hidden');
                }

                // 移出與移回逻辑
                if (target.parentElement === bank) {
                    zone.appendChild(target);
                } else {
                    bank.appendChild(target);
                }

                // 當使用者更動拼裝時，自動重置作答區紅綠色狀態與結果通知
                const feedbackArea = parentCard.querySelector('.feedback-area');
                feedbackArea.textContent = '';
                zone.classList.remove('correct', 'incorrect');
                return;
            }

            // 2. 點選「檢查答案」按鈕
            if (target.classList.contains('check-btn')) {
                const id = target.dataset.id;
                checkAnswer(id);
                return;
            }

            // 3. 點選「重置」按鈕
            if (target.classList.contains('reset-btn')) {
                const id = target.dataset.id;
                resetQuestion(id);
                return;
            }

            // 4. 點選「小喇叭」按鈕 (任何帶有 data-text 的按鈕)
            const speakerBtn = target.closest('.speaker-btn');
            if (speakerBtn) {
                const text = speakerBtn.dataset.text;
                speak(text);
                return;
            }
        });

        // --- 電腦版滑鼠懸停 Tooltip 即時字典翻譯邏輯 ---
        const tooltip = document.getElementById('tooltip');
        document.body.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('word-item')) {
                const rawWord = e.target.innerText;
                const cleanWord = rawWord.replace(/[.,?]/g, '').trim();
                const trans = dictionary[cleanWord];
                if (trans) {
                    tooltip.innerHTML = `<span class="text-indigo-300">${rawWord}</span> 的意思是：${trans}`;
                    tooltip.style.display = 'block';
                    
                    // 計算位置，防出界
                    const rect = e.target.getBoundingClientRect();
                    const tooltipX = Math.max(12, Math.min(window.innerWidth - 180, rect.left + rect.width / 2));
                    tooltip.style.left = `${tooltipX}px`;
                    tooltip.style.top = `${rect.top - 8}px`;
                }
            }
        });

        document.body.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('word-item')) {
                tooltip.style.display = 'none';
            }
        });

        // --- 答案檢查核心邏輯 (支持純淨英語比對、忽略多餘空格) ---
        function checkAnswer(id) {
            const exData = exercises.find(e => e.id === id);
            const parentCard = document.getElementById(`card-${exData.id}`);
            const feedbackEl = parentCard.querySelector('.feedback-area');
            
            let allPartsCorrect = true;

            // 遍歷題目底下所有子部分（有的一題只有一句，有的有問答二句）
            exData.parts.forEach((part) => {
                const zone = document.getElementById(`zone-${part.subId}`);
                const rawWords = Array.from(zone.children).map(el => el.innerText);

                // 將字詞卡組合成英文句子
                let userSentence = rawWords.join(' ')
                    .replace(/\s+([,.?])/g, '$1')           // 去除標點符號前的空格
                    .replace(/\s+('t|’t|'s|’s|'d|’d)/gi, '$1')  // 去除英文縮寫前的多餘空格
                    .trim().replace(/\s+/g, ' ');

                const targetAnswer = part.answer.trim().replace(/\s+/g, ' ');

                const isCorrect = userSentence === targetAnswer;

                const triggerShake = (element) => {
                    element.style.animation = 'none';
                    element.offsetHeight; // 觸發 reflow 讓動畫重啟
                    element.style.animation = null;
                };

                if (isCorrect) {
                    zone.classList.remove('incorrect');
                    zone.classList.add('correct');
                } else {
                    zone.classList.remove('correct');
                    zone.classList.add('incorrect');
                    triggerShake(zone);
                    allPartsCorrect = false;
                }
            });

            // 回饋渲染
            if (allPartsCorrect) {
                feedbackEl.innerHTML = '<span class="text-emerald-600 flex items-center gap-2">🎉 非常完美！太厲害了！</span>';
                speak('答對了！太棒了！');
                if (!parentCard.dataset.completed) {
                    parentCard.dataset.completed = 'true';
                    // 鎖定已答對的卡片，增加穩定度，點選重置可解除鎖定
                    parentCard.classList.add('bg-emerald-50/40', 'border-emerald-200');
                    updateProgress(1);
                }
            } else {
                feedbackEl.innerHTML = '<span class="text-red-500 flex items-center gap-2">🤔 順序怪怪的喔！再試著調整讀讀看！</span>';
                speak('再試一次看看');
            }
        }

        // --- 題組重置重排邏輯 ---
        function resetQuestion(id) {
            const exData = exercises.find(e => e.id === id);
            const parentCard = document.getElementById(`card-${exData.id}`);
            const feedbackEl = parentCard.querySelector('.feedback-area');
            const transBanner = parentCard.querySelector('.mobile-translation-banner');

            exData.parts.forEach((part) => {
                const bank = document.getElementById(`bank-${part.subId}`);
                const zone = document.getElementById(`zone-${part.subId}`);

                // 將作答區卡片全部收回到字詞庫
                Array.from(zone.children).forEach(child => bank.appendChild(child));

                // 重新亂數排序
                const shuffled = shuffleChunks(part.chunks);
                bank.innerHTML = '';
                shuffled.forEach((word) => {
                    const item = document.createElement('div');
                    item.className = 'word-item';
                    item.role = 'button';
                    item.tabIndex = 0;
                    item.innerText = word;
                    bank.appendChild(item);
                });

                // 重置卡片背景外框
                zone.classList.remove('correct', 'incorrect');
            });

            // 隱藏翻譯與結果通知
            feedbackEl.textContent = '';
            if (transBanner) {
                transBanner.classList.add('hidden');
            }

            // 更新總進度
            if (parentCard.dataset.completed) {
                delete parentCard.dataset.completed;
                parentCard.classList.remove('bg-emerald-50/40', 'border-emerald-200');
                updateProgress(-1);
            }
        }

        // --- 進度條與星章動畫更新 ---
        function updateProgress(change) {
            completedCount += change;
            completedCount = Math.max(0, Math.min(completedCount, totalCount));

            const percentage = Math.round((completedCount / totalCount) * 100);
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            const star = document.getElementById('progress-star');

            bar.style.width = `${percentage}%`;
            text.textContent = `完成進度: ${completedCount}/${totalCount} 題`;

            // 計算星星的位置使其不越界
            star.style.left = `calc(${percentage}% - 6px)`;

            // 全部過關觸發
            if (completedCount === totalCount) {
                setTimeout(() => {
                    showOverlay();
                }, 1200);
            }
        }

        // --- 全螢幕五彩繽紛紙片特效 ---
        function showOverlay() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-90');
                modal.classList.add('scale-100');

                // 產生 60 片撒落五彩碎紙
                for (let i = 0; i < 60; i++) {
                    createConfetti(overlay);
                }
                speak('太棒了！你完成了所有的句子重組練習！');
            }, 10);
        }

        window.closeOverlay = function () {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');

            setTimeout(() => {
                overlay.classList.add('hidden');
                // 清空全部小紙片
                const confettis = document.querySelectorAll('.confetti');
                confettis.forEach(c => c.remove());
                
                // 一鍵重置所有題目以供再次練習
                exercises.forEach(ex => resetQuestion(ex.id));
            }, 500);
        }

        window.viewResultsOnly = function () {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');

            setTimeout(() => {
                overlay.classList.add('hidden');
                // 清空全部小紙片，但不重置題目以保留作答成果
                const confettis = document.querySelectorAll('.confetti');
                confettis.forEach(c => c.remove());
            }, 500);
        }

        function createConfetti(container) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#fbbf24', '#a855f7', '#ec4899', '#06b6d4'];
            
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = `-20px`;
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; // 2至4秒下落時間
            confetti.style.opacity = Math.random() * 0.7 + 0.3;
            
            // 隨機碎紙寬度
            const size = Math.random() * 8 + 6;
            confetti.style.width = `${size}px`;
            confetti.style.height = `${size * 1.5}px`;

            container.appendChild(confetti);
        }

        // --- 語速調節滑塊事件監聽 ---
        const speedSlider = document.getElementById('speed-slider');
        const speedIndicator = document.getElementById('speed-indicator');

        speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            globalSpeechRate = val;

            let label = `${val.toFixed(2)}x (正常)`;
            if (val <= 0.5) label = `${val.toFixed(2)}x (烏龜慢速 🐢)`;
            else if (val < 1.0) label = `${val.toFixed(2)}x (特教推薦 👤)`;
            else if (val > 1.0) label = `${val.toFixed(2)}x (閃電快速 ⚡)`;

            speedIndicator.innerText = label;
        });

        // --- 執行初始化渲染 ---
        renderApp();
    </script>
</body>
</html>
