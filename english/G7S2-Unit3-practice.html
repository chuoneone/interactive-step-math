<!DOCTYPE html>

<head>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }

        .word { position: relative; cursor: pointer; border-bottom: 1px dotted #a8a29e; transition: color .2s; }
        .word:hover { color: #d97706; }
        .word .tooltip {
            visibility: hidden; width: max-content; max-width: 160px;
            background: #1f2937; color: #fff; text-align: center;
            border-radius: 6px; padding: 4px 8px; position: absolute;
            z-index: 20; bottom: 130%; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity .3s; pointer-events: none; font-size: .75rem;
        }
        .word:hover .tooltip { visibility: visible; opacity: 1; }

        .sb-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 9px 12px; border-radius: 10px; font-weight: 700;
            font-size: .875rem; color: #78716c; cursor: pointer; transition: all .2s;
            background: transparent; border: 2px solid transparent; text-align: left;
        }
        .sb-btn:hover { background: #fef3c7; color: #92400e; }
        .sb-btn.active { background: #fde68a; color: #92400e; border-color: #fcd34d; }

        .badge { font-size: .65rem; border-radius: 999px; padding: 2px 7px; font-weight: 700; }
        .badge-ok { background: #dcfce7; color: #16a34a; }
        .badge-fail { background: #fee2e2; color: #dc2626; }
        .badge-none { background: #f5f5f4; color: #a8a29e; }

        .fill-blank {
            display: inline-block; min-width: 80px; border-bottom: 2px solid #d6d3d1;
            text-align: center; cursor: pointer; padding: 2px 8px;
            color: #92400e; font-weight: 700; transition: all .2s;
        }
        .fill-blank:hover { border-color: #f59e0b; }
        .fill-blank.filled { border-color: #f59e0b; background: #fef3c7; border-radius: 6px; }
        .fill-blank.correct { border-color: #22c55e; background: #dcfce7; border-radius: 6px; color: #16a34a; }
        .fill-blank.wrong { border-color: #ef4444; background: #fee2e2; border-radius: 6px; color: #dc2626; }

        .word-chip {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 16px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .95rem; transition: all .15s; border: 2px solid #d6d3d1;
            background: #fff; color: #44403c; user-select: none;
        }
        .word-chip:hover { border-color: #fbbf24; background: #fefce8; }
        .word-chip.used { opacity: .3; pointer-events: none; border-style: dashed; }

        .reorder-word {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .9rem; transition: all .15s; border: 2px solid #d6d3d1;
            background: #fff; color: #44403c; user-select: none;
        }
        .reorder-word:hover { border-color: #fbbf24; background: #fefce8; }
        .reorder-word.used { opacity: .3; pointer-events: none; border-style: dashed; }
        .answer-slot {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .9rem; transition: all .15s; border: 2px solid #f59e0b;
            background: #fef3c7; color: #92400e;
        }
        .answer-slot:hover { background: #fde68a; }
        .answer-zone {
            min-height: 52px; border: 2px dashed #d6d3d1; border-radius: 12px;
            padding: 10px; display: flex; flex-wrap: wrap; gap: 8px;
            align-items: center; background: #fafaf9;
        }
        .answer-zone.correct { border-color: #22c55e; background: #dcfce7; }
        .answer-zone.wrong { border-color: #ef4444; background: #fee2e2; animation: shake .4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0) }
            25% { transform: translateX(-6px) }
            75% { transform: translateX(6px) }
        }
    </style>
</head>

                const imgNote = document.createElement('p');
                imgNote.className = 'text-xs text-stone-400 text-center mb-3';
                imgNote.textContent = '📷 情境圖：一家人坐在餐桌旁，各自說出想要的飲料';
                block.appendChild(imgNote);

                const dialogDiv = document.createElement('div');
                dialogDiv.className = 'bg-stone-50 border border-stone-200 rounded-xl p-4';

                dialogue.forEach(line => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'flex items-start gap-2 mb-3';
                    const sp = document.createElement('span');
                    sp.className = 'font-bold text-stone-700 text-sm w-14 flex-shrink-0 text-right';
                    sp.textContent = line.speaker + ':';
                    lineDiv.appendChild(sp);
                    const textSpan = document.createElement('span');
                    textSpan.className = 'text-sm text-stone-700 leading-relaxed flex flex-wrap items-center gap-0.5';
                    line.segments.forEach(seg => {
                        if (seg.type === 'text') {
                            const t = document.createElement('span'); t.innerHTML = mkInteractive(seg.text);
                            textSpan.appendChild(t);
                        } else if (seg.type === 'num') {
                            const n = document.createElement('span');
                            n.className = 'text-amber-600 font-bold text-xs mx-0.5'; n.textContent = seg.text;
                            textSpan.appendChild(n);
                        } else if (seg.type === 'blank') {
                            const idx = seg.idx;
                            const blank = document.createElement('span');
                            blank.className = 'fill-blank'; blank.id = `bblank-${idx}`; blank.textContent = '______';
                            blank.style.minWidth = '70px';
                            blank.onclick = () => {
                                if (!selectedWord) { alertMsg.textContent='請先從上方詞庫點選一個單字！'; alertModal.classList.remove('hidden'); return; }
                                if (filled[idx]) { usedCount[filled[idx]]--; const o=document.getElementById(`bchip-${filled[idx]}`); if(o&&usedCount[filled[idx]]===0)o.classList.remove('used'); }
                                filled[idx]=selectedWord; usedCount[selectedWord]++;
                                blank.textContent=selectedWord; blank.classList.add('filled'); speak(selectedWord);
                                if (usedCount[selectedWord]>=1) selectedChip.classList.add('used');
                                selectedChip.classList.remove('ring-2','ring-amber-400','bg-amber-100');
                                selectedWord=null; selectedChip=null;
                                const done=filled.filter(f=>f!==null).length;
                                progBar.style.width=(done/totalBlanks*100)+'%';
                                progText.textContent=`${done} / ${totalBlanks}`;
                            };
                            textSpan.appendChild(blank);
                        }
                    });
                    lineDiv.appendChild(textSpan); dialogDiv.appendChild(lineDiv);
                });
                block.appendChild(dialogDiv); qWrap.appendChild(block);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (filled.some(f=>f===null)) { alertMsg.textContent='請填寫所有空格！'; alertModal.classList.remove('hidden'); return; }
                    score = 0;
                    answers.forEach((ans,i) => {
                        const blank=document.getElementById(`bblank-${i}`); blank.classList.remove('filled');
                        if (filled[i]===ans) { score++; blank.classList.add('correct'); }
                        else { blank.classList.add('wrong'); blank.title=`正確答案：${ans}`; }
                    });
                    renderScoreResult(score, totalBlanks, 'B');
                };
                controls.appendChild(checkBtn);
            }

            // ===============================================
            // Section F: One / Ones fill-in
            // ===============================================
            function displayOneOnes() {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO.F.title;
                secSub.textContent = SECINFO.F.sub;
                const { wordBank, questions } = DATA.F;
                const totalBlanks = questions.reduce((s,q) => s+q.blanks, 0);
                progBar.style.width = '0%'; progText.textContent = `0 / ${totalBlanks}`; updateLive();
                const filled = new Array(totalBlanks).fill(null);
                // Build flat blank list
                const allBlanks = [];
                questions.forEach((q,qi) => {
                    for (let bi=0; bi<q.blanks; bi++) allBlanks.push({ qi, bi, answer: q.answers[bi] });
                });
                let selectedWord = null, selectedChip = null;
                const block = document.createElement('div'); block.id = 'qblock';

                const wbDiv = document.createElement('div');
                wbDiv.className = 'bg-blue-50 border border-blue-200 rounded-xl p-3 mb-5';
                wbDiv.innerHTML = '<p class="text-xs font-bold text-blue-500 text-center mb-2">📖 點選 <strong>one</strong> 或 <strong>ones</strong>，再點空格填入（可重複使用）</p>';
                const wbChips = document.createElement('div'); wbChips.className = 'flex flex-wrap gap-3 justify-center';
                wordBank.forEach(w => {
                    const chip = document.createElement('span');
                    chip.className = 'word-chip px-8 text-lg'; chip.id = `fchip-${w}`; chip.textContent = w;
                    chip.onclick = () => {
                        if (selectedWord===w) { chip.classList.remove('ring-2','ring-amber-400','bg-amber-100'); selectedWord=null; selectedChip=null; return; }
                        if (selectedChip) selectedChip.classList.remove('ring-2','ring-amber-400','bg-amber-100');
                        selectedWord=w; selectedChip=chip; chip.classList.add('ring-2','ring-amber-400','bg-amber-100');
                    };
                    wbChips.appendChild(chip);
                });
                wbDiv.appendChild(wbChips); block.appendChild(wbDiv);

                let globalIdx = 0;
                questions.forEach((q, qi) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'mb-5 p-4 bg-stone-50 border border-stone-200 rounded-xl';
                    const numP = document.createElement('p');
                    numP.className = 'text-xs font-bold text-amber-600 mb-2'; numP.textContent = `${qi+1}.`;
                    qDiv.appendChild(numP);
                    const container = document.createElement('div');
                    container.className = 'text-sm text-stone-700 leading-loose whitespace-pre-line';
                    q.text.split('______').forEach((part, pi, arr) => {
                        const t = document.createElement('span'); t.innerHTML = mkInteractive(part);
                        container.appendChild(t);
                        if (pi < arr.length-1) {
                            const bIdx = globalIdx++;
                            const blank = document.createElement('span');
                            blank.className = 'fill-blank mx-1'; blank.id = `fblank-${bIdx}`;
                            blank.textContent = '______'; blank.style.minWidth='60px';
                            blank.onclick = () => {
                                if (!selectedWord) { alertMsg.textContent='請先點選 one 或 ones！'; alertModal.classList.remove('hidden'); return; }
                                filled[bIdx]=selectedWord;
                                blank.textContent=selectedWord; blank.classList.remove('wrong');
                                blank.classList.add('filled'); speak(selectedWord);
                                const done=filled.filter(f=>f!==null).length;
                                progBar.style.width=(done/totalBlanks*100)+'%';
                                progText.textContent=`${done} / ${totalBlanks}`;
                            };
                            container.appendChild(blank);
                        }
                    });
                    if (q.extra) { const ex=document.createElement('span'); ex.className='text-xs text-stone-400 ml-1'; ex.textContent=q.extra; container.appendChild(ex); }
                    qDiv.appendChild(container);
                    block.appendChild(qDiv);
                });
                qWrap.appendChild(block);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (filled.some(f=>f===null)) { alertMsg.textContent='請填寫所有空格！'; alertModal.classList.remove('hidden'); return; }
                    score = 0;
                    allBlanks.forEach((bl,i) => {
                        const blank=document.getElementById(`fblank-${i}`); blank.classList.remove('filled');
                        if (filled[i]===bl.answer) { score++; blank.classList.add('correct'); }
                        else { blank.classList.add('wrong'); blank.title=`正確答案：${bl.answer}`; }
                    });
                    renderScoreResult(score, totalBlanks, 'F');
                };
                controls.appendChild(checkBtn);
            }

            // ===============================================
            // Section G: Reorder sentences
            // ===============================================
            function displayReorder(idx) {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA.G;
                secTitle.textContent = SECINFO.G.title;
                secSub.textContent = SECINFO.G.sub;
                const answeredCnt = Object.keys(secState).filter(k=>secState[k] && secState[k].answered).length;
                progBar.style.width = (answeredCnt/list.length*100) + '%';
                progText.textContent = `${answeredCnt} / ${list.length}`;
                updateLive();
                const q = list[idx];
                const block = document.createElement('div'); block.id = 'qblock';

                // Example box
                const exBox = document.createElement('div');
                exBox.className = 'bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-xs text-stone-600';
                exBox.innerHTML = '<p class="font-bold text-amber-700 mb-1">📝 例句</p><p>which / you / like / apple / orange</p><p class="mt-1 font-bold text-amber-800">→ Which do you like, apples or oranges?</p>';
                block.appendChild(exBox);

                const promptP = document.createElement('p');
                promptP.className = 'text-sm text-stone-700 mb-2 flex items-start gap-2 whitespace-pre-line';
                promptP.appendChild(mkSpeaker(q.hint));
                const pSpan = document.createElement('span');
                pSpan.innerHTML = `<strong>${idx+1}.</strong> ${mkInteractive(q.prompt)}`;
                promptP.appendChild(pSpan);
                block.appendChild(promptP);

                const instrP = document.createElement('p');
                instrP.className = 'text-xs text-stone-400 mb-3';
                instrP.textContent = '👆 點擊下方單字，按正確順序排成句子（點擊已放入的單字可移除）';
                block.appendChild(instrP);

                const ansZone = document.createElement('div');
                ansZone.className = 'answer-zone mb-4'; ansZone.id = 'ans-zone';
                const ph = document.createElement('span'); ph.className = 'text-stone-300 text-sm'; ph.textContent = '點擊單字放到這裡...';
                ansZone.appendChild(ph); block.appendChild(ansZone);

                if (!secState[idx]) secState[idx] = { answered: false, userAnswer: [] };
                const myState = secState[idx];
                const userAnswer = myState.userAnswer;

                const poolDiv = document.createElement('div');
                poolDiv.className = 'flex flex-wrap gap-2 justify-center mb-4'; poolDiv.id = 'word-pool';

                shuffled.forEach((word, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'reorder-word'; btn.textContent = word; btn.dataset.poolIdx = i;
                    if (userAnswer.some(u => u.poolIdx === i)) btn.classList.add('used');
                    btn.onclick = () => {
                        if (btn.classList.contains('used') || myState.answered) return;
                        speak(word); btn.classList.add('used');
                        userAnswer.push({ word, poolIdx: i }); renderAZ();
                    };
                    poolDiv.appendChild(btn);
                });
                block.appendChild(poolDiv);

                qWrap.appendChild(block);

                function renderAZ() {
                    ansZone.innerHTML = '';
                    if (userAnswer.length===0) { const p2=document.createElement('span'); p2.className='text-stone-300 text-sm'; p2.textContent='點擊單字放到這裡...'; ansZone.appendChild(p2); return; }
                    userAnswer.forEach((item, ai) => {
                        const slot = document.createElement('button');
                        slot.className = 'answer-slot'; slot.textContent = item.word;
                        slot.onclick = () => {
                            if (myState.answered) return;
                            userAnswer.splice(ai,1); poolDiv.querySelectorAll('.reorder-word')[item.poolIdx].classList.remove('used'); renderAZ(); 
                        };
                        ansZone.appendChild(slot);
                    });
                }
                renderAZ();

                const navWrap = document.createElement('div');
                navWrap.className = 'flex justify-between items-center w-full gap-3 mt-6';
                
                const prevBtn = document.createElement('button');
                prevBtn.className = 'flex-1 py-3 px-2 bg-stone-200 text-stone-700 font-bold rounded-xl transition-colors hover:bg-stone-300 ' + (idx > 0 ? '' : 'invisible pointer-events-none');
                prevBtn.innerHTML = '←<span class="hidden sm:inline"> 上一題</span>';
                prevBtn.onclick = () => { curIdx--; displayReorder(curIdx); };
                navWrap.appendChild(prevBtn);

                const mainBtn = document.createElement('button');
                mainBtn.className = 'flex-[2] py-3 px-4 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 transition-colors';
                navWrap.appendChild(mainBtn);
                
                controls.appendChild(navWrap);

                if (myState.answered) {
                    poolDiv.querySelectorAll('.reorder-word').forEach(b => { b.onclick=null; b.style.cursor='default'; });
                    ansZone.querySelectorAll('.answer-slot').forEach(s => { s.onclick=null; s.style.cursor='default'; });
                    if (myState.isCorrect) { 
                        ansZone.classList.add('correct'); 
                        if (!ansZone.innerHTML.includes('✔️')) ansZone.innerHTML += '<span class="text-green-600 font-bold text-lg ml-2">✔️</span>'; 
                    } else {
                        ansZone.classList.add('wrong');
                        const corrP = document.createElement('p');
                        corrP.className = 'mt-2 text-sm text-green-700 bg-green-50 border border-green-200 p-2 rounded-md';
                        corrP.innerHTML = `<strong>正確答案：</strong>${q.answer.join(' ')}`;
                        block.appendChild(corrP);
                    }
                    if (idx === list.length - 1) {
                        mainBtn.textContent = '完成測驗 🎉';
                        mainBtn.onclick = showScore;
                    } else {
                        mainBtn.textContent = '下一題 →';
                        mainBtn.onclick = () => { curIdx++; displayReorder(curIdx); };
                    }
                } else {
                    mainBtn.textContent = '檢查答案';
                    mainBtn.onclick = () => {
                        if (userAnswer.length !== q.answer.length) { alertMsg.textContent='請將所有單字排列完成！'; alertModal.classList.remove('hidden'); return; }
                        myState.answered = true;
                        myState.isCorrect = userAnswer.every((item,i) => item.word === q.answer[i]);
                        if (myState.isCorrect) score++;
                        displayReorder(curIdx);
                    };
                }
            }

            // ===============================================
            // Section I: Reading + MC (all questions at once)
            // ===============================================
            function displayReadingSection() {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO.I.title;
                secSub.textContent = SECINFO.I.sub;
                const questions = DATA.I.questions;
                progBar.style.width = '0%'; progText.textContent = `0 / ${questions.length}`; updateLive();
                const block = document.createElement('div'); block.id = 'qblock';

                const passDiv = document.createElement('div');
                passDiv.className = 'bg-stone-50 border border-stone-300 rounded-xl p-4 mb-5 text-sm text-stone-700';
                passDiv.innerHTML = DATA.I.passage;
                block.appendChild(passDiv);

                let submitted = false;
                questions.forEach((q, qi) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'mb-4 p-3 bg-stone-50 border border-stone-200 rounded-xl';
                    const qp = document.createElement('p');
                    qp.className = 'text-sm font-bold text-stone-700 mb-2';
                    qp.textContent = q.q;
                    qDiv.appendChild(qp);
                    const optDiv = document.createElement('div'); optDiv.className = 'grid grid-cols-1 gap-2';
                    q.opts.forEach((opt, oi) => {
                        const ch = String.fromCharCode(65+oi);
                        const row = document.createElement('div');
                        row.className = 'flex items-center p-2 border border-stone-300 rounded-lg cursor-pointer hover:bg-amber-50 transition-all';
                        const radio = document.createElement('input');
                        radio.type='radio'; radio.id=`iq${qi}-${ch}`; radio.name=`iq${qi}`; radio.value=ch;
                        radio.className='h-4 w-4 text-amber-600 flex-shrink-0';
                        const label = document.createElement('label');
                        label.htmlFor=`iq${qi}-${ch}`; label.className='ml-2 text-sm text-stone-800 flex-1 cursor-pointer';
                        label.textContent=`(${ch}) ${opt}`;
                        row.onclick=()=>{ if(!submitted){radio.checked=true;} };
                        row.appendChild(radio); row.appendChild(label); optDiv.appendChild(row);
                    });
                    qDiv.appendChild(optDiv);
                    block.appendChild(qDiv);
                });
                qWrap.appendChild(block);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (submitted) return;
                    const missing = questions.some((_,qi)=>!document.querySelector(`input[name="iq${qi}"]:checked`));
                    if (missing) { alertMsg.textContent='請完成所有題目！'; alertModal.classList.remove('hidden'); return; }
                    submitted=true; score=0;
                    questions.forEach((q,qi) => {
                        const sel=document.querySelector(`input[name="iq${qi}"]:checked`);
                        const corrLabel=document.querySelector(`label[for="iq${qi}-${q.ans}"]`);
                        const userLabel=sel.nextElementSibling;
                        document.querySelectorAll(`input[name="iq${qi}"]`).forEach(r=>r.disabled=true);
                        if (sel.value===q.ans) { score++; userLabel.parentElement.classList.add('bg-yellow-100','border-yellow-400','ring-2','ring-yellow-300'); userLabel.innerHTML+=' <span class="text-green-600 font-bold">✔️</span>'; }
                        else { userLabel.parentElement.classList.add('bg-red-100','border-red-400','ring-2','ring-red-300'); userLabel.innerHTML+=' <span class="text-red-600 font-bold">❌</span>'; corrLabel.parentElement.classList.add('bg-yellow-100','border-yellow-400'); }
                    });
                    renderScoreResult(score, questions.length, 'I');
                };
                controls.appendChild(checkBtn);
            }

            // ===============================================
            // C, D, E, H: Standard individual MC
            // ===============================================
            function displayQ(idx) {
                if (curSec==='A') { displayFillIn(); return; }
                if (curSec==='B') { displayDialogueFillIn(); return; }
                if (curSec==='F') { displayOneOnes(); return; }
                if (curSec==='G') { displayReorder(idx); return; }
                if (curSec==='I') { displayReadingSection(); return; }

                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA[curSec];
                secTitle.textContent = SECINFO[curSec].title;
                secSub.textContent = SECINFO[curSec].sub;
                const answeredCnt = Object.keys(secState).filter(k=>secState[k] && secState[k].answered).length;
                progBar.style.width = (answeredCnt/list.length*100) + '%';
                progText.textContent = `${answeredCnt} / ${list.length}`;
                updateLive();

                const q = list[idx];
                const block = document.createElement('div'); block.id = 'qblock';

                // Context box for H (SVG illustration)
                if (curSec==='H') {
                    const ctx = document.createElement('div');
                    ctx.className = 'mb-4 rounded-xl border border-stone-200 overflow-hidden bg-stone-50';
                    ctx.innerHTML = `<div class="flex flex-col items-center gap-2 py-3 px-4">${q.svgHtml || ''}<p class="text-sm text-stone-600 text-center">${q.given || ''}</p></div>`;
                    block.appendChild(ctx);
                }

                const qp = document.createElement('p');
                qp.className = 'text-base text-stone-700 mb-4 flex items-start gap-2 whitespace-pre-line';
                const span = document.createElement('span');
                span.innerHTML = `<strong>${idx+1}.</strong> ${mkInteractive(q.q)}`;
                qp.appendChild(mkSpeaker(q.q)); qp.appendChild(span);

                const colCount = q.opts.some(o => o.length > 25) ? 'grid-cols-1' : 'grid-cols-1 sm:grid-cols-2';
                const grid = document.createElement('div'); grid.className = `grid ${colCount} gap-3`;
                q.opts.forEach((opt, i) => {
                    const ch = String.fromCharCode(65+i);
                    const row = document.createElement('div');
                    row.className = 'flex items-center p-3 border border-stone-300 rounded-lg cursor-pointer hover:bg-amber-50 transition-all';
                    const radio = document.createElement('input');
                    radio.type='radio'; radio.id=`q${idx}-${ch}`; radio.name=`q${idx}`; radio.value=ch;
                    radio.className='h-4 w-4 text-amber-600 border-gray-300 flex-shrink-0';
                    if (secState[idx] && secState[idx].selected === ch) radio.checked = true;
                    const label = document.createElement('label');
                    label.htmlFor=`q${idx}-${ch}`; label.className='ml-3 text-sm text-stone-800 flex-1 cursor-pointer';
                    label.innerHTML=`(${ch}) ${mkInteractive(opt)}`;
                    row.onclick=()=>{ radio.checked=true; speak(opt); if(!secState[idx] || !secState[idx].answered) secState[idx] = { answered: false, selected: ch }; };
                    row.appendChild(radio); row.appendChild(label); grid.appendChild(row);
                });

                block.appendChild(qp); block.appendChild(grid);
                qWrap.appendChild(block);

                const navWrap = document.createElement('div');
                navWrap.className = 'flex justify-between items-center w-full gap-3 mt-6';
                
                const prevBtn = document.createElement('button');
                prevBtn.className = 'flex-1 py-3 px-2 bg-stone-200 text-stone-700 font-bold rounded-xl transition-colors hover:bg-stone-300 ' + (idx > 0 ? '' : 'invisible pointer-events-none');
                prevBtn.innerHTML = '←<span class="hidden sm:inline"> 上一題</span>';
                prevBtn.onclick = () => { curIdx--; displayQ(curIdx); };
                navWrap.appendChild(prevBtn);

                const mainBtn = document.createElement('button');
                mainBtn.className = 'flex-[2] py-3 px-4 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 transition-colors';
                navWrap.appendChild(mainBtn);
                
                controls.appendChild(navWrap);

                if (secState[idx] && secState[idx].answered) {
                    block.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                    block.querySelectorAll('div.flex.items-center').forEach(d => { d.onclick=null; d.classList.remove('hover:bg-amber-50'); d.style.cursor='default'; });
                    
                    const selVal = secState[idx].selected;
                    const selLabel = document.querySelector(`label[for="q${idx}-${selVal}"]`);
                    const corrLabel = document.querySelector(`label[for="q${idx}-${q.ans}"]`);
                    
                    if (selVal === q.ans) {
                        selLabel.parentElement.classList.add('bg-yellow-100','border-yellow-400','ring-2','ring-yellow-300');
                        if (!selLabel.innerHTML.includes('✔️')) selLabel.innerHTML += ' <span class="text-green-600 font-bold">✔️</span>';
                    } else {
                        selLabel.parentElement.classList.add('bg-red-100','border-red-400','ring-2','ring-red-300');
                        if (!selLabel.innerHTML.includes('❌')) selLabel.innerHTML += ' <span class="text-red-600 font-bold">❌</span>';
                        if (corrLabel) corrLabel.parentElement.classList.add('bg-yellow-100','border-yellow-400');
                    }
                    
                    if (idx === list.length - 1) {
                        mainBtn.textContent = '完成測驗 🎉';
                        mainBtn.onclick = showScore;
                    } else {
                        mainBtn.textContent = '下一題 →';
                        mainBtn.onclick = () => { curIdx++; displayQ(curIdx); };
                    }
                } else {
                    mainBtn.textContent = '檢查答案';
                    mainBtn.onclick = () => {
                        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
                        if (!sel) { alertMsg.textContent='請先選擇一個答案！'; alertModal.classList.remove('hidden'); return; }
                        
                        let isCorrect = (sel.value === q.ans);
                        secState[idx] = { answered: true, selected: sel.value, isCorrect: isCorrect };
                        if (isCorrect) score++;
                        displayQ(idx);
                    };
                    block.querySelectorAll('input[type="radio"]').forEach(r => {
                        r.addEventListener('change', (e) => {
                            if(!secState[idx] || !secState[idx].answered) secState[idx] = { answered: false, selected: e.target.value };
                        });
                    });
                }
            }

            function showScore() {
                const tot=secLen(curSec);
                renderScoreResult(score, tot, curSec);
            }

            function restart() {
                score=0; curIdx=0; secState={};
                scoredisp.classList.add('hidden'); scoredisp.innerHTML='';
                displayQ(0);
            }

            function switchSection(sec) {
                curSec=sec; score=0; curIdx=0;
                secState={};
                scoredisp.classList.add('hidden'); scoredisp.innerHTML='';
                sidebarNav.querySelectorAll('.sb-btn').forEach(b=>b.classList.toggle('active',b.dataset.sec===sec));
                displayQ(0);
            }

            alertClose.onclick=()=>alertModal.classList.add('hidden');
            clearBtn.onclick=()=>{ if(confirm('確定要清除所有大題的成績嗎？')){ localStorage.removeItem(STORE); renderSidebar(); } };

            renderSidebar();
            displayQ(0);
        });
    </script>
