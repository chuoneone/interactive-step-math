<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Unit 6 單字選擇題挑戰</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --error: #f43f5e;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Nunito','Noto Sans TC',sans-serif;
            background: radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.4) 0, transparent 50%),
                        radial-gradient(at 50% 0%, rgba(219, 234, 254, 0.4) 0, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(243, 232, 255, 0.4) 0, transparent 50%),
                        #f8fafc;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .premium-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #4f46e5, #3b82f6);
        }
        .stage-btn {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            color: #334155;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px -10px rgba(31, 38, 135, 0.05);
        }
        .stage-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--primary-light);
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.2);
        }
        .stage-btn:active {
            transform: translateY(-1px);
        }
        .choice-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            color: #475569;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #cbd5e1;
            font-size: 1.15rem;
            min-height: 64px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            position: relative;
        }
        .choice-btn:active:not(.disabled) { transform:translateY(4px); box-shadow:0 2px 0 #cbd5e1; }
        .choice-btn.correct-card { border-color:var(--success)!important; background-color:#f0fdf4!important; color:#065f46!important; box-shadow:0 4px 0 #a7f3d0!important; transform:scale(1.02); }
        .choice-btn.incorrect-card { border-color:var(--error)!important; background-color:#fff1f2!important; color:#9f1239!important; box-shadow:0 4px 0 #fecdd3!important; animation:shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%,90%{transform:translate3d(-3px,0,0)} 20%,80%{transform:translate3d(5px,0,0)} 30%,50%,70%{transform:translate3d(-7px,0,0)} 40%,60%{transform:translate3d(7px,0,0)} }
        .btn-premium { box-shadow:0 4px 0 #1e1b4b; transition:all 0.15s ease; }
        .btn-premium:active { transform:translateY(2px); box-shadow:0 2px 0 #1e1b4b; }
        #correct-overlay { position:absolute; top:12px; right:12px; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
        #correct-overlay.show { opacity:1; }
        #correct-overlay svg { width:40px; height:40px; animation:pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes pop-in { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
        .checkmark { width:100px; height:100px; border-radius:50%; display:block; stroke-width:4; stroke:#fff; stroke-miterlimit:10; box-shadow:inset 0 0 0 #10b981; animation:fill .4s ease-in-out .4s forwards,cscale .3s ease-in-out .9s both; }
        .checkmark__check { transform-origin:50% 50%; stroke-dasharray:48; stroke-dashoffset:48; animation:stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100%{stroke-dashoffset:0} }
        @keyframes cscale { 0%,100%{transform:none} 50%{transform:scale3d(1.1,1.1,1)} }
        @keyframes fill { 100%{box-shadow:inset 0 0 0 80px #10b981} }
        .confetti { position:absolute; width:12px; height:12px; animation:confetti-fall 3.5s linear forwards; border-radius:50%; pointer-events:none; }
        @keyframes confetti-fall { 0%{transform:translateY(-10vh) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 pb-24 flex flex-col justify-between">

<!-- Completion Overlay -->
<div id="completion-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
    <div class="bg-white p-8 md:p-12 rounded-[32px] shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative border-4 border-indigo-200" id="completion-modal">
        <div class="w-24 h-24 mx-auto mb-6">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>
        <h2 class="text-4xl font-extrabold text-indigo-900 mb-3 animate-bounce">挑戰大成功！🎉</h2>
        <p id="completion-summary" class="text-slate-600 text-lg mb-8 font-medium">你超棒的！</p>
        <button onclick="restartChallenge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xl px-8 py-4 rounded-2xl font-bold transition shadow-lg btn-premium mb-4">再玩一次！</button>
        <button onclick="backToHome()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl px-8 py-4 rounded-2xl font-bold transition shadow-lg btn-premium">回主選單</button>
    </div>
</div>

<!-- Home Screen -->
<div id="home-screen" class="max-w-3xl mx-auto w-full flex-grow flex flex-col justify-center items-center">
    <h1 class="text-4xl font-black mb-2 tracking-tight text-center gradient-text">Unit 6 單字選擇題挑戰</h1>
    <p class="text-slate-500 font-bold mb-8">選擇要練習的單字範圍</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl px-4">
        <button onclick="startGameCategory('g1')" class="stage-btn !h-auto !py-5 !text-2xl font-black text-indigo-700 flex flex-col gap-1" id="btn-cat-g1">
            <span>1 ~ 9</span>
            <span id="score-g1" class="text-sm font-bold text-slate-400"></span>
        </button>
        <button onclick="startGameCategory('g2')" class="stage-btn !h-auto !py-5 !text-2xl font-black text-indigo-700 flex flex-col gap-1" id="btn-cat-g2">
            <span>10 ~ 18</span>
            <span id="score-g2" class="text-sm font-bold text-slate-400"></span>
        </button>
        <button onclick="startGameCategory('g3')" class="stage-btn !h-auto !py-5 !text-2xl font-black text-indigo-700 flex flex-col gap-1" id="btn-cat-g3">
            <span>19 ~ 27</span>
            <span id="score-g3" class="text-sm font-bold text-slate-400"></span>
        </button>
        <button onclick="startGameCategory('g4')" class="stage-btn !h-auto !py-5 !text-2xl font-black text-indigo-700 flex flex-col gap-1" id="btn-cat-g4">
            <span>28 ~ 36</span>
            <span id="score-g4" class="text-sm font-bold text-slate-400"></span>
        </button>
        <button onclick="startGameCategory('wrong')" class="stage-btn !h-auto !py-5 !text-2xl font-black text-red-700 flex flex-col gap-1 hidden col-span-1 sm:col-span-2 border-red-200 hover:border-red-400 hover:bg-red-50/50" id="btn-cat-wrong">
            <span>常錯題型</span>
            <span id="score-wrong" class="text-sm font-bold text-slate-400"></span>
        </button>
    </div>
</div>

<!-- Game Screen -->
<div id="game-screen" class="max-w-3xl mx-auto w-full flex-grow flex flex-col justify-center hidden relative">
    <button onclick="backToHomeDirectly()" class="absolute top-0 left-0 bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold text-sm transition-colors shadow-sm border border-slate-200 z-10">← 回主選單</button>

    <header class="relative text-center mb-4 pt-10">
        <h1 class="text-2xl font-black text-slate-900 mb-1">Unit 6 單字挑戰</h1>
        <div class="flex justify-center gap-4 text-sm font-black mt-2">
            <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">✅ 答對：<span id="game-score">0</span></span>
            <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full">⏱ <span id="game-timer">0</span> 秒</span>
        </div>
        <button id="btn-next" class="absolute top-10 right-0 btn-premium bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-xl text-sm shadow-lg transition-all hidden">下一題 ➔</button>
    </header>

    <main class="space-y-3">
        <!-- Question Card -->
        <div class="premium-card p-6 md:p-8 text-center relative overflow-hidden flex flex-col items-center justify-center min-h-[180px]">
            <div class="absolute top-3 left-3 bg-indigo-100 text-indigo-700 font-black rounded-full px-3 py-1 text-sm" id="question-index-badge">Q 1/9</div>
            <h2 id="zh-prompt" class="text-4xl md:text-5xl font-black text-slate-800 tracking-wide mt-2 mb-4">載入中...</h2>
            <button id="btn-speak-zh" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold py-2 px-4 rounded-xl text-sm flex items-center gap-2 border border-indigo-100 active:scale-95 transition-transform">
                🔊 聽英文
            </button>
            <div id="correct-overlay">
                <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="26" cy="26" r="25" fill="#10b981"/>
                    <path d="M14.1 27.2l7.1 7.2 16.7-16.8" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <!-- Choices -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="choices-container"></div>

        <!-- Action Area -->
        <div class="flex flex-col items-center gap-2 pt-1">
            <div id="feedback-msg" class="text-base font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300 min-h-0"></div>
        </div>
    </main>
</div>

<script>
    const fullDictionary = [
        {zh:'機場', en:'airport', cat:'g1'},
        {zh:'旅行；行進', en:'travel', cat:'g1'},
        {zh:'休息', en:'rest', cat:'g1'},
        {zh:'飯店', en:'hotel', cat:'g1'},
        {zh:'飛機', en:'plane', cat:'g1'},
        {zh:'風景；名勝', en:'the sights', cat:'g1'},
        {zh:'書店', en:'bookstore', cat:'g1'},
        {zh:'購買', en:'buy', cat:'g1'},
        {zh:'就；只', en:'just', cat:'g1'},
        {zh:'學習', en:'learn', cat:'g2'},
        {zh:'故事', en:'story', cat:'g2'},
        {zh:'酷的', en:'cool', cat:'g2'},
        {zh:'火車', en:'train', cat:'g2'},
        {zh:'冷的', en:'cold', cat:'g2'},
        {zh:'嘗試', en:'try', cat:'g2'},
        {zh:'距離；路線', en:'way', cat:'g2'},
        {zh:'帶；拿；取', en:'take', cat:'g2'},
        {zh:'前幾天', en:'the other day', cat:'g2'},
        {zh:'車站；局', en:'station', cat:'g3'},
        {zh:'百貨公司', en:'department store', cat:'g3'},
        {zh:'餐廳', en:'restaurant', cat:'g3'},
        {zh:'電影院', en:'theater', cat:'g3'},
        {zh:'市場', en:'market', cat:'g3'},
        {zh:'寺廟', en:'temple', cat:'g3'},
        {zh:'有名的', en:'famous', cat:'g3'},
        {zh:'在…期間', en:'during', cat:'g3'},
        {zh:'除…之外', en:'besides', cat:'g3'},
        {zh:'墜入情網', en:'fall in love', cat:'g4'},
        {zh:'年記', en:'age', cat:'g4'},
        {zh:'失去', en:'lose', cat:'g4'},
        {zh:'哭泣', en:'cry', cat:'g4'},
        {zh:'躲藏', en:'hide', cat:'g4'},
        {zh:'建造', en:'build', cat:'g4'},
        {zh:'旅行；行程', en:'trip', cat:'g4'},
        {zh:'令人傷心地', en:'sadly', cat:'g4'},
        {zh:'持續', en:'last', cat:'g4'}
    ];

    const catLabels = {g1:'1 ~ 9', g2:'10 ~ 18', g3:'19 ~ 27', g4:'28 ~ 36', wrong:'常錯題型'};
    let activeDictionary = [], currentCategory = '', questions = [];
    let currentIndex = 0, isCorrectAnswerSelected = false;
    let correctCount = 0, timerInterval = null, elapsedSeconds = 0;
    const LS_KEY = 'u6-words';
    let records = {g1:null, g2:null, g3:null, g4:null, wrong:null};
    let wrongSet = new Map(); // en -> item object
    const synth = window.speechSynthesis;

    function saveToStorage() {
        const data = { records, wrongArr: Array.from(wrongSet.entries()) };
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {}
    }

    function loadFromStorage() {
        try {
            const raw = localStorage.getItem(LS_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data.records) Object.assign(records, data.records);
            if (data.wrongArr) wrongSet = new Map(data.wrongArr);
        } catch(e) {}
    }

    // Rate and Pitch parameters for consistent quality speech
    function speak(text, isChinese=false) {
        if (!text) return;
        synth.cancel();
        const clean = text.replace(/[.。,?？!！;:；：()/]/g,' ').trim();
        if (!clean) return;
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = isChinese ? 'zh-TW' : 'en-US';
        u.rate = 0.85;
        synth.speak(u);
    }

    function startGameCategory(cat) {
        currentCategory = cat;
        if (cat === 'wrong') {
            activeDictionary = Array.from(wrongSet.values());
        } else {
            activeDictionary = fullDictionary.filter(i => i.cat === cat);
        }
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initGame();
    }

    function startTimer() {
        stopTimer();
        elapsedSeconds = 0;
        document.getElementById('game-timer').textContent = '0';
        timerInterval = setInterval(() => {
            elapsedSeconds++;
            document.getElementById('game-timer').textContent = elapsedSeconds;
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function updateHomeScores() {
        ['g1','g2','g3','g4'].forEach(cat => {
            const el = document.getElementById(`score-${cat}`);
            const rec = records[cat];
            el.textContent = rec ? `✅ ${rec.score}/${rec.total}  ⏱ 最佳 ${rec.bestTime}秒` : '';
            el.style.color = rec ? '#10b981' : '';
        });
        const wrongBtn = document.getElementById('btn-cat-wrong');
        const wrongEl = document.getElementById('score-wrong');
        if (wrongSet.size > 0) {
            wrongBtn.classList.remove('hidden');
            wrongEl.textContent = `共 ${wrongSet.size} 題曾答錯，點此加強！`;
        } else {
            wrongBtn.classList.add('hidden');
        }
    }

    function initGame() {
        questions = [...activeDictionary].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        correctCount = 0;
        document.getElementById('game-score').textContent = '0';
        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) { showOverlay(); return; }
        isCorrectAnswerSelected = false;
        const q = questions[currentIndex];
        const isRetry = !!q.isRetry;
        const badge = document.getElementById('question-index-badge');
        if (isRetry) {
            badge.textContent = '⚔️ 敗部復活！';
            badge.className = 'absolute top-3 left-3 bg-rose-100 text-rose-700 font-black rounded-full px-3 py-1 text-sm';
        } else {
            const normalTotal = questions.filter(q => !q.isRetry).length;
            const normalIndex = questions.slice(0, currentIndex + 1).filter(q => !q.isRetry).length;
            badge.textContent = `Q ${normalIndex}/${normalTotal}`;
            badge.className = 'absolute top-3 left-3 bg-indigo-100 text-indigo-700 font-black rounded-full px-3 py-1 text-sm';
        }
        document.getElementById('zh-prompt').textContent = q.zh;
        document.getElementById('correct-overlay').classList.remove('show');
        document.getElementById('btn-next').classList.add('hidden');
        clearFeedback();

        const distractors = fullDictionary.filter(i => i.en !== q.en).sort(() => Math.random()-0.5).slice(0,3);
        const options = [q, ...distractors].sort(() => Math.random()-0.5);
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = opt.en;
            btn.addEventListener('click', () => handleOptionClick(opt.en, btn));
            container.appendChild(btn);
        });

        speak(q.en, false);
    }

    function handleOptionClick(selectedEn, btnEl) {
        if (isCorrectAnswerSelected) return;
        const q = questions[currentIndex];
        if (selectedEn === q.en) {
            isCorrectAnswerSelected = true;
            if (q.isRetry) {
                // Bonus point for retry correct
                correctCount++;
                document.getElementById('game-score').textContent = correctCount;
                wrongSet.delete(q.en);
                showFeedback('🎉 答回來了！補到分數了！', 'bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2');
            } else {
                correctCount++;
                document.getElementById('game-score').textContent = correctCount;
                clearFeedback();
            }
            btnEl.classList.add('correct-card');
            document.getElementById('correct-overlay').classList.add('show');
            speak(q.en, false);
            document.getElementById('btn-next').classList.remove('hidden');
            document.querySelectorAll('#choices-container .choice-btn').forEach(b => {
                if (b !== btnEl) b.classList.add('opacity-50','cursor-not-allowed');
            });
        } else {
            isCorrectAnswerSelected = true;
            if (!q.isRetry) {
                wrongSet.set(q.en, q);
                // Insert retry copy right after current
                questions.splice(currentIndex + 1, 0, { ...q, isRetry: true });
            }
            btnEl.classList.add('incorrect-card');
            speak(q.en, false);
            showFeedback(`❌ 答錯了！正確答案是：${q.en}`, 'bg-rose-50 border border-rose-200 text-rose-700 px-3 py-2');
            document.querySelectorAll('#choices-container .choice-btn').forEach(b => {
                if (b.textContent === q.en) b.classList.add('correct-card');
                else if (b !== btnEl) b.classList.add('opacity-50','cursor-not-allowed');
            });
            document.getElementById('btn-next').classList.remove('hidden');
        }
    }

    function showFeedback(msg, cls) {
        const el = document.getElementById('feedback-msg');
        el.textContent = msg;
        el.className = `text-base font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300 min-h-0 ${cls}`;
    }

    function clearFeedback() {
        const el = document.getElementById('feedback-msg');
        el.textContent = '';
        el.className = 'text-base font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300 min-h-0';
    }

    document.getElementById('btn-next').addEventListener('click', () => { currentIndex++; loadQuestion(); });
    document.getElementById('btn-speak-zh').addEventListener('click', () => {
        const q = questions[currentIndex];
        if (q) speak(q.en, false);
    });

    function showOverlay() {
        stopTimer();
        const prev = records[currentCategory];
        const isNewBest = prev === null || elapsedSeconds < prev.bestTime;
        records[currentCategory] = {
            score: correctCount,
            total: questions.filter(q => !q.isRetry).length,
            bestTime: isNewBest ? elapsedSeconds : prev.bestTime
        };
        saveToStorage();
        document.getElementById('completion-summary').innerHTML =
            `你超棒的！成功完成了 ${catLabels[currentCategory]}！<br>
            <span class="inline-block mt-2 text-emerald-600 font-black">✅ 答對 ${correctCount}/${questions.length} 題</span>
            &nbsp;
            <span class="inline-block mt-2 text-amber-600 font-black">⏱ 用時 ${elapsedSeconds} 秒${isNewBest ? '（新記錄🏆）':''}</span>`;
        const overlay = document.getElementById('completion-overlay');
        const modal = document.getElementById('completion-modal');
        overlay.classList.remove('hidden');
        setTimeout(() => {
            overlay.classList.remove('opacity-0');
            modal.classList.remove('scale-90');
            modal.classList.add('scale-100');
            speak('Wonderful! You completed the challenge!', false);
            for (let i = 0; i < 70; i++) createConfetti(overlay);
        }, 10);
    }

    function restartChallenge() {
        const overlay = document.getElementById('completion-overlay');
        const modal = document.getElementById('completion-modal');
        overlay.classList.add('opacity-0');
        modal.classList.remove('scale-100');
        modal.classList.add('scale-90');
        setTimeout(() => {
            overlay.classList.add('hidden');
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            initGame();
        }, 500);
    }

    function backToHome() {
        const overlay = document.getElementById('completion-overlay');
        const modal = document.getElementById('completion-modal');
        overlay.classList.add('opacity-0');
        modal.classList.remove('scale-100');
        modal.classList.add('scale-90');
        setTimeout(() => {
            overlay.classList.add('hidden');
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            updateHomeScores();
        }, 500);
    }

    function backToHomeDirectly() {
        stopTimer();
        synth.cancel();
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        updateHomeScores();
    }

    function createConfetti(container) {
        const c = document.createElement('div');
        c.classList.add('confetti');
        const colors = ['#f43f5e','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4'];
        c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (Math.random()*2+2)+'s';
        c.style.opacity = Math.random();
        c.style.transform = `scale(${Math.random()*0.8+0.6})`;
        container.appendChild(c);
    }

    window.onload = function() {
        loadFromStorage();
        updateHomeScores();
    };
</script>
</body>
</html>
