<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>過去時間副詞選擇題挑戰 🎯</title>
    <link rel="icon" href="images/dog.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-indigo: #4f46e5;
            --primary-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --success-emerald: #10b981;
            --error-rose: #f43f5e;
            --bg-dots: #e2e8f0;
        }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* */
        /* Premium Card Style */
        .premium-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 10px 30px -5px rgba(79, 70, 229, 0.08), 0 8px 15px -6px rgba(79, 70, 229, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Large Choice Cards for high tactile readability */
        .choice-btn {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            color: #334155;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #cbd5e1;
            font-size: 1.25rem;
            min-height: 64px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            position: relative;
        }

        .choice-btn:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1;
        }

        /* Correction States for Choice Buttons */
        .choice-btn.correct-card {
            border-color: var(--success-emerald) !important;
            background-color: #f0fdf4 !important;
            color: #065f46 !important;
            box-shadow: 0 4px 0 #a7f3d0 !important;
            transform: scale(1.02);
        }

        .choice-btn.incorrect-card {
            border-color: var(--error-rose) !important;
            background-color: #fff1f2 !important;
            color: #9f1239 !important;
            box-shadow: 0 4px 0 #fecdd3 !important;
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* Keyframe Shake Animation */
        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-3px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(5px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-7px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(7px, 0, 0);
            }
        }

        /* Action Buttons with deep depth effect */
        .btn-premium {
            box-shadow: 0 6px 0 #1e1b4b;
            transition: all 0.15s ease;
        }

        .btn-premium:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e1b4b;
        }

        /* Checkmark Animation inside completion modal */
        .checkmark-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {

            0%,
            100% {
                transform: none;
            }

            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 80px #10b981;
            }
        }

        /* Confetti Elements for celebration */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            animation: confetti-fall 3.5s linear forwards;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Correct answer overlay checkmark inside question card */
        #correct-overlay {
            position: absolute;
            inset: 0;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #correct-overlay.show {
            opacity: 1;
        }

        #correct-overlay svg {
            width: 96px;
            height: 96px;
            animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 pb-24 flex flex-col justify-between">

    <!-- Completion Overlay -->
    <div id="completion-overlay"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-[32px] shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative border-4 border-indigo-200"
            id="completion-modal">
            <div class="checkmark-wrapper mb-6">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                </svg>
            </div>
            <h2 class="text-4xl font-extrabold text-indigo-900 mb-3 animate-bounce">挑戰大成功！🎉</h2>
            <p class="text-slate-600 text-lg mb-8 font-medium">你超棒的！成功學會了所有過去時間副詞！</p>
            <button onclick="restartChallenge()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xl px-8 py-4 rounded-2xl font-bold transition shadow-lg btn-premium mb-4">
                再玩一次！
            </button>
            <button onclick="backToHome()"
                class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl px-8 py-4 rounded-2xl font-bold transition shadow-lg btn-premium">
                回主選單
            </button>
        </div>
    </div>

    <!-- -->
    <!-- Home Screen -->
    <div id="home-screen" class="max-w-3xl mx-auto w-full flex-grow flex flex-col justify-center items-center">
        <h1 class="text-4xl font-black text-slate-900 mb-8 tracking-tight text-center">請選擇要練習的過去時間副詞</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl px-4">
            <button onclick="startGameCategory('ago')" class="choice-btn !h-auto !py-4 !text-3xl text-indigo-700 hover:bg-indigo-50 hover:border-indigo-300 !opacity-100 flex flex-col gap-1" id="btn-cat-ago">
                <span>ago</span>
                <span id="score-ago" class="text-sm font-bold text-slate-400"></span>
            </button>
            <button onclick="startGameCategory('last')" class="choice-btn !h-auto !py-4 !text-3xl text-indigo-700 hover:bg-indigo-50 hover:border-indigo-300 !opacity-100 flex flex-col gap-1" id="btn-cat-last">
                <span>last</span>
                <span id="score-last" class="text-sm font-bold text-slate-400"></span>
            </button>
            <button onclick="startGameCategory('yesterday')" class="choice-btn !h-auto !py-4 !text-3xl text-indigo-700 hover:bg-indigo-50 hover:border-indigo-300 !opacity-100 flex flex-col gap-1" id="btn-cat-yesterday">
                <span>yesterday</span>
                <span id="score-yesterday" class="text-sm font-bold text-slate-400"></span>
            </button>
            <button onclick="startGameCategory('other')" class="choice-btn !h-auto !py-4 !text-3xl text-indigo-700 hover:bg-indigo-50 hover:border-indigo-300 !opacity-100 flex flex-col gap-1" id="btn-cat-other">
                <span>其它</span>
                <span id="score-other" class="text-sm font-bold text-slate-400"></span>
            </button>
        </div>
        <!-- 常錯題型按鈕 (整欄) -->
        <div class="w-full max-w-2xl px-4 mt-4">
            <button onclick="startGameCategory('wrong')" id="btn-cat-wrong"
                class="choice-btn w-full !h-auto !py-4 !text-2xl text-rose-600 hover:bg-rose-50 hover:border-rose-300 border-rose-200 !opacity-100 flex flex-col gap-1 hidden">
                <span>🚨 常錯題型強化練習</span>
                <span id="score-wrong" class="text-sm font-bold text-rose-400"></span>
            </button>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="game-screen" class="max-w-3xl mx-auto w-full flex-grow flex flex-col justify-center hidden relative">

        <button onclick="backToHomeDirectly()"
            class="absolute top-0 left-0 bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold text-sm transition-colors shadow-sm border border-slate-200 z-10 hidden md:block">
            ← 回主選單
        </button>

        <!-- Header -->
        <header class="text-center mb-6 relative">
            <button onclick="backToHomeDirectly()"
                class="absolute top-0 left-0 bg-white hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold text-sm transition-colors shadow-sm border border-slate-200 z-10 md:hidden">
                ← 回主選單
            </button>

            <h1 class="text-3xl font-black text-slate-900 mb-1 tracking-tight">過去時間副詞選擇題挑戰</h1>
            <p class="text-md text-indigo-700 font-bold bg-indigo-50 inline-block px-4 py-1.5 rounded-full border border-indigo-100 mb-2">
                看中文提示，選出正確的英文單字吧！
            </p>
            <div class="flex justify-center gap-4 text-sm font-black">
                <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">✅ 答對：<span id="game-score">0</span></span>
                <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full">⏱ <span id="game-timer">0</span> 秒</span>
            </div>
        </header>

        <!-- -->
        <!-- Interactive Card Board -->
        <main class="space-y-3">

            <!-- Question prompt Card -->
            <div
                class="premium-card p-6 md:p-8 text-center relative overflow-hidden flex flex-col items-center justify-center min-h-[200px]">
                <div class="absolute top-3 left-3 bg-indigo-100 text-indigo-700 font-black rounded-full px-3 py-1 text-sm"
                    id="question-index-badge">
                    Q 1/17
                </div>

                <!-- Large Chinese Prompt -->
                <h2 id="chinese-prompt" class="text-4xl md:text-5xl font-black text-slate-800 tracking-wide mt-4 mb-6">
                    載入中...
                </h2>

                <!-- Helper TTS Buttons (Visual/Audio scaffolding) -->
                <div class="flex gap-3">
                    <button id="btn-speak-zh"
                        class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold py-2 px-4 rounded-xl text-sm flex items-center gap-2 border border-indigo-100 active:scale-95 transition-transform">
                        <span>🔊 聽中文提示</span>
                    </button>
                    <button id="btn-speak-en-hint"
                        class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-extrabold py-2 px-4 rounded-xl text-sm flex items-center gap-2 border border-amber-100 active:scale-95 transition-transform">
                        <span>💡 聽聽正確英文</span>
                    </button>
                </div>
                <!-- Correct Answer Overlay -->
                <div id="correct-overlay">
                    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="26" cy="26" r="25" fill="#10b981"/>
                        <path d="M14.1 27.2l7.1 7.2 16.7-16.8" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- Choices grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="choices-container">
                <!-- 4 choice buttons will be dynamically injected here -->
            </div>

            <!-- Action Area / Feedback message -->
            <div class="flex flex-col items-center gap-2 pt-1">
                <!-- Error Feedback Message (only shown for wrong answers) -->
                <div id="feedback-msg"
                    class="text-base font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300 min-h-0">
                </div>

                <!-- Next Question Button -->
                <button id="btn-next"
                    class="btn-premium bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-8 rounded-xl text-base shadow-lg transition-all hidden">
                    下一題 ➔
                </button>
            </div>

        </main>

    </div>

    <!-- -->
    <script>
        // --- DICTIONARY DATA FOR 17 PAST TIME ADVERBS ---
        const fullDictionary = [
            { en: 'one minute ago', zh: '一分鐘前', cat: 'ago' },
            { en: 'last night', zh: '昨晚', cat: 'last' },
            { en: 'yesterday morning', zh: '昨天早上', cat: 'yesterday' },
            { en: 'before', zh: '以前', cat: 'other' },
            { en: 'two days ago', zh: '兩天前', cat: 'ago' },
            { en: 'last Sunday', zh: '上個星期天', cat: 'last' },
            { en: 'yesterday afternoon', zh: '昨天下午', cat: 'yesterday' },
            { en: 'this morning', zh: '今天早上', cat: 'other' },
            { en: 'three months ago', zh: '三個月前', cat: 'ago' },
            { en: 'last April', zh: '去年四月', cat: 'last' },
            { en: 'yesterday evening', zh: '昨天傍晚', cat: 'yesterday' },
            { en: 'this afternoon', zh: '今天下午', cat: 'other' },
            { en: 'many years ago', zh: '許多年前', cat: 'ago' },
            { en: 'last time', zh: '上一次', cat: 'last' },
            { en: 'the day before yesterday', zh: '前天', cat: 'yesterday' },
            { en: 'tonight', zh: '今天晚上', cat: 'other' },
            { en: 'then', zh: '那時候', cat: 'other' }
        ];

        // Game State Variables
        let activeDictionary = [];
        let currentCategory = '';
        let questions = [];
        let currentIndex = 0;
        let isCorrectAnswerSelected = false;
        let correctCount = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;

        // LocalStorage key
        const LS_KEY = 'u5-adverb';

        // Score records per category: { score, bestTime }
        let records = { ago: null, last: null, yesterday: null, other: null };
        // Track wrong items across all categories (use en as key)
        let wrongSet = new Map(); // en -> item object

        function saveToStorage() {
            const data = {
                records,
                wrongArr: Array.from(wrongSet.entries())
            };
            try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {}
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.records) Object.assign(records, data.records);
                if (data.wrongArr) wrongSet = new Map(data.wrongArr);
            } catch(e) {}
        }

        const synth = window.speechSynthesis;

        // Clean speech input to avoid reading punctuation marks out loud
        function cleanPunctuation(text) {
            return text.replace(/[.。,?？!！;:；：’'"“”()/]/g, ' ').trim();
        }

        // Standard speak function supporting language switching
        function speak(text, isChinese = false) {
            if (!text) return;
            synth.cancel();

            const cleanText = cleanPunctuation(text);
            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = isChinese ? 'zh-TW' : 'en-US';
            utterance.rate = 0.75;

            synth.speak(utterance);
        }

        // --- ---
        // Setup questions pool by copying and shuffling original dictionary list
        function startGameCategory(cat) {
            currentCategory = cat;
            if (cat === 'wrong') {
                activeDictionary = Array.from(wrongSet.values());
            } else {
                activeDictionary = fullDictionary.filter(item => item.cat === cat);
            }
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            initGame();
        }

        function startTimer() {
            stopTimer();
            elapsedSeconds = 0;
            document.getElementById('game-timer').textContent = '0';
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                document.getElementById('game-timer').textContent = elapsedSeconds;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateHomeScores() {
            ['ago', 'last', 'yesterday', 'other'].forEach(cat => {
                const el = document.getElementById(`score-${cat}`);
                const rec = records[cat];
                if (rec !== null) {
                    el.textContent = `✅ ${rec.score}/${rec.total}  ⏱ 最佳 ${rec.bestTime}秒`;
                    el.style.color = '#10b981';
                } else {
                    el.textContent = '';
                }
            });
            // Update 常錯 button
            const wrongBtn = document.getElementById('btn-cat-wrong');
            const wrongEl = document.getElementById('score-wrong');
            if (wrongSet.size > 0) {
                wrongBtn.classList.remove('hidden');
                wrongEl.textContent = `共 ${wrongSet.size} 題曾答錯，點此加強！`;
            } else {
                wrongBtn.classList.add('hidden');
            }
        }

        function initGame() {
            questions = [...activeDictionary].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('game-score').textContent = '0';
            startTimer();
            loadQuestion();
        }

        // Load specific question details
        function loadQuestion() {
            if (currentIndex >= questions.length) {
                showOverlay();
                return;
            }

            isCorrectAnswerSelected = false;

            // Get correct pairing
            const currentQ = questions[currentIndex];

            // Build distractors (3 unique options different from current correct option)
            // We use fullDictionary here so distractors can come from any category
            const distractors = fullDictionary
                .filter(item => item.en !== currentQ.en)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);

            // Shuffled options list (1 correct + 3 distractors)
            const options = [currentQ, ...distractors].sort(() => Math.random() - 0.5);

            // Update Header Display Info
            const isRetry = !!currentQ.isRetry;
            const badge = document.getElementById('question-index-badge');
            if (isRetry) {
                badge.textContent = '⚔️ 敗部復活！';
                badge.className = 'absolute top-3 left-3 bg-rose-100 text-rose-700 font-black rounded-full px-3 py-1 text-sm';
            } else {
                const normalTotal = questions.filter(q => !q.isRetry).length;
                const normalIndex = questions.slice(0, currentIndex + 1).filter(q => !q.isRetry).length;
                badge.textContent = `Q ${normalIndex}/${normalTotal}`;
                badge.className = 'absolute top-3 left-3 bg-indigo-100 text-indigo-700 font-black rounded-full px-3 py-1 text-sm';
            }
            document.getElementById('chinese-prompt').textContent = currentQ.zh;

            // Render Options in choices container
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = option.en;
                button.addEventListener('click', () => handleOptionClick(option.en, button));
                container.appendChild(button);
            });

            // Reset action area view
            document.getElementById('btn-next').classList.add('hidden');
            clearFeedback();
            // Hide correct overlay for next question
            document.getElementById('correct-overlay').classList.remove('show');

            // Speak English answer on start of question
            speak(currentQ.en, false);
        }

        // --- ---
        // Manage Choice button click interaction
        function handleOptionClick(selectedEnglish, buttonElement) {
            // If already solved, ignore clicks
            if (isCorrectAnswerSelected) return;

            const currentQ = questions[currentIndex];

            if (selectedEnglish === currentQ.en) {
                // Correct Selection
                isCorrectAnswerSelected = true;

                if (currentQ.isRetry) {
                    // Bonus point for getting it right on retry
                    correctCount++;
                    document.getElementById('game-score').textContent = correctCount;
                    wrongSet.delete(currentQ.en);
                    showFeedback('🎉 訂回來了！補到分數了！', 'bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2');
                } else {
                    correctCount++;
                    document.getElementById('game-score').textContent = correctCount;
                    clearFeedback();
                }

                buttonElement.classList.add('correct-card');

                // Show green checkmark overlay on question card
                const overlay = document.getElementById('correct-overlay');
                overlay.classList.add('show');

                // Play English pronunciation
                speak(currentQ.en, false);

                // Hide error feedback (show nothing for correct)
                clearFeedback();

                // Enable Next Question Button
                document.getElementById('btn-next').classList.remove('hidden');

                // Visual freeze of choice container (prevent changing correct state)
                const choices = document.querySelectorAll('#choices-container .choice-btn');
                choices.forEach(btn => {
                    if (btn !== buttonElement) btn.classList.add('opacity-50', 'cursor-not-allowed');
                });
            } else {
                // Incorrect Selection — lock all, show correct
                isCorrectAnswerSelected = true;

                // Only insert retry if this isn't already a retry
                if (!currentQ.isRetry) {
                    wrongSet.set(currentQ.en, currentQ);
                    // Insert a retry copy right after current position
                    questions.splice(currentIndex + 1, 0, { ...currentQ, isRetry: true });
                }

                // Shake the clicked wrong button
                buttonElement.classList.add('incorrect-card');
                speak(currentQ.en, false); // Speak the CORRECT answer

                showFeedback(`❌ 答錯了！正確答案是：${currentQ.en}`, 'bg-rose-50 border border-rose-200 text-rose-700 px-3 py-2');

                // Highlight the correct button in green
                document.querySelectorAll('#choices-container .choice-btn').forEach(btn => {
                    if (btn.textContent === currentQ.en) btn.classList.add('correct-card');
                    else if (btn !== buttonElement) btn.classList.add('opacity-50', 'cursor-not-allowed');
                });

                // Show next button (no auto-advance)
                document.getElementById('btn-next').classList.remove('hidden');
            }
        }

        // Show feedback message card
        function showFeedback(msg, classes) {
            const feedbackEl = document.getElementById('feedback-msg');
            feedbackEl.textContent = msg;
            feedbackEl.className = `h-12 text-lg font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300 ${classes}`;
        }

        // Clear feedback card
        function clearFeedback() {
            const feedbackEl = document.getElementById('feedback-msg');
            feedbackEl.textContent = '';
            feedbackEl.className = 'h-12 text-lg font-black flex items-center justify-center rounded-2xl w-full max-w-lg transition-all duration-300';
        }

        // Next Question click trigger
        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex++;
            loadQuestion();
        });

        // Speech buttons audio trigger listeners
        document.getElementById('btn-speak-zh').addEventListener('click', () => {
            const currentQ = questions[currentIndex];
            if (currentQ) speak(currentQ.zh, true);
        });

        document.getElementById('btn-speak-en-hint').addEventListener('click', () => {
            const currentQ = questions[currentIndex];
            if (currentQ) speak(currentQ.en, false);
        });

        // --- ---
        // Overlay Management Controls
        function showOverlay() {
            stopTimer();

            // Save record for this category
            const prev = records[currentCategory];
            const isNewBest = prev === null || elapsedSeconds < prev.bestTime;
            records[currentCategory] = {
                score: correctCount,
                total: questions.filter(q => !q.isRetry).length,
                bestTime: isNewBest ? elapsedSeconds : prev.bestTime
            };
            saveToStorage();

            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            // Update summary in modal
            const summaryEl = modal.querySelector('p');
            summaryEl.innerHTML = `你超棒的！成功學會了所有過去時間副詞！<br>
                <span class="inline-block mt-2 text-emerald-600 font-black">✅ 答對 ${correctCount}/${questions.length} 題</span>
                &nbsp;
                <span class="inline-block mt-2 text-amber-600 font-black">⏱ 用時 ${elapsedSeconds} 秒${isNewBest ? '（新記錄🏆）' : ''}</span>`;

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-90');
                modal.classList.add('scale-100');

                // Speak cheerful celebration audio
                speak("Wonderful! You completed the challenge perfectly!", false);

                // Spawn vibrant confetti items
                for (let i = 0; i < 75; i++) {
                    createConfetti(overlay);
                }
            }, 10);
        }

        function restartChallenge() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');

            setTimeout(() => {
                overlay.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());

                // Shuffle and restart game loop
                initGame();
            }, 500);
        }

        function createConfetti(container) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.opacity = Math.random();
            confetti.style.transform = `scale(${Math.random() * 0.8 + 0.6})`;

            container.appendChild(confetti);
        }

        function backToHome() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');

            setTimeout(() => {
                overlay.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
                updateHomeScores();
            }, 500);
        }

        function backToHomeDirectly() {
            stopTimer();
            synth.cancel();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            updateHomeScores();
        }

        // Trigger startup on loading complete
        window.onload = function () {
            loadFromStorage();
            updateHomeScores();
        };
    </script>
</body>

</html>
