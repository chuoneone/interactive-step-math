<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 3 互動測驗：Which & How Much</title>
    <link rel="icon" href="../images/dog.png" type="image/png">

    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
        }

        .subtitle {
            color: #7f8c8d;
            margin-top: 5px;
        }

        .section-header {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.1em;
        }

        .question-card {
            margin: 20px 0;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #edeff2;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label:hover {
            background-color: #f0f7ff;
            border-color: var(--primary);
        }

        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        /* 結果樣式 */
        .correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
        }

        .wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
        }

        #submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        #submit-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        #result-display {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            margin: 10px auto;
            border: 5px solid #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">
        <header>
            <h1>七下英文 Unit 3 文法挑戰</h1>
            <p class="subtitle">範圍：Which 選擇問句 & How Much 價錢問句</p>
        </header>

        <div id="quiz-form">
            <!-- JS 會在這裡動態生成題目 -->
        </div>

        <div class="footer">
            <button id="submit-btn" onclick="calculateScore()">交卷並結算分數</button>

            <div id="result-display">
                <h2>測驗結果</h2>
                <div class="score-circle" id="score-text">0</div>
                <p id="feedback-msg"></p>
                <button onclick="location.reload()"
                    style="background:#95a5a6; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">重新挑戰</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "Which ____ Henry want, coffee or juice?", options: ["do", "does", "is", "are"], ans: 1 },
            { q: "Which ____ they like, apples or bananas?", options: ["do", "does", "are", "can"], ans: 0 },
            { q: "Which color does she like, red ____ blue?", options: ["and", "or", "but", "with"], ans: 1 },
            { q: "Which ____ your sister want for dinner, pizza or rice?", options: ["do", "does", "is", "want"], ans: 1 },
            { q: "A: Which does Amy like, cats or dogs? B: She ____ cats.", options: ["like", "likes", "do", "is"], ans: 1 },
            { q: "____ do Gary and Gina want, milk or tea?", options: ["What", "Which", "Who", "How much"], ans: 1 },
            { q: "Which fruit ____ the boys like, grapes or papayas?", options: ["do", "does", "are", "likes"], ans: 0 },
            { q: "Which ____ Gina want, the red pen or the blue one?", options: ["pen do", "pen does", "pens do", "do"], ans: 1 },
            { q: "Which do you want, cookies ____ chocolate?", options: ["or", "and", "so", "of"], ans: 0 },
            { q: "Which does your cat like, fish or meat? It ____ fish.", options: ["like", "likes", "is like", "does like"], ans: 1 },
            { q: "How much ____ the cake?", options: ["is", "are", "do", "does"], ans: 0 },
            { q: "How much ____ the kites?", options: ["is", "are", "it is", "they are"], ans: 1 },
            { q: "How much ____ the coffee?", options: ["is", "are", "be", "do"], ans: 0 },
            { q: "A: How much is the ice cream? B: ____ fifty dollars.", options: ["They are", "It is", "Is it", "There is"], ans: 1 },
            { q: "A: How much are the hamburgers? B: ____ two hundred dollars.", options: ["It is", "They are", "There are", "Are they"], ans: 1 },
            { q: "How much is the hat? It is $100. ($100 英文是？)", options: ["one thousand", "ten hundreds", "one hundred", "one dollar"], ans: 2 },
            { q: "How much ____ the red apples?", options: ["is", "are", "am", "does"], ans: 1 },
            { q: "A: How much ____ the milk? B: ____ fifty dollars.", options: ["is; It is", "are; They are", "is; They are", "are; It is"], ans: 0 },
            { q: "How much are the two pens? ____ sixty dollars.", options: ["They are", "It is", "We are", "He is"], ans: 0 },
            { q: "____ is the box? It is ninety dollars.", options: ["What", "Which", "How much", "How many"], ans: 2 }
        ];

        function initQuiz() {
            const form = document.getElementById('quiz-form');
            let html = '';

            quizData.forEach((item, index) => {
                if (index === 0) html += '<div class="section-header">第一部分：Which 選擇問句</div>';
                if (index === 10) html += '<div class="section-header">第二部分：How Much 價錢問句</div>';

                html += `
                <div class="question-card" id="q-card-${index}">
                    <div class="question-text">${index + 1}. ${item.q}</div>
                    <div class="options">
                        ${item.options.map((opt, i) => `
                            <label class="option-label" id="label-${index}-${i}">
                                <input type="radio" name="q${index}" value="${i}">
                                ( ${String.fromCharCode(65 + i)} ) ${opt}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
            });
            form.innerHTML = html;
        }

        function calculateScore() {
            let score = 0;
            let unanswered = false;

            quizData.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);

                // 標示正確答案
                const correctLabel = document.getElementById(`label-${index}-${item.ans}`);
                correctLabel.classList.add('correct');

                if (selected) {
                    const userAns = parseInt(selected.value);
                    if (userAns === item.ans) {
                        score += 5;
                    } else {
                        // 標示選錯的答案
                        const wrongLabel = document.getElementById(`label-${index}-${userAns}`);
                        wrongLabel.classList.add('wrong');
                    }
                } else {
                    unanswered = true;
                }
            });

            // 顯示結果
            const resultDisplay = document.getElementById('result-display');
            const scoreText = document.getElementById('score-text');
            const feedbackMsg = document.getElementById('feedback-msg');
            const submitBtn = document.getElementById('submit-btn');

            scoreText.innerText = score;
            resultDisplay.style.display = 'block';
            submitBtn.style.display = 'none';

            if (score === 100) {
                feedbackMsg.innerHTML = "太棒了！你完美掌握了 Unit 3 的文法！🌟";
            } else if (score >= 80) {
                feedbackMsg.innerHTML = "表現優異！離滿分不遠了喔！💪";
            } else if (score >= 60) {
                feedbackMsg.innerHTML = "及格了！記得看看紅色的題目訂正一下。✍️";
            } else {
                feedbackMsg.innerHTML = "別灰心！再看一次「重點速記表」，多練習幾次就會進步！🔥";
            }

            // 捲動到結果區
            resultDisplay.scrollIntoView({ behavior: 'smooth' });

            // 禁用所有 Radio 按鈕防止更改
            const allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(r => r.disabled = true);
        }

        // 初始化測驗
        window.onload = initQuiz;
    </script>

</body>

</html>
