<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Unit 5 Grammar Focus 1 (be動詞過去式) 句子重組</title>
    <link rel="icon" href="dog.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-indigo: #4f46e5;
            --primary-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --success-emerald: #10b981;
            --error-rose: #f43f5e;
            --bg-dots: #e2e8f0;
        }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Premium Soft Shadows & Card Borders for Special Education */
        .premium-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08), 0 8px 10px -6px rgba(79, 70, 229, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Large, highly readable word cards for sensory-friendly interactions */
        .word-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 18px;
            color: #1e293b;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #cbd5e1;
            font-size: 1.25rem;
            margin: 6px;
            min-height: 52px;
        }

        .word-item:hover {
            border-color: var(--primary-blue);
            color: var(--primary-indigo);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cbd5e1;
        }

        /* 特教專用：be動詞紅色視覺強化樣式 */
        .word-item.be-verb-highlight {
            color: #ef4444 !important;
            border-color: #fca5a5 !important;
            background-color: #fff5f5 !important;
            box-shadow: 0 4px 0 #fca5a5 !important;
        }

        .word-item.be-verb-highlight:hover {
            border-color: #ef4444 !important;
            box-shadow: 0 6px 0 #fca5a5 !important;
        }

        .word-item.be-verb-highlight:active {
            transform: translateY(4px);
            box-shadow: none !important;
            background-color: #fee2e2 !important;
        }

        /* Active styling inside the drop zone */
        .drop-zone .word-item {
            border-color: var(--primary-indigo);
            box-shadow: 0 4px 0 #c7d2fe;
            background-color: #f5f3ff;
        }

        /* 確保作答區內的 be動詞依然保持紅色高亮特徵 */
        .drop-zone .word-item.be-verb-highlight {
            border-color: #f87171 !important;
            box-shadow: 0 4px 0 #fca5a5 !important;
            background-color: #fff1f2 !important;
        }

        /* Drop Zone Styles */
        .drop-zone {
            min-height: 84px;
            background-color: #f8fafc;
            border: 3px dashed #94a3b8;
            border-radius: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 16px;
            width: 100%;
        }

        /* Optimized Spacing: English vs Chinese */
        .drop-zone.en-layout {
            gap: 8px;
        }

        .drop-zone.zh-layout {
            gap: 0px !important;
        }

        .drop-zone.zh-layout .word-item {
            margin: 2px 0px !important;
            border-radius: 8px !important;
        }

        .drop-zone:empty::before {
            content: attr(data-placeholder);
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
            text-align: center;
            padding: 12px;
        }

        /* Visual Feedback States */
        .drop-zone.correct {
            background-color: #ecfdf5;
            border-color: var(--success-emerald);
            border-style: solid;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .drop-zone.incorrect {
            background-color: #fff1f2;
            border-color: var(--error-rose);
            border-style: solid;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* Sensory friendly tactile button styles */
        .btn-premium {
            box-shadow: 0 4px 0 #312e81;
            transition: all 0.15s ease;
        }

        .btn-premium:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Tooltip styling for definitions */
        #dict-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            background: #1e293b;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            display: none;
            transform: translate(-50%, -130%);
            white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 2px solid #475569;
        }

        #dict-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -8px;
            border-width: 8px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        /* Keyframes Animations */
        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }

        /* Checkmark Animation */
        .checkmark-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {

            0%,
            100% {
                transform: none;
            }

            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 80px #10b981;
            }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            animation: confetti-fall 3.5s linear forwards;
            border-radius: 50%;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 pb-20">

    <!-- Floating Translation Tooltip -->
    <div id="dict-tooltip"></div>

    <!-- Completion Overlay -->
    <div id="completion-overlay"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-[32px] shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative border-4 border-indigo-200"
            id="completion-modal">
            <div class="checkmark-wrapper mb-6">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                </svg>
            </div>
            <h2 class="text-4xl font-extrabold text-indigo-900 mb-3 animate-bounce">超級無敵棒！🎉</h2>
            <p class="text-slate-600 text-lg mb-8 font-medium">你用最清晰的視覺與智慧，完成了所有 be動詞過去式 的挑戰！</p>
            <button onclick="closeOverlay()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xl px-8 py-4 rounded-2xl font-bold transition shadow-lg btn-premium">
                太棒了，再試一次！
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-3xl mx-auto">

        <!-- Header -->
        <header class="text-center mb-8">

            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2 tracking-tight">Unit 5 Grammar Focus 1</h1>
            <p
                class="text-lg text-indigo-700 font-bold bg-indigo-50 inline-block px-4 py-1.5 rounded-full border border-indigo-100 mb-4">
                be動詞過去式 句子重組 (課本 p.97-98)
            </p>

            <!-- TTS Speech Speed Controller -->
            <div
                class="max-w-xs mx-auto mb-6 bg-white p-3 rounded-2xl border-2 border-slate-200 shadow-sm flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500 px-1">
                    <span>🐢 慢速</span>
                    <span class="text-indigo-600">🔊 調整語音速度</span>
                    <span>🐇 快速</span>
                </div>
                <input type="range" id="speech-rate" min="0.4" max="1.1" step="0.1" value="0.75"
                    class="w-full accent-indigo-600 cursor-pointer">
            </div>

            <!-- Dynamic Progress Tracker -->
            <div class="max-w-md mx-auto bg-white p-4 rounded-3xl border-2 border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-extrabold text-slate-500">任務完成進度</span>
                    <span id="progress-percent" class="text-sm font-black text-indigo-600">0%</span>
                </div>
                <div class="h-4 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                    <div id="progress-bar"
                        class="h-full bg-gradient-to-r from-indigo-500 to-blue-500 transition-all duration-500 ease-out"
                        style="width: 0%"></div>
                </div>
                <p class="text-sm font-bold text-slate-600 mt-2 text-center" id="progress-text">已完成 0 / 6 題</p>
            </div>
        </header>

        <!-- Static Lesson Card / Example -->
        <div class="premium-card p-6 mb-8 border-l-8 border-l-amber-500 bg-amber-50/40">
            <div class="flex items-center gap-3 mb-3">
                <span
                    class="flex items-center justify-center w-8 h-8 rounded-full bg-amber-100 text-amber-700 font-black text-base">★</span>
                <h3 class="text-lg font-black text-amber-900">學習範例 (Example)</h3>
            </div>
            <p class="text-slate-700 font-bold mb-2">請依提示將句子改寫：</p>
            <div class="bg-white p-4 rounded-xl border border-amber-200 shadow-inner">
                <div class="text-sm font-bold text-slate-500">原句與提示：</div>
                <div class="text-base font-black text-slate-800 mb-2">Winnie <span
                        class="text-red-500 font-extrabold underline decoration-2">is</span> short.（加上last year）</div>
                <div class="text-sm font-bold text-slate-500">改寫成：</div>
                <div class="text-lg font-black text-indigo-700 flex items-center gap-2">
                    Winnie <span class="text-red-600 font-black underline decoration-4">was</span> short last year.
                    <button
                        class="w-7 h-7 bg-indigo-100 text-indigo-700 rounded-full inline-flex items-center justify-center hover:bg-indigo-600 hover:text-white transition active:scale-95"
                        onclick="speak('Winnie was short last year.')" title="聽發音">
                        🔊
                    </button>
                </div>
            </div>
        </div>

        <!-- Exercises Container -->
        <main id="exercises-container" class="space-y-8">
            <!-- Dynamic Exercises will be rendered here -->
        </main>

    </div>

    <script>
        // --- DICTIONARY FOR SPECIAL EDUCATION HINTS (Tooltips) ---
        const dictionary = {
            'Rachel': '瑞秋 (人名)',
            'Tiffany': '蒂芬妮 (人名)',
            'Winnie': '維尼 (人名)',
            'and': '和 / 與',
            'are': '是 (現在式複數)',
            'is': '是 (現在式單數)',
            'were': '是 (are的過去式)',
            'was': '是 (is/am的過去式)',
            'wasn\'t': '不是 (was not 的縮寫)',
            'weren\'t': '不是 (were not 的縮寫)',
            'good': '好的',
            'friends': '朋友 (複數)',
            'before': '以前 / 在...之前',
            'at': '在 (某特定時間/地點)',
            'There': '那裡 (There was/were 表示過去有...)',
            'a': '一個',
            'park': '公園',
            'near': '在...附近',
            'my': '我的',
            'house': '房子 / 家',
            'two': '二 / 2',
            'years': '年 (複數)',
            'ago': '以前 (用於過去時間)',
            'Kelly': '凱莉 (人名)',
            'not': '不 / 沒有 (否定詞)',
            'the': '這 / 那',
            'beach': '海灘 / 沙灘',
            'day': '日 / 一天',
            'yesterday': '昨天',
            'the day before yesterday': '前天',
            'before yesterday': '昨天之前 (前天)',
            'three': '三 / 3',
            'people': '人們 / 人 (複數)',
            'Olivia\'s': '奧莉薇亞的',
            'kitchen': '廚房',
            'last': '上一個的',
            'weekend': '週末',
            'Who': '誰',
            'on': '在...上面',
            'hill': '山丘',
            'night': '夜晚',
            'last night': '昨晚',
            'you': '你 / 你們',
            'with': '和...一起 / 伴隨',
            'by': '在...旁邊',
            'lake': '湖泊',
            'then': '那時候 / 當時',
            '.': '。',
            '?': '？'
        };

        // --- EXERCISES DATA ---
        const exercises = [
            {
                id: 'ex1',
                label: '第 1 題',
                prompt: '1. Rachel and Tiffany <span class="text-red-500 font-extrabold underline decoration-2">are</span> good friends.（加上before）',
                expectedHint: '改寫成：Rachel and Tiffany were good friends before.',
                answer: 'Rachel and Tiffany were good friends before.',
                chunks: ['Rachel', 'and', 'Tiffany', 'were', 'good', 'friends', 'before', '.'],
                lang: 'en-US'
            },
            {
                id: 'ex2',
                label: '第 2 題',
                prompt: '2. There <span class="text-red-500 font-extrabold underline decoration-2">is</span> a park near my house.（加上two years ago）',
                expectedHint: '改寫成：There was a park near my house two years ago.',
                answer: 'There was a park near my house two years ago.',
                chunks: ['There', 'was', 'a', 'park', 'near', 'my', 'house', 'two', 'years', 'ago', '.'],
                lang: 'en-US'
            },
            {
                id: 'ex3',
                label: '第 3 題',
                prompt: '3. Kelly <span class="text-red-500 font-extrabold underline decoration-2">is</span> at the beach.(加入「前天」並改成否定)',
                expectedHint: '改寫成：Kelly was not at the beach the day before yesterday.',
                answer: 'Kelly was not at the beach the day before yesterday.',
                chunks: ['Kelly', 'was', 'not', 'at', 'the', 'beach', 'the', 'day', 'before', 'yesterday', '.'],
                lang: 'en-US'
            },
            {
                id: 'ex4',
                label: '第 4 題',
                prompt: '4. There <span class="text-red-500 font-extrabold underline decoration-2">are</span> three people at Olivia’s kitchen.（加入「上週末」並改成否定）',
                expectedHint: '改寫成：There were not three people at Olivia\'s kitchen last weekend.',
                answer: 'There were not three people at Olivia\'s kitchen last weekend.',
                chunks: ['There', 'were', 'not', 'three', 'people', 'at', 'Olivia\'s', 'kitchen', 'last', 'weekend', '.'],
                lang: 'en-US'
            },
            {
                id: 'ex5',
                label: '第 5 題',
                prompt: '5. Who <span class="text-red-500 font-extrabold underline decoration-2">is</span> on the hill?（加上「昨晚」）',
                expectedHint: '改寫成：Who was on the hill last night?',
                answer: 'Who was on the hill last night?',
                chunks: ['Who', 'was', 'on', 'the', 'hill', 'last', 'night', '?'],
                lang: 'en-US'
            },
            {
                id: 'ex6',
                label: '第 6 題',
                prompt: '6. Who <span class="text-red-500 font-extrabold underline decoration-2">are</span> you with by the lake? (加入「那時候」)',
                expectedHint: '改寫成：Who were you with by the lake then?',
                answer: 'Who were you with by the lake then?',
                chunks: ['Who', 'were', 'you', 'with', 'by', 'the', 'lake', 'then', '?'],
                lang: 'en-US'
            }
        ];

        let completedCount = 0;
        const totalCount = exercises.length;
        const synth = window.speechSynthesis;

        // --- SPEECH ENGINE (With Dynamic Speed Control) ---
        function getSpeechRate() {
            const slider = document.getElementById('speech-rate');
            return slider ? parseFloat(slider.value) : 0.75;
        }

        function speak(text) {
            if (!text) return;
            synth.cancel();

            // Filter out punctuation characters for clean vocalization
            const cleanText = text.replace(/[.。,?？!！;:；：’'"“”]/g, ' ').trim();
            if (!cleanText) return;

            const utterThis = new SpeechSynthesisUtterance(cleanText);

            // Smart Language Detection: Check if there's any Chinese characters
            const hasChinese = /[\u4e00-\u9fa5]/.test(cleanText);
            utterThis.lang = hasChinese ? 'zh-TW' : 'en-US';
            utterThis.rate = getSpeechRate();

            synth.speak(utterThis);
        }

        // --- STREAMING_CHUNK: Dynamic App Generation with Be-verb highlighting ---
        // Render App UI
        function renderApp() {
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            // 定義 be動詞清單以進行比對高亮
            const beVerbs = ['is', 'are', 'was', 'were', "wasn't", "weren't", 'am', "isn't", "aren't"];
            const isBeVerb = (word) => {
                const cleanWord = word.toLowerCase().replace(/[.,?？]/g, '').trim();
                return beVerbs.includes(cleanWord);
            };

            exercises.forEach((ex, index) => {
                const card = document.createElement('div');
                card.className = 'premium-card p-6 sm:p-8 relative';
                card.id = `card-${ex.id}`;
                card.dataset.id = ex.id;

                // Randomize Chunk Order initially
                const shuffledChunks = [...ex.chunks].sort(() => Math.random() - 0.5);

                // 判斷是否為最後兩題（第5、6題不使用紅色提示）
                const disableRedHint = index >= exercises.length - 2;

                card.innerHTML = `
                    <!-- Exercise Header -->
                    <div class="mb-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-extrabold text-sm border-2 border-indigo-200">
                                ${ex.label.replace('第', '').replace('題', '').trim()}
                            </span>
                            <h2 class="text-xl font-extrabold text-slate-800">${ex.label}</h2>
                        </div>
                        <button class="w-10 h-10 bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white rounded-full flex items-center justify-center transition active:scale-90" onclick="speak('${ex.answer.replace(/'/g, "\\'")}')" title="聽整句正確發音">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                            </svg>
                        </button>
                    </div>

                    <!-- Question Prompts -->
                    <div class="bg-indigo-50/50 rounded-2xl p-4 border border-indigo-100/60 mb-6">
                        <div class="text-sm font-bold text-indigo-400 mb-1">【改寫題目與提示】</div>
                        <div class="text-lg font-extrabold text-slate-800">${ex.prompt}</div>
                    </div>

                    <!-- Drop Zone -->
                    <div class="mb-6">
                        <div class="text-sm font-bold text-slate-400 mb-2 flex justify-between items-center">
                            <span>請在這裡排列句子：</span>
                            <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-extrabold">排版對齊</span>
                        </div>
                        <div class="drop-zone en-layout" id="zone-${ex.id}" data-placeholder="👆 點擊下方的單字卡來組裝句子"></div>
                    </div>

                    <!-- Word Bank -->
                    <div class="mb-6">
                        <div class="text-sm font-bold text-slate-400 mb-2">單字卡片庫：</div>
                        <div class="word-bank flex flex-wrap gap-2 justify-center py-4 px-2 bg-slate-50 rounded-2xl border-2 border-slate-100" id="bank-${ex.id}">
                            ${shuffledChunks.map(word => {
                    // 如果是最後兩題，強制不套用 be-verb-highlight 樣式
                    const isBe = !disableRedHint && isBeVerb(word);
                    const highlightClass = isBe ? 'be-verb-highlight' : '';
                    return `<div class="word-item ${highlightClass}">${word}</div>`;
                }).join('')}
                        </div>
                    </div>

                    <!-- Action Row -->
                    <div class="flex flex-wrap items-center gap-3">
                        <button class="btn-action check-btn bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 px-8 rounded-2xl transition-colors text-base flex-grow sm:flex-grow-0 btn-premium" data-id="${ex.id}">
                            檢查答案
                        </button>
                        <button class="btn-action reset-btn bg-white hover:bg-slate-50 text-slate-600 border-2 border-slate-200 font-extrabold py-3 px-6 rounded-2xl transition-all text-base hover:border-slate-300" data-id="${ex.id}">
                            重置重來
                        </button>
                    </div>

                    <!-- Status Feedback Box -->
                    <div class="feedback-msg mt-4 h-8 text-base font-black flex items-center justify-center rounded-xl transition-all duration-300"></div>
                `;
                container.appendChild(card);
            });
            attachTouchOptimizations();
        }

        // --- STREAMING_CHUNK: Event Handling and Interaction Logic ---
        // Global Click Event Handling
        document.body.addEventListener('click', (e) => {
            const target = e.target;

            // 1. Click on word items
            if (target.classList.contains('word-item')) {
                const card = target.closest('.premium-card');
                if (!card) return;
                const exId = card.dataset.id;
                const bank = document.getElementById(`bank-${exId}`);
                const zone = document.getElementById(`zone-${exId}`);

                // Speak individual word immediately on tap
                speak(target.innerText);

                // Transfer elements
                if (target.parentElement === bank) {
                    zone.appendChild(target);
                } else {
                    bank.appendChild(target);
                }

                // Clear feedback on editing
                const feedbackEl = card.querySelector('.feedback-msg');
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback-msg mt-4 h-8 text-base font-black flex items-center justify-center rounded-xl transition-all duration-300';
                zone.classList.remove('correct', 'incorrect');
                return;
            }

            // 2. Click Check Answer Button
            if (target.classList.contains('check-btn')) {
                const id = target.dataset.id;
                checkAnswer(id);
                return;
            }

            // 3. Click Reset Button
            if (target.classList.contains('reset-btn')) {
                const id = target.dataset.id;
                resetQuestion(id);
                return;
            }
        });

        // --- HINT DICTIONARY (MOUSE HOVER & TOUCH LONG PRESS) ---
        let touchTimeout;
        const tooltip = document.getElementById('dict-tooltip');

        function showTooltip(elem, text) {
            const translation = dictionary[text];
            if (translation) {
                tooltip.textContent = translation;
                tooltip.style.display = 'block';
                const rect = elem.getBoundingClientRect();

                // Position above the hovered card
                tooltip.style.left = `${rect.left + rect.width / 2}px`;
                tooltip.style.top = `${rect.top}px`;
            }
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // Event Listeners for Tooltips
        document.body.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('word-item')) {
                // Normalize word lookup by removing trailing punctuation
                const wordText = e.target.innerText.replace(/[.,?]/g, '').trim();
                showTooltip(e.target, wordText);
            }
        });

        document.body.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('word-item')) {
                hideTooltip();
            }
        });

        // Touch Long-Press and Tap support for Tablets (iPad)
        function attachTouchOptimizations() {
            const cards = document.querySelectorAll('.word-item');
            cards.forEach(card => {
                card.addEventListener('touchstart', (e) => {
                    const wordText = card.innerText.replace(/[.,?]/g, '').trim();
                    touchTimeout = setTimeout(() => {
                        showTooltip(card, wordText);
                        // Haptic feedback if supported
                        if (navigator.vibrate) navigator.vibrate(30);
                    }, 500); // 500ms for long press
                }, { passive: true });

                card.addEventListener('touchend', () => {
                    clearTimeout(touchTimeout);
                    setTimeout(hideTooltip, 1200); // Delay hiding so special ed students have time to read
                }, { passive: true });

                card.addEventListener('touchmove', () => {
                    clearTimeout(touchTimeout);
                    hideTooltip();
                }, { passive: true });
            });
        }

        // --- STREAMING_CHUNK: Evaluation and Progression Systems ---
        // Evaluate user spelling sequence
        function checkAnswer(id) {
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback-msg');
            const exData = exercises.find(e => e.id === id);

            const userTokens = Array.from(zone.children).map(el => el.innerText.trim());

            // Format sentence comparing spaces dynamically
            const userSentence = userTokens.join(' ')
                .replace(/\s+([.,?])/g, '$1') // remove space before punctuation
                .replace(/\s+/g, ' ')
                .trim();

            const expectedSentence = exData.answer.replace(/\s+/g, ' ').trim();

            if (userSentence === expectedSentence) {
                // Correct State
                feedbackEl.innerHTML = '<span class="text-emerald-700 flex items-center gap-2">🎉 非常完美！拼寫完全正確！</span>';
                feedbackEl.className = 'feedback-msg mt-4 h-10 text-base font-black flex items-center justify-center rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 transition-all duration-300';
                zone.classList.remove('incorrect');
                zone.classList.add('correct');

                // Read correct sentence out loud slowly to reinforce learning
                speak(exData.answer);

                if (!card.dataset.completed) {
                    card.dataset.completed = 'true';
                    updateProgress(1);
                }
            } else {
                // Error State (Triggers Shake)
                feedbackEl.innerHTML = '<span class="text-rose-600 flex items-center gap-2">🤔 好像有地方錯囉，再排列看看！</span>';
                feedbackEl.className = 'feedback-msg mt-4 h-10 text-base font-black flex items-center justify-center rounded-xl bg-rose-50 border border-rose-200 text-rose-600 transition-all duration-300';
                zone.classList.remove('correct');
                zone.classList.add('incorrect');

                // Shake tactile feedback
                zone.style.animation = 'none';
                zone.offsetHeight; // force reflow
                zone.style.animation = null;
            }
        }

        // Reset single item
        function resetQuestion(id) {
            const bank = document.getElementById(`bank-${id}`);
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback-msg');

            // Move children back to the selection box
            Array.from(zone.children).forEach(child => bank.appendChild(child));

            // Re-shuffle letters for safety
            const words = Array.from(bank.children);
            words.sort(() => Math.random() - 0.5);
            words.forEach(w => bank.appendChild(w));

            // Reset classes
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback-msg mt-4 h-8 text-base font-black flex items-center justify-center rounded-xl transition-all duration-300';
            zone.classList.remove('correct', 'incorrect');

            if (card.dataset.completed) {
                delete card.dataset.completed;
                updateProgress(-1);
            }
        }

        // Track overall assignment progression
        function updateProgress(change) {
            completedCount += change;
            completedCount = Math.max(0, Math.min(completedCount, totalCount));

            const percentage = Math.round((completedCount / totalCount) * 100);
            const bar = document.getElementById('progress-bar');
            const percentText = document.getElementById('progress-percent');
            const infoText = document.getElementById('progress-text');

            bar.style.width = `${percentage}%`;
            percentText.textContent = `${percentage}%`;
            infoText.textContent = `已完成 ${completedCount} / ${totalCount} 題`;

            if (completedCount === totalCount) {
                bar.classList.remove('from-indigo-500', 'to-blue-500');
                bar.classList.add('from-emerald-500', 'to-teal-500');
                showOverlay();
            } else {
                bar.classList.add('from-indigo-500', 'to-blue-500');
                bar.classList.remove('from-emerald-500', 'to-teal-500');
            }
        }

        // --- STREAMING_CHUNK: Celebration Systems (Confetti) ---
        // Overlay Show
        function showOverlay() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-90');
                modal.classList.add('scale-100');

                // Trigger confetti loop
                for (let i = 0; i < 70; i++) {
                    createConfetti(overlay);
                }
            }, 10);
        }

        // Overlay Close
        window.closeOverlay = function () {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');

            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');

            setTimeout(() => {
                overlay.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());

                // Reload or Reset All
                exercises.forEach(ex => resetQuestion(ex.id));
            }, 500);
        }

        // Create individual colorful celebration particle
        function createConfetti(container) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; // random speed
            confetti.style.opacity = Math.random();
            confetti.style.transform = `scale(${Math.random() * 0.8 + 0.6})`;

            container.appendChild(confetti);
        }

        // Startup execution
        window.onload = function () {
            renderApp();
        };
    </script>
</body>

</html>
