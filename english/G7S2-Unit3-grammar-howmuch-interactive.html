<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How much is it? 互動式購物對話</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            /* 使用較為圓潤活潑的字體 */
            background-color: #dbeafe;
            /* light blue background */
        }

        .speech-bubble {
            position: relative;
            background: white;
            border-radius: .4em;
            padding: 15px 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 2px solid #cbd5e1;
            display: inline-block;
            font-size: 1.25rem;
        }

        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 0;
            height: 0;
            border: 15px solid transparent;
            border-top-color: white;
            border-bottom: 0;
            border-left: 0;
            margin-left: -7.5px;
            margin-bottom: -15px;
        }

        .speech-bubble-border:after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            width: 0;
            height: 0;
            border: 16px solid transparent;
            border-top-color: #cbd5e1;
            border-bottom: 0;
            border-left: 0;
            margin-left: -8px;
            margin-bottom: -16px;
            z-index: -1;
        }

        .speaker-btn {
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s, transform 0.1s;
        }

        .speaker-btn:hover {
            color: #3b82f6;
            transform: scale(1.1);
        }

        .speaker-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white bg-opacity-50 rounded-3xl p-6 shadow-xl">

        <!-- Menu Board -->
        <div class="bg-gradient-to-b from-sky-400 to-sky-500 rounded-2xl p-6 mb-8 shadow-inner border-4 border-sky-300">
            <h2 class="text-white text-center text-xl font-bold mb-4 tracking-wider opacity-80">點擊商品來練習對話！</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="menu-container">
                <!-- Menu items will be injected here by JS -->
            </div>
        </div>

        <!-- Dialogue Section -->
        <div class="flex flex-col md:flex-row justify-around items-end gap-8 mt-12 px-4">

            <!-- Customer -->
            <div class="flex flex-col items-center w-full md:w-1/2">
                <div class="speech-bubble speech-bubble-border mb-6 w-full text-center">
                    <i class="fa-solid fa-volume-high speaker-btn mr-2" onclick="speakQuestion()"></i>
                    <span id="question-text">
                        <span class="text-green-600 font-bold">How much</span>
                        <span id="q-verb" class="font-bold">is</span> the
                        <span id="q-item" class="font-bold">juice</span>?
                    </span>
                </div>
                <!-- Customer Avatar (Emoji for simplicity and cross-device consistency) -->
                <div class="text-8xl">🧑</div>
            </div>

            <!-- Clerk -->
            <div class="flex flex-col items-center w-full md:w-1/2">
                <div class="speech-bubble speech-bubble-border mb-6 w-full text-center">
                    <i class="fa-solid fa-volume-high speaker-btn mr-2" onclick="speakAnswer()"></i>
                    <span id="answer-text">
                        <span id="a-pronoun" class="font-bold">It is</span>
                        <span id="a-price" class="font-bold">fifty</span> dollars.
                    </span>
                </div>
                <!-- Clerk Avatar -->
                <div class="text-8xl">👩‍🍳</div>
            </div>

        </div>
    </div>

    <script>
        // 商品資料庫
        const menuItems = {
            sandwich: { name: 'sandwich', icon: '🥪', price: 80, priceText: 'eighty', type: 'singular' },
            hot_dog: { name: 'hot dog', icon: '🌭', price: 70, priceText: 'seventy', type: 'singular' },
            cookies: { name: 'cookies', icon: '🍪', price: 40, priceText: 'forty', type: 'plural' },
            hot_coffee: { name: 'hot coffee', icon: '☕', price: 90, priceText: 'ninety', type: 'singular' },
            tea: { name: 'tea', icon: '🍵', price: 45, priceText: 'forty-five', type: 'singular' },
            ice_cream: { name: 'ice cream', icon: '🍨', price: 50, priceText: 'fifty', type: 'singular' },
            juice: { name: 'juice', icon: '🧃', price: 50, priceText: 'fifty', type: 'singular' }
        };

        let currentItem = 'juice'; // 預設商品

        // 渲染菜單
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            for (const key in menuItems) {
                const item = menuItems[key];
                const isSelected = currentItem === key;

                const btn = document.createElement('button');
                btn.className = `flex items-center justify-center gap-3 p-3 rounded-xl transition-all duration-200 
                                ${isSelected ? 'bg-yellow-100 ring-4 ring-yellow-400 transform scale-105 shadow-lg' : 'bg-white/90 hover:bg-white hover:scale-105 shadow'}`;
                btn.onclick = () => selectItem(key);

                btn.innerHTML = `
                    <div class="text-4xl drop-shadow-md">${item.icon}</div>
                    <div class="text-left">
                        <div class="text-sky-600 font-bold text-xl">$${item.price}</div>
                        <div class="text-gray-600 text-sm font-semibold">${item.name}</div>
                    </div>
                `;
                container.appendChild(btn);
            }
        }

        // 選擇商品並更新對話
        function selectItem(key) {
            currentItem = key;
            const item = menuItems[key];

            // 更新畫面
            renderMenu();

            // 更新問題
            document.getElementById('q-verb').innerText = item.type === 'singular' ? 'is' : 'are';
            document.getElementById('q-item').innerText = item.name;

            // 更新回答
            document.getElementById('a-pronoun').innerText = item.type === 'singular' ? 'It is' : 'They are';
            document.getElementById('a-price').innerText = item.priceText;
        }

        // 語音朗讀功能 (Web Speech API)
        function speak(text) {
            if ('speechSynthesis' in window) {
                // 停止目前的朗讀
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                // 稍微放慢語速，適合學習者
                utterance.rate = 0.85;
                utterance.pitch = 1.1;

                window.speechSynthesis.speak(utterance);
            } else {
                alert("抱歉，您的瀏覽器不支援語音朗讀功能。");
            }
        }

        function speakQuestion() {
            const item = menuItems[currentItem];
            const verb = item.type === 'singular' ? 'is' : 'are';
            speak(`How much ${verb} the ${item.name}?`);
        }

        function speakAnswer() {
            const item = menuItems[currentItem];
            const pronoun = item.type === 'singular' ? 'It is' : 'They are';
            speak(`${pronoun} ${item.priceText} dollars.`);
        }

        // 初始化
        window.onload = () => {
            renderMenu();
            selectItem('juice'); // 初始設定為 juice
        };
    </script>
</body>

</html>
