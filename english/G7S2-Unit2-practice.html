<html lang="zh-Hant">

<head>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }

        .word { position: relative; cursor: pointer; border-bottom: 1px dotted #a8a29e; transition: color .2s; }
        .word:hover { color: #d97706; }
        .word .tooltip {
            visibility: hidden; width: max-content; max-width: 140px;
            background: #1f2937; color: #fff; text-align: center;
            border-radius: 6px; padding: 4px 8px; position: absolute;
            z-index: 20; bottom: 130%; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity .3s; pointer-events: none; font-size: .75rem;
        }
        .word:hover .tooltip { visibility: visible; opacity: 1; }

        .sb-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 9px 12px; border-radius: 10px; font-weight: 700;
            font-size: .875rem; color: #78716c; cursor: pointer; transition: all .2s;
            background: transparent; border: 2px solid transparent; text-align: left;
        }
        .sb-btn:hover { background: #fef3c7; color: #92400e; }
        .sb-btn.active { background: #fde68a; color: #92400e; border-color: #fcd34d; }

        .badge { font-size: .65rem; border-radius: 999px; padding: 2px 7px; font-weight: 700; }
        .badge-ok { background: #dcfce7; color: #16a34a; }
        .badge-fail { background: #fee2e2; color: #dc2626; }
        .badge-none { background: #f5f5f4; color: #a8a29e; }

        /* Fill-in game (Section A) */
        .fill-blank {
            display: inline-block; min-width: 80px; border-bottom: 2px solid #d6d3d1;
            text-align: center; cursor: pointer; padding: 2px 8px;
            color: #92400e; font-weight: 700; transition: all .2s;
        }
        .fill-blank:hover { border-color: #f59e0b; }
        .fill-blank.filled { border-color: #f59e0b; background: #fef3c7; border-radius: 6px; }
        .fill-blank.correct { border-color: #22c55e; background: #dcfce7; border-radius: 6px; color: #16a34a; }
        .fill-blank.wrong { border-color: #ef4444; background: #fee2e2; border-radius: 6px; color: #dc2626; }

        .word-chip {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 16px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .95rem; transition: all .15s; border: 2px solid #d6d3d1;
            background: #fff; color: #44403c; user-select: none;
        }
        .word-chip:hover { border-color: #fbbf24; background: #fefce8; }
        .word-chip.used { opacity: .3; pointer-events: none; border-style: dashed; }

        /* Reorder game */
        .reorder-word {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .95rem; transition: all .15s; border: 2px solid #d6d3d1;
            background: #fff; color: #44403c; user-select: none;
        }
        .reorder-word:hover { border-color: #fbbf24; background: #fefce8; }
        .reorder-word.used { opacity: .3; pointer-events: none; border-style: dashed; }
        .answer-slot {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600;
            font-size: .95rem; transition: all .15s; border: 2px solid #f59e0b;
            background: #fef3c7; color: #92400e;
        }
        .answer-slot:hover { background: #fde68a; }
        .answer-zone {
            min-height: 52px; border: 2px dashed #d6d3d1; border-radius: 12px;
            padding: 10px; display: flex; flex-wrap: wrap; gap: 8px;
            align-items: center; background: #fafaf9;
        }
        .answer-zone.correct { border-color: #22c55e; background: #dcfce7; }
        .answer-zone.wrong { border-color: #ef4444; background: #fee2e2; animation: shake .4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0) }
            25% { transform: translateX(-6px) }
            75% { transform: translateX(6px) }
        }
    </style>
</head>

                A: { title: "大題 A", sub: "Read and Write｜根據句意填入適當的單字 (10%，每題2分)" },
                B: { title: "大題 B", sub: "Circle the Correct Answer｜圈出與句意相符的頻率副詞 (12%，每題3分)" },
                C: { title: "大題 C", sub: "Fill in the Blanks｜根據圖片填入正確的答案 (24%，每格3分)" },
                D: { title: "大題 D", sub: "Fill in the Blanks｜依例填入正確的次數 (9%，每題3分)" },
                E: { title: "大題 E", sub: "Look and Answer｜看圖重組句子 (15%，每題5分)" },
                F: { title: "大題 F", sub: "Choose｜選出正確的答案 (8%，每題4分)" },
                G: { title: "大題 G", sub: "Read and Choose｜閱讀對話，選出正確的答案 (12%，每題4分)" },
                H: { title: "大題 H", sub: "Read and Choose｜閱讀訊息，選出正確的答案 (10%，每題5分)" }
            };

            // Total blanks for Section C
            const C_TOTAL = 8;

            let curSec = 'A', curIdx = 0, score = 0;

            // --- DOM ---
            const qWrap = document.getElementById('q-wrap');
            const controls = document.getElementById('controls');
            const scoredisp = document.getElementById('score-disp');
            const progBar = document.getElementById('prog-bar');
            const progText = document.getElementById('prog-text');
            const secTitle = document.getElementById('sec-title');
            const secSub = document.getElementById('sec-sub');
            const sidebarNav = document.getElementById('sidebar-nav');
            const scoreSummary = document.getElementById('score-summary');
            const liveScore = document.getElementById('live-score');
            const liveTotal = document.getElementById('live-total');
            const alertModal = document.getElementById('alert-modal');
            const alertMsg = document.getElementById('alert-msg');
            const alertClose = document.getElementById('alert-close');
            const clearBtn = document.getElementById('clear-btn');

            // --- Storage ---
            function loadScores() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }
            function saveScore(sec, sc, tot) {
                const d = loadScores();
                d[sec] = { score: sc, total: tot, pct: Math.round(sc / tot * 100), at: (new Date()).toLocaleString('zh-TW') };
                localStorage.setItem(STORE, JSON.stringify(d));
            }

            // --- Helpers ---
            function mkInteractive(text) {
                return text.split(/([a-zA-Z''.]+)/).map(p => {
                    const k = p.toLowerCase().replace(/'/g, "'");
                    return tr[k] ? `<span class="word">${p}<span class="tooltip">${tr[k]}</span></span>` : p;
                }).join('');
            }

            function speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text.replace(/_{2,}/g, '').replace(/[①②③④⑤⑥⑦⑧]/g, '').trim());
                u.lang = 'en-US'; u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }

            function mkSpeaker(txt) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("class", "h-5 w-5 text-amber-500 hover:text-amber-700 cursor-pointer flex-shrink-0");
                svg.setAttribute("viewBox", "0 0 20 20"); svg.setAttribute("fill", "currentColor");
                svg.setAttribute("title", "朗讀");
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("fill-rule", "evenodd");
                p.setAttribute("d", "M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.016 5.39a.75.75 0 01.016 1.046l-1.04 1.04a.75.75 0 11-1.06-1.06l1.04-1.04a.75.75 0 011.044-.026zM14.07 3.33a.75.75 0 01.016 1.046l-1.04 1.04a.75.75 0 01-1.06-1.06l1.04-1.04a.75.75 0 011.044-.026z");
                p.setAttribute("clip-rule", "evenodd");
                svg.appendChild(p);
                svg.onclick = e => { e.stopPropagation(); speak(txt); };
                return svg;
            }

            // Walk text nodes and apply mkInteractive (for reading passages)
            function makePassageInteractive(container) {
                const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
                const nodes = [];
                let n;
                while ((n = walker.nextNode())) nodes.push(n);
                nodes.forEach(tn => {
                    if (!tn.textContent.trim()) return;
                    const wrap = document.createElement('span');
                    wrap.innerHTML = mkInteractive(tn.textContent);
                    tn.parentNode.replaceChild(wrap, tn);
                });
            }

            function secLen(sec) {
                if (sec === 'A') return DATA.A.questions.length;
                if (sec === 'C') return C_TOTAL;
                if (sec === 'G') return DATA.G.questions.length;
                if (sec === 'H') return DATA.H.questions.length;
                return DATA[sec].length;
            }

            function updateLive() {
                liveScore.textContent = score;
                liveTotal.textContent = secLen(curSec);
            }

            // --- Render Sidebar ---
            function renderSidebar() {
                const scores = loadScores();
                sidebarNav.innerHTML = '';
                Object.keys(DATA).forEach(sec => {
                    const btn = document.createElement('button');
                    btn.className = 'sb-btn' + (sec === curSec ? ' active' : '');
                    btn.dataset.sec = sec;
                    const sc = scores[sec];
                    const badge = sc
                        ? `<span class="badge ${sc.pct >= 60 ? 'badge-ok' : 'badge-fail'}">${sc.pct}%</span>`
                        : `<span class="badge badge-none">—</span>`;
                    btn.innerHTML = `<span>${SECINFO[sec].title}</span>${badge}`;
                    btn.onclick = () => switchSection(sec);
                    sidebarNav.appendChild(btn);
                });

                scoreSummary.innerHTML = '';
                const scores2 = loadScores();
                Object.keys(DATA).forEach(sec => {
                    const sc = scores2[sec];
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between';
                    row.innerHTML = sc
                        ? `<span class="text-stone-500">${SECINFO[sec].title}</span><span class="badge ${sc.pct >= 60 ? 'badge-ok' : 'badge-fail'}">${sc.score}/${sc.total} (${sc.pct}%)</span>`
                        : `<span class="text-stone-400">${SECINFO[sec].title}</span><span class="badge badge-none">未作答</span>`;
                    scoreSummary.appendChild(row);
                });
            }

            // =============================================
            // === Section A: Fill-in-the-blank game ===
            // =============================================
            function displayFillIn() {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO.A.title;
                secSub.textContent = SECINFO.A.sub;
                progBar.style.width = '0%';
                progText.textContent = `0 / ${DATA.A.questions.length}`;
                updateLive();

                const { wordBank, questions } = DATA.A;
                let answered = 0;
                const filled = new Array(questions.length).fill(null); // which word is filled
                const usedCount = {}; // word -> count used
                wordBank.forEach(w => usedCount[w] = 0);

                const block = document.createElement('div');
                block.id = 'qblock';

                // Word bank display
                const wbDiv = document.createElement('div');
                wbDiv.className = 'bg-blue-50 border border-blue-200 rounded-xl p-3 mb-5';
                wbDiv.innerHTML = '<p class="text-xs font-bold text-blue-500 text-center mb-2">📖 Word Bank（點選單字填入空格）</p>';
                const wbChips = document.createElement('div');
                wbChips.className = 'flex flex-wrap gap-2 justify-center';
                wordBank.forEach(w => {
                    const chip = document.createElement('span');
                    chip.className = 'word-chip';
                    chip.id = `chip-${w}`;
                    chip.textContent = w;
                    chip.dataset.word = w;
                    chip.onclick = () => handleWordChipClick(w, chip);
                    wbChips.appendChild(chip);
                });
                wbDiv.appendChild(wbChips);
                block.appendChild(wbDiv);

                // Questions
                let selectedWord = null;
                let selectedChip = null;

                questions.forEach((q, qi) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'mb-5 p-4 bg-stone-50 border border-stone-200 rounded-xl';

                    const qRow = document.createElement('div');
                    qRow.className = 'flex items-start gap-2 mb-2';
                    qRow.appendChild(mkSpeaker(q.text));

                    // Build text with blank
                    const parts = q.text.split('______');
                    const textSpan = document.createElement('span');
                    textSpan.className = 'text-sm text-stone-700 leading-relaxed';

                    parts.forEach((part, pi) => {
                        const t = document.createElement('span');
                        t.innerHTML = mkInteractive(part);
                        textSpan.appendChild(t);
                        if (pi < parts.length - 1) {
                            const blank = document.createElement('span');
                            blank.className = 'fill-blank';
                            blank.id = `blank-${qi}`;
                            blank.textContent = '______';
                            blank.dataset.qi = qi;
                            blank.onclick = () => handleBlankClick(qi, blank);
                            textSpan.appendChild(blank);
                        }
                    });

                    qRow.appendChild(textSpan);
                    qDiv.appendChild(qRow);

                    // Hint
                    const hintWrap = document.createElement('div');
                    const hintBtn = document.createElement('button');
                    hintBtn.className = 'text-xs text-amber-600 hover:text-amber-800';
                    hintBtn.textContent = '💡 提示';
                    const hintTxt = document.createElement('p');
                    hintTxt.className = 'hidden mt-1 text-xs text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                    hintTxt.textContent = q.hint;
                    hintBtn.onclick = () => hintTxt.classList.toggle('hidden');
                    hintWrap.appendChild(hintBtn);
                    hintWrap.appendChild(hintTxt);
                    qDiv.appendChild(hintWrap);

                    block.appendChild(qDiv);
                });

                qWrap.appendChild(block);

                function handleWordChipClick(word, chip) {
                    if (selectedWord === word) {
                        // Deselect
                        chip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                        selectedWord = null; selectedChip = null;
                        return;
                    }
                    // Select this word
                    if (selectedChip) selectedChip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                    selectedWord = word; selectedChip = chip;
                    chip.classList.add('ring-2', 'ring-amber-400', 'bg-amber-100');
                }

                function handleBlankClick(qi, blank) {
                    if (!selectedWord) {
                        alertMsg.textContent = '請先從上方詞庫點選一個單字！';
                        alertModal.classList.remove('hidden');
                        return;
                    }
                    // Remove previous fill for this blank
                    if (filled[qi]) {
                        usedCount[filled[qi]]--;
                        // Restore chip if only used once
                        const oldChip = document.getElementById(`chip-${filled[qi]}`);
                        if (oldChip && usedCount[filled[qi]] === 0) oldChip.classList.remove('used');
                    }
                    // Fill the blank
                    filled[qi] = selectedWord;
                    usedCount[selectedWord]++;
                    blank.textContent = selectedWord;
                    blank.classList.add('filled');
                    speak(selectedWord);

                    // Mark chip as used if all instances used
                    if (usedCount[selectedWord] >= 1) selectedChip.classList.add('used');

                    // Deselect
                    selectedChip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                    selectedWord = null; selectedChip = null;

                    // Check if all filled
                    answered = filled.filter(f => f !== null).length;
                    progBar.style.width = (answered / questions.length * 100) + '%';
                    progText.textContent = `${answered} / ${questions.length}`;
                }

                // Check button
                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (filled.some(f => f === null)) {
                        alertMsg.textContent = '請填寫所有空格！';
                        alertModal.classList.remove('hidden');
                        return;
                    }
                    score = 0;
                    questions.forEach((q, qi) => {
                        const blank = document.getElementById(`blank-${qi}`);
                        blank.classList.remove('filled');
                        if (filled[qi] === q.answer) {
                            score++;
                            blank.classList.add('correct');
                        } else {
                            blank.classList.add('wrong');
                            blank.title = `正確答案：${q.answer}`;
                        }
                    });
                    updateLive();
                    saveScore('A', score, questions.length);
                    progBar.style.width = '100%';
                    controls.innerHTML = '';
                    const pct = Math.round(score / questions.length * 100);
                    const em = pct === 100 ? '🎉' : pct >= 60 ? '👍' : '💪';
                    scoredisp.innerHTML = `<div class="py-4"><p class="text-5xl mb-3">${em}</p><p class="text-stone-400 mb-1">測驗完成！</p><p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${questions.length}</span></p><p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p><p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p></div>`;
                    scoredisp.classList.remove('hidden');
                    const rb = document.createElement('button');
                    rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                    rb.textContent = '重新練習此大題'; rb.onclick = restart;
                    scoredisp.appendChild(rb);
                    renderSidebar();
                };
                controls.appendChild(checkBtn);
            }

            // =============================================
            // === Section C: Passage Fill-in ===
            // =============================================
            function displayFillInC() {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO.C.title;
                secSub.textContent = SECINFO.C.sub;
                progBar.style.width = '0%';
                progText.textContent = `0 / ${C_TOTAL}`;
                updateLive();

                const { wordBank, answers, passage } = DATA.C;
                const filled = new Array(C_TOTAL).fill(null);
                const usedCount = {};
                wordBank.forEach(w => usedCount[w] = 0);
                let selectedWord = null, selectedChip = null;

                const block = document.createElement('div');
                block.id = 'qblock';

                // Word bank
                const wbDiv = document.createElement('div');
                wbDiv.className = 'bg-blue-50 border border-blue-200 rounded-xl p-3 mb-5';
                wbDiv.innerHTML = '<p class="text-xs font-bold text-blue-500 text-center mb-2">📖 Word Bank（點選單字，再點空格填入）</p>';
                const wbChips = document.createElement('div');
                wbChips.className = 'flex flex-wrap gap-2 justify-center';
                wordBank.forEach(w => {
                    const chip = document.createElement('span');
                    chip.className = 'word-chip';
                    chip.id = `cchip-${w}`;
                    chip.textContent = w;
                    chip.onclick = () => {
                        if (selectedWord === w) {
                            chip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                            selectedWord = null; selectedChip = null; return;
                        }
                        if (selectedChip) selectedChip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                        selectedWord = w; selectedChip = chip;
                        chip.classList.add('ring-2', 'ring-amber-400', 'bg-amber-100');
                    };
                    wbChips.appendChild(chip);
                });
                wbDiv.appendChild(wbChips);
                block.appendChild(wbDiv);

                // Passage with blanks
                const passageDiv = document.createElement('div');
                passageDiv.className = 'bg-stone-50 border border-stone-200 rounded-xl p-4 text-base text-stone-800 leading-loose';

                const parts = passage.split('§BLANK§');
                parts.forEach((part, pi) => {
                    const t = document.createTextNode(part);
                    passageDiv.appendChild(t);
                    if (pi < C_TOTAL) {
                        const blank = document.createElement('span');
                        blank.className = 'fill-blank mx-1';
                        blank.id = `cblank-${pi}`;
                        blank.textContent = '______';
                        blank.style.minWidth = '70px';
                        blank.onclick = () => {
                            if (!selectedWord) {
                                alertMsg.textContent = '請先從上方詞庫點選一個單字！';
                                alertModal.classList.remove('hidden'); return;
                            }
                            // Restore old word chip if different
                            if (filled[pi] && filled[pi] !== selectedWord) {
                                usedCount[filled[pi]]--;
                                const old = document.getElementById(`cchip-${filled[pi]}`);
                                if (old && usedCount[filled[pi]] === 0) old.classList.remove('used');
                            }
                            filled[pi] = selectedWord;
                            usedCount[selectedWord]++;
                            blank.textContent = selectedWord;
                            blank.classList.add('filled');
                            speak(selectedWord);
                            if (usedCount[selectedWord] >= 1) selectedChip.classList.add('used');
                            selectedChip.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                            selectedWord = null; selectedChip = null;
                            const done = filled.filter(f => f !== null).length;
                            progBar.style.width = (done / C_TOTAL * 100) + '%';
                            progText.textContent = `${done} / ${C_TOTAL}`;
                        };
                        passageDiv.appendChild(blank);
                    }
                });
                block.appendChild(passageDiv);
                qWrap.appendChild(block);

                // Check button
                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (filled.some(f => f === null)) {
                        alertMsg.textContent = '請將所有空格填完！';
                        alertModal.classList.remove('hidden'); return;
                    }
                    score = 0;
                    answers.forEach((ans, i) => {
                        const blank = document.getElementById(`cblank-${i}`);
                        blank.classList.remove('filled');
                        if (filled[i] === ans) { score++; blank.classList.add('correct'); }
                        else { blank.classList.add('wrong'); blank.title = `正確答案：${ans}`; }
                    });
                    updateLive();
                    saveScore('C', score, C_TOTAL);
                    progBar.style.width = '100%';
                    progText.textContent = `${C_TOTAL} / ${C_TOTAL}`;
                    controls.innerHTML = '';
                    const pct = Math.round(score / C_TOTAL * 100);
                    const em = pct === 100 ? '🎉' : pct >= 60 ? '👍' : '💪';
                    scoredisp.innerHTML = `<div class="py-4"><p class="text-5xl mb-3">${em}</p><p class="text-stone-400 mb-1">測驗完成！</p><p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${C_TOTAL}</span></p><p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p><p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p></div>`;
                    scoredisp.classList.remove('hidden');
                    const rb = document.createElement('button');
                    rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                    rb.textContent = '重新練習此大題'; rb.onclick = restart;
                    scoredisp.appendChild(rb);
                    renderSidebar();
                };
                controls.appendChild(checkBtn);
            }

            // =============================================
            // === Section E: Reorder Sentences ===
            // =============================================
            function displayReorder(idx) {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA.E;
                secTitle.textContent = SECINFO.E.title;
                secSub.textContent = SECINFO.E.sub;
                progBar.style.width = (idx / list.length * 100) + '%';
                progText.textContent = `${idx} / ${list.length}`;
                updateLive();

                const q = list[idx];
                const block = document.createElement('div');
                block.id = 'qblock';

                const promptP = document.createElement('p');
                promptP.className = 'text-base text-stone-700 mb-2 flex items-start gap-2';
                promptP.appendChild(mkSpeaker(q.prompt));
                const pSpan = document.createElement('span');
                pSpan.innerHTML = `<strong>${idx + 1}.</strong> ${mkInteractive(q.prompt)}`;
                promptP.appendChild(pSpan);
                block.appendChild(promptP);

                const instrP = document.createElement('p');
                instrP.className = 'text-xs text-stone-400 mb-3';
                instrP.textContent = '👆 點擊下方單字，按正確順序排成句子（點擊已放入的單字可移除）';
                block.appendChild(instrP);

                const ansZone = document.createElement('div');
                ansZone.className = 'answer-zone mb-4';
                ansZone.id = 'ans-zone';
                const ph = document.createElement('span');
                ph.className = 'text-stone-300 text-sm';
                ph.textContent = '點擊單字放到這裡...';
                ansZone.appendChild(ph);
                block.appendChild(ansZone);

                const shuffled = [...q.answer].sort(() => Math.random() - 0.5);
                const poolDiv = document.createElement('div');
                poolDiv.className = 'flex flex-wrap gap-2 justify-center mb-4';
                poolDiv.id = 'word-pool';
                const userAnswer = [];

                shuffled.forEach((word, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'reorder-word';
                    btn.textContent = word;
                    btn.dataset.poolIdx = i;
                    btn.onclick = () => {
                        if (btn.classList.contains('used')) return;
                        speak(word); btn.classList.add('used');
                        userAnswer.push({ word, poolIdx: i });
                        renderAZ();
                    };
                    poolDiv.appendChild(btn);
                });
                block.appendChild(poolDiv);

                const hintWrap = document.createElement('div');
                hintWrap.className = 'mt-2';
                const hintBtn = document.createElement('button');
                hintBtn.className = 'text-sm text-amber-600 hover:text-amber-800';
                hintBtn.textContent = '💡 提示';
                const hintTxt = document.createElement('p');
                hintTxt.className = 'hidden mt-2 text-sm text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                hintTxt.textContent = q.hint;
                hintBtn.onclick = () => hintTxt.classList.toggle('hidden');
                hintWrap.appendChild(hintBtn); hintWrap.appendChild(hintTxt);
                block.appendChild(hintWrap);
                qWrap.appendChild(block);

                function renderAZ() {
                    ansZone.innerHTML = '';
                    if (userAnswer.length === 0) {
                        const p2 = document.createElement('span');
                        p2.className = 'text-stone-300 text-sm';
                        p2.textContent = '點擊單字放到這裡...';
                        ansZone.appendChild(p2); return;
                    }
                    userAnswer.forEach((item, ai) => {
                        const slot = document.createElement('button');
                        slot.className = 'answer-slot';
                        slot.textContent = item.word;
                        slot.onclick = () => {
                            userAnswer.splice(ai, 1);
                            poolDiv.querySelectorAll('.reorder-word')[item.poolIdx].classList.remove('used');
                            renderAZ();
                        };
                        ansZone.appendChild(slot);
                    });
                }

                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (userAnswer.length !== q.answer.length) {
                        alertMsg.textContent = '請將所有單字排列完成！';
                        alertModal.classList.remove('hidden'); return;
                    }
                    const ok = userAnswer.every((item, i) => item.word === q.answer[i]);
                    poolDiv.querySelectorAll('.reorder-word').forEach(b => { b.onclick = null; b.style.cursor = 'default'; });
                    ansZone.querySelectorAll('.answer-slot').forEach(s => { s.onclick = null; s.style.cursor = 'default'; });
                    if (ok) {
                        score++;
                        ansZone.classList.add('correct');
                        ansZone.innerHTML += '<span class="text-green-600 font-bold text-lg ml-2">✔️</span>';
                    } else {
                        ansZone.classList.add('wrong');
                        const corrP = document.createElement('p');
                        corrP.className = 'mt-2 text-sm text-green-700 bg-green-50 border border-green-200 p-2 rounded-md';
                        corrP.innerHTML = `<strong>正確答案：</strong>${q.answer.join(' ')}`;
                        block.appendChild(corrP);
                    }
                    updateLive();
                    controls.innerHTML = '';
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                    if (curIdx < list.length - 1) {
                        nextBtn.textContent = '下一題 →';
                        nextBtn.onclick = () => { curIdx++; displayReorder(curIdx); };
                    } else {
                        nextBtn.textContent = '完成測驗 🎉';
                        nextBtn.onclick = showScore;
                    }
                    controls.appendChild(nextBtn);
                };
                controls.appendChild(checkBtn);
            }

            // =============================================
            // === Section G / H: Reading + MC ===
            // =============================================
            function displayReadingSection(sec) {
                qWrap.innerHTML = ''; controls.innerHTML = '';
                secTitle.textContent = SECINFO[sec].title;
                secSub.textContent = SECINFO[sec].sub;
                const questions = DATA[sec].questions;
                progBar.style.width = '0%';
                progText.textContent = `0 / ${questions.length}`;
                updateLive();

                const block = document.createElement('div');
                block.id = 'qblock';

                // Passage / chat display
                const passDiv = document.createElement('div');
                passDiv.className = sec === 'H'
                    ? 'bg-gray-50 border border-gray-300 rounded-xl overflow-hidden mb-5 text-sm'
                    : 'bg-stone-50 border border-stone-300 rounded-xl p-4 mb-5 text-sm text-stone-700 leading-relaxed';
                passDiv.innerHTML = DATA[sec].passage;
                makePassageInteractive(passDiv);
                block.appendChild(passDiv);

                let submitted = false;
                const pfx = sec.toLowerCase();

                questions.forEach((q, qi) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'mb-4 p-3 bg-stone-50 border border-stone-200 rounded-xl';
                    const qp = document.createElement('p');
                    qp.className = 'text-sm font-bold text-stone-700 mb-2 flex items-start gap-2';
                    qp.appendChild(mkSpeaker(q.q));
                    const qs = document.createElement('span');
                    qs.innerHTML = `<strong>${qi + 1}.</strong> ${mkInteractive(q.q)}`;
                    qp.appendChild(qs);
                    qDiv.appendChild(qp);

                    const optDiv = document.createElement('div');
                    optDiv.className = 'grid grid-cols-1 gap-2';
                    q.opts.forEach((opt, oi) => {
                        const ch = String.fromCharCode(65 + oi);
                        const row = document.createElement('div');
                        row.className = 'flex items-center p-2 border border-stone-300 rounded-lg cursor-pointer hover:bg-amber-50 transition-all';
                        const radio = document.createElement('input');
                        radio.type = 'radio'; radio.id = `${pfx}q${qi}-${ch}`; radio.name = `${pfx}q${qi}`; radio.value = ch;
                        radio.className = 'h-4 w-4 text-amber-600 flex-shrink-0';
                        const label = document.createElement('label');
                        label.htmlFor = `${pfx}q${qi}-${ch}`;
                        label.className = 'ml-2 text-sm text-stone-800 flex-1 cursor-pointer';
                        label.innerHTML = `(${ch}) ${mkInteractive(opt)}`;
                        row.onclick = () => { if (!submitted) { radio.checked = true; speak(opt); } };
                        row.appendChild(radio); row.appendChild(label);
                        optDiv.appendChild(row);
                    });
                    qDiv.appendChild(optDiv);

                    if (q.hint) {
                        const hw = document.createElement('div'); hw.className = 'mt-2';
                        const hb = document.createElement('button');
                        hb.className = 'text-xs text-amber-600 hover:text-amber-800'; hb.textContent = '💡 提示';
                        const ht = document.createElement('p');
                        ht.className = 'hidden mt-1 text-xs text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                        ht.textContent = q.hint;
                        hb.onclick = () => ht.classList.toggle('hidden');
                        hw.appendChild(hb); hw.appendChild(ht); qDiv.appendChild(hw);
                    }
                    block.appendChild(qDiv);
                });
                qWrap.appendChild(block);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                checkBtn.textContent = '檢查答案';
                checkBtn.onclick = () => {
                    if (submitted) return;
                    const missing = questions.some((_, qi) => !document.querySelector(`input[name="${pfx}q${qi}"]:checked`));
                    if (missing) { alertMsg.textContent = '請完成所有題目！'; alertModal.classList.remove('hidden'); return; }
                    submitted = true; score = 0;
                    questions.forEach((q, qi) => {
                        const sel = document.querySelector(`input[name="${pfx}q${qi}"]:checked`);
                        const corrLabel = document.querySelector(`label[for="${pfx}q${qi}-${q.ans}"]`);
                        const userLabel = sel.nextElementSibling;
                        document.querySelectorAll(`input[name="${pfx}q${qi}"]`).forEach(r => r.disabled = true);
                        if (sel.value === q.ans) {
                            score++;
                            userLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400', 'ring-2', 'ring-yellow-300');
                            userLabel.innerHTML += ' <span class="text-green-600 font-bold">✔️</span>';
                        } else {
                            userLabel.parentElement.classList.add('bg-red-100', 'border-red-400', 'ring-2', 'ring-red-300');
                            userLabel.innerHTML += ' <span class="text-red-600 font-bold">❌</span>';
                            corrLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400');
                        }
                    });
                    updateLive();
                    saveScore(sec, score, questions.length);
                    progBar.style.width = '100%'; progText.textContent = `${questions.length} / ${questions.length}`;
                    controls.innerHTML = '';
                    const pct = Math.round(score / questions.length * 100);
                    const em = pct === 100 ? '🎉' : pct >= 60 ? '👍' : '💪';
                    scoredisp.innerHTML = `<div class="py-4"><p class="text-5xl mb-3">${em}</p><p class="text-stone-400 mb-1">測驗完成！</p><p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${questions.length}</span></p><p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p><p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p></div>`;
                    scoredisp.classList.remove('hidden');
                    const rb = document.createElement('button');
                    rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                    rb.textContent = '重新練習此大題'; rb.onclick = restart;
                    scoredisp.appendChild(rb);
                    renderSidebar();
                };
                controls.appendChild(checkBtn);
            }

            // =============================================
            // === Section B, D, F: Multiple Choice ===
            // =============================================
            function displayQ(idx) {
                if (curSec === 'A') { displayFillIn(); return; }
                if (curSec === 'C') { displayFillInC(); return; }
                if (curSec === 'E') { displayReorder(idx); return; }
                if (curSec === 'G') { displayReadingSection('G'); return; }
                if (curSec === 'H') { displayReadingSection('H'); return; }


                qWrap.innerHTML = ''; controls.innerHTML = '';
                const list = DATA[curSec];
                secTitle.textContent = SECINFO[curSec].title;
                secSub.textContent = SECINFO[curSec].sub;
                progBar.style.width = (idx / list.length * 100) + '%';
                progText.textContent = `${idx} / ${list.length}`;
                updateLive();

                const q = list[idx];
                const block = document.createElement('div');
                block.id = 'qblock';

                // Question text
                const qp = document.createElement('p');
                qp.className = 'text-base text-stone-700 mb-4 flex items-start gap-2 whitespace-pre-line';
                const span = document.createElement('span');
                span.innerHTML = `<strong>${idx + 1}.</strong> ${mkInteractive(q.q)}`;
                qp.appendChild(mkSpeaker(q.q));
                qp.appendChild(span);

                // Options
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';
                q.opts.forEach((opt, i) => {
                    const ch = String.fromCharCode(65 + i);
                    const row = document.createElement('div');
                    row.className = 'flex items-center p-3 border border-stone-300 rounded-lg cursor-pointer hover:bg-amber-50 transition-all';
                    const radio = document.createElement('input');
                    radio.type = 'radio'; radio.id = `q${idx}-${ch}`; radio.name = `q${idx}`; radio.value = ch;
                    radio.className = 'h-4 w-4 text-amber-600 border-gray-300 flex-shrink-0';
                    const label = document.createElement('label');
                    label.htmlFor = `q${idx}-${ch}`;
                    label.className = 'ml-3 text-sm text-stone-800 flex-1 cursor-pointer';
                    label.innerHTML = `(${ch}) ${mkInteractive(opt)}`;
                    row.onclick = () => { radio.checked = true; speak(opt); };
                    row.appendChild(radio); row.appendChild(label);
                    grid.appendChild(row);
                });

                // Hint
                const hintWrap = document.createElement('div');
                hintWrap.className = 'mt-4';
                const hintBtn = document.createElement('button');
                hintBtn.className = 'text-sm text-amber-600 hover:text-amber-800';
                hintBtn.textContent = '💡 提示';
                const hintTxt = document.createElement('p');
                hintTxt.className = 'hidden mt-2 text-sm text-stone-600 bg-yellow-50 border border-yellow-200 p-2 rounded-md';
                hintTxt.textContent = q.hint;
                hintBtn.onclick = () => hintTxt.classList.toggle('hidden');
                hintWrap.appendChild(hintBtn); hintWrap.appendChild(hintTxt);

                block.appendChild(qp); block.appendChild(grid); block.appendChild(hintWrap);
                qWrap.appendChild(block);

                const submitBtn = document.createElement('button');
                submitBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                submitBtn.textContent = '檢查答案';
                submitBtn.onclick = () => checkAns(idx);
                controls.appendChild(submitBtn);
            }

            function checkAns(idx) {
                const sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if (!sel) { alertMsg.textContent = '請先選擇一個答案！'; alertModal.classList.remove('hidden'); return; }
                const q = DATA[curSec][idx];
                const block = document.getElementById('qblock');
                block.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                block.querySelectorAll('div.flex.items-center').forEach(d => { d.onclick = null; d.classList.remove('hover:bg-amber-50'); d.style.cursor = 'default'; });
                const corrLabel = document.querySelector(`label[for="q${idx}-${q.ans}"]`);
                const userLabel = sel.nextElementSibling;
                if (sel.value === q.ans) {
                    score++;
                    userLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400', 'ring-2', 'ring-yellow-300');
                    userLabel.innerHTML += ' <span class="text-green-600 font-bold">✔️</span>';
                } else {
                    userLabel.parentElement.classList.add('bg-red-100', 'border-red-400', 'ring-2', 'ring-red-300');
                    userLabel.innerHTML += ' <span class="text-red-600 font-bold">❌</span>';
                    corrLabel.parentElement.classList.add('bg-yellow-100', 'border-yellow-400');
                }
                updateLive();
                controls.innerHTML = '';
                const nextBtn = document.createElement('button');
                nextBtn.className = 'w-full sm:w-auto bg-amber-500 text-white font-bold py-3 px-8 rounded-xl hover:bg-amber-600 transition-colors';
                const list = DATA[curSec];
                if (curIdx < list.length - 1) {
                    nextBtn.textContent = '下一題 →';
                    nextBtn.onclick = () => { curIdx++; displayQ(curIdx); };
                } else {
                    nextBtn.textContent = '完成測驗 🎉';
                    nextBtn.onclick = showScore;
                }
                controls.appendChild(nextBtn);
            }

            function showScore() {
                const list = DATA[curSec];
                const tot = secLen(curSec);
                saveScore(curSec, score, tot);
                progBar.style.width = '100%'; progText.textContent = `${tot} / ${tot}`;
                qWrap.innerHTML = ''; controls.innerHTML = '';
                const pct = Math.round(score / tot * 100);
                const em = pct === 100 ? '🎉' : pct >= 80 ? '👏' : pct >= 60 ? '👍' : '💪';
                scoredisp.innerHTML = `
      <div class="py-4">
        <p class="text-5xl mb-3">${em}</p>
        <p class="text-stone-400 mb-1">測驗完成！</p>
        <p class="text-5xl font-bold text-stone-800 my-3">${score} <span class="text-2xl text-stone-400">/ ${tot}</span></p>
        <p class="text-2xl font-bold ${pct >= 60 ? 'text-green-600' : 'text-red-500'}">${pct}%</p>
        <p class="text-xs text-stone-400 mt-2">✅ 成績已儲存至本地端</p>
      </div>`;
                scoredisp.classList.remove('hidden');
                const rb = document.createElement('button');
                rb.className = 'mt-2 bg-amber-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-amber-600';
                rb.textContent = '重新練習此大題'; rb.onclick = restart;
                scoredisp.appendChild(rb);
                renderSidebar();
            }

            function restart() {
                score = 0; curIdx = 0;
                scoredisp.classList.add('hidden'); scoredisp.innerHTML = '';
                displayQ(0);
            }

            function switchSection(sec) {
                curSec = sec; score = 0; curIdx = 0;
                scoredisp.classList.add('hidden'); scoredisp.innerHTML = '';
                sidebarNav.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
                displayQ(0);
            }

            // --- Init ---
            alertClose.onclick = () => alertModal.classList.add('hidden');
            clearBtn.onclick = () => { if (confirm('確定要清除所有大題的成績嗎？')) { localStorage.removeItem(STORE); renderSidebar(); } };

            renderSidebar();
            displayQ(0);
        });
    </script>
</body>

</html>
