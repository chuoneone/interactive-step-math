<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spedmix點餐機 - 英語量詞練習 (複數版)</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap');

        body {
            font-family: 'Lexend', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tray-item {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* 數字跳動動畫 */
        .count-bump {
            animation: bump 0.2s ease-out;
        }

        @keyframes bump {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
                color: #2563eb;
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="overflow-hidden">

    <!-- 頂部標題 -->
    <header class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tight">🍟 spedmix RESTAURANT</h1>
            <p class="text-xs opacity-80 text-blue-100">spedmix 點餐練習系統 (複數型態教學)</p>
        </div>
        <div class="text-right flex items-center gap-4">
            <span id="item-count" class="bg-blue-800 px-3 py-1 rounded-full text-sm font-bold">Tray: 0 items</span>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">

        <!-- 左側：菜單區 (Menu) -->
        <section class="w-2/3 p-6 overflow-y-auto bg-white border-r border-slate-100">
            <h2 class="text-xl font-bold text-slate-400 mb-6 flex items-center">
                <span class="mr-2">MENU 菜單</span>
                <hr class="flex-1 border-slate-100">
            </h2>
            <div id="menu-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
                <!-- 由 JS 動態生成 -->
            </div>
        </section>

        <!-- 右側：托盤區 (Your Tray) -->
        <section class="w-1/3 bg-slate-50 p-6 flex flex-col">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <span class="mr-2">YOUR TRAY</span>
                <span class="text-sm font-normal text-slate-400">點餐清單</span>
            </h2>

            <div class="flex-1 overflow-y-auto pr-2 relative">
                <div id="empty-msg"
                    class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-center">
                    <span class="text-6xl mb-4">🛒</span>
                    <p>請選擇餐點與數量<br>然後點擊「ADD」</p>
                </div>
                <div id="tray-list" class="space-y-4"></div>
            </div>

            <div class="mt-6 pt-6 border-t-2 border-slate-200">
                <button onclick="clearTray()"
                    class="w-full bg-slate-200 hover:bg-slate-300 text-slate-600 py-3 rounded-xl font-bold transition mb-3">
                    清空托盤
                </button>
                <button onclick="finishOrder()"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-extrabold text-xl shadow-lg transition active:scale-95">
                    完成點餐 (Finish)
                </button>
            </div>
        </section>
    </main>

    <!-- 底部自訂訊息提示框 -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 translate-y-10 pointer-events-none z-50">
        已加入托盤！
    </div>

    <script>
        // 教材資料，包含單數與複數的量詞
        const menuItems = [
            { id: 1, name: 'Coffee', img: '☕', unitSingular: 'cup', unitPlural: 'cups', food: 'coffee' },
            { id: 2, name: 'Water', img: '💧', unitSingular: 'bottle', unitPlural: 'bottles', food: 'water' },
            { id: 3, name: 'Salad', img: '🥗', unitSingular: 'bowl', unitPlural: 'bowls', food: 'salad' },
            { id: 4, name: 'Popcorn', img: '🍿', unitSingular: 'tub', unitPlural: 'tubs', food: 'popcorn' },
            { id: 5, name: 'Pizza', img: '🍕', unitSingular: 'slice', unitPlural: 'slices', food: 'pizza' },
            { id: 6, name: 'Milkshake', img: '🥤', unitSingular: 'glass', unitPlural: 'glasses', food: 'milkshake' },
            { id: 7, name: 'Bread', img: '🍞', unitSingular: 'slice', unitPlural: 'slices', food: 'bread' },
            { id: 8, name: 'Soup', img: '🥣', unitSingular: 'bowl', unitPlural: 'bowls', food: 'soup' },
            { id: 9, name: 'Soda', img: '🥤', unitSingular: 'can', unitPlural: 'cans', food: 'soda' }
        ];

        // 追蹤每個項目的當前選擇數量
        let selections = {};
        menuItems.forEach(item => selections[item.id] = 1);

        let tray = [];

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = menuItems.map(item => `
                <div class="menu-item bg-slate-50 border-2 border-slate-100 p-4 rounded-3xl flex flex-col items-center">
                    <div class="text-6xl mb-3">${item.img}</div>
                    <div class="font-bold text-slate-700 text-lg mb-4">${item.name}</div>
                    
                    <!-- 數量選擇器 -->
                    <div class="flex items-center gap-4 bg-white rounded-2xl p-1 shadow-inner mb-4">
                        <button onclick="changeSelection(${item.id}, -1)" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-xl font-bold hover:bg-slate-200">-</button>
                        <span id="select-count-${item.id}" class="text-xl font-black w-6 text-center">1</span>
                        <button onclick="changeSelection(${item.id}, 1)" class="w-10 h-10 flex items-center justify-center bg-blue-100 text-blue-600 rounded-xl text-xl font-bold hover:bg-blue-200">+</button>
                    </div>

                    <button onclick="addToTray(${item.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-bold shadow-md transition active:scale-95">
                        ADD TO TRAY
                    </button>
                </div>
            `).join('');
        }

        function changeSelection(id, delta) {
            let newVal = selections[id] + delta;
            if (newVal < 1) newVal = 1;
            if (newVal > 9) newVal = 9; // 限制最大 9 份，適合練習
            selections[id] = newVal;

            const el = document.getElementById(`select-count-${id}`);
            el.innerText = newVal;
            el.classList.remove('count-bump');
            void el.offsetWidth; // 觸發重繪
            el.classList.add('count-bump');
        }

        function addToTray(id) {
            const item = menuItems.find(i => i.id === id);
            const count = selections[id];

            // 處理量詞文法
            let phrase = "";
            const numWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];

            if (count === 1) {
                phrase = `a ${item.unitSingular} of ${item.food}`;
            } else {
                phrase = `${numWords[count]} ${item.unitPlural} of ${item.food}`;
            }

            tray.push({
                ...item,
                quantity: count,
                fullPhrase: phrase,
                trayId: Date.now() + Math.random()
            });

            updateTrayUI();
            speak(phrase);
            showToast(`Added ${count} ${count > 1 ? item.unitPlural : item.unitSingular}`);
        }

        function updateTrayUI() {
            const list = document.getElementById('tray-list');
            const countEl = document.getElementById('item-count');
            const emptyMsg = document.getElementById('empty-msg');

            countEl.innerText = `Tray: ${tray.length} items`;

            if (tray.length === 0) {
                emptyMsg.classList.remove('hidden');
                list.innerHTML = '';
            } else {
                emptyMsg.classList.add('hidden');
                list.innerHTML = tray.slice().reverse().map((item) => `
                    <div class="tray-item bg-white p-4 rounded-2xl shadow-sm border-l-8 border-orange-400 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <span class="text-4xl">${item.img}</span>
                                <span class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white">${item.quantity}</span>
                            </div>
                            <div>
                                <div class="text-[10px] font-bold text-orange-600 uppercase">Ordered</div>
                                <div class="text-lg font-black text-slate-800 leading-tight">${item.fullPhrase}</div>
                            </div>
                        </div>
                        <button onclick="removeItem(${item.trayId})" class="text-slate-300 hover:text-red-500 p-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                `).join('');
            }
        }

        function removeItem(trayId) {
            tray = tray.filter(item => item.trayId !== trayId);
            updateTrayUI();
        }

        function clearTray() {
            tray = [];
            updateTrayUI();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 40px)';
            }, 1500);
        }

        function finishOrder() {
            if (tray.length === 0) return;
            speak("Order received! Thank you for choosing spedmix Restaurant.");
            setTimeout(() => {
                alert(`點餐完成！共點了 ${tray.length} 樣餐點。`);
                clearTray();
            }, 800);
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.75;
            window.speechSynthesis.speak(utterance);
        }

        window.onload = renderMenu;
    </script>
</body>

</html>
