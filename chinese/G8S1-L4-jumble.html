<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛蓮說 句子重組練習 (八上 L4)</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #059669; --secondary-color: #10b981; --accent-color: #f59e0b; --success-color: #10b981; --error-color: #ef4444; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0fdf4; background-image: radial-gradient(#dcfce7 1px, transparent 1px); background-size: 20px 20px; color: #1f2937; -webkit-tap-highlight-color: transparent; }
        .exercise-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid rgba(255, 255, 255, 0.5); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .word-item { display: inline-block; font-family: 'Noto Sans TC', sans-serif; padding: 0.6rem 1.2rem; background: white; border: 2px solid #e5e7eb; border-radius: 12px; color: #374151; font-weight: 500; cursor: pointer; user-select: none; transition: all 0.15s ease; box-shadow: 0 3px 0 #e5e7eb; font-size: 1.25rem; margin: 5px; touch-action: manipulation; }
        .word-item:active { transform: translateY(3px); box-shadow: none; background-color: #ecfdf5; }
        .word-item:hover { border-color: var(--secondary-color); color: var(--secondary-color); }
        .drop-zone { min-height: 80px; background-color: #f9fafb; border: 2px dashed #cbd5e1; border-radius: 12px; transition: all 0.3s ease; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 16px; font-size: 1.25rem; line-height: 1.6; }
        .drop-zone:empty::before { content: '請點選下方詞語卡片，排列成通順的句子'; color: #94a3b8; font-size: 1rem; width: 100%; text-align: center; padding: 10px; }
        .drop-zone.correct { background-color: #ecfdf5; border-color: var(--success-color); border-style: solid; }
        .drop-zone.incorrect { background-color: #fef2f2; border-color: var(--error-color); border-style: solid; animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        .checkmark-wrapper { width: 120px; height: 120px; margin: 0 auto; }
        .checkmark { width: 120px; height: 120px; border-radius: 50%; display: block; stroke-width: 4; stroke: #fff; stroke-miterlimit: 10; box-shadow: inset 0px 0px 0px #10b981; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 80px #10b981; } }
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; animation: confetti-fall 3s linear forwards; }
        @keyframes confetti-fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen p-4 pb-12">

    <div id="completion-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative overflow-hidden" id="completion-modal">
            <div class="checkmark-wrapper mb-6">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2 animate-bounce">太棒了！</h2>
            <p class="text-gray-600 text-lg mb-8">你已經完成了所有的句子重組練習！</p>
            <button onclick="closeOverlay()" class="w-full bg-emerald-600 text-white text-lg px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-lg transform hover:scale-105 active:scale-95">關閉</button>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-10">
            <div class="inline-block p-1 rounded-full bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 mb-4">
                <div class="bg-white rounded-full px-6 py-2">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-teal-600 font-bold tracking-wide uppercase text-sm">Chinese Sentence Unscramble</span>
                </div>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">愛蓮說 句子重組練習 (八上 L4)</h1>
            <p class="text-lg text-gray-600 font-medium">請將下方的文言文詞語卡片，正確拼湊成通順的文句</p>
            
            <div class="mt-6 max-w-xs mx-auto">
                <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-400 mt-2 text-center" id="progress-text">完成進度: 0/0</p>
            </div>
        </header>

        <div id="container-exercises" class="space-y-8"></div>
    </div>

    <script>
        const exercises = [
            {
                id: 'q1',
                label: '第 1 題',
                answer: '水陸草木之花，可愛者甚蕃。',
                chunks: ['水陸草木之花', '，', '可愛者', '甚蕃', '。']
            },
            {
                id: 'q2',
                label: '第 2 題',
                answer: '晉陶淵明獨愛菊。',
                chunks: ['晉', '陶淵明', '獨愛菊', '。']
            },
            {
                id: 'q3',
                label: '第 3 題',
                answer: '自李唐來，世人甚愛牡丹。',
                chunks: ['自', '李唐來', '，', '世人', '甚愛牡丹', '。']
            },
            {
                id: 'q4',
                label: '第 4 題',
                answer: '予獨愛蓮之出淤泥而不染，濯清漣而不妖。',
                chunks: ['予獨愛蓮之', '出淤泥', '而不染', '，', '濯清漣', '而不妖', '。']
            },
            {
                id: 'q5',
                label: '第 5 題',
                answer: '中通外直，不蔓不枝，香遠益清，亭亭淨植，可遠觀而不可褻玩焉。',
                chunks: ['中通外直', '，', '不蔓不枝', '，', '香遠益清', '，', '亭亭淨植', '，', '可遠觀', '而不可褻玩焉', '。']
            },
            {
                id: 'q6',
                label: '第 6 題',
                answer: '予謂：菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。',
                chunks: ['予謂', '：', '菊', '，', '花之', '隱逸者也', '；', '牡丹', '，', '花之', '富貴者也', '；', '蓮', '，', '花之', '君子者也', '。']
            },
            {
                id: 'q7',
                label: '第 7 題',
                answer: '噫！菊之愛，陶後鮮有聞；蓮之愛，同予者何人？牡丹之愛，宜乎眾矣。',
                chunks: ['噫', '！', '菊之愛', '，', '陶後', '鮮有聞', '；', '蓮之愛', '，', '同予者何人', '？', '牡丹之愛', '，', '宜乎眾矣', '。']
            }
        ];

        let completedCount = 0;
        const totalCount = exercises.length;
        const synth = window.speechSynthesis;

        function speak(text, lang = 'zh-TW', rate = 0.95) {
            if (!text) return;
            synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = lang;
            utterThis.rate = rate;
            synth.speak(utterThis);
        }

        function renderApp() {
            const container = document.getElementById('container-exercises');
            document.getElementById('progress-text').innerText = `完成進度: 0/${totalCount}`;

            exercises.forEach((ex) => {
                const card = document.createElement('div');
                card.className = 'exercise-card p-6 sm:p-8';
                card.id = `card-${ex.id}`;
                card.dataset.id = ex.id;
                const shuffledWords = [...ex.chunks].sort(() => Math.random() - 0.5);

                card.innerHTML = `
                    <div class="mb-4 flex items-center gap-3">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold text-sm border border-emerald-200">${ex.id.replace('q', '')}</span>
                        <h2 class="text-lg font-bold text-gray-700">${ex.label}</h2>
                    </div>
                    <div class="word-bank flex flex-wrap gap-3 mb-6 justify-center" id="bank-${ex.id}">
                        ${shuffledWords.map(word => `<div class="word-item">${word}</div>`).join('')}
                    </div>
                    <div class="drop-zone mb-4" id="zone-${ex.id}"></div>
                    <div class="flex flex-wrap items-center gap-3 mt-2">
                        <button class="btn-action check-btn bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-8 rounded-xl shadow transition-colors text-base flex-grow sm:flex-grow-0" data-id="${ex.id}">檢查答案</button>
                        <button class="btn-action reset-btn bg-white hover:bg-gray-50 text-gray-600 border border-gray-300 font-bold py-2.5 px-5 rounded-xl transition-colors text-base" data-id="${ex.id}">重置</button>
                        <button class="btn-action hint-btn bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2.5 px-5 rounded-xl transition-colors flex items-center gap-2 text-base ml-auto" data-text="${ex.answer.replace(/"/g, '&quot;')}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
                            聽解答
                        </button>
                    </div>
                    <div class="feedback mt-3 h-8 text-base font-bold flex items-center"></div>
                `;
                container.appendChild(card);
            });
        }

        document.body.addEventListener('click', (e) => {
            const target = e.target;
            if (target.classList.contains('word-item')) {
                const card = target.closest('.exercise-card');
                if (!card) return;
                const exId = card.dataset.id;
                const bank = document.getElementById(`bank-${exId}`);
                const zone = document.getElementById(`zone-${exId}`);

                speak(target.innerText, 'zh-TW', 1.0);

                if (target.parentElement === bank) { zone.appendChild(target); } 
                else { bank.appendChild(target); }

                const feedbackEl = card.querySelector('.feedback');
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback mt-3 h-8 text-base font-bold flex items-center';
                zone.classList.remove('correct', 'incorrect');
                return;
            }
            if (target.classList.contains('check-btn')) { checkAnswer(target.dataset.id); return; }
            if (target.classList.contains('reset-btn')) { resetQuestion(target.dataset.id); return; }
            if (target.closest('.hint-btn')) { speak(target.closest('.hint-btn').dataset.text, 'zh-TW', 0.85); return; }
        });

        function showOverlay() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-90');
                modal.classList.add('scale-100');
                for(let i=0; i<50; i++) createConfetti(overlay);
            }, 10);
        }

        window.closeOverlay = function() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');
            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());
            }, 500);
        }

        function createConfetti(container) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.opacity = Math.random();
            container.appendChild(confetti);
        }

        function checkAnswer(id) {
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback');
            const exData = exercises.find(e => e.id === id);
            
            const rawWords = Array.from(zone.children).map(el => el.innerText);
            let userSentence = rawWords.join('');
            let correctAnswer = exData.answer;

            if (userSentence === correctAnswer) {
                feedbackEl.innerHTML = '<span class="text-emerald-600 flex items-center gap-2">🎉 答對了！句子很通順喔！</span>';
                zone.classList.remove('incorrect');
                zone.classList.add('correct');
                
                if (!zone.dataset.completed) {
                    zone.dataset.completed = 'true';
                    updateProgress(1);
                }
            } else {
                feedbackEl.innerHTML = '<span class="text-red-500 flex items-center gap-2">🤔 好像哪裡怪怪的，再讀讀看？</span>';
                zone.classList.remove('correct');
                zone.classList.add('incorrect');
                zone.style.animation = 'none';
                zone.offsetHeight; 
                zone.style.animation = null; 
            }
        }

        function resetQuestion(id) {
            const bank = document.getElementById(`bank-${id}`);
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback');
            
            Array.from(zone.children).forEach(child => bank.appendChild(child));
            const words = Array.from(bank.children);
            words.sort(() => Math.random() - 0.5);
            words.forEach(w => bank.appendChild(w));

            feedbackEl.textContent = '';
            zone.classList.remove('correct', 'incorrect');
            if (zone.dataset.completed) {
                delete zone.dataset.completed;
                updateProgress(-1);
            }
        }

        function updateProgress(change) {
            completedCount += change;
            completedCount = Math.max(0, Math.min(completedCount, totalCount));
            const percentage = Math.round((completedCount / totalCount) * 100);
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            bar.style.width = `${percentage}%`;
            text.textContent = `完成進度: ${completedCount}/${totalCount}`;

            if (completedCount === totalCount) {
                bar.classList.remove('from-emerald-500', 'to-teal-500');
                bar.classList.add('from-amber-400', 'to-orange-500'); 
                showOverlay();
            } else {
                bar.classList.add('from-emerald-500', 'to-teal-500');
                bar.classList.remove('from-amber-400', 'to-orange-500');
            }
        }

        renderApp();
    </script>
</body>
</html>
