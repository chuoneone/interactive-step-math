<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十字交乘法（常數為負）</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fff1f2; /* 紅色背景：負數單元 */
        }
        .step-container {
            transition: all 0.5s ease-in-out;
            opacity: 1;
        }
        .step-locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.8);
        }
        .highlight {
            background-color: #fef08a;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
            color: #b45309;
        }
        .highlight-blue {
            background-color: #bae6fd;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
            color: #0369a1;
        }
        .highlight-red {
            background-color: #fecaca;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
            color: #991b1b;
        }
        input {
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }
        .nav-btn {
            transition: all 0.2s;
        }
        .nav-btn.active {
            background-color: #ef4444;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .sign-text {
            display: inline-block;
            width: 1.5rem;
            text-align: center;
            transition: opacity 0.2s;
        }
        .nav-scroll::-webkit-scrollbar { height: 8px; }
        .nav-scroll::-webkit-scrollbar-track { background: #fff1f2; border-radius: 4px; }
        .nav-scroll::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 4px; }
        
        /* 卡片樣式 */
        .factor-card {
            transition: all 0.2s;
            cursor: pointer;
        }
        .factor-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #fca5a5;
        }
        .factor-card.selected {
            background-color: #fef2f2;
            border-color: #ef4444;
            box-shadow: 0 0 0 2px #fecaca;
        }
        
        /* 淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <!-- 導覽列 -->
    <div class="w-full max-w-4xl mb-6 bg-white rounded-xl shadow-sm p-4">
        <div class="flex overflow-x-auto pb-2 gap-3 nav-scroll" id="nav-container"></div>
    </div>

    <!-- 標題區 -->
    <header class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-6 mb-6 text-center border-b-4 border-red-400">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">十字交乘法：常數項為負數</h1>
        <p class="text-slate-500 font-bold">口訣：尾巴負數找差，中間放大數</p>
    </header>

    <!-- 題目區 -->
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-md p-8 mb-6 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-red-400"></div>
        <p class="text-lg text-slate-600 mb-4">請對下式進行因式分解：</p>
        <div class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wider font-mono">
            x² <span id="eq-sign-1" class="sign-text">-</span> <span id="eq-b" class="highlight-blue">2</span>x <span id="eq-sign-2" class="sign-text">-</span> <span id="eq-c" class="highlight-red">63</span>
        </div>
        <div id="clue-container" class="mt-6 flex justify-center gap-8 text-sm md:text-base text-slate-500 transition-opacity duration-500">
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-blue-200 rounded block"></span>
                <span id="label-b">一次項係數 (相差目標)</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-red-200 rounded block"></span>
                <span>常數項 (相乘目標)</span>
            </div>
        </div>
    </div>

    <!-- 步驟區 -->
    <div class="w-full max-w-4xl space-y-6">

        <!-- 步驟一：卡片篩選 (所有題目統一使用) -->
        <div id="step1" class="step-container bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">1</div>
                <h2 class="text-xl font-bold text-slate-700">找出正確的組合 (找差)</h2>
            </div>
            
            <div id="step1-hint-text" class="mb-4 text-lg">
                找兩個數字，相乘等於 <span id="s1-c" class="highlight-red">63</span>，
                相差等於 <span id="s1-b" class="highlight-blue">2</span>。
            </div>
            
            <div id="step1-content" class="bg-slate-50 p-4 rounded-lg overflow-hidden">
                <!-- JS 動態生成卡片 -->
            </div>
        </div>

        <!-- 步驟二：填圖 -->
        <div id="step2" class="step-container step-locked bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
             <div class="flex items-center gap-3 mb-4">
                <div id="s2-badge" class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">2</div>
                <h2 id="s2-title" class="text-xl font-bold text-slate-700">填入十字交乘圖 (注意正負號)</h2>
            </div>
            <p id="s2-desc" class="mb-4 text-lg">
                常數項是負的，所以數字是<b>一正一負</b>。<br>
                中間項是 <span id="s2-sign-hint" class="font-bold text-blue-600">負</span> 的，所以<b>大</b>的數字要填 <span id="s2-sign-val" class="font-bold text-blue-600">負</span> 號。
            </p>

            <div class="flex justify-center">
                <div class="relative w-[300px] h-[200px] bg-slate-50 rounded-xl border border-slate-200">
                    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 300 200">
                        <line x1="80" y1="40" x2="220" y2="160" stroke="#94a3b8" stroke-width="3" />
                        <line x1="80" y1="160" x2="220" y2="40" stroke="#94a3b8" stroke-width="3" />
                    </svg>
                    <div class="absolute top-[30px] left-[50px] text-2xl font-mono font-bold text-slate-700">x</div>
                    <div class="absolute bottom-[30px] left-[50px] text-2xl font-mono font-bold text-slate-700">x</div>
                    
                    <div class="absolute top-[30px] right-[50px] flex items-center gap-1">
                        <span id="cross-sign-1" class="text-xl font-bold text-slate-400 sign-text">+</span>
                        <input type="text" id="cross-input-1" class="w-20 h-12 text-center text-2xl font-bold border-2 border-red-300 rounded-lg shadow-sm" placeholder="?">
                    </div>
                    <div class="absolute bottom-[30px] right-[50px] flex items-center gap-1">
                        <span id="cross-sign-2" class="text-xl font-bold text-slate-400 sign-text">+</span>
                        <input type="text" id="cross-input-2" class="w-20 h-12 text-center text-2xl font-bold border-2 border-red-300 rounded-lg shadow-sm" placeholder="?">
                    </div>
                </div>
            </div>
             <div class="mt-4 text-center">
                <button onclick="checkStep2()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-8 rounded-full shadow-md transition text-lg">檢查圖形</button>
                <div id="feedback2" class="mt-3 h-8 font-bold text-lg"></div>
            </div>
        </div>

        <!-- 步驟三：答案 -->
        <div id="step3" class="step-container step-locked bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
             <div class="flex items-center gap-3 mb-4">
                <div id="s3-badge" class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">3</div>
                <h2 class="text-xl font-bold text-slate-700">寫出最後答案</h2>
            </div>
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 text-2xl md:text-3xl font-mono text-slate-700 bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 border-dashed">
                <span>( x <span id="final-sign-1" class="sign-text">+</span> <input type="text" id="final-1" class="w-20 h-14 text-center border-b-4 border-slate-400 bg-transparent focus:border-red-500" placeholder="?"> )</span>
                <span>( x <span id="final-sign-2" class="sign-text">+</span> <input type="text" id="final-2" class="w-20 h-14 text-center border-b-4 border-slate-400 bg-transparent focus:border-red-500" placeholder="?"> )</span>
            </div>
            <div class="mt-6 text-center">
                <button id="final-submit-btn" onclick="checkStep3()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transition text-xl">提交答案</button>
                <div id="feedback3" class="mt-3 h-8 font-bold text-lg"></div>
            </div>
        </div>

        <!-- 完成 -->
        <div id="completion" class="hidden w-full max-w-4xl bg-green-100 border-2 border-green-400 rounded-xl p-8 mt-6 text-center">
            <h2 class="text-3xl font-bold text-green-700 mb-2">🎉 挑戰成功！</h2>
            <p class="text-green-600 text-lg mb-4">這題解決了，繼續前進吧！</p>
            <button id="next-btn" onclick="nextQuestion()" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg shadow hover:bg-green-700 transition outline-none ring-2 ring-offset-2 ring-green-500 focus:ring-4">挑戰下一題</button>
        </div>
    </div>

    <script>
        // --- 資料 ---
        // 所有題目統一使用 mode: 'card'
        // Q1-Q4 (舊題)
        // Q5-Q8 (新題: 1. x^2-x-42, 2. x^2-x-30, 3. x^2+2x-35, 4. x^2+3x-40)
        
        const questions = [
            { b: -2, c: -63, absC: 63, absB: 2, mode: 'card' }, // Q1
            { b: -3, c: -18, absC: 18, absB: 3, mode: 'card' }, // Q2
            { b: 2,  c: -35, absC: 35, absB: 2, mode: 'card' }, // Q3
            { b: 1,  c: -56, absC: 56, absB: 1, mode: 'card' }, // Q4
            { b: -1, c: -42, absC: 42, absB: 1, mode: 'card' }, // Q5 (New)
            { b: -1, c: -30, absC: 30, absB: 1, mode: 'card' }, // Q6 (New)
            { b: 2,  c: -35, absC: 35, absB: 2, mode: 'card' }, // Q7 (New, 與 Q3 相同，做為複習)
            { b: 3,  c: -40, absC: 40, absB: 3, mode: 'card' }  // Q8 (New)
        ];

        // 產生正因數對 (小, 大)
        function getPositiveFactorPairs(n) {
            const pairs = [];
            const limit = Math.floor(Math.sqrt(n));
            for(let i = 1; i <= limit; i++) {
                if (n % i === 0) {
                    pairs.push([i, n / i]);
                }
            }
            return pairs;
        }

        // 為每一題準備正確答案 (含正負號)
        questions.forEach(q => {
            // 1. 找出絕對值的因數對
            q.pairs = getPositiveFactorPairs(q.absC);
            // 2. 找出差為 absB 的那一組
            const correctPair = q.pairs.find(p => Math.abs(p[1] - p[0]) === q.absB);
            if (correctPair) {
                // 3. 分配符號: 口訣「中間放大數」
                const small = correctPair[0];
                const big = correctPair[1];
                
                if (q.b < 0) {
                    // 中間負 -> 大的負
                    q.ans = [small, -big]; 
                } else {
                    // 中間正 -> 大的正
                    q.ans = [-small, big];
                }
            }
        });

        let currentQIndex = 0;
        let step1Validated = false;

        window.onload = function() {
            createNavButtons();
            loadQuestion(0);
            setupEventListeners();
        };

        function setupEventListeners() {
            const inputIds = ['cross-input-1', 'cross-input-2', 'final-1', 'final-2'];
            const signIds = ['cross-sign-1', 'cross-sign-2', 'final-sign-1', 'final-sign-2'];

            inputIds.forEach((id, idx) => {
                const input = document.getElementById(id);
                const sign = document.getElementById(signIds[idx]);

                // 自動隱藏符號
                input.addEventListener('input', () => {
                    if (input.value.includes('-')) {
                        sign.style.opacity = '0'; // 有負號就隱藏 +
                    } else {
                        sign.style.opacity = '1'; // 否則顯示
                    }
                });

                // Enter 鍵
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        if (id.startsWith('cross')) checkStep2();
                        else checkStep3();
                    }
                });
            });
        }

        function createNavButtons() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.innerText = `第 ${i+1} 題`;
                btn.onclick = () => loadQuestion(i);
                btn.id = `btn-q${i}`;
                btn.className = 'nav-btn flex-shrink-0 px-4 py-2 bg-white border-2 border-red-200 rounded-lg font-bold text-slate-600 hover:bg-red-50';
                container.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const q = questions[index];
            step1Validated = false;

            // 更新導覽按鈕
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active', 'border-red-500', 'bg-red-50');
                else btn.classList.remove('active', 'border-red-500', 'bg-red-50');
            });
            document.getElementById(`btn-q${index}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            
            resetInterface();

            // 填入題目資訊
            document.getElementById('eq-sign-1').innerText = (q.b < 0) ? '-' : '+';
            document.getElementById('eq-b').innerText = Math.abs(q.b); // 係數為1時也會顯示1
            document.getElementById('eq-sign-2').innerText = '-';
            document.getElementById('eq-c').innerText = q.absC;

            document.getElementById('s1-c').innerText = q.absC;
            document.getElementById('s1-b').innerText = q.absB;

            // Step 2 提示更新
            const signText = q.b < 0 ? "負" : "正";
            document.getElementById('s2-sign-hint').innerText = signText;
            document.getElementById('s2-sign-val').innerText = signText;

            // Step 1 渲染：全部使用卡片模式
            renderFactorCards(q);

            // 恢復符號顯示
            ['cross-sign-1', 'cross-sign-2', 'final-sign-1', 'final-sign-2'].forEach(id => {
                document.getElementById(id).style.opacity = '1';
            });
            
            // 下一題按鈕文字
            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerText = "全部完成！";
                nextBtn.onclick = null;
            } else {
                nextBtn.innerText = "挑戰下一題";
                nextBtn.onclick = nextQuestion;
            }
        }

        // --- 卡片模式渲染 ---
        function renderFactorCards(q) {
            const container = document.getElementById('step1-content');
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
            
            q.pairs.forEach((pair, idx) => {
                html += `
                    <div id="card-${idx}" class="factor-card bg-white border-2 border-slate-200 rounded-xl p-4 flex flex-col items-center gap-3" onclick="activateCard(${idx})">
                        <div class="text-xl font-mono text-slate-600 font-bold">
                            ${pair[0]} × ${pair[1]} = ${q.absC}
                        </div>
                        <div id="card-verify-${idx}" class="hidden w-full flex flex-col items-center animate-fade-in">
                            <div class="flex items-center gap-2 text-slate-700 font-bold">
                                <span>${pair[1]} - ${pair[0]} = </span>
                                <input type="number" id="card-diff-${idx}" class="w-16 p-1 border-2 border-blue-300 rounded text-center font-mono text-lg" placeholder="?" onclick="event.stopPropagation()">
                            </div>
                            <button onclick="event.stopPropagation(); confirmCardDiff(${idx})" class="mt-2 w-full bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-1 rounded transition">確認</button>
                        </div>
                        <div id="card-msg-${idx}" class="text-sm font-bold h-5"></div>
                    </div>
                `;
            });
            
            html += `</div><div id="feedback1" class="mt-3 h-8 font-bold text-lg text-center"></div>`;
            container.innerHTML = html;
        }

        function activateCard(idx) {
            // 關閉其他卡片
            document.querySelectorAll('[id^="card-verify-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.factor-card').forEach(el => el.classList.remove('ring-2', 'ring-blue-400', 'bg-blue-50'));
            
            // 啟動當前卡片
            const card = document.getElementById(`card-${idx}`);
            card.classList.add('ring-2', 'ring-blue-400', 'bg-blue-50');
            document.getElementById(`card-verify-${idx}`).classList.remove('hidden');
            
            // 自動對焦
            const input = document.getElementById(`card-diff-${idx}`);
            setTimeout(() => input.focus(), 100);
            
            // 綁定 Enter
            input.onkeydown = (e) => { 
                if(e.key === 'Enter') { 
                    e.stopPropagation(); 
                    confirmCardDiff(idx); 
                }
            };
        }

        function confirmCardDiff(idx) {
            const q = questions[currentQIndex];
            const pair = q.pairs[idx];
            const input = document.getElementById(`card-diff-${idx}`);
            const userDiff = parseInt(input.value);
            const realDiff = Math.abs(pair[1] - pair[0]);
            const msgEl = document.getElementById(`card-msg-${idx}`);

            if (isNaN(userDiff)) {
                msgEl.innerText = "請輸入數字"; 
                return;
            }
            if (userDiff !== realDiff) {
                msgEl.innerText = "相減算錯囉";
                msgEl.className = "text-sm font-bold h-5 text-red-500";
                input.classList.add('border-red-400');
                return;
            }
            
            input.classList.remove('border-red-400');
            input.classList.add('border-green-400');

            if (realDiff === q.absB) {
                msgEl.innerText = "正確！";
                msgEl.className = "text-sm font-bold h-5 text-green-600";
                showFeedback('feedback1', `太棒了！差是 ${q.absB}，這就是我們要的組合！`, true);
                
                // 標記卡片成功
                document.getElementById(`card-${idx}`).classList.add('bg-green-50', 'border-green-500');
                
                step1Validated = true;
                unlockStep('step2');
            } else {
                msgEl.innerText = `差是 ${realDiff}，不是 ${q.absB}`;
                msgEl.className = "text-sm font-bold h-5 text-orange-500";
            }
        }

        // --- 步驟二檢核 ---
        function checkStep2() {
            const v1 = parseInt(document.getElementById('cross-input-1').value);
            const v2 = parseInt(document.getElementById('cross-input-2').value);
            const q = questions[currentQIndex];
            
            const isCorrect = (v1 === q.ans[0] && v2 === q.ans[1]) || (v1 === q.ans[1] && v2 === q.ans[0]);

            if (isCorrect) {
                showFeedback('feedback2', '正確！注意看正負號是不是符合「中間放大數」！', true);
                unlockStep('step3');
            } else {
                let msg = "不對喔。";
                if (Math.abs(v1*v2) === q.absC) {
                     if (v1 + v2 === q.b) msg = "你是不是正負號填反了？"; 
                     else msg = `乘積對了 (${q.absC})，但正負號或組合不對，相加不是 ${q.b}。`;
                } else {
                    msg = `這兩個數相乘不是 ${-q.absC} 喔。`;
                }
                showFeedback('feedback2', msg, false);
            }
        }

        // --- 步驟三檢核 ---
        function checkStep3() {
             const v1 = parseInt(document.getElementById('final-1').value);
             const v2 = parseInt(document.getElementById('final-2').value);
             const q = questions[currentQIndex];
             const isCorrect = (v1 === q.ans[0] && v2 === q.ans[1]) || (v1 === q.ans[1] && v2 === q.ans[0]);

             if (isCorrect) {
                 showFeedback('feedback3', '完美！完全正確！', true);
                 document.getElementById('completion').classList.remove('hidden');
                 document.getElementById('completion').scrollIntoView({ behavior: 'smooth' });
                 setTimeout(() => document.getElementById('next-btn').focus(), 100);
             } else {
                 showFeedback('feedback3', '括號裡的數字要跟圖形一樣喔！', false);
             }
        }

        // --- 工具函數 ---
        function resetInterface() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.querySelectorAll('[id^="feedback"]').forEach(f => f.innerHTML = '');
            document.getElementById('step1').classList.remove('opacity-50');
            document.getElementById('step2').classList.add('step-locked', 'border-slate-300');
            document.getElementById('step2').classList.remove('border-red-500');
            document.getElementById('step3').classList.add('step-locked', 'border-slate-300');
            document.getElementById('step3').classList.remove('border-red-500');
            document.getElementById('completion').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function unlockStep(stepId) {
            const step = document.getElementById(stepId);
            step.classList.remove('step-locked');
            step.classList.add('border-red-500'); 
            step.classList.remove('border-slate-300');
            const firstInput = step.querySelector('input');
            if (firstInput) setTimeout(() => firstInput.focus(), 100);
            setTimeout(() => step.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
        }

        function showFeedback(elementId, message, isCorrect) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = isCorrect ? 'mt-3 h-8 font-bold text-lg text-green-600' : 'mt-3 h-8 font-bold text-lg text-red-500';
        }

        function nextQuestion() {
            if (currentQIndex < questions.length - 1) {
                loadQuestion(currentQIndex + 1);
            }
        }
    </script>
<script src="../progress.js"></script>
</body>
</html>
