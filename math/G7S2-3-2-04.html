<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比判別</title>
    <link rel="icon" href="images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* 填答格優化 */
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 48px;
            height: 48px;
            border: 3px solid #cbd5e1;
            border-radius: 10px;
            margin: 0 4px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            font-size: 1.2rem;
            color: #2563eb;
            vertical-align: middle;
        }

        .slot.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            animation: pulse-active 2s infinite;
        }

        @keyframes pulse-active {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }
        }

        .slot.filled {
            border-color: #94a3b8;
            background-color: #f8fafc;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #15803d;
            cursor: default;
        }

        /* 數學列對齊優化 */
        .math-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            min-height: 54px;
        }

        .katex {
            font-size: 1.2em !important;
            line-height: 1;
        }

        @media (min-width: 768px) {
            .katex {
                font-size: 1.35em !important;
            }
        }

        /* 表格樣式 */
        .math-table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .math-table th,
        .math-table td {
            border: 1px solid #e2e8f0;
            padding: 6px;
            text-align: center;
            font-size: 0.8rem;
        }

        @media (min-width: 640px) {
            .math-table th, .math-table td {
                font-size: 0.9rem;
                padding: 8px;
            }
        }

        .math-table th {
            background-color: #2dd4bf;
            color: white;
            font-weight: bold;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tada {
            animation: tada 0.8s ease-in-out;
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.95) rotate(-1deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.02) rotate(1deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.02) rotate(-1deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }
        
        @media (max-width: 768px) {
            .slot {
                min-width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <nav class="bg-white border-b shadow-sm sticky top-0 z-50 flex items-center px-4 py-2 overflow-x-auto no-scrollbar gap-2">
        <div class="flex-shrink-0 font-black text-blue-600 mr-2 sm:mr-6 text-sm sm:text-lg whitespace-nowrap">🔢 反比判別</div>
        <div id="tab-container" class="flex gap-1 sm:gap-2"></div>
        <div class="ml-auto flex items-center gap-2 sm:gap-4 flex-shrink-0">
            <div class="flex items-center gap-1 sm:gap-2 bg-slate-100 px-2 sm:px-3 py-1 rounded-xl font-bold text-slate-600 text-[10px] sm:text-sm">
                <span>⏱️</span><span id="timer" class="font-mono">07:00</span>
            </div>
            <div class="bg-blue-600 text-white px-2 sm:px-4 py-1 rounded-xl font-bold text-[10px] sm:text-sm shadow-sm whitespace-nowrap">
                得分：<span id="score">0</span>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- 左側：題目卡片 -->
        <aside class="w-full md:w-1/3 bg-white p-4 sm:p-6 border-b md:border-r overflow-y-auto relative md:sticky md:top-0 h-auto md:h-full">
            <div class="space-y-4">
                <div
                    class="inline-block bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-widest">
                    任務內容</div>
                <div id="problem-content" class="text-base sm:text-lg text-gray-800 leading-relaxed font-medium"></div>

                <div id="problem-table-container"></div>

                <hr class="border-gray-100">
                <div id="tip-box" class="p-4 bg-amber-50 border border-amber-100 rounded-xl shadow-sm">
                    <p class="text-amber-800 font-bold flex items-center gap-2 mb-1 text-sm">
                        <span>💡</span> 重點提醒
                    </p>
                    <p class="text-xs text-amber-700 leading-relaxed">
                        反比關係式：$x \cdot y = k$ (相乘為固定值)<br>
                        如果 $x \cdot y$ 不是固定數字，就不是反比喔！
                    </p>
                </div>
            </div>
        </aside>

        <!-- 右側：作答區 (緊湊版) -->
        <section id="step-area" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-slate-50 pb-40">
            <!-- Steps Generated by JS -->
        </section>

    </main>

    <!-- 完成視窗 -->
    <div id="finish-modal"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-2 border-blue-500">
            <div class="text-6xl mb-4">🏆</div>
            <h3 class="text-2xl font-black text-gray-800 mb-2">挑戰成功！</h3>
            <div id="final-stats" class="bg-slate-50 p-3 rounded-xl mb-6 font-bold text-blue-600"></div>
            <button onclick="location.reload()"
                class="w-full py-3 bg-blue-600 text-white rounded-xl font-black text-lg hover:bg-blue-700 transition-all">再玩一次</button>
        </div>
    </div>

    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-xl opacity-0 pointer-events-none transition-all duration-300 z-[110] shadow-xl font-bold text-sm">
        請填滿所有空格
    </div>

    <script>
        const QUESTIONS = [
            {
                id: 1,
                text: "1. 有一長方形的<mark>周長為 100 公分</mark>，設長為 $x$ 公分、寬為 $y$ 公分，其關係如下表：",
                table: {
                    headers: ["x (公分)", "y (公分)"],
                    data: [
                        ["5", "?"], ["15", "?"], ["?", "20"], ["25", "?"], ["?", "30"], ["?", "40"]
                    ]
                },
                steps: [
                    {
                        instruction: "找出 $x$ 與 $y$ 的規律。周長 100，則 $長+寬$ 為：",
                        template: "x + y = [ ]",
                        answers: ["50"],
                        options: ["50", "100", "200"]
                    },
                    {
                        instruction: "根據 $x + y = 50$，當 $x=25$ 時，$y$ 是多少？",
                        template: "y = [ ]",
                        answers: ["25"],
                        options: ["25", "20", "50"]
                    },
                    {
                        instruction: "寫出 $x$、$y$ 的關係式：",
                        template: "[ ] + [ ] = [ ]",
                        answers: ["x", "y", "50"],
                        options: ["x", "y", "50", "100", "·"]
                    },
                    {
                        instruction: "判斷：$x \\cdot y$ 是否為固定常數？是否成反比？",
                        template: "[ ]",
                        answers: ["否"],
                        options: ["是", "否"]
                    }
                ]
            },
            {
                id: 2,
                text: "2. 有一長方形的<mark>面積為 180 平方公分</mark>，設長為 $x$ 公分、寬為 $y$ 公分，其關係如下表：",
                table: {
                    headers: ["x (公分)", "y (公分)"],
                    data: [
                        ["10", "?"], ["?", "20"], ["30", "?"], ["45", "?"], ["?", "60"], ["?", "180"]
                    ]
                },
                steps: [
                    {
                        instruction: "找出規律。長方形面積為 180，所以 $長 \\cdot 寬$ 為：",
                        template: "x \\cdot y = [ ]",
                        answers: ["180"],
                        options: ["180", "90", "360"]
                    },
                    {
                        instruction: "根據 $x \\cdot y = 180$，當 $x=10$ 時，$y$ 是多少？",
                        template: "y = [ ]",
                        answers: ["18"],
                        options: ["18", "20", "180"]
                    },
                    {
                        instruction: "寫出 $x$、$y$ 的關係式：",
                        template: "[ ] \\cdot [ ] = [ ]",
                        answers: ["x", "y", "180"],
                        options: ["x", "y", "180", "90", "+"]
                    },
                    {
                        instruction: "判斷：$x \\cdot y$ 是否為固定常數？是否成反比？",
                        template: "[ ]",
                        answers: ["是"],
                        options: ["是", "否"]
                    }
                ]
            }
        ];

        let currentQIdx = 0;
        let scores = Array(QUESTIONS.length).fill(0);
        let completedSteps = Array(QUESTIONS.length).fill(0);
        let timeLeft = 420;
        let timerId = null;

        const renderMath = (el) => {
            if (window.renderMathInElement) {
                renderMathInElement(el, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        };

        window.onload = () => {
            renderTabs();
            loadQuestion(0);
            startTimer();
        };

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                if (timeLeft <= 0) { clearInterval(timerId); showFinishModal(); }
            }, 1000);
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            container.innerHTML = QUESTIONS.map((q, idx) => `
                <button onclick="loadQuestion(${idx})" class="px-4 py-1.5 rounded-xl font-bold text-sm transition-all ${currentQIdx === idx ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'}">
                    題目 ${idx + 1}
                </button>
            `).join('');
        }

        function loadQuestion(idx) {
            currentQIdx = idx;
            renderTabs();

            const pContent = document.getElementById('problem-content');
            pContent.innerHTML = QUESTIONS[idx].text;
            renderMath(pContent);

            const tableContainer = document.getElementById('problem-table-container');
            const tableObj = QUESTIONS[idx].table;
            let tableHtml = `<table class="math-table"><tr>`;
            tableObj.headers.forEach(h => tableHtml += `<th>${h}</th>`);
            tableHtml += `</tr>`;

            for (let r = 0; r < tableObj.data.length; r++) {
                tableHtml += `<tr><td>${tableObj.data[r][0]}</td><td>${tableObj.data[r][1]}</td></tr>`;
            }
            tableHtml += `</table>`;
            tableContainer.innerHTML = tableHtml;
            renderMath(tableContainer);
            renderMath(document.getElementById('tip-box'));

            document.getElementById('step-area').innerHTML = '';
            renderSteps(idx);
        }

        function renderSteps(qIdx) {
            const stepArea = document.getElementById('step-area');
            const question = QUESTIONS[qIdx];

            for (let i = 0; i <= completedSteps[qIdx]; i++) {
                if (i >= question.steps.length) break;
                if (document.getElementById(`step-${qIdx}-${i}`)) continue;

                const step = question.steps[i];
                const stepDiv = document.createElement('div');
                stepDiv.id = `step-${qIdx}-${i}`;
                stepDiv.className = `step-container bg-white p-5 rounded-2xl shadow-sm border-l-8 transition-all duration-500 ${i < completedSteps[qIdx] ? 'border-green-400 opacity-90' : 'border-blue-500'}`;

                // 核心修正：將模板拆分並確保每個片段都被正確渲染為 KaTeX
                let parts = step.template.split('[ ]');
                let mathHtml = '';
                parts.forEach((p, pIdx) => {
                    let text = p.trim();
                    if (text) {
                        // 移除原有的錢字號避免雙重渲染，並重新包裹
                        let cleanText = text.replace(/\$/g, '');
                        mathHtml += `<span class="math-fragment">$${cleanText}$</span>`;
                    }
                    if (pIdx < parts.length - 1) {
                        mathHtml += `<span class="slot" onclick="clearSlot(this)"></span>`;
                    }
                });

                stepDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-1 text-[10px] font-black text-blue-400 tracking-widest uppercase">
                        <span>Step ${i + 1}</span>
                        ${i < completedSteps[qIdx] ? '<span class="text-green-500">Done</span>' : ''}
                    </div>
                    <p class="text-lg text-slate-700 font-bold mb-3 step-instruction">${step.instruction}</p>
                    <div class="math-row mb-4">
                        ${mathHtml}
                    </div>
                    ${i === completedSteps[qIdx] ? `
                        <div class="option-bank border-t border-slate-50 pt-4">
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${step.options ? step.options.map(opt => `
                                    <button onclick="fillSlot('${qIdx}', '${i}', '${opt}')" class="min-w-[50px] h-[50px] bg-white border-2 border-slate-100 rounded-xl font-black text-xl hover:border-blue-400 hover:text-blue-500 transition-all active:scale-90 shadow-sm">
                                        ${opt}
                                    </button>
                                `).join('') : ''}
                            </div>
                            <button onclick="checkAnswer(${qIdx}, ${i})" class="w-full py-3 bg-blue-600 text-white rounded-xl font-black text-lg hover:bg-blue-700 shadow shadow-blue-100 transition-all">
                                檢查答案
                            </button>
                        </div>
                    ` : ''}
                `;

                stepArea.appendChild(stepDiv);
                renderMath(stepDiv.querySelector('.step-instruction'));
                stepDiv.querySelectorAll('.math-fragment').forEach(frag => renderMath(frag));
                updateActiveSlot(qIdx, i);
            }

            const lastStep = document.getElementById(`step-${qIdx}-${completedSteps[qIdx]}`);
            if (lastStep) lastStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function updateActiveSlot(qIdx, stepIdx) {
            const container = document.getElementById(`step-${qIdx}-${stepIdx}`);
            if (!container) return;
            const slots = container.querySelectorAll('.slot');
            slots.forEach(s => s.classList.remove('active'));
            for (let s of slots) { if (!s.innerText) { s.classList.add('active'); break; } }
        }

        function fillSlot(qIdx, stepIdx, value) {
            const container = document.getElementById(`step-${qIdx}-${stepIdx}`);
            const slots = container.querySelectorAll('.slot');
            for (let s of slots) {
                if (!s.innerText) {
                    s.innerText = value;
                    s.classList.add('filled');
                    updateActiveSlot(qIdx, stepIdx);
                    break;
                }
            }
        }

        function clearSlot(el) {
            if (el.classList.contains('correct')) return;
            el.innerText = '';
            el.classList.remove('filled');
            const parts = el.closest('.step-container').id.split('-');
            updateActiveSlot(parts[1], parts[2]);
        }

        function checkAnswer(qIdx, stepIdx) {
            const container = document.getElementById(`step-${qIdx}-${stepIdx}`);
            const slots = container.querySelectorAll('.slot');
            const answers = QUESTIONS[qIdx].steps[stepIdx].answers;

            let hasEmpty = false;
            slots.forEach(s => { if (!s.innerText) hasEmpty = true; });
            if (hasEmpty) { showToast("還有空格沒填喔！"); return; }

            let isCorrect = true;
            slots.forEach((s, idx) => { if (s.innerText !== answers[idx]) isCorrect = false; });

            if (isCorrect) {
                slots.forEach(s => { s.classList.add('correct'); s.onclick = null; });
                const bank = container.querySelector('.option-bank');
                if (bank) bank.classList.add('hidden');

                if (completedSteps[qIdx] === stepIdx) {
                    scores[qIdx]++;
                    updateScoreDisplay();
                    completedSteps[qIdx]++;
                    container.classList.add('tada');
                    container.classList.replace('border-blue-500', 'border-green-400');
                    if (completedSteps[qIdx] < QUESTIONS[qIdx].steps.length) setTimeout(() => renderSteps(qIdx), 800);
                    else checkAllComplete();
                }
            } else {
                showToast("不太對喔，再檢查一下！");
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score').innerText = scores.reduce((a, b) => a + b, 0);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 2000);
        }

        function checkAllComplete() {
            if (completedSteps.every((v, i) => v >= QUESTIONS[i].steps.length)) {
                clearInterval(timerId);
                setTimeout(showFinishModal, 1000);
            }
        }

        function showFinishModal() {
            const time = 420 - timeLeft;
            document.getElementById('final-stats').innerText = `得分：${document.getElementById('score').innerText} 分 | 用時：${Math.floor(time / 60)}分${time % 60}秒`;
            document.getElementById('finish-modal').classList.remove('hidden');
        }
    </script>
</body>

</html>
