<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💻互動式數學-點擊版 | 一元一次不等式的圖示法</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 點擊空格的高亮閃爍動畫 */
        .pulse-highlight {
            animation: pulseBorder 1.5s infinite;
        }

        @keyframes pulseBorder {

            0%,
            100% {
                border-color: #3b82f6;
                background-color: #eff6ff;
                box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.4);
            }

            50% {
                border-color: #60a5fa;
                background-color: #dbeafe;
                box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2);
            }
        }

        /* 答錯時卡片輕微震動效果 */
        .shake {
            animation: shakeAnim 0.5s ease-in-out;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* 答對時的煙火慶祝縮放動畫 */
        .pop-success {
            animation: popSuccessAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popSuccessAnim {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- 左側單元名稱 -->
            <div class="flex items-center gap-2.5">
                <span
                    class="bg-indigo-600 text-white font-black text-sm px-3 py-1.5 rounded-full uppercase tracking-wider">單元四</span>
                <h1 class="text-xl font-bold text-slate-800">一元一次不等式的圖示法</h1>
            </div>

            <!-- 中間題目選擇 (手機版可左右滑動) -->
            <div class="flex items-center gap-2.5 overflow-x-auto max-w-full pb-1 sm:pb-0 scrollbar-none"
                id="question-tabs">
                <!-- JS 動態生成題目切換鈕 -->
            </div>

            <!-- 右側分數與計時器 -->
            <div class="flex items-center gap-4 text-base font-bold shrink-0">
                <div
                    class="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-4 py-2 rounded-xl border border-amber-200">
                    <span class="text-lg">⭐</span>
                    <span>分數: <span id="total-score" class="text-lg font-black">0</span> / 100</span>
                </div>
                <div
                    class="flex items-center gap-1.5 bg-rose-50 text-rose-700 px-4 py-2 rounded-xl border border-rose-200">
                    <span class="text-lg">⏱️</span>
                    <span id="timer-display" class="font-mono text-lg">07:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主內容區：橫式(兩欄) vs 直式(上下) -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6 items-start">

        <!-- 左側：題幹與動態 SVG 數線繪圖區 (隨螢幕捲動固定) -->
        <section
            class="w-full md:w-5/12 md:sticky md:top-24 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <span class="text-sm font-bold text-indigo-500 uppercase tracking-wide">目前挑戰題目</span>
                <span id="question-index-badge"
                    class="bg-indigo-50 text-indigo-700 text-sm px-3 py-1.5 rounded-md font-bold">第 1 / 5 題</span>
            </div>

            <!-- 題幹內容 -->
            <div class="space-y-3">
                <h2 id="question-text" class="text-3xl font-black text-slate-800 leading-snug">
                    <!-- JS 動態寫入 -->
                </h2>
                <p class="text-base text-slate-500 flex items-center gap-1.5">
                    <i class="fa-solid fa-compass text-indigo-500 text-lg"></i>
                    觀察右側步驟並進行填答，下方的數線圖形會跟著你一起畫哦！
                </p>
            </div>

            <!-- 核心：動態 SVG 數線圖形 -->
            <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-inner space-y-2.5">
                <div class="flex items-center justify-between px-2 text-sm font-bold text-slate-400">
                    <span>📊 數線圖示預覽</span>
                    <span id="drawing-status" class="text-indigo-400 font-bold">等待填入邊界點...</span>
                </div>

                <!-- SVG 畫布 -->
                <svg id="number-line-svg" class="w-full h-32" viewBox="0 0 500 110">
                    <!-- 定義箭頭與漸層樣式 -->
                    <defs>
                        <!-- 黑色軸線箭頭 -->
                        <marker id="arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"
                            orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
                        </marker>
                        <marker id="arrow-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"
                            orient="auto-start-reverse">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
                        </marker>
                        <!-- 藍色作答射線箭頭 -->
                        <marker id="blue-arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6"
                            markerHeight="6" orient="auto">
                            <path d="M 0 2 L 7 5 L 0 8 z" fill="#6366f1" />
                        </marker>
                        <marker id="blue-arrow-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6"
                            markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 2 L 7 5 L 0 8 z" fill="#6366f1" />
                        </marker>
                        <!-- 綠色完成射線箭頭 -->
                        <marker id="emerald-arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6"
                            markerHeight="6" orient="auto">
                            <path d="M 0 2 L 7 5 L 0 8 z" fill="#10b981" />
                        </marker>
                        <marker id="emerald-arrow-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6"
                            markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 2 L 7 5 L 0 8 z" fill="#10b981" />
                        </marker>
                    </defs>

                    <!-- 黑色基礎數線 -->
                    <line x1="40" y1="70" x2="460" y2="70" stroke="#475569" stroke-width="3"
                        marker-end="url(#arrow-right)" marker-start="url(#arrow-left)" />

                    <!-- 刻度與數字 -->
                    <g id="svg-ticks"></g>

                    <!-- 動態繪圖覆蓋層 -->
                    <g id="svg-interactive-layer"></g>
                </svg>
            </div>

            <div class="bg-indigo-50/50 rounded-xl p-5 border border-indigo-100/60">
                <h4 class="text-sm font-bold text-indigo-800 mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-graduation-cap text-base"></i> 特教老師的小撇步
                </h4>
                <p class="text-sm text-indigo-700 leading-relaxed space-y-1">
                    💡 <strong>畫數線小口訣：</strong><br>
                    1. 看到「大於 x &gt;」或「大於等於 x &ge;」，箭頭要往 <strong>右邊</strong> 畫！<br>
                    2. 看到「小於 x &lt;」或「小於等於 x &le;」，箭頭要往 <strong>左邊</strong> 畫！<br>
                    3. 有等號畫 <strong>實心圈（包含這個點）</strong>，沒等號畫 <strong>空心圈（不含這個點）</strong>。
                </p>
            </div>
        </section>

        <!-- 右側：拆解步驟式填答區 -->
        <section class="w-full md:w-7/12 space-y-6" id="steps-container">
            <!-- JS 動態生成各個小步驟 -->
        </section>

    </main>

    <!-- 提示浮動視窗 (Toast) -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none text-white text-base font-bold px-6 py-4 rounded-xl shadow-lg flex items-center gap-2">
        <!-- JS 動態內容 -->
    </div>

    <!-- 完賽結算視窗 (Modal) -->
    <div id="finish-modal"
        class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300"
            id="finish-modal-card">
            <div
                class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-3xl font-black text-slate-800 mb-2">🎉 太棒了！挑戰完成</h3>
            <p class="text-slate-500 text-base mb-6">你成功的學會了一元一次不等式的數線畫法，真的非常厲害！</p>

            <!-- 成績卡片 -->
            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 mb-6 grid grid-cols-2 gap-4">
                <div class="text-center">
                    <span class="text-sm text-slate-400 font-bold block mb-1">最終得分</span>
                    <span class="text-4xl font-black text-indigo-600" id="final-score">0分</span>
                </div>
                <div class="text-center">
                    <span class="text-sm text-slate-400 font-bold block mb-1">使用時間</span>
                    <span class="text-4xl font-black text-indigo-600" id="final-time">00:00</span>
                </div>
            </div>

            <!-- 按鈕 -->
            <div class="flex flex-col gap-3">
                <button id="btn-restart"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-black py-4 rounded-xl text-lg shadow-md transition-all">
                    <i class="fa-solid fa-arrow-rotate-left mr-2"></i> 再做一次
                </button>
                <button id="btn-close-modal"
                    class="w-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-3.5 rounded-xl text-base transition-all">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 題型判定標記 ---
        // 本單元題型：一元一次不等式的圖示法 (數線畫法)

        // --- 題目資料庫 ---
        const QUESTIONS_DATA = [
            {
                id: 0,
                text: "在數線上畫出不等式：<mark class='bg-yellow-200 px-1 rounded font-black text-slate-900 text-3xl'>x &gt; -1</mark>",
                math: "x > -1",
                type: "ray", // ray (射線) or segment (雙端點線段)
                boundary: -1,
                isGreater: true,
                options: [
                    { tag: "A", val: "空心，向右畫" },
                    { tag: "B", val: "實心，向右畫" },
                    { tag: "C", val: "空心，向左畫" },
                    { tag: "D", val: "實心，向左畫" }
                ],
                steps: [
                    {
                        title: "找出起點邊界點",
                        instruction: "請觀察式子 x > -1，起點（邊界數值）是在哪一個數字上？",
                        lines: ["這條數線的起點邊界數字是： {{slot}}"],
                        answers: ["-1"],
                        choices: ["-2", "-1", "0", "1", "2"]
                    },
                    {
                        title: "決定空心或實心圓圈",
                        instruction: "符號是「 > 」（大於，沒有等號），圓圈應該是空心還是實心？",
                        lines: ["因為符號不包含等號，起點應畫： {{slot}} 圓圈。"],
                        answers: ["空心"],
                        choices: ["空心", "實心"]
                    },
                    {
                        title: "決定畫線方向",
                        instruction: "「 x 大於 -1 」，數值要往大（正數方向）前進，線應該朝向哪裡畫？",
                        lines: ["因為是大於，所以圖形射線要朝向： {{slot}} 畫。"],
                        answers: ["右邊"],
                        choices: ["左邊", "右邊"]
                    }
                ]
            },
            {
                id: 1,
                text: "在數線上畫出不等式：<mark class='bg-yellow-200 px-1 rounded font-black text-slate-900 text-3xl'>x &lt; 0</mark>",
                math: "x < 0",
                type: "ray",
                boundary: 0,
                isGreater: false,
                options: [
                    { tag: "A", val: "空心，向左畫" },
                    { tag: "B", val: "實心，向左畫" },
                    { tag: "C", val: "空心，向右畫" },
                    { tag: "D", val: "實心，向右畫" }
                ],
                steps: [
                    {
                        title: "找出起點邊界點",
                        instruction: "請觀察式子 x < 0，起點應該在哪一個數字上？",
                        lines: ["這條數線的起點邊界數字是： {{slot}}"],
                        answers: ["0"],
                        choices: ["-1", "0", "1", "2", "3"]
                    },
                    {
                        title: "決定空心或實心圓圈",
                        instruction: "符號是「 < 」（小於，沒有等號），圓圈應該是空心還是實心？",
                        lines: ["因為不包含等號，起點應畫： {{slot}} 圓圈。"],
                        answers: ["空心"],
                        choices: ["空心", "實心"]
                    },
                    {
                        title: "決定畫線方向",
                        instruction: "「 x 小於 0 」，數值變小（往負數前進），圖形線條應往哪裡畫？",
                        lines: ["因為是小於，所以射線要朝向： {{slot}} 畫。"],
                        answers: ["左邊"],
                        choices: ["左邊", "右邊"]
                    }
                ]
            },
            {
                id: 2,
                text: "在數線上畫出不等式：<mark class='bg-yellow-200 px-1 rounded font-black text-slate-900 text-3xl'>x &ge; 3</mark>",
                math: "x >= 3",
                type: "ray",
                boundary: 3,
                isGreater: true,
                options: [
                    { tag: "A", val: "空心，向右畫" },
                    { tag: "B", val: "實心，向右畫" },
                    { tag: "C", val: "空心，向左畫" },
                    { tag: "D", val: "實心，向左畫" }
                ],
                steps: [
                    {
                        title: "找出起點邊界點",
                        instruction: "觀察式子 x ≧ 3，它的邊界數字是哪一個？",
                        lines: ["這條數線的起點邊界數字是： {{slot}}"],
                        answers: ["3"],
                        choices: ["1", "2", "3", "4", "0"]
                    },
                    {
                        title: "決定空心或實心圓圈",
                        instruction: "符號是「 ≧ 」（大於或等於，包含底下的等號線），圓圈應該是空心還是實心？",
                        lines: ["因為符號包含等號，代表有包括這個點，應畫： {{slot}} 圓圈。"],
                        answers: ["實心"],
                        choices: ["空心", "實心"]
                    },
                    {
                        title: "決定畫線方向",
                        instruction: "「 x 大於或等於 3 」，數值會變大，射線應朝向哪裡畫？",
                        lines: ["因為是大於，射線應往： {{slot}} 畫。"],
                        answers: ["右邊"],
                        choices: ["左邊", "右邊"]
                    }
                ]
            },
            {
                id: 3,
                text: "在數線上畫出不等式：<mark class='bg-yellow-200 px-1 rounded font-black text-slate-900 text-3xl'>x &le; -2</mark>",
                math: "x <= -2",
                type: "ray",
                boundary: -2,
                isGreater: false,
                options: [
                    { tag: "A", val: "實心，向左畫" },
                    { tag: "B", val: "空心，向左畫" },
                    { tag: "C", val: "實心，向右畫" },
                    { tag: "D", val: "空心，向右畫" }
                ],
                steps: [
                    {
                        title: "找出起點邊界點",
                        instruction: "觀察式子 x ≦ -2，它的邊界數字是在哪一個？",
                        lines: ["這條數線的起點邊界數字是： {{slot}}"],
                        answers: ["-2"],
                        choices: ["-4", "-3", "-2", "-1", "0"]
                    },
                    {
                        title: "決定空心或實心圓圈",
                        instruction: "符號是「 ≦ 」（小於或等於，包含等號線），圓圈應該是空心還是實心？",
                        lines: ["開口有包含等號線，所以要畫： {{slot}} 圓圈。"],
                        answers: ["實心"],
                        choices: ["空心", "實心"]
                    },
                    {
                        title: "決定畫線方向",
                        instruction: "「 x 小於或等於 -2 」，數字變更小（負的越多越小），線條應往哪裡畫？",
                        lines: ["開口朝向小於，所以射線要往： {{slot}} 畫。"],
                        answers: ["左邊"],
                        choices: ["左邊", "右邊"]
                    }
                ]
            },
            {
                id: 4,
                text: "在數線上畫出不等式：<mark class='bg-yellow-200 px-1 rounded font-black text-slate-900 text-3xl'>-1 &le; x &le; 2</mark>",
                math: "-1 <= x <= 2",
                type: "segment", // 雙端點線段
                boundaryLeft: -1,
                boundaryRight: 2,
                options: [
                    { tag: "A", val: "左實右實線段" },
                    { tag: "B", val: "左空右空線段" },
                    { tag: "C", val: "左空右實線段" },
                    { tag: "D", val: "左實右空線段" }
                ],
                steps: [
                    {
                        title: "找出左右邊界端點",
                        instruction: "這是不等式兩端都被限制的「夾擊型」題型，請找出左邊和右邊的限制數字：",
                        lines: [
                            "左邊界的限制起點數字是： {{slot}}",
                            "右邊界的限制終點數字是： {{slot}}"
                        ],
                        answers: ["-1", "2"],
                        choices: ["-2", "-1", "0", "1", "2", "3"]
                    },
                    {
                        title: "決定兩個端點的圓圈類型",
                        instruction: "左端點是「 ≦ 」，右端點也是「 ≦ 」皆包含等號。請決定兩個端點圓圈：",
                        lines: [
                            "左端點（包含等號）要畫： {{slot}} 圓圈。",
                            "右端點（包含等號）要畫： {{slot}} 圓圈。"
                        ],
                        answers: ["實心", "實心"],
                        choices: ["空心", "實心"]
                    },
                    {
                        title: "決定畫線連線位置",
                        instruction: "x 被夾在 -1 和 2 的中間。我們要把線段畫在兩點的「中間」還是「外面」？",
                        lines: ["因為是夾在中間，圖形應畫在兩點的： {{slot}}。"],
                        answers: ["中間"],
                        choices: ["中間", "外面"]
                    }
                ]
            }
        ];

        // --- 全域狀態管理 ---
        const state = {
            currentQuestionIdx: 0,
            score: 0,
            timerSeconds: 420, // 7 分鐘
            timerInterval: null,
            isTimerActive: true,
            progress: []
        };

        // --- 初始化進度 ---
        function initProgress() {
            state.progress = QUESTIONS_DATA.map(q => {
                return {
                    questionId: q.id,
                    completed: false,
                    unlockedStepIdx: 0, // 當前解鎖到的步驟
                    steps: q.steps.map(s => {
                        return {
                            userAnswers: Array(s.answers.length).fill(""),
                            completed: false,
                            hasFailed: false,
                            shuffledChoices: shuffleArray(s.choices)
                        };
                    })
                };
            });
            state.score = 0;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- Web Audio 音效產生器 ---
        function playAudioTone(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                if (type === 'success') {
                    // 愉悅和弦
                    const freqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.08);
                        gain.gain.setValueAtTime(0, now + i * 0.08);
                        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.4);
                    });
                } else if (type === 'fail') {
                    // 溫和錯誤音
                    const freqs = [160, 130];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(f, now + i * 0.12);
                        gain.gain.setValueAtTime(0, now + i * 0.12);
                        gain.gain.linearRampToValueAtTime(0.1, now + i * 0.12 + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.12);
                        osc.stop(now + i * 0.12 + 0.25);
                    });
                } else if (type === 'click') {
                    // 輕巧點擊音
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                console.warn("Iframe audio context blocked or not supported.");
            }
        }

        // --- 彈出訊息提示 (Toast) ---
        function showToast(message, type = "info") {
            const toast = document.getElementById("toast");
            toast.innerHTML = message;

            toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 pointer-events-none text-white text-base font-bold px-6 py-4 rounded-xl shadow-lg flex items-center gap-2 ";
            if (type === "warning") {
                toast.className += "bg-amber-600 border border-amber-500";
            } else if (type === "success") {
                toast.className += "bg-emerald-600 border border-emerald-500 animate-bounce";
            } else {
                toast.className += "bg-slate-800 border border-slate-700";
            }

            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }

        // --- 渲染導覽列與分數 ---
        function renderTabs() {
            const tabContainer = document.getElementById("question-tabs");
            tabContainer.innerHTML = "";

            QUESTIONS_DATA.forEach((q, idx) => {
                const isActive = idx === state.currentQuestionIdx;
                const qProgress = state.progress[idx];

                let tabClass = "px-4.5 py-2.5 rounded-2xl font-black text-base flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ";
                let statusBadge = "";

                if (isActive) {
                    tabClass += "bg-indigo-600 text-white shadow-md ring-2 ring-indigo-300 ring-offset-1";
                } else if (qProgress.completed) {
                    tabClass += "bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100";
                    statusBadge = "<i class='fa-solid fa-circle-check text-emerald-500 text-base'></i>";
                } else {
                    tabClass += "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200";
                }

                const btn = document.createElement("button");
                btn.className = tabClass;
                btn.innerHTML = "<span>問題 " + (idx + 1) + "</span> " + statusBadge;
                btn.onclick = () => {
                    playAudioTone('click');
                    state.currentQuestionIdx = idx;
                    renderAll();
                };
                tabContainer.appendChild(btn);
            });

            document.getElementById("total-score").innerText = state.score;
        }

        // --- 找尋特定步驟中第一個未填空格 ---
        function getFirstEmptySlotIdx(qIdx, stepIdx) {
            const stepProg = state.progress[qIdx].steps[stepIdx];
            const answersLength = QUESTIONS_DATA[qIdx].steps[stepIdx].answers.length;
            for (let i = 0; i < answersLength; i++) {
                if (stepProg.userAnswers[i] === undefined || stepProg.userAnswers[i] === "") {
                    return i;
                }
            }
            return -1;
        }

        // --- 點選按鈕填入數值 ---
        function handleOptionSelect(val) {
            const qIdx = state.currentQuestionIdx;
            const qProgress = state.progress[qIdx];
            const activeStepIdx = qProgress.unlockedStepIdx;
            const stepProg = qProgress.steps[activeStepIdx];

            if (stepProg.completed) return;

            const firstEmptyIdx = getFirstEmptySlotIdx(qIdx, activeStepIdx);
            if (firstEmptyIdx !== -1) {
                stepProg.userAnswers[firstEmptyIdx] = val;
                playAudioTone('click');
                renderAll();
            } else {
                showToast("⚠️ 本步驟的格子都填滿囉！點選格內的數值可清除修改。", "warning");
            }
        }

        // --- 點選已填寫的空格以清除 ---
        function handleSlotClear(stepIdx, slotIdx) {
            const qIdx = state.currentQuestionIdx;
            const qProgress = state.progress[qIdx];
            const stepProg = qProgress.steps[stepIdx];

            if (stepIdx === qProgress.unlockedStepIdx && !stepProg.completed) {
                stepProg.userAnswers[slotIdx] = "";
                if (stepProg.incorrectIndices) {
                    stepProg.incorrectIndices = stepProg.incorrectIndices.filter(i => i !== slotIdx);
                }
                playAudioTone('click');
                renderAll();
            }
        }

        // --- 檢查步驟答案 ---
        function handleCheckAnswer(stepIdx) {
            const qIdx = state.currentQuestionIdx;
            const q = QUESTIONS_DATA[qIdx];
            const step = q.steps[stepIdx];
            const qProgress = state.progress[qIdx];
            const stepProg = qProgress.steps[stepIdx];

            const firstEmpty = getFirstEmptySlotIdx(qIdx, stepIdx);
            if (firstEmpty !== -1) {
                showToast("⚠️ 請填滿所有空格再檢查哦！", "warning");
                return;
            }

            let isCorrect = true;
            const incorrects = [];
            for (let i = 0; i < step.answers.length; i++) {
                if (stepProg.userAnswers[i] !== step.answers[i]) {
                    isCorrect = false;
                    incorrects.push(i);
                }
            }

            const stepCard = document.getElementById("step-card-" + stepIdx);

            if (isCorrect) {
                // 答對
                stepProg.completed = true;
                stepProg.incorrectIndices = [];
                playAudioTone('success');

                let earnedPoints = 0;
                if (!stepProg.hasFailed) {
                    earnedPoints = 10; // 每對一步 10 分，總共 10 步/20 步
                    state.score += earnedPoints;
                }

                if (stepCard) {
                    stepCard.classList.add("pop-success", "border-emerald-200", "bg-emerald-50/20");
                }

                if (stepIdx + 1 < q.steps.length) {
                    qProgress.unlockedStepIdx = stepIdx + 1;
                    showToast(earnedPoints > 0 ? "🎉 答對囉！太棒了！ (+10 分)" : "🎉 答對囉！訂正成功！", "success");

                    setTimeout(() => {
                        renderAll();
                        const nextCard = document.getElementById("step-card-" + (stepIdx + 1));
                        if (nextCard) {
                            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 800);
                } else {
                    // 本題通關！
                    qProgress.completed = true;

                    // 檢查是否全部通關
                    const allDone = state.progress.every(p => p.completed);
                    if (allDone) {
                        state.score = 100; // 滿分
                        document.getElementById("total-score").innerText = state.score;
                        stopTimer();
                        setTimeout(() => {
                            showFinalModal();
                        }, 1000);
                    } else {
                        showToast("🎉 本題全部步驟完成！數線圖示也成功畫好囉，請切換至下一題！", "success");
                        renderAll();
                    }
                }
            } else {
                // 答錯
                stepProg.hasFailed = true;
                stepProg.incorrectIndices = incorrects;
                playAudioTone('fail');

                if (stepCard) {
                    stepCard.classList.add("shake");
                    setTimeout(() => stepCard.classList.remove("shake"), 500);
                }

                showToast("❌ 再想想看喔！紅框內的選擇不太對，可以點擊空格重新修正哦！", "warning");
                renderAll();
            }
        }

        // --- 數線物理 X 座標映射函數 (刻度從 -4 到 4) ---
        function getX(val) {
            // 軸線起訖：40px ~ 460px (總寬 500px)
            // 中點 0 對應 250px，每個整數刻度相距 45px
            return 250 + val * 45;
        }

        // --- 動態生成數線固定刻度 (SVG) ---
        function initBaseTicks() {
            const container = document.getElementById("svg-ticks");
            container.innerHTML = "";

            const values = [-4, -3, -2, -1, 0, 1, 2, 3, 4];
            values.forEach(v => {
                const x = getX(v);

                // 刻度線
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x);
                line.setAttribute("y1", "62");
                line.setAttribute("x2", x);
                line.setAttribute("y2", "78");
                line.setAttribute("stroke", "#475569");
                line.setAttribute("stroke-width", "2.5");
                container.appendChild(line);

                // 刻度字
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", "100");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("class", "text-base font-black fill-slate-300 select-none");
                text.textContent = v;
                container.appendChild(text);
            });
        }

        // --- 核心：動態 SVG 繪圖重繪與即時圖示反饋 ---
        function updateDrawing() {
            const layer = document.getElementById("svg-interactive-layer");
            const statusText = document.getElementById("drawing-status");
            layer.innerHTML = ""; // 清空作答覆蓋層

            const qIdx = state.currentQuestionIdx;
            const q = QUESTIONS_DATA[qIdx];
            const qProg = state.progress[qIdx];

            // 決定目前繪圖著色：若是全題完成使用翠綠色，否則使用亮靛藍色
            const drawColor = qProg.completed ? "#10b981" : "#6366f1";
            const arrowRightMarker = qProg.completed ? "url(#emerald-arrow-right)" : "url(#blue-arrow-right)";
            const arrowLeftMarker = qProg.completed ? "url(#emerald-arrow-left)" : "url(#blue-arrow-left)";

            if (q.type === "ray") {
                // --- 射線題型 (一端無限延伸) ---
                const step1Ans = qProg.steps[0].userAnswers[0]; // 邊界點數字
                const step2Ans = qProg.steps[1].userAnswers[0]; // 空實心
                const step3Ans = qProg.steps[2].userAnswers[0]; // 方向

                if (step1Ans === "") {
                    statusText.innerText = "等待右側步驟 1 決定邊界點...";
                    return;
                }

                const bVal = parseFloat(step1Ans);
                if (isNaN(bVal)) return;

                const startX = getX(bVal);
                statusText.innerText = "起點已選在 " + bVal + "。";

                // 1. 繪製起點向上引出的輔支垂直線段
                const connector = document.createElementNS("http://www.w3.org/2000/svg", "line");
                connector.setAttribute("x1", startX);
                connector.setAttribute("y1", "70");
                connector.setAttribute("x2", startX);
                connector.setAttribute("y2", "40");
                connector.setAttribute("stroke", drawColor);
                connector.setAttribute("stroke-dasharray", qProg.steps[0].completed ? "none" : "3,3");
                connector.setAttribute("stroke-width", "3.5");
                layer.appendChild(connector);

                // 2. 繪製指向方向的水平射線
                if (step3Ans !== "") {
                    const isRight = step3Ans === "右邊";
                    const endX = isRight ? 450 : 50;

                    const ray = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    ray.setAttribute("x1", startX);
                    ray.setAttribute("y1", "40");
                    ray.setAttribute("x2", endX);
                    ray.setAttribute("y2", "40");
                    ray.setAttribute("stroke", drawColor);
                    ray.setAttribute("stroke-width", "5");
                    ray.setAttribute("marker-end", isRight ? arrowRightMarker : arrowLeftMarker);
                    layer.appendChild(ray);

                    statusText.innerText = "起點在 " + bVal + "，端點為" + (step2Ans || '未定') + "，正朝" + step3Ans + "延伸！";
                }

                // 3. 繪製起點端點圓圈
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", startX);
                circle.setAttribute("cy", "40");
                circle.setAttribute("r", "10");

                if (step2Ans === "實心") {
                    circle.setAttribute("fill", drawColor);
                    circle.setAttribute("stroke", drawColor);
                } else if (step2Ans === "空心") {
                    circle.setAttribute("fill", "#0f172a"); // 深色背景
                    circle.setAttribute("stroke", drawColor);
                    circle.setAttribute("stroke-width", "4");
                } else {
                    // 尚未作答端點類型：顯示虛線透明圓圈
                    circle.setAttribute("fill", "none");
                    circle.setAttribute("stroke", drawColor);
                    circle.setAttribute("stroke-dasharray", "2,2");
                    circle.setAttribute("stroke-width", "2.5");
                }
                layer.appendChild(circle);

            } else if (q.type === "segment") {
                // --- 夾擊型線段題型 ---
                const leftBoundaryStr = qProg.steps[0].userAnswers[0];
                const rightBoundaryStr = qProg.steps[0].userAnswers[1];

                const leftCircleType = qProg.steps[1].userAnswers[0];
                const rightCircleType = qProg.steps[1].userAnswers[1];

                const directionStr = qProg.steps[2].userAnswers[0];

                if (leftBoundaryStr === "" || rightBoundaryStr === "") {
                    statusText.innerText = "等待找出左邊界和右邊界數值...";
                    return;
                }

                const leftVal = parseFloat(leftBoundaryStr);
                const rightVal = parseFloat(rightBoundaryStr);
                if (isNaN(leftVal) || isNaN(rightVal)) return;

                const startX = getX(leftVal);
                const endX = getX(rightVal);

                // 1. 兩側向上垂直引導線
                const leftConn = document.createElementNS("http://www.w3.org/2000/svg", "line");
                leftConn.setAttribute("x1", startX);
                leftConn.setAttribute("y1", "70");
                leftConn.setAttribute("x2", startX);
                leftConn.setAttribute("y2", "40");
                leftConn.setAttribute("stroke", drawColor);
                leftConn.setAttribute("stroke-width", "3.5");
                leftConn.setAttribute("stroke-dasharray", qProg.steps[0].completed ? "none" : "3,3");
                layer.appendChild(leftConn);

                const rightConn = document.createElementNS("http://www.w3.org/2000/svg", "line");
                rightConn.setAttribute("x1", endX);
                rightConn.setAttribute("y1", "70");
                rightConn.setAttribute("x2", endX);
                rightConn.setAttribute("y2", "40");
                rightConn.setAttribute("stroke", drawColor);
                rightConn.setAttribute("stroke-width", "3.5");
                rightConn.setAttribute("stroke-dasharray", qProg.steps[0].completed ? "none" : "3,3");
                layer.appendChild(rightConn);

                statusText.innerText = "左右兩端點鎖定在 [" + leftVal + ", " + rightVal + "]。";

                // 2. 畫兩點中間的聯絡線段
                if (directionStr === "中間") {
                    const seg = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    seg.setAttribute("x1", startX);
                    seg.setAttribute("y1", "40");
                    seg.setAttribute("x2", endX);
                    seg.setAttribute("y2", "40");
                    seg.setAttribute("stroke", drawColor);
                    seg.setAttribute("stroke-width", "6.5");
                    layer.appendChild(seg);
                    statusText.innerText = "成功連起兩點中間的區域！ [" + leftVal + " \u2264 x \u2264 " + rightVal + "]";
                }

                // 3. 左端點圈圈
                const lCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                lCircle.setAttribute("cx", startX);
                lCircle.setAttribute("cy", "40");
                lCircle.setAttribute("r", "10");
                if (leftCircleType === "實心") {
                    lCircle.setAttribute("fill", drawColor);
                    lCircle.setAttribute("stroke", drawColor);
                } else if (leftCircleType === "空心") {
                    lCircle.setAttribute("fill", "#0f172a");
                    lCircle.setAttribute("stroke", drawColor);
                    lCircle.setAttribute("stroke-width", "4");
                } else {
                    lCircle.setAttribute("fill", "none");
                    lCircle.setAttribute("stroke", drawColor);
                    lCircle.setAttribute("stroke-dasharray", "2,2");
                }
                layer.appendChild(lCircle);

                // 4. 右端點圈圈
                const rCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                rCircle.setAttribute("cx", endX);
                rCircle.setAttribute("cy", "40");
                rCircle.setAttribute("r", "10");
                if (rightCircleType === "實心") {
                    rCircle.setAttribute("fill", drawColor);
                    rCircle.setAttribute("stroke", drawColor);
                } else if (rightCircleType === "空心") {
                    rCircle.setAttribute("fill", "#0f172a");
                    rCircle.setAttribute("stroke", drawColor);
                    rCircle.setAttribute("stroke-width", "4");
                } else {
                    rCircle.setAttribute("fill", "none");
                    rCircle.setAttribute("stroke", drawColor);
                    rCircle.setAttribute("stroke-dasharray", "2,2");
                }
                layer.appendChild(rCircle);
            }
        }

        // --- 倒數計時器設定 ---
        function startTimer() {
            state.isTimerActive = true;
            state.timerInterval = setInterval(() => {
                if (state.timerSeconds <= 0) {
                    stopTimer();
                    showFinalModal();
                    return;
                }
                state.timerSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        // --- 停止計時 ---
        function stopTimer() {
            state.isTimerActive = false;
            clearInterval(state.timerInterval);
        }

        // --- 更新計時顯示 ---
        function updateTimerDisplay() {
            const minutes = Math.floor(state.timerSeconds / 60);
            const seconds = state.timerSeconds % 60;
            document.getElementById("timer-display").innerText =
                minutes.toString().padStart(2, '0') + ":" + seconds.toString().padStart(2, '0');
        }

        // --- 顯示結算視窗 ---
        function showFinalModal() {
            const modal = document.getElementById("finish-modal");
            const card = document.getElementById("finish-modal-card");

            document.getElementById("final-score").innerText = state.score + "分";

            const timeUsed = 420 - state.timerSeconds;
            const m = Math.floor(timeUsed / 60);
            const s = timeUsed % 60;
            document.getElementById("final-time").innerText = m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');

            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                card.classList.remove("scale-95");
            }, 50);
        }

        // --- 關閉結算視窗 ---
        function closeFinalModal() {
            const modal = document.getElementById("finish-modal");
            const card = document.getElementById("finish-modal-card");
            modal.classList.add("opacity-0");
            card.classList.add("scale-95");
            setTimeout(() => modal.classList.add("hidden"), 300);
        }

        // --- 主渲染程序 ---
        function renderAll() {
            // 1. 更新頁籤
            renderTabs();

            const qIdx = state.currentQuestionIdx;
            const q = QUESTIONS_DATA[qIdx];
            const qProgress = state.progress[qIdx];

            // 2. 左側標記寫入
            document.getElementById("question-index-badge").innerText = "第 " + (qIdx + 1) + " / " + QUESTIONS_DATA.length + " 題";
            document.getElementById("question-text").innerHTML = q.text;

            // 3. 重建動態 SVG 畫布
            updateDrawing();

            // 4. 渲染右側拆解步驟
            const stepsContainer = document.getElementById("steps-container");
            stepsContainer.innerHTML = "";

            const unlockedMax = qProgress.unlockedStepIdx;

            for (let sIdx = 0; sIdx <= unlockedMax; sIdx++) {
                const step = q.steps[sIdx];
                const stepProg = qProgress.steps[sIdx];

                const card = document.createElement("div");
                card.id = "step-card-" + sIdx;

                let cardBaseClass = "bg-white border p-6 rounded-2xl transition-all duration-300 space-y-5 shadow-sm ";
                if (stepProg.completed) {
                    cardBaseClass += "border-emerald-200 bg-emerald-50/10";
                } else {
                    cardBaseClass += "border-slate-200";
                }
                card.className = cardBaseClass;

                // 標題列
                const headerDiv = document.createElement("div");
                headerDiv.className = "flex items-center justify-between border-b border-slate-100 pb-3";

                const titleSpan = document.createElement("span");
                titleSpan.className = "font-black text-lg md:text-xl flex items-center gap-2 " + (stepProg.completed ? 'text-emerald-700' : 'text-slate-800');
                titleSpan.innerHTML =
                    '<span class="px-3.5 py-1 rounded-full text-xs font-bold ' + (stepProg.completed ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-700') + '">步驟 ' + (sIdx + 1) + '</span> ' +
                    step.title;

                const statusSpan = document.createElement("span");
                if (stepProg.completed) {
                    statusSpan.className = "text-emerald-600 font-bold text-base flex items-center gap-1";
                    statusSpan.innerHTML = "<i class='fa-solid fa-circle-check'></i> 已完成";
                } else {
                    statusSpan.className = "text-indigo-500 font-bold text-base flex items-center gap-1.5";
                    statusSpan.innerHTML = "<span class='inline-block w-2.5 h-2.5 bg-indigo-500 rounded-full animate-ping'></span> 進行中";
                }

                headerDiv.appendChild(titleSpan);
                headerDiv.appendChild(statusSpan);
                card.appendChild(headerDiv);

                // 說明
                const descP = document.createElement("p");
                descP.className = "text-base md:text-lg text-slate-600 font-medium leading-relaxed";
                descP.innerText = step.instruction;
                card.appendChild(descP);

                // 填空作答算式區
                const formulasDiv = document.createElement("div");
                formulasDiv.className = "space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-100/80";

                let slotIndexCounter = 0;
                const firstEmptyIdx = getFirstEmptySlotIdx(qIdx, sIdx);

                step.lines.forEach((line) => {
                    const lineDiv = document.createElement("div");
                    lineDiv.className = "flex flex-wrap items-center gap-2 text-slate-700 font-black text-lg md:text-xl min-h-[50px] leading-relaxed";

                    const parts = line.split(/(\{\{slot\}\})/);
                    parts.forEach(part => {
                        if (part === "{{slot}}") {
                            const currentSlotIdx = slotIndexCounter++;
                            const slotVal = stepProg.userAnswers[currentSlotIdx];

                            const isFilled = slotVal !== undefined && slotVal !== "";
                            const isActiveFocus = !stepProg.completed && (currentSlotIdx === firstEmptyIdx);
                            const isWrong = stepProg.incorrectIndices && stepProg.incorrectIndices.includes(currentSlotIdx);

                            const slotBtn = document.createElement("button");

                            let slotClass = "inline-flex items-center justify-center min-w-[84px] h-[46px] px-3 mx-1 rounded-xl text-xl md:text-2xl font-black border-2 transition-all ";
                            if (stepProg.completed) {
                                slotClass += "border-emerald-500 bg-emerald-50 text-emerald-700 cursor-not-allowed";
                            } else if (isWrong) {
                                slotClass += "border-rose-500 bg-rose-50 text-rose-700 animate-pulse";
                            } else if (isFilled) {
                                slotClass += "border-indigo-500 bg-indigo-50 text-indigo-700 hover:bg-indigo-100/60";
                            } else if (isActiveFocus) {
                                slotClass += "pulse-highlight border-blue-500 border-2 scale-105";
                            } else {
                                slotClass += "border-slate-300 bg-white text-slate-300 hover:border-slate-400";
                            }

                            slotBtn.className = slotClass;
                            slotBtn.innerHTML = isFilled ? slotVal : '<span class="text-xs text-slate-400 font-bold">點選</span>';
                            slotBtn.title = isFilled ? "點擊以清除" : "等待點選填入";

                            slotBtn.onclick = () => handleSlotClear(sIdx, currentSlotIdx);
                            lineDiv.appendChild(slotBtn);
                        } else {
                            const textSpan = document.createElement("span");
                            textSpan.innerHTML = part;
                            lineDiv.appendChild(textSpan);
                        }
                    });

                    formulasDiv.appendChild(lineDiv);
                });

                card.appendChild(formulasDiv);

                // 下方選項按鈕列 (已完成就簡潔隱藏)
                if (!stepProg.completed) {
                    const buttonAreaDiv = document.createElement("div");
                    buttonAreaDiv.className = "space-y-3.5";

                    const labelSpan = document.createElement("span");
                    labelSpan.className = "text-sm font-bold text-slate-400 block";
                    labelSpan.innerText = "請點選下方按鈕填入藍色高亮空格：";
                    buttonAreaDiv.appendChild(labelSpan);

                    const choicesWrapper = document.createElement("div");
                    choicesWrapper.className = "flex flex-wrap gap-3";

                    stepProg.shuffledChoices.forEach(choice => {
                        const optBtn = document.createElement("button");
                        optBtn.className = "bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-800 border-2 border-slate-200 hover:border-indigo-400 active:scale-95 px-6 py-3.5 rounded-xl text-xl md:text-2xl font-black shadow-sm transition-all flex-1 text-center min-w-[85px]";
                        optBtn.innerText = choice;
                        optBtn.onclick = () => handleOptionSelect(choice);
                        choicesWrapper.appendChild(optBtn);
                    });

                    buttonAreaDiv.appendChild(choicesWrapper);
                    card.appendChild(buttonAreaDiv);
                }

                // 動作檢查列
                if (!stepProg.completed) {
                    const actionDiv = document.createElement("div");
                    actionDiv.className = "flex items-center justify-between pt-3 border-t border-slate-100";

                    const hintSpan = document.createElement("span");
                    hintSpan.className = "text-sm text-slate-400 font-semibold flex items-center gap-1";
                    hintSpan.innerHTML = "<i class='fa-solid fa-magic text-indigo-500'></i> 填好格子後請點右邊檢查";

                    const checkBtn = document.createElement("button");
                    checkBtn.className = "bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-black px-7 py-3 rounded-xl text-base md:text-lg shadow-md hover:shadow-lg transition-all flex items-center gap-1.5";
                    checkBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> 檢查答案";
                    checkBtn.onclick = () => handleCheckAnswer(sIdx);

                    actionDiv.appendChild(hintSpan);
                    actionDiv.appendChild(checkBtn);
                    card.appendChild(actionDiv);
                }

                stepsContainer.appendChild(card);
            }
        }

        // --- 初始化執行 ---
        window.onload = function () {
            // 1. 初始化資料結構
            initProgress();

            // 2. 初始化 SVG 固定刻度與線條
            initBaseTicks();

            // 3. 啟動計時器
            startTimer();
            updateTimerDisplay();

            // 4. 主渲染
            renderAll();

            // 5. 結算視窗按鈕事件
            document.getElementById("btn-restart").onclick = () => {
                playAudioTone('click');
                initProgress();
                state.currentQuestionIdx = 0;
                state.timerSeconds = 420;
                closeFinalModal();
                stopTimer();
                startTimer();
                renderAll();
            };

            document.getElementById("btn-close-modal").onclick = () => {
                playAudioTone('click');
                closeFinalModal();
            };
        };
    </script>
</body>

</html>
