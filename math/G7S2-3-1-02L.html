<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 求比值</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        .math {
            font-size: 32px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            vertical-align: middle;
            margin: 0 4px;
        }

        .fraction span:first-child {
            border-bottom: 3px solid #334155;
            padding: 0 8px;
            min-width: 40px;
            text-align: center;
        }

        .fraction span:last-child {
            padding: 0 8px;
            min-width: 40px;
            text-align: center;
        }

        .slot {
            width: 50px;
            height: 50px;
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            transition: all 0.2s;
            cursor: default;
            position: relative;
        }

        .slot.filled {
            border: 3px solid #3b82f6;
            color: #1e40af;
            font-weight: bold;
            cursor: pointer;
            /* 點錯可以點擊清除 */
        }

        .slot.filled:hover::after {
            content: '✕';
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot.correct {
            border-color: #10b981;
            background-color: #f0fdf4;
            color: #047857;
            cursor: default;
        }

        .slot.correct:hover::after {
            display: none;
        }

        .option-btn {
            transition: transform 0.1s, background-color 0.2s;
        }

        .option-btn:active {
            transform: scale(0.9);
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .tada {
            animation: tada 0.8s;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="h-screen overflow-hidden flex flex-col">

    <!-- 導覽列 -->
    <nav class="bg-white border-b shadow-sm flex-none">
        <div class="flex items-center justify-between px-4 py-2">
            <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar whitespace-nowrap py-1">
                <span class="font-bold text-blue-600 border-r pr-4">求比值</span>
                <div id="nav-buttons" class="flex gap-2">
                    <!-- 題目切換按鈕將由 JS 產生 -->
                </div>
            </div>
            <div class="flex items-center gap-4 ml-4 whitespace-nowrap">
                <div class="text-lg font-bold text-red-500">⏳ <span id="timer">07:00</span></div>
                <div class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold">得分: <span
                        id="total-score">0</span></div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- 左側：題目區域 (固定) -->
        <section id="question-sidebar" class="md:w-1/3 bg-white border-r p-6 overflow-y-auto">
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="bg-yellow-400 text-yellow-900 px-2 py-1 rounded">題目區</span>
                </h2>
                <div id="target-ratio" class="p-6 bg-slate-50 rounded-xl border-2 border-slate-200 text-center">
                    <!-- 顯示當前比值題目 -->
                </div>
            </div>

            <div class="bg-green-50 border-2 border-green-200 rounded-xl p-4">
                <h3 class="font-bold text-green-700 mb-2 flex items-center gap-1">
                    💡 小秘訣
                </h3>
                <p class="text-green-800 leading-relaxed">
                    把比寫成像<mark class="bg-yellow-200 px-1">「分數」</mark>的樣子。<br>
                    前項在上面(分子)，後項在下面(分母)。<br>
                    <span class="text-sm font-bold text-blue-600 mt-2 block">※ 如果填錯了，點一下格子可以清除。</span>
                </p>
            </div>
        </section>

        <!-- 右側：步驟區 (解鎖) -->
        <section id="step-container" class="flex-1 p-6 overflow-y-auto bg-slate-50 space-y-8">
            <!-- 步驟將由 JS 產生 -->
        </section>

    </main>

    <!-- 選項按鈕區 (固定在底部) -->
    <div id="options-area" class="bg-white border-t p-4 flex-none shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <div class="max-w-3xl mx-auto flex flex-wrap justify-center gap-3" id="options-grid">
            <!-- 按鈕將由 JS 產生 -->
        </div>
    </div>

    <!-- 完成彈窗 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div id="modal-icon" class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold mb-2">太棒了！全部完成</h2>
            <p id="modal-result" class="text-slate-600 mb-6 font-medium"></p>
            <div class="flex gap-4">
                <button onclick="resetGame()"
                    class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">再做一次</button>
                <button onclick="closeModal()"
                    class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        // 題型判定：比值計算（分數表示）
        const questions = [
            { id: 1, front: 3, back: 5, options: [3, 5, 2, 7, 1, 4] },
            { id: 2, front: 2, back: 7, options: [2, 7, 3, 5, 1, 4] },
            { id: 3, front: 1, back: 4, options: [1, 4, 2, 7, 5, 9] },
            { id: 4, front: 5, back: 9, options: [5, 9, 6, 11, 3, 5] },
            { id: 5, front: 6, back: 11, options: [6, 11, 5, 9, 1, 4] }
        ];

        let currentIdx = 0;
        let score = 0;
        let timeLeft = 420; // 7分鐘
        let timerInterval;
        let isGameOver = false;

        // 追蹤答題狀態
        const userProgress = questions.map(q => ({
            id: q.id,
            denominator: null,
            numerator: null,
            isCorrect: false
        }));

        const navContainer = document.getElementById('nav-buttons');
        const sidebarTarget = document.getElementById('target-ratio');
        const stepContainer = document.getElementById('step-container');
        const optionsGrid = document.getElementById('options-grid');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('total-score');

        // 初始化
        window.onload = () => {
            initNav();
            loadQuestion(0);
            startTimer();
        };

        function initNav() {
            navContainer.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${i}`;
                const isFinished = userProgress[i].isCorrect;
                btn.className = `px-4 py-2 rounded-lg font-bold transition-all ${i === currentIdx ? 'bg-blue-600 text-white shadow-md' :
                    isFinished ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'
                    }`;
                btn.innerText = `題目 ${i + 1}${isFinished ? ' ✔' : ''}`;
                btn.onclick = () => loadQuestion(i);
                navContainer.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            currentIdx = index;
            initNav();

            const q = questions[index];
            const prog = userProgress[index];

            // 渲染左側題目
            sidebarTarget.innerHTML = `
                <div class="text-sm text-slate-500 mb-2">題目 ${q.id}</div>
                <div class="math">
                    <span>${q.front}</span>
                    <span class="text-slate-400">:</span>
                    <span>${q.back}</span>
                </div>
                <div class="mt-4 text-slate-600 font-medium">求這個比的比值</div>
            `;

            // 渲染右側步驟
            renderSteps(q, prog);

            // 渲染選項
            renderOptions(q.options, prog.isCorrect);
        }

        function renderSteps(q, prog) {
            stepContainer.innerHTML = '';

            const step1 = document.createElement('div');
            step1.id = 'step-1';
            step1.className = `bg-white p-6 rounded-2xl shadow-sm border-2 ${prog.isCorrect ? 'border-green-500' : 'border-transparent'}`;

            let statusBadge = prog.isCorrect ? '<span class="ml-2 text-green-600">✔ 已完成</span>' : '';

            step1.innerHTML = `
                <h3 class="font-bold text-lg mb-4 flex items-center">
                    <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-2">1</span>
                    將比值寫成分數 ${statusBadge}
                </h3>
                <div class="flex flex-col items-center gap-6">
                    <div class="math">
                        <span>比值 =</span>
                        <div class="fraction">
                            <span id="slot-numerator" 
                                  onclick="clearSlot('numerator')"
                                  class="slot ${prog.numerator ? 'filled' : ''} ${prog.isCorrect ? 'correct' : ''}">
                                ${prog.numerator || ''}
                            </span>
                            <span id="slot-denominator" 
                                  onclick="clearSlot('denominator')"
                                  class="slot ${prog.denominator ? 'filled' : ''} ${prog.isCorrect ? 'correct' : ''}">
                                ${prog.denominator || ''}
                            </span>
                        </div>
                    </div>
                    
                    ${!prog.isCorrect ? `
                    <button onclick="checkAnswer()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold text-lg hover:bg-blue-700 transition-colors shadow-lg active:scale-95">
                        檢查答案
                    </button>
                    ` : ''}
                </div>
            `;
            stepContainer.appendChild(step1);
        }

        function renderOptions(opts, isFinished) {
            optionsGrid.innerHTML = '';
            if (isFinished) {
                optionsGrid.innerHTML = '<div class="text-slate-400 font-medium py-2">本題已完成，請切換至下一題</div>';
                return;
            }

            opts.forEach(val => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-16 h-16 bg-white border-2 border-slate-200 rounded-xl text-2xl font-bold text-slate-700 hover:border-blue-400 hover:bg-blue-50 shadow-sm";
                btn.innerText = val;
                btn.onclick = () => fillSlot(val);
                optionsGrid.appendChild(btn);
            });
        }

        function fillSlot(value) {
            const prog = userProgress[currentIdx];
            if (prog.isCorrect) return;

            // 依據規則：先填分母，後填分子
            const slotDenom = document.getElementById('slot-denominator');
            const slotNum = document.getElementById('slot-numerator');

            if (!prog.denominator) {
                prog.denominator = value;
                slotDenom.innerText = value;
                slotDenom.classList.add('filled');
            } else if (!prog.numerator) {
                prog.numerator = value;
                slotNum.innerText = value;
                slotNum.classList.add('filled');
            }
        }

        // 新增：清除特定填答格的功能
        function clearSlot(type) {
            const prog = userProgress[currentIdx];
            if (prog.isCorrect) return; // 已正確就不給動

            if (type === 'numerator' && prog.numerator !== null) {
                prog.numerator = null;
                const s = document.getElementById('slot-numerator');
                s.innerText = '';
                s.classList.remove('filled');
            } else if (type === 'denominator' && prog.denominator !== null) {
                prog.denominator = null;
                const s = document.getElementById('slot-denominator');
                s.innerText = '';
                s.classList.remove('filled');
            }
        }

        function checkAnswer() {
            const prog = userProgress[currentIdx];
            const q = questions[currentIdx];

            if (!prog.denominator || !prog.numerator) {
                showMessage("請填滿所有空格");
                return;
            }

            if (prog.denominator === q.back && prog.numerator === q.front) {
                prog.isCorrect = true;
                score += 1;
                updateUI();

                const stepElement = document.getElementById('step-1');
                stepElement.classList.add('tada', 'border-green-500');

                setTimeout(() => {
                    if (currentIdx < questions.length - 1) {
                        loadQuestion(currentIdx + 1);
                        stepContainer.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        checkAllFinished();
                    }
                }, 1000);
            } else {
                showMessage("再想想看喔！提示：前項在上面，後項在下面。");
            }
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            initNav();
        }

        function showMessage(text) {
            const oldMsg = document.querySelector('.toast-msg');
            if (oldMsg) oldMsg.remove();

            const msg = document.createElement('div');
            msg.className = "toast-msg fixed top-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-bounce";
            msg.innerText = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isGameOver) return;
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function checkAllFinished() {
            const allDone = userProgress.every(p => p.isCorrect);
            if (allDone) {
                endGame();
            }
        }

        function endGame() {
            isGameOver = true;
            clearInterval(timerInterval);

            const usedTime = 420 - timeLeft;
            const mins = Math.floor(usedTime / 60);
            const secs = usedTime % 60;

            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            document.getElementById('modal-result').innerText = `作答時間：${mins}分${secs}秒\n獲得分數：${score} 分 / ${questions.length} 分`;
        }

        function resetGame() {
            score = 0;
            timeLeft = 420;
            currentIdx = 0;
            isGameOver = false;
            userProgress.forEach(p => {
                p.denominator = null;
                p.numerator = null;
                p.isCorrect = false;
            });
            updateUI();
            closeModal();
            loadQuestion(0);
            startTimer();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('flex');
            document.getElementById('modal-overlay').classList.add('hidden');
        }
    </script>
</body>

</html>
