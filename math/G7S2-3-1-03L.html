<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誰比較大？互動解題工具</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }

        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .fraction span:first-child {
            border-bottom: 2px solid #000;
            padding: 0 4px;
        }

        .mixed {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .slot {
            display: inline-block;
            width: 60px;
            height: 45px;
            border-bottom: 3px solid #cbd5e1;
            margin: 0 4px;
            text-align: center;
            font-weight: bold;
            font-size: 1.25rem;
            color: #1e40af;
            vertical-align: middle;
            transition: all 0.3s;
        }

        .slot.filled {
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            color: #15803d;
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .animate-tada {
            animation: tada 0.8s ease-in-out;
        }

        .step-enter {
            opacity: 0;
            transform: translateY(20px);
        }

        .step-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.5s ease-out;
        }

        .nav-active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* 隱藏捲動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 flex-1 overflow-hidden">
                <span class="text-blue-600 font-bold whitespace-nowrap hidden sm:inline">單元：誰比較大</span>
                <div id="nav-container" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    <!-- 題目按鈕會由 JS 生成 -->
                </div>
            </div>
            <div class="flex items-center gap-4 text-lg font-bold whitespace-nowrap">
                <div class="flex items-center bg-yellow-100 px-3 py-1 rounded-full">
                    <span class="mr-1">⏱️</span>
                    <span id="timer">07:00</span>
                </div>
                <div class="flex items-center bg-green-100 px-3 py-1 rounded-full">
                    <span class="mr-1">⭐</span>
                    <span id="total-score">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col md:flex-row max-w-7xl mx-auto w-full p-4 gap-6">

        <!-- 左側：題目區 (Sticky) -->
        <aside class="md:w-1/3">
            <div class="md:sticky md:top-20 bg-white p-6 rounded-2xl shadow-sm border-l-8 border-yellow-400 h-fit">
                <h2 class="text-2xl font-bold text-gray-800 mb-4" id="q-title">題目載入中...</h2>
                <div id="q-context" class="text-lg text-gray-600 leading-relaxed mb-6">
                    <!-- 題目內容 -->
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                    <p class="text-green-700 font-medium flex items-center">
                        <span class="mr-2">💡</span> 小秘訣：算出比值，數字大的就贏了！
                    </p>
                </div>
            </div>
        </aside>

        <!-- 右側：步驟解鎖流程 -->
        <section class="flex-1 space-y-6" id="steps-container">
            <!-- 步驟會由 JS 動態生成 -->
        </section>

    </main>

    <!-- 完成視窗 -->
    <div id="finish-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-tada">
            <div class="text-6xl mb-4">🎉</div>
            <h3 class="text-2xl font-bold mb-2">全部完成！</h3>
            <p class="text-gray-600 mb-2" id="finish-score-text"></p>
            <p class="text-gray-600 mb-6" id="finish-time-text"></p>
            <div class="flex flex-col gap-3">
                <button onclick="resetApp()"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition">再做一次</button>
                <button onclick="closeModal()"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "誰比較準？",
                context: "比較：投 <mark>10</mark> 球進 <mark>8</mark> 球 vs 投 <mark>10</mark> 球進 <mark>2</mark> 球。",
                steps: [
                    {
                        text: "第一個人投了幾個球？進了幾個球？",
                        slots: 2,
                        options: ["10", "8", "2", "5"],
                        answers: ["10", "8"]
                    },
                    {
                        text: "第二個人投了幾個球？進了幾個球？",
                        slots: 2,
                        options: ["10", "8", "2", "5"],
                        answers: ["10", "2"]
                    },
                    {
                        text: "誰進球的數量比較多？",
                        slots: 1,
                        options: ["第一個人", "第二個人"],
                        answers: ["第一個人"]
                    }
                ]
            },
            {
                id: 2,
                title: "誰比較甜？",
                context: "比較：<mark>500ml</mark> 水加 <mark>10</mark> 匙糖 vs <mark>500ml</mark> 水加 <mark>2</mark> 匙糖。",
                steps: [
                    {
                        text: "第一杯加了幾匙糖？",
                        slots: 1,
                        options: ["500", "10", "2"],
                        answers: ["10"]
                    },
                    {
                        text: "第二杯加了幾匙糖？",
                        slots: 1,
                        options: ["500", "10", "2"],
                        answers: ["2"]
                    },
                    {
                        text: "糖加得越多就越甜，哪一杯比較甜？",
                        slots: 1,
                        options: ["第一杯", "第二杯"],
                        answers: ["第一杯"]
                    }
                ]
            },
            {
                id: 3,
                title: "誰比較快？",
                context: "比較：<mark>1</mark> 分鐘跑 <mark>100</mark> 公尺 vs <mark>1</mark> 分鐘跑 <mark>20</mark> 公尺。",
                steps: [
                    {
                        text: "甲跑了多少公尺？",
                        slots: 1,
                        options: ["1", "100", "20"],
                        answers: ["100"]
                    },
                    {
                        text: "乙跑了多少公尺？",
                        slots: 1,
                        options: ["1", "100", "20"],
                        answers: ["20"]
                    },
                    {
                        text: "同樣時間跑越遠就越快，誰比較快？",
                        slots: 1,
                        options: ["甲", "乙"],
                        answers: ["甲"]
                    }
                ]
            },
            {
                id: 4,
                title: "哪邊東西多？",
                context: "比較：<mark>100</mark> 元買 <mark>5</mark> 個 vs <mark>100</mark> 元買 <mark>2</mark> 個。",
                steps: [
                    {
                        text: "第一種買法買到幾個？",
                        slots: 1,
                        options: ["100", "5", "2"],
                        answers: ["5"]
                    },
                    {
                        text: "第二種買法買到幾個？",
                        slots: 1,
                        options: ["100", "5", "2"],
                        answers: ["2"]
                    },
                    {
                        text: "哪一種買法買到的東西比較多？",
                        slots: 1,
                        options: ["第一種", "第二種"],
                        answers: ["第一種"]
                    }
                ]
            },
            {
                id: 5,
                title: "誰命中率高？",
                context: "比較：打 <mark>5</mark> 次中 <mark>4</mark> 次 vs 打 <mark>5</mark> 次中 <mark>1</mark> 次。",
                steps: [
                    {
                        text: "A 打中了幾次？",
                        slots: 1,
                        options: ["5", "4", "1"],
                        answers: ["4"]
                    },
                    {
                        text: "B 打中了幾次？",
                        slots: 1,
                        options: ["5", "4", "1"],
                        answers: ["1"]
                    },
                    {
                        text: "誰打中的次數比較多（命中率高）？",
                        slots: 1,
                        options: ["A", "B"],
                        answers: ["A"]
                    }
                ]
            }
        ];

        let currentQIndex = 0;
        let currentStepIndex = 0;
        let totalScore = 0;
        let timeLeft = 420; // 7 minutes
        let timerInterval;
        let isGameFinished = false;

        // 初始化
        function init() {
            renderNav();
            renderQuestion();
            startTimer();
        }

        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1 rounded-full whitespace-nowrap transition-all border ${index === currentQIndex ? 'nav-active' : 'bg-white text-gray-600 border-gray-200'}`;
                btn.innerText = `題目 ${index + 1}`;
                btn.onclick = () => switchQuestion(index);
                container.appendChild(btn);
            });
        }

        function switchQuestion(index) {
            if (isGameFinished) return;
            currentQIndex = index;
            currentStepIndex = 0; // 重啟該題進度
            renderNav();
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQIndex];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-context').innerHTML = q.context;

            const stepsContainer = document.getElementById('steps-container');
            stepsContainer.innerHTML = '';

            // 初始顯示第一步
            addStep(0);
        }

        function addStep(stepIdx) {
            const stepData = questions[currentQIndex].steps[stepIdx];
            const stepDiv = document.createElement('div');
            stepDiv.className = 'bg-white p-6 rounded-2xl shadow-sm border border-gray-100 step-enter transition-all duration-500';
            stepDiv.id = `step-${stepIdx}`;

            let slotHTML = '';
            for (let i = 0; i < stepData.slots; i++) {
                slotHTML += `<span class="slot" data-slot="${i}"></span>`;
            }

            stepDiv.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-blue-800">步驟 ${stepIdx + 1}</h3>
                    <span id="step-status-${stepIdx}" class="text-sm font-bold"></span>
                </div>
                <p class="text-lg text-gray-700 mb-6 flex items-center flex-wrap gap-2">
                    ${stepData.text} ${slotHTML}
                </p>
                <div id="options-${stepIdx}" class="flex flex-wrap gap-3">
                    ${stepData.options.map(opt => `
                        <button onclick="fillSlot('${opt}', ${stepIdx})" class="bg-white border-2 border-blue-200 hover:border-blue-400 text-blue-700 font-bold py-2 px-6 rounded-xl transition-all active:scale-95 shadow-sm">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <div id="action-${stepIdx}" class="mt-6 flex gap-4">
                    <button onclick="checkStep(${stepIdx})" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded-xl transition-all shadow-lg">檢查答案</button>
                    <button onclick="resetStep(${stepIdx})" class="text-gray-500 hover:text-gray-700 underline font-medium">重填</button>
                </div>
            `;

            document.getElementById('steps-container').appendChild(stepDiv);

            // 強制重繪以觸發動畫
            setTimeout(() => {
                stepDiv.classList.remove('step-enter');
                stepDiv.classList.add('step-active');
                stepDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        function fillSlot(value, stepIdx) {
            const stepDiv = document.getElementById(`step-${stepIdx}`);
            const slots = stepDiv.querySelectorAll('.slot');
            for (let slot of slots) {
                if (!slot.innerText) {
                    slot.innerText = value;
                    slot.classList.add('filled');
                    break;
                }
            }
        }

        function resetStep(stepIdx) {
            const stepDiv = document.getElementById(`step-${stepIdx}`);
            const slots = stepDiv.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.innerText = '';
                slot.classList.remove('filled', 'correct');
            });
        }

        function checkStep(stepIdx) {
            const stepData = questions[currentQIndex].steps[stepIdx];
            const stepDiv = document.getElementById(`step-${stepIdx}`);
            const slots = stepDiv.querySelectorAll('.slot');
            const studentAnswers = Array.from(slots).map(s => s.innerText);

            if (studentAnswers.some(ans => ans === '')) {
                showMessage("請填滿所有空格喔！", "yellow");
                return;
            }

            const isCorrect = JSON.stringify(studentAnswers) === JSON.stringify(stepData.answers);

            if (isCorrect) {
                // 正確
                slots.forEach(s => s.classList.add('correct'));
                document.getElementById(`step-status-${stepIdx}`).innerHTML = '<span class="text-green-500">✔ 完成</span>';
                document.getElementById(`options-${stepIdx}`).classList.add('hidden');
                document.getElementById(`action-${stepIdx}`).classList.add('hidden');
                stepDiv.classList.add('border-green-300', 'bg-green-50');

                updateScore(1);

                // 檢查是否還有下一步
                if (stepIdx < questions[currentQIndex].steps.length - 1) {
                    addStep(stepIdx + 1);
                } else {
                    // 本題完成
                    handleQuestionComplete();
                }
            } else {
                // 錯誤
                showMessage("再想想看，你可以的！", "red");
            }
        }

        function handleQuestionComplete() {
            if (currentQIndex < questions.length - 1) {
                setTimeout(() => {
                    showMessage("這題太棒了！準備下一題！", "green");
                    switchQuestion(currentQIndex + 1);
                }, 1500);
            } else {
                finishGame();
            }
        }

        function updateScore(pts) {
            totalScore += pts;
            document.getElementById('total-score').innerText = totalScore;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    finishGame();
                    return;
                }
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        function finishGame() {
            clearInterval(timerInterval);
            isGameFinished = true;
            const modal = document.getElementById('finish-modal');
            const scoreText = document.getElementById('finish-score-text');
            const timeText = document.getElementById('finish-time-text');

            scoreText.innerText = `總得分：${totalScore} 分`;
            const timeUsed = 420 - timeLeft;
            const mins = Math.floor(timeUsed / 60);
            const secs = timeUsed % 60;
            timeText.innerText = `作答時間：${mins} 分 ${secs} 秒`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function showMessage(text, color) {
            const msg = document.createElement('div');
            const colorClasses = {
                green: 'bg-green-500',
                red: 'bg-red-500',
                yellow: 'bg-yellow-500'
            };
            msg.className = `fixed top-20 left-1/2 -translate-x-1/2 ${colorClasses[color]} text-white px-8 py-3 rounded-full shadow-2xl z-[200] font-bold transition-all animate-bounce`;
            msg.innerText = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        function resetApp() {
            location.reload();
        }

        function closeModal() {
            document.getElementById('finish-modal').classList.add('hidden');
            document.getElementById('finish-modal').classList.remove('flex');
        }

        window.onload = init;
    </script>
</body>

</html>
