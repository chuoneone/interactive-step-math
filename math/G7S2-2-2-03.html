<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 截距式繪圖褪除練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; user-select: none; }
        .math { font-size: 24px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .slot {
            display: inline-block; width: 44px; height: 44px; border-bottom: 3px solid #94a3b8;
            margin: 0 4px; text-align: center; line-height: 44px; vertical-align: bottom;
            cursor: pointer; transition: all 0.2s; color: #2563eb; font-weight: bold;
            border-radius: 4px 4px 0 0;
        }
        .slot.filled { border-bottom-color: #2563eb; background-color: #eff6ff; }
        .slot.correct { border-bottom-color: #10b981; color: #10b981; background-color: #ecfdf5; }
        .option-btn { transition: all 0.2s; touch-action: manipulation; }
        .option-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: scale(0.9); }
        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .tada { animation: tada 0.8s both; }
        .step-container { transition: all 0.5s ease; max-height: 0; overflow: hidden; opacity: 0; pointer-events: none; }
        .step-container.active { max-height: 2000px; opacity: 1; margin-bottom: 1.5rem; pointer-events: auto; }
        .coordinate-grid line { stroke: #e2e8f0; stroke-width: 1; }
        .coordinate-axis { stroke: #475569; stroke-width: 2; }
        .plot-point { fill: #ef4444; transition: all 0.3s; }
        .plot-line { stroke: #3b82f6; stroke-width: 3; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 1.5s forwards; }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  <link rel="icon" href="../images/dog.png" type="image/png">
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center p-2 no-scrollbar overflow-x-auto whitespace-nowrap">
            <span class="font-bold text-blue-600 px-4 border-r border-slate-200">單元三：截距式繪圖</span>
            <div id="nav-btns" class="flex gap-2 ml-2"></div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- 左側：題目與圖形 -->
            <div class="w-full md:w-1/3 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:sticky md:top-20">
                    <h2 class="text-xl font-bold mb-4 text-slate-800">找兩軸交點繪圖</h2>
                    <div class="mb-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <p class="text-lg font-bold text-blue-800" id="q-title">題目 (1)</p>
                        <div class="math mt-2" id="q-equation"></div>
                    </div>

                    <div class="relative w-full aspect-square bg-white border border-slate-200 rounded-lg overflow-hidden shadow-inner">
                        <svg id="coordinate-plane" viewBox="0 0 300 300" class="w-full h-full">
                            <g class="coordinate-grid" id="grid-lines"></g>
                            <line x1="0" y1="150" x2="300" y2="150" class="coordinate-axis" />
                            <line x1="150" y1="0" x2="150" y2="300" class="coordinate-axis" />
                            <text x="285" y="140" font-size="14" font-style="italic" fill="#475569">x</text>
                            <text x="160" y="15" font-size="14" font-style="italic" fill="#475569">y</text>
                            <text x="135" y="165" font-size="14" fill="#475569">O</text>
                            <g id="drawing-layer"></g>
                        </svg>
                    </div>

                    <!-- 表格 -->
                    <div class="mt-6 border-2 border-slate-200 rounded-lg overflow-hidden bg-white">
                        <table class="w-full text-center">
                            <tr class="bg-slate-50 border-b border-slate-200">
                                <th class="py-2 border-r border-slate-200 w-16 italic text-xl">x</th>
                                <td class="py-2 border-r border-slate-200 text-xl font-bold" id="td-x1">0</td>
                                <td class="py-2 text-xl font-bold" id="td-x2"></td>
                            </tr>
                            <tr>
                                <th class="py-2 border-r border-slate-200 italic text-xl">y</th>
                                <td class="py-2 border-r border-slate-200 h-12" id="table-y1"></td>
                                <td class="py-2 h-12" id="table-y2">0</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 右側：互動步驟 -->
            <div class="w-full md:w-2/3" id="steps-container"></div>
        </div>
    </div>

    <div id="success-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modal-content">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">挑戰成功！</h2>
            <p class="text-slate-600 mb-8">你已經掌握了繪製直線的技巧！</p>
            <div class="space-y-3">
                <button onclick="nextQuestOrReset()" id="modal-next-btn" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors">下一題</button>
                <button onclick="closeModal()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1, fading: "全提示", equation: "2x + 3y = 12",
                equationHtml: '<mark class="bg-yellow-100 px-1">2x</mark> + <mark class="bg-yellow-100 px-1">3y</mark> = 12',
                pts: { x0: 6, y0: 4 }, 
                steps: [
                    { title: "找 y 軸交點 (x=0)", content: "此時 <span class='text-red-500 font-bold'>3y = 12</span>，所以 y = <span class='slot' data-ans='4'></span>", opts: ["4", "3", "0"] },
                    { title: "找 x 軸交點 (y=0)", content: "此時 <span class='text-blue-600 font-bold'>2x = 12</span>，所以 x = <span class='slot' data-ans='6'></span>", opts: ["6", "2", "0"] },
                    { title: "確認兩點座標", content: "y 軸交點 ( 0 , <span class='slot' data-ans='4'></span> ) <br> x 軸交點 ( <span class='slot' data-ans='6'></span> , 0 )", opts: ["4", "6", "0"] }
                ]
            },
            {
                id: 2, fading: "半提示", equation: "3x + 4y = 12",
                equationHtml: '<mark class="bg-yellow-100 px-1">3x</mark> + <mark class="bg-yellow-100 px-1">4y</mark> = 12',
                pts: { x0: 4, y0: 3 },
                steps: [
                    { title: "找 y 軸交點 (x=0)", content: "3 &times; 0 + 4y = 12 <br> &rArr; <span class='slot' data-ans='4'></span>y = <span class='slot' data-ans='12'></span> <br> &rArr; y = <span class='slot' data-ans='3'></span>", opts: ["4", "12", "3", "0"] },
                    { title: "找 x 軸交點 (y=0)", content: "3x + 4 &times; 0 = 12 <br> &rArr; <span class='slot' data-ans='3'></span>x = <span class='slot' data-ans='12'></span> <br> &rArr; x = <span class='slot' data-ans='4'></span>", opts: ["3", "12", "4", "0"] },
                    { title: "確認兩點座標", content: "交點為 ( 0 , <span class='slot' data-ans='3'></span> ) 與 ( <span class='slot' data-ans='4'></span> , 0 )", opts: ["3", "4"] }
                ]
            },
            {
                id: 3, fading: "低提示", equation: "x - 2y = 4",
                equationHtml: '<mark class="bg-yellow-100 px-1">x</mark> - <mark class="bg-yellow-100 px-1">2y</mark> = 4',
                pts: { x0: 4, y0: -2 },
                steps: [
                    { title: "找 y 軸交點 (x=0)", content: "代入 x = 0： <br> <span class='slot' data-ans='0'></span> - 2y = 4 <br> &rArr; -2y = <span class='slot' data-ans='4'></span> <br> &rArr; y = <span class='slot' data-ans='-2'></span>", opts: ["0", "4", "-2", "2"] },
                    { title: "找 x 軸交點 (y=0)", content: "代入 y = 0： <br> x - 2 &times; <span class='slot' data-ans='0'></span> = 4 <br> &rArr; x = <span class='slot' data-ans='4'></span>", opts: ["0", "4"] },
                    { title: "確認兩點座標", content: "( 0 , <span class='slot' data-ans='-2'></span> ) 與 ( <span class='slot' data-ans='4'></span> , 0 )", opts: ["-2", "4"] }
                ]
            },
            {
                id: 4, fading: "無提示", equation: "2x - 5y = 10",
                equationHtml: '<mark class="bg-yellow-100 px-1">2x</mark> - <mark class="bg-yellow-100 px-1">5y</mark> = 10',
                pts: { x0: 5, y0: -2 },
                steps: [
                    { title: "計算 y 軸交點 (x=0)", content: "當 x = 0 時： <br> <span class='slot' data-ans='2'></span> &times; <span class='slot' data-ans='0'></span> - 5y = 10 <br> &rArr; -5y = <span class='slot' data-ans='10'></span> <br> &rArr; y = <span class='slot' data-ans='-2'></span>", opts: ["2", "0", "10", "-2", "5"] },
                    { title: "計算 x 軸交點 (y=0)", content: "當 y = 0 時： <br> 2x - <span class='slot' data-ans='5'></span> &times; <span class='slot' data-ans='0'></span> = 10 <br> &rArr; 2x = <span class='slot' data-ans='10'></span> <br> &rArr; x = <span class='slot' data-ans='5'></span>", opts: ["5", "0", "10", "2"] },
                    { title: "列出兩點座標", content: "交點：( <span class='slot' data-ans='0'></span> , <span class='slot' data-ans='-2'></span> ) 與 ( <span class='slot' data-ans='5'></span> , <span class='slot' data-ans='0'></span> )", opts: ["0", "-2", "5", "0"] }
                ]
            }
        ];

        let curIdx = 0;

        function init() {
            const nav = document.getElementById('nav-btns');
            nav.innerHTML = questions.map((q, i) => `
                <button onclick="loadQuest(${i})" class="nav-btn px-4 py-1.5 rounded-full font-bold transition-all ${i===0?'bg-blue-600 text-white shadow-md':'bg-slate-100 text-slate-500'}">題目 ${q.id}</button>
            `).join('');
            
            drawGrid();
            loadQuest(0);
        }

        function drawGrid() {
            const g = document.getElementById('grid-lines');
            for (let i = 0; i <= 300; i += 20) {
                const l1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l1.setAttribute("x1", i); l1.setAttribute("y1", 0); l1.setAttribute("x2", i); l1.setAttribute("y2", 300);
                g.appendChild(l1);
                const l2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l2.setAttribute("x1", 0); l2.setAttribute("y1", i); l2.setAttribute("x2", 300); l2.setAttribute("y2", i);
                g.appendChild(l2);
            }
        }

        function loadQuest(idx) {
            curIdx = idx;
            const q = questions[idx];
            
            // 更新導覽
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.className = `nav-btn px-4 py-1.5 rounded-full font-bold transition-all ${i===idx?'bg-blue-600 text-white shadow-md':'bg-slate-100 text-slate-500'}`;
            });

            document.getElementById('q-title').innerText = `題目 (${q.id}) - ${q.fading}`;
            document.getElementById('q-equation').innerHTML = q.equationHtml;
            document.getElementById('td-x2').innerText = '';
            document.getElementById('table-y1').innerText = '';
            document.getElementById('drawing-layer').innerHTML = '';

            const container = document.getElementById('steps-container');
            container.innerHTML = q.steps.map((s, si) => `
                <div id="step-${si}" class="step-container ${si===0?'active':''}">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-blue-500">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold flex items-center gap-2"><span class="bg-blue-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm">${si+1}</span> ${s.title}</h3>
                            <span id="step-${si}-status" class="text-green-500 font-bold hidden">✔ 完成</span>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl mb-4 text-xl leading-relaxed">${s.content}</div>
                        <div class="flex flex-wrap gap-2" id="opts-${si}">${s.opts.map((o, oi) => `<button data-oid="${si}-${oi}" onclick="tapOpt(${si}, '${o}', this)" class="option-btn w-12 h-12 bg-white border-2 border-slate-200 rounded-lg font-bold text-slate-700">${o}</button>`).join('')}</div>
                        <button onclick="checkStep(${si})" id="check-${si}" class="mt-6 w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100">檢查答案</button>
                    </div>
                </div>
            `).join('');

            // 最後一階繪圖
            const final = document.createElement('div');
            final.id = `step-${q.steps.length}`;
            final.className = "step-container";
            final.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-indigo-500">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="bg-indigo-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm">${q.steps.length+1}</span> 完成圖形</h3>
                    <button onclick="drawMainLine()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-xl shadow-indigo-100 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg> 繪製直線
                    </button>
                </div>
            `;
            container.appendChild(final);

            // 初始化 Slot 點擊清除
            container.querySelectorAll('.slot').forEach(s => {
                s.onclick = () => {
                    if (s.classList.contains('correct')) return;
                    const oid = s.dataset.boundOid;
                    if (oid) document.querySelector(`[data-oid="${oid}"]`).disabled = false;
                    s.innerText = ''; s.classList.remove('filled'); delete s.dataset.boundOid;
                };
            });
        }

        function tapOpt(si, val, btn) {
            const slots = document.querySelectorAll(`#step-${si} .slot`);
            for (let s of slots) {
                if (!s.innerText) {
                    s.innerText = val; s.classList.add('filled');
                    s.dataset.boundOid = btn.dataset.oid;
                    btn.disabled = true; return;
                }
            }
        }

        function checkStep(si) {
            const step = document.getElementById(`step-${si}`);
            const slots = step.querySelectorAll('.slot');
            let filled = true, ok = true;
            slots.forEach(s => { if(!s.innerText) filled = false; if(s.innerText !== s.dataset.ans) ok = false; });

            if(!filled) { toast("請填滿空格"); return; }
            if(ok) {
                slots.forEach(s => { s.classList.add('correct', 'tada'); s.onclick = null; });
                document.getElementById(`step-${si}-status`).classList.remove('hidden');
                document.getElementById(`opts-${si}`).classList.add('hidden');
                document.getElementById(`check-${si}`).classList.add('hidden');

                // 填入表格
                if(si === 0) {
                    document.getElementById('table-y1').innerText = slots[slots.length-1].innerText;
                    document.getElementById('table-y1').className = "py-2 border-r border-slate-200 text-blue-600 font-bold text-xl";
                } else if(si === 1) {
                    document.getElementById('td-x2').innerText = slots[slots.length-1].innerText;
                    document.getElementById('td-x2').className = "py-2 text-blue-600 font-bold text-xl";
                } else if(si === 2) {
                    renderPoints();
                }

                const next = document.getElementById(`step-${si+1}`);
                if(next) {
                    next.classList.add('active');
                    setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
                }
            } else { toast("再算一次看看喔！"); }
        }

        function renderPoints() {
            const q = questions[curIdx];
            const l = document.getElementById('drawing-layer');
            [{x:0, y:q.pts.y0}, {x:q.pts.x0, y:0}].forEach(p => {
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", 150 + p.x*20); c.setAttribute("cy", 150 - p.y*20);
                c.setAttribute("r", 6); c.setAttribute("class", "plot-point");
                l.appendChild(c);
            });
        }

        function drawMainLine() {
            const q = questions[curIdx];
            const l = document.getElementById('drawing-layer');
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            // y = mx + b. m = (y2-y1)/(x2-x1). For (0,y0) and (x0,0), m = -y0/x0.
            const m = -q.pts.y0 / q.pts.x0;
            const x1 = -7.5, y1 = m * (x1 - q.pts.x0);
            const x2 = 7.5, y2 = m * (x2 - q.pts.x0);
            line.setAttribute("x1", 150 + x1*20); line.setAttribute("y1", 150 - y1*20);
            line.setAttribute("x2", 150 + x2*20); line.setAttribute("y2", 150 - y2*20);
            line.setAttribute("class", "plot-line");
            l.appendChild(line);
            setTimeout(showSuccess, 1600);
        }

        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full z-[200]";
            t.innerText = m; document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function showSuccess() {
            document.getElementById('success-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-content').classList.remove('scale-90');
            document.getElementById('modal-next-btn').innerText = curIdx < questions.length - 1 ? "下一關" : "重新開始";
        }

        function closeModal() {
            document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-content').classList.add('scale-90');
        }

        function nextQuestOrReset() {
            closeModal();
            if(curIdx < questions.length - 1) loadQuest(curIdx + 1);
            else loadQuest(0);
        }

        window.onload = init;
    </script>
<script src="../progress.js"></script>
  <script src="../quiz-kit.js"></script>
</body>
</html>
