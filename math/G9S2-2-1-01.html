<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四分位數互動練習 - 引導計算版</title>
    <link rel="icon" href="dog.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- KaTeX Auto-render Extension -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 55px;
            height: 45px;
            border-bottom: 4px solid #3b82f6;
            margin: 0 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: #1e40af;
            background-color: #eff6ff;
            border-radius: 6px 6px 0 0;
            vertical-align: middle;
        }

        .slot.filled {
            border-bottom-color: #10b981;
            color: #047857;
            background-color: #f0fdf4;
        }

        .btn-option {
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-option:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            transform: scale(0.9);
        }

        .step-container {
            display: none;
            border-left: 6px solid #e5e7eb;
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
            background: white;
            border-radius: 0 1rem 1rem 0;
        }

        .step-active {
            display: block;
            border-left-color: #3b82f6;
            animation: fadeInRight 0.5s;
        }

        .step-done {
            display: block;
            border-left-color: #10b981;
            opacity: 0.9;
        }

        .num-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            min-width: 50px;
        }

        .num-box .index {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: normal;
        }

        .num-box.highlight {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: scale(1.1);
        }

        @keyframes tada-custom {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-2deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.05) rotate(2deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.05) rotate(-2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .tada {
            animation: tada-custom 0.8s;
        }

        .sticky-side {
            position: sticky;
            top: 1.5rem;
            height: fit-content;
        }

        /* 倒計時與成績樣式 */
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: center;
        }
        .timer-warning { color: #fbbf24; }
        .timer-danger { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .timer-btn {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .timer-btn:hover { transform: scale(1.05); }
        .timer-btn-start { background: #22c55e; color: white; }
        .timer-btn-pause { background: #f59e0b; color: white; }
        .timer-btn-reset { background: #6b7280; color: white; }
        .score-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body class="p-3 md:p-6">

    <!-- 頂部導覽 -->
    <div class="max-w-7xl mx-auto mb-6">
        <div class="bg-white rounded-2xl shadow-sm p-3 flex items-center overflow-hidden border border-gray-100 flex-wrap md:flex-nowrap gap-3">
            <div class="px-5 py-2 bg-blue-600 text-white rounded-xl font-bold whitespace-nowrap flex-shrink-0">
                單元：四分位數計算
            </div>
            <div id="nav-container" class="flex gap-3 overflow-x-auto pb-1 flex-grow"></div>
            <!-- 倒計時 & 成績 -->
            <div class="flex items-center gap-3 shrink-0 ml-auto md:ml-3">
                <div class="score-bar">
                    <span>🏆</span>
                    <span id="score-display">0</span>/<span id="score-total">4</span>
                    <button onclick="showScoreHistory()" class="timer-btn" style="background:#818cf8;color:#fff;padding:2px 8px;font-size:12px;" title="查看歷史成績">📋</button>
                </div>
                <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-1">
                    <span>⏱️</span>
                    <span id="timer-display" class="timer-display">07:00</span>
                    <button id="timer-start-btn" onclick="toggleTimer()" class="timer-btn timer-btn-pause">暫停</button>
                    <button onclick="resetTimer()" class="timer-btn timer-btn-reset">重置</button>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto flex flex-col md:flex-row gap-6">

        <!-- 左側：資料顯示區 -->
        <div class="w-full md:w-5/12">
            <div id="problem-card" class="bg-white rounded-3xl shadow-xl p-6 sticky-side border-b-8 border-blue-500">
                <h2 id="prob-title" class="text-xl font-black text-gray-800 mb-4">題目載入中...</h2>
                <p class="text-gray-500 text-sm mb-4">共有 <span id="data-count" class="font-bold text-blue-600"></span>
                    筆資料 ($n$)</p>

                <div id="data-display" class="flex flex-wrap gap-2 justify-start mb-6">
                    <!-- 數列與編號會由 JS 生成 -->
                </div>

                <div class="mt-8 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <div id="formula-info" class="text-sm space-y-2 text-slate-600 leading-relaxed">
                        第 $k$ 四分位數位置：$n \times \frac{k}{4}$<br>
                        • 若為小數，無條件進位取該位置的數值。<br>
                        • 若為整數，取該位置與下一位置數值的平均。
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：計算步驟區 -->
        <div class="w-full md:w-7/12">
            <div id="steps-container" class="space-y-4">
                <!-- 步驟載入 -->
            </div>
        </div>
    </main>

    <!-- 完成彈窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div
            class="bg-white rounded-[2.5rem] p-10 max-w-md w-full text-center shadow-2xl animate__animated animate__zoomIn">
            <div class="text-7xl mb-6">🏆</div>
            <h3 class="text-2xl font-black text-gray-800 mb-3">計算完成！</h3>
            <p class="text-gray-500 mb-8">你已經學會如何計算四分位數的位置與數值了。</p>
            <div class="flex flex-col gap-4">
                <button onclick="resetCurrentQuestion()"
                    class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg">再練習一次</button>
                <button onclick="closeModal()"
                    class="w-full py-4 bg-gray-100 text-gray-600 rounded-2xl font-bold text-lg">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 成績歷史 Modal -->
    <div id="score-history-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div
            class="bg-white rounded-[2.5rem] p-8 max-w-md w-full text-center shadow-2xl animate__animated animate__zoomIn">
            <h3 class="text-2xl font-black text-gray-800 mb-4">📊 歷史成績紀錄</h3>
            <div id="score-history-content" class="w-full text-left mb-6 max-h-[300px] overflow-y-auto"></div>
            <div class="flex gap-3 w-full">
                <button onclick="clearScoreHistory()"
                    class="flex-1 bg-red-100 text-red-600 font-bold py-3 px-4 rounded-xl hover:bg-red-200 transition-colors">清除紀錄</button>
                <button onclick="closeScoreHistory()"
                    class="flex-1 bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition-colors">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "第一題：9 筆資料",
                data: [1, 2, 3, 4, 5, 6, 7, 8, 9],
                steps: [
                    { label: "計算 $Q_1$ 位置", instruction: "$Q_1$ 位置：$9 \\times \\frac{1}{4} =$ <span class='slot' data-ans='2.25'></span>", options: ["2", "2.25", "2.5", "3"] },
                    { label: "找出 $Q_1$ 數值", instruction: "無條件進位，取第 3 位對應的數值：<span class='slot' data-ans='3'></span>", options: ["2", "3", "4", "5"] },
                    { label: "計算 $Q_2$ 位置", instruction: "$Q_2$ 位置：$9 \\times \\frac{2}{4} =$ <span class='slot' data-ans='4.5'></span>", options: ["4.5", "5", "5.5", "10"] },
                    { label: "找出 $Q_2$ 數值", instruction: "無條件進位，取第 5 位對應的數值：<span class='slot' data-ans='5'></span>", options: ["4", "5", "6", "9"] },
                    { label: "計算 $Q_3$ 位置", instruction: "$Q_3$ 位置：$9 \\times \\frac{3}{4} =$ <span class='slot' data-ans='6.75'></span>", options: ["6", "6.5", "6.75", "7"] },
                    { label: "找出 $Q_3$ 數值", instruction: "無條件進位，取第 7 位對應的數值：<span class='slot' data-ans='7'></span>", options: ["6", "7", "8", "9"] }
                ]
            },
            {
                id: 2,
                title: "第二題：11 筆資料",
                data: [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32],
                steps: [
                    { label: "計算 $Q_1$ 位置", instruction: "$Q_1$ 位置：$11 \\times \\frac{1}{4} =$ <span class='slot' data-ans='2.75'></span>", options: ["2.5", "2.75", "3", "3.25"] },
                    { label: "找出 $Q_1$ 數值", instruction: "無條件進位，取第 3 位對應的數值：<span class='slot' data-ans='8'></span>", options: ["5", "8", "11", "14"] },
                    { label: "計算 $Q_2$ 位置", instruction: "$Q_2$ 位置：$11 \\times \\frac{2}{4} =$ <span class='slot' data-ans='5.5'></span>", options: ["5.5", "6", "6.5", "12"] },
                    { label: "找出 $Q_2$ 數值", instruction: "無條件進位，取第 6 位對應的數值：<span class='slot' data-ans='17'></span>", options: ["14", "17", "20", "23"] },
                    { label: "計算 $Q_3$ 位置", instruction: "$Q_3$ 位置：$11 \\times \\frac{3}{4} =$ <span class='slot' data-ans='8.25'></span>", options: ["8", "8.25", "8.5", "9"] },
                    { label: "找出 $Q_3$ 數值", instruction: "無條件進位，取第 9 位對應的數值：<span class='slot' data-ans='26'></span>", options: ["23", "26", "29", "32"] }
                ]
            },
            {
                id: 3,
                title: "第三題：13 筆資料",
                data: [3, 4, 4, 5, 5, 5, 11, 11, 13, 13, 20, 21, 28],
                steps: [
                    { label: "計算 $Q_1$ 位置", instruction: "$Q_1$ 位置：$13 \\times \\frac{1}{4} =$ <span class='slot' data-ans='3.25'></span>", options: ["3", "3.25", "3.5", "4"] },
                    { label: "找出 $Q_1$ 數值", instruction: "無條件進位，取第 4 位對應的數值：<span class='slot' data-ans='5'></span>", options: ["4", "5", "11", "13"] },
                    { label: "計算 $Q_2$ 位置", instruction: "$Q_2$ 位置：$13 \\times \\frac{2}{4} =$ <span class='slot' data-ans='6.5'></span>", options: ["6", "6.5", "7", "14"] },
                    { label: "找出 $Q_2$ 數值", instruction: "無條件進位，取第 7 位對應的數值：<span class='slot' data-ans='11'></span>", options: ["5", "11", "13", "20"] },
                    { label: "計算 $Q_3$ 位置", instruction: "$Q_3$ 位置：$13 \\times \\frac{3}{4} =$ <span class='slot' data-ans='9.75'></span>", options: ["9", "9.5", "9.75", "10"] },
                    { label: "找出 $Q_3$ 數值", instruction: "無條件進位，取第 10 位對應的數值：<span class='slot' data-ans='13'></span>", options: ["11", "13", "20", "21"] }
                ]
            },
            {
                id: 4,
                title: "第四題：15 筆資料",
                data: [8, 8, 9, 9, 10, 10, 11, 11, 22, 22, 24, 24, 40, 40, 45],
                steps: [
                    { label: "計算 $Q_1$ 位置", instruction: "$Q_1$ 位置：$15 \\times \\frac{1}{4} =$ <span class='slot' data-ans='3.75'></span>", options: ["3.5", "3.75", "4", "4.25"] },
                    { label: "找出 $Q_1$ 數值", instruction: "無條件進位，取第 4 位對應的數值：<span class='slot' data-ans='9'></span>", options: ["8", "9", "10", "11"] },
                    { label: "計算 $Q_2$ 位置", instruction: "$Q_2$ 位置：$15 \\times \\frac{2}{4} =$ <span class='slot' data-ans='7.5'></span>", options: ["7", "7.5", "8", "16"] },
                    { label: "找出 $Q_2$ 數值", instruction: "無條件進位，取第 8 位對應的數值：<span class='slot' data-ans='11'></span>", options: ["10", "11", "22", "24"] },
                    { label: "計算 $Q_3$ 位置", instruction: "$Q_3$ 位置：$15 \\times \\frac{3}{4} =$ <span class='slot' data-ans='11.25'></span>", options: ["11", "11.25", "11.5", "12"] },
                    { label: "找出 $Q_3$ 數值", instruction: "無條件進位，取第 12 位對應的數值：<span class='slot' data-ans='24'></span>", options: ["22", "24", "40", "45"] }
                ]
            }
        ];

        let currentQIdx = 0;
        
        // 倒計時與成績變數
        const TOTAL_SECONDS = 7 * 60; // 7 分鐘
        let remainingSeconds = TOTAL_SECONDS;
        let timerInterval = null;
        let timerRunning = false;
        const SCORE_KEY = 'G9S2-2-1-01_scores';
        let completedQuestions = new Set();
        let correctCount = 0;
        let totalProblems = 0;

        function renderMathContent(id) {
            const el = document.getElementById(id);
            if (el) renderMathInElement(el, { delimiters: [{ left: '$', right: '$', display: false }, { left: '$$', right: '$$', display: true }] });
        }

        function initNav() {
            const container = document.getElementById('nav-container');
            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${idx}`;
                btn.className = `px-6 py-2 rounded-xl font-bold transition-all border-2 whitespace-nowrap ${idx === 0 ? 'bg-blue-50 border-blue-600 text-blue-700' : 'bg-white border-transparent text-gray-400 hover:bg-gray-50'}`;
                btn.innerText = `題目 ${idx + 1}`;
                btn.onclick = () => switchQuestion(idx);
                container.appendChild(btn);
            });
        }

        function switchQuestion(idx) {
            currentQIdx = idx;
            questions.forEach((_, i) => {
                document.getElementById(`nav-btn-${i}`).className = `px-6 py-2 rounded-xl font-bold transition-all border-2 whitespace-nowrap ${i === idx ? 'bg-blue-50 border-blue-600 text-blue-700' : 'bg-white border-transparent text-gray-400 hover:bg-gray-50'}`;
            });
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQIdx];
            document.getElementById('prob-title').innerText = q.title;
            document.getElementById('data-count').innerText = q.data.length;

            // 渲染左側數列
            const display = document.getElementById('data-display');
            display.innerHTML = q.data.map((val, i) => `
                <div class="num-box" id="num-box-${i + 1}">
                    <span class="text-xl font-bold text-gray-800">${val}</span>
                    <span class="index">第${i + 1}位</span>
                </div>
            `).join('');

            // 渲染步驟
            const container = document.getElementById('steps-container');
            container.innerHTML = q.steps.map((step, sIdx) => `
                <div id="step-${sIdx}" class="step-container p-6 shadow-sm ${sIdx === 0 ? 'step-active' : ''}">
                    <div class="flex justify-between items-center mb-4">
                        <span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-xs font-bold">${step.label}</span>
                        <span id="check-icon-${sIdx}" class="hidden text-green-500 font-bold">✔ OK</span>
                    </div>
                    <p class="text-xl text-gray-800 mb-6">${step.instruction}</p>
                    <div id="action-area-${sIdx}">
                        <div id="options-${sIdx}" class="flex flex-wrap gap-2">
                            ${step.options.map(opt => `<button onclick="handleFill(${sIdx}, '${opt}', this)" class="px-6 py-3 bg-white border-2 border-gray-100 rounded-xl text-xl font-bold hover:border-blue-400 transition-all">${opt}</button>`).join('')}
                        </div>
                        <div class="mt-6 flex items-center gap-4">
                            <button id="check-btn-${sIdx}" onclick="checkStep(${sIdx})" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md">確認</button>
                            <span id="feedback-${sIdx}" class="text-rose-500 font-bold hidden">再想想看</span>
                        </div>
                    </div>
                </div>
            `).join('');

            renderMathContent('problem-card');
            q.steps.forEach((_, i) => renderMathContent(`step-${i}`));
            setupSlotClicks();
        }

        function setupSlotClicks() {
            document.querySelectorAll('.slot').forEach(slot => {
                slot.onclick = function () {
                    const val = this.innerText.trim();
                    if (!val) return;
                    this.innerText = '';
                    this.classList.remove('filled');
                    const stepIdx = this.closest('.step-container').id.split('-')[1];
                    document.querySelectorAll(`#options-${stepIdx} button`).forEach(btn => {
                        if (btn.innerText === val && btn.disabled) btn.disabled = false;
                    });
                };
            });
        }

        function handleFill(stepIdx, val, btn) {
            const slots = document.querySelectorAll(`#step-${stepIdx} .slot`);
            for (let slot of slots) {
                if (!slot.innerText) {
                    slot.innerText = val;
                    slot.classList.add('filled');
                    btn.disabled = true;

                    // 高亮邏輯
                    const numRaw = val;
                    const numFloat = parseFloat(numRaw);
                    if (!isNaN(numFloat)) {
                        // 當輸入是數值且不包含小數點或不是選項的數值時，且包含"第X位"，才嘗試高亮對應位子的box
                        // 這裡可以簡單粗暴地：只對有 "第X位" 的步驟或類似的步驟做高亮，或是針對無條件進位後的整數作高亮
                        if (questions[currentQIdx].steps[stepIdx].label.includes("數值")) {
                            const prevStepIdx = stepIdx - 1;
                            const prevSlot = document.querySelector(`#step-${prevStepIdx} .slot[data-ans]`);
                            if (prevSlot) {
                                let prevVal = parseFloat(prevSlot.dataset.ans);
                                if (!isNaN(prevVal)) {
                                    let idxToHighlight = Math.ceil(prevVal);
                                    if (Number.isInteger(prevVal)) {
                                        idxToHighlight = prevVal; // 整數狀況下，其實在01版都是小數
                                    }
                                    const targetBox = document.getElementById(`num-box-${idxToHighlight}`);
                                    if (targetBox) {
                                        document.querySelectorAll('.num-box').forEach(b => b.classList.remove('highlight'));
                                        targetBox.classList.add('highlight');
                                    }
                                }
                            }
                        }
                    }
                    break;
                }
            }
        }

        function checkStep(stepIdx) {
            const slots = document.querySelectorAll(`#step-${stepIdx} .slot`);
            let ok = true;
            slots.forEach(s => { if (s.innerText !== s.dataset.ans) ok = false; });

            const feedback = document.getElementById(`feedback-${stepIdx}`);
            if (ok) {
                feedback.classList.add('hidden');
                document.getElementById(`check-icon-${stepIdx}`).classList.remove('hidden');
                document.getElementById(`action-area-${stepIdx}`).classList.add('hidden');
                document.getElementById(`step-${stepIdx}`).classList.replace('step-active', 'step-done');
                document.getElementById(`step-${stepIdx}`).classList.add('tada');

                if (stepIdx < questions[currentQIdx].steps.length - 1) {
                    const next = document.getElementById(`step-${stepIdx + 1}`);
                    next.classList.add('step-active');
                    setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
                } else {
                    if (!completedQuestions.has(currentQIdx)) {
                        completedQuestions.add(currentQIdx);
                        correctCount = completedQuestions.size;
                        updateScoreDisplay();
                        if (correctCount === questions.length) {
                            pauseTimer();
                            saveScore();
                        }
                    }
                    setTimeout(() => document.getElementById('finish-modal').classList.replace('hidden', 'flex'), 800);
                }
            } else {
                feedback.classList.remove('hidden');
                feedback.classList.add('animate__shakeX');
                setTimeout(() => feedback.classList.remove('animate__shakeX'), 500);
            }
        }

        function resetCurrentQuestion() { closeModal(); renderQuestion(); }
        function closeModal() { document.getElementById('finish-modal').classList.replace('flex', 'hidden'); }

        // 倒計時功能
        function toggleTimer() {
            if (timerRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            timerRunning = true;
            const btn = document.getElementById('timer-start-btn');
            btn.textContent = '暫停';
            btn.className = 'timer-btn timer-btn-pause';
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    btn.textContent = '開始';
                    btn.className = 'timer-btn timer-btn-start';
                    saveScore();
                    alert('時間到！已為您儲存目前的成績。');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            const btn = document.getElementById('timer-start-btn');
            btn.textContent = '繼續';
            btn.className = 'timer-btn timer-btn-start';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            remainingSeconds = TOTAL_SECONDS;
            updateTimerDisplay();
            const btn = document.getElementById('timer-start-btn');
            btn.textContent = '開始';
            btn.className = 'timer-btn timer-btn-start';
            completedQuestions.clear();
            correctCount = 0;
            updateScoreDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const display = document.getElementById('timer-display');
            display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            display.classList.remove('timer-warning', 'timer-danger');
            if (remainingSeconds <= 60) display.classList.add('timer-danger');
            else if (remainingSeconds <= 120) display.classList.add('timer-warning');
        }

        // 成績功能
        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = correctCount;
        }

        function saveScore() {
            const record = {
                date: new Date().toLocaleString('zh-TW'),
                score: correctCount,
                total: totalProblems,
                timeUsed: TOTAL_SECONDS - remainingSeconds
            };
            let history = JSON.parse(localStorage.getItem(SCORE_KEY) || '[]');
            history.push(record);
            if (history.length > 20) history = history.slice(-20);
            localStorage.setItem(SCORE_KEY, JSON.stringify(history));
        }

        function showScoreHistory() {
            const historyModal = document.getElementById('score-history-modal');
            const content = document.getElementById('score-history-content');
            let history = JSON.parse(localStorage.getItem(SCORE_KEY) || '[]');
            if (history.length === 0) {
                content.innerHTML = '<p class="text-gray-400 text-center py-6">目前還沒有成績紀錄</p>';
            } else {
                content.innerHTML = `<table class="w-full text-sm">
                    <thead><tr class="border-b-2 border-gray-200">
                        <th class="py-2 text-left">日期</th>
                        <th class="py-2 text-center">過關數</th>
                        <th class="py-2 text-right">用時</th>
                    </tr></thead>
                    <tbody>${history.slice().reverse().map(r => {
                    const mins = Math.floor(r.timeUsed / 60);
                    const secs = r.timeUsed % 60;
                    return `<tr class="border-b border-gray-100">
                            <td class="py-2">${r.date}</td>
                            <td class="py-2 text-center font-bold text-blue-600">${r.score}/${r.total}</td>
                            <td class="py-2 text-right">${mins}分${secs}秒</td>
                        </tr>`;
                }).join('')}</tbody>
                </table>`;
            }
            historyModal.classList.remove('hidden');
            historyModal.classList.add('flex');
        }

        function closeScoreHistory() {
            const historyModal = document.getElementById('score-history-modal');
            historyModal.classList.add('hidden');
            historyModal.classList.remove('flex');
        }

        function clearScoreHistory() {
            if (confirm('確定要清除所有歷史成績嗎？')) {
                localStorage.removeItem(SCORE_KEY);
                showScoreHistory();
            }
        }

        window.onload = () => { 
            initNav(); 
            renderQuestion(); 
            renderMathContent('formula-box'); 
            totalProblems = questions.length;
            document.getElementById('score-total').textContent = totalProblems;
            startTimer(); // 進去就直接開始計時
        };
    </script>
<script src="../progress.js"></script>
</body>

</html>
