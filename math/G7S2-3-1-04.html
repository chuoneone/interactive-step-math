<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 比例相等判斷</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }

        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .fraction span:first-child {
            border-bottom: 2px solid #000;
            padding: 0 4px;
        }

        .mixed {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 60px;
            height: 45px;
            border-bottom: 3px solid #cbd5e1;
            margin: 0 6px;
            font-weight: 700;
            color: #2563eb;
            cursor: pointer;
            transition: all 0.2s;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
        }

        .slot:hover {
            background-color: #e2e8f0;
        }

        .slot.filled {
            border-bottom-color: #10b981;
            background-color: #f0fdf4;
        }

        .btn-option {
            transition: all 0.2s;
            transform: scale(1);
        }

        .btn-option:active {
            transform: scale(0.95);
        }

        .btn-option:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #94a3b8 !important;
        }

        .step-container {
            border-left: 4px solid #e2e8f0;
            transition: all 0.5s;
        }

        .step-active {
            border-left-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .step-completed {
            border-left-color: #10b981;
            opacity: 0.9;
        }

        .sticky-sidebar {
            height: fit-content;
        }

        @keyframes tada {
            0% {
                transform: scale3d(1, 1, 1);
            }

            10%,
            20% {
                transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
            }

            40%,
            60%,
            80% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
            }

            100% {
                transform: scale3d(1, 1, 1);
            }
        }

        .animate-tada {
            animation: tada 1s;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-50">

    <!-- 導覽列 -->
    <nav
        class="sticky top-0 z-50 bg-white shadow-md px-4 py-2 flex items-center justify-between overflow-x-auto hide-scroll">
        <div class="flex items-center space-x-4 min-w-max">
            <span class="text-xl font-bold text-blue-700 border-r pr-4">單元：比例相等性</span>
            <div id="nav-tabs" class="flex space-x-2">
                <!-- 題目按鈕會動態插入 -->
            </div>
        </div>
        <div class="flex items-center space-x-6 ml-4 min-w-max">
            <div class="text-lg font-semibold text-orange-600">
                得分：<span id="global-score">0</span>
            </div>
            <div class="text-lg font-mono font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full">
                ⏱️ <span id="timer">07:00</span>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

            <!-- 左側：題目固定區塊 -->
            <aside class="md:col-span-1">
                <div class="sticky top-20 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-2xl font-bold mb-4 text-slate-800 flex items-center">
                        <span
                            class="bg-blue-600 text-white w-8 h-8 rounded-full inline-flex items-center justify-center mr-2 text-sm">問</span>
                        題目內容
                    </h2>
                    <div id="question-text" class="text-xl leading-relaxed text-slate-700">
                        <!-- 題目文字動態插入 -->
                    </div>
                    <div id="question-options" class="mt-6 grid grid-cols-1 gap-2">
                        <!-- 選項預覽動態插入 -->
                    </div>
                </div>
            </aside>

            <!-- 右側：解題步驟區塊 -->
            <main class="md:col-span-2 space-y-6 pb-20" id="steps-container">
                <!-- 步驟動態插入 -->
            </main>

        </div>
    </div>

    <!-- 完成視窗 -->
    <div id="modal-finish" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl animate__animated animate__zoomIn">
            <div class="text-6xl mb-4">🎉</div>
            <h3 class="text-3xl font-bold text-slate-800 mb-2">太棒了！</h3>
            <p class="text-slate-600 mb-6">你已經完成了本題所有步驟。</p>
            <div class="flex flex-col space-y-3">
                <button onclick="resetCurrentQuestion()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">再做一次</button>
                <button onclick="closeModal()"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 吐司提示 -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl opacity-0 transition-opacity pointer-events-none z-[110]">
        請填滿所有空格
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "題目 1",
                baseRatio: [3, 2],
                questionHtml: `下列的比中，哪些與 <mark class="bg-yellow-200 px-1">3：2</mark> 相等？`,
                options: [
                    { id: "1", val: "9：6" },
                    { id: "2", val: "6：5" },
                    { id: "3", val: "2：3" },
                    { id: "4", val: "15：10" }
                ],
                steps: [
                    {
                        type: "simplify",
                        targetIdx: 0, // Option (1)
                        instruction: "將 (1) 9：6 同時除以 3 化簡：",
                        slots: [3, 2], // Answers
                        buttons: ["3", "2", "6", "9"],
                        feedback: "正確！9：6 = 3：2，所以相等。"
                    },
                    {
                        type: "simplify",
                        targetIdx: 3, // Option (4)
                        instruction: "將 (4) 15：10 同時除以 5 化簡：",
                        slots: [3, 2],
                        buttons: ["3", "2", "5", "15"],
                        feedback: "正確！15：10 = 3：2，所以相等。"
                    },
                    {
                        type: "final",
                        instruction: "選出與 3：2 相等的選項編號：",
                        slots: ["(1)", "(4)"],
                        buttons: ["(1)", "(2)", "(3)", "(4)"],
                        feedback: "恭喜！你找出了所有相等的比。"
                    }
                ]
            },
            {
                id: 2,
                title: "題目 2",
                baseRatio: [5, 6],
                questionHtml: `下列的比中，哪些與 <mark class="bg-yellow-200 px-1">5：6</mark> 相等？`,
                options: [
                    { id: "1", val: "6：5" },
                    { id: "2", val: "(-5)：(-6)" },
                    { id: "3", val: "10：12" },
                    { id: "4", val: "12：10" }
                ],
                steps: [
                    {
                        type: "simplify",
                        targetIdx: 1, // Option (2)
                        instruction: "將 (2) (-5)：(-6) 同時除以 -1：",
                        slots: [5, 6],
                        buttons: ["5", "6", "-5", "-6"],
                        feedback: "正確！負負得正，結果相等。"
                    },
                    {
                        type: "simplify",
                        targetIdx: 2, // Option (3)
                        instruction: "將 (3) 10：12 同時除以 2 化簡：",
                        slots: [5, 6],
                        buttons: ["5", "6", "10", "12"],
                        feedback: "正確！10：12 = 5：6，所以相等。"
                    },
                    {
                        type: "final",
                        instruction: "選出與 5：6 相等的選項編號：",
                        slots: ["(2)", "(3)"],
                        buttons: ["(1)", "(2)", "(3)", "(4)"],
                        feedback: "沒錯！這兩個比都與 5：6 相等。"
                    }
                ]
            }
        ];

        let currentQuestionIdx = 0;
        let score = 0;
        let timerSeconds = 420;
        let timerInterval;

        // 初始化
        window.onload = () => {
            initTabs();
            loadQuestion(0);
            startTimer();
        };

        function initTabs() {
            const container = document.getElementById('nav-tabs');
            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-${idx}`;
                btn.className = `px-4 py-2 rounded-lg font-bold transition ${idx === 0 ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`;
                btn.innerText = q.title;
                btn.onclick = () => switchQuestion(idx);
                container.appendChild(btn);
            });
        }

        function switchQuestion(idx) {
            if (currentQuestionIdx === idx) return;
            currentQuestionIdx = idx;

            // 更新 Tab 樣式
            questions.forEach((_, i) => {
                const btn = document.getElementById(`tab-${i}`);
                if (i === idx) {
                    btn.className = 'px-4 py-2 rounded-lg font-bold transition bg-blue-600 text-white';
                } else {
                    btn.className = 'px-4 py-2 rounded-lg font-bold transition bg-slate-200 text-slate-600 hover:bg-slate-300';
                }
            });

            loadQuestion(idx);
        }

        function loadQuestion(idx) {
            const q = questions[idx];
            document.getElementById('question-text').innerHTML = q.questionHtml;

            const optionsDiv = document.getElementById('question-options');
            optionsDiv.innerHTML = q.options.map(opt => `
                <div class="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="bg-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-blue-600 shadow-sm mr-3">(${opt.id})</span>
                    <span class="text-xl font-semibold">${opt.val}</span>
                </div>
            `).join('');

            renderSteps(q.steps);
        }

        function renderSteps(steps) {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            steps.forEach((step, sIdx) => {
                const stepEl = document.createElement('div');
                stepEl.id = `step-${sIdx}`;
                stepEl.className = `step-container p-6 rounded-2xl transition-all duration-500 ${sIdx === 0 ? 'step-active' : 'opacity-40 pointer-events-none'}`;

                let stepContent = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-slate-500 flex items-center">
                            步驟 ${sIdx + 1} <span class="status-icon ml-2"></span>
                        </h3>
                    </div>
                    <div class="text-xl mb-6">
                        ${step.instruction}
                        <div class="mt-4 flex items-center flex-wrap gap-2">
                `;

                // 產生 Slot
                step.slots.forEach((_, slotIdx) => {
                    stepContent += `<div class="slot" onclick="clearSlot(${sIdx}, ${slotIdx})"></div>`;
                    if (step.type === 'simplify' && slotIdx === 0) {
                        stepContent += `<span class="text-2xl font-bold mx-1">：</span>`;
                    }
                });

                stepContent += `
                        </div>
                    </div>
                    <div class="options-area flex flex-wrap gap-3 mb-6">
                `;

                // 產生選項按鈕
                step.buttons.forEach(btnLabel => {
                    stepContent += `
                        <button onclick="fillSlot(${sIdx}, '${btnLabel}', this)" class="btn-option bg-white border-2 border-slate-200 hover:border-blue-400 hover:text-blue-600 px-6 py-2 rounded-xl text-lg font-bold shadow-sm">
                            ${btnLabel}
                        </button>
                    `;
                });

                stepContent += `
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="feedback-text text-green-600 font-bold opacity-0 transition-opacity">正確！</div>
                        <button onclick="checkStep(${sIdx})" class="check-btn bg-slate-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-700 transition shadow-lg">檢查答案</button>
                    </div>
                `;

                stepEl.innerHTML = stepContent;
                container.appendChild(stepEl);
            });
        }

        function fillSlot(stepIdx, value, btn) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');

            for (let slot of slots) {
                if (!slot.innerText) {
                    slot.innerText = value;
                    slot.classList.add('filled', 'animate__animated', 'animate__headShake');
                    btn.disabled = true;
                    break;
                }
            }
        }

        function clearSlot(stepIdx, slotIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            const slot = slots[slotIdx];

            if (slot.innerText) {
                const val = slot.innerText;
                slot.innerText = '';
                slot.classList.remove('filled', 'animate__animated', 'animate__headShake');

                // 恢復對應按鈕
                const buttons = stepEl.querySelectorAll('.btn-option');
                for (let btn of buttons) {
                    if (btn.innerText.trim() === val && btn.disabled) {
                        btn.disabled = false;
                        break;
                    }
                }
            }
        }

        function checkStep(stepIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            const stepData = questions[currentQuestionIdx].steps[stepIdx];

            // 檢查是否填滿
            const currentValues = Array.from(slots).map(s => s.innerText.trim());
            if (currentValues.some(v => v === '')) {
                showToast("請填滿所有空格");
                return;
            }

            // 驗證答案
            const isCorrect = currentValues.every((v, i) => v == stepData.slots[i]);

            if (isCorrect) {
                handleStepSuccess(stepIdx, stepEl, stepData);
            } else {
                handleStepFailure(stepEl);
            }
        }

        function handleStepSuccess(stepIdx, stepEl, stepData) {
            score += 1;
            document.getElementById('global-score').innerText = score;

            // 視覺回饋
            stepEl.classList.add('step-completed', 'animate-tada');
            stepEl.querySelector('.status-icon').innerHTML = `
                <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
                <span class="text-green-600 text-sm ml-1">完成</span>
            `;
            stepEl.querySelector('.feedback-text').innerText = stepData.feedback;
            stepEl.querySelector('.feedback-text').classList.remove('opacity-0');
            stepEl.querySelector('.check-btn').style.display = 'none';
            stepEl.querySelector('.options-area').style.display = 'none';

            // 解鎖下一步
            const nextIdx = stepIdx + 1;
            const nextStepEl = document.getElementById(`step-${nextIdx}`);

            if (nextStepEl) {
                setTimeout(() => {
                    nextStepEl.classList.remove('opacity-40', 'pointer-events-none');
                    nextStepEl.classList.add('step-active');
                    nextStepEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 800);
            } else {
                // 全部完成
                setTimeout(() => {
                    document.getElementById('modal-finish').classList.remove('hidden');
                }, 1000);
            }
        }

        function handleStepFailure(stepEl) {
            showToast("再想想看喔，檢查一下數字！");
            stepEl.classList.add('animate__animated', 'animate__shakeX');
            setTimeout(() => stepEl.classList.remove('animate__animated', 'animate__shakeX'), 500);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerSeconds = 0;
                }
                const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const s = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetCurrentQuestion() {
            closeModal();
            loadQuestion(currentQuestionIdx);
        }

        function closeModal() {
            document.getElementById('modal-finish').classList.add('hidden');
        }
    </script>
</body>

</html>
