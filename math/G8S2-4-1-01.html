    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 數學式美觀 CSS */
        .math-line {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            line-height: 1.8;
            margin: 14px 0;
        }

        .math,
        .math-display {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }

        .math-display {
            justify-content: center;
            width: 100%;
            overflow-x: auto;
            padding: 8px 0;
        }

        .katex {
            font-size: 1.15em;
        }

        /* 填答格 Slot 樣式 */
        .slot {
            min-width: 64px;
            min-height: 48px;
            padding: 4px 14px;
            border: 3px solid #93c5fd;
            border-radius: 12px;
            background: #eff6ff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1d4ed8;
            cursor: pointer;
            font-size: 24px;
            font-weight: 900;
            transition: all 0.2s ease;
        }

        .slot.active {
            animation: pulseSlot 1.2s infinite;
            background: #dbeafe;
            border-color: #2563eb;
        }

        .slot.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
            cursor: default;
        }

        @keyframes pulseSlot {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(37, 99, 235, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }

        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 確保 SVG 圓圈徽章能以中心點進行平滑縮放動畫 */
        g circle {
            transform-box: fill-box;
            transform-origin: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        g text {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* SVG 亮點發光效果：優化數字與背景對比度 */
        .highlight-glow circle {
            stroke: #f59e0b !important;
            stroke-width: 3.5px !important;
            fill: #fef3c7 !important;
            /* 溫暖的亮黃色底，提供高對比 */
        }

        .highlight-glow text {
            fill: #b45309 !important;
            /* 強制切換為深琥珀色，確保極佳的數字清晰度 */
            font-weight: 900 !important;
        }

        /* 呼吸發光效果：只動態縮放背景圓圈並閃爍陰影，文字不閃爍，保持 100% 辨識度 */
        .highlight-angle {
            animation: glowPulse 1.6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(0px 0px 4px rgba(245, 158, 11, 0.5));
                transform: scale(1);
            }

            100% {
                filter: drop-shadow(0px 0px 14px rgba(245, 158, 11, 1));
                transform: scale(1.15);
            }
        }

        const audioSynth = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playSuccess() {
                this.init();
                const now = this.ctx.currentTime;
                const gain = this.ctx.createGain();
                gain.connect(this.ctx.destination);

                // C5 -> E5 -> G5 琶音
                const freqs = [523.25, 659.25, 783.99];
                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    osc.type = 'sine';
                    osc.connect(gain);
                    osc.frequency.setValueAtTime(f, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            },
            playError() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }

        // 啟動計時器

            if (appState.timerInterval) clearInterval(appState.timerInterval);
            appState.timerInterval = setInterval(() => {
                if (appState.timeRemaining > 0) {
                    appState.timeRemaining--;
                    updateTimerDisplay();
                } else {
                    clearInterval(appState.timerInterval);
                    // 時間到，強制結束
                    showTimeout();
                }
            }, 1000);
        }

        // 更新計時顯示
        function updateTimerDisplay() {
            const mins = Math.floor(appState.timeRemaining / 60);
            const secs = appState.timeRemaining % 60;
            const displayStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = displayStr;

            // 倒數警告音效/視覺 (最後一分鐘)
            if (appState.timeRemaining <= 60) {
                document.getElementById('timer-display').parentElement.classList.add('animate-pulse', 'bg-red-100', 'text-red-700');
            } else {
                document.getElementById('timer-display').parentElement.classList.remove('animate-pulse', 'bg-red-100', 'text-red-700');
            }
        }

            const container = document.getElementById('nav-btn-container');

            appState.questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';

                // 判斷是否完成該題所有步驟

                let btnClass = "px-4 py-1.5 rounded-xl font-bold whitespace-nowrap text-sm border transition-all active:scale-95 flex items-center gap-1 ";

                    btnClass += "bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-100";
                } else if (isCompleted) {
                    btnClass += "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100";

                btn.innerHTML = `

            // 更新主畫面
            const q = appState.questions[idx];
            document.getElementById('question-title').innerText = q.title;
            document.getElementById('question-prompt').innerHTML = q.prompt;

            // 切換 SVG
            appState.questions.forEach(item => {
                document.getElementById(item.svgId).classList.add('hidden');
            });
            document.getElementById(q.svgId).classList.remove('hidden');

            // 重設當前步驟的主動 slot 索引
            const activeStep = q.steps[q.activeStepIdx];
            if (activeStep) {
                const firstEmpty = activeStep.slots.indexOf(null);
                appState.currentStepActiveSlotIdx = firstEmpty !== -1 ? firstEmpty : 0;

            renderSteps();
            renderNavigation();
            updateSVGHighlight();

        // 亂序重排演算法
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

                const isLocked = stepIdx > q.activeStepIdx;

                const isCompleted = step.answeredCorrectly;

                const stepCard = document.createElement('div');

                let cardClass = "p-5 rounded-3xl border transition-all duration-300 ";

                if (isLocked) {
                    container.appendChild(stepCard);
                    return;

                // 題目步驟指令
                const instructionEl = document.createElement('p');
                instructionEl.className = "text-base text-slate-500 mb-3 font-medium leading-relaxed";
                instructionEl.innerHTML = step.instruction;
                stepCard.appendChild(instructionEl);

                        mathPre.dataset.latex = step.latexPre;
                        mathLine.appendChild(mathPre);

                    // 填答格
                    const slot = document.createElement('span');
                    const isSlotActive = isActive && appState.currentStepActiveSlotIdx === 0;
                    slot.className = `slot ${isCompleted ? 'correct' : ''} ${isSlotActive ? 'active' : ''}`;

                    if (!step.shuffledOptions) {
                        step.shuffledOptions = shuffleArray(step.options);

                    step.shuffledOptions.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = "bg-white hover:bg-indigo-50 active:bg-indigo-100 border-2 border-slate-200 hover:border-indigo-400 text-slate-700 font-extrabold py-2.5 px-3 rounded-xl transition-all active:scale-95 text-lg shadow-sm";

                    // 錯誤提示與檢查按鈕
                    const actionRow = document.createElement('div');
                    actionRow.className = "mt-5 flex items-center justify-between gap-4 border-t border-slate-100 pt-4";

                    // 錯誤文字
                    const feedbackText = document.createElement('span');
                    feedbackText.className = "text-red-500 font-bold text-sm min-h-[20px]";
                    feedbackText.innerText = step.hasError ? "⚠️ 答案不太對喔，再觀察圖形看看！" : "";
                    actionRow.appendChild(feedbackText);

                    const checkBtn = document.createElement('button');
                    checkBtn.type = 'button';

                    // 檢查是否有未填答空格
                    const hasEmpty = step.slots.some(s => s === null);
                    checkBtn.className = `font-black py-2.5 px-6 rounded-xl text-sm shadow-md transition-all active:scale-95 ${hasEmpty ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-100'}`;
                    checkBtn.innerText = "檢查答案";
                    checkBtn.disabled = hasEmpty;
                    checkBtn.onclick = () => checkStepAnswer(stepIdx);

                    actionRow.appendChild(checkBtn);
                    stepCard.appendChild(actionRow);
                }

                container.appendChild(stepCard);
            });

            // 動態更新 KaTeX 公式
            renderMath();
        }

        // 當前步驟之 Slot 點擊事件：清空
        function handleSlotClick(stepIdx, slotIdx) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            if (step.answeredCorrectly) return;

            // 清空該格
            step.slots[slotIdx] = null;
            appState.currentStepActiveSlotIdx = slotIdx;

            // 重繪右側步驟
            renderSteps();
        }

        // 選項按鈕點擊：填入主動填答格
        function fillSlot(stepIdx, val) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            // 填入當前高亮的 slot
            step.slots[appState.currentStepActiveSlotIdx] = val;

            // 自動尋找下一個空格
            const nextEmpty = step.slots.indexOf(null);
            if (nextEmpty !== -1) {
                appState.currentStepActiveSlotIdx = nextEmpty;
            } else {
                // 沒有空格了，維持在原本格
            }

            renderSteps();
        }

        // 檢查步驟答案
        function checkStepAnswer(stepIdx) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            // 檢查是否全滿
            if (step.slots.some(s => s === null)) {
                showToast("⚠️ 請填滿所有空格再檢查喔！");
                return;
            }

            // 判斷是否正確
            let isCorrect = true;
            for (let i = 0; i < step.slots.length; i++) {
                if (step.slots[i] !== step.correct[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                // 播放成功音效與通知
                audioSynth.playSuccess();
                step.answeredCorrectly = true;

                // 計分規則：若該步驟從未答錯過，則得10分（同一步驟不重複計分）
                if (!step.hasError) {
                    appState.score += 10;
                    updateScoreDisplay();
                }

                // 解鎖下一步
                if (stepIdx === q.activeStepIdx && q.activeStepIdx < q.steps.length - 1) {
                    // 延遲解鎖下一步，給予滑動與視覺停留效果
                    setTimeout(() => {
                        q.activeStepIdx++;
                        appState.currentStepActiveSlotIdx = 0;
                        renderSteps();
                        updateSVGHighlight();
                        scrollToActiveStep();
                    }, 400);
                } else if (stepIdx === q.steps.length - 1) {
                    // 此題全部步驟完成
                    showToast("🎉 恭喜你完成本題所有步驟！");
                    renderNavigation();

                    // 檢查是否所有題目都完成了
                    const allCompleted = appState.questions.every(item => item.steps.every(s => s.answeredCorrectly));
                    if (allCompleted) {
                        clearInterval(appState.timerInterval);
                        setTimeout(showFinishModal, 800);
                    }
                }

                renderSteps();
            } else {
                // 錯誤反饋
                audioSynth.playError();
                step.hasError = true;
                renderSteps();
                showToast("⚠️ 答案不太對喔，再想想看！");
            }
        }

        // 自動捲動到當前活動步驟
        function scrollToActiveStep() {
            const activeCard = document.getElementById(`step-card-${appState.questions[appState.activeQuestionIdx].activeStepIdx}`);
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 更新 SVG 中與當前步驟相關的角的高亮效果
        function updateSVGHighlight() {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[q.activeStepIdx];

            // 先清空該題所有角與背景徽章的高亮狀態
            const allAngleGroups = document.querySelectorAll(`[id^="grp-"]`);
            allAngleGroups.forEach(g => {
                g.classList.remove('highlight-glow');
                const txt = g.querySelector('text');
                if (txt) txt.classList.remove('highlight-angle');
                const circ = g.querySelector('circle');
                if (circ) circ.classList.remove('highlight-angle');
            });

            if (!step || step.answeredCorrectly) return;

            // 根據步驟關聯的角，添加發光與呼吸動畫（只加在 circle 上，文字維持不透明靜止）
            if (step.highlightAngles) {
                step.highlightAngles.forEach(num => {
                    const grp = document.getElementById(`grp-q${q.id}-a${num}`);
                    if (grp) {
                        grp.classList.add('highlight-glow');
                        const circ = grp.querySelector('circle');
                        if (circ) circ.classList.add('highlight-angle');
                    }
                });
            }
        }

        // 更新分數顯示
        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = appState.score;
        }

        // Toast 顯示通知
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 展示挑戰成功 Modal
        function showFinishModal(isTimeout = false) {
            document.getElementById('finish-score').innerText = appState.score;

            // 計算作答使用時間
            const usedSeconds = 420 - appState.timeRemaining;
            const mins = Math.floor(usedSeconds / 60);
            const secs = usedSeconds % 60;
            document.getElementById('finish-time').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const modalTitle = document.getElementById('modal-title');
            const modalSubtitle = document.getElementById('modal-subtitle');
            if (isTimeout) {
                modalTitle.innerText = "⏰ 時間到囉！";
                modalSubtitle.innerText = "沒關係，再接再厲！再挑戰一次看看吧！";
            } else {
                modalTitle.innerText = "🎉 挑戰成功！";
                modalSubtitle.innerText = "太棒了！你已經完成了本單元的所有截角挑戰！";
            }

            const modal = document.getElementById('finish-modal');
            modal.classList.remove('hidden');
        }

        // 時間到 Modal
        function showTimeout() {
            audioSynth.playError();
            showToast("⏰ 時間到囉！讓我們重新挑戰一次吧！");
            setTimeout(() => showFinishModal(true), 1500);
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('finish-modal').classList.add('hidden');
        }

        // 重新作答（保留進度清除）
        function restartAll() {
            closeModal();

            // 重設核心狀態
            appState.score = 0;
            appState.timeRemaining = 420;
            appState.activeQuestionIdx = 0;

            appState.questions.forEach(q => {
                q.activeStepIdx = 0;
                q.steps.forEach(step => {
                    step.slots = step.slots.map(() => null);
                    step.answeredCorrectly = false;
                    step.hasError = false;
                    delete step.shuffledOptions;
                });
            });

            appState.currentStepActiveSlotIdx = 0;

            updateScoreDisplay();
            updateTimerDisplay();
            startTimer();
            switchQuestion(0);
        }

        // 初始化自動渲染 KaTeX
        function renderMath() {
            document.querySelectorAll('.math').forEach(el => {
                if (!el.dataset.rendered) {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: false
                    });
                    el.dataset.rendered = "true";
                }
            });
            document.querySelectorAll('.math-display').forEach(el => {
                if (!el.dataset.rendered) {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: true
                    });
                    el.dataset.rendered = "true";
                }
            });
        }

        // 網頁加載初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderMath();
            switchQuestion(0);
            startTimer();
        });
    </script>
</body>

</html>
