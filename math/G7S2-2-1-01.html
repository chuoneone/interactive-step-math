<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動座標學習教室</title>
    <link rel="icon" href="dog.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --axis-color: #374151;
            --grid-color: #e5e7eb;
            --point-color: #ef4444;
        }

        body {
            touch-action: manipulation;
        }

        .coordinate-grid {
            cursor: crosshair;
            user-select: none;
        }

        .quadrant-label {
            pointer-events: none;
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0.3;
        }

        /* 打勾動畫 */
        @keyframes success-pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        .check-anim {
            animation: success-pop 1s ease-out forwards;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-slate-800">互動式座標學習教室</h1>
            <p class="text-slate-600 mt-2">點擊網格或移動紅點，探索座標的奧秘</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左側：座標平面 -->
            <div class="lg:col-span-2 bg-white p-4 rounded-2xl shadow-xl flex flex-col items-center relative">
                <div id="container"
                    class="relative bg-white border-2 border-slate-200 rounded-lg overflow-hidden w-full aspect-square max-w-[500px]">
                    <!-- 象限標籤 -->
                    <div class="absolute top-4 right-4 quadrant-label text-blue-600">第一象限 (+, +)</div>
                    <div class="absolute top-4 left-4 quadrant-label text-green-600">第二象限 (-, +)</div>
                    <div class="absolute bottom-4 left-4 quadrant-label text-yellow-600">第三象限 (-, -)</div>
                    <div class="absolute bottom-4 right-4 quadrant-label text-purple-600">第四象限 (+, -)</div>

                    <!-- 答對動畫層 -->
                    <div id="successOverlay"
                        class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 hidden">
                        <div class="bg-green-500 rounded-full p-6 shadow-2xl">
                            <svg class="w-24 h-24 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4"
                                    d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>

                    <canvas id="gridCanvas" class="coordinate-grid w-full h-full"></canvas>
                </div>

                <div class="mt-4 flex gap-4">
                    <button id="resetBtn"
                        class="px-6 py-2 bg-slate-200 hover:bg-slate-300 rounded-full font-medium transition">回到原點</button>
                    <button id="challengeBtn"
                        class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-medium transition">進入挑戰模式</button>
                </div>
            </div>

            <!-- 右側：資訊面板 -->
            <div class="flex flex-col gap-4">
                <!-- 目前座標與計分 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-red-500">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-lg font-bold text-slate-700">目前位置</h2>
                        <div class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500" id="highScoreDisplay">最高紀錄: 0
                        </div>
                    </div>
                    <div class="text-5xl font-mono font-black text-red-500 flex justify-center py-4" id="coordDisplay">
                        (0, 0)
                    </div>
                    <div id="locationInfo" class="text-center text-lg font-medium text-slate-600 mt-2 italic">
                        原點
                    </div>
                </div>

                <!-- 挑戰區域 -->
                <div id="challengeArea"
                    class="hidden bg-yellow-50 p-6 rounded-2xl border-2 border-yellow-400 relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-lg font-bold text-yellow-800">任務挑戰！</h2>
                        <div class="bg-yellow-200 text-yellow-900 px-3 py-1 rounded-full font-bold">
                            得分: <span id="currentScore">0</span>
                        </div>
                    </div>
                    <!-- 修改處：微調字體大小與內距，確保不換行且不被切掉 -->
                    <div class="w-full flex justify-center items-center px-1">
                        <p id="challengeText"
                            class="text-lg sm:text-xl lg:text-lg xl:text-xl font-bold text-slate-700 text-center py-2 whitespace-nowrap">
                            請將紅點移到 (3, -2)</p>
                    </div>
                    <p id="challengeFeedback" class="mt-2 text-center font-medium text-green-600 h-6"></p>
                    <button id="resetScoreBtn"
                        class="mt-4 text-xs text-yellow-700 underline block mx-auto">重設分數</button>
                </div>

                <!-- 學習重點摘要 -->
                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                    <h2 class="text-lg font-bold text-blue-800 mb-3">座標小知識</h2>
                    <ul class="space-y-2 text-sm text-blue-900">
                        <li class="flex items-start"><span class="mr-2">📍</span><strong>X 軸：</strong> 左右移動 (左負、右正)</li>
                        <li class="flex items-start"><span class="mr-2">📍</span><strong>Y 軸：</strong> 上下移動 (下負、上正)</li>
                        <li class="flex items-start"><span class="mr-2">📍</span><strong>順序：</strong> 先看 X 再看 Y</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="messageBox"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full opacity-0 transition-opacity pointer-events-none shadow-2xl z-50">
        提示內容
    </div>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const coordDisplay = document.getElementById('coordDisplay');
        const locationInfo = document.getElementById('locationInfo');
        const resetBtn = document.getElementById('resetBtn');
        const challengeBtn = document.getElementById('challengeBtn');
        const challengeArea = document.getElementById('challengeArea');
        const challengeText = document.getElementById('challengeText');
        const challengeFeedback = document.getElementById('challengeFeedback');
        const successOverlay = document.getElementById('successOverlay');
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const resetScoreBtn = document.getElementById('resetScoreBtn');
        const msgBox = document.getElementById('messageBox');

        // 參數與狀態
        const gridSize = 10;
        let canvasSize;
        let step;
        let currentPos = { x: 0, y: 0 };
        let isChallenging = false;
        let targetPos = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('coord_high_score')) || 0;

        function showMessage(text) {
            msgBox.innerText = text;
            msgBox.style.opacity = '1';
            setTimeout(() => { msgBox.style.opacity = '0'; }, 2000);
        }

        function initCanvas() {
            canvasSize = canvas.clientWidth;
            canvas.width = canvasSize * window.devicePixelRatio;
            canvas.height = canvasSize * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            step = canvasSize / (gridSize * 2);
            highScoreDisplay.innerText = `最高紀錄: ${highScore}`;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);
            const center = canvasSize / 2;

            // 1. 網格
            ctx.beginPath();
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSize * 2; i++) {
                ctx.moveTo(i * step, 0);
                ctx.lineTo(i * step, canvasSize);
                ctx.moveTo(0, i * step);
                ctx.lineTo(canvasSize, i * step);
            }
            ctx.stroke();

            // 2. 軸線
            ctx.beginPath();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.moveTo(0, center); ctx.lineTo(canvasSize, center);
            ctx.moveTo(center, 0); ctx.lineTo(center, canvasSize);
            ctx.stroke();

            // 3. 數字
            ctx.font = '10px Arial';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            for (let i = -gridSize; i <= gridSize; i++) {
                if (i === 0) continue;
                ctx.fillText(i, center + i * step, center + 15);
                ctx.fillText(-i, center - 15, center + i * step + 4);
            }

            // 4. 紅點
            const drawX = center + currentPos.x * step;
            const drawY = center - currentPos.y * step;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(239, 68, 68, 0.5)';
            ctx.beginPath();
            ctx.arc(drawX, drawY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function triggerSuccessEffect() {
            successOverlay.classList.remove('hidden');
            successOverlay.classList.add('check-anim');

            score++;
            currentScoreEl.innerText = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('coord_high_score', highScore);
                highScoreDisplay.innerText = `最高紀錄: ${highScore}`;
            }

            setTimeout(() => {
                successOverlay.classList.add('hidden');
                successOverlay.classList.remove('check-anim');
                newChallenge();
            }, 1000);
        }

        function updateInfo(x, y) {
            coordDisplay.innerText = `(${x}, ${y})`;

            let info = "";
            if (x === 0 && y === 0) info = "原點";
            else if (x === 0) info = "位於 Y 軸上";
            else if (y === 0) info = "位於 X 軸上";
            else if (x > 0 && y > 0) info = "第一象限";
            else if (x < 0 && y > 0) info = "第二象限";
            else if (x < 0 && y < 0) info = "第三象限";
            else if (x > 0 && y < 0) info = "第四象限";

            locationInfo.innerText = info;

            if (isChallenging) {
                if (x === targetPos.x && y === targetPos.y) {
                    challengeFeedback.innerText = "太棒了！答對了！";
                    triggerSuccessEffect();
                } else {
                    challengeFeedback.innerText = "";
                }
            }
        }

        function handleInteraction(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            const center = canvasSize / 2;
            const gridX = Math.round((mouseX - center) / step);
            const gridY = Math.round((center - mouseY) / step);

            if (gridX >= -gridSize && gridX <= gridSize && gridY >= -gridSize && gridY <= gridSize) {
                currentPos.x = gridX;
                currentPos.y = gridY;
                draw();
                updateInfo(gridX, gridY);
            }
        }

        function newChallenge() {
            // 隨機產生 -7 到 7 之間的整數
            targetPos.x = Math.floor(Math.random() * 15) - 7;
            targetPos.y = Math.floor(Math.random() * 15) - 7;
            if (targetPos.x === 0 && targetPos.y === 0) targetPos.x = 3;

            challengeText.innerText = `請將紅點移到 (${targetPos.x}, ${targetPos.y})`;
            challengeFeedback.innerText = "";
        }

        // 事件監聽
        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);

        canvas.addEventListener('mousedown', (e) => {
            handleInteraction(e);
            canvas.addEventListener('mousemove', handleInteraction);
        });
        window.addEventListener('mouseup', () => canvas.removeEventListener('mousemove', handleInteraction));

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInteraction(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInteraction(e);
        }, { passive: false });

        resetBtn.addEventListener('click', () => {
            currentPos = { x: 0, y: 0 };
            draw();
            updateInfo(0, 0);
            showMessage("已回到原點 (0, 0)");
        });

        challengeBtn.addEventListener('click', () => {
            isChallenging = !isChallenging;
            if (isChallenging) {
                score = 0;
                currentScoreEl.innerText = "0";
                challengeArea.classList.remove('hidden');
                challengeBtn.innerText = "退出挑戰";
                challengeBtn.classList.replace('bg-blue-500', 'bg-slate-500');
                newChallenge();
            } else {
                challengeArea.classList.add('hidden');
                challengeBtn.innerText = "進入挑戰模式";
                challengeBtn.classList.replace('bg-slate-500', 'bg-blue-500');
            }
        });

        resetScoreBtn.addEventListener('click', () => {
            highScore = 0;
            localStorage.setItem('coord_high_score', 0);
            highScoreDisplay.innerText = "最高紀錄: 0";
            showMessage("最高紀錄已重設");
        });

    </script>
</body>

</html>
