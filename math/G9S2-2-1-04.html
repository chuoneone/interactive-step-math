<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全距四分位距</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto+Sans+TC', sans-serif;
            background-color: #f1f5f9;
        }

        .math {
            font-size: 24px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 50px;
            height: 45px;
            border-bottom: 3px solid #cbd5e1;
            margin: 0 4px;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: bold;
            color: #1e40af;
            background-color: #f8fafc;
            border-radius: 4px 4px 0 0;
            padding: 0 8px;
        }

        .slot.filled {
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            color: #15803d;
            background-color: #f0fdf4;
        }

        .step-card {
            opacity: 0.4;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.4s ease-out;
        }

        .step-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .step-card.completed {
            opacity: 1;
            border-left: 6px solid #22c55e;
        }

        .data-box {
            display: inline-block;
            border: 2px solid #3b82f6;
            padding: 0 4px;
            border-radius: 6px;
            background-color: #eff6ff;
            font-weight: bold;
            color: #1e40af;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1);
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-2deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.05) rotate(2deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.05) rotate(-2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        @keyframes score-pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
                color: #f59e0b;
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-tada {
            animation: tada 0.6s ease-in-out;
        }

        .animate-score {
            animation: score-pop 0.5s ease-out;
        }

        .nav-active {
            background-color: #3b82f6 !important;
            color: white !important;
            border-color: #2563eb !important;
        }

        .custom-scroll::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部固定區域 -->
    <header id="fixed-header" class="bg-white sticky top-0 z-30 border-b">
        <!-- 導覽與計分列 -->
        <div class="border-b bg-slate-50">
            <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
                <div id="nav-container" class="flex gap-2 overflow-x-auto custom-scroll py-1 flex-grow">
                    <!-- JS 生成按鈕 -->
                </div>
                <!-- 計分板 -->
                <div
                    class="flex items-center gap-2 bg-amber-100 px-4 py-1 rounded-full border border-amber-200 shadow-sm ml-2">
                    <span class="text-amber-600 font-bold text-xs uppercase tracking-wider">Score</span>
                    <span id="score-val" class="text-xl font-black text-amber-700 min-w-[40px] text-center">0</span>
                </div>
            </div>
        </div>

        <!-- 題目資料固定列 -->
        <div class="bg-white px-4 py-4">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center gap-2 mb-2">
                    <span id="problem-label"
                        class="text-xs font-bold text-white bg-slate-500 px-2 py-0.5 rounded shadow-sm">題目 1</span>
                    <span class="text-slate-500 text-sm font-medium">觀察下方資料進行計算：</span>
                </div>
                <div id="problem-data-display"
                    class="bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl flex flex-wrap gap-2 items-center justify-start text-lg md:text-xl transition-all duration-300">
                    <!-- JS 動態填入 -->
                </div>
            </div>
        </div>
    </header>

    <!-- 下方作答區域 -->
    <main class="flex-grow p-4 md:p-6 overflow-y-auto">
        <div id="steps-container" class="max-w-4xl mx-auto pb-24">
            <!-- 步驟由 JS 動態生成 -->
        </div>
    </main>

    <!-- 完成彈窗 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div
            class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-all">
            <div
                class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">太棒了！</h3>
            <p class="text-slate-600 mb-6">你獲得了 <span id="modal-points" class="text-blue-600 font-bold"></span> 分！</p>
            <div class="flex flex-col gap-2">
                <button onclick="closeModal()"
                    class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-colors">下一題</button>
                <button onclick="resetProblem()"
                    class="w-full py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors">再練習一次</button>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800 text-white rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none z-50">
        請填滿空格
    </div>

    <script>
        let totalScore = 0;

        const problems = [
            {
                id: 1,
                data: [1, 3, { v: 3, h: 1 }, { v: 5, h: 1 }, 5, { v: 7, h: 1 }, { v: 9, h: 1 }, 11, { v: 11, h: 1 }, { v: 13, h: 1 }, 15, 17],
                steps: [
                    { title: "全距計算", instruction: "最大值 (17) 減去最小值 (1)：", slots: [null, null, null], answers: ["17", "1", "16"], options: ["1", "16", "17"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" },
                    { title: "四分位距計算", instruction: "觀察藍框，Q3 是 (11+13)÷2 = 12，Q1 是 (3+5)÷2 = 4：", slots: [null, null, null], answers: ["12", "4", "8"], options: ["4", "8", "12"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" }
                ]
            },
            {
                id: 2,
                data: [2, 4, 6, { v: 8, h: 1 }, 8, 10, { v: 10, h: 1 }, 12, 14, 16, { v: 18, h: 1 }, 18, 20],
                steps: [
                    { title: "全距計算", instruction: "最大值 (20) 減去最小值 (2)：", slots: [null, null, null], answers: ["20", "2", "18"], options: ["2", "18", "20"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" },
                    { title: "四分位距計算", instruction: "觀察方框：Q3 是 18，Q1 是 8：", slots: [null, null, null], answers: ["18", "8", "10"], options: ["8", "10", "18"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" }
                ]
            },
            {
                id: 3,
                data: [3, 7, 9, { v: 11, h: 1 }, 28, 31, 32, { v: 32, h: 1 }, 54, 56, { v: 67, h: 1 }, 69, 71, 72],
                steps: [
                    { title: "全距計算", instruction: "最大值 (72) 減去最小值 (3)：", slots: [null, null, null], answers: ["72", "3", "69"], options: ["3", "69", "72"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" },
                    { title: "四分位距計算", instruction: "觀察方框：Q3 是 67，Q1 是 11：", slots: [null, null, null], answers: ["67", "11", "56"], options: ["11", "56", "67"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" }
                ]
            },
            {
                id: 4,
                data: [8, 15, 16, { v: 19, h: 1 }, 20, 29, 31, { v: 37, h: 1 }, 51, 63, 64, { v: 65, h: 1 }, 66, 68, 69],
                steps: [
                    { title: "全距計算", instruction: "最大值 (69) 減去最小值 (8)：", slots: [null, null, null], answers: ["69", "8", "61"], options: ["8", "61", "69"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" },
                    { title: "四分位距計算", instruction: "觀察方框：Q3 是 65，Q1 是 19：", slots: [null, null, null], answers: ["65", "19", "46"], options: ["19", "46", "65"], template: "<span class='slot' data-idx='0'></span> - <span class='slot' data-idx='1'></span> = <span class='slot' data-idx='2'></span>" }
                ]
            },
            {
                id: 5,
                type: "dual",
                nameA: "老陳", dataA: [4, 4, 5, 5, 5, { v: 6, h: 1 }, 6, 7, 7, 7, { v: 7, h: 1 }, 8, 8, 8, 8, 8, { v: 8, h: 1 }, 9, 9, 9, 10, 10],
                nameB: "老王", dataB: [5, 5, 5, 6, 6, { v: 6, h: 1 }, 6, 7, 7, 7, 7, { v: 8, h: 1 }, 8, 8, 8, 8, 9, { v: 9, h: 1 }, 9, 9, 9, 10],
                steps: [
                    { title: "老陳：結果計算", instruction: "老陳的全距為 10-4=6，IQR 為 8-6=2：", slots: [null, null], answers: ["6", "2"], options: ["2", "4", "6"], template: "全距：<span class='slot' data-idx='0'></span>，四分位距：<span class='slot' data-idx='1'></span>" },
                    { title: "老王：結果計算", instruction: "老王的全距為 10-5=5，IQR 為 9-6=3：", slots: [null, null], answers: ["5", "3"], options: ["3", "5", "10"], template: "全距：<span class='slot' data-idx='0'></span>，四分位距：<span class='slot' data-idx='1'></span>" }
                ]
            },
            {
                id: 6,
                type: "dual",
                nameA: "小艾", dataA: [35, 42, 50, { v: 64, h: 1 }, 68, 72, 73, { v: 75, h: 1 }, 79, 80, 82, { v: 83, h: 1 }, 86, 90, 92],
                nameB: "小宇", dataB: [36, 45, 48, { v: 60, h: 1 }, 62, 66, 68, { v: 71, h: 1 }, 78, 84, 85, { v: 89, h: 1 }, 89, 93, 94],
                steps: [
                    { title: "小艾：結果計算", instruction: "小艾全距 92-35=57，IQR 83-64=19：", slots: [null, null], answers: ["57", "19"], options: ["19", "57", "92"], template: "全距：<span class='slot' data-idx='0'></span>，四分位距：<span class='slot' data-idx='1'></span>" },
                    { title: "小宇：結果計算", instruction: "小宇全距 94-36=58，IQR 89-60=29：", slots: [null, null], answers: ["58", "29"], options: ["29", "58", "60"], template: "全距：<span class='slot' data-idx='0'></span>，四分位距：<span class='slot' data-idx='1'></span>" }
                ]
            }
        ];

        let currentProbIdx = 0;
        let activeStepIdx = 0;

        function init() {
            renderNav();
            switchProblem(0);
        }

        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = problems.map((p, i) => `
                <button onclick="switchProblem(${i})" id="nav-btn-${i}" class="px-4 py-1.5 rounded-full border-2 bg-white text-slate-500 font-bold hover:border-blue-400 transition-all whitespace-nowrap text-sm">
                    題目 ${p.id}
                </button>
            `).join('');
        }

        function updateScore(points) {
            totalScore += points;
            const scoreEl = document.getElementById('score-val');
            scoreEl.innerText = totalScore;
            scoreEl.classList.add('animate-score');
            setTimeout(() => scoreEl.classList.remove('animate-score'), 500);
        }

        function switchProblem(idx) {
            currentProbIdx = idx;
            activeStepIdx = 0;
            loadProblem(idx);

            document.querySelectorAll('[id^="nav-btn-"]').forEach(btn => btn.classList.remove('nav-active'));
            document.getElementById(`nav-btn-${idx}`).classList.add('nav-active');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadProblem(idx) {
            const prob = problems[idx];
            document.getElementById('problem-label').innerText = `題目 ${prob.id}`;

            const dataDisplay = document.getElementById('problem-data-display');
            if (prob.type === "dual") {
                dataDisplay.innerHTML = `
                    <div class="w-full flex flex-col gap-2">
                        <div class="flex items-center gap-2 flex-wrap text-sm border-b pb-2">
                            <span class="font-bold text-blue-600">${prob.nameA}：</span>
                            ${prob.dataA.map(item => `<span class="${item.h ? 'data-box' : ''} px-1">${item.v || item}</span>`).join('、')}
                        </div>
                        <div class="flex items-center gap-2 flex-wrap text-sm pt-1">
                            <span class="font-bold text-blue-600">${prob.nameB}：</span>
                            ${prob.dataB.map(item => `<span class="${item.h ? 'data-box' : ''} px-1">${item.v || item}</span>`).join('、')}
                        </div>
                    </div>
                `;
            } else {
                dataDisplay.innerHTML = prob.data.map(item => {
                    const val = typeof item === 'object' ? item.v : item;
                    return `<span class="${item.h ? 'data-box' : ''} px-1">${val}</span>`;
                }).join('、');
            }

            renderSteps();
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            const prob = problems[currentProbIdx];

            container.innerHTML = prob.steps.map((step, sIdx) => `
                <section id="step-${sIdx}" class="step-card bg-white p-6 rounded-3xl border-2 border-slate-200 mb-6 ${sIdx === 0 ? 'active' : ''}">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-black">${sIdx + 1}</span>
                        <h3 class="font-bold text-slate-800">${step.title}</h3>
                        <span id="check-icon-${sIdx}" class="hidden text-green-500 scale-125">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                            </svg>
                        </span>
                    </div>
                    
                    <p class="text-slate-500 text-sm mb-6 bg-slate-50 p-3 rounded-xl border border-slate-100">${step.instruction}</p>
                    
                    <div class="math py-6 mb-8 w-full justify-center bg-blue-50/30 rounded-2xl border border-blue-100">
                        ${step.template}
                    </div>

                    <div id="options-${sIdx}" class="flex flex-wrap gap-3 mb-4 justify-center ${sIdx === activeStepIdx ? '' : 'hidden'}">
                        ${step.options.sort(() => Math.random() - 0.5).map(opt => `
                            <button onclick="handleOptionClick(${sIdx}, '${opt}', this)" class="min-w-[64px] px-5 py-3 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition-all shadow-sm active:scale-95">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div id="action-${sIdx}" class="${sIdx === activeStepIdx ? '' : 'hidden'}">
                        <button onclick="checkStep(${sIdx})" class="w-full py-4 bg-slate-800 text-white font-bold rounded-2xl shadow-xl hover:bg-blue-600 transition-all flex items-center justify-center gap-2">
                            <span>檢查答案</span>
                            <span class="text-xs bg-white/20 px-2 py-0.5 rounded">+10 分</span>
                        </button>
                    </div>
                </section>
            `).join('');

            document.querySelectorAll('.slot').forEach(slot => {
                slot.addEventListener('click', (e) => {
                    const stepIdx = parseInt(e.target.closest('section').id.split('-')[1]);
                    if (stepIdx === activeStepIdx) clearSlot(e.target);
                });
            });
        }

        function handleOptionClick(stepIdx, val, btn) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            for (let slot of slots) {
                if (!slot.innerText) {
                    slot.innerText = val;
                    slot.classList.add('filled');
                    btn.disabled = true;
                    btn.classList.add('opacity-20', 'pointer-events-none');
                    return;
                }
            }
        }

        function clearSlot(slot) {
            if (!slot.innerText) return;
            const val = slot.innerText;
            const optionsDiv = document.getElementById(`options-${activeStepIdx}`);
            const btns = optionsDiv.querySelectorAll('button');
            for (let btn of btns) {
                if (btn.innerText === val && btn.disabled) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-20', 'pointer-events-none');
                    break;
                }
            }
            slot.innerText = '';
            slot.classList.remove('filled');
        }

        function checkStep(stepIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            const answers = problems[currentProbIdx].steps[stepIdx].answers;

            let allFilled = true;
            slots.forEach(s => { if (!s.innerText) allFilled = false; });
            if (!allFilled) { showToast("還有格子沒填完喔！"); return; }

            let isCorrect = true;
            slots.forEach((slot, i) => { if (slot.innerText !== answers[i]) isCorrect = false; });

            if (isCorrect) {
                stepEl.classList.add('completed', 'animate-tada');
                document.getElementById(`check-icon-${stepIdx}`).classList.remove('hidden');
                document.getElementById(`options-${stepIdx}`).classList.add('hidden');
                document.getElementById(`action-${stepIdx}`).classList.add('hidden');
                slots.forEach(slot => { slot.classList.add('correct'); slot.style.pointerEvents = 'none'; });

                // 加分
                updateScore(10);

                if (stepIdx < problems[currentProbIdx].steps.length - 1) {
                    setTimeout(() => {
                        activeStepIdx++;
                        const nextStep = document.getElementById(`step-${activeStepIdx}`);
                        nextStep.classList.add('active');
                        document.getElementById(`options-${activeStepIdx}`).classList.remove('hidden');
                        document.getElementById(`action-${activeStepIdx}`).classList.remove('hidden');
                        nextStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 600);
                } else {
                    setTimeout(() => showCompletion(problems[currentProbIdx].steps.length * 10), 500);
                }
            } else {
                showToast("再試一次，加油！");
                slots.forEach((slot, i) => {
                    if (slot.innerText !== answers[i]) {
                        slot.classList.add('text-red-500', 'border-red-300');
                        setTimeout(() => slot.classList.remove('text-red-500', 'border-red-300'), 1000);
                    }
                });
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 1500);
        }

        function showCompletion(points) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-points').innerText = points;
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('div').classList.remove('scale-95'), 10);
        }

        function resetProblem() {
            closeModal();
            activeStepIdx = 0;
            loadProblem(currentProbIdx);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (currentProbIdx < problems.length - 1) {
                    switchProblem(currentProbIdx + 1);
                }
            }, 200);
        }

        window.onload = init;
    </script>
<script src="../progress.js"></script>
</body>

</html>
