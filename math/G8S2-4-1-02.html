    <script>
        // 題型判定資訊（僅供開發與內部參考）
        console.log("【題型判定】：國中數學幾何——平行線截角性質應用（結合三角形內角和、鄰角互補、折線平行輔助線推導）");

        // 音效合成器 (Web Audio API)
        const audioSynth = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playSuccess() {
                this.init();
                const now = this.ctx.currentTime;
                const gain = this.ctx.createGain();
                gain.connect(this.ctx.destination);

                const freqs = [523.25, 659.25, 783.99]; // C5 -> E5 -> G5 琶音
                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    osc.type = 'sine';
                    osc.connect(gain);
                    osc.frequency.setValueAtTime(f, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            },
            playError() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        };

        // 核心資料狀態結構
        const appState = {
            score: 0,
            totalScore: 80, // 8 steps in total, 10 points each
            timeRemaining: 420, // 7 mins = 420s
            timerInterval: null,
            activeQuestionIdx: 0,
            questions: [
                {

        };

        // 啟動計時器
        function startTimer() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            appState.timerInterval = setInterval(() => {
                if (appState.timeRemaining > 0) {
                    appState.timeRemaining--;
                    updateTimerDisplay();
                } else {
                    clearInterval(appState.timerInterval);
                    showTimeout();
                }
            }, 1000);
        }

        // 更新計時顯示
        function updateTimerDisplay() {
            const mins = Math.floor(appState.timeRemaining / 60);
            const secs = appState.timeRemaining % 60;
            const displayStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = displayStr;

            // 倒數警告視覺（最後一分鐘）- 移除 animate-pulse 閃爍，改為靜態亮紅色高質感邊框
            if (appState.timeRemaining <= 60) {
                document.getElementById('timer-display').parentElement.classList.add('bg-red-100', 'text-red-700', 'border-red-300');
            } else {
                document.getElementById('timer-display').parentElement.classList.remove('bg-red-100', 'text-red-700', 'border-red-300');
            }
        }

        // 動態渲染多題目切換導覽列
        function renderNavigation() {
            const container = document.getElementById('nav-btn-container');
            container.innerHTML = '';

            appState.questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';

                const isCompleted = q.steps.every(s => s.answeredCorrectly);
                const isActive = idx === appState.activeQuestionIdx;

                let btnClass = "px-4 py-1.5 rounded-xl font-bold whitespace-nowrap text-sm border transition-all active:scale-95 flex items-center gap-1 ";
                if (isActive) {
                    btnClass += "bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-100";
                } else if (isCompleted) {
                    btnClass += "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100";
                } else {
                    btnClass += "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                }

                btn.className = btnClass;
                btn.innerHTML = `
          <span>題目 ${idx + 1}</span>
          ${isCompleted ? '<span class="text-xs">✔</span>' : ''}
        `;

                btn.onclick = () => switchQuestion(idx);
                container.appendChild(btn);
            });
        }

        // 切換題目並保留進度
        function switchQuestion(idx) {
            appState.activeQuestionIdx = idx;

            const q = appState.questions[idx];
            document.getElementById('question-title').innerText = q.title;
            document.getElementById('question-prompt').innerHTML = q.prompt;

            appState.questions.forEach(item => {
                document.getElementById(item.svgId).classList.add('hidden');
            });
            document.getElementById(q.svgId).classList.remove('hidden');

            const activeStep = q.steps[q.activeStepIdx];
            if (activeStep) {
                const firstEmpty = activeStep.slots.indexOf(null);
                appState.currentStepActiveSlotIdx = firstEmpty !== -1 ? firstEmpty : 0;
            }

            renderSteps();
            renderNavigation();
            updateSVGHighlight();
        }

        // 亂序重排演算法
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 渲染右側的所有步驟
        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            const q = appState.questions[appState.activeQuestionIdx];

            q.steps.forEach((step, stepIdx) => {
                const isLocked = stepIdx > q.activeStepIdx;
                const isActive = stepIdx === q.activeStepIdx;
                const isCompleted = step.answeredCorrectly;

                const stepCard = document.createElement('div');
                stepCard.id = `step-card-${stepIdx}`;

                let cardClass = "p-5 rounded-3xl border transition-all duration-300 ";
                if (isLocked) {
                    cardClass += "bg-slate-50/50 border-slate-100 opacity-40 select-none pointer-events-none";
                } else if (isCompleted) {
                    cardClass += "bg-emerald-50/60 border-emerald-200 shadow-sm";
                } else {
                    cardClass += "bg-white border-blue-200 shadow-lg shadow-blue-50 relative ring-4 ring-blue-50";
                }
                stepCard.className = cardClass;

                // 步驟標題區：移除「進行中」標籤的 animate-pulse 閃爍效果
                const titleEl = document.createElement('div');
                titleEl.className = "flex items-center justify-between mb-2 border-b border-dashed border-slate-200 pb-2";
                titleEl.innerHTML = `
          <h3 class="font-black text-base text-slate-700 flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-lg ${isCompleted ? 'bg-emerald-500 text-white' : isActive ? 'bg-indigo-600 text-white' : 'bg-slate-300 text-slate-600'} text-xs flex items-center justify-center font-black">
              ${stepIdx + 1}
            </span>
            ${step.title}
          </h3>
          ${isCompleted ? '<span class="text-sm font-black text-emerald-600 flex items-center gap-1">✔ 已完成</span>' : isLocked ? '<span class="text-sm font-bold text-slate-400">🔒 尚未解鎖</span>' : '<span class="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 font-black px-2.5 py-1 rounded-md">進行中</span>'}
        `;
                stepCard.appendChild(titleEl);

                if (isLocked) {
                    container.appendChild(stepCard);
                    return;
                }

                const instructionEl = document.createElement('p');
                instructionEl.className = "text-base text-slate-500 mb-3 font-medium leading-relaxed";
                instructionEl.innerHTML = step.instruction;
                stepCard.appendChild(instructionEl);

                const mathLine = document.createElement('div');
                mathLine.className = "math-line bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center gap-3";

                if (step.type === "single") {
                    if (step.latexPre) {
                        const mathPre = document.createElement('span');
                        mathPre.className = "math";
                        mathPre.dataset.latex = step.latexPre;
                        mathLine.appendChild(mathPre);
                    }

                    const slot = document.createElement('span');
                    const isSlotActive = isActive && appState.currentStepActiveSlotIdx === 0;
                    slot.className = `slot ${isCompleted ? 'correct' : ''} ${isSlotActive ? 'active' : ''}`;
                    slot.innerText = step.slots[0] !== null ? step.slots[0] : "?";
                    slot.onclick = () => handleSlotClick(stepIdx, 0);
                    mathLine.appendChild(slot);

                    if (step.latexPost) {
                        const mathPost = document.createElement('span');
                        mathPost.className = "math";
                        mathPost.dataset.latex = step.latexPost;
                        mathLine.appendChild(mathPost);
                    }
                }

                stepCard.appendChild(mathLine);

                if (!isCompleted) {
                    const optionsContainer = document.createElement('div');
                    optionsContainer.className = "mt-4";

                    const optionsTitle = document.createElement('span');
                    optionsTitle.className = "text-xs font-black text-slate-400 block mb-2";
                    optionsTitle.innerText = "👉 點擊下方選項填入：";
                    optionsContainer.appendChild(optionsTitle);

                    const optionsGrid = document.createElement('div');
                    optionsGrid.className = "grid grid-cols-4 sm:grid-cols-5 gap-2.5";

                    if (!step.shuffledOptions) {
                        step.shuffledOptions = shuffleArray(step.options);
                    }

                    step.shuffledOptions.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = "bg-white hover:bg-indigo-50 active:bg-indigo-100 border-2 border-slate-200 hover:border-indigo-400 text-slate-700 font-extrabold py-2.5 px-3 rounded-xl transition-all active:scale-95 text-lg shadow-sm";
                        optBtn.innerText = opt;
                        optBtn.onclick = () => fillSlot(stepIdx, opt);
                        optionsGrid.appendChild(optBtn);
                    });
                    optionsContainer.appendChild(optionsGrid);
                    stepCard.appendChild(optionsContainer);

                    const actionRow = document.createElement('div');
                    actionRow.className = "mt-5 flex items-center justify-between gap-4 border-t border-slate-100 pt-4";

                    const feedbackText = document.createElement('span');
                    feedbackText.className = "text-red-500 font-bold text-sm min-h-[20px]";
                    feedbackText.innerText = step.hasError ? "⚠️ 答案不太對喔，再觀察圖形看看！" : "";
                    actionRow.appendChild(feedbackText);

                    const checkBtn = document.createElement('button');
                    checkBtn.type = 'button';

                    const hasEmpty = step.slots.some(s => s === null);
                    checkBtn.className = `font-black py-2.5 px-6 rounded-xl text-sm shadow-md transition-all active:scale-95 ${hasEmpty ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-100'}`;
                    checkBtn.innerText = "檢查答案";
                    checkBtn.disabled = hasEmpty;
                    checkBtn.onclick = () => checkStepAnswer(stepIdx);

                    actionRow.appendChild(checkBtn);
                    stepCard.appendChild(actionRow);
                }

                container.appendChild(stepCard);
            });

            renderMath();
        }

        // 當前步驟之 Slot 點擊事件：清空
        function handleSlotClick(stepIdx, slotIdx) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            if (step.answeredCorrectly) return;

            step.slots[slotIdx] = null;
            appState.currentStepActiveSlotIdx = slotIdx;

            renderSteps();
        }

        // 選項按鈕點擊：填入主動填答格
        function fillSlot(stepIdx, val) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            step.slots[appState.currentStepActiveSlotIdx] = val;

            const nextEmpty = step.slots.indexOf(null);
            if (nextEmpty !== -1) {
                appState.currentStepActiveSlotIdx = nextEmpty;
            }

            renderSteps();
        }

        // 檢查步驟答案
        function checkStepAnswer(stepIdx) {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[stepIdx];

            if (step.slots.some(s => s === null)) {
                showToast("⚠️ 請填滿所有空格再檢查喔！");
                return;
            }

            let isCorrect = true;
            for (let i = 0; i < step.slots.length; i++) {
                if (step.slots[i] !== step.correct[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                audioSynth.playSuccess();
                step.answeredCorrectly = true;

                if (!step.hasError) {
                    appState.score += 10;
                    updateScoreDisplay();
                }

                if (stepIdx === q.activeStepIdx && q.activeStepIdx < q.steps.length - 1) {
                    q.activeStepIdx++;
                    appState.currentStepActiveSlotIdx = 0;

                    setTimeout(() => {
                        renderSteps();
                        updateSVGHighlight();
                        scrollToActiveStep();
                    }, 400);
                } else if (stepIdx === q.steps.length - 1) {
                    showToast("🎉 恭喜你完成本題所有步驟！");
                    renderNavigation();

                    const allCompleted = appState.questions.every(item => item.steps.every(s => s.answeredCorrectly));
                    if (allCompleted) {
                        clearInterval(appState.timerInterval);
                        setTimeout(showFinishModal, 800);
                    }
                }

                renderSteps();
            } else {
                audioSynth.playError();
                step.hasError = true;
                renderSteps();
                showToast("⚠️ 答案不太對喔，再想想看！");
            }
        }

        // 自動捲動到當前活動步驟
        function scrollToActiveStep() {
            const activeCard = document.getElementById(`step-card-${appState.questions[appState.activeQuestionIdx].activeStepIdx}`);
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 更新 SVG 中與當前步驟相關的角的高亮效果（全靜態醒目，不添加任何閃爍、脈衝類別）
        function updateSVGHighlight() {
            const q = appState.questions[appState.activeQuestionIdx];
            const step = q.steps[q.activeStepIdx];

            // 先清空該題所有角與背景徽章的高亮狀態
            const allAngleGroups = document.querySelectorAll(`[id^="grp-"]`);
            allAngleGroups.forEach(g => {
                g.classList.remove('highlight-glow');
            });

            // 特別針對第三題：重置 L3 輔助線與輔助角的透明度
            if (q.id === 3) {
                document.getElementById('q3-l3').classList.remove('opacity-100');
                document.getElementById('q3-l3').classList.add('opacity-0');
                document.getElementById('txt-q3-l3').classList.remove('opacity-100');
                document.getElementById('txt-q3-l3').classList.add('opacity-0');
                document.getElementById('grp-q3-a1top').classList.add('opacity-0');
                document.getElementById('grp-q3-a1bot').classList.add('opacity-0');
            }

            if (!step || step.answeredCorrectly) return;

            // 根據步驟關聯的角，添加高亮效果（僅更換高對比色彩與陰影，文字與背景皆靜止）
            if (step.highlightAngles) {
                step.highlightAngles.forEach(num => {
                    const grp = document.getElementById(`grp-q${q.id}-${num}`);
                    if (grp) {
                        grp.classList.add('highlight-glow');
                    }
                });
            }

            // 第三題特例引導：繪製平行輔助線 L3，顯現對應拆分角度
            if (q.id === 3) {
                document.getElementById('q3-l3').classList.remove('opacity-0');
                document.getElementById('q3-l3').classList.add('opacity-100');
                document.getElementById('txt-q3-l3').classList.remove('opacity-0');
                document.getElementById('txt-q3-l3').classList.add('opacity-100');

                if (q.activeStepIdx === 0) {
                    document.getElementById('grp-q3-a1top').classList.remove('opacity-0');
                } else if (q.activeStepIdx === 1) {
                    document.getElementById('grp-q3-a1bot').classList.remove('opacity-0');
                } else {
                    document.getElementById('grp-q3-a1top').classList.remove('opacity-0');
                    document.getElementById('grp-q3-a1bot').classList.remove('opacity-0');
                }
            }
        }

        // 更新分數顯示
        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = appState.score;
        }

        // Toast 顯示通知
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 展示挑戰成功 Modal
        function showFinishModal() {
            document.getElementById('finish-score').innerText = appState.score;

            const usedSeconds = 420 - appState.timeRemaining;
            const mins = Math.floor(usedSeconds / 60);
            const secs = usedSeconds % 60;
            document.getElementById('finish-time').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const modal = document.getElementById('finish-modal');
            modal.classList.remove('hidden');
        }

        // 時間到
        function showTimeout() {
            audioSynth.playError();
            showToast("⏰ 時間到囉！讓我們重新挑戰一次吧！");
            setTimeout(showFinishModal, 1500);
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('finish-modal').classList.add('hidden');
        }

        // 重新作答
        function restartAll() {
            closeModal();

            appState.score = 0;
            appState.timeRemaining = 420;
            appState.activeQuestionIdx = 0;

            appState.questions.forEach(q => {
                q.activeStepIdx = 0;
                q.steps.forEach(step => {
                    step.slots = step.slots.map(() => null);
                    step.answeredCorrectly = false;
                    step.hasError = false;
                });
            });

            appState.currentStepActiveSlotIdx = 0;

            updateScoreDisplay();
            updateTimerDisplay();
            startTimer();
            switchQuestion(0);
        }

        // 初始化自動渲染 KaTeX
        function renderMath() {
            document.querySelectorAll('.math').forEach(el => {
                if (!el.dataset.rendered) {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: false
                    });
                    el.dataset.rendered = "true";
                }
            });
            document.querySelectorAll('.math-display').forEach(el => {
                if (!el.dataset.rendered) {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: true
                    });
                    el.dataset.rendered = "true";
                }
            });
        }

        // 網頁加載初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderMath();
            switchQuestion(0);
            startTimer();
        });
    </script>
</body>

</html>
