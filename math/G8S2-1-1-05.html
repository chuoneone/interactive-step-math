    <style>
        /* 基礎字體與數學樣式 */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f8fafc;
        }

        .math-text {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.25em;
            letter-spacing: 0.05em;
        }

        /* 填答格 (Slot) 樣式 */
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 3.5rem;
            height: 2.5rem;
            margin: 0 0.25rem;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #f1f5f9;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            vertical-align: middle;
            font-family: 'Times New Roman', Times, serif;
        }

        .slot:hover:not(.filled):not(.locked) {
            background-color: #e2e8f0;
        }

        .slot.filled {
            background-color: #eff6ff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slot.correct-checked {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            cursor: default;
        }

        .slot.failed-checked {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            cursor: default;
        }

        /* 選項按鈕樣式 */
        .option-btn {
            transition: all 0.2s;
            font-family: 'Times New Roman', Times, serif;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .option-btn:disabled {
            opacity: 0.4;
            filter: grayscale(100%);
            cursor: not-allowed;
            transform: none;
        }

        /* 步驟卡片狀態 */
        .step-card {
            transition: all 0.4s ease-out;
            opacity: 1;
            transform: translateY(0);
        }

        .step-card.locked {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(80%);
        }

        .step-card.active {
            border-color: #60a5fa;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }

        .step-card.completed {
            border-color: #86efac;
            background-color: #f0fdf4;
        }

        /* 動畫 */
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes tada {
            0% {
                transform: scale3d(1, 1, 1);
            }

            10%,
            20% {
                transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
            }

            40%,
            60%,
            80% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
            }

            100% {
                transform: scale3d(1, 1, 1);
            }
        }

        .animate-tada {
            animation: tada 1s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }

        .animate-shake {
            animation: shake 0.5s;
        }

        /* 導覽列隱藏滾動條 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 防止公式換行破壞版面 */
        .formula-container {
            word-break: keep-all;
            white-space: nowrap;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
    </style>
</head>

        // --- 2. 應用程式狀態 ---
        let currentQIndex = 0;
        let appState = [];
        const STORAGE_KEY = 'math_interactive_seq_state_v2'; // 更新 key 避免舊存檔衝突

        // 初始化狀態
        function initAppState() {
            const savedState = localStorage.getItem(STORAGE_KEY);
            if (savedState) {
                try {
                    appState = JSON.parse(savedState);
                    return; // 成功讀取進度
                } catch (e) {
                    console.error("讀取存檔失敗", e);
                }
            }

            appState = quizData.map(q => ({
                unlockedStep: 0,
                isCompleted: false,
                stepsData: q.steps.map(s => ({
                    slotsData: new Array(s.answers.length).fill(null), // 儲存填入的值
                    optionsUsed: new Array(s.options.length).fill(false), // 選項是否被使用
                    isChecked: false,
                    attempts: 0,      // 記錄嘗試次數
                    earnedSlots: 0,   // 記錄答對獲得的格子數
                    isFailed: false   // 記錄是否兩次都錯
                }))
            }));
        }

        // 儲存狀態並更新分數
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            updateScoreDisplay();
        }

        // 計算並更新分數顯示
        function updateScoreDisplay() {
            let totalSlots = 0;
            let earnedSlots = 0;

            quizData.forEach((q, qIndex) => {
                q.steps.forEach((step, sIndex) => {
                    const slotCount = step.answers.length;
                    totalSlots += slotCount;

                    const stepState = appState[qIndex].stepsData[sIndex];
                    if (stepState.isChecked) {
                        earnedSlots += stepState.earnedSlots;
                    }
                });
            });

            const score = totalSlots === 0 ? 0 : Math.round((earnedSlots / totalSlots) * 100);
            document.getElementById('total-score').textContent = score;
        }

        // --- 3. 渲染功能 ---
        function renderApp() {
            renderNav();
            renderProblem();
            renderSteps();
            updateStepInteractivity();
            updateScoreDisplay(); // 確保每次重繪都顯示最新分數
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-buttons');
            navContainer.innerHTML = '';
            quizData.forEach((q, index) => {
                const btn = document.createElement('button');
                const isCurrent = index === currentQIndex;
                const state = appState[index];

                btn.className = `px-5 py-2 rounded-full font-bold transition-colors whitespace-nowrap flex items-center gap-2
                    ${isCurrent ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-300 hover:bg-slate-50'}`;

                let iconHtml = state.isCompleted
                    ? `<svg class="w-4 h-4 text-${isCurrent ? 'white' : 'green-500'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`
                    : '';

                btn.innerHTML = `${q.title} ${iconHtml}`;
                btn.onclick = () => {
                    currentQIndex = index;
                    renderApp();
                };
                navContainer.appendChild(btn);
            });
        }

        function renderProblem() {
            const q = quizData[currentQIndex];
            document.getElementById('question-title').textContent = q.title;
            document.getElementById('problem-content').innerHTML = q.problemHtml;
            document.getElementById('formula-content').innerHTML = q.formulaHtml;
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            const q = quizData[currentQIndex];
            const state = appState[currentQIndex];

            q.steps.forEach((step, stepIndex) => {
                const stepState = state.stepsData[stepIndex];
                const isUnlocked = stepIndex <= state.unlockedStep;
                const isCompleted = stepState.isChecked;
                const isActive = stepIndex === state.unlockedStep && !state.isCompleted;

                // 產生選項按鈕 HTML
                const optionsHtml = step.options.map((opt, optIdx) => {
                    const isUsed = stepState.optionsUsed[optIdx];
                    return `<button 
                        class="option-btn px-6 py-3 bg-white border-2 border-slate-200 text-blue-700 text-xl font-bold rounded-xl shadow-sm hover:border-blue-300" 
                        ${isUsed || isCompleted ? 'disabled' : ''}
                        onclick="handleOptionClick(${stepIndex}, '${opt}', ${optIdx})">
                        ${opt}
                    </button>`;
                }).join('');

                const stepHtml = `
                    <div id="step-${stepIndex}" class="step-card bg-white p-5 md:p-6 rounded-2xl border-2 border-slate-100 shadow-sm
                        ${!isUnlocked ? 'locked' : ''} 
                        ${isActive ? 'active' : ''} 
                        ${isCompleted ? 'completed' : ''}">
                        
                        <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-3">
                            <div>
                                <h3 class="font-bold text-slate-500 text-sm tracking-widest uppercase mb-1">Step ${stepIndex + 1}</h3>
                                <div class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                    ${step.title}
                                    ${isCompleted ? (stepState.isFailed ? '<span class="text-red-600 text-sm bg-red-100 px-2 py-0.5 rounded-full flex items-center gap-1">已顯示解答</span>' : '<span class="text-green-600 text-sm bg-green-100 px-2 py-0.5 rounded-full flex items-center gap-1"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 答對</span>') : ''}
                                </div>
                            </div>
                        </div>

                        ${!isCompleted ? `<div class="text-slate-600 mb-4 text-lg">${step.instruction}</div>` : ''}

                        <div class="bg-slate-50 p-6 rounded-xl mb-6 overflow-x-auto hide-scrollbar formula-container" id="template-container-${stepIndex}">
                            ${step.template}
                        </div>

                        <!-- 操作區：若完成則隱藏 -->
                        <div class="${isCompleted ? 'hidden' : 'block'}">
                            <div class="flex flex-wrap gap-3 mb-6" id="options-container-${stepIndex}">
                                ${optionsHtml}
                            </div>

                            <button onclick="checkAnswer(${stepIndex})" id="check-btn-${stepIndex}"
                                class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                檢查答案
                            </button>
                            <div id="msg-${stepIndex}" class="mt-3 text-center font-bold text-lg h-6"></div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', stepHtml);

                // 綁定 Slot 事件與還原狀態
                const templateContainer = document.getElementById(`template-container-${stepIndex}`);
                const slots = templateContainer.querySelectorAll('.slot');
                slots.forEach((slot, slotIndex) => {
                    // 還原狀態
                    if (stepState.slotsData[slotIndex] !== null) {
                        slot.textContent = stepState.slotsData[slotIndex];
                        slot.classList.add('filled');
                    }
                    if (isCompleted) {
                        if (stepState.isFailed) {
                            slot.classList.add('failed-checked');
                        } else {
                            slot.classList.add('correct-checked');
                        }
                        slot.classList.remove('cursor-pointer');
                    } else {
                        // 綁定點擊清除事件
                        slot.onclick = () => handleSlotClick(stepIndex, slotIndex);
                    }
                });
            });
        }

        // --- 4. 互動邏輯 ---

        // 點擊選項填入
        function handleOptionClick(stepIndex, optValue, optIndex) {
            const state = appState[currentQIndex].stepsData[stepIndex];
            if (state.isChecked) return;

            // 清除之前的錯誤訊息
            const msgEl = document.getElementById(`msg-${stepIndex}`);
            if (msgEl) msgEl.textContent = '';

            // 尋找第一個空位
            const emptySlotIndex = state.slotsData.findIndex(val => val === null);

            if (emptySlotIndex !== -1) {
                // 更新資料狀態
                state.slotsData[emptySlotIndex] = optValue;
                state.optionsUsed[optIndex] = true;

                // 更新 UI (不需整個重繪，局部更新較平滑)
                updateStepInteractivity(stepIndex);
            }
        }

        // 點擊填答格清除
        function handleSlotClick(stepIndex, slotIndex) {
            const stepState = appState[currentQIndex].stepsData[stepIndex];
            if (stepState.isChecked || stepState.slotsData[slotIndex] === null) return;

            // 清除之前的錯誤訊息
            const msgEl = document.getElementById(`msg-${stepIndex}`);
            if (msgEl) msgEl.textContent = '';

            const valueToClear = stepState.slotsData[slotIndex];

            // 找回對應的選項按鈕並恢復
            const q = quizData[currentQIndex];
            const optIndex = q.steps[stepIndex].options.findIndex((opt, idx) => opt === valueToClear && stepState.optionsUsed[idx]);

            if (optIndex !== -1) {
                stepState.optionsUsed[optIndex] = false;
            }

            // 清除資料狀態
            stepState.slotsData[slotIndex] = null;

            updateStepInteractivity(stepIndex);
        }

        // 局部更新 UI 狀態 (按鈕禁用、格子內容)
        function updateStepInteractivity(specificStepIndex = null) {
            const state = appState[currentQIndex];

            const updateSingleStep = (stepIndex) => {
                const stepState = state.stepsData[stepIndex];
                if (stepState.isChecked) return;

                // 更新 Slots UI
                const container = document.getElementById(`template-container-${stepIndex}`);
                if (!container) return;
                const slots = container.querySelectorAll('.slot');
                slots.forEach((slot, idx) => {
                    const val = stepState.slotsData[idx];
                    slot.textContent = val !== null ? val : '';
                    if (val !== null) {
                        slot.classList.add('filled');
                    } else {
                        slot.classList.remove('filled');
                    }
                });

                // 更新 Options 按鈕 UI
                const optionsContainer = document.getElementById(`options-container-${stepIndex}`);
                if (!optionsContainer) return;
                const btns = optionsContainer.querySelectorAll('.option-btn');
                btns.forEach((btn, idx) => {
                    btn.disabled = stepState.optionsUsed[idx];
                });
            };

            if (specificStepIndex !== null) {
                updateSingleStep(specificStepIndex);
            } else {
                state.stepsData.forEach((_, idx) => updateSingleStep(idx));
            }
        }

        // 檢查答案
        function checkAnswer(stepIndex) {
            const q = quizData[currentQIndex];
            const stepState = appState[currentQIndex].stepsData[stepIndex];
            const msgEl = document.getElementById(`msg-${stepIndex}`);
            const stepCard = document.getElementById(`step-${stepIndex}`);

            // 檢查是否填滿
            if (stepState.slotsData.includes(null)) {
                showMessage(msgEl, "請填滿所有空格再檢查喔！", "text-amber-600");
                stepCard.classList.add('animate-shake');
                setTimeout(() => stepCard.classList.remove('animate-shake'), 500);
                return;
            }

            // 比對答案
            const isCorrect = stepState.slotsData.every((val, idx) => val === q.steps[stepIndex].answers[idx]);

            if (isCorrect) {
                // 答對處理
                stepState.isChecked = true;
                stepState.isFailed = false;
                stepState.earnedSlots = q.steps[stepIndex].answers.length; // 獲得全部分數

                showMessage(msgEl, "答對了！", "text-green-600");
                stepCard.classList.add('animate-tada');

                saveState(); // 存檔並更新分數

                // 解鎖下一步
                if (stepIndex + 1 < q.steps.length) {
                    appState[currentQIndex].unlockedStep = stepIndex + 1;
                    saveState();
                    setTimeout(() => {
                        renderApp(); // 重繪以顯示下一步
                        const nextStepEl = document.getElementById(`step-${stepIndex + 1}`);
                        if (nextStepEl) nextStepEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 800);
                } else {
                    // 全題完成
                    appState[currentQIndex].isCompleted = true;
                    saveState();
                    setTimeout(() => {
                        renderApp();
                        showCompletionModal();
                    }, 800);
                }
            } else {
                // 答錯處理
                stepState.attempts += 1;

                if (stepState.attempts >= 2) {
                    // 兩次都錯
                    stepState.isChecked = true;
                    stepState.isFailed = true;
                    stepState.earnedSlots = 0; // 沒拿到分數 (相當於扣分)

                    // 自動填入正確答案
                    stepState.slotsData = [...q.steps[stepIndex].answers];

                    // 標記選項為已使用
                    q.steps[stepIndex].answers.forEach(ans => {
                        const optIdx = q.steps[stepIndex].options.findIndex((opt, idx) => opt === ans && !stepState.optionsUsed[idx]);
                        if (optIdx !== -1) stepState.optionsUsed[optIdx] = true;
                    });

                    showMessage(msgEl, "兩次機會用完囉！已顯示正確答案。", "text-red-600");
                    saveState(); // 存檔並更新分數

                    // 解鎖下一步
                    if (stepIndex + 1 < q.steps.length) {
                        appState[currentQIndex].unlockedStep = stepIndex + 1;
                        saveState();
                        setTimeout(() => {
                            renderApp();
                            const nextStepEl = document.getElementById(`step-${stepIndex + 1}`);
                            if (nextStepEl) nextStepEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 1500); // 稍微停頓久一點讓學生看答案
                    } else {
                        appState[currentQIndex].isCompleted = true;
                        saveState();
                        setTimeout(() => {
                            renderApp();
                            showCompletionModal();
                        }, 1500);
                    }

                } else {
                    // 錯第一次
                    showMessage(msgEl, "再想想看，答案不太對喔！(還有 1 次機會)", "text-red-500");
                    stepCard.classList.add('animate-shake');
                    setTimeout(() => stepCard.classList.remove('animate-shake'), 500);
                    saveState();
                }
            }
        }

        function showMessage(element, text, colorClass) {
            element.textContent = text;
            element.className = `mt-3 text-center font-bold text-lg h-6 ${colorClass}`;
        }

        // --- 5. Modal 控制 ---
        const modal = document.getElementById('completion-modal');
        const modalContent = modal.querySelector('div');

        function showCompletionModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // 小延遲讓 display block 先生效再跑動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function resetCurrentQuestion() {
            // 重置當前題目的狀態
            const q = quizData[currentQIndex];
            appState[currentQIndex] = {
                unlockedStep: 0,
                isCompleted: false,
                stepsData: q.steps.map(s => ({
                    slotsData: new Array(s.answers.length).fill(null),
                    optionsUsed: new Array(s.options.length).fill(false),
                    isChecked: false,
                    attempts: 0,
                    earnedSlots: 0,
                    isFailed: false
                }))
            };
            saveState(); // 存檔並更新分數 (這題失去的分數可以重新賺回來)
            closeModal();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 啟動程式 ---
        initAppState();
        renderApp();

    </script>
<script src="../progress.js"></script>
</body>
