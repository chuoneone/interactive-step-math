<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求比值 - 點擊填入版</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdfa;
            overflow-x: hidden;
        }

        /* 數學算式 HTML 呈現 */
        .math {
            font-size: 32px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            margin: 0 4px;
        }

        .fraction span:first-child {
            border-bottom: 3px solid #000;
            padding: 0 6px;
            min-width: 40px;
            text-align: center;
        }

        .fraction span:last-child {
            padding: 0 6px;
            min-width: 40px;
            text-align: center;
        }

        .mixed {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        /* 填答格樣式 */
        .slot {
            display: inline-block;
            width: 55px;
            height: 50px;
            border-bottom: 3px solid #94a3b8;
            margin: 0 4px;
            text-align: center;
            vertical-align: middle;
            font-size: 32px;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot.filled {
            border-bottom-color: #0d9488;
            background-color: #f0fdfa;
            border-radius: 8px 8px 0 0;
            color: #0d9488;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            color: #15803d;
        }

        /* 按鈕樣式 */
        .option-btn {
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .option-btn:active {
            transform: scale(0.9);
        }

        .option-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
        }

        .step-enter {
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tada {
            animation: tada 0.8s ease-in-out;
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-2deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.05) rotate(2deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.05) rotate(-2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b border-teal-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4 overflow-x-auto no-scrollbar">
                <span class="font-black text-teal-800 whitespace-nowrap bg-teal-50 px-3 py-1 rounded-lg">二、求比值</span>
                <div id="nav-tabs" class="flex space-x-2">
                    <!-- JS 動態生成題目切換按鈕 -->
                </div>
            </div>
            <div class="flex items-center space-x-4 ml-4">
                <div class="text-lg font-bold text-teal-600">⏱️ <span id="timer">07:00</span></div>
                <div class="text-lg font-bold text-teal-800">得分: <span id="score">0</span></div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full p-4 gap-6">

        <!-- 左側：題目固定區 -->
        <div class="w-full md:w-1/3">
            <div class="bg-white rounded-3xl shadow-lg p-8 sticky md:top-24 border border-teal-50">
                <h2 id="q-title" class="text-2xl font-black mb-4 text-teal-700">題目辨識中...</h2>
                <div id="q-desc" class="text-lg text-slate-500 mb-4">求下列各比的比值：</div>
                <div id="q-display" class="bg-slate-50 p-6 rounded-2xl flex justify-center items-center min-h-[120px]">
                    <!-- 題目主視覺由 JS 渲染 -->
                </div>
            </div>
        </div>

        <!-- 右側：步驟解鎖區 -->
        <div class="w-full md:w-2/3 space-y-6" id="steps-container">
            <!-- 步驟由 JS 動態填入 -->
        </div>

    </main>

    <!-- 完成視窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-md w-full text-center shadow-2xl border-4 border-teal-400">
            <div class="text-7xl mb-6">🎯</div>
            <h3 class="text-3xl font-black text-slate-800 mb-2">任務達成！</h3>
            <p class="text-slate-500 mb-8 text-xl font-medium">你已經掌握了負數與分數的比值運算！</p>
            <div class="flex flex-col space-y-3">
                <button onclick="resetApp()"
                    class="w-full py-4 bg-teal-600 text-white rounded-2xl font-black text-xl hover:bg-teal-700 transition">重新挑戰</button>
                <button onclick="toggleModal(false)"
                    class="w-full py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold text-xl">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        // 題目資料定義
        const questions = [
            { id: 1, origin: "(1)", left: "-3", right: "5", type: "int", ans: ["-", "3", "5"] },
            { id: 2, origin: "(2)", left: "4", right: "-7", type: "int", ans: ["-", "4", "7"] },
            { id: 3, origin: "(3)", left: "-2", right: "-3", type: "int", ans: ["+", "2", "3"] },
            {
                id: 4, origin: "(7)",
                left: { n: "-2", d: "5" },
                right: { n: "4", d: "15" },
                type: "frac",
                ans_sign: "-",
                ans_final: ["3", "2"]
            },
            {
                id: 5, origin: "(8)",
                left: { n: "-3", d: "8" },
                right: { n: "-9", d: "4" },
                type: "frac",
                ans_sign: "+",
                ans_final: ["1", "6"]
            },
            {
                id: 6, origin: "(9)",
                left: { n: "1", d: "2" },
                right: { w: "1", n: "1", d: "3" },
                type: "mixed",
                ans_sign: "+",
                ans_final: ["3", "8"]
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let timeLeft = 420;
        let timerInterval;
        let gameState = {};

        function init() {
            const tabs = document.getElementById('nav-tabs');
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.id = `tab-${i}`;
                btn.className = `px-4 py-2 rounded-xl font-bold whitespace-nowrap transition-all ${i === 0 ? 'bg-teal-600 text-white' : 'bg-white text-slate-500 border border-slate-200'}`;
                btn.textContent = `題目 ${i + 1}`;
                btn.onclick = () => switchTab(i);
                tabs.appendChild(btn);

                gameState[i] = { step: 0, done: false, userInputs: {} };
            });
            render();
            startTimer();
        }

        function switchTab(i) {
            currentIdx = i;
            questions.forEach((_, idx) => {
                document.getElementById(`tab-${idx}`).className = idx === i
                    ? "px-4 py-2 rounded-xl bg-teal-600 text-white font-bold whitespace-nowrap shadow-sm"
                    : "px-4 py-2 rounded-xl bg-white text-slate-500 font-bold whitespace-nowrap border border-slate-200";
            });
            render();
        }

        function render() {
            const q = questions[currentIdx];
            const state = gameState[currentIdx];
            document.getElementById('q-title').textContent = `題目 ${currentIdx + 1} ${q.origin}`;

            // 渲染左側題目區
            const display = document.getElementById('q-display');
            display.innerHTML = renderQuestionMath(q);

            // 渲染步驟區
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            const steps = getStepsForQuestion(q);
            steps.forEach((step, sIdx) => {
                if (sIdx > state.step) return;
                const isDone = sIdx < state.step || (state.done && sIdx === steps.length - 1);

                const div = document.createElement('div');
                div.className = `bg-white rounded-3xl p-6 shadow-sm border-2 ${isDone ? 'border-teal-100 bg-teal-50/30' : 'border-teal-400'} step-enter`;

                div.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-bold text-teal-600 uppercase tracking-widest">Step ${sIdx + 1} ${isDone ? '✔' : ''}</span>
                    </div>
                    <p class="text-xl font-bold mb-4">${step.desc}</p>
                    <div class="flex justify-center mb-6">${renderStepContent(step, sIdx, isDone)}</div>
                    ${!isDone ? renderOptions(step, sIdx) : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderQuestionMath(q) {
            const renderPart = (p) => {
                if (typeof p === 'string') return `(${p})`;
                if (p.w) return `<div class="mixed"><span>${p.w}</span><div class="fraction"><span>${p.n}</span><span>${p.d}</span></div></div>`;
                if (p.n) {
                    const sign = p.n.startsWith('-') ? '－' : '';
                    const num = p.n.replace('-', '');
                    return `<div class="math">${sign}<div class="fraction"><span>${num}</span><span>${p.d}</span></div></div>`;
                }
            };
            return `<div class="math text-4xl">${renderPart(q.left)} <span class="mx-4 text-slate-300">：</span> ${renderPart(q.right)}</div>`;
        }

        function getStepsForQuestion(q) {
            if (q.type === 'int') {
                return [
                    {
                        desc: "第一步：判斷正負號（負負得正，一正一負為負）",
                        slots: 1,
                        ans: [q.ans[0]],
                        options: ["+", "-", "×"],
                        layout: (slots) => `<div class="math">符號是：${slots[0]}</div>`
                    },
                    {
                        desc: "第二步：寫成比值（分數形式）",
                        slots: 2,
                        ans: [q.ans[1], q.ans[2]],
                        options: [q.ans[1], q.ans[2], "1", "0"],
                        layout: (slots) => `<div class="math">比值 ＝ ${q.ans[0] === '-' ? '-' : ''}<div class="fraction">${slots[0]}${slots[1]}</div></div>`
                    }
                ];
            } else {
                // 分數題型步驟
                const steps = [];
                if (q.type === 'mixed') {
                    steps.push({
                        desc: "第一步：將帶分數化為假分數",
                        slots: 2,
                        ans: ["4", "3"],
                        options: ["4", "3", "2", "5"],
                        layout: (slots) => `<div class="math">1<div class="fraction"><span>1</span><span>3</span></div> ＝ <div class="fraction">${slots[0]}${slots[1]}</div></div>`
                    });
                }
                steps.push({
                    desc: "判斷最終比值的正負號",
                    slots: 1,
                    ans: [q.ans_sign],
                    options: ["+", "-"],
                    layout: (slots) => `<div class="math">最終符號是：${slots[0]}</div>`
                });
                steps.push({
                    desc: "計算比值（前項 乘後項的倒數）",
                    slots: 2,
                    ans: q.ans_final,
                    options: [...q.ans_final, "4", "5", "1", "9"],
                    layout: (slots) => `<div class="math">比值 ＝ ${q.ans_sign === '-' ? '-' : ''}<div class="fraction">${slots[0]}${slots[1]}</div></div>`
                });
                return steps;
            }
        }

        function renderStepContent(step, sIdx, isDone) {
            const slotsHtml = [];
            for (let i = 0; i < step.slots; i++) {
                const val = gameState[currentIdx].userInputs[`${sIdx}-${i}`] || '';
                slotsHtml.push(`<span class="slot ${val ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearSlot(${sIdx}, ${i})">${val}</span>`);
            }
            return step.layout(slotsHtml);
        }

        function renderOptions(step, sIdx) {
            return `
                <div class="grid grid-cols-4 gap-3 mb-4">
                    ${step.options.map(opt => `
                        <button onclick="fill('${opt}', ${sIdx})" id="btn-${sIdx}-${opt}"
                                class="option-btn py-3 rounded-2xl bg-teal-50 text-teal-700 font-black text-2xl border-2 border-teal-100 hover:bg-teal-100 disabled:opacity-30">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <button onclick="check(${sIdx})" class="w-full py-4 bg-teal-600 text-white rounded-2xl font-black text-xl shadow-lg shadow-teal-100">檢查答案</button>
            `;
        }

        window.fill = (val, sIdx) => {
            const state = gameState[currentIdx];
            const step = getStepsForQuestion(questions[currentIdx])[sIdx];
            for (let i = 0; i < step.slots; i++) {
                if (!state.userInputs[`${sIdx}-${i}`]) {
                    state.userInputs[`${sIdx}-${i}`] = val;
                    document.getElementById(`btn-${sIdx}-${val}`).disabled = true;
                    render();
                    return;
                }
            }
        };

        window.clearSlot = (sIdx, i) => {
            const state = gameState[currentIdx];
            const val = state.userInputs[`${sIdx}-${i}`];
            if (val) {
                delete state.userInputs[`${sIdx}-${i}`];
                render();
            }
        };

        window.check = (sIdx) => {
            const state = gameState[currentIdx];
            const step = getStepsForQuestion(questions[currentIdx])[sIdx];
            const userAns = [];
            for (let i = 0; i < step.slots; i++) {
                userAns.push(state.userInputs[`${sIdx}-${i}`]);
            }

            if (userAns.includes(undefined)) return showToast("還沒填完喔！");

            const isCorrect = userAns.every((v, i) => v === step.ans[i]);
            if (isCorrect) {
                score += 1;
                document.getElementById('score').textContent = score;
                if (sIdx < getStepsForQuestion(questions[currentIdx]).length - 1) {
                    state.step++;
                } else {
                    state.done = true;
                }
                render();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                if (state.done) checkAll();
            } else {
                showToast("再試一次看看！注意正負號與分子分母的位置。");
            }
        };

        function checkAll() {
            if (Object.values(gameState).every(g => g.done)) toggleModal(true);
            else showToast("太棒了！這題完成了，請換下一題。");
        }

        function showToast(m) {
            const t = document.createElement('div');
            t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-[200] font-bold";
            t.textContent = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        window.toggleModal = (s) => document.getElementById('finish-modal').classList.toggle('hidden', !s);
        window.resetApp = () => location.reload();

        init();
    </script>
</body>

</html>
