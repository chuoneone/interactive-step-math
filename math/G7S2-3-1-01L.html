<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 比值點擊版</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border: 3px dashed #94a3b8;
            border-radius: 12px;
            margin: 0 4px;
            background-color: #fff;
            transition: all 0.3s ease;
            vertical-align: middle;
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
        }

        .slot.filled {
            border-style: solid;
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #166534;
        }

        .option-btn {
            transition: transform 0.1s active;
            touch-action: manipulation;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .step-container {
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .step-active {
            opacity: 1;
            transform: translateY(0);
        }

        .check-btn {
            box-shadow: 0 4px 0 #15803d;
        }

        .check-btn:active {
            box-shadow: none;
            transform: translateY(4px);
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .animate-tada {
            animation: tada 0.8s ease-in-out;
        }

        /* 導覽列捲動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-white shadow-md sticky top-0 z-50 p-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 flex-1 overflow-hidden">
                <span class="text-blue-600 font-bold whitespace-nowrap border-r pr-4 hidden sm:block">一、比值（幾倍）</span>
                <div id="nav-questions" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    <!-- 題目切換按鈕 -->
                </div>
            </div>
            <div class="flex items-center gap-4 text-lg font-bold">
                <div
                    class="flex items-center text-orange-500 bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
                    ⏱️ <span id="timer">07:00</span>
                </div>
                <div
                    class="flex items-center text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-200">
                    ⭐ 分數: <span id="total-score">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col md:flex-row w-full max-w-7xl mx-auto p-4 gap-6">

        <!-- 左側：題目卡 (Sticky) -->
        <div class="w-full md:w-1/3">
            <div class="sticky top-24 bg-white rounded-3xl p-6 shadow-xl border-4 border-blue-100">
                <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-lg font-bold mb-4">題目資訊</div>
                <h2 id="q-title" class="text-2xl font-bold text-slate-800 mb-4 leading-relaxed"></h2>

                <div id="q-content" class="space-y-4 mb-6">
                    <!-- 題目描述 -->
                </div>

                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                    <p class="text-amber-800 font-bold mb-1">💡 小秘訣：</p>
                    <p class="text-amber-700">把<span class="text-red-500 underline font-bold">前面</span>的數字，除以<span
                            class="text-blue-600 underline font-bold">後面</span>的數字。</p>
                </div>
            </div>
        </div>

        <!-- 右側：答題區 -->
        <div id="steps-container" class="w-full md:w-2/3 space-y-6 pb-20">
            <!-- 步驟將由 JS 動態生成 -->
        </div>

    </main>

    <!-- 完成彈窗 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="text-6xl mb-4">🎉</div>
            <h3 class="text-2xl font-bold mb-2">太棒了！全部完成</h3>
            <p id="modal-result" class="text-slate-600 mb-6 font-medium"></p>
            <div class="flex flex-col gap-3">
                <button onclick="resetApp()"
                    class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">再做一次</button>
                <button onclick="closeModal()"
                    class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 錯誤提示小氣泡 -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full opacity-0 transition-opacity pointer-events-none z-[100]">
        再想想看喔！
    </div>

    <script>
        const QUESTIONS_DATA = [
            {
                id: 1,
                title: "紅球與藍球",
                desc: "紅球 <mark class='bg-red-100 text-red-600 px-1'>4</mark> 顆，藍球 <mark class='bg-blue-100 text-blue-600 px-1'>2</mark> 顆。",
                question: "紅球是藍球的幾倍？",
                steps: [
                    { id: 1, text: "列出除法算式", slots: 2, answer: ["4", "2"], options: ["2", "4", "6", "8"] },
                    { id: 2, text: "算算看結果是多少？", slots: 1, answer: ["2"], options: ["1", "2", "3", "4"] }
                ]
            },
            {
                id: 2,
                title: "哥哥與弟弟",
                desc: "哥哥喝 <mark class='bg-red-100 text-red-600 px-1'>10</mark> 杯，弟弟喝 <mark class='bg-blue-100 text-blue-600 px-1'>5</mark> 杯。",
                question: "哥哥喝的是弟弟的幾倍？",
                steps: [
                    { id: 1, text: "列出除法算式", slots: 2, answer: ["10", "5"], options: ["5", "10", "15", "2"] },
                    { id: 2, text: "算算看結果是多少？", slots: 1, answer: ["2"], options: ["2", "5", "10", "1"] }
                ]
            },
            {
                id: 3,
                title: "甲繩與乙繩",
                desc: "甲繩 <mark class='bg-red-100 text-red-600 px-1'>6</mark> 公尺，乙繩 <mark class='bg-blue-100 text-blue-600 px-1'>3</mark> 公尺。",
                question: "甲繩是乙繩的幾倍？",
                steps: [
                    { id: 1, text: "列出除法算式", slots: 2, answer: ["6", "3"], options: ["3", "6", "9", "2"] },
                    { id: 2, text: "算算看結果是多少？", slots: 1, answer: ["2"], options: ["2", "3", "6", "1"] }
                ]
            },
            {
                id: 4,
                title: "餅乾與同學",
                desc: "餅乾 <mark class='bg-red-100 text-red-600 px-1'>8</mark> 片，同學 <mark class='bg-blue-100 text-blue-600 px-1'>4</mark> 人。",
                question: "餅乾是人數的幾倍？",
                steps: [
                    { id: 1, text: "列出除法算式", slots: 2, answer: ["8", "4"], options: ["4", "8", "12", "2"] },
                    { id: 2, text: "算算看結果是多少？", slots: 1, answer: ["2"], options: ["2", "4", "8", "1"] }
                ]
            },
            {
                id: 5,
                title: "鉛筆與橡皮擦",
                desc: "鉛筆 <mark class='bg-red-100 text-red-600 px-1'>9</mark> 枝，橡皮擦 <mark class='bg-blue-100 text-blue-600 px-1'>3</mark> 個。",
                question: "鉛筆是橡皮擦的幾倍？",
                steps: [
                    { id: 1, text: "列出除法算式", slots: 2, answer: ["9", "3"], options: ["3", "6", "9", "12"] },
                    { id: 2, text: "算算看結果是多少？", slots: 1, answer: ["3"], options: ["1", "2", "3", "4"] }
                ]
            }
        ];

        let currentQIndex = 0;
        let scores = Array(QUESTIONS_DATA.length).fill(0);
        let timeRemaining = 420; // 7 minutes
        let timerInterval;
        let isComplete = false;

        // 初始化
        window.onload = () => {
            initNav();
            loadQuestion(0);
            startTimer();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    finishAll();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function initNav() {
            const nav = document.getElementById('nav-questions');
            nav.innerHTML = '';
            QUESTIONS_DATA.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${idx}`;
                btn.className = `px-4 py-2 rounded-xl font-bold whitespace-nowrap transition-all ${idx === 0 ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-500'}`;
                btn.innerText = `題目 ${q.id}`;
                btn.onclick = () => loadQuestion(idx);
                nav.appendChild(btn);
            });
        }

        function loadQuestion(idx) {
            currentQIndex = idx;
            const q = QUESTIONS_DATA[idx];

            // 更新導覽列樣式
            QUESTIONS_DATA.forEach((_, i) => {
                const btn = document.getElementById(`nav-btn-${i}`);
                btn.className = `px-4 py-2 rounded-xl font-bold whitespace-nowrap transition-all ${i === idx ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-500'}`;
            });

            // 更新左側題目
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-content').innerHTML = `
                <p class="text-lg text-slate-600">${q.desc}</p>
                <p class="text-xl font-bold text-slate-800">${q.question}</p>
            `;

            // 初始化步驟區
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            renderStep(0);
            updateTotalScore();
        }

        function renderStep(stepIdx) {
            const q = QUESTIONS_DATA[currentQIndex];
            if (stepIdx >= q.steps.length) return;

            const stepData = q.steps[stepIdx];
            const stepDiv = document.createElement('div');
            stepDiv.id = `step-${stepIdx}`;
            stepDiv.className = `step-container step-active bg-white rounded-3xl p-6 shadow-md border-2 border-slate-100`;

            // 標題與打勾
            const header = document.createElement('div');
            header.className = "flex items-center gap-2 mb-4";
            header.innerHTML = `
                <span class="bg-slate-800 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">${stepIdx + 1}</span>
                <h3 class="text-lg font-bold text-slate-700">${stepData.text}</h3>
                <span id="check-icon-${stepIdx}" class="hidden text-green-500 text-2xl animate-tada">✔</span>
            `;
            stepDiv.appendChild(header);

            // 互動區
            const interaction = document.createElement('div');
            interaction.className = "flex flex-col gap-6";

            // Slot 排列
            const mathRow = document.createElement('div');
            mathRow.className = "math flex-wrap";

            if (stepData.id === 1) {
                // 除法算式模式
                mathRow.innerHTML = `
                    <div class="slot" data-step="${stepIdx}" data-idx="0"></div>
                    <span class="text-slate-400">÷</span>
                    <div class="slot" data-step="${stepIdx}" data-idx="1"></div>
                    <span class="text-slate-400">=</span>
                    <span class="text-slate-300">?</span>
                `;
            } else {
                // 結果模式
                mathRow.innerHTML = `
                    <span class="text-slate-400">... =</span>
                    <div class="slot" data-step="${stepIdx}" data-idx="0"></div>
                    <span class="text-slate-800 font-bold ml-2">倍</span>
                `;
            }
            interaction.appendChild(mathRow);

            // 處理填錯要清除的功能
            mathRow.querySelectorAll('.slot').forEach(slot => {
                slot.style.cursor = 'pointer';
                slot.title = '點擊清除';
                slot.onclick = () => {
                    if (slot.classList.contains('correct')) return; // 正確後不可清除
                    slot.innerText = '';
                    slot.classList.remove('filled');
                };
            });

            // 選項區
            const optionsDiv = document.createElement('div');
            optionsDiv.id = `options-${stepIdx}`;
            optionsDiv.className = "flex flex-wrap gap-3";
            stepData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn px-6 py-3 bg-blue-50 text-blue-700 rounded-2xl font-bold text-xl border-2 border-blue-200 hover:bg-blue-100 active:bg-blue-200";
                btn.innerText = opt;
                btn.onclick = () => fillSlot(stepIdx, opt);
                optionsDiv.appendChild(btn);
            });
            interaction.appendChild(optionsDiv);

            // 檢查按鈕
            const checkBtn = document.createElement('button');
            checkBtn.id = `check-btn-${stepIdx}`;
            checkBtn.className = "check-btn w-full md:w-auto px-10 py-4 bg-green-600 text-white rounded-2xl font-bold text-lg hover:bg-green-700 transition-all";
            checkBtn.innerText = "檢查答案";
            checkBtn.onclick = () => checkStep(stepIdx);
            interaction.appendChild(checkBtn);

            stepDiv.appendChild(interaction);
            document.getElementById('steps-container').appendChild(stepDiv);

            // 平滑捲動
            stepDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fillSlot(stepIdx, val) {
            const slots = document.querySelectorAll(`.slot[data-step="${stepIdx}"]`);
            for (let s of slots) {
                if (!s.innerText) {
                    s.innerText = val;
                    s.classList.add('filled');
                    break;
                }
            }
        }

        function checkStep(stepIdx) {
            const q = QUESTIONS_DATA[currentQIndex];
            const stepData = q.steps[stepIdx];
            const slots = document.querySelectorAll(`.slot[data-step="${stepIdx}"]`);

            // 檢查空格
            let filledVals = [];
            for (let s of slots) {
                if (!s.innerText) {
                    showToast("請填滿所有空格");
                    return;
                }
                filledVals.push(s.innerText);
            }

            // 驗證答案
            const isCorrect = filledVals.every((v, i) => v === stepData.answer[i]);

            if (isCorrect) {
                // 正確處理
                scores[currentQIndex] += 10;
                updateTotalScore();

                // UI 變更
                slots.forEach(s => s.classList.add('correct'));
                document.getElementById(`check-icon-${stepIdx}`).classList.remove('hidden');
                document.getElementById(`options-${stepIdx}`).classList.add('hidden');
                document.getElementById(`check-btn-${stepIdx}`).classList.add('hidden');

                // 下一步
                if (stepIdx + 1 < q.steps.length) {
                    setTimeout(() => renderStep(stepIdx + 1), 600);
                } else {
                    // 該題完成
                    handleQuestionComplete();
                }
            } else {
                // 錯誤處理
                showToast("再想想看喔！");
            }
        }

        function handleQuestionComplete() {
            const nextIdx = currentQIndex + 1;
            if (nextIdx < QUESTIONS_DATA.length) {
                // 提示切換下一題
                const finishBtn = document.createElement('button');
                finishBtn.className = "w-full py-4 bg-orange-500 text-white rounded-2xl font-bold text-lg mt-4 animate-bounce";
                finishBtn.innerText = "完成！點我進入下一題";
                finishBtn.onclick = () => loadQuestion(nextIdx);
                document.getElementById('steps-container').appendChild(finishBtn);
            } else {
                // 全部完成
                finishAll();
            }
        }

        function finishAll() {
            clearInterval(timerInterval);
            isComplete = true;
            const modal = document.getElementById('modal-overlay');
            const resultText = document.getElementById('modal-result');
            const totalScore = scores.reduce((a, b) => a + b, 0);
            const timeStr = document.getElementById('timer').innerText;

            resultText.innerText = `最終分數：${totalScore} 分\n剩餘時間：${timeStr}`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function updateTotalScore() {
            const total = scores.reduce((a, b) => a + b, 0);
            document.getElementById('total-score').innerText = total;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 2000);
        }

        function resetApp() {
            scores = Array(QUESTIONS_DATA.length).fill(0);
            timeRemaining = 420;
            isComplete = false;
            closeModal();
            loadQuestion(0);
            startTimer();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
        }
    </script>
</body>

</html>
