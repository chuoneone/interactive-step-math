<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💻互動式數學-點擊版 | 判別不等式的解</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome  icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 點擊空格的高亮動畫 */
        .pulse-highlight {
            animation: pulseBorder 1.5s infinite;
        }

        @keyframes pulseBorder {

            0%,
            100% {
                border-color: #3b82f6;
                background-color: #eff6ff;
                box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.4);
            }

            50% {
                border-color: #60a5fa;
                background-color: #dbeafe;
                box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2);
            }
        }

        /* 答錯時卡片震動效果 */
        .shake {
            animation: shakeAnim 0.5s ease-in-out;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* 答對時的煙火慶祝效果 */
        .pop-success {
            animation: popSuccessAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popSuccessAnim {
            0% {
                transform: scale(0.9);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100">

    <!-- 頂部導覽列 (橫向滑動) -->
    <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <!-- 左側單元名稱 -->
            <div class="flex items-center gap-2">
                <span
                    class="bg-indigo-600 text-white font-black text-xs px-2.5 py-1 rounded-full uppercase tracking-wider">單元三</span>
                <h1 class="text-lg font-bold text-slate-800">判別不等式的解</h1>
            </div>

            <!-- 中間題目選擇 (手機可滑動) -->
            <div class="flex items-center gap-2 overflow-x-auto max-w-full pb-1 sm:pb-0 scrollbar-none"
                id="question-tabs">
                <!-- JS 動態生成 -->
            </div>

            <!-- 右側分數與計時器 -->
            <div class="flex items-center gap-4 text-sm font-bold shrink-0">
                <div
                    class="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200">
                    <span class="text-base">⭐</span>
                    <span>分數: <span id="total-score" class="text-base font-black">0</span> / 100</span>
                </div>
                <div
                    class="flex items-center gap-1.5 bg-rose-50 text-rose-700 px-3 py-1.5 rounded-lg border border-rose-200">
                    <span class="text-base">⏱️</span>
                    <span id="timer-display" class="font-mono text-base">07:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主內容區：橫式(兩欄) vs 直式(上下) -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6 items-start">

        <!-- 左側：題幹與原始選項區 (隨捲動固定) -->
        <section
            class="w-full md:w-5/12 md:sticky md:top-24 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <span class="text-xs font-bold text-indigo-500 uppercase tracking-wide">目前挑戰題目</span>
                <span id="question-index-badge"

            </div>

            <!-- 題幹內容 -->
            <div class="space-y-3">
                <h2 id="question-text" class="text-2xl font-black text-slate-800 leading-snug">

                </h2>

                    請仔細觀察下方的選項數值，並點擊右側的步驟進行代入與判斷。
                </p>
            </div>

            <!-- 原始選項卡片 (僅供學生靜態參考對照) -->
            <div class="grid grid-cols-2 gap-3 pt-2" id="static-options">

            </div>

            <div class="bg-indigo-50/50 rounded-xl p-4 border border-indigo-100/60">

                </h4>
                <p class="text-xs text-indigo-700 leading-relaxed">
                    💡 <strong>什麼是不等式的解？</strong> 把一個數值代入不等式中的未知數 $x$。如果代入後，這個不等式是「正確（合理）」的，那這個數值就是它的解喔！
                </p>
            </div>
        </section>

        <!-- 右側：拆解步驟式填答區 -->
        <section class="w-full md:w-7/12 space-y-5" id="steps-container">

    </main>

    <!-- 提示浮動視窗 (Toast) -->
    <div id="toast"

        <div class="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300"

            <div
                class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl animate-bounce">

            </div>
            <h3 class="text-2xl font-black text-slate-800 mb-2">🎉 太棒了！全部完成</h3>
            <p class="text-slate-500 text-sm mb-6">你成功的完成了所有的不等式挑戰，真的非常優秀！</p>

            <!-- 成績卡片 -->
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 mb-6 grid grid-cols-2 gap-4">
                <div class="text-center">
                    <span class="text-xs text-slate-400 font-bold block mb-1">最終得分</span>
                    <span class="text-3xl font-black text-indigo-600" id="final-score">0分</span>
                </div>
                <div class="text-center">
                    <span class="text-xs text-slate-400 font-bold block mb-1">使用時間</span>
                    <span class="text-3xl font-black text-indigo-600" id="final-time">00:00</span>

                    class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-black py-3.5 rounded-xl shadow-md transition-all">
                    <i class="fa-solid fa-arrow-rotate-left mr-2"></i> 再做一次

                <button id="btn-close-modal"
                    class="w-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-all">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 題型判定標記 ---
        // 本單元題型：判別一元一次不等式的解。

        // --- 題目資料庫 ---
        const QUESTIONS_DATA = [
            {
                id: 0,
                text: "下列哪個數值是不等式 <mark class='bg-yellow-200 px-1 rounded font-black text-slate-900'>x &gt; 5</mark> 的解？",
                options: [
                    { tag: "A", val: "-3" },
                    { tag: "B", val: "2" },
                    { tag: "C", val: "5" },
                    { tag: "D", val: "8" }
                ],
                steps: [
                    {
                        title: "步驟 1：代入數值判斷",
                        instruction: "代入各選項數值，點選下方按鈕判斷是否大於 5：",
                        // 模板：{{slot}} 代表一個點擊格。一個步驟可以有多個格。
                        lines: [
                            "把 x = -3 代入， 得到 -3 &gt; 5 成立嗎？ {{slot}}",
                            "把 x = 2 代入， 得到 2 &gt; 5 成立嗎？ {{slot}}",
                            "把 x = 5 代入， 得到 5 &gt; 5 成立嗎？ {{slot}}",
                            "把 x = 8 代入， 得到 8 &gt; 5 成立嗎？ {{slot}}"
                        ],
                        // 相對應的正確答案
                        answers: ["✕", "✕", "✕", "○"],
                        // 該步驟專屬選項按鈕 (打亂用)
                        choices: ["○", "✕"]
                    },
                    {
                        title: "步驟 2：選出正確的解",
                        instruction: "根據上一步的判斷，哪一個數值是該不等式的解？",
                        lines: [
                            "不等式 x &gt; 5 的解是 x = {{slot}}"
                        ],
                        answers: ["8"],
                        choices: ["-3", "2", "5", "8"]
                    }
                ]
            },
            {
                id: 1,
                text: "下列哪個數值是不等式 <mark class='bg-yellow-200 px-1 rounded font-black text-slate-900'>x &ge; 3</mark> 的解？",
                options: [
                    { tag: "A", val: "-1" },
                    { tag: "B", val: "2" },
                    { tag: "C", val: "2.9" },
                    { tag: "D", val: "3" }
                ],
                steps: [
                    {
                        title: "步驟 1：代入數值判斷",
                        instruction: "代入各選項數值，點選下方按鈕判斷是否大於或等於 3：",
                        lines: [
                            "把 x = -1 代入， 得到 -1 &ge; 3 成立嗎？ {{slot}}",
                            "把 x = 2 代入， 得到 2 &ge; 3 成立嗎？ {{slot}}",
                            "把 x = 2.9 代入， 得到 2.9 &ge; 3 成立嗎？ {{slot}}",
                            "把 x = 3 代入， 得到 3 &ge; 3 成立嗎？ {{slot}}"
                        ],
                        answers: ["✕", "✕", "✕", "○"],
                        choices: ["○", "✕"]
                    },
                    {
                        title: "步驟 2：選出正確的解",
                        instruction: "根據上一步的判斷，哪一個數值是該不等式的解？",
                        lines: [
                            "不等式 x &ge; 3 的解是 x = {{slot}}"
                        ],
                        answers: ["3"],
                        choices: ["-1", "2", "2.9", "3"]
                    }
                ]
            },
            {
                id: 2,
                text: "下列哪個數值是不等式 <mark class='bg-yellow-200 px-1 rounded font-black text-slate-900'>x &le; -2</mark> 的解？",
                options: [
                    { tag: "A", val: "-1.9" },
                    { tag: "B", val: "-2.1" },
                    { tag: "C", val: "6" },
                    { tag: "D", val: "2" }
                ],
                steps: [
                    {
                        title: "步驟 1：代入與負數判斷",
                        instruction: "在負數中，數字部分越大反而越小哦！(例如 -2.1 比 -2 小)。代入後判斷是否小於或等於 -2：",
                        lines: [
                            "把 x = -1.9 代入， 得到 -1.9 &le; -2 成立嗎？ {{slot}}",
                            "把 x = -2.1 代入， 得到 -2.1 &le; -2 成立嗎？ {{slot}}",
                            "把 x = 6 代入， 得到 6 &le; -2 成立嗎？ {{slot}}",
                            "把 x = 2 代入， 得到 2 &le; -2 成立嗎？ {{slot}}"
                        ],
                        answers: ["✕", "○", "✕", "✕"],
                        choices: ["○", "✕"]
                    },
                    {
                        title: "步驟 2：選出正確的解",
                        instruction: "根據上一步的判斷，哪一個數值是該不等式的解？",
                        lines: [
                            "不等式 x &le; -2 的解是 x = {{slot}}"
                        ],
                        answers: ["-2.1"],
                        choices: ["-1.9", "-2.1", "6", "2"]
                    }
                ]
            },
            {
                id: 3,
                text: "下列哪個數值是不等式 <mark class='bg-yellow-200 px-1 rounded font-black text-slate-900'>2x - 3 &gt; -5</mark> 的解？",
                options: [
                    { tag: "A", val: "-2" },
                    { tag: "B", val: "-1.3" },
                    { tag: "C", val: "-0.8" },
                    { tag: "D", val: "-3" }
                ],
                steps: [
                    {
                        title: "步驟 1：計算代入後的值",
                        instruction: "將各個選項分別代入算式中的 $2x - 3$，算出答案是多少：",
                        lines: [
                            "當 x = -2 時， 2 &times; (-2) - 3 = {{slot}}",
                            "當 x = -1.3 時， 2 &times; (-1.3) - 3 = {{slot}}",
                            "當 x = -0.8 時， 2 &times; (-0.8) - 3 = {{slot}}",
                            "當 x = -3 時， 2 &times; (-3) - 3 = {{slot}}"
                        ],
                        answers: ["-7", "-5.6", "-4.6", "-9"],
                        choices: ["-7", "-5.6", "-4.6", "-9"]
                    },
                    {
                        title: "步驟 2：判斷是否大於 -5",
                        instruction: "將上一步算出來的值，判斷是否大於 -5：",
                        lines: [
                            "得到 -7 &gt; -5 成立嗎？ {{slot}}",
                            "得到 -5.6 &gt; -5 成立嗎？ {{slot}}",
                            "得到 -4.6 &gt; -5 成立嗎？ {{slot}}",
                            "得到 -9 &gt; -5 成立嗎？ {{slot}}"
                        ],
                        answers: ["✕", "✕", "○", "✕"],
                        choices: ["○", "✕"]
                    },
                    {
                        title: "步驟 3：選出正確的解",
                        instruction: "根據上一步的結果，哪一個數值代入後使不等式成立？",
                        lines: [
                            "不等式 2x - 3 &gt; -5 的解是 x = {{slot}}"
                        ],
                        answers: ["-0.8"],
                        choices: ["-2", "-1.3", "-0.8", "-3"]
                    }
                ]
            }
        ];

        // --- 全域狀態管理 ---
        const state = {
            currentQuestionIdx: 0,
            score: 0,
            timerSeconds: 420, // 7 分鐘
            timerInterval: null,
            isTimerActive: true,

            // 用來記錄學生的答題進度
            progress: []
        };

        // --- 初始化進度資料結構 ---
        function initProgress() {
            state.progress = QUESTIONS_DATA.map(q => {
                return {
                    questionId: q.id,
                    completed: false,
                    unlockedStepIdx: 0, // 目前解鎖到哪一個步驟 (0-based)
                    steps: q.steps.map(s => {
                        return {
                            userAnswers: Array(s.answers.length).fill(""), // 儲存使用者填寫的值
                            completed: false,                             // 該步驟是否已成功答對
                            hasFailed: false,                             // 該步驟是否曾答錯過 (錯過就不給分)
                            shuffledChoices: shuffleArray(s.choices)      // 打亂後的按鈕順序
                        };
                    })
                };
            });
            state.score = 0;
        }

        // 陣列隨機打亂函數
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- 音效產生器 (Web Audio API) ---
        function playAudioTone(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                if (type === 'success') {
                    // 答對時的甜美和弦
                    const freqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.08);

                        gain.gain.setValueAtTime(0, now + i * 0.08);
                        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.5);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.5);
                    });
                } else if (type === 'fail') {
                    // 答錯時的溫和雙音提示
                    const freqs = [180, 140];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(f, now + i * 0.15);

                        gain.gain.setValueAtTime(0, now + i * 0.15);
                        gain.gain.linearRampToValueAtTime(0.12, now + i * 0.15 + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.15 + 0.3);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.15);
                        osc.stop(now + i * 0.15 + 0.3);
                    });
                } else if (type === 'click') {
                    // 點選按鈕時的輕快小波
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, now);

                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                console.warn("Audio context not supported/allowed in this iframe browser interaction.");
            }
        }

        // --- 訊息吐司提示 (Toast) ---
        function showToast(message, type = "info") {
            const toast = document.getElementById("toast");
            toast.innerHTML = message;

            // 根據類型變更背景色
            toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 pointer-events-none text-white text-sm font-bold px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 ";
            if (type === "warning") {
                toast.className += "bg-amber-600 border border-amber-500";
            } else if (type === "success") {
                toast.className += "bg-emerald-600 border border-emerald-500 animate-bounce";
            } else {
                toast.className += "bg-slate-800 border border-slate-700";
            }

            // 浮現
            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");

            // 自動隱藏
            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }

        // --- 動態渲染導覽列 ---
        function renderTabs() {
            const tabContainer = document.getElementById("question-tabs");
            tabContainer.innerHTML = "";

            QUESTIONS_DATA.forEach((q, idx) => {
                const isActive = idx === state.currentQuestionIdx;
                const qProgress = state.progress[idx];

                let tabClass = "px-3.5 py-1.5 rounded-xl font-bold text-sm flex items-center gap-1.5 transition-all whitespace-nowrap shrink-0 ";
                let statusBadge = "";

                if (isActive) {
                    tabClass += "bg-indigo-600 text-white shadow-md ring-2 ring-indigo-300 ring-offset-1";
                } else if (qProgress.completed) {
                    tabClass += "bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100";
                    statusBadge = "<i class='fa-solid fa-circle-check text-emerald-500'></i>";
                } else {
                    tabClass += "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200";
                }

                const btn = document.createElement("button");
                btn.className = tabClass;
                btn.innerHTML = `<span>問題 ${idx + 1}</span> ${statusBadge}`;
                btn.onclick = () => {
                    playAudioTone('click');
                    state.currentQuestionIdx = idx;
                    renderAll();
                };
                tabContainer.appendChild(btn);
            });
        }

        // --- 找尋特定步驟的第一個未填寫空格 ---
        function getFirstEmptySlotIdx(qIdx, stepIdx) {
            const stepProg = state.progress[qIdx].steps[stepIdx];
            const answersLength = QUESTIONS_DATA[qIdx].steps[stepIdx].answers.length;
            for (let i = 0; i < answersLength; i++) {
                if (stepProg.userAnswers[i] === undefined || stepProg.userAnswers[i] === "") {
                    return i;
                }
            }
            return -1; // 全部都填滿了
        }

        // --- 點擊選項填入空格 ---
        function handleOptionSelect(val) {
            const qIdx = state.currentQuestionIdx;
            const qProgress = state.progress[qIdx];
            const activeStepIdx = qProgress.unlockedStepIdx;
            const stepProg = qProgress.steps[activeStepIdx];

            if (stepProg.completed) return; // 如果這一步驟已經答對鎖定，無法再填寫

            // 找出第一個空著的 slot
            const firstEmptyIdx = getFirstEmptySlotIdx(qIdx, activeStepIdx);
            if (firstEmptyIdx !== -1) {
                stepProg.userAnswers[firstEmptyIdx] = val;
                playAudioTone('click');
                renderAll();
            } else {
                showToast("⚠️ 本步驟的格子都填滿囉！如果不滿意，可以點擊格內文字清除重新填寫。", "warning");
            }
        }

        // --- 點選已填滿的 slot 清除內容 ---
        function handleSlotClear(stepIdx, slotIdx) {
            const qIdx = state.currentQuestionIdx;
            const qProgress = state.progress[qIdx];
            const stepProg = qProgress.steps[stepIdx];

            // 只有「當前正在作答的步驟」且「尚未答對鎖定」時，才可以點擊清空
            if (stepIdx === qProgress.unlockedStepIdx && !stepProg.completed) {
                stepProg.userAnswers[slotIdx] = "";

                // 清除任何可能殘留的錯誤標記
                if (stepProg.incorrectIndices) {
                    stepProg.incorrectIndices = stepProg.incorrectIndices.filter(i => i !== slotIdx);
                }

                playAudioTone('click');
                renderAll();
            }
        }

        // --- 檢查步驟答案 ---
        function handleCheckAnswer(stepIdx) {
            const qIdx = state.currentQuestionIdx;
            const q = QUESTIONS_DATA[qIdx];
            const step = q.steps[stepIdx];
            const qProgress = state.progress[qIdx];
            const stepProg = qProgress.steps[stepIdx];

            // 1. 先確認是否所有格子都填滿了
            const firstEmpty = getFirstEmptySlotIdx(qIdx, stepIdx);
            if (firstEmpty !== -1) {
                showToast("⚠️ 請填滿所有空格再檢查哦！", "warning");
                return;
            }

            // 2. 比對答案
            let isCorrect = true;
            const incorrects = [];

            for (let i = 0; i < step.answers.length; i++) {
                if (stepProg.userAnswers[i] !== step.answers[i]) {
                    isCorrect = false;
                    incorrects.push(i);
                }
            }

            const stepCard = document.getElementById(`step-card-${stepIdx}`);

            if (isCorrect) {
                // --- 答對 ---
                stepProg.completed = true;
                stepProg.incorrectIndices = []; // 清空錯誤紀錄
                playAudioTone('success');

                // 評估給分 (如果沒有犯錯紀錄則給分，答錯一次不能給分)
                let earnedPoints = 0;
                if (!stepProg.hasFailed) {
                    earnedPoints = 10;
                    state.score += earnedPoints;
                    document.getElementById("total-score").innerText = state.score;
                }

                // 建立漂亮的成功動畫與提示
                if (stepCard) {
                    stepCard.classList.add("pop-success", "border-emerald-200", "bg-emerald-50/20");
                }

                // 更新當前解鎖的步驟
                if (stepIdx + 1 < q.steps.length) {
                    qProgress.unlockedStepIdx = stepIdx + 1;
                    showToast(earnedPoints > 0 ? `🎉 太棒了！答對囉！ (+10 分)` : `🎉 答對囉！訂正成功！`, "success");

                    setTimeout(() => {
                        renderAll();
                        // 平滑滾動到下一步
                        const nextStepEl = document.getElementById(`step-card-${stepIdx + 1}`);
                        if (nextStepEl) {
                            nextStepEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 800);
                } else {
                    // 沒有下一步了，代表本題目完全通過！
                    qProgress.completed = true;

                    // 檢查是否全部題目都過關了
                    const allDone = state.progress.every(p => p.completed);
                    if (allDone) {
                        // 所有題目都答對，給予滿分加分(如果是完全首創高分的話)，並補足差額到100分
                        if (state.score === 90) {
                            state.score = 100;
                        }
                        document.getElementById("total-score").innerText = state.score;
                        stopTimer();
                        setTimeout(() => {
                            showFinalModal();
                        }, 1000);
                    } else {
                        showToast(`🎉 本題所有步驟皆已完成！點擊上方切換下一題！`, "success");
                        renderAll();
                    }
                }
            } else {
                // --- 答錯 ---
                stepProg.hasFailed = true; // 犯錯標記：該步驟之後無法再拿分了
                stepProg.incorrectIndices = incorrects; // 記錄錯在哪裡，用於畫面紅框高亮提示
                playAudioTone('fail');

                // 震動動畫
                if (stepCard) {
                    stepCard.classList.add("shake");
                    setTimeout(() => stepCard.classList.remove("shake"), 500);
                }

                showToast("❌ 再想想看喔！紅框處是不太正確的喔，點擊格子可以清空重新再試一次！", "warning");
                renderAll();
            }
        }

        // --- 倒數計時器設定 ---
        function startTimer() {
            state.isTimerActive = true;
            state.timerInterval = setInterval(() => {
                if (state.timerSeconds <= 0) {
                    stopTimer();
                    showFinalModal();
                    return;
                }
                state.timerSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            state.isTimerActive = false;
            clearInterval(state.timerInterval);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(state.timerSeconds / 60);
            const seconds = state.timerSeconds % 60;
            const formatted = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById("timer-display").innerText = formatted;
        }

        // --- 顯示結算視窗 ---
        function showFinalModal() {
            const modal = document.getElementById("finish-modal");
            const card = document.getElementById("finish-modal-card");

            // 設定數據
            document.getElementById("final-score").innerText = `${state.score}分`;

            const timeUsed = 420 - state.timerSeconds;
            const m = Math.floor(timeUsed / 60);
            const s = timeUsed % 60;
            document.getElementById("final-time").innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                card.classList.remove("scale-95");
            }, 50);
        }

        // --- 關閉結算視窗 ---
        function closeFinalModal() {
            const modal = document.getElementById("finish-modal");
            const card = document.getElementById("finish-modal-card");

            modal.classList.add("opacity-0");
            card.classList.add("scale-95");
            setTimeout(() => {
                modal.classList.add("hidden");
            }, 3000);
        }

        // --- 主繪製函數 ---
        function renderAll() {
            // 1. 更新頁籤導航
            renderTabs();

            // 2. 獲取當前題目資料
            const qIdx = state.currentQuestionIdx;
            const q = QUESTIONS_DATA[qIdx];
            const qProgress = state.progress[qIdx];

            // 3. 更新左側題幹
            document.getElementById("question-index-badge").innerText = `第 ${qIdx + 1} / ${QUESTIONS_DATA.length} 題`;
            document.getElementById("question-text").innerHTML = q.text;

            // 4. 更新左側靜態選項卡片
            const staticOptionsContainer = document.getElementById("static-options");
            staticOptionsContainer.innerHTML = "";
            q.options.forEach(opt => {
                const div = document.createElement("div");
                div.className = "flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 hover:bg-white transition-colors";
                div.innerHTML = `
          <span class="w-7 h-7 bg-slate-200 text-slate-700 rounded-full font-black flex items-center justify-center text-sm">${opt.tag}</span>
          <span class="text-lg font-extrabold text-slate-800">${opt.val}</span>
        `;
                staticOptionsContainer.appendChild(div);
            });

            // 5. 動態產生右側步驟
            const stepsContainer = document.getElementById("steps-container");
            stepsContainer.innerHTML = "";

            // 限制只渲染已解鎖的步驟
            const unlockedMax = qProgress.unlockedStepIdx;

            for (let sIdx = 0; sIdx <= unlockedMax; sIdx++) {
                const step = q.steps[sIdx];
                const stepProg = qProgress.steps[sIdx];

                // 建立卡片容器
                const card = document.createElement("div");
                card.id = `step-card-${sIdx}`;

                let cardBaseClass = "bg-white border p-6 rounded-2xl transition-all duration-300 space-y-4 shadow-sm ";
                if (stepProg.completed) {
                    cardBaseClass += "border-emerald-200 bg-emerald-50/10";
                } else {
                    cardBaseClass += "border-slate-200";
                }
                card.className = cardBaseClass;

                // 標題列
                const headerDiv = document.createElement("div");
                headerDiv.className = "flex items-center justify-between border-b border-slate-100 pb-2.5";

                const titleSpan = document.createElement("span");
                titleSpan.className = `font-black text-base flex items-center gap-2 ${stepProg.completed ? 'text-emerald-700' : 'text-slate-800'}`;
                titleSpan.innerHTML = `
          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${stepProg.completed ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-700'}">步驟 ${sIdx + 1}</span>
          ${step.title}
        `;

                const statusSpan = document.createElement("span");
                if (stepProg.completed) {
                    statusSpan.className = "text-emerald-600 font-bold text-sm flex items-center gap-1";
                    statusSpan.innerHTML = "<i class='fa-solid fa-circle-check'></i> 步驟完成";
                } else {
                    statusSpan.className = "text-slate-400 font-bold text-sm flex items-center gap-1.5";
                    statusSpan.innerHTML = "<span class='inline-block w-2 h-2 bg-indigo-500 rounded-full animate-ping'></span> 進行中";
                }

                headerDiv.appendChild(titleSpan);
                headerDiv.appendChild(statusSpan);
                card.appendChild(headerDiv);

                // 短指令描述
                const descP = document.createElement("p");
                descP.className = "text-sm text-slate-600 font-medium";
                descP.innerText = step.instruction;
                card.appendChild(descP);

                // 算式填空區
                const formulasDiv = document.createElement("div");
                formulasDiv.className = "space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100/80";

                let slotIndexCounter = 0;

                // 找出第一個空著的 slot 索引
                const firstEmptyIdx = getFirstEmptySlotIdx(qIdx, sIdx);

                // 解析帶有 {{slot}} 的多行算式文本
                step.lines.forEach((line) => {
                    const lineDiv = document.createElement("div");
                    lineDiv.className = "flex flex-wrap items-center gap-1 text-slate-700 font-bold text-base md:text-lg min-h-[44px]";

                    // 使用正則拆解 {{slot}}
                    const parts = line.split(/(\{\{slot\}\})/);

                    parts.forEach(part => {
                        if (part === "{{slot}}") {
                            const currentSlotIdx = slotIndexCounter++;
                            const slotVal = stepProg.userAnswers[currentSlotIdx];

                            const isFilled = slotVal !== undefined && slotVal !== "";
                            const isActiveFocus = !stepProg.completed && (currentSlotIdx === firstEmptyIdx);
                            const isWrong = stepProg.incorrectIndices && stepProg.incorrectIndices.includes(currentSlotIdx);

                            const slotBtn = document.createElement("button");

                            // 動態決定空格樣式 (高亮與出錯特教提示)
                            let slotClass = "inline-flex items-center justify-center min-w-[64px] h-[40px] px-2 mx-1 rounded-xl text-lg font-black border-2 transition-all ";

                            if (stepProg.completed) {
                                slotClass += "border-emerald-500 bg-emerald-50 text-emerald-700 cursor-not-allowed";
                            } else if (isWrong) {
                                slotClass += "border-rose-500 bg-rose-50 text-rose-700 animate-pulse";
                            } else if (isFilled) {
                                slotClass += "border-indigo-500 bg-indigo-50 text-indigo-700 hover:bg-indigo-100/60";
                            } else if (isActiveFocus) {
                                slotClass += "pulse-highlight border-blue-500 border-2 scale-105";
                            } else {
                                slotClass += "border-slate-300 bg-white text-slate-300 hover:border-slate-400";
                            }

                            slotBtn.className = slotClass;
                            slotBtn.innerHTML = isFilled ? slotVal : `<span class="text-xs text-slate-400 font-bold">點選</span>`;
                            slotBtn.title = isFilled ? "點擊以清除" : "等待填入數值";

                            // 點選清空機制
                            slotBtn.onclick = () => handleSlotClear(sIdx, currentSlotIdx);

                            lineDiv.appendChild(slotBtn);
                        } else {
                            const textSpan = document.createElement("span");
                            textSpan.innerHTML = part;
                            lineDiv.appendChild(textSpan);
                        }
                    });

                    formulasDiv.appendChild(lineDiv);
                });

                card.appendChild(formulasDiv);

                // 選項按鈕區 (若已完成則隱藏該步驟的點擊按鈕，保持畫面簡潔)
                if (!stepProg.completed) {
                    const buttonAreaDiv = document.createElement("div");
                    buttonAreaDiv.className = "space-y-2";

                    const labelSpan = document.createElement("span");
                    labelSpan.className = "text-xs font-bold text-slate-400 block";
                    labelSpan.innerText = "請點選下方選項填入藍色閃爍框內：";
                    buttonAreaDiv.appendChild(labelSpan);

                    const choicesWrapper = document.createElement("div");
                    choicesWrapper.className = "flex flex-wrap gap-2.5";

                    stepProg.shuffledChoices.forEach(choice => {
                        const optBtn = document.createElement("button");
                        optBtn.className = "bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-800 border-2 border-slate-200 hover:border-indigo-400 active:scale-95 px-5 py-2.5 rounded-xl text-lg font-black shadow-sm transition-all flex-1 text-center min-w-[70px]";
                        optBtn.innerText = choice;
                        optBtn.onclick = () => handleOptionSelect(choice);
                        choicesWrapper.appendChild(optBtn);
                    });

                    buttonAreaDiv.appendChild(choicesWrapper);
                    card.appendChild(buttonAreaDiv);
                }

                // 動作檢查按鈕列
                if (!stepProg.completed) {
                    const actionDiv = document.createElement("div");
                    actionDiv.className = "flex items-center justify-between pt-2 border-t border-slate-100";

                    const hintSpan = document.createElement("span");
                    hintSpan.className = "text-xs text-slate-400 font-medium flex items-center gap-1";
                    hintSpan.innerHTML = "<i class='fa-solid fa-wand-magic-sparkles text-indigo-500'></i> 填滿空格後即可送出檢查";

                    const checkBtn = document.createElement("button");
                    checkBtn.className = "bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-black px-6 py-2.5 rounded-xl text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-1.5";
                    checkBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> 檢查答案";
                    checkBtn.onclick = () => handleCheckAnswer(sIdx);

                    actionDiv.appendChild(hintSpan);
                    actionDiv.appendChild(checkBtn);
                    card.appendChild(actionDiv);
                }

                stepsContainer.appendChild(card);
            }
        }

        // --- 事件綁定與初始化 ---
        window.onload = function () {
            // 1. 初始化資料與打亂選項
            initProgress();

            // 2. 啟動倒數計時器
            startTimer();
            updateTimerDisplay();

            // 3. 渲染主畫面
            renderAll();

            // 4. 綁定結算視窗按鈕事件
            document.getElementById("btn-restart").onclick = () => {
                playAudioTone('click');
                initProgress();
                state.currentQuestionIdx = 0;
                state.timerSeconds = 420;
                closeFinalModal();
                stopTimer();
                startTimer();
                renderAll();
            };

            document.getElementById("btn-close-modal").onclick = () => {
                playAudioTone('click');
                closeFinalModal();
            };
        };
    </script>
</body>
