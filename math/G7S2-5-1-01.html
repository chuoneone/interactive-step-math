<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 直方圖的報讀</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff; /* 溫和的淡藍色底色，舒適閱讀 */
            overflow-x: hidden;
        }

        .math {
            font-size: 26px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 題目顯示用 */
        .problem-content {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.6;
            color: #1e293b;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 80px;
            height: 52px;
            border-bottom: 4px solid #3b82f6;
            margin: 0 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 900;
            font-size: 1.6rem;
            color: #1e40af;
            background-color: #eff6ff;
            border-radius: 8px 8px 0 0;
            vertical-align: middle;
        }

        .slot.filled {
            border-bottom-color: #10b981;
            background-color: #ecfdf5;
            color: #065f46;
        }

        /* 閃爍的高亮外框，引導填答 */
        @keyframes pulse-highlight {
            0%, 100% {
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
                background-color: #eff6ff;
            }
            50% {
                border-color: #1d4ed8;
                box-shadow: 0 0 0 5px rgba(29, 78, 216, 0.6);
                background-color: #dbeafe;
            }
        }

        .active-slot {
            animation: pulse-highlight 1.5s infinite;
        }

        .step-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.98);
        }

        .step-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .step-card.completed {
            background-color: #f8fafc;
            border-left: 6px solid #10b981;
            opacity: 1;
        }

        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-2deg); }
            30%, 50%, 70%, 90% { transform: scale(1.05) rotate(2deg); }
            40%, 60%, 80% { transform: scale(1.05) rotate(-2deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .tada {
            animation: tada 0.6s ease-in-out;
        }

        .nav-active {
            background-color: #f59e0b !important;
            color: #1e293b !important;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            border-color: #f59e0b !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between p-3 flex-wrap md:flex-nowrap gap-3">
            <div class="flex items-center overflow-hidden w-full md:w-auto">
                <div class="whitespace-nowrap font-black text-blue-200 px-3 py-1 bg-blue-900 rounded-full mr-3 text-sm">
                    5-1 直方圖
                </div>
                <div id="problem-nav" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    <!-- 由 JS 生成 -->
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0 ml-auto">
                <div id="timer-display" class="font-mono font-bold text-xl md:text-2xl text-blue-100 bg-blue-800/80 px-4 py-1.5 rounded-xl">07:00</div>
                <button onclick="showLeaderboard()" class="px-4 py-2 bg-amber-400 text-slate-900 font-bold rounded-xl shadow hover:bg-amber-300 transition-all text-sm md:text-base">🏆 排行榜</button>
            </div>
        </div>
    </nav>

    <!-- 題型判定提示欄 -->
    <div class="bg-blue-100 text-blue-800 text-center py-1 px-4 text-xs md:text-sm font-bold border-b border-blue-200">
        💡 題型判定：直方圖的報讀（讀取連續組界之次數分配，並進行區間人數累加與計算）
    </div>

    <!-- 開始視窗 -->
    <div id="start-modal"
        class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4 text-center">

            <p class="text-slate-500 mb-6 text-base">你有 7 分鐘（420 秒）的時間，請依序完成直方圖的報讀關卡！</p>
            <input type="text" id="player-name" placeholder="輸入你的名字" class="w-full mb-6 px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none text-center text-lg font-bold">
            <button onclick="startGame()"

    <!-- 排行榜視窗 -->
    <div id="leaderboard-modal"

            <h3 class="text-2xl font-black text-slate-800 mb-6 text-center">🏆 排行榜 (本機紀錄)</h3>
            <div id="leaderboard-list" class="flex flex-col gap-3 mb-6 max-h-64 overflow-y-auto pr-2">
                <!-- 動態生成 -->
            </div>
            <button onclick="closeLeaderboard()"

    </div>

    <!-- 主要內容區 (雙欄響應式) -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 flex-1 w-full">
        <div class="flex flex-col md:flex-row gap-6 items-start">

            <!-- 左側：題目固定與 SVG 繪圖區 -->
            <div class="w-full md:w-5/12 md:sticky md:top-24 bg-white p-6 rounded-3xl shadow-md border border-blue-100">
                <div id="problem-tag"
                    class="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-800 text-xs font-black mb-4">
                    關卡 1
                </div>
                <div id="problem-content" class="problem-content break-words mb-6 font-bold text-slate-700">
                    <!-- 題目文字 -->
                </div>

                <!-- SVG 直方圖渲染區 -->
                <div class="mb-4 bg-slate-50 rounded-2xl p-4 border border-slate-200 flex flex-col items-center justify-center min-h-[220px]">
                    <div id="svg-visual-container" class="w-full flex justify-center">
                        <!-- JS 動態繪製 SVG -->
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex items-start gap-3 p-4 bg-amber-50 rounded-2xl border border-amber-100 text-sm">
                        <span class="text-2xl">💡</span>
                        <div class="text-amber-900 leading-relaxed">
                            <p class="font-bold text-base">直方圖（Histogram）小知識</p>
                            <p class="mt-1 font-medium">直方圖的橫軸代表<strong class="font-bold text-slate-800">連續的區間</strong>（如 40~50 公斤），直條與直條之間是緊貼無空隙的！縱軸則代表各區間的人數或次數。</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：細分步驟區 -->
            <div class="w-full md:w-7/12 flex flex-col gap-6" id="steps-container">
                <!-- 步驟由 JS 動態生成 -->
            </div>

        </div>
    </main>

    <!-- 完成/結算視窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] hidden p-4">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center border-4 border-blue-500 transform transition-all scale-90 opacity-0"
            id="modal-content">
            <div id="finish-emoji" class="text-7xl mb-6">🎯</div>
            <h3 id="finish-title" class="text-3xl font-black text-slate-800 mb-3">挑戰成功！</h3>
            <p id="finish-subtitle" class="text-slate-500 mb-8 text-lg">你已經順利完成了直方圖的所有報讀題目！</p>
            <div class="flex flex-col gap-3">
                <button onclick="showLeaderboard()"
                    class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-4 rounded-2xl transition-all shadow-lg text-lg">🏆 查看排行榜</button>
                <button onclick="location.reload()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg text-lg">🔄 重新開始挑戰</button>
            </div>
        </div>
    </div>

    <script>
        // 題目定義 (4 題)
        const problems = [
            {
                id: 1, 
                title: "關卡 1：體重分佈",
                text: "某國中七年一班全班同學的體重直方圖如下。請仔計讀圖，回答右側的步驟問題：",
                svgParams: {

                    bins: [
                        { label: "40~50", value: 6 },
                        { label: "50~60", value: 14 },
                        { label: "60~70", value: 12 },
                        { label: "70~80", value: 8 }
                    ],
                    yMax: 16
                },
                steps: [
                    { 
                        title: "找出人數最多的體重區間",

                    },
                    { 
                        title: "計算體重不足 60 公斤的學生人數", 
                        els: [
                            { t: "體重 40 ~ 50 公斤有：" }, { s: true }, { t: "人；" },
                            { t: "50 ~ 60 公斤有：" }, { s: true }, { t: "人；" },
                            { t: "因此不足 60 公斤的同學共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["6", "14", "20"], 
                        opts: ["6", "8", "12", "14", "20", "40"], 
                        unorder: false 
                    },
                    { 
                        title: "計算全班總人數", 
                        els: [
                            { t: "將所有區間人數相加，全班總人數為：" }, 
                            { s: true }, 
                            { t: "人。" }
                        ], 
                        ans: ["40"], 
                        opts: ["30", "36", "40", "42"], 
                        unorder: false 
                    }
                ]
            },
            {
                id: 2, 
                title: "關卡 2：英文成績",
                text: "這是七年二班英文小考成績的直方圖。請仔細讀圖，回答右側的步驟問題：",
                svgParams: {
                    xLabel: "分數 (分)",
                    yLabel: "人數 (人)",
                    bins: [
                        { label: "50~60", value: 4 },
                        { label: "60~70", value: 8 },
                        { label: "70~80", value: 10 },
                        { label: "80~90", value: 12 },
                        { label: "90~100", value: 6 }
                    ],
                    yMax: 14
                },
                steps: [
                    { 
                        title: "計算 70 分以上，但未滿 90 分的人數", 
                        els: [
                            { t: "70 ~ 80 分有：" }, { s: true }, { t: "人；" },
                            { t: "80 ~ 90 分有：" }, { s: true }, { t: "人；" },
                            { t: "共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["10", "12", "22"], 
                        opts: ["6", "10", "12", "18", "22", "40"], 
                        unorder: false 
                    },
                    { 
                        title: "找出英文不及格（低於 60 分）的人數", 
                        els: [
                            { t: "不及格分數在 50 ~ 60 分，共有：" }, 
                            { s: true }, 
                            { t: "人。" }
                        ], 
                        ans: ["4"], 
                        opts: ["4", "6", "8", "10"], 
                        unorder: false 
                    },
                    { 
                        title: "找出及格學生中，人數最多的區間", 
                        els: [
                            { t: "在 60 分以上的及格區間中，人數最多的是：" }, 
                            { s: true }
                        ], 
                        ans: ["80 ~ 90 分"], 
                        opts: ["60 ~ 70 分", "70 ~ 80 分", "80 ~ 90 分", "90 ~ 100 分"], 
                        unorder: false 
                    }
                ]
            },
            {
                id: 3, 
                title: "關卡 3：投籃進球數",
                text: "七年三班同學進行 10 次投籃測驗，進球數的統計直方圖如下。請回答右側步驟問題：",
                svgParams: {
                    xLabel: "進球數 (球)",
                    yLabel: "人數 (人)",
                    bins: [
                        { label: "0~2", value: 3 },
                        { label: "2~4", value: 7 },
                        { label: "4~6", value: 15 },
                        { label: "6~8", value: 11 },
                        { label: "8~10", value: 4 }
                    ],
                    yMax: 16
                },
                steps: [
                    { 
                        title: "計算投進 4 球以上，未滿 8 球的人數", 
                        els: [
                            { t: "4 ~ 6 球有：" }, { s: true }, { t: "人；" },
                            { t: "6 ~ 8 球有：" }, { s: true }, { t: "人；" },
                            { t: "相加共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["15", "11", "26"], 
                        opts: ["3", "7", "11", "15", "22", "26"], 
                        unorder: false 
                    },
                    { 
                        title: "計算進球數在 6 球以上（含）的人數", 
                        els: [
                            { t: "6 ~ 8 球有：" }, { s: true }, { t: "人；" },
                            { t: "8 ~ 10 球有：" }, { s: true }, { t: "人；" },
                            { t: "相加共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["11", "4", "15"], 
                        opts: ["4", "11", "15", "18", "40"], 
                        unorder: false 
                    }
                ]
            },
            {
                id: 4, 
                title: "關卡 4：每週閱讀時間",
                text: "這是七年四班學生每週課外閱讀時間（小時）的直方圖。請回答右側步驟問題：",
                svgParams: {
                    xLabel: "時間 (小時)",
                    yLabel: "人數 (人)",
                    bins: [
                        { label: "0~2", value: 5 },
                        { label: "2~4", value: 9 },
                        { label: "4~6", value: 14 },
                        { label: "6~8", value: 8 },
                        { label: "8~10", value: 4 }
                    ],
                    yMax: 16
                },
                steps: [
                    { 
                        title: "計算閱讀時間未滿 4 小時的人數", 
                        els: [
                            { t: "0 ~ 2 小時有：" }, { s: true }, { t: "人；" },
                            { t: "2 ~ 4 小時有：" }, { s: true }, { t: "人；" },
                            { t: "未滿 4 小時共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["5", "9", "14"], 
                        opts: ["5", "8", "9", "14", "17"], 
                        unorder: false 
                    },
                    { 
                        title: "計算閱讀時間不少於 6 小時（含）的人數", 
                        els: [
                            { t: "6 ~ 8 小時有：" }, { s: true }, { t: "人；" },
                            { t: "8 ~ 10 小時有：" }, { s: true }, { t: "人；" },
                            { t: "不少於 6 小時共有：" }, { s: true }, { t: "人。" }
                        ], 
                        ans: ["8", "4", "12"], 
                        opts: ["4", "8", "12", "14", "22"], 
                        unorder: false 
                    },
                    { 
                        title: "找出最多人分佈的閱讀時間區間", 
                        els: [
                            { t: "閱讀時間最多人分佈的區間是：" }, 
                            { s: true }
                        ], 
                        ans: ["4 ~ 6 小時"], 
                        opts: ["0 ~ 2 小時", "2 ~ 4 小時", "4 ~ 6 小時", "6 ~ 8 小時", "8 ~ 10 小時"], 
                        unorder: false 
                    }
                ]
            }
        ];

        let currentIndex = 0;
        let pState = {}; // 關卡作答狀態
        
        // 計時器與分數系統變數
        let timerInterval;
        let timeLeft = 7 * 60;
        let playerName = "";
        let completedProblemsCount = 0;
        const LEADERBOARD_KEY = 'math_leaderboard_G7S2_5_1_01';

        // --- 離線音效生成器 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                // 清亮和弦 C5 -> E5 -> G5 -> C6
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.12); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.24); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.36); // C6
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'error') {
                // 低沉滑音 (錯誤提示)
                osc.type = 'sawtooth';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'click') {
                // 輕微點擊反饋
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(900, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            }
        }

        // --- 排行榜 LocalStorage 讀寫 ---
        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) {
                alert("請先輸入你的名字喔！");
                return;
            }
            playerName = nameInput;
            document.getElementById('start-modal').classList.add('hidden');
            
            timeLeft = 7 * 60;
            completedProblemsCount = 0;
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function endGame(isAllCompleted) {
            clearInterval(timerInterval);
            const timeUsed = 7 * 60 - timeLeft;
            // 分數計算：每答對一題給 1000 分，再加上剩餘時間秒數
            const finalScore = completedProblemsCount * 1000 + timeLeft;
            
            // 寫入本地紀錄
            let board = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]");
            board.push({
                name: playerName,
                score: finalScore,
                completed: completedProblemsCount,
                timeUsed: timeUsed,
                date: new Date().toLocaleString()
            });
            board.sort((a, b) => b.score - a.score);
            board = board.slice(0, 10);
            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(board));

            // 修改 Modal 並顯示結算畫面
            const m = document.getElementById('finish-modal');
            const c = document.getElementById('modal-content');
            
            document.getElementById('finish-emoji').innerText = isAllCompleted ? '🎉' : '⏳';
            document.getElementById('finish-title').innerText = isAllCompleted ? '挑戰成功！' : '時間終了！';
            document.getElementById('finish-subtitle').innerHTML = `
                <div class="text-slate-600 mb-4 font-bold text-lg">你完成了 ${completedProblemsCount} 關！</div>
                <div class="bg-slate-100 p-4 rounded-2xl mb-4 font-black grid grid-cols-2 gap-2 text-sm">
                    <div class="text-slate-500">使用時間: <span class="text-slate-800 block text-base font-black">${timeUsed} 秒</span></div>
                    <div class="text-slate-500">挑戰得分: <span class="text-emerald-600 block text-base font-black">${finalScore} 分</span></div>
                </div>
            `;
            
            m.classList.remove('hidden');
            setTimeout(() => { 
                c.classList.remove('scale-90', 'opacity-0'); 
                c.classList.add('scale-100', 'opacity-100'); 
            }, 50);
        }

        function showLeaderboard() {
            const board = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]");
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = board.map((entry, i) => `
                <div class="flex justify-between items-center p-3 ${i===0?'bg-amber-50 border-amber-300':'bg-slate-50 border-slate-100'} border-2 rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="font-black text-xl w-6 text-center ${i===0?'text-amber-500':'text-slate-400'}">${i+1}</span>
                        <div>
                            <div class="font-bold text-slate-700">${entry.name}</div>
                            <div class="text-[10px] text-slate-400">${entry.date}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-emerald-600">${entry.score} 分</div>
                        <div class="text-[10px] text-slate-500">通關 ${entry.completed} 題 / 用時 ${entry.timeUsed}秒</div>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-slate-400 py-4">目前還沒有紀錄喔，快來搶占鰲頭吧！</div>';
            
            document.getElementById('leaderboard-modal').classList.remove('hidden');
        }

        // --- 關閉排行榜 ---
        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        // --- 繪製 SVG 直方圖 ---
        function drawSvgVisual(q) {
            const container = document.getElementById('svg-visual-container');
            container.innerHTML = "";

            const svgNs = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNs, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "240");
            svg.setAttribute("viewBox", "0 0 440 240");
            svg.setAttribute("class", "w-full max-w-lg");

            const params = q.svgParams;
            const bins = params.bins;
            const yMax = params.yMax;

            // 繪圖區尺寸與邊距
            const xOffset = 50;
            const yOffset = 30;
            const width = 340;
            const height = 170;

            // 畫水平格線
            const yTickCount = 8;
            for (let i = 0; i <= yTickCount; i++) {
                const yVal = (yMax / yTickCount) * i;
                const yPos = height + yOffset - (height * (yVal / yMax));
                
                const gridLine = document.createElementNS(svgNs, "line");
                gridLine.setAttribute("x1", xOffset);
                gridLine.setAttribute("y1", yPos);
                gridLine.setAttribute("x2", xOffset + width);
                gridLine.setAttribute("y2", yPos);
                gridLine.setAttribute("stroke", i === 0 ? "#475569" : "#e2e8f0");
                gridLine.setAttribute("stroke-width", i === 0 ? "2" : "1");
                svg.appendChild(gridLine);

                // Y 軸刻度文字
                const yText = document.createElementNS(svgNs, "text");
                yText.setAttribute("x", xOffset - 10);
                yText.setAttribute("y", yPos + 4);
                yText.setAttribute("font-size", "11");
                yText.setAttribute("font-weight", "bold");
                yText.setAttribute("fill", "#475569");
                yText.setAttribute("text-anchor", "end");
                yText.textContent = Math.round(yVal);
                svg.appendChild(yText);
            }

            // Y 軸單位標題
            const yAxisLabel = document.createElementNS(svgNs, "text");
            yAxisLabel.setAttribute("x", xOffset - 10);
            yAxisLabel.setAttribute("y", yOffset - 12);
            yAxisLabel.setAttribute("font-size", "11");
            yAxisLabel.setAttribute("font-weight", "black");
            yAxisLabel.setAttribute("fill", "#1e293b");
            yAxisLabel.setAttribute("text-anchor", "end");
            yAxisLabel.textContent = params.yLabel;
            svg.appendChild(yAxisLabel);

            // 繪製直方圖直條 (貼合無空隙，連續組界)
            const barWidth = width / bins.length;
            const barColors = [
                "rgba(20, 184, 166, 0.7)",  // 綠松石色
                "rgba(59, 130, 246, 0.7)",  // 藍色
                "rgba(245, 158, 11, 0.7)",  // 橘色
                "rgba(168, 85, 247, 0.7)",  // 紫色
                "rgba(236, 72, 153, 0.7)"    // 粉色
            ];
            const borderColors = [
                "#0d9488", "#2563eb", "#d97706", "#9333ea", "#db2777"
            ];

            bins.forEach((bin, idx) => {
                const barHeight = (bin.value / yMax) * height;
                const xPos = xOffset + idx * barWidth;
                const yPos = height + yOffset - barHeight;

                // 畫直條矩形
                const rect = document.createElementNS(svgNs, "rect");
                rect.setAttribute("x", xPos);
                rect.setAttribute("y", yPos);
                rect.setAttribute("width", barWidth);
                rect.setAttribute("height", barHeight);
                rect.setAttribute("fill", barColors[idx % barColors.length]);
                rect.setAttribute("stroke", borderColors[idx % borderColors.length]);
                rect.setAttribute("stroke-width", "2");
                svg.appendChild(rect);

                // 在直條正上方顯示數值 (無障礙與易讀輔助)
                if (bin.value > 0) {
                    const valText = document.createElementNS(svgNs, "text");
                    valText.setAttribute("x", xPos + barWidth / 2);
                    valText.setAttribute("y", yPos - 6);
                    valText.setAttribute("font-size", "13");
                    valText.setAttribute("font-weight", "black");
                    valText.setAttribute("fill", "#0f172a");
                    valText.setAttribute("text-anchor", "middle");
                    valText.textContent = bin.value;
                    svg.appendChild(valText);
                }

                // X 軸組距標籤 (如 40~50)
                const labelText = document.createElementNS(svgNs, "text");
                labelText.setAttribute("x", xPos + barWidth / 2);
                labelText.setAttribute("y", height + yOffset + 18);
                labelText.setAttribute("font-size", "11");
                labelText.setAttribute("font-weight", "bold");
                labelText.setAttribute("fill", "#475569");
                labelText.setAttribute("text-anchor", "middle");
                labelText.textContent = bin.label;
                svg.appendChild(labelText);

                // 畫分組點刻度線
                const tick = document.createElementNS(svgNs, "line");
                tick.setAttribute("x1", xPos);
                tick.setAttribute("y1", height + yOffset);
                tick.setAttribute("x2", xPos);
                tick.setAttribute("y2", height + yOffset + 6);
                tick.setAttribute("stroke", "#475569");
                tick.setAttribute("stroke-width", "1.5");
                svg.appendChild(tick);

                if (idx === bins.length - 1) {
                    // 最右側的刻度線
                    const lastTick = document.createElementNS(svgNs, "line");
                    lastTick.setAttribute("x1", xPos + barWidth);
                    lastTick.setAttribute("y1", height + yOffset);
                    lastTick.setAttribute("x2", xPos + barWidth);
                    lastTick.setAttribute("y2", height + yOffset + 6);
                    lastTick.setAttribute("stroke", "#475569");
                    lastTick.setAttribute("stroke-width", "1.5");
                    svg.appendChild(lastTick);
                }
            });

            // X 軸基準線
            const xAxis = document.createElementNS(svgNs, "line");
            xAxis.setAttribute("x1", xOffset);
            xAxis.setAttribute("y1", height + yOffset);
            xAxis.setAttribute("x2", xOffset + width);
            xAxis.setAttribute("y2", height + yOffset);
            xAxis.setAttribute("stroke", "#475569");
            xAxis.setAttribute("stroke-width", "2");
            svg.appendChild(xAxis);

            // X 軸標籤
            const xAxisLabel = document.createElementNS(svgNs, "text");
            xAxisLabel.setAttribute("x", xOffset + width + 8);
            xAxisLabel.setAttribute("y", height + yOffset + 4);
            xAxisLabel.setAttribute("font-size", "11");
            xAxisLabel.setAttribute("font-weight", "black");
            xAxisLabel.setAttribute("fill", "#1e293b");
            xAxisLabel.setAttribute("text-anchor", "start");
            xAxisLabel.textContent = params.xLabel;
            svg.appendChild(xAxisLabel);

            container.appendChild(svg);
        }

        // --- 初始化全部關卡與按鈕 ---
        function init() {
            const nav = document.getElementById('problem-nav');
            problems.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-full whitespace-nowrap font-bold transition-all bg-blue-800 text-blue-100 hover:bg-blue-600 border-2 border-blue-950/20 text-xs md:text-sm`;
                btn.innerText = `關卡 ${p.id}`;
                btn.id = `nav-btn-${index}`;
                btn.onclick = () => {
                    playSound('click');
                    switchProblem(index);
                };
                nav.appendChild(btn);

                // 初始化該題各步驟的作答狀況
                const blocks = p.steps.map(() => ({ answers: [], usedOpts: [] }));
                pState[index] = { step: 0, blocks: blocks, isCompleted: false };
            });
            switchProblem(0);
        }

        // --- 切換關卡 ---
        function switchProblem(index) {
            currentIndex = index;
            const p = problems[index];
            document.querySelectorAll('#problem-nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`nav-btn-${index}`).classList.add('nav-active');
            
            document.getElementById('problem-tag').innerText = p.title;
            document.getElementById('problem-content').innerHTML = p.text;
            
            drawSvgVisual(p);
            renderSteps();
        }

        // --- 渲染步驟與卡片 ---
        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            const p = problems[currentIndex];
            const state = pState[currentIndex];

            p.steps.forEach((stepDef, sIdx) => {
                const isActive = state.step >= sIdx;
                const isDone = state.step > sIdx;

                // 步驟大卡片
                const card = document.createElement('div');
                card.id = `step-card-${sIdx}`;
                card.className = `step-card bg-white p-6 rounded-3xl shadow-sm border-2 ${isActive ? (isDone ? 'completed border-slate-100 shadow' : 'active border-blue-300 shadow-md') : 'border-transparent'}`;

                let html = `
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                        <h3 class="text-lg font-black text-slate-700 flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-lg text-xs bg-blue-600 text-white font-black">步驟 ${sIdx + 1}</span>
                            ${stepDef.title}
                        </h3>
                        ${isDone ? '<span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">✔ 完成</span>' : ''}
                    </div>
                `;

                // 答題展示區 (Slot 排列)
                html += `<div class="math mb-4 text-slate-700 leading-loose" id="workspace-${sIdx}"></div>`;

                // 僅在當前活動步驟顯示選項按鈕與檢查按鈕
                if (isActive && !isDone) {
                    html += `<div class="flex flex-wrap gap-2.5 mt-4 pt-4 border-t border-slate-100" id="opts-${sIdx}"></div>`;
                    html += `<div class="flex items-center justify-between mt-5 gap-4">
                                <span class="text-xs text-amber-600 font-bold">⚠️ 點選格子可清除。答案皆填滿後請點右方檢查。</span>
                                <button id="check-${sIdx}" class="py-3 px-6 shrink-0 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm transition-all shadow active:scale-95">🔍 檢查答案</button>
                             </div>`;
                }

                card.innerHTML = html;
                container.appendChild(card);

                // 建立 Workspace HTML 節點與空格 (Slots)
                const workspace = card.querySelector(`#workspace-${sIdx}`);
                let slotCounter = 0;
                
                stepDef.els.forEach(el => {
                    if (el.s) {
                        const slot = document.createElement('div');
                        const block = state.blocks[sIdx];
                        const valObj = block.answers[slotCounter];
                        
                        // 判斷空格是否為當前焦點
                        let slotClass = "slot ";
                        if (valObj) {
                            slotClass += "filled ";
                        } else {
                            // 第一個空格高亮閃爍
                            const firstEmptyIdx = block.answers.findIndex(a => !a);
                            if (slotCounter === firstEmptyIdx || (firstEmptyIdx === -1 && slotCounter === 0)) {
                                slotClass += "active-slot ";
                            }
                        }

                        slot.className = slotClass;
                        slot.innerText = valObj ? valObj.val : '?';
                        
                        const currentSlotIdx = slotCounter;
                        if (!isDone) {
                            slot.onclick = () => {
                                playSound('click');
                                clearSlot(sIdx, currentSlotIdx);
                            };
                        } else {
                            slot.style.cursor = 'default';
                        }
                        
                        workspace.appendChild(slot);
                        slotCounter++;
                    } else {
                        const span = document.createElement('span');
                        span.className = "font-medium text-slate-800 text-lg mx-1";
                        span.innerHTML = el.t;
                        workspace.appendChild(span);
                    }
                });

                // 產生選項按鈕
                if (isActive && !isDone) {
                    const optBox = card.querySelector(`#opts-${sIdx}`);
                    const block = state.blocks[sIdx];
                    
                    stepDef.opts.forEach((optText, optIdx) => {
                        const btn = document.createElement('button');
                        const isUsed = block.usedOpts.includes(optIdx);
                        
                        btn.className = `px-5 py-2.5 rounded-xl font-bold text-base transition-all border ${isUsed ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-white border-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white hover:shadow hover:border-blue-600 active:scale-95 shadow-sm'}`;
                        btn.innerText = optText;
                        btn.disabled = isUsed;
                        btn.onclick = () => {
                            playSound('click');
                            fillSlot(sIdx, optText, optIdx);
                        };
                        optBox.appendChild(btn);
                    });

                    card.querySelector(`#check-${sIdx}`).onclick = () => checkStep(sIdx);
                }
            });
        }

        // --- 填入空格 ---
        function fillSlot(sIdx, val, optIdx) {
            const state = pState[currentIndex];
            const block = state.blocks[sIdx];
            const maxSlots = problems[currentIndex].steps[sIdx].els.filter(e => e.s).length;
            
            // 尋找第一個未填空格填入
            for (let i = 0; i < maxSlots; i++) {
                if (!block.answers[i]) {
                    block.answers[i] = { val: val, optIdx: optIdx };
                    block.usedOpts.push(optIdx);
                    break;
                }
            }
            renderSteps();
        }

        // --- 清除已填空格 ---
        function clearSlot(sIdx, slotIdx) {
            const state = pState[currentIndex];
            const block = state.blocks[sIdx];
            
            if (block.answers[slotIdx]) {
                const optIdx = block.answers[slotIdx].optIdx;
                block.usedOpts = block.usedOpts.filter(idx => idx !== optIdx);
                block.answers[slotIdx] = null;
                renderSteps();
            }
        }

        // --- 檢查步驟答案 ---
        function checkStep(sIdx) {
            const state = pState[currentIndex];
            const block = state.blocks[sIdx];
            const stepDef = problems[currentIndex].steps[sIdx];
            const maxSlots = stepDef.els.filter(e => e.s).length;
            
            // 確保所有空格都填好
            let filledCount = 0;
            for (let i = 0; i < maxSlots; i++) {
                if (block.answers[i]) filledCount++;
            }
            
            if (filledCount < maxSlots) {
                toast("請填滿所有空格再進行檢查喔！", "warn");
                return;
            }

            // 驗證答案
            const userVals = block.answers.map(a => a.val);
            const correctVals = [...stepDef.ans];
            
            let isCorrect = false;
            if (stepDef.unorder) {
                isCorrect = userVals.slice().sort().join() === correctVals.slice().sort().join();
            } else {
                isCorrect = userVals.join() === correctVals.join();
            }

            if (isCorrect) {
                playSound('success');
                const card = document.getElementById(`step-card-${sIdx}`);
                card.classList.add('tada');
                
                setTimeout(() => {
                    const isLastStep = (sIdx === problems[currentIndex].steps.length - 1);
                    if (isLastStep) {
                        state.isCompleted = true;
                        document.getElementById(`nav-btn-${currentIndex}`).classList.add('!bg-emerald-100', '!text-emerald-700', '!border-emerald-300');
                        
                        completedProblemsCount = Object.values(pState).filter(s => s.isCompleted).length;
                        if (completedProblemsCount === problems.length) {
                            endGame(true);
                        } else {
                            toast("太棒了！這關完全解開了，換下一關試試看！", "success");
                            // 延遲後跳轉下一題
                            setTimeout(() => {
                                if (currentIndex + 1 < problems.length) {
                                    switchProblem(currentIndex + 1);
                                }
                            }, 1200);
                        }
                    } else {
                        state.step++;
                        renderSteps();
                        const next = document.getElementById(`step-card-${state.step}`);
                        if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 600);
            } else {
                playSound('error');
                toast("答案不太對喔，再仔細讀圖看看！加油！", "error");
            }
        }

        // --- 浮動提示 Toast ---
        function toast(msg, type) {
            // 清除現有 toast
            const oldToast = document.querySelector('.floating-toast');
            if (oldToast) oldToast.remove();

            const t = document.createElement('div');
            const color = type === 'error' ? 'bg-rose-500' : (type === 'success' ? 'bg-emerald-500' : 'bg-amber-500');
            t.className = `floating-toast fixed bottom-8 left-1/2 -translate-x-1/2 ${color} text-white px-8 py-3.5 rounded-2xl shadow-2xl z-[200] font-black text-base md:text-lg animate-bounce border-2 border-white`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.onload = init;
    </script>
    <script src="../progress.js"></script>
</body>
