<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒野大鏢客：代數對決</title>
    <style>
        :root {
            --wood-dark: #5d4037;
            --wood-light: #8d6e63;
            --paper-bg: #fdf5e6;
            --accent-red: #b71c1c;
            --accent-gold: #ffb300;
            --text-color: #3e2723;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Courier New', 'Georgia', serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 50%, #DEB887 50%, #D2691E 100%);
            display: flex; justify-content: center; align-items: center;
        }

        /* 仙人掌裝飾 */
        .cactus { position: absolute; bottom: 10%; left: 5%; width: 40px; height: 100px; background: #2e7d32; border-radius: 20px 20px 0 0; z-index: 0; }
        .cactus::before { content: ''; position: absolute; top: 30px; left: -20px; width: 30px; height: 10px; background: #2e7d32; border-radius: 10px 0 0 10px; }
        .cactus::after { content: ''; position: absolute; top: 20px; left: -20px; width: 10px; height: 20px; background: #2e7d32; border-radius: 10px 10px 0 0; }
        .cactus.small { left: auto; right: 10%; bottom: 20%; transform: scale(0.6); }

        /* 主容器 */
        #game-container {
            width: 90%; max-width: 1000px; height: 85vh;
            background: repeating-linear-gradient(90deg, var(--wood-dark), var(--wood-dark) 10px, var(--wood-light) 10px, var(--wood-light) 20px);
            border: 8px solid #3e2723; border-radius: 15px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
            display: flex; position: relative; z-index: 10; overflow: hidden;
        }

        /* 左側資訊區 */
        .side-panel {
            flex: 1; background: rgba(62, 39, 35, 0.9); color: #fff;
            padding: 20px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            border-right: 4px solid #281815; text-align: center;
            position: relative;
        }

        .sheriff-badge {
            width: 80px; height: 80px; background: var(--accent-gold);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            margin-bottom: 20px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #5d4037; font-size: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.2s;
        }
        .sheriff-badge:hover { transform: scale(1.1); }

        .main-panel { flex: 2; padding: 30px; display: flex; justify-content: center; align-items: center; position: relative; }

        /* 羊皮紙容器 */
        .paper-card {
            background: var(--paper-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            width: 100%; height: 100%; border-radius: 5px; padding: 20px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3), inset 0 0 40px rgba(139, 69, 19, 0.2);
            position: relative; display: flex; flex-direction: column; overflow-y: auto;
        }
        .paper-card::before, .paper-card::after {
            content: ''; position: absolute; top: 10px; width: 12px; height: 12px;
            background: #555; border-radius: 50%; box-shadow: 1px 1px 2px black;
        }
        .paper-card::before { left: 10px; } .paper-card::after { right: 10px; }

        h1, h2, h3 { color: var(--text-color); margin-top: 0; text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }

        .btn {
            background: var(--wood-light); color: #fff; border: 2px solid #3e2723;
            padding: 12px 24px; font-size: 1.1rem; cursor: pointer; margin: 10px 0;
            border-radius: 8px; box-shadow: 0 4px 0 #3e2723, 0 5px 10px rgba(0,0,0,0.3);
            width: 100%; max-width: 300px; position: relative;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #3e2723; }
        .btn:hover { background: #a1887f; }

        .btn-secondary {
            background: #6d4c41; /* Slightly darker */
            margin-top: 5px;
        }
        .btn-small {
            padding: 5px 10px; font-size: 0.9rem; width: auto; margin: 0 5px;
        }
        
        .admin-link {
            position: absolute; bottom: 10px; right: 10px;
            font-size: 0.8rem; color: var(--wood-light);
            cursor: pointer; opacity: 0.6; text-decoration: underline;
        }

        .nav-btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            width: 100%;
        }
        
        .nav-btn {
            background: var(--wood-dark); color: #fff; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer;
            font-family: inherit; font-size: 1rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .nav-btn:disabled {
            background: #a1887f; cursor: not-allowed; opacity: 0.7;
        }
        .nav-btn:hover:not(:disabled) {
            background: #3e2723;
        }

        input[type="text"], input[type="password"] {
            width: 100%; max-width: 300px; padding: 10px; font-size: 1.1rem;
            border: 2px solid var(--wood-dark); background: rgba(255,255,255,0.8);
            margin-bottom: 20px; border-radius: 5px;
        }

        .question-text { font-size: 1.8rem; margin-bottom: 20px; text-align: center; border-bottom: 2px dashed var(--wood-dark); padding-bottom: 15px; font-weight: bold; }
        
        .options-grid { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; }
        .option-btn {
            background: white; color: var(--text-color); border: 2px solid var(--wood-dark);
            padding: 20px; cursor: pointer; font-size: 1.2rem; border-radius: 5px;
            transition: transform 0.1s; text-align: center; font-weight: bold;
        }
        .option-btn:hover { background: #fff3e0; transform: scale(1.02); }
        .option-btn.correct { background: #c8e6c9 !important; border-color: #2e7d32; }
        .option-btn.wrong { background: #ffcdd2 !important; border-color: #c62828; animation: shake 0.5s; }
        .option-btn.disabled { pointer-events: none; opacity: 0.9; }

        /* 排行榜與後台表格 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border-bottom: 1px dashed #8d6e63; padding: 8px; text-align: center; }
        th { background: var(--wood-dark); color: white; }
        tr:nth-child(even) { background: rgba(0,0,0,0.05); }

        .hidden { display: none !important; }

        /* 後台樣式 */
        .admin-details-row { background: #fff8e1; display: none; }
        .admin-details-row.show { display: table-row; }
        .detail-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: white; display: inline-block; margin: 2px;}
        .tag-correct { background: #4caf50; }
        .tag-wrong { background: #f44336; }
        
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25%, 75% {transform: translateX(-5px);} 50% {transform: translateX(5px);} }
        @keyframes coin-fly { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }
        .coin { position: absolute; font-size: 2rem; color: gold; pointer-events: none; z-index: 100; }

        @media (max-width: 768px) {
            #game-container { flex-direction: column; height: auto; min-height: 90vh; }
            .side-panel { flex: 0 0 auto; border-right: none; border-bottom: 4px solid #281815; padding: 10px; }
            .options-grid { grid-template-columns: 1fr; }
            .sheriff-badge { width: 50px; height: 50px; font-size: 8px; position: absolute; top: 10px; left: 10px; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="cactus"></div>
    <div class="cactus small"></div>

    <div id="game-container">
        <!-- 左側資訊 -->
        <div class="side-panel">
            <div class="sheriff-badge" title="荒野警長">MATH</div>
            <h2 id="level-display">懸賞代數</h2>
            <p>目前賞金</p>
            <h1 style="color: gold; font-size: 3rem; margin: 0;" id="score-display">0</h1>
            <p id="progress-display">準備中...</p>
        </div>

        <!-- 右側互動區 -->
        <div class="main-panel">
            
            <!-- 1. 首頁 -->
            <div id="start-screen" class="paper-card" style="justify-content: center; align-items: center; text-align: center;">
                <h1 style="font-size: 2.2rem; margin-bottom: 5px;">🤠 荒野代數對決</h1>
                <p style="color: var(--wood-dark); margin-bottom: 20px;">Algebra Showdown</p>
                <input type="text" id="player-name" placeholder="請輸入牛仔代號" maxlength="10">
                <button class="btn" onclick="startGame()">拔槍開始</button>
                <button class="btn btn-secondary" onclick="showMainMenuLeaderboard()">🏆 查看排行榜</button>
                
                <div class="admin-link" onclick="showAdminLogin()">教師後台</div>
            </div>

            <!-- 2. 測驗畫面 -->
            <div id="quiz-screen" class="paper-card hidden">
                <div id="question-container"></div>
                <div id="options-container" class="options-grid"></div>
                <div id="feedback-area" style="margin-top: 10px; min-height: 30px; font-weight: bold; text-align: center;"></div>
                
                <!-- 導航按鈕 -->
                <div class="nav-btn-container">
                    <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">❮ 上一題</button>
                    <button id="next-btn" class="nav-btn" onclick="nextQuestion()">下一題 ❯</button>
                </div>
            </div>

            <!-- 3. 結果與排行榜畫面 -->
            <div id="result-screen" class="paper-card hidden">
                <h2 style="text-align: center; margin-bottom: 5px;">冒險結束</h2>
                <div class="result-stats" id="final-score" style="text-align: center; font-size: 1.8rem; color: var(--accent-red); margin: 5px 0;"></div>
                <p id="final-comment" style="text-align: center; font-weight: bold; margin-bottom: 15px;"></p>
                
                <div style="flex: 1; overflow-y: auto; border: 2px solid var(--wood-light); padding: 5px; border-radius: 5px; margin-bottom: 10px;">
                    <h3 style="text-align: center; background: #eee; margin: 0; padding: 5px;">🏆 神槍手排行榜</h3>
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>牛仔</th>
                                <th>賞金</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- JS 填入 -->
                        </tbody>
                    </table>
                </div>

                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn" onclick="restartGame()">再次挑戰</button>
                </div>
            </div>
            
            <!-- 4. 僅排行榜畫面 -->
            <div id="leaderboard-only-screen" class="paper-card hidden">
                 <h2 style="text-align: center;">🏆 神槍手排行榜</h2>
                 <div style="flex: 1; overflow-y: auto; border: 2px solid var(--wood-light); padding: 5px; border-radius: 5px; margin-bottom: 20px;">
                    <table>
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>牛仔</th>
                                <th>賞金</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-only-body"></tbody>
                    </table>
                </div>
                <button class="btn" onclick="restartGame()">返回首頁</button>
            </div>

            <!-- 5. 教師後台登入 -->
            <div id="admin-login-screen" class="paper-card hidden" style="justify-content: center; align-items: center; text-align: center;">
                <h2>🔐 教師後台登入</h2>
                <p>請輸入管理密碼</p>
                <input type="password" id="admin-password" placeholder="密碼">
                <button class="btn" onclick="checkAdminPassword()">登入</button>
                <button class="btn btn-secondary" onclick="restartGame()">返回</button>
            </div>

            <!-- 6. 教師後台儀表板 -->
            <div id="admin-dashboard-screen" class="paper-card hidden">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px dashed #8d6e63; padding-bottom:10px; margin-bottom:10px;">
                    <h2 style="margin:0;">📋 學生答題紀錄</h2>
                    <div>
                        <button class="btn btn-small" onclick="exportData()">匯出 CSV</button>
                        <button class="btn btn-small" onclick="clearAllData()" style="background:#b71c1c;">清除所有</button>
                        <button class="btn btn-small" onclick="restartGame()">登出</button>
                    </div>
                </div>
                
                <div style="flex:1; overflow-y: auto;">
                    <table style="width:100%;">
                        <thead>
                            <tr>
                                <th>時間</th>
                                <th>姓名</th>
                                <th>分數</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-log-body">
                            <!-- JS 填入 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. 遊戲資料 ---
        let questions = [
            { q: "(1) x加4是15", a: "x + 4 = 15", options: ["x + 4 = 15", "4x = 15", "x - 4 = 15", "x = 4 + 15"] },
            { q: "(2) 比x大9的數是16", a: "x + 9 = 16", options: ["x + 9 = 16", "9x = 16", "x - 9 = 16", "x > 9"] },
            { q: "(3) x減17等於8", a: "x - 17 = 8", options: ["x - 17 = 8", "17 - x = 8", "x + 17 = 8", "x / 17 = 8"] },
            { q: "(4) －7是比x小11的數", a: "x - 11 = -7", options: ["x - 11 = -7", "-7 - x = 11", "x + 11 = -7", "11 - x = -7"] },
            { q: "(5) x的13倍等於65", a: "13x = 65", options: ["13x = 65", "x + 13 = 65", "x - 13 = 65", "65x = 13"] },
            { q: "(6) x的2.4倍等於48", a: "2.4x = 48", options: ["2.4x = 48", "x + 2.4 = 48", "x / 2.4 = 48", "48x = 2.4"] },
            { q: "(7) 65等於x的兩倍少3", a: "65 = 2x - 3", options: ["65 = 2x - 3", "65 = 2x + 3", "2x = 65 - 3", "65 = 3x - 2"] },
            { q: "(8) x的5倍再加6是21", a: "5x + 6 = 21", options: ["5x + 6 = 21", "5(x + 6) = 21", "5x = 21 + 6", "x + 5 + 6 = 21"] },
            { q: "(9) 比x的3倍多5.6的數是11", a: "3x + 5.6 = 11", options: ["3x + 5.6 = 11", "3(x + 5.6) = 11", "3x = 11 + 5.6", "x + 3.56 = 11"] },
            { q: "(10) 39比x的12倍少9", a: "39 = 12x - 9", options: ["39 = 12x - 9", "39 = 9 - 12x", "12x = 39 - 9", "39 = 12(x - 9)"] }
        ];

        // --- 2. 遊戲狀態 ---
        let currentQIndex = 0;
        let score = 0;
        let playerName = "無名牛仔";
        let isAnswering = false;
        // 記錄答題狀態：改為儲存物件 { correct: boolean, selected: string }
        let userAnswersStatus = [];
        
        // LocalStorage Keys
        // 1. 排行榜 (簡單版)
        const STORAGE_KEY_SCORE = 'cowboy_algebra_scores';
        // 2. 詳細紀錄 (後台用)
        const STORAGE_KEY_DETAILS = 'cowboy_algebra_details';

        // --- 3. 遊戲邏輯 ---
        function startGame() {
            const inputName = document.getElementById('player-name').value.trim();
            playerName = inputName || "無名牛仔"; 
            
            initAudio();
            playSound('start');

            score = 0;
            currentQIndex = 0;
            userAnswersStatus = new Array(questions.length).fill(null);
            
            document.getElementById('score-display').innerText = "0";
            
            showScreen('quiz-screen');
            loadQuestion();
        }

        function showScreen(id) {
            document.querySelectorAll('.paper-card').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function loadQuestion() {
            isAnswering = false;
            const qData = questions[currentQIndex];
            const answerData = userAnswersStatus[currentQIndex]; // 可能為 null 或 {correct, selected}

            document.getElementById('progress-display').innerText = `關卡：${currentQIndex + 1} / ${questions.length}`;
            
            document.getElementById('question-container').innerHTML = `
                <div class="question-text">${qData.q}</div>
            `;

            const optsDiv = document.getElementById('options-container');
            optsDiv.innerHTML = '';
            
            // 選項隨機顯示，但每次進入保持隨機 (簡化邏輯)
            let shuffledOpts = [...qData.options];
            shuffledOpts.sort(() => Math.random() - 0.5);

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.innerHTML = '';

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                // 如果已經回答過
                if (answerData) {
                    btn.classList.add('disabled');
                    // 顯示正確答案
                    if (opt === qData.a) {
                        btn.classList.add('correct');
                    }
                    // 顯示玩家選的錯誤答案
                    if (!answerData.correct && opt === answerData.selected) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => checkAnswer(opt, qData.a, btn);
                }
                optsDiv.appendChild(btn);
            });

            if (answerData) {
                if (answerData.correct) {
                    feedbackArea.innerHTML = `<span style="color: green;">✔ 此題已答對</span>`;
                } else {
                    feedbackArea.innerHTML = `<span style="color: #b71c1c;">✘ 你的選擇: ${answerData.selected} (正解: ${qData.a})</span>`;
                }
            }

            // 更新按鈕
            document.getElementById('prev-btn').disabled = (currentQIndex === 0);
            const nextBtn = document.getElementById('next-btn');
            if (currentQIndex === questions.length - 1) {
                nextBtn.innerText = "查看結果 ❯";
            } else {
                nextBtn.innerText = "下一題 ❯";
            }
        }

        function checkAnswer(selected, correct, btn) {
            if (isAnswering || userAnswersStatus[currentQIndex]) return;
            isAnswering = true;

            const isCorrect = selected === correct;
            // 記錄詳細作答
            userAnswersStatus[currentQIndex] = {
                correct: isCorrect,
                selected: selected,
                qText: questions[currentQIndex].q, // 存下來方便後台顯示
                aText: correct
            };

            if (isCorrect) {
                playSound('correct');
                score += 10; 
                document.getElementById('score-display').innerText = score;
                btn.classList.add('correct');
                showCoin(btn);
                document.getElementById('feedback-area').innerHTML = `<span style="color: green;">✔ 答對了！</span>`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                Array.from(document.querySelectorAll('.option-btn')).forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
                document.getElementById('feedback-area').innerHTML = `<span style="color: #b71c1c;">✘ 正解是: ${correct}</span>`;
            }

            Array.from(document.querySelectorAll('.option-btn')).forEach(b => b.classList.add('disabled'));
            isAnswering = false; 
        }

        function prevQuestion() {
            if (currentQIndex > 0) { currentQIndex--; loadQuestion(); }
        }

        function nextQuestion() {
            if (currentQIndex < questions.length - 1) { currentQIndex++; loadQuestion(); }
            else { endGame(); }
        }

        function endGame() {
            showScreen('result-screen');
            document.getElementById('final-score').innerText = `本局賞金：$${score}`;
            
            let comment = "";
            if (score === 100) comment = "神槍手！百發百中！";
            else if (score >= 80) comment = "不錯的槍法，牛仔！";
            else if (score >= 60) comment = "還可以，但要再練練！";
            else comment = "回家再練練拔槍速度吧！";
            document.getElementById('final-comment').innerText = comment;

            saveScore(playerName, score);
            saveDetailedLog(playerName, score, userAnswersStatus); // 儲存詳細紀錄
            renderLeaderboard('leaderboard-body');
        }

        function showMainMenuLeaderboard() {
            showScreen('leaderboard-only-screen');
            renderLeaderboard('leaderboard-only-body');
        }

        function restartGame() {
            document.getElementById('player-name').value = "";
            showScreen('start-screen');
        }

        // --- 4. 儲存與排行榜 (LocalStorage) ---
        function saveScore(name, points) {
            let scores = getFromStorage(STORAGE_KEY_SCORE) || [];
            scores.push({ name: name, score: points, date: new Date().toISOString() });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10);
            localStorage.setItem(STORAGE_KEY_SCORE, JSON.stringify(scores));
        }

        // --- 5. 教師後台相關功能 ---
        function showAdminLogin() {
            showScreen('admin-login-screen');
            document.getElementById('admin-password').value = '';
        }

        function checkAdminPassword() {
            const pwd = document.getElementById('admin-password').value;
            if (pwd === "0822") {
                showAdminDashboard();
            } else {
                alert("密碼錯誤，請勿擅闖禁地！");
            }
        }

        function showAdminDashboard() {
            showScreen('admin-dashboard-screen');
            renderAdminLogs();
        }

        // 儲存詳細日誌
        function saveDetailedLog(name, score, answers) {
            let logs = getFromStorage(STORAGE_KEY_DETAILS) || [];
            logs.unshift({ // 新的在最前面
                id: Date.now(), // 唯一ID
                timestamp: new Date().toLocaleString(),
                name: name,
                score: score,
                details: answers // 陣列: {correct, selected, qText, aText}
            });
            // 限制筆數以免爆掉 (例如保留最近50筆)
            if (logs.length > 50) logs = logs.slice(0, 50);
            localStorage.setItem(STORAGE_KEY_DETAILS, JSON.stringify(logs));
        }

        function renderAdminLogs() {
            const tbody = document.getElementById('admin-log-body');
            tbody.innerHTML = '';
            const logs = getFromStorage(STORAGE_KEY_DETAILS) || [];

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">尚無遊玩紀錄</td></tr>';
                return;
            }

            logs.forEach(log => {
                // 主列
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${log.timestamp.split(' ')[1] || log.timestamp}</td>
                    <td style="font-weight:bold;">${escapeHtml(log.name)}</td>
                    <td>${log.score}</td>
                    <td><button class="btn btn-small" onclick="toggleDetails(${log.id})">詳情</button></td>
                `;
                tbody.appendChild(tr);

                // 詳情列 (隱藏)
                const detailTr = document.createElement('tr');
                detailTr.id = `detail-${log.id}`;
                detailTr.className = 'admin-details-row';
                
                let detailsHtml = '<div style="text-align:left; padding:10px; font-size:0.85rem;">';
                if(log.details) {
                    log.details.forEach((d, i) => {
                        if (!d) return; // 跳過沒作答的
                        const statusClass = d.correct ? 'tag-correct' : 'tag-wrong';
                        const statusText = d.correct ? '正確' : '錯誤';
                        detailsHtml += `
                            <div style="margin-bottom:5px; border-bottom:1px dotted #ccc; padding-bottom:2px;">
                                <span style="font-weight:bold; color:#5d4037;">Q${i+1}: ${d.qText}</span><br>
                                <span class="detail-tag ${statusClass}">${statusText}</span>
                                學生選: <b>${d.selected}</b> 
                                ${!d.correct ? `(正解: ${d.aText})` : ''}
                            </div>
                        `;
                    });
                } else {
                    detailsHtml += '無詳細資料';
                }
                detailsHtml += '</div>';

                detailTr.innerHTML = `<td colspan="4" style="background:#fff3e0;">${detailsHtml}</td>`;
                tbody.appendChild(detailTr);
            });
        }

        function toggleDetails(id) {
            const row = document.getElementById(`detail-${id}`);
            if (row) {
                row.classList.toggle('show');
            }
        }

        function exportData() {
            const logs = getFromStorage(STORAGE_KEY_DETAILS) || [];
            if(logs.length === 0) { alert("沒有資料可匯出"); return; }
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM for Excel
            csvContent += "時間,姓名,分數,題目,是否正確,學生答案,正確答案\n";
            
            logs.forEach(log => {
                if(log.details) {
                    log.details.forEach((d, i) => {
                        if(!d) return;
                        // 處理逗號以免CSV錯亂
                        const qSafe = d.qText.replace(/,/g, "，");
                        const selSafe = d.selected.replace(/,/g, "，");
                        const aSafe = d.aText.replace(/,/g, "，");
                        csvContent += `${log.timestamp},${log.name},${log.score},${qSafe},${d.correct?1:0},${selSafe},${aSafe}\n`;
                    });
                }
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "代數對決_答題紀錄.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearAllData() {
            if(confirm("警告：這將清除所有排行榜和答題紀錄，且無法復原！確定嗎？")) {
                localStorage.removeItem(STORAGE_KEY_SCORE);
                localStorage.removeItem(STORAGE_KEY_DETAILS);
                renderAdminLogs();
                alert("已清除所有資料");
            }
        }

        // --- 通用工具 ---
        function getFromStorage(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
        }

        function renderLeaderboard(targetId) {
            const tbody = document.getElementById(targetId);
            tbody.innerHTML = '';
            const scores = getFromStorage(STORAGE_KEY_SCORE) || [];
            
            if (scores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">目前沒有紀錄</td></tr>';
                return;
            }

            scores.forEach((s, index) => {
                const tr = document.createElement('tr');
                if (targetId === 'leaderboard-body' && s.name === playerName && s.score === score) {
                    tr.style.background = "#fff9c4"; 
                    tr.style.fontWeight = "bold";
                }
                tr.innerHTML = `<td>${index + 1}</td><td>${escapeHtml(s.name)}</td><td>$${s.score}</td>`;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(text) {
            if (!text) return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 音效
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); 
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); 
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'start') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function showCoin(el) {
            const rect = el.getBoundingClientRect();
            for(let i=0; i<3; i++) {
                const c = document.createElement('div');
                c.className = 'coin'; c.innerText = '💰';
                const offsetX = (Math.random() - 0.5) * 20;
                c.style.left = (rect.left + rect.width/2 + offsetX) + 'px'; 
                c.style.top = rect.top + 'px';
                c.style.animation = `coin-fly 0.8s ease-out forwards ${i * 0.1}s`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 1000);
            }
        }

        window.onload = () => { showScreen('start-screen'); };
    </script>
<script src="../progress.js"></script>
</body>
</html>
