<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一元一次不等式列式練習</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            /* 溫和的綠色底色，舒緩眼部壓力 */
        }

        /* 閃爍的高亮外框，引導特教生填答 */
        @keyframes pulse-highlight {

            0%,
            100% {
                border-color: #3b82f6;
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
                background-color: #eff6ff;
            }

            50% {
                border-color: #1d4ed8;
                box-shadow: 0 0 0 6px rgba(29, 78, 216, 0.6);
                background-color: #dbeafe;
            }
        }

        .active-slot {
            animation: pulse-highlight 1.5s infinite;
        }

        /* 卷動平滑效果 */
        .smooth-scroll {
            scroll-behavior: smooth;
        }

        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col smooth-scroll select-none">

    <!-- 頂部導覽列 (單元名稱、多題導覽、分數、計時器) -->
    <header
        class="bg-emerald-700 text-white shadow-md sticky top-0 z-50 px-4 py-2 flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span
                    class="bg-emerald-900 text-emerald-200 text-xs font-bold px-2.5 py-1 rounded-full uppercase">單元</span>
                <h1 class="text-lg md:text-xl font-bold tracking-wide">一元一次不等式列式</h1>
            </div>
            <!-- 行動版顯示分數與計時 -->
            <div class="flex items-center gap-3 md:hidden">
                <div class="bg-emerald-800 px-3 py-1 rounded-lg text-sm font-bold">
                    ⏱️ <span id="timer-mobile">07:00</span>
                </div>
                <div class="bg-emerald-800 px-3 py-1 rounded-lg text-sm font-bold">
                    得分: <span id="score-mobile">0</span>
                </div>
            </div>
        </div>

        <!-- 題目導覽按鈕 (可左右滑動) -->
        <div
            class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 px-1 bg-emerald-800/50 rounded-lg max-w-full md:max-w-[50%]">
            <div class="flex gap-1.5 flex-nowrap" id="nav-tabs-container">
                <!-- JS 動態生成題目分頁按鈕 -->
            </div>
        </div>

        <!-- 桌機版顯示分數與計時 -->
        <div class="hidden md:flex items-center gap-4">
            <div class="bg-emerald-900 px-4 py-2 rounded-xl flex items-center gap-2 font-black text-lg">
                <span class="text-emerald-300">⏱️ 時間剩餘:</span>
                <span id="timer-desktop">07:00</span>
            </div>
            <div class="bg-emerald-900 px-4 py-2 rounded-xl flex items-center gap-2 font-black text-lg">
                <span class="text-emerald-300">總得分:</span>
                <span id="score-desktop">0</span>
            </div>
        </div>
    </header>

    <!-- 題型判定提示欄 -->
    <div
        class="bg-emerald-100 text-emerald-800 text-center py-1 px-4 text-xs md:text-sm font-bold border-b border-emerald-200">
        💡 題型判定：一元一次不等式列式（將生活文字轉譯為數學不等號與關係式）
    </div>

    <!-- 主要內容區 (雙欄響應式排版) -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">

        <!-- 左側欄：題目固定顯示區 -->
        <section
            class="md:col-span-1 bg-white rounded-2xl p-6 shadow-md border-2 border-emerald-100 md:sticky md:top-20">
            <div class="flex items-center justify-between mb-4">
                <span class="bg-emerald-100 text-emerald-800 text-sm font-bold px-3 py-1 rounded-full"
                    id="question-id-label">
                    題目 1 / 5
                </span>
                <span class="text-gray-400 text-xs">圖形視覺輔助</span>
            </div>

            <!-- 題目內容 -->
            <div class="mb-6">
                <h2 class="text-sm text-gray-500 font-bold mb-2">【文字題幹】</h2>
                <div class="text-2xl font-black text-slate-800 leading-relaxed p-4 bg-amber-50 rounded-xl border border-amber-200"
                    id="question-text-container">
                    <!-- JS 動態帶入 -->
                </div>
            </div>

            <!-- 視覺化 SVG 輔助區 -->
            <div
                class="mb-4 bg-slate-50 rounded-xl p-4 border border-slate-200 flex flex-col items-center justify-center min-h-[160px]">
                <h3 class="text-xs text-gray-400 font-bold mb-2 self-start">概念圖像化引導：</h3>
                <div id="svg-visual-container" class="w-full flex justify-center">
                    <!-- JS 動態帶入 SVG 圖案 -->
                </div>
            </div>

            <div class="text-xs text-slate-500 bg-slate-100 p-3 rounded-lg leading-relaxed">
                <strong>特教小幫手：</strong>數線中，<strong>空心圓圈</strong>代表不包含該點；<strong>實心圓圈</strong>代表包含該點。天平中，往下傾斜的一端代表其數值較大。
            </div>
        </section>

        <!-- 右側欄：步驟式填答與解鎖流程 -->
        <section class="md:col-span-2 space-y-6" id="steps-container">
            <!-- JS 會根據當前題目動態生成步驟 -->
        </section>

    </main>

    <!-- 全關卡完成/時間到 彈出視窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div
            class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl text-center border-4 border-emerald-500 animate-bounce-short">
            <div
                class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner">
                🎉
            </div>
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-2" id="modal-title">太棒了！完成挑戰</h2>
            <p class="text-slate-600 font-medium mb-6" id="modal-subtitle">你已經成功列出所有不等式了！</p>

            <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100 grid grid-cols-2 gap-4">
                <div>
                    <span class="text-xs text-slate-400 block font-bold">⏱️ 花費時間</span>
                    <span class="text-xl font-black text-slate-700" id="modal-time-spent">0分0秒</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-bold">⭐ 最終得分</span>
                    <span class="text-xl font-black text-emerald-600" id="modal-final-score">0 / 18 分</span>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="restartGame()"
                    class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-xl transition-all shadow-md shadow-emerald-200">
                    🔄 再做一次
                </button>
                <button onclick="closeModal()"
                    class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-bold rounded-xl transition-all">
                    ❌ 關閉視窗
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 題目數據定義 (八題不等式) ---
        // 嚴格依據規則：選項順序在載入時動態打亂，且只使用題目中出現的文字、符號與概念。
        const QUESTIONS_DATA = [
            {
                id: 1,
                title: "第一題",
                rawText: "x 大於 5",
                highlightText: `<mark class="bg-yellow-200 px-1 rounded font-bold">x</mark> <mark class="bg-red-200 px-1.5 rounded font-bold">大於</mark> <mark class="bg-blue-200 px-1 rounded font-bold">5</mark>`,
                svgType: "numberLine",
                svgParams: { val: 5, direction: "right", inclusive: false },
                steps: [
                    {
                        desc: "找出「大於」所代表的數學符號：",
                        expected: [">"],
                        options: [">", "<", "≥", "≤"]
                    },
                    {
                        desc: "寫出完整的不等式：",
                        expected: ["x", ">", "5"],
                        options: ["x", ">", "5", "y", "<"]
                    }
                ]
            },
            {
                id: 2,
                title: "第二題",
                rawText: "－4a 比 7 大",
                highlightText: `<mark class="bg-yellow-200 px-1 rounded font-bold">－4a</mark> 比 <mark class="bg-blue-200 px-1 rounded font-bold">7</mark> <mark class="bg-red-200 px-1.5 rounded font-bold">大</mark>`,
                svgType: "balance",
                svgParams: { left: "－4a", right: "7", heavier: "left" },
                steps: [
                    {
                        desc: "「比...大」代表什麼不等號？",
                        expected: [">"],
                        options: [">", "<", "≥", "≤"]
                    },
                    {
                        desc: "寫出完整的不等式：",
                        expected: ["－4a", ">", "7"],
                        options: ["－4a", ">", "7", "4a", "<"]
                    }
                ]
            },
            {
                id: 3,
                title: "第三題",
                rawText: "3y－5 比 1 小",
                highlightText: `<mark class="bg-yellow-200 px-1 rounded font-bold">3y－5</mark> 比 <mark class="bg-blue-200 px-1 rounded font-bold">1</mark> <mark class="bg-red-200 px-1.5 rounded font-bold">小</mark>`,
                svgType: "balance",
                svgParams: { left: "3y－5", right: "1", heavier: "right" },
                steps: [
                    {
                        desc: "「比...小」代表什麼不等號？",
                        expected: ["<"],
                        options: [">", "<", "≥", "≤"]
                    },
                    {
                        desc: "寫出完整的不等式：",
                        expected: ["3y－5", "<", "1"],
                        options: ["3y－5", "<", "1", "3y", ">"]
                    }
                ]
            },
            {
                id: 4,
                title: "第四題",
                rawText: "x 不大於 －2",
                highlightText: `<mark class="bg-yellow-200 px-1 rounded font-bold">x</mark> <mark class="bg-red-200 px-1.5 rounded font-bold">不大於</mark> <mark class="bg-blue-200 px-1 rounded font-bold">－2</mark>`,
                svgType: "numberLine",
                svgParams: { val: -2, direction: "left", inclusive: true },
                steps: [
                    {
                        desc: "「不大於」代表什麼意思？",
                        expected: ["小於或等於"],
                        options: ["大於", "小於", "大於或等於", "小於或等於"]
                    },
                    {
                        desc: "「小於或等於」的不等號是哪一個？",
                        expected: ["≤"],
                        options: [">", "<", "≥", "≤"]
                    },
                    {
                        desc: "寫出完整的不等式：",
                        expected: ["x", "≤", "－2"],
                        options: ["x", "≤", "－2", "2", ">"]
                    }
                ]
            },
            {
                id: 5,
                title: "第五題",
                rawText: "－2x 小於或等於 5",
                highlightText: `<mark class="bg-yellow-200 px-1 rounded font-bold">－2x</mark> <mark class="bg-red-200 px-1.5 rounded font-bold">小於或等於</mark> <mark class="bg-blue-200 px-1 rounded font-bold">5</mark>`,
                svgType: "numberLine",
                svgParams: { val: 5, direction: "left", inclusive: true },
                steps: [
                    {
                        desc: "「小於或等於」對應的不等號是：",
                        expected: ["≤"],
                        options: [">", "<", "≥", "≤"]
                    },
                    {
                        desc: "寫出完整的不等式：",
                        expected: ["－2x", "≤", "5"],
                        options: ["－2x", "≤", "5", "2x", "≥"]
                    }
                ]
            },
        ];

        // --- 全局狀態變數 ---
        let currentQuestionIdx = 0;
        let secondsLeft = 420; // 7分鐘預設
        let timerInterval = null;
        let isGameOver = false;

        // 用於記錄學生的作答狀態
        // 結構: { questionId: { stepIdx: { filled: [val, val...], scoreEarned: true/false, checked: true, isCorrect: true/false, firstAttemptFailed: false } } }
        let gameState = {};

        // --- 音效生成器 (Web Audio API) ---
        // 不需要外部音效檔，完全原生合成，保障離線或任何環境都能正常發聲
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                // 清脆悅耳的和弦音
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.24); // G5
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.36); // C6
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'error') {
                // 短促的提示音，不刺耳
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                // 極輕微按鍵反饋音
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // --- 隨機打亂陣列函數 (Fisher-Yates Shuffle) ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- 初始化遊戲狀態 ---
        function initGameState() {
            gameState = {};
            QUESTIONS_DATA.forEach(q => {
                gameState[q.id] = {};
                q.steps.forEach((step, idx) => {
                    gameState[q.id][idx] = {
                        filled: Array(step.expected.length).fill(""),
                        scoreEarned: false,
                        isCorrect: false,
                        firstAttemptFailed: false
                    };
                });
            });
            secondsLeft = 420;
            isGameOver = false;
            currentQuestionIdx = 0;
        }

        // --- 計時器邏輯 ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    secondsLeft = 0;
                    isGameOver = true;
                    showFinishModal(true); // 時間到彈窗
                } else {
                    secondsLeft--;
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timer-desktop').innerText = formatted;
            document.getElementById('timer-mobile').innerText = formatted;
        }

        // --- 分數更新邏輯 ---
        function updateScoreDisplay() {
            let totalScore = 0;
            let totalStepsCount = 0;

            QUESTIONS_DATA.forEach(q => {
                q.steps.forEach((step, idx) => {
                    totalStepsCount++;
                    if (gameState[q.id][idx].scoreEarned) {
                        totalScore++;
                    }
                });
            });

            const scoreStr = `${totalScore}`;
            document.getElementById('score-desktop').innerText = scoreStr;
            document.getElementById('score-mobile').innerText = scoreStr;
            return { score: totalScore, total: totalStepsCount };
        }

        // --- 渲染導覽列 ---
        function renderNavigation() {
            const container = document.getElementById('nav-tabs-container');
            container.innerHTML = "";

            QUESTIONS_DATA.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `flex-shrink-0 px-4 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-1.5 ${currentQuestionIdx === idx
                        ? 'bg-amber-400 text-slate-900 shadow-md scale-105'
                        : 'bg-emerald-800 text-emerald-100 hover:bg-emerald-700'
                    }`;

                // 檢查該題是否全部步驟完成
                const isCompleted = q.steps.every((_, sIdx) => gameState[q.id][sIdx].isCorrect);
                const statusIcon = isCompleted ? '🟢' : '⚪';

                btn.innerHTML = `<span>${statusIcon}</span> <span>${q.title}</span>`;
                btn.onclick = () => {
                    playSound('click');
                    switchQuestion(idx);
                };
                container.appendChild(btn);
            });
        }

        // --- 切換題目 ---
        function switchQuestion(idx) {
            currentQuestionIdx = idx;
            renderNavigation();
            renderActiveQuestion();
        }

        // --- 繪製 SVG 概念圖形 ---
        function drawSvgVisual(q) {
            const container = document.getElementById('svg-visual-container');
            container.innerHTML = "";

            const svgNs = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNs, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "140");
            svg.setAttribute("viewBox", "0 0 400 140");
            svg.setAttribute("class", "max-w-xs md:max-w-md");

            if (q.svgType === "numberLine") {
                const { val, direction, inclusive } = q.svgParams;
                // 畫數線底線
                const line = document.createElementNS(svgNs, "line");
                line.setAttribute("x1", "20");
                line.setAttribute("y1", "80");
                line.setAttribute("x2", "380");
                line.setAttribute("y2", "80");
                line.setAttribute("stroke", "#94a3b8");
                line.setAttribute("stroke-width", "4");
                svg.appendChild(line);

                // 畫刻度
                const positions = [50, 120, 190, 260, 330];
                let labels = [];
                if (val === 5) labels = ["2", "3.5", "5", "6.5", "8"];
                else if (val === -2) labels = ["-4", "-3", "-2", "-1", "0"];
                else if (val === 6) labels = ["4", "5", "6", "7", "8"];

                positions.forEach((pos, i) => {
                    const tick = document.createElementNS(svgNs, "line");
                    tick.setAttribute("x1", pos);
                    tick.setAttribute("y1", "75");
                    tick.setAttribute("x2", pos);
                    tick.setAttribute("y2", "85");
                    tick.setAttribute("stroke", "#64748b");
                    tick.setAttribute("stroke-width", "2");
                    svg.appendChild(tick);

                    const txt = document.createElementNS(svgNs, "text");
                    txt.setAttribute("x", pos);
                    txt.setAttribute("y", "105");
                    txt.setAttribute("font-size", "14");
                    txt.setAttribute("font-weight", "bold");
                    txt.setAttribute("fill", "#475569");
                    txt.setAttribute("text-anchor", "middle");
                    txt.textContent = labels[i];
                    svg.appendChild(txt);
                });

                // 畫範圍指示紅綠線
                const arrowY = 45;
                const targetX = 190; // 中央對應 val
                const endX = direction === "right" ? 360 : 40;

                const rangeLine = document.createElementNS(svgNs, "line");
                rangeLine.setAttribute("x1", targetX);
                rangeLine.setAttribute("y1", arrowY);
                rangeLine.setAttribute("x2", endX);
                rangeLine.setAttribute("y2", arrowY);
                rangeLine.setAttribute("stroke", "#10b981");
                rangeLine.setAttribute("stroke-width", "5");
                svg.appendChild(rangeLine);

                // 畫連接虛線
                const dashLine = document.createElementNS(svgNs, "line");
                dashLine.setAttribute("x1", targetX);
                dashLine.setAttribute("y1", "80");
                dashLine.setAttribute("x2", targetX);
                dashLine.setAttribute("y2", arrowY);
                dashLine.setAttribute("stroke", "#10b981");
                dashLine.setAttribute("stroke-dasharray", "4,4");
                dashLine.setAttribute("stroke-width", "2");
                svg.appendChild(dashLine);

                // 箭頭
                const arrowHead = document.createElementNS(svgNs, "polygon");
                const points = direction === "right"
                    ? `${endX - 8},${arrowY - 6} ${endX},${arrowY} ${endX - 8},${arrowY + 6}`
                    : `${endX + 8},${arrowY - 6} ${endX},${arrowY} ${endX + 8},${arrowY + 6}`;
                arrowHead.setAttribute("points", points);
                arrowHead.setAttribute("fill", "#10b981");
                svg.appendChild(arrowHead);

                // 畫圈圈
                const circle = document.createElementNS(svgNs, "circle");
                circle.setAttribute("cx", targetX);
                circle.setAttribute("cy", arrowY);
                circle.setAttribute("r", "8");
                circle.setAttribute("fill", inclusive ? "#10b981" : "#ffffff");
                circle.setAttribute("stroke", "#10b981");
                circle.setAttribute("stroke-width", "3");
                svg.appendChild(circle);

            } else if (q.svgType === "balance") {
                const { left, right, heavier } = q.svgParams;
                // 天平中軸柱子
                const pillar = document.createElementNS(svgNs, "rect");
                pillar.setAttribute("x", "195");
                pillar.setAttribute("y", "70");
                pillar.setAttribute("width", "10");
                pillar.setAttribute("height", "45");
                pillar.setAttribute("fill", "#64748b");
                svg.appendChild(pillar);

                const base = document.createElementNS(svgNs, "polygon");
                base.setAttribute("points", "170,115 230,115 200,95");
                base.setAttribute("fill", "#475569");
                svg.appendChild(base);

                // 根據傾斜度計算桿子角度與兩端高度
                let angle = 0;
                let leftY = 65;
                let rightY = 65;

                if (heavier === "left") {
                    angle = 12;
                    leftY = 85;
                    rightY = 45;
                } else if (heavier === "right") {
                    angle = -12;
                    leftY = 45;
                    rightY = 85;
                } else if (heavier === "leftOrEqual") {
                    angle = 8;
                    leftY = 78;
                    rightY = 52;
                }

                // 天平橫桿
                const bar = document.createElementNS(svgNs, "line");
                bar.setAttribute("x1", "100");
                bar.setAttribute("y1", leftY);
                bar.setAttribute("x2", "300");
                bar.setAttribute("y2", rightY);
                bar.setAttribute("stroke", "#475569");
                bar.setAttribute("stroke-width", "6");
                svg.appendChild(bar);

                // 支點
                const pivot = document.createElementNS(svgNs, "circle");
                pivot.setAttribute("cx", "200");
                pivot.setAttribute("cy", "65");
                pivot.setAttribute("r", "6");
                pivot.setAttribute("fill", "#cbd5e1");
                pivot.setAttribute("stroke", "#475569");
                pivot.setAttribute("stroke-width", "2");
                svg.appendChild(pivot);

                // 左托盤
                const leftDish = document.createElementNS(svgNs, "path");
                leftDish.setAttribute("d", `M 70 ${leftY + 30} Q 100 ${leftY + 50} 130 ${leftY + 30}`);
                leftDish.setAttribute("fill", "none");
                leftDish.setAttribute("stroke", "#475569");
                leftDish.setAttribute("stroke-width", "4");
                svg.appendChild(leftDish);

                const leftString1 = document.createElementNS(svgNs, "line");
                leftString1.setAttribute("x1", "100"); leftString1.setAttribute("y1", leftY);
                leftString1.setAttribute("x2", "70"); leftString1.setAttribute("y2", leftY + 30);
                leftString1.setAttribute("stroke", "#94a3b8"); svg.appendChild(leftString1);

                const leftString2 = document.createElementNS(svgNs, "line");
                leftString2.setAttribute("x1", "100"); leftString2.setAttribute("y1", leftY);
                leftString2.setAttribute("x2", "130"); leftString2.setAttribute("y2", leftY + 30);
                leftString2.setAttribute("stroke", "#94a3b8"); svg.appendChild(leftString2);

                // 右托盤
                const rightDish = document.createElementNS(svgNs, "path");
                rightDish.setAttribute("d", `M 270 ${rightY + 30} Q 300 ${rightY + 50} 330 ${rightY + 30}`);
                rightDish.setAttribute("fill", "none");
                rightDish.setAttribute("stroke", "#475569");
                rightDish.setAttribute("stroke-width", "4");
                svg.appendChild(rightDish);

                const rightString1 = document.createElementNS(svgNs, "line");
                rightString1.setAttribute("x1", "300"); rightString1.setAttribute("y1", rightY);
                rightString1.setAttribute("x2", "270"); rightString1.setAttribute("y2", rightY + 30);
                rightString1.setAttribute("stroke", "#94a3b8"); svg.appendChild(rightString1);

                const rightString2 = document.createElementNS(svgNs, "line");
                rightString2.setAttribute("x1", "300"); rightString2.setAttribute("y1", rightY);
                rightString2.setAttribute("x2", "330"); rightString2.setAttribute("y2", rightY + 30);
                rightString2.setAttribute("stroke", "#94a3b8"); svg.appendChild(rightString2);

                // 左盤文字
                const leftTxt = document.createElementNS(svgNs, "text");
                leftTxt.setAttribute("x", "100");
                leftTxt.setAttribute("y", leftY + 20);
                leftTxt.setAttribute("font-size", "16");
                leftTxt.setAttribute("font-weight", "900");
                leftTxt.setAttribute("fill", "#0f172a");
                leftTxt.setAttribute("text-anchor", "middle");
                leftTxt.textContent = left;
                svg.appendChild(leftTxt);

                // 右盤文字
                const rightTxt = document.createElementNS(svgNs, "text");
                rightTxt.setAttribute("x", "300");
                rightTxt.setAttribute("y", rightY + 20);
                rightTxt.setAttribute("font-size", "16");
                rightTxt.setAttribute("font-weight", "900");
                rightTxt.setAttribute("fill", "#0f172a");
                rightTxt.setAttribute("text-anchor", "middle");
                rightTxt.textContent = right;
                svg.appendChild(rightTxt);

            } else if (q.svgType === "doubleLine") {
                const { min, max } = q.svgParams;
                // 畫數線底線
                const line = document.createElementNS(svgNs, "line");
                line.setAttribute("x1", "20");
                line.setAttribute("y1", "80");
                line.setAttribute("x2", "380");
                line.setAttribute("y2", "80");
                line.setAttribute("stroke", "#94a3b8");
                line.setAttribute("stroke-width", "4");
                svg.appendChild(line);

                // 刻度: 模擬由左至右分別為 -4, -2, 1.5, 5, 7
                const positions = [50, 120, 190, 260, 330];
                const labels = ["-4", "-2", "1.5", "5", "7"];

                positions.forEach((pos, i) => {
                    const tick = document.createElementNS(svgNs, "line");
                    tick.setAttribute("x1", pos);
                    tick.setAttribute("y1", "75");
                    tick.setAttribute("x2", pos);
                    tick.setAttribute("y2", "85");
                    tick.setAttribute("stroke", "#64748b");
                    tick.setAttribute("stroke-width", "2");
                    svg.appendChild(tick);

                    const txt = document.createElementNS(svgNs, "text");
                    txt.setAttribute("x", pos);
                    txt.setAttribute("y", "105");
                    txt.setAttribute("font-size", "14");
                    txt.setAttribute("font-weight", "bold");
                    txt.setAttribute("fill", "#475569");
                    txt.setAttribute("text-anchor", "middle");
                    txt.textContent = labels[i];
                    svg.appendChild(txt);
                });

                // 畫夾在中間的範圍綠線 (120 到 260)
                const arrowY = 45;
                const rangeLine = document.createElementNS(svgNs, "line");
                rangeLine.setAttribute("x1", "120");
                rangeLine.setAttribute("y1", arrowY);
                rangeLine.setAttribute("x2", "260");
                rangeLine.setAttribute("y2", arrowY);
                rangeLine.setAttribute("stroke", "#10b981");
                rangeLine.setAttribute("stroke-width", "5");
                svg.appendChild(rangeLine);

                // 兩條虛線連回數線
                const dash1 = document.createElementNS(svgNs, "line");
                dash1.setAttribute("x1", "120"); dash1.setAttribute("y1", "80");
                dash1.setAttribute("x2", "120"); dash1.setAttribute("y2", arrowY);
                dash1.setAttribute("stroke", "#10b981"); dash1.setAttribute("stroke-dasharray", "3,3");
                svg.appendChild(dash1);

                const dash2 = document.createElementNS(svgNs, "line");
                dash2.setAttribute("x1", "260"); dash2.setAttribute("y1", "80");
                dash2.setAttribute("x2", "260"); dash2.setAttribute("y2", arrowY);
                dash2.setAttribute("stroke", "#10b981"); dash2.setAttribute("stroke-dasharray", "3,3");
                svg.appendChild(dash2);

                // 畫兩個開口圈圈
                const c1 = document.createElementNS(svgNs, "circle");
                c1.setAttribute("cx", "120"); c1.setAttribute("cy", arrowY);
                c1.setAttribute("r", "7"); c1.setAttribute("fill", "#ffffff");
                c1.setAttribute("stroke", "#10b981"); c1.setAttribute("stroke-width", "3");
                svg.appendChild(c1);

                const c2 = document.createElementNS(svgNs, "circle");
                c2.setAttribute("cx", "260"); c2.setAttribute("cy", arrowY);
                c2.setAttribute("r", "7"); c2.setAttribute("fill", "#ffffff");
                c2.setAttribute("stroke", "#10b981"); c2.setAttribute("stroke-width", "3");
                svg.appendChild(c2);

                // 標記x位置
                const xTxt = document.createElementNS(svgNs, "text");
                xTxt.setAttribute("x", "190");
                xTxt.setAttribute("y", "35");
                xTxt.setAttribute("font-size", "14");
                xTxt.setAttribute("font-weight", "black");
                xTxt.setAttribute("fill", "#047857");
                xTxt.setAttribute("text-anchor", "middle");
                xTxt.textContent = "主角 x 的範圍";
                svg.appendChild(xTxt);
            }

            container.appendChild(svg);
        }

        // --- 渲染當前選定的題目 ---
        function renderActiveQuestion() {
            const q = QUESTIONS_DATA[currentQuestionIdx];

            // 更新左側題目資訊
            document.getElementById('question-id-label').innerText = `題目 ${q.id} / ${QUESTIONS_DATA.length}`;
            document.getElementById('question-text-container').innerHTML = q.highlightText;
            drawSvgVisual(q);

            // 渲染右側步驟
            const stepsContainer = document.getElementById('steps-container');
            stepsContainer.innerHTML = "";

            q.steps.forEach((step, sIdx) => {
                const stepState = gameState[q.id][sIdx];

                // 判斷步驟的可見性：當前步驟已解鎖，或是前面步驟皆已完成，才可看見
                let isUnlocked = sIdx === 0;
                if (sIdx > 0) {
                    isUnlocked = gameState[q.id][sIdx - 1].isCorrect;
                }

                if (!isUnlocked) return; // 未解鎖則不呈現

                // 步驟主容器
                const stepCard = document.createElement('div');
                stepCard.id = `step-card-${q.id}-${sIdx}`;
                stepCard.className = `bg-white rounded-2xl p-5 shadow-sm border-2 transition-all duration-500 ease-out flex flex-col gap-4 ${stepState.isCorrect
                        ? 'border-emerald-500 bg-emerald-50/30'
                        : 'border-slate-100 shadow'
                    }`;

                // 步驟標題區
                const headerDiv = document.createElement('div');
                headerDiv.className = "flex items-center justify-between border-b border-slate-100 pb-2";
                headerDiv.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 text-xs font-black rounded-lg ${stepState.isCorrect ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white'
                    }">步驟 ${sIdx + 1}</span>
            <span class="font-bold text-slate-700 text-base">${step.desc}</span>
          </div>
          ${stepState.isCorrect ? '<span class="text-emerald-600 font-extrabold flex items-center gap-1">✔ 已完成</span>' : ''}
        `;
                stepCard.appendChild(headerDiv);

                // 填答格區域 (Slots)
                const slotWrapper = document.createElement('div');
                slotWrapper.className = "flex flex-wrap items-center gap-3 my-2 justify-start";

                stepState.filled.forEach((val, valIdx) => {
                    const slot = document.createElement('div');
                    slot.id = `slot-${q.id}-${sIdx}-${valIdx}`;

                    // 基本與高亮樣式
                    let slotClass = "min-w-[4rem] px-4 h-14 rounded-xl font-black text-xl flex items-center justify-center border-2 transition-all cursor-pointer select-none ";

                    if (stepState.isCorrect) {
                        slotClass += "bg-emerald-100 border-emerald-500 text-emerald-800";
                    } else {
                        // 尋找當前最前面未填的格子
                        const firstEmptyIdx = stepState.filled.indexOf("");
                        if (val === "") {
                            if (valIdx === firstEmptyIdx) {
                                // 當前填答目標高亮
                                slotClass += "active-slot border-blue-500 text-blue-700 shadow-md";
                            } else {
                                slotClass += "bg-slate-100 border-dashed border-slate-300 text-transparent hover:bg-slate-200";
                            }
                        } else {
                            slotClass += "bg-white border-blue-400 text-blue-600 shadow-sm hover:border-red-400 hover:text-red-500 hover:bg-red-50";
                        }
                    }

                    slot.className = slotClass;
                    slot.textContent = val || "?";

                    // 清空機制：點擊已填寫內容，該格清空
                    if (!stepState.isCorrect && val !== "") {
                        slot.onclick = (e) => {
                            e.stopPropagation();
                            playSound('click');
                            stepState.filled[valIdx] = "";
                            renderActiveQuestion();
                        };
                    } else if (!stepState.isCorrect && val === "") {
                        // 防跳格填寫：若點擊的是空的，將焦點鎖定在首個空位
                        slot.onclick = () => {
                            playSound('click');
                            const firstEmpty = stepState.filled.indexOf("");
                            if (firstEmpty !== -1 && firstEmpty !== valIdx) {
                                const target = document.getElementById(`slot-${q.id}-${sIdx}-${firstEmpty}`);
                                if (target) {
                                    target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                                }
                            }
                        };
                    }

                    slotWrapper.appendChild(slot);
                });
                stepCard.appendChild(slotWrapper);

                // 顯示選項按鈕區：若未完成則呈現，已完成則隱藏使版面乾淨
                if (!stepState.isCorrect) {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = "bg-slate-50 rounded-xl p-3 border border-slate-100 flex flex-wrap gap-2.5 justify-start";

                    // 動態打亂選項順序（每個步驟第一次渲染時決定一次）
                    if (!step.shuffledOptions) {
                        step.shuffledOptions = shuffleArray(step.options);
                    }

                    step.shuffledOptions.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.type = 'button';
                        optBtn.className = "px-5 py-2.5 bg-white border border-slate-200 hover:border-blue-400 text-slate-800 hover:text-blue-600 font-bold text-lg rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95";
                        optBtn.textContent = opt;
                        optBtn.onclick = () => {
                            playSound('click');
                            fillNextSlot(q.id, sIdx, opt);
                        };
                        optionsDiv.appendChild(optBtn);
                    });
                    stepCard.appendChild(optionsDiv);

                    // 檢查答案按鈕 + 提示資訊
                    const controlDiv = document.createElement('div');
                    controlDiv.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2";

                    const helpMsg = document.createElement('span');
                    helpMsg.className = "text-xs text-amber-600 font-bold";
                    helpMsg.textContent = "⚠️ 點擊已填入的格子即可清除。確認沒問題就按下檢查吧！";

                    const checkBtn = document.createElement('button');
                    checkBtn.type = 'button';
                    checkBtn.className = "px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-sm rounded-xl transition-all shadow-md shadow-emerald-100 self-end sm:self-auto";
                    checkBtn.textContent = "🔍 檢查答案";
                    checkBtn.onclick = () => checkStepAnswer(q.id, sIdx);

                    controlDiv.appendChild(helpMsg);
                    controlDiv.appendChild(checkBtn);
                    stepCard.appendChild(controlDiv);
                }

                // 錯誤反饋提示區
                if (stepState.checked && !stepState.isCorrect) {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = "bg-rose-50 text-rose-800 border-2 border-rose-200 rounded-xl p-3 flex items-center gap-2 font-bold text-sm animate-pulse";
                    alertDiv.innerHTML = `<span>🤔 再想想看喔！加油，一定可以寫對的！</span>`;
                    stepCard.appendChild(alertDiv);
                }

                stepsContainer.appendChild(stepCard);
            });
        }

        // --- 點擊選項填入空格 ---
        function fillNextSlot(qId, sIdx, val) {
            const stepState = gameState[qId][sIdx];
            const emptyIdx = stepState.filled.indexOf("");
            if (emptyIdx !== -1) {
                stepState.filled[emptyIdx] = val;
                renderActiveQuestion();
            }
        }

        // --- 檢查步驟答案 ---
        function checkStepAnswer(qId, sIdx) {
            const q = QUESTIONS_DATA.find(x => x.id === qId);
            const step = q.steps[sIdx];
            const stepState = gameState[qId][sIdx];

            // 檢查是否填滿
            if (stepState.filled.includes("")) {
                alert("請填滿所有空格再檢查喔！");
                return;
            }

            stepState.checked = true;
            let allCorrect = true;

            for (let i = 0; i < step.expected.length; i++) {
                if (stepState.filled[i] !== step.expected[i]) {
                    allCorrect = false;
                    break;
                }
            }

            if (allCorrect) {
                playSound('success');
                stepState.isCorrect = true;

                // 計分規則：第一次就答對才給分；若之前答錯過一次，該步不能得分
                if (!stepState.firstAttemptFailed) {
                    stepState.scoreEarned = true;
                }

                updateScoreDisplay();
                renderNavigation();
                renderActiveQuestion();

                // 檢查此題是否完成，若完成則看是否有下一個步驟、或是提示轉到下一題
                const nextStepExists = sIdx + 1 < q.steps.length;
                if (nextStepExists) {
                    // 平滑滾動到下一步驟
                    setTimeout(() => {
                        const nextCard = document.getElementById(`step-card-${qId}-${sIdx + 1}`);
                        if (nextCard) {
                            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 300);
                } else {
                    // 該題全部步驟已完成
                    // 檢查是否所有題目都完成了
                    const allQuestionsDone = QUESTIONS_DATA.every(qObj =>
                        qObj.steps.every((_, sIndex) => gameState[qObj.id][sIndex].isCorrect)
                    );

                    if (allQuestionsDone) {
                        clearInterval(timerInterval);
                        isGameOver = true;
                        setTimeout(() => showFinishModal(false), 500); // 正常破關
                    } else {
                        // 自動跳到下一題
                        setTimeout(() => {
                            if (currentQuestionIdx + 1 < QUESTIONS_DATA.length) {
                                switchQuestion(currentQuestionIdx + 1);
                            }
                        }, 1000);
                    }
                }
            } else {
                playSound('error');
                stepState.isCorrect = false;
                stepState.firstAttemptFailed = true; // 標記為失敗過，此步驟已無法得分
                renderActiveQuestion();
            }
        }

        // --- 彈出完成視窗 ---
        function showFinishModal(isTimeUp) {
            const modal = document.getElementById('finish-modal');
            const title = document.getElementById('modal-title');
            const subtitle = document.getElementById('modal-subtitle');
            const timeSpent = document.getElementById('modal-time-spent');
            const finalScore = document.getElementById('modal-final-score');

            const scoreInfo = updateScoreDisplay();

            if (isTimeUp) {
                title.innerText = "⏳ 時間到了！";
                subtitle.innerText = "沒關係，我們再接再厲，多練習幾次會更熟練！";
                timeSpent.innerText = "7 分 0 秒";
            } else {
                title.innerText = "🎉 挑戰成功！";
                subtitle.innerText = "做得太棒了！所有的不等式你都順利完成了！";
                const totalSeconds = 420 - secondsLeft;
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                timeSpent.innerText = `${mins}分${secs}秒`;
            }

            finalScore.innerText = `${scoreInfo.score} / ${scoreInfo.total} 分`;
            modal.classList.remove('hidden');
        }

        function restartGame() {
            initGameState();
            startTimer();
            updateScoreDisplay();
            switchQuestion(0);
            document.getElementById('finish-modal').classList.add('hidden');
        }

        function closeModal() {
            document.getElementById('finish-modal').classList.add('hidden');
        }

        // --- 視窗載入啟動器 ---
        window.onload = () => {
            initGameState();
            startTimer();
            updateScoreDisplay();
            switchQuestion(0);
        };
    </script>
</body>

</html>
