<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空間幾何學堂：平行線與截線角</title>
    <link rel="icon" type="image/png" href="../images/dog.png"> <!-- 放置你的小圖案 -->
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap"

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .angle-sector {
            transition: fill 0.3s ease, opacity 0.3s ease;
        }

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導航欄 -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-lg">

                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">平行線與截線角探索器</h1>
                    <p class="text-xs text-indigo-100">同位角 • 內錯角 • 同側內角 性質視覺化教學</p>
                </div>
            </div>

        <!-- 左側：幾何畫布與控制區 (佔 7 格) -->

            <!-- 幾何畫布卡片 -->
            <div

                <!-- 頂部狀態列 -->
                <div class="flex justify-between items-center mb-3">
                    <span

                    <div id="parallel-badge"
                        class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all duration-300">
                        <!-- 動態插入 -->
                    </div>
                </div>

                <!-- SVG 幾何畫布 -->
                <div
                    class="bg-slate-900 rounded-xl overflow-hidden shadow-inner aspect-[4/3] flex items-center justify-center relative">
                    <svg id="geo-svg" class="w-full h-full" viewBox="0 0 600 400">
                        <!-- 定義網格與濾鏡 -->
                        <defs>
                            <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)"
                                    stroke-width="1" />
                            </pattern>
                        </defs>
                        <!-- 網格背景 -->
                        <rect width="100%" height="100%" fill="url(#grid)" />

                        <!-- 角度扇形區域 (將在 JS 中動態生成) -->
                        <g id="angles-layer"></g>

                        <!-- 幾何線條 -->
                        <!-- L1 線 -->
                        <line id="line-l1" x1="50" y1="120" x2="550" y2="120" stroke="#f43f5e" stroke-width="4"
                            stroke-linecap="round" />
                        <!-- L2 線 -->
                        <line id="line-l2" x1="50" y1="280" x2="550" y2="280" stroke="#0ea5e9" stroke-width="4"
                            stroke-linecap="round" />
                        <!-- 截線 M -->
                        <line id="line-m" x1="300" y1="40" x2="300" y2="360" stroke="#fbbf24" stroke-width="4"
                            stroke-linecap="round" />

                        <!-- 線條標記文字 -->
                        <text x="70" y="110" fill="#f43f5e" font-weight="bold" font-size="16">L₁</text>
                        <text x="70" y="270" fill="#0ea5e9" font-weight="bold" font-size="16">L₂</text>
                        <text id="label-m" x="320" y="55" fill="#fbbf24" font-weight="bold" font-size="16">截線 M</text>

                        <!-- 角度數字標籤 (在 JS 中定位) -->
                        <g id="labels-layer"></g>
                    </svg>
                </div>

                <!-- 畫布下方的微互動說明 -->
                <p class="text-xs text-slate-400 mt-2 text-center">💡 拖曳下方滑桿，觀察角度變化！</p>
            </div>

            <!-- 控制面板卡片 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 flex flex-col gap-4">
                <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm border-b pb-2">
                    <span>🛠️ 幾何控制台</span>
                </h3>

                <!-- 平行開關 -->
                <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <span class="text-sm font-bold text-slate-700 block">平行線開關</span>
                        <span class="text-xs text-slate-400">開啟：L₁ 與 L₂ 保持平行</span>
                    </div>
                    <button id="btn-toggle-parallel" onclick="toggleParallel()"
                        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 bg-indigo-600">
                        <span id="toggle-circle"
                            class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
                    </button>
                </div>

                <!-- 滑桿控制 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 截線角度滑桿 -->
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between text-xs font-bold text-slate-500">
                            <span>📐 截線 M 角度</span>
                            <span id="val-m-angle" class="text-indigo-600 font-mono">75°</span>
                        </div>
                        <input id="slider-m-angle" type="range" min="45" max="135" value="75" oninput="updateGeometry()"
                            class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>

                    <!-- L2 傾斜度滑桿 (非平行時可用) -->
                    <div id="tilt-control"

                        <div class="flex justify-between text-xs font-bold text-slate-500">
                            <span>📉 L₂ 傾斜角度</span>
                            <span id="val-tilt-angle" class="text-rose-500 font-mono">0°</span>
                        </div>
                        <input id="slider-tilt-angle" type="range" min="-25" max="25" value="0"
                            oninput="updateGeometry()"

                    </div>
                </div>
            </div>
        </section>

        <!-- 右側：教學說明 / 互動問答區 (佔 5 格) -->

                    <!-- 定義說明區 (極簡文字) -->
                    <div id="rel-definition"

                        <!-- 動態插入 -->

                    <!-- 組別選擇切換 -->
                    <div class="flex flex-col gap-2">

                        <div class="flex items-center justify-around">

                                <span id="live-angle-a-name"

                                </div>

                                <!--動態-->
                            </div>
                            <div class="text-center">
                                <span id="live-angle-b-name"
                                    class="inline-block px-2 py-0.5 rounded text-xs font-bold text-white mb-1"><!--動態--></span>
                                <div id="live-angle-b-val" class="text-2xl font-black text-slate-700 font-mono">
                                    <!--動態-->
                                </div>
                            </div>
                        </div>

                        <!-- 性質總結提示 -->
                        <div id="property-summary-box" class="mt-2 text-center text-xs py-2 px-3 rounded-lg font-bold">
                            <!-- 動態插入 -->
                        </div>
                    </div>

                    <!-- 圓餅圖比例（極致可視化，直覺互補或相等關係） -->
                    <div class="border border-slate-100 rounded-xl p-4 flex flex-col items-center justify-center gap-2">
                        <span class="text-xs font-bold text-slate-400 self-start">💡 幾何直覺圖解</span>
                        <div class="flex items-center gap-6">
                            <svg id="visual-helper-svg" class="w-24 h-24" viewBox="0 0 100 100">
                                <!-- 動態繪製扇形比例 -->
                            </svg>
                            <div id="visual-helper-desc" class="text-xs text-slate-500 leading-relaxed max-w-[180px]">
                                <!-- 動態文字 -->
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- 挑戰任務分頁 -->
            <div id="panel-quiz" class="flex flex-col gap-4 hidden">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 flex flex-col gap-4">
                    <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">🎯 幾何挑戰賽</h2>
                            <p class="text-xs text-slate-400 mt-0.5">一邊挑戰一邊熟練性質吧！</p>
                        </div>
                        <!-- 得分板 -->

                    <!-- 題目區 -->
                    <div id="quiz-question-container" class="flex flex-col gap-4">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <span id="quiz-type-badge"
                                class="inline-block bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold mb-2">題型挑戰</span>
                            <p id="quiz-question-text" class="text-sm font-bold text-slate-700 leading-relaxed">
                                正在生成題目...
                            </p>
                        </div>

                        <!-- 選項列表 -->
                        <div id="quiz-options" class="flex flex-col gap-2">
                            <!-- 動態插入選項 -->
                        </div>

                        <!-- 回饋訊息框 -->
                        <div id="quiz-feedback"
                            class="hidden p-3 rounded-xl text-center text-xs font-bold transition-all duration-300">
                            <!-- 動態回饋 -->
                        </div>

                        <!-- 下一題按鈕 -->
                        <button id="btn-next-question" onclick="nextQuestion()"
                            class="hidden w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg text-sm">

    <!-- 底部版權 -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
        <p class="mb-1">SPEDMIX 特教與資訊結合教學素材系列 • 專為視覺化學習設計</p>
        <p>© 2026 Chuone 製作。保留所有權利。</p>
    </footer>

    <!-- 音效產生器與核心邏輯 -->
    <script>
        // ---------------------------------
        // 1. 全域狀態
        // ---------------------------------
        let isParallel = true;
        let transversalAngle = 75; // 截線與水平的夾角 (度數)
        let line2Tilt = 0;          // L2 傾斜角度 (度數，非平行時有效)

        // 當前探索的角關係類型
        let currentRel = 'corresponding';
        let currentPairIdx = 0; // 當前選擇的配對索引

        // 答題遊戲狀態
        let quizScore = 0;
        let currentQuestion = null;

        // 定義 8 個角的配色 (讓特教學生更容易做視覺配對)
        // 顏色定義：紅、橙、黃、綠、藍、靛、紫、灰
        const angleColors = {
            1: '#EC4899', // 桃紅
            2: '#F59E0B', // 橙
            3: '#10B981', // 綠
            4: '#6366F1', // 靛藍
            5: '#EC4899', // 桃紅
            6: '#F59E0B', // 橙
            7: '#10B981', // 綠
            8: '#6366F1', // 靛藍
        };

        // 關係定義表
        const relationsData = {
            corresponding: {
                title: '同位角',
                subtitle: '位置相同的角',
                definition: '截線與兩直線相交，位於<b>截線同側、相同方向</b>（如都在左上）的兩個角，稱為「同位角」。',
                pairs: [
                    { a: 1, b: 5, label: '左上組 (∠1 與 ∠5)' },
                    { a: 2, b: 6, label: '右上組 (∠2 與 ∠6)' },
                    { a: 3, b: 7, label: '左下組 (∠3 與 ∠7)' },
                    { a: 4, b: 8, label: '右下組 (∠4 與 ∠8)' }
                ],
                type: 'equal' // 性質：平行時相等
            },
            alternate: {
                title: '內錯角',
                subtitle: '在兩線內部、截線兩側相反位置的角',
                definition: '「內」指在 L₁ 與 L₂ <b>之間</b>；「錯」指在截線 M 的<b>兩側（左右錯開）</b>。這兩個角稱為「內錯角」。',
                pairs: [
                    { a: 3, b: 6, label: '配對一 (∠3 與 ∠6)' },
                    { a: 4, b: 5, label: '配對二 (∠4 與 ∠5)' }
                ],
                type: 'equal' // 性質：平行時相等
            },
            sameside: {
                title: '同側內角',
                subtitle: '在兩線內部、截線同側的角',
                definition: '「內」指在 L₁ 與 L₂ <b>之間</b>；「同側」指在截線 M 的<b>同一側（同左或同右）</b>。平行時，兩角相加等於 180°。',
                pairs: [
                    { a: 3, b: 5, label: '左側內角組 (∠3 與 ∠5)' },
                    { a: 4, b: 6, label: '右側內角組 (∠4 與 ∠6)' }
                ],
                type: 'supplementary' // 性質：平行時互補
            }
        };

        // ---------------------------------
        // 2. 初始化與事件綁定
        // ---------------------------------
        window.onload = function () {
            // 初始化幾何與面板
            updateGeometry();
            selectRelationship('corresponding');
            generateQuizQuestion();
        };

        // ---------------------------------
        // 3. 幾何核心運算
        // ---------------------------------
        function updateGeometry() {
            // 讀取滑桿數值
            transversalAngle = parseFloat(document.getElementById('slider-m-angle').value);
            document.getElementById('val-m-angle').innerText = `${transversalAngle}°`;

            if (!isParallel) {
                line2Tilt = parseFloat(document.getElementById('slider-tilt-angle').value);
                document.getElementById('val-tilt-angle').innerText = `${line2Tilt}°`;
            } else {
                line2Tilt = 0;
                document.getElementById('val-tilt-angle').innerText = `0°`;
            }

            // 1. 設置 L1 幾何 (L1 始終水平，高度 y=120)
            const y1 = 120;

            // 2. 設置 L2 幾何 (L2 在 y=280 處。若傾斜，繞著軸點 (300, 280) 旋轉)
            const y2_pivot = 280;
            const tiltRad = (line2Tilt * Math.PI) / 180;

            const l2_x1 = 50;
            const l2_y1 = y2_pivot + (l2_x1 - 300) * Math.sin(tiltRad);
            const l2_x2 = 550;
            const l2_y2 = y2_pivot + (l2_x2 - 300) * Math.sin(tiltRad);

            document.getElementById('line-l2').setAttribute('x1', l2_x1);
            document.getElementById('line-l2').setAttribute('y1', l2_y1);
            document.getElementById('line-l2').setAttribute('x2', l2_x2);
            document.getElementById('line-l2').setAttribute('y2', l2_y2);

            // 3. 截線 M 幾何 (繞中心點 (300, 200) 旋轉)
            // 用截線夾角 beta (transversalAngle) 來求
            const betaRad = (transversalAngle * Math.PI) / 180;

            // 我們讓截線 M 在 y=40 到 y=360 之間
            // x(y) = 300 + (y - 200) / tan(betaRad)
            const m_y1 = 40;
            const m_y2 = 360;
            const m_x1 = 300 + (m_y1 - 200) / Math.tan(betaRad);
            const m_x2 = 300 + (m_y2 - 200) / Math.tan(betaRad);

            document.getElementById('line-m').setAttribute('x1', m_x1);
            document.getElementById('line-m').setAttribute('y1', m_y1);
            document.getElementById('line-m').setAttribute('x2', m_x2);
            document.getElementById('line-m').setAttribute('y2', m_y2);

            // 4. 計算交點
            // 交點 P1 (L1 與 M)
            const p1_y = 120;
            const p1_x = 300 + (p1_y - 200) / Math.tan(betaRad);

            // 交點 P2 (L2 與 M)
            // L2 點斜式: y - 280 = tan(tiltRad) * (x - 300) -> -tan(tiltRad)*x + y = 280 - 300*tan(tiltRad)
            // M 點斜式: 以 (p1_x, p1_y) 與 betaRad 決定
            // 這裡計算 P2 的精確坐標：
            let p2_x, p2_y;
            if (isParallel) {
                p2_y = 280;
                p2_x = 300 + (p2_y - 200) / Math.tan(betaRad);
            } else {
                // 利用參數式：M(t) = (300 + t * cos(betaRad), 200 + t * sin(betaRad))
                // 帶入 L2 方程式: y(t) - 280 = tan(tiltRad) * (x(t) - 300)
                // 200 + t*sin(beta) - 280 = tan(tilt) * (t*cos(beta))
                // t * (sin(beta) - tan(tilt)*cos(beta)) = 80
                const t = 80 / (Math.sin(betaRad) - Math.tan(tiltRad) * Math.cos(betaRad));
                p2_x = 300 + t * Math.cos(betaRad);
                p2_y = 200 + t * Math.sin(betaRad);
            }

            // 5. 角度值運算
            // L1 水平：上交點的基礎夾角為 beta (transversalAngle)
            const deg_upper = transversalAngle;
            // L2 的基礎夾角為 beta - line2Tilt
            const deg_lower = transversalAngle - line2Tilt;

            // 8 個角的具體度數
            const angles = {
                1: deg_upper,                  // 左上 (鈍/銳)
                2: 180 - deg_upper,            // 右上 (銳/鈍)
                3: 180 - deg_upper,            // 左下 (銳/鈍)
                4: deg_upper,                  // 右下 (鈍/銳)
                5: deg_lower,                  // 左上 (下)
                6: 180 - deg_lower,            // 右上 (下)
                7: 180 - deg_lower,            // 左下 (下)
                8: deg_lower                   // 右下 (下)
            };

            // 渲染角弧度
            drawAngleSectors(p1_x, p1_y, p2_x, p2_y, betaRad, tiltRad, angles);

            // 更新即時數據面板
            updateLivePanel(angles);
        }

        // ---------------------------------
        // 4. 動態繪製 SVG 角弧與標籤
        // ---------------------------------
        function drawAngleSectors(p1_x, p1_y, p2_x, p2_y, betaRad, tiltRad, angles) {
            const anglesLayer = document.getElementById('angles-layer');
            const labelsLayer = document.getElementById('labels-layer');
            anglesLayer.innerHTML = '';
            labelsLayer.innerHTML = '';

            const radius = 38; // 扇形半徑
            const labelRadius = 55; // 標籤離交點的半徑距離

            // 獲取當前所選配對的角 ID
            const activePair = relationsData[currentRel].pairs[currentPairIdx];
            const activeA = activePair ? activePair.a : -1;
            const activeB = activePair ? activePair.b : -1;

            // 定義 8 個角的弧起點與終點 (利用極坐標度數)
            // 這裡的角度為 SVG 的絕對極坐標 (X軸正向為 0, 順時針增加)
            // 由於 L1 是水平，L1 左右射線分別為 180° 與 0°/360°。
            // 截線 M 射線為 betaRad (向下) 還有 betaRad + Math.PI (向上)
            const betaDeg = (betaRad * 180) / Math.PI;
            const tiltDeg = (tiltRad * 180) / Math.PI;

            // 上交點 4 個角定義 [角名, 起始角度, 結束角度]
            // 1 (左上): 180 到 180+beta
            // 2 (右上): 180+beta 到 360
            // 3 (左下): beta 到 180
            // 4 (右下): 0 到 beta
            const upperSectors = [
                { id: 1, start: 180, end: 180 + betaDeg },
                { id: 2, start: 180 + betaDeg, end: 360 },
                { id: 3, start: betaDeg, end: 180 },
                { id: 4, start: 0, end: betaDeg }
            ];

            // 下交點 4 個角定義 (需考慮 L2 的傾斜度 tiltDeg)
            // 5 (左上): 180+tilt 到 180+beta
            // 6 (右上): 180+beta 到 360+tilt
            // 7 (左下): beta 到 180+tilt
            // 8 (右下): tilt 到 beta
            const lowerSectors = [
                { id: 5, start: 180 + tiltDeg, end: 180 + betaDeg },
                { id: 6, start: 180 + betaDeg, end: 360 + tiltDeg },
                { id: 7, start: betaDeg, end: 180 + tiltDeg },
                { id: 8, start: tiltDeg, end: betaDeg }
            ];

            const allSectors = [...upperSectors, ...lowerSectors];

            allSectors.forEach(sec => {
                const cx = sec.id <= 4 ? p1_x : p2_x;
                const cy = sec.id <= 4 ? p1_y : p2_y;

                // 判斷是否為當前點亮角
                const isActive = (sec.id === activeA || sec.id === activeB);
                let fillCol = 'rgba(255, 255, 255, 0.08)'; // 預設微弱灰色
                let strokeCol = 'rgba(255, 255, 255, 0.2)';
                let strokeWidth = '1';

                if (isActive) {
                    fillCol = angleColors[sec.id] + '77'; // 半透明高亮
                    strokeCol = angleColors[sec.id];
                    strokeWidth = '2.5';
                }

                // 繪製扇形
                const pathData = getSectorPath(cx, cy, radius, sec.start, sec.end);
                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', pathData);
                pathEl.setAttribute('fill', fillCol);
                pathEl.setAttribute('stroke', strokeCol);
                pathEl.setAttribute('stroke-width', strokeWidth);
                pathEl.setAttribute('class', 'angle-sector');
                anglesLayer.appendChild(pathEl);

                // 計算角平分線位置，用來動態放置 1-8 數字標籤 (避免與線條重疊)
                let midAngleDeg = (sec.start + sec.end) / 2;
                // 修正跨越 360 度的情況
                if (sec.start > sec.end) {
                    midAngleDeg = (sec.start + (sec.end + 360)) / 2;
                }
                const midRad = (midAngleDeg * Math.PI) / 180;

                const tx = cx + labelRadius * Math.cos(midRad);
                const ty = cy + labelRadius * Math.sin(midRad);

                // 建立文字標籤
                const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textEl.setAttribute('x', tx);
                textEl.setAttribute('y', ty + 5); // 稍微向下偏移對齊
                textEl.setAttribute('text-anchor', 'middle');
                textEl.setAttribute('font-weight', isActive ? 'bold' : 'normal');
                textEl.setAttribute('font-size', isActive ? '18px' : '14px');

                // 特教友善：高亮角字體彩色，未選中角白色
                textEl.setAttribute('fill', isActive ? angleColors[sec.id] : '#94a3b8');
                textEl.textContent = `∠${sec.id}`;

                labelsLayer.appendChild(textEl);
            });
        }

        // 輔助函數：生成圓餅扇形路徑
        function getSectorPath(cx, cy, r, startAngleDeg, endAngleDeg) {
            const startRad = (startAngleDeg * Math.PI) / 180;
            const endRad = (endAngleDeg * Math.PI) / 180;

            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy + r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy + r * Math.sin(endRad);

            const diff = Math.abs(endAngleDeg - startAngleDeg);
            const largeArcFlag = diff > 180 ? 1 : 0;
            const sweepFlag = 1; // 始終為順時針

            return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArcFlag} ${sweepFlag} ${x2} ${y2} Z`;
        }

        // ---------------------------------
        // 5. 即時數據面板更新 & 直覺圖解
        // ---------------------------------
        function updateLivePanel(angles) {
            // 1. 更新頂端平行狀態標籤
            const badge = document.getElementById('parallel-badge');
            if (isParallel) {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> L₁ // L₂ (平行中)`;
                document.getElementById('tilt-control').classList.add('opacity-50', 'pointer-events-none');
            } else {
                badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all bg-rose-50 text-rose-700 border border-rose-200 shadow-sm";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> 兩線不平行`;
                document.getElementById('tilt-control').classList.remove('opacity-50', 'pointer-events-none');
            }

            // 2. 獲取當前所選角的資訊
            const activePair = relationsData[currentRel].pairs[currentPairIdx];
            if (!activePair) return;

            const angleAId = activePair.a;
            const angleBId = activePair.b;
            const valA = Math.round(angles[angleAId]);
            const valB = Math.round(angles[angleBId]);

            // 動態更新角度面板文字與顏色
            const elNameA = document.getElementById('live-angle-a-name');
            elNameA.innerText = `角 ∠${angleAId}`;
            elNameA.style.backgroundColor = angleColors[angleAId];

            const elNameB = document.getElementById('live-angle-b-name');
            elNameB.innerText = `角 ∠${angleBId}`;
            elNameB.style.backgroundColor = angleColors[angleBId];

            document.getElementById('live-angle-a-val').innerText = `${valA}°`;
            document.getElementById('live-angle-b-val').innerText = `${valB}°`;

            // 判斷關係式與總結
            const relationType = relationsData[currentRel].type;
            const operatorEl = document.getElementById('live-relation-operator');
            const summaryBox = document.getElementById('property-summary-box');

            if (relationType === 'equal') {
                if (isParallel) {
                    operatorEl.innerText = '＝';
                    operatorEl.className = 'text-2xl font-black text-emerald-500 animate-bounce';
                    summaryBox.className = 'mt-2 text-center text-xs py-2 px-3 rounded-lg font-bold bg-emerald-50 text-emerald-800 border border-emerald-100';
                    summaryBox.innerHTML = `⭐ 兩線平行 → 此組角度<b>相等</b>`;
                } else {
                    operatorEl.innerText = valA === valB ? '＝' : '≠';
                    operatorEl.className = 'text-2xl font-black text-rose-500';
                    summaryBox.className = 'mt-2 text-center text-xs py-2 px-3 rounded-lg font-bold bg-rose-50 text-rose-800 border border-rose-100';
                    summaryBox.innerHTML = `⚠️ 兩線不平行 → 角度<b>不相等</b>`;
                }
            } else if (relationType === 'supplementary') {
                const sum = valA + valB;
                operatorEl.innerText = '＋';
                operatorEl.className = 'text-2xl font-black text-indigo-500';

                if (isParallel) {
                    summaryBox.className = 'mt-2 text-center text-xs py-2 px-3 rounded-lg font-bold bg-emerald-50 text-emerald-800 border border-emerald-100';
                    summaryBox.innerHTML = `⭐ 兩線平行 → 此組角度<b>互補</b>（${valA}° + ${valB}° = 180°）`;
                } else {
                    summaryBox.className = 'mt-2 text-center text-xs py-2 px-3 rounded-lg font-bold bg-rose-50 text-rose-800 border border-rose-100';
                    summaryBox.innerHTML = `⚠️ 兩線不平行 → 相加 <b>≠ 180°</b>（目前 ${sum}°）`;
                }
            }

            // 3. 更新圖解圓餅圖 (visual-helper-svg)
            drawVisualHelper(valA, valB, relationType, angleAId, angleBId);
        }

        // 繪製極直觀的輔助圖解 (圓餅形式)
        function drawVisualHelper(valA, valB, relationType, idA, idB) {
            const helperSvg = document.getElementById('visual-helper-svg');
            const descEl = document.getElementById('visual-helper-desc');
            helperSvg.innerHTML = '';

            const colA = angleColors[idA];
            const colB = angleColors[idB];

            if (relationType === 'equal') {
                // 相等關係：並排對比兩個相同比例的扇形
                descEl.innerHTML = `<b>相等關係</b><br/><span style="color:${colA}">∠${idA}</span> 與 <span style="color:${colB}">∠${idB}</span> 大小相同`;

                // 繪製圓圈外框1
                const circle1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle1.setAttribute('cx', '25');
                circle1.setAttribute('cy', '50');
                circle1.setAttribute('r', '20');
                circle1.setAttribute('fill', 'none');
                circle1.setAttribute('stroke', '#e2e8f0');
                circle1.setAttribute('stroke-dasharray', '2 2');
                helperSvg.appendChild(circle1);

                // 繪製扇形1
                const path1 = getSectorPath(25, 50, 20, 0, valA);
                const pathEl1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl1.setAttribute('d', path1);
                pathEl1.setAttribute('fill', colA + 'bb');
                pathEl1.setAttribute('stroke', colA);
                helperSvg.appendChild(pathEl1);

                // 繪製圓圈外框2
                const circle2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle2.setAttribute('cx', '75');
                circle2.setAttribute('cy', '50');
                circle2.setAttribute('r', '20');
                circle2.setAttribute('fill', 'none');
                circle2.setAttribute('stroke', '#e2e8f0');
                circle2.setAttribute('stroke-dasharray', '2 2');
                helperSvg.appendChild(circle2);

                // 繪製扇形2
                const path2 = getSectorPath(75, 50, 20, 0, valB);
                const pathEl2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl2.setAttribute('d', path2);
                pathEl2.setAttribute('fill', colB + 'bb');
                pathEl2.setAttribute('stroke', colB);
                helperSvg.appendChild(pathEl2);

            } else {
                // 互補關係：兩個扇形拼成一個半圓 (180度)
                if (isParallel) {
                    descEl.innerHTML = `<b>互補關係</b><br/><span style="color:${colA}">∠${idA}</span> ＋ <span style="color:${colB}">∠${idB}</span> ＝ <b>180°</b>`;
                } else {
                    descEl.innerHTML = `<b>非互補</b><br/>兩線不平行，相加 <b>≠ 180°</b>`;
                }

                // 繪製圓圈外框
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', '50');
                circle.setAttribute('cy', '50');
                circle.setAttribute('r', '25');
                circle.setAttribute('fill', 'none');
                circle.setAttribute('stroke', '#e2e8f0');
                circle.setAttribute('stroke-dasharray', '2 2');
                helperSvg.appendChild(circle);

                // 繪製扇形A (從0度到valA)
                const pathA = getSectorPath(50, 50, 25, 0, valA);
                const pathElA = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElA.setAttribute('d', pathA);
                pathElA.setAttribute('fill', colA + 'bb');
                pathElA.setAttribute('stroke', colA);
                helperSvg.appendChild(pathElA);

                // 繪製扇形B (從valA到valA+valB)
                const pathB = getSectorPath(50, 50, 25, valA, valA + valB);
                const pathElB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElB.setAttribute('d', pathB);
                pathElB.setAttribute('fill', colB + 'bb');
                pathElB.setAttribute('stroke', colB);
                helperSvg.appendChild(pathElB);
            }
        }

            }

            updateGeometry();

        function selectRelationship(rel) {
            currentRel = rel;
            currentPairIdx = 0; // 預設第一組

            // 更新按鈕樣式
            const buttons = ['corresponding', 'alternate', 'sameside'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-rel-${b}`);
                if (b === rel) {
                    btn.className = "py-2.5 px-1 text-center rounded-xl font-bold text-sm transition-all border-2 border-indigo-600 bg-indigo-50 text-indigo-700";
                } else {
                    btn.className = "py-2.5 px-1 text-center rounded-xl font-bold text-sm transition-all border-2 border-transparent bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            });

            // 更新說明文字
            const data = relationsData[rel];
            document.getElementById('rel-title').innerText = data.title;
            document.getElementById('rel-subtitle').innerText = data.subtitle;
            document.getElementById('rel-definition').innerHTML = data.definition;

            // 生成配對選擇按鈕
            const container = document.getElementById('pair-selector-container');
            container.innerHTML = '';

            data.pairs.forEach((pair, idx) => {
                const btn = document.createElement('button');
                btn.innerText = pair.label;
                btn.onclick = () => selectPair(idx);

                if (idx === currentPairIdx) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-sm transition-all";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all";
                }
                container.appendChild(btn);
            });

            updateGeometry();
            playSystemSound(800, 'sine', 0.05, 0.1);
        }

        function selectPair(idx) {
            currentPairIdx = idx;

            // 更新按鈕樣式
            const container = document.getElementById('pair-selector-container');
            Array.from(container.children).forEach((btn, bIdx) => {
                if (bIdx === idx) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-sm transition-all";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all";
                }
            });

            updateGeometry();
            playSystemSound(1200, 'sine', 0.05, 0.05);
        }

        // 語音播放功能 (TTS)
        function speakContent() {
            if ('speechSynthesis' in window) {
                // 先取消所有排程中的播報
                window.speechSynthesis.cancel();

                const data = relationsData[currentRel];
                const pair = data.pairs[currentPairIdx];
                const textToSpeak = `${data.title}。${data.definition.replace(/<[^>]*>/g, '')}。現在畫布上高亮呈現的是${pair.label}。`;

                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.95; // 語速稍微放慢
                window.speechSynthesis.speak(utterance);
            } else {
                alert("瀏覽器不支援語音合成播放功能。");
            }
        }

        // ---------------------------------
        // 7. 答題測驗模組 (自動命題)
        // ---------------------------------
        function generateQuizQuestion() {
            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('btn-next-question').classList.add('hidden');

            // 隨機題型：1 = 辨認關係, 2 = 角度計算 (L1//L2)
            const qType = Math.floor(Math.random() * 2) + 1;

            // 隨機產生截線角度 beta (取常見整數，避免過於刁鑽)
            const testBeta = [60, 70, 75, 110, 120, 130][Math.floor(Math.random() * 6)];

            // 題目的平行設定固定為 true (幾何求角的核心基本設定)
            transversalAngle = testBeta;
            line2Tilt = 0;
            isParallel = true;

            // 同步畫布
            document.getElementById('slider-m-angle').value = testBeta;
            document.getElementById('btn-toggle-parallel').className = "relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 bg-indigo-600";
            document.getElementById('toggle-circle').className = "pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5";
            updateGeometry();

            const relationKeys = ['corresponding', 'alternate', 'sameside'];

            if (qType === 1) {
                // 題型一：辨認關係
                const randomRel = relationKeys[Math.floor(Math.random() * relationKeys.length)];
                const pairs = relationsData[randomRel].pairs;
                const randomPair = pairs[Math.floor(Math.random() * pairs.length)];

                // 將選中的角同步高亮在畫布上
                currentRel = randomRel;
                currentPairIdx = pairs.indexOf(randomPair);
                updateGeometry();

                currentQuestion = {
                    type: 1,
                    angleA: randomPair.a,
                    angleB: randomPair.b,
                    correctAnswer: randomRel,
                    explanation: `答對了！因為 ∠${randomPair.a} 與 ∠${randomPair.b} 位置符合「${relationsData[randomRel].title.split(' ')[0]}」的定義。`
                };

                document.getElementById('quiz-type-badge').innerText = "關係辨認題";
                document.getElementById('quiz-question-text').innerHTML = `
          👉 <b>請觀察左方幾何圖：</b><br/>
          已被點亮呈彩色的兩個角 <b style="color:${angleColors[randomPair.a]}">∠${randomPair.a}</b> 與 <b style="color:${angleColors[randomPair.b]}">∠${randomPair.b}</b>，請問它們在空間幾何中是什麼關係？
        `;

                // 選項
                const optionsHtml = [
                    { key: 'corresponding', label: '💡 同位角' },
                    { key: 'alternate', label: '🔄 內錯角' },
                    { key: 'sameside', label: '🤝 同側內角' }
                ].map(opt => `
          <button onclick="submitAnswer('${opt.key}')" class="quiz-opt-btn w-full text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 font-medium text-sm transition-all text-slate-700">
            ${opt.label}
          </button>
        `).join('');

                document.getElementById('quiz-options').innerHTML = optionsHtml;

            } else {
                // 題型二：角度計算 (此時必平行)
                const randomRel = relationKeys[Math.floor(Math.random() * relationKeys.length)];
                const pairs = relationsData[randomRel].pairs;
                const randomPair = pairs[Math.floor(Math.random() * pairs.length)];

                currentRel = randomRel;
                currentPairIdx = pairs.indexOf(randomPair);
                updateGeometry();

                // 算出兩個角的角度
                const degA = (randomPair.a === 1 || randomPair.a === 4) ? testBeta : 180 - testBeta;
                const degB = (randomPair.b === 5 || randomPair.b === 8) ? testBeta : 180 - testBeta;

                let ans;
                let explanation;
                if (relationsData[randomRel].type === 'equal') {
                    ans = degA;
                    explanation = `答對了！因為平行線的 <b>同位角或內錯角相等</b>，所以 ∠${randomPair.b} 等於 ∠${randomPair.a}，也就是 ${ans}°！`;
                } else {
                    ans = 180 - degA;
                    explanation = `答對了！因為平行線的 <b>同側內角互補 (相加為 180°)</b>，所以 ∠${randomPair.b} = 180° - ${degA}° = ${ans}°！`;
                }

                currentQuestion = {
                    type: 2,
                    angleA: randomPair.a,
                    angleB: randomPair.b,
                    valA: degA,
                    correctAnswer: ans,
                    explanation: explanation
                };

                document.getElementById('quiz-type-badge').innerText = "平行角度計算題";
                document.getElementById('quiz-question-text').innerHTML = `
          👉 <b>已知 L₁ 與 L₂ 平行：</b><br/>
          如果已知 <b style="color:${angleColors[randomPair.a]}">∠${randomPair.a}</b> = ${degA}°，<br/>
          請問對應點亮的 <b style="color:${angleColors[randomPair.b]}">∠${randomPair.b}</b> 是多少度？
        `;

                // 產生4個選項，其中包含正解與干擾項 (如：180-degA, 或者是 degA 互換)
                let choices = new Set([ans, 180 - ans, testBeta, 180 - testBeta]);
                // 確保剛好有四個選項
                while (choices.size < 4) {
                    choices.add(Math.floor(Math.random() * 9 + 4) * 10); // 40~120 的整數十位
                }

                // 轉為陣列並隨機打亂
                const sortedChoices = Array.from(choices).sort(() => Math.random() - 0.5);

                const optionsHtml = sortedChoices.map(val => `
          <button onclick="submitAnswer(${val})" class="quiz-opt-btn w-full text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 font-bold text-sm transition-all text-slate-700">
            📏 ${val}°
          </button>
        `).join('');

                document.getElementById('quiz-options').innerHTML = optionsHtml;
            }
        }

        function submitAnswer(userAns) {
            // 凍結所有選項
            const buttons = document.querySelectorAll('.quiz-opt-btn');
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');

            const isCorrect = (userAns === currentQuestion.correctAnswer);

            if (isCorrect) {
                quizScore += 10;
                document.getElementById('quiz-score').innerText = quizScore;
                feedback.className = "p-3 rounded-xl text-center text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 transition-all";
                feedback.innerHTML = `🎉 答對囉！<br/>${currentQuestion.explanation}`;

                // 播放歡樂音效 (高音和弦)
                playSystemSound(523.25, 'sine', 0.1, 0.15); // C5
                setTimeout(() => playSystemSound(659.25, 'sine', 0.1, 0.15), 100); // E5
                setTimeout(() => playSystemSound(783.99, 'sine', 0.1, 0.25), 200); // G5
            } else {
                feedback.className = "p-3 rounded-xl text-center text-xs font-bold bg-rose-50 text-rose-800 border border-rose-200 transition-all";

                // 提供詳細的解析回饋
                let correctHint = "";
                if (currentQuestion.type === 1) {
                    const name = relationsData[currentQuestion.correctAnswer].title.split(' ')[0];
                    correctHint = `這題答案是「<b>${name}</b>」喔！`;
                } else {
                    correctHint = `這題答案是 <b>${currentQuestion.correctAnswer}°</b> 喔！`;
                }

                feedback.innerHTML = `😅 答錯了！${correctHint}<br/><span class="text-[10px] text-slate-500 font-normal">平行線性質：同位角＝內錯角（相等）；同側內角互補（和＝180°）</span>`;

                // 播放低沉提醒音效
                playSystemSound(220, 'sawtooth', 0.1, 0.3); // A3
            }

            document.getElementById('btn-next-question').classList.remove('hidden');
        }

        function nextQuestion() {
            generateQuizQuestion();
        }

        // ---------------------------------
        // 8. 免資源網頁專屬音效生成器 (Web Audio API)
        // ---------------------------------
        function playSystemSound(frequency, type, volume, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type || 'sine';
                oscillator.frequency.value = frequency;

                gainNode.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
                // 音量漸弱，減少突兀雜音
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.2));

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + (duration || 0.2));
            } catch (e) {
                // 部分瀏覽器安全策略阻擋音效，靜默不報錯
            }
        }
    </script>
