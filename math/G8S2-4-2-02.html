  <style>
    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;

      color: #1e293b;

    .card-border {
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes bounce-custom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .bounce-animation {
      animation: bounce-custom 0.4s ease-in-out;
    }
    
    /* Specs classes */
    .math-line {
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      line-height: 1.8;
      margin: 14px 0;
    }
    .math, .math-display {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }
    .math-display {
      justify-content: center;
      width: 100%;
      overflow-x: auto;
      padding: 8px 0;
    }
    .katex {
      font-size: 1.15em;
    }
    .slot {
      min-width: 68px;
      min-height: 48px;
      padding: 4px 14px;
      border: 3px solid #93c5fd;
      border-radius: 12px;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      cursor: pointer;
      font-size: 24px;
      font-weight: 800;
      user-select: none;
      transition: all 0.2s;
    }
    .slot.active {
      animation: pulseSlot 1s infinite;
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }
    .slot.correct {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
      cursor: not-allowed;
    }
    .slot.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }
    @keyframes pulseSlot {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3); }
      70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

  <!-- Header -->

  <script>
    let speechRate = 1.0;
    
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = speechRate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function changeSpeed(rate) {
      speechRate = rate;
      const speeds = [0.8, 1.0, 1.2];
      const buttons = ['btn-slow', 'btn-normal', 'btn-fast'];
      buttons.forEach((id, idx) => {
        const btn = document.getElementById(id);
        if (speeds[idx] === rate) {
          btn.className = "px-2 py-1 text-xs rounded bg-blue-600 text-white font-bold";
        } else {
          btn.className = "px-2 py-1 text-xs rounded bg-slate-100 hover:bg-slate-200 text-slate-600";
        }
      });
      speakText("速度調整");
    }

    // Concept 2 Database
    const questionsData = [
      {
        id: 1,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線 \\(AC\\) 和 \\(BD\\) 相交於 \\(O\\) 點。若 \\(AO = 8x+3\\)，\\(OC = 9x-1\\)，求對角線 \\(AC\\) 的長度。",
        svgType: "diagonals_simple",
        svgData: { ao: "8x+3", oc: "9x-1" },
        steps: [
          {
            desc: "第一步：對角線互相平分：\\(\\overline{AO} = \\overline{OC}\\)：",
            formula: [
              { type: "math", latex: "8x + 3 = 9x - " },
              { type: "slot", key: "step1_1", answer: "1" }
            ],
            options: ["1", "3", "8", "9"]
          },
          {
            desc: "第二步：解得 \\(x\\) 的值：",
            formula: [
              { type: "math", latex: "x = " },
              { type: "slot", key: "step2_1", answer: "4" }
            ],
            options: ["2", "4", "5", "8"]
          },
          {
            desc: "第三步：代入求得 \\(\\overline{AO}\\) 並算出對角線 \\(\\overline{AC}\\)：",
            formula: [
              { type: "math", latex: "\\overline{AO} = 8 \\times 4 + 3 = 35, \\quad \\overline{AC} = 2 \\times 35 = " },
              { type: "slot", key: "step3_1", answer: "70" }
            ],
            options: ["35", "50", "70", "90"]
          }
        ]
      },
      {
        id: 2,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若 \\(AO = 2y-2\\)，\\(OC = x+2\\)，\\(BO = -x+7\\)，\\(DO = 3y-4\\)，求 \\(AC\\) 與 \\(BD\\) 的長度。",
        svgType: "diagonals_complex",
        svgData: { ao: "2y-2", oc: "x+2", bo: "-x+7", od: "3y-4" },
        steps: [
          {
            desc: "第一步：\\(\\overline{AO} = \\overline{OC}\\)，將式子移項整理得到：",
            formula: [
              { type: "math", latex: "2y - x = " },
              { type: "slot", key: "step1_1", answer: "4" }
            ],
            options: ["2", "4", "6", "8"]
          },
          {
            desc: "第二步：\\(\\overline{BO} = \\overline{DO}\\)，將式子移項整理得到：",
            formula: [
              { type: "math", latex: "3y + x = " },
              { type: "slot", key: "step2_1", answer: "11" }
            ],
            options: ["7", "9", "11", "13"]
          },
          {
            desc: "第三步：聯立兩式相加解得 \\(y\\) 與 \\(x\\)：",
            formula: [
              { type: "math", latex: "y = " },
              { type: "slot", key: "step3_1", answer: "3" },
              { type: "math", latex: ", \\quad x = " },
              { type: "slot", key: "step3_2", answer: "2" }
            ],
            options: ["1", "2", "3", "5"]
          },
          {
            desc: "第四步：求對角線長度：",
            formula: [
              { type: "math", latex: "\\overline{AC} = 2 \\times \\overline{AO} = 2 \\times (2+2) = " },
              { type: "slot", key: "step4_1", answer: "8" },
              { type: "math", latex: ", \\quad \\overline{BD} = 2 \\times \\overline{BO} = 2 \\times (-2+7) = " },
              { type: "slot", key: "step4_2", answer: "10" }
            ],
            options: ["6", "8", "10", "12"]
          }
        ]
      },
      {
        id: 3,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若 \\(AC \\perp BD\\)，且 \\(AC = 6\\)，\\(BD = 8\\)，求此平行四邊形 \\(ABCD\\) 的周長。",
        svgType: "diagonals_perp",
        svgData: { ac: "6", bd: "8" },
        steps: [
          {
            desc: "第一步：對角線平分，得到 \\(\\overline{AO}\\) 與 \\(\\overline{BO}\\)：",
            formula: [
              { type: "math", latex: "\\overline{AO} = " },
              { type: "slot", key: "step1_1", answer: "3" },
              { type: "math", latex: ", \\quad \\overline{BO} = " },
              { type: "slot", key: "step1_2", answer: "4" }
            ],
            options: ["3", "4", "6", "8"]
          },
          {
            desc: "第二步：在直角三角形 \\(AOB\\) 中，利用畢氏定理求邊長 \\(\\overline{AB}\\)：",
            formula: [
              { type: "math", latex: "\\overline{AB} = \\sqrt{3^2 + 4^2} = " },
              { type: "slot", key: "step2_1", answer: "5" }
            ],
            options: ["5", "7", "10", "25"]
          },
          {
            desc: "第三步：平行四邊形四邊相等，求周長：",
            formula: [
              { type: "math", latex: "\\text{周長} = 4 \\times 5 = " },
              { type: "slot", key: "step3_1", answer: "20" }
            ],
            options: ["10", "20", "24", "40"]
          }
        ]
      },
      {
        id: 4,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若 \\(AB = 5\\)，\\(AD = 9\\)，且 \\(\\Delta OAB\\) 的周長為 \\(20\\)，求 \\(\\Delta OAD\\) 的周長。",
        svgType: "diagonals_triangles",
        svgData: { ab: "5", ad: "9", oab: "周長 = 20" },
        steps: [
          {
            desc: "第一步：由 \\(\\Delta OAB\\) 的周長，得到對角線半段的和：",
            formula: [
              { type: "math", latex: "\\overline{AO} + \\overline{BO} = 20 - 5 = " },
              { type: "slot", key: "step1_1", answer: "15" }
            ],
            options: ["10", "15", "20", "25"]
          },
          {
            desc: "第二步：因為 \\(\\overline{DO} = \\overline{BO}\\)，且 \\(\\overline{AD} = 9\\)：",
            formula: [
              { type: "math", latex: "\\Delta OAD \\text{周長} = \\overline{AO} + \\overline{DO} + \\overline{AD} = 15 + 9 = " },
              { type: "slot", key: "step2_1", answer: "24" }
            ],
            options: ["18", "24", "30", "34"]
          }
        ]
      },
      {
        id: 5,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若 \\(\\Delta AOB\\) 的面積為 \\(71\\)，則平行四邊形 \\(ABCD\\) 的面積為多少？",
        svgType: "diagonals_area",
        svgData: { aob: "面積 = 71" },
        steps: [
          {
            desc: "第一步：對角線平分出四個面積相等的三角形。所以：",
            formula: [
              { type: "math", latex: "\\text{面積} = 4 \\times " },
              { type: "slot", key: "step1_1", answer: "71" },
              { type: "math", latex: " = " },
              { type: "slot", key: "step1_2", answer: "284" }
            ],
            options: ["71", "142", "213", "284"]
          }
        ]
      },
      {
        id: 6,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若整個平行四邊形面積為 \\(60\\)，則其中 \\(\\Delta BOC\\) 的面積為多少？",
        svgType: "diagonals_area_rev",
        svgData: { total: "面積 = 60" },
        steps: [
          {
            desc: "第一步：對角線平分出四個等面積三角形，故每個小三角形面積為總面積的四分之一：",
            formula: [
              { type: "math", latex: "\\Delta BOC \\text{面積} = 60 \\div " },
              { type: "slot", key: "step1_1", answer: "4" },
              { type: "math", latex: " = " },
              { type: "slot", key: "step1_2", answer: "15" }
            ],
            options: ["2", "4", "15", "30"]
          }
        ]
      },
      {
        id: 7,
        type: "stepflow",
        question: "平行四邊形 \\(ABCD\\) 中，對角線相交於 \\(O\\)。若 \\(\\Delta ABC\\) 為正三角形，且 \\(AO = 5\\)，求平行四邊形 \\(ABCD\\) 的面積。",
        svgType: "diagonals_equilateral",
        svgData: { ao: "5" },
        steps: [
          {
            desc: "第一步：因為對角線平分，對角線 \\(\\overline{AC} = 2 \\times 5 = 10\\)。因為 \\(\\Delta ABC\\) 為正三角形，所以邊長為：",
            formula: [
              { type: "math", latex: "\\overline{AB} = \\overline{BC} = " },
              { type: "slot", key: "step1_1", answer: "10" }
            ],
            options: ["5", "10", "15", "20"]
          },
          {
            desc: "第二步：計算平行四邊形面積，利用正三角形公式與對角線性質，面積為兩個 \\(\\Delta ABC\\)：",
            formula: [
              { type: "math", latex: "\\text{面積} = 2 \\times (\\frac{\\sqrt{3}}{4} \\times 10^2) = " },
              { type: "slot", key: "step2_1", answer: "50" },
              { type: "math", latex: "\\sqrt{3}" }
            ],
            options: ["25", "50", "75", "100"]
          }
        ]
      },
      {
        id: 8,
        type: "stepflow",
        question: "平行四邊形 \\(PQRS\\) 中，對角線相交於 \\(O\\)。已知面積為 \\(84\\)，垂直高線 \\(PD = 7\\)，\\(SE = 12\\)，求對角線 \\(PR\\) 與 \\(SQ\\) 的長度。",
        svgType: "diagonals_heights",
        svgData: { pd: "7", se: "12", area: "84" },
        steps: [
          {
            desc: "第一步：由面積式 \\(SQ \\times PD = 84\\) 得對角線 \\(SQ\\)：",
            formula: [
              { type: "math", latex: "\\overline{SQ} = 84 \\div 7 = " },
              { type: "slot", key: "step1_1", answer: "12" }
            ],
            options: ["7", "12", "14", "24"]
          },
          {
            desc: "第二步：同理由面積式 \\(PR \\times SE = 84\\) 得對角線 \\(PR\\)：",
            formula: [
              { type: "math", latex: "\\overline{PR} = 84 \\div 12 = " },
              { type: "slot", key: "step2_1", answer: "7" }
            ],
            options: ["6", "7", "12", "14"]
          }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let currentStepIndex = 0;
    let activeSlotKey = "";
    let slotValues = {};
    const completedProgress = Array(8).fill(false);

    function loadQuestion() {
      const q = questionsData[currentQuestionIndex];
      document.getElementById("question-number-badge").innerText = `第 ${q.id} 題 / 共 8 題`;
      document.getElementById("question-text").innerText = q.question;
      
      renderMathElements();
      renderSVG(q.svgType, q.svgData);
      currentStepIndex = 0;
      renderSteps();
      speakCurrentQuestion();
    }

    function speakCurrentQuestion() {
      const q = questionsData[currentQuestionIndex];
      const plainText = q.question
        .replace(/\\overline\{([A-Z]{2})\}/g, "線段 $1")
        .replace(/\\(angle|Delta)/g, "")
        .replace(/\\square/g, "平行四邊形")
        .replace(/[\{\}\(\)\\\^]/g, "");
      speakText(plainText);
    }

    function renderMathElements() {
      if (window.katex) {
        const textEl = document.getElementById("question-text");
        let html = textEl.innerHTML;
        const regex = /\\\((.*?)\\\)/g;
        html = html.replace(regex, (match, latex) => {
          try {
            return window.katex.renderToString(latex, { throwOnError: false, displayMode: false });
          } catch(e) {
            return match;
          }
        });
        textEl.innerHTML = html;
      }
    }

    function renderSteps() {
      const q = questionsData[currentQuestionIndex];
      const panel = document.getElementById("steps-panel");
      panel.innerHTML = "";
      
      document.getElementById("options-panel-container").classList.remove("hidden");
      document.getElementById("check-btn").classList.remove("hidden");
      document.getElementById("next-step-btn").classList.add("hidden");

      for (let i = 0; i <= currentStepIndex; i++) {
        const step = q.steps[i];
        const isCurrentStep = (i === currentStepIndex);
        const isCompleted = (i < currentStepIndex);
        
        const stepDiv = document.createElement("div");
        stepDiv.className = `p-5 rounded-2xl border transition-all duration-300 ${
          isCurrentStep ? 'bg-blue-50/50 border-blue-400 shadow-sm shadow-blue-500/5' : 'bg-slate-50 border-slate-200 opacity-80'
        }`;
        
        const stepTitle = document.createElement("div");
        stepTitle.className = "text-sm text-slate-500 font-bold mb-2";
        stepTitle.innerText = `步驟 ${i + 1}`;
        stepDiv.appendChild(stepTitle);
        
        const stepDesc = document.createElement("p");
        stepDesc.className = "text-lg text-slate-800 mb-3 leading-relaxed";
        stepDesc.innerHTML = parseLatexText(step.desc);
        stepDiv.appendChild(stepDesc);
        
        const mathLine = document.createElement("div");
        mathLine.className = "math-line bg-white p-4 rounded-xl border border-slate-200";
        
        step.formula.forEach(f => {
          if (f.type === "math") {
            const mathSpan = document.createElement("span");
            mathSpan.className = "math";
            mathSpan.dataset.latex = f.latex;
            mathLine.appendChild(mathSpan);
          } 
          else if (f.type === "slot") {
            const slotSpan = document.createElement("span");
            slotSpan.className = "slot";
            slotSpan.id = `slot-${f.key}`;
            slotSpan.dataset.key = f.key;
            
            if (slotValues[f.key]) {
              slotSpan.innerText = slotValues[f.key];
            } else {
              slotSpan.innerText = "";
            }
            
            if (isCompleted) {
              slotSpan.classList.add("correct");
            } else if (isCurrentStep) {
              if (activeSlotKey === f.key || (!activeSlotKey && !activeSlotKeySet(step.formula))) {
                activeSlotKey = f.key;
                slotSpan.classList.add("active");
              }
              slotSpan.onclick = () => selectSlot(f.key);
            }
            mathLine.appendChild(slotSpan);
          }
        });
        
        stepDiv.appendChild(mathLine);
        panel.appendChild(stepDiv);
      }
      
      panel.scrollTop = panel.scrollHeight;
      renderKaTeXInSteps();
      loadOptionsPanel();
    }

    function parseLatexText(text) {
      if (!window.katex) return text;
      const regex = /\\\((.*?)\\\)/g;
      return text.replace(regex, (match, latex) => {
        try {
          return window.katex.renderToString(latex, { throwOnError: false, displayMode: false });
        } catch(e) {
          return match;
        }
      });
    }

    function activeSlotKeySet(formula) {
      for (let f of formula) {
        if (f.type === "slot" && !slotValues[f.key]) {
          return f.key;
        }
      }
      return "";
    }

    function selectSlot(key) {
      const q = questionsData[currentQuestionIndex];
      const step = q.steps[currentStepIndex];
      step.formula.forEach(f => {
        if (f.type === "slot") {
          const el = document.getElementById(`slot-${f.key}`);
          if (el) el.classList.remove("active");
        }
      });
      
      activeSlotKey = key;
      const activeEl = document.getElementById(`slot-${key}`);
      if (activeEl) {
        if (slotValues[key]) {
          slotValues[key] = "";
          activeEl.innerText = "";
        }
        activeEl.classList.add("active");
      }
    }

    function loadOptionsPanel() {
      const q = questionsData[currentQuestionIndex];
      const step = q.steps[currentStepIndex];
      const container = document.getElementById("options-buttons");
      container.innerHTML = "";
      
      step.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "px-6 py-4 bg-white hover:bg-slate-50 text-slate-850 font-extrabold text-2xl rounded-2xl transition border border-slate-200 shadow-sm active:scale-95 min-w-[65px] text-center";
        btn.innerText = opt;
        btn.onclick = () => clickOptionValue(opt);
        container.appendChild(btn);
      });
    }

    function clickOptionValue(val) {
      if (!activeSlotKey) return;
      const el = document.getElementById(`slot-${activeSlotKey}`);
      if (el) {
        slotValues[activeSlotKey] = val;
        el.innerText = val;
        el.classList.remove("wrong");
        
        const q = questionsData[currentQuestionIndex];
        const step = q.steps[currentStepIndex];
        let foundNext = false;
        
        for (let f of step.formula) {
          if (f.type === "slot" && !slotValues[f.key] && f.key !== activeSlotKey) {
            selectSlot(f.key);
            foundNext = true;
            break;
          }
        }
      }
    }

    function checkCurrentStep() {
      const q = questionsData[currentQuestionIndex];
      const step = q.steps[currentStepIndex];
      let allCorrect = true;
      let unfilled = false;
      
      step.formula.forEach(f => {
        if (f.type === "slot") {
          const val = slotValues[f.key];
          const el = document.getElementById(`slot-${f.key}`);
          
          if (!val) {
            unfilled = true;
            el.classList.add("wrong");
          } else if (val !== f.answer) {
            allCorrect = false;
            el.classList.add("wrong");
          } else {
            el.classList.remove("wrong");
            el.classList.add("correct");
          }
        }
      });
      
      if (unfilled) {
        speakText("還有空格未完成。");
        return;
      }
      
      const card = document.getElementById("question-card");
      
      if (allCorrect) {
        card.classList.add("bounce-animation");
        setTimeout(() => card.classList.remove("bounce-animation"), 400);
        speakText("步驟正確！");
        
        step.formula.forEach(f => {
          if (f.type === "slot") {
            const el = document.getElementById(`slot-${f.key}`);
            if (el) {
              el.onclick = null;
              el.className = "slot correct";
            }
          }
        });
        
        if (currentStepIndex < q.steps.length - 1) {
          document.getElementById("check-btn").classList.add("hidden");
          document.getElementById("next-step-btn").classList.remove("hidden");
        } else {
          completedProgress[currentQuestionIndex] = true;
          updateProgressBar();
          updateTabProgressBadges();
          
          if (completedProgress.every(x => x === true)) {
            confetti({ particleCount: 160, spread: 85, origin: { y: 0.65 } });
            setTimeout(showModal, 600);
          } else {
            setTimeout(nextQuestion, 1600);
          }
        }
      } else {
        card.classList.add("shake-animation");
        setTimeout(() => card.classList.remove("shake-animation"), 400);
        speakText("算式中的答案有誤，再確認看看。");
      }
    }

    function advanceStep() {
      currentStepIndex++;
      activeSlotKey = "";
      document.getElementById("check-btn").classList.remove("hidden");
      document.getElementById("next-step-btn").classList.add("hidden");
      renderSteps();
    }

    function showModal() {
      document.getElementById("complete-modal").classList.remove("hidden");
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        slotValues = {};
        loadQuestion();
      } else {
        speakText("這是第一題。");
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < 7) {
        currentQuestionIndex++;
        slotValues = {};
        loadQuestion();
      } else {
        speakText("最後一題囉！可切換至其他概念練習。");
      }
    }

    function updateProgressBar() {
      const correctCount = completedProgress.filter(x => x).length;
      const percent = Math.round((correctCount / 8) * 100);
      document.getElementById("progress-text").innerText = `${percent}% (${correctCount} / 8)`;
      document.getElementById("progress-bar").style.width = `${percent}%`;
    }

    function updateTabProgressBadges() {}

    function renderKaTeXInSteps() {
      if (!window.katex) return;
      document.querySelectorAll('.math').forEach(el => {
        if (!el.dataset.rendered) {
          window.katex.render(el.dataset.latex, el, {
            throwOnError: false,
            displayMode: false
          });
          el.dataset.rendered = "true";
        }
      });
    }

    function renderSVG(type, data) {
      const container = document.getElementById("svg-container");
      container.innerHTML = "";
      
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", "460");
      svg.setAttribute("height", "250");
      svg.setAttribute("viewBox", "0 0 460 250");
      svg.style.overflow = "visible";
      
      const pA = { x: 150, y: 40 };
      const pB = { x: 70, y: 195 };
      const pC = { x: 350, y: 195 };
      const pD = { x: 430, y: 40 };
      const pO = { x: (pA.x + pC.x)/2, y: (pA.y + pB.y)/2 };
      
      const grid = document.createElementNS(svgNS, "path");
      grid.setAttribute("d", "M 0 40 L 460 40 M 0 90 L 460 90 M 0 140 L 460 140 M 0 190 L 460 190 M 90 0 L 90 250 M 180 0 L 180 250 M 270 0 L 270 250 M 360 0 L 360 250");
      grid.setAttribute("stroke", "rgba(15,23,42,0.04)");
      grid.setAttribute("stroke-width", "1");
      svg.appendChild(grid);

      const shape = document.createElementNS(svgNS, "polygon");
      shape.setAttribute("points", `${pA.x},${pA.y} ${pD.x},${pD.y} ${pC.x},${pC.y} ${pB.x},${pB.y}`);
      shape.setAttribute("fill", "rgba(59, 130, 246, 0.05)");
      shape.setAttribute("stroke", "#3b82f6");
      shape.setAttribute("stroke-width", "4");
      svg.appendChild(shape);

      if (type !== "diagonals_heights") {
        drawText(svg, svgNS, pA.x - 22, pA.y + 5, "A", "#1e293b", "22px", "bold");
        drawText(svg, svgNS, pB.x - 22, pB.y + 10, "B", "#1e293b", "22px", "bold");
        drawText(svg, svgNS, pC.x + 12, pC.y + 10, "C", "#1e293b", "22px", "bold");
        drawText(svg, svgNS, pD.x + 12, pD.y + 5, "D", "#1e293b", "22px", "bold");
      }

      // Draw diagonals
      const lineAC = document.createElementNS(svgNS, "line");
      lineAC.setAttribute("x1", pA.x); lineAC.setAttribute("y1", pA.y);
      lineAC.setAttribute("x2", pC.x); lineAC.setAttribute("y2", pC.y);
      lineAC.setAttribute("stroke", "#8b5cf6");
      lineAC.setAttribute("stroke-width", "3");
      svg.appendChild(lineAC);

      const lineBD = document.createElementNS(svgNS, "line");
      lineBD.setAttribute("x1", pB.x); lineBD.setAttribute("y1", pB.y);
      lineBD.setAttribute("x2", pD.x); lineBD.setAttribute("y2", pD.y);
      lineBD.setAttribute("stroke", "#db2777");
      lineBD.setAttribute("stroke-width", "3");
      svg.appendChild(lineBD);
      
      const dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", pO.x); dot.setAttribute("cy", pO.y); dot.setAttribute("r", "5");
      dot.setAttribute("fill", "#1e293b");
      svg.appendChild(dot);
      drawText(svg, svgNS, pO.x, pO.y - 10, "O", "#1e293b", "20px", "bold", "middle");

      if (type === "diagonals_simple" || type === "diagonals_complex") {
        drawText(svg, svgNS, (pA.x + pO.x)/2 - 12, (pA.y + pO.y)/2 + 18, data.ao, "#8b5cf6", "16px", "bold", "middle");
        drawText(svg, svgNS, (pC.x + pO.x)/2 + 12, (pC.y + pO.y)/2 - 8, data.oc, "#8b5cf6", "16px", "bold", "middle");
        
        if (data.bo) {
          drawText(svg, svgNS, (pB.x + pO.x)/2 - 15, (pB.y + pO.y)/2 - 5, data.bo, "#db2777", "16px", "bold", "middle");
          drawText(svg, svgNS, (pD.x + pO.x)/2 + 15, (pD.y + pO.y)/2 + 12, data.od, "#db2777", "16px", "bold", "middle");
        }
      }
      else if (type === "diagonals_perp") {
        const perpMark = document.createElementNS(svgNS, "path");
        perpMark.setAttribute("d", `M ${pO.x - 10} ${pO.y} L ${pO.x - 10} ${pO.y + 10} L ${pO.x} ${pO.y + 10}`);
        perpMark.setAttribute("fill", "none");
        perpMark.setAttribute("stroke", "#10b981");
        perpMark.setAttribute("stroke-width", "2");
        svg.appendChild(perpMark);
        
        drawText(svg, svgNS, 250, 235, `AC = ${data.ac} ，BD = ${data.bd}`, "#ffffff", "18px", "bold", "middle");
      }
      else if (type === "diagonals_triangles") {
        const polyOAB = document.createElementNS(svgNS, "polygon");
        polyOAB.setAttribute("points", `${pA.x},${pA.y} ${pB.x},${pB.y} ${pO.x},${pO.y}`);
        polyOAB.setAttribute("fill", "rgba(167, 139, 250, 0.2)");
        svg.appendChild(polyOAB);
        
        drawText(svg, svgNS, (pA.x + pB.x)/2 - 25, (pA.y + pB.y)/2, `5`, "#1e293b", "18px", "bold");
        drawText(svg, svgNS, (pA.x + pD.x)/2, pA.y - 12, `9`, "#1e293b", "18px", "bold", "middle");
        drawText(svg, svgNS, 150, 135, "△OAB", "#8b5cf6", "18px", "bold");
        drawText(svg, svgNS, 150, 160, data.oab, "#8b5cf6", "16px", "bold");
      }
      else if (type === "diagonals_area") {
        const polyOAB = document.createElementNS(svgNS, "polygon");
        polyOAB.setAttribute("points", `${pA.x},${pA.y} ${pB.x},${pB.y} ${pO.x},${pO.y}`);
        polyOAB.setAttribute("fill", "rgba(167, 139, 250, 0.2)");
        svg.appendChild(polyOAB);
        drawText(svg, svgNS, (pA.x + pB.x)/2 - 5, (pA.y + pB.y)/2 + 35, data.aob, "#8b5cf6", "18px", "bold", "middle");
      }
      else if (type === "diagonals_area_rev") {
        drawText(svg, svgNS, 250, 125, data.total, "#2563eb", "22px", "bold", "middle");
      }
      else if (type === "diagonals_equilateral") {
        const polyABC = document.createElementNS(svgNS, "polygon");
        polyABC.setAttribute("points", `${pA.x},${pA.y} ${pB.x},${pB.y} ${pC.x},${pC.y}`);
        polyABC.setAttribute("fill", "rgba(59, 130, 246, 0.15)");
        svg.appendChild(polyABC);
        
        drawText(svg, svgNS, (pA.x + pO.x)/2 - 12, (pA.y + pO.y)/2 + 18, "AO=5", "#d97706", "16px", "bold");
        drawText(svg, svgNS, 250, 235, "△ABC 為正三角形", "#1e293b", "18px", "bold", "middle");
      }
      else if (type === "diagonals_heights") {
        const pP = pA; const pQ = pB; const pR = pC; const pS = pD;
        const pD_foot = { x: 215, y: 135 };
        const pE_foot = { x: 280, y: 95 };
        
        const h1 = document.createElementNS(svgNS, "line");
        h1.setAttribute("x1", pP.x); h1.setAttribute("y1", pP.y);
        h1.setAttribute("x2", pD_foot.x); h1.setAttribute("y2", pD_foot.y);
        h1.setAttribute("stroke", "#10b981");
        h1.setAttribute("stroke-width", "2");
        h1.setAttribute("stroke-dasharray", "4");
        
        const h2 = document.createElementNS(svgNS, "line");
        h2.setAttribute("x1", pS.x); h2.setAttribute("y1", pS.y);
        h2.setAttribute("x2", pE_foot.x); h2.setAttribute("y2", pE_foot.y);
        h2.setAttribute("stroke", "#fbbf24");
        h2.setAttribute("stroke-width", "2");
        h2.setAttribute("stroke-dasharray", "4");
        
        svg.innerHTML = "";
        svg.appendChild(grid);
        svg.appendChild(shape);
        svg.appendChild(lineAC);
        svg.appendChild(lineBD);
        svg.appendChild(dot);
        svg.appendChild(h1);
        svg.appendChild(h2);
        
        drawText(svg, svgNS, pP.x - 18, pP.y + 5, "P", "#1e293b", "20px", "bold");
        drawText(svg, svgNS, pQ.x - 18, pQ.y + 10, "Q", "#1e293b", "20px", "bold");
        drawText(svg, svgNS, pR.x + 12, pR.y + 10, "R", "#1e293b", "20px", "bold");
        drawText(svg, svgNS, pS.x + 12, pS.y + 5, "S", "#1e293b", "20px", "bold");
        drawText(svg, svgNS, pO.x, pO.y - 10, "O", "#1e293b", "20px", "bold", "middle");
        drawText(svg, svgNS, pD_foot.x, pD_foot.y + 15, "D", "#047857", "15px", "bold");
        drawText(svg, svgNS, pE_foot.x, pE_foot.y - 6, "E", "#d97706", "15px", "bold");
        
        drawText(svg, svgNS, (pP.x + pD_foot.x)/2 - 25, (pP.y + pD_foot.y)/2, "PD=7", "#047857", "15px", "bold");
        drawText(svg, svgNS, (pS.x + pE_foot.x)/2 + 8, (pS.y + pE_foot.y)/2 + 18, "SE=12", "#d97706", "15px", "bold");
        drawText(svg, svgNS, 250, 235, `平行四邊形面積 = ${data.area}`, "#1e293b", "18px", "bold", "middle");
      }

      container.appendChild(svg);
    }

    function drawText(svg, ns, x, y, text, color, size, weight, align = "start") {
      const txt = document.createElementNS(ns, "text");
      txt.setAttribute("x", x);
      txt.setAttribute("y", y);
      txt.setAttribute("fill", color);
      txt.setAttribute("font-size", size);
      txt.setAttribute("font-weight", weight);
      txt.setAttribute("text-anchor", align);
      txt.textContent = text;
      svg.appendChild(txt);
    }

    window.onload = loadQuestion;
  </script>
</body>
</html>
