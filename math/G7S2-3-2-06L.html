<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比例關係的應用 - 互動點擊版</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        /* 填答格樣式 */
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 80px;
            height: 44px;
            border-bottom: 3px solid #64748b;
            /* 預設深灰色 */
            margin: 0 8px;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: #1e293b;
            font-size: 22px;
            vertical-align: middle;
        }

        .slot.active {
            background-color: #e0e7ff;
            /* 淺藍色背景 */
            border-bottom-color: #4f46e5;
            /* 藍色底線 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: pulse 1.5s infinite;
        }

        .slot.filled {
            border-bottom-width: 1px;
            color: #4f46e5;
        }

        .slot.correct {
            border-bottom: 4px solid #22c55e !important;
            /* 正確變綠色 */
            background-color: #f0fdf4;
            color: #15803d;
            cursor: default;
        }

        @keyframes pulse {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* 大勾勾動畫樣式 */
        #success-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #success-overlay.show {
            opacity: 1;
        }

        .checkmark-svg {
            width: 300px;
            height: 300px;
            color: #22c55e;
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 15px 25px rgba(34, 197, 94, 0.5));
        }

        #success-overlay.show .checkmark-svg {
            transform: scale(1);
        }

        /* 選項按鈕 */
        .option-btn {
            background-color: white;
            border: 2px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            min-width: 80px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4f46e5;
            color: #4f46e5;
            transform: translateY(-3px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .math-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 20px;
            font-weight: 600;
            color: #334155;
            padding: 10px 0;
        }

        /* 兩欄式排版容器 */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 3px solid #4f46e5;
            border-radius: 0 0 32px 32px;
            background: white;
            min-height: 450px;
            overflow: hidden;
        }

        .calc-column {
            padding: 24px;
            position: relative;
        }

        .calc-column:first-child {
            border-right: 3px solid #4f46e5;
        }

        .locked-step {
            opacity: 0.1;
            pointer-events: none;
            filter: grayscale(1) blur(4px);
        }

        .step-label {
            color: #4f46e5;
            font-weight: 900;
            margin-right: 16px;
            font-size: 1.1em;
            background-color: #eef2ff;
            padding: 4px 16px;
            border-radius: 99px;
        }

        @media (max-width: 768px) {
            .calc-grid {
                grid-template-columns: 1fr;
            }

            .calc-column:first-child {
                border-right: none;
                border-bottom: 3px solid #4f46e5;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 成功大勾勾遮罩 -->
    <div id="success-overlay">
        <svg class="checkmark-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <!-- 頂部導覽列 -->
    <nav class="bg-white border-b border-indigo-100 sticky top-0 z-[100] shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 overflow-x-auto no-scrollbar py-2">
                <span class="font-bold text-indigo-600 whitespace-nowrap border-r pr-4">六、反比例關係的應用</span>
                <div id="nav-tabs" class="flex gap-2"></div>
            </div>
            <div class="flex items-center gap-6 font-bold">
                <div class="text-indigo-700 bg-indigo-50 px-4 py-1 rounded-xl text-sm md:text-base">⏱️ <span
                        id="timer">07:00</span></div>
                <div class="text-emerald-700 bg-emerald-50 px-4 py-1 rounded-xl text-sm md:text-base">得分: <span
                        id="total-score">0</span></div>
            </div>
        </div>
    </nav>

    <!-- 凍結題幹區 -->
    <div class="sticky top-16 z-[90] bg-indigo-600 border-b-4 border-indigo-900 p-4 shadow-xl text-white">
        <div class="max-w-5xl mx-auto">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-yellow-300 text-xl">💡</span>
                <h2 id="q-title" class="text-indigo-100 font-bold text-base">載入中...</h2>
            </div>
            <div id="q-description" class="text-xl md:text-2xl font-bold leading-snug"></div>
        </div>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-2 md:p-6 mb-40">
        <div id="question-card" class="bg-white rounded-[32px] shadow-2xl overflow-hidden border-2 border-indigo-500">
            <div class="calc-grid">
                <!-- 左欄：找總量 -->
                <div id="col-left" class="calc-column">
                    <div id="left-lines" class="space-y-4">
                        <!-- JS 動態生成 -->
                    </div>
                </div>

                <!-- 右欄：求答案與答 -->
                <div id="col-right" class="calc-column locked-step">
                    <div id="right-lines" class="space-y-8">
                        <!-- JS 動態生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定選項按鈕 -->
        <div
            class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 border-indigo-200 p-4 shadow-2xl z-50">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-4">
                <div class="flex-grow flex flex-wrap justify-center gap-2" id="options-container"></div>
                <button id="check-btn"
                    class="w-full md:w-auto bg-indigo-600 text-white px-12 py-3 rounded-xl font-bold text-xl hover:bg-indigo-700 shadow-lg transition active:scale-95"
                    onclick="checkActiveStep()">
                    檢查答案
                </button>
            </div>
        </div>
    </main>

    <!-- 完成結算彈窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/70 backdrop-blur-lg flex items-center justify-center z-[200] hidden p-4">
        <div
            class="bg-white rounded-[50px] shadow-2xl max-w-md w-full p-12 text-center border-t-[16px] border-indigo-600">
            <div class="text-8xl mb-8">🏆</div>
            <h2 class="text-4xl font-bold mb-4 text-slate-800">全數過關！</h2>
            <p class="text-3xl mb-12 text-indigo-600 font-bold">總分：<span id="final-score">0</span></p>
            <button onclick="resetApp()"
                class="w-full bg-indigo-600 text-white py-6 rounded-3xl font-bold text-2xl hover:bg-indigo-700 transition-all shadow-xl">重新練習</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                id: 1,
                title: "1. 水塔容量固定",
                desc: "若每分鐘注水 <span class='text-yellow-300'>20 公升</span>，需花 <span class='text-yellow-300'>72 分鐘</span>。若改為注水 <span class='text-yellow-300'>30 公升</span>，需花多少分鐘？",
                steps: [
                    {
                        id: "left",
                        lines: [
                            { label: "1. 找總量", text: "20 × 72 = {slot} (公升)" }
                        ],
                        slots: ["1440"],
                        options: ["20", "72", "30", "1440"]
                    },
                    {
                        id: "right",
                        lines: [
                            { label: "2. 求答案", text: "{slot} ÷ 30 = {slot}" },
                            { label: "答：需花", text: "{slot} 分鐘" }
                        ],
                        slots: ["1440", "48", "48"],
                        options: ["1440", "30", "48", "72"]
                    }
                ]
            },
            {
                id: 2,
                title: "2. 工程量固定",
                desc: "若派 <span class='text-yellow-300'>12 名工人</span>，需工作 <span class='text-yellow-300'>15 天</span>。若改派 <span class='text-yellow-300'>18 名工人</span>，需工作多少天？",
                steps: [
                    {
                        id: "left",
                        lines: [
                            { label: "1. 找總量", text: "12 × 15 = {slot} (人天)" }
                        ],
                        slots: ["180"],
                        options: ["12", "15", "18", "180"]
                    },
                    {
                        id: "right",
                        lines: [
                            { label: "2. 求答案", text: "{slot} ÷ 18 = {slot}" },
                            { label: "答：需工作", text: "{slot} 天" }
                        ],
                        slots: ["180", "10", "10"],
                        options: ["180", "18", "10", "15"]
                    }
                ]
            },
            {
                id: 3,
                title: "3. 糧食總量固定",
                desc: "若每天吃 <span class='text-yellow-300'>20 份</span>，可吃 <span class='text-yellow-300'>12 天</span>。若想讓糧食可以吃 <span class='text-yellow-300'>30 天</span>，則每天吃幾份？",
                steps: [
                    {
                        id: "left",
                        lines: [
                            { label: "1. 找總量", text: "20 × 12 = {slot} (份)" }
                        ],
                        slots: ["240"],
                        options: ["20", "12", "30", "240", "x", "y"]
                    },
                    {
                        id: "right",
                        lines: [
                            { label: "2. 求答案", text: "{slot} ÷ 30 = {slot}" },
                            { label: "答：每天吃", text: "{slot} 份" }
                        ],
                        slots: ["240", "8", "8"],
                        options: ["240", "30", "8", "12", "x", "y"]
                    }
                ]
            },
            {
                id: 4,
                title: "4. 長方形面積固定",
                desc: "若底為 <span class='text-yellow-300'>15 公分</span> 時，高為 <span class='text-yellow-300'>8 公分</span>。若底改為 <span class='text-yellow-300'>10 公分</span>，高是多少公分？",
                steps: [
                    {
                        id: "left",
                        lines: [
                            { label: "1. 找總量", text: "15 × 8 = {slot} (平方公分)" }
                        ],
                        slots: ["120"],
                        options: ["15", "8", "10", "120"]
                    },
                    {
                        id: "right",
                        lines: [
                            { label: "2. 求答案", text: "{slot} ÷ 10 = {slot}" },
                            { label: "答：高是", text: "{slot} 公分" }
                        ],
                        slots: ["120", "12", "12"],
                        options: ["120", "10", "12", "15", "8"]
                    }
                ]
            }
        ];

        let currentQIdx = 0;
        let activeStepIdx = 0;
        let scores = [0, 0, 0, 0];
        let quizStatus = quizData.map(() => [false, false]);
        let timeLeft = 420;
        let timerInterval;

        function init() {
            renderNav();
            loadQuestion(0);
            startTimer();
        }

        function renderNav() {
            const container = document.getElementById('nav-tabs');
            container.innerHTML = quizData.map((_, i) => `
                <button onclick="loadQuestion(${i})" class="px-6 py-2 rounded-2xl font-bold transition-all ${i === currentQIdx ? 'bg-indigo-600 text-white shadow-lg scale-105' : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100'}">
                    題目 ${i + 1}
                </button>
            `).join('');
        }

        function loadQuestion(index) {
            currentQIdx = index;
            activeStepIdx = quizStatus[index][0] ? 1 : 0;
            renderNav();

            const q = quizData[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-description').innerHTML = q.desc;

            renderColumn(0, 'left-lines');
            renderColumn(1, 'right-lines');

            updateUIState();
            renderOptions();
            updateActiveSlot();
        }

        function renderColumn(stepIdx, containerId) {
            const step = quizData[currentQIdx].steps[stepIdx];
            const container = document.getElementById(containerId);
            let slotCounter = 0;

            let html = '';
            step.lines.forEach((line) => {
                const lineHtml = line.text.replace(/{slot}/g, () => {
                    const isDone = quizStatus[currentQIdx][stepIdx];
                    const val = isDone ? step.slots[slotCounter] : "";
                    const classes = isDone ? "slot correct filled" : "slot";
                    const s = `<div class="${classes}" data-step="${stepIdx}" data-i="${slotCounter}">${val}</div>`;
                    slotCounter++;
                    return s;
                });
                html += `<div class="math-line"><span class="step-label">${line.label}</span> ${lineHtml}</div>`;
            });
            container.innerHTML = html;
        }

        function renderOptions() {
            const container = document.getElementById('options-container');
            if (activeStepIdx > 1) {
                container.innerHTML = '<span class="text-indigo-400 font-bold italic text-2xl">✨ 棒極了！本題完成</span>';
                return;
            }
            const opts = quizData[currentQIdx].steps[activeStepIdx].options;
            container.innerHTML = opts.map(opt => `<button class="option-btn" onclick="fillActiveSlot('${opt}')">${opt}</button>`).join('');
        }

        function updateUIState() {
            const rightCol = document.getElementById('col-right');
            const leftDone = quizStatus[currentQIdx][0];
            rightCol.classList.toggle('locked-step', !leftDone);
            if (leftDone && !quizStatus[currentQIdx][1]) activeStepIdx = 1;
            else if (leftDone && quizStatus[currentQIdx][1]) activeStepIdx = 2;
            else activeStepIdx = 0;
        }

        function updateActiveSlot() {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            if (activeStepIdx > 1) return;
            const slots = Array.from(document.querySelectorAll(`.slot[data-step="${activeStepIdx}"]:not(.correct)`));
            const firstEmpty = slots.find(s => s.innerText === '');
            if (firstEmpty) {
                firstEmpty.classList.add('active');
                firstEmpty.onclick = () => {
                    if (firstEmpty.classList.contains('correct')) return;
                    firstEmpty.innerText = '';
                    firstEmpty.classList.remove('filled');
                    updateActiveSlot();
                };
            }
        }

        function fillActiveSlot(val) {
            const active = document.querySelector('.slot.active');
            if (!active) return;
            active.innerText = val;
            active.classList.add('filled');
            updateActiveSlot();
        }

        function showBigCheckmark() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 1000);
        }

        function checkActiveStep() {
            if (activeStepIdx > 1) return;
            const slots = document.querySelectorAll(`.slot[data-step="${activeStepIdx}"]`);
            const answers = Array.from(slots).map(s => s.innerText);
            if (answers.some(a => a === '')) { alertToast("空格還沒填完喔！"); return; }

            const correctAnswers = quizData[currentQIdx].steps[activeStepIdx].slots;
            const isCorrect = answers.every((a, i) => a === correctAnswers[i]);

            if (isCorrect) {
                quizStatus[currentQIdx][activeStepIdx] = true;
                scores[currentQIdx] += 1;
                updateTotalScore();
                playSound('correct');
                showBigCheckmark();

                setTimeout(() => {
                    loadQuestion(currentQIdx);
                    checkFinal();
                }, 600);
            } else {
                playSound('wrong');
                alertToast("計算結果不太對，再觀察看看題目的數字！");
            }
        }

        function updateTotalScore() {
            const total = scores.reduce((a, b) => a + b, 0);
            document.getElementById('total-score').innerText = total;
            document.getElementById('final-score').innerText = total;
        }

        function alertToast(msg, type = "error") {
            const toast = document.createElement('div');
            toast.className = `fixed top-40 left-1/2 -translate-x-1/2 px-10 py-5 rounded-3xl text-white font-bold shadow-2xl z-[300] transition-all duration-300 ${type === 'success' ? 'bg-emerald-500' : 'bg-rose-500'}`;
            toast.innerText = msg; document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { checkFinal(); return; }
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function checkFinal() {
            if (quizStatus.every(q => q.every(s => s === true))) {
                clearInterval(timerInterval);
                document.getElementById('finish-modal').classList.remove('hidden');
            }
        }

        function resetApp() {
            timeLeft = 420; scores = [0, 0, 0, 0]; quizStatus = quizData.map(() => [false, false]);
            updateTotalScore(); document.getElementById('finish-modal').classList.add('hidden');
            loadQuestion(0);
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        }
        window.onload = init;
    </script>
</body>

</html>
