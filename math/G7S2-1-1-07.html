<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學拼圖：二元一次方程式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FDFBF7;
            color: #374151;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 250px;
            max-height: 300px;
        }

        .tile {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            height: 60px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .tile:active {
            transform: scale(0.9);
        }

        .tile-normal {
            background-color: #FFFFFF;
            border: 3px solid #E5E7EB;
            color: #1F2937;
        }

        .tile-normal:hover {
            border-color: #4F46E5;
            background-color: #EEF2FF;
        }

        .tile-used {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(1);
        }

        .workspace-slot {
            min-width: 70px;
            height: 70px;
            border: 3px dashed #D1D5DB;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .equation-flow {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .equation-flow::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <!-- Chosen Palette: Warm Neutrals with Indigo (Interactive) and Emerald (Success) and Rose (Reset) accents. -->
    <!-- Application Structure Plan: The SPA is now optimized as a "Puzzle Solver". 
         1. Introduction: Briefly restates the logic. 
         2. Interactive Workspace: Students click "Tiles" to move them into a workspace area. 
         3. Dynamic Feedback: Visual validation of the equation structure. 
         This structure reduces motor-control demand (typing) and focuses on cognitive sequencing. -->
    <!-- Visualization & Content Choices: 
         - Logic: Question -> Parts Extraction -> Shuffled Tiles -> Workspace Assembly -> Result. 
         - Method: CSS Grid/Flex for puzzle tiles. Chart.js for reinforcement. 
         - Interaction: Clicking tiles moves them into the equation line. 'Clear' allows resetting. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <div class="max-w-5xl mx-auto space-y-8">

        <header class="text-center space-y-2">
            <h1 class="text-4xl md:text-5xl font-black text-indigo-700 tracking-tight">🧩 數學拼圖王 🧩</h1>
            <p class="text-xl font-medium text-stone-500">把正確的方塊點進框框裡，組成方程式！</p>
        </header>

        <!-- 觀念引導區 -->
        <section class="bg-white rounded-3xl shadow-lg p-6 border-l-8 border-indigo-500">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-100 p-3 rounded-2xl text-3xl">💡</div>
                <div>
                    <h3 class="text-xl font-bold text-stone-800">小撇步</h3>
                    <p class="text-stone-600">先找東西的錢（有 x 或 y 的），再放加上去（＋），最後寫出總共多少錢（＝）。</p>
                </div>
            </div>
        </section>

        <!-- 練習區 -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- 左側：題目與視覺化 (1/3) -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-3xl shadow-xl p-6 border-b-8 border-stone-200">
                    <div class="flex justify-between items-center mb-4">
                        <span id="q-progress"
                            class="text-sm font-bold bg-stone-100 px-3 py-1 rounded-full text-stone-500">題目 1/5</span>
                        <span class="text-2xl">📝</span>
                    </div>
                    <p id="q-text" class="text-xl font-bold leading-relaxed text-stone-800"></p>
                </div>

                <div class="bg-white rounded-3xl shadow-xl p-6">
                    <h4 class="text-center font-bold text-stone-400 mb-2">數量參考圖</h4>
                    <div class="chart-container">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右側：拼圖工作區 (2/3) -->
            <div class="lg:col-span-2 space-y-6">

                <!-- 拼圖存放區 -->
                <div class="bg-stone-100 rounded-3xl p-8 border-4 border-dashed border-stone-200">
                    <h3 class="text-lg font-bold text-stone-400 mb-6 text-center">👇 點擊下方方塊來選擇</h3>
                    <div id="tile-bank" class="flex flex-wrap justify-center gap-4">
                        <!-- 拼圖方塊會動態生成於此 -->
                    </div>
                </div>

                <!-- 拼圖組裝區 -->
                <div class="bg-white rounded-3xl shadow-2xl p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4">
                        <button id="clear-btn"
                            class="text-rose-500 font-bold hover:bg-rose-50 px-4 py-2 rounded-xl transition">重來
                            🔄</button>
                    </div>

                    <h3 class="text-lg font-bold text-stone-400 mb-8">我的方程式：</h3>

                    <div class="equation-flow pb-4">
                        <div id="workspace" class="flex items-center justify-center gap-3 min-h-[80px]">
                            <!-- 已選擇的方塊會出現在這 -->
                        </div>
                    </div>

                    <div id="feedback-area" class="mt-8 text-center min-h-[60px]">
                        <button id="check-btn"
                            class="px-12 py-4 bg-indigo-600 text-white font-black text-2xl rounded-2xl hover:bg-indigo-700 transform hover:scale-105 transition shadow-lg disabled:opacity-50">檢查答案
                            👀</button>
                        <button id="next-btn"
                            class="px-12 py-4 bg-emerald-500 text-white font-black text-2xl rounded-2xl hover:bg-emerald-700 transform hover:scale-105 transition shadow-lg hidden">挑戰下一題
                            ➡️</button>
                        <p id="feedback-msg" class="text-xl font-bold mt-4"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const qData = [
            { text: "小明買了每枝 x 元的原子筆 5 枝，以及每本 y 元的筆記本 3 本，總共付了 180 元。", tiles: ["5x", "3y", "+", "=", "180"], items: ["原子筆", "筆記本"], counts: [5, 3] },
            { text: "媽媽買了 8 顆每個 x 元的蘋果和 10 顆每個 y 元的奇異果，總共花了 450 元。", tiles: ["8x", "10y", "+", "=", "450"], items: ["蘋果", "奇異果"], counts: [8, 10] },
            { text: "電影院全票一張 x 元，優待票一張 y 元。老師買了 2 張全票和 15 張優待票，共計 3200 元。", tiles: ["2x", "15y", "+", "=", "3200"], items: ["全票", "優待票"], counts: [2, 15] },
            { text: "公司訂了 12 杯每杯 x 元的大杯珍奶和 6 杯每杯 y 元的中杯紅茶，總額 960 元。", tiles: ["12x", "6y", "+", "=", "960"], items: ["珍奶", "紅茶"], counts: [12, 6] },
            { text: "停車場有 20 輛每小時 x 元的汽車和 45 輛每小時 y 元的機車停放一小時，收入 1300 元。", tiles: ["20x", "45y", "+", "=", "1300"], items: ["汽車", "機車"], counts: [20, 45] }
        ];

        let currentIdx = 0;
        let selectedSequence = [];
        let myChart = null;

        function initApp() {
            loadQuestion();
            document.getElementById('check-btn').addEventListener('click', checkAnswer);
            document.getElementById('clear-btn').addEventListener('click', clearWorkspace);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        }

        function loadQuestion() {
            const q = qData[currentIdx];
            selectedSequence = [];

            // 更新進度與文字
            document.getElementById('q-progress').innerText = `題目 ${currentIdx + 1} / ${qData.length}`;
            document.getElementById('q-text').innerText = q.text;

            // 清空與渲染方塊銀行 (打散順序)
            const bank = document.getElementById('tile-bank');
            bank.innerHTML = '';
            const shuffledTiles = [...q.tiles].sort(() => Math.random() - 0.5);

            shuffledTiles.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile tile-normal';
                tile.innerText = val;
                tile.dataset.value = val;
                tile.dataset.id = i;
                tile.onclick = () => selectTile(tile);
                bank.appendChild(tile);
            });

            // 重置工作區與反饋
            updateWorkspace();
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('check-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            updateChart(q);
        }

        function selectTile(tileEl) {
            const val = tileEl.dataset.value;
            selectedSequence.push(val);
            tileEl.classList.add('tile-used');
            updateWorkspace();
        }

        function updateWorkspace() {
            const workspace = document.getElementById('workspace');
            workspace.innerHTML = '';

            // 顯示已選取的
            selectedSequence.forEach(val => {
                const tile = document.createElement('div');
                tile.className = 'tile bg-indigo-600 text-white border-none shadow-inner';
                tile.innerText = val;
                workspace.appendChild(tile);
            });

            // 顯示剩餘的空格 (提示方程式長度)
            const targetLen = qData[currentIdx].tiles.length;
            for (let i = selectedSequence.length; i < targetLen; i++) {
                const slot = document.createElement('div');
                slot.className = 'workspace-slot';
                workspace.appendChild(slot);
            }
        }

        function clearWorkspace() {
            selectedSequence = [];
            const tiles = document.querySelectorAll('#tile-bank .tile');
            tiles.forEach(t => t.classList.remove('tile-used'));
            updateWorkspace();
            document.getElementById('feedback-msg').innerText = '';
        }

        function checkAnswer() {
            const q = qData[currentIdx];
            const currentStr = selectedSequence.join(' ');

            // 判斷邏輯：基本順序必須對，但加法可交換 (ax + by = c 或 by + ax = c)
            const possibleAnswers = [
                `${q.tiles[0]} ${q.tiles[2]} ${q.tiles[1]} ${q.tiles[3]} ${q.tiles[4]}`, // ax + by = c
                `${q.tiles[1]} ${q.tiles[2]} ${q.tiles[0]} ${q.tiles[3]} ${q.tiles[4]}`  // by + ax = c
            ];

            const fb = document.getElementById('feedback-msg');

            if (possibleAnswers.includes(currentStr)) {
                fb.innerText = '太棒了！拼得完全正確！ 🎉';
                fb.className = 'text-2xl font-black text-emerald-600 mt-4 animate-bounce';
                document.getElementById('check-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                if (selectedSequence.length < q.tiles.length) {
                    fb.innerText = '拼圖還沒拼完喔，再加油！ 💪';
                } else {
                    fb.innerText = '順序好像不太對，再想一想喔！ 🧐';
                }
                fb.className = 'text-xl font-bold text-rose-500 mt-4';
            }
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < qData.length) {
                loadQuestion();
            } else {
                // 全部完成
                document.getElementById('q-text').innerText = "太厲害了！你已經完成所有挑戰，成為方程式拼圖王！🏆";
                document.getElementById('tile-bank').innerHTML = '<div class="text-5xl">👑🥇🏆</div>';
                document.getElementById('workspace').innerHTML = '';
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('feedback-msg').innerText = "全部練習完畢！";
            }
        }

        function updateChart(q) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: q.items,
                    datasets: [{
                        data: q.counts,
                        backgroundColor: ['#6366F1', '#10B981'],
                        borderRadius: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, display: false },
                        x: { ticks: { font: { weight: 'bold', size: 14 } }, grid: { display: false } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: true }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
