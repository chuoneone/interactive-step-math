<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函數圖形與性質</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 數學式樣式 */
        .math {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.25rem;
            display: inline-block;
            letter-spacing: 1px;
        }

        .math.large {
            font-size: 1.75rem;
            font-weight: bold;
            color: #1e40af;
        }

        .power {
            font-size: 0.65em;
            vertical-align: super;
            position: relative;
            top: -0.1em;
            margin-left: 1px;
        }

        /* 填答插槽樣式 */
        .slot {
            display: inline-block;
            min-width: 3.5rem;
            height: 2.5rem;
            margin: 0 0.25rem;
            border-bottom: 3px solid #94a3b8;
            background-color: #f8fafc;
            text-align: center;
            line-height: 2.5rem;
            font-weight: bold;
            font-size: 1.25rem;
            color: transparent;
            /* 預設透明 */
            cursor: pointer;
            border-radius: 0.375rem 0.375rem 0 0;
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        .slot.filled {
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            background-color: #f0fdf4;
            color: #15803d;
            cursor: default;
        }

        /* 按鈕禁用樣式 */
        .opt-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            background-color: #e2e8f0;
            color: #94a3b8;
            border-color: #cbd5e1;
        }

        /* 動畫 */
        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-tada {
            animation: tada 0.8s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }

        /* 隱藏滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center">
            <div class="font-bold text-lg text-blue-800 mr-4 shrink-0 border-r-2 border-blue-200 pr-4">單元：圖形平移與性質</div>
            <nav id="nav-tabs" class="flex gap-2 overflow-x-auto no-scrollbar py-1 flex-1">
                <!-- 導覽按鈕由 JS 生成 -->
            </nav>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="container mx-auto px-4 py-6 flex-1 flex flex-col md:flex-row gap-6 items-start max-w-6xl">

        <!-- 左側：題目區 (桌機固定) -->
        <aside
            class="w-full md:w-1/3 bg-white rounded-2xl shadow-sm p-6 md:sticky md:top-24 border-t-4 border-blue-500">
            <h2 class="text-xl font-bold text-gray-700 mb-2" id="q-title">題目載入中...</h2>
            <div class="my-6 text-center py-4 bg-blue-50 rounded-xl border border-blue-100">
                <span id="q-equation" class="math large"></span>
            </div>
            <div class="mt-4 p-4 bg-yellow-50 rounded-lg text-sm text-yellow-800 flex items-start gap-2">
                <svg class="w-5 h-5 shrink-0 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p>請依序點擊右側選項，完成各步驟的填空。答對後將解鎖下一步！</p>
            </div>
        </aside>

        <!-- 右側：步驟解鎖區 -->
        <section id="steps-container" class="w-full md:w-2/3 flex flex-col gap-5 pb-24">
            <!-- 步驟卡片由 JS 生成 -->
        </section>

    </main>

    <!-- 回饋提示框 (浮動) -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold text-lg shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50">
        提示訊息
    </div>

    <!-- 任務完成視窗 -->
    <div id="completion-modal"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div
            class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300 text-center">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">太棒了！完全正確</h3>
            <p class="text-gray-600 mb-6">你已經完成這題所有的步驟囉！</p>
            <div class="flex flex-col gap-3">
                <button onclick="closeModal(true)"
                    class="w-full py-3 bg-blue-500 text-white rounded-xl font-bold text-lg hover:bg-blue-600 active:scale-95 transition-all">關閉並保留答案</button>
                <button onclick="resetCurrentQuestion()"
                    class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 active:scale-95 transition-all">再做一次</button>
            </div>
        </div>
    </div>

    <script>
        // --- 題目資料庫 ---
        const quizData = [
            {
                id: 'q1', navTitle: '題目 1', title: '觀察函數圖形與性質',
                equationHTML: 'y = -x<span class="power">2</span> - 2',
                steps: [
                    { title: '(1) 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向下'] },
                    { title: '(2) 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '-2', '2', '-1'], answers: ['0', '-2'] },
                    { title: '(3) 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '-2'], answers: ['x', '0'] }
                ]
            },
            {
                id: 'q2', navTitle: '題目 2', title: '觀察函數圖形與性質',
                equationHTML: 'y = x<span class="power">2</span> + 2',
                steps: [
                    { title: '(1) 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向上'] },
                    { title: '(2) 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '2', '-2', '1'], answers: ['0', '2'] },
                    { title: '(3) 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '2'], answers: ['x', '0'] }
                ]
            },
            {
                id: 'q3', navTitle: '題目 3-(1)', title: '填入適當文字或符號',
                equationHTML: 'y = 2x<span class="power">2</span> + 4',
                steps: [
                    { title: '① 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向上'] },
                    { title: '② 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '4', '2', '-4'], answers: ['0', '4'] },
                    { title: '③ 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '2', '4'], answers: ['x', '0'] },
                    { title: '④ 函數圖形平移', template: '由 <span class="math">y=2x<span class="power">2</span></span> 的圖形向<mark class="bg-yellow-200 px-1 rounded">上</mark>平移 [slot] 個單位可得。', options: ['2', '4', '0'], answers: ['4'] }
                ]
            },
            {
                id: 'q4', navTitle: '題目 3-(2)', title: '填入適當文字或符號',
                equationHTML: 'y = -3x<span class="power">2</span> - 1',
                steps: [
                    { title: '① 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向下'] },
                    { title: '② 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '-1', '-3', '1'], answers: ['0', '-1'] },
                    { title: '③ 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '-1', '-3'], answers: ['x', '0'] },
                    { title: '④ 函數圖形平移', template: '由 <span class="math">y=-3x<span class="power">2</span></span> 的圖形向<mark class="bg-yellow-200 px-1 rounded">下</mark>平移 [slot] 個單位可得。', options: ['1', '-1', '3', '-3'], answers: ['1'] }
                ]
            },
            {
                id: 'q5', navTitle: '題目 3-(3)', title: '填入適當文字或符號',
                equationHTML: 'y = -x<span class="power">2</span> - 6',
                steps: [
                    { title: '① 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向下'] },
                    { title: '② 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '-6', '6', '-1'], answers: ['0', '-6'] },
                    { title: '③ 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '-6'], answers: ['x', '0'] },
                    { title: '④ 函數圖形平移', template: '由 <span class="math">y=-x<span class="power">2</span></span> 的圖形向 [slot] 平移 [slot] 個單位可得。', options: ['上', '下', '6', '-6', '1'], answers: ['下', '6'] }
                ]
            },
            {
                id: 'q6', navTitle: '題目 3-(4)', title: '填入適當文字或符號',
                equationHTML: 'y = 4x<span class="power">2</span> + 5',
                steps: [
                    { title: '① 開口方向', template: '開口方向：[slot]', options: ['向上', '向下'], answers: ['向上'] },
                    { title: '② 頂點坐標', template: '頂點坐標：( [slot] , [slot] )', options: ['0', '5', '4', '-5'], answers: ['0', '5'] },
                    { title: '③ 對稱軸方程式', template: '對稱軸方程式：[slot] = [slot]', options: ['x', 'y', '0', '5', '4'], answers: ['x', '0'] },
                    { title: '④ 函數圖形平移', template: '由 <span class="math">y=4x<span class="power">2</span></span> 的圖形向 [slot] 平移 [slot] 個單位可得。', options: ['上', '下', '4', '5'], answers: ['上', '5'] }
                ]
            }
        ];

        // --- 狀態管理 ---
        let currentQIdx = 0;
        let state = {}; // 儲存各題的進度 { q1: { currentStep: 0, slots: { 'step0': ['x','y'] } } }

        // --- 初始化 ---
        function init() {
            // 初始化狀態
            quizData.forEach(q => {
                state[q.id] = {
                    currentStep: 0,
                    slots: {},
                    completed: false
                };
                q.steps.forEach((_, idx) => state[q.id].slots[idx] = []);
            });

            renderNav();
            loadQuestion(0);
        }

        function renderNav() {
            const nav = document.getElementById('nav-tabs');
            nav.innerHTML = '';
            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm transition-colors border-2 ${idx === currentQIdx
                    ? 'bg-blue-500 text-white border-blue-500 shadow-md'
                    : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300 hover:text-blue-500'
                    }`;
                btn.innerText = q.navTitle;
                btn.onclick = () => loadQuestion(idx);

                // 若該題已完成，加個小勾勾
                if (state[q.id].completed) {
                    btn.innerHTML += ' <span class="text-green-300 ml-1">✔</span>';
                }
                nav.appendChild(btn);
            });
        }

        function loadQuestion(idx) {
            currentQIdx = idx;
            renderNav(); // 更新 Navbar 亮起狀態

            const q = quizData[currentQIdx];
            document.getElementById('q-title').innerHTML = q.title;
            document.getElementById('q-equation').innerHTML = q.equationHTML;

            renderSteps();
        }

        // --- 渲染步驟區 ---
        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            const q = quizData[currentQIdx];
            const qState = state[q.id];

            q.steps.forEach((step, stepIdx) => {
                // 只渲染已解鎖或當前的步驟
                if (stepIdx > qState.currentStep) return;

                const isCurrent = stepIdx === qState.currentStep;
                const isCompleted = stepIdx < qState.currentStep;

                // 建立卡片
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl shadow-sm border-2 p-5 transition-all duration-500 ${isCurrent ? 'border-blue-400 ring-4 ring-blue-50 scale-100' :
                    isCompleted ? 'border-green-200 bg-green-50/30 scale-[0.98] opacity-80' : 'hidden'
                    }`;
                card.id = `step-card-${stepIdx}`;

                // 標題與完成狀態
                const headerHtml = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold ${isCompleted ? 'text-green-700' : 'text-blue-800'}">
                            ${step.title}
                        </h3>
                        ${isCompleted ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 完成</span>' : ''}
                    </div>
                `;

                // 處理模板與插槽
                let templateHtml = step.template;
                const slotCount = (templateHtml.match(/\[slot\]/g) || []).length;
                let currentSlotIndex = 0;

                templateHtml = templateHtml.replace(/\[slot\]/g, () => {
                    const sId = `slot-${stepIdx}-${currentSlotIndex}`;
                    const savedVal = qState.slots[stepIdx][currentSlotIndex] || '';
                    const filledClass = savedVal ? (isCompleted ? 'correct' : 'filled') : '';

                    const slotHtml = `<span id="${sId}" class="slot ${filledClass}" 
                        data-step="${stepIdx}" data-idx="${currentSlotIndex}" 
                        ${!isCompleted ? `onclick="handleSlotClick(${stepIdx}, ${currentSlotIndex})"` : ''}>
                        ${savedVal || '&nbsp;'}
                    </span>`;
                    currentSlotIndex++;
                    return slotHtml;
                });

                const contentHtml = `<div class="text-xl md:text-2xl text-gray-700 mb-6 leading-relaxed flex items-center flex-wrap gap-y-2">${templateHtml}</div>`;

                // 選項區 (僅當前步驟顯示)
                let optionsHtml = '';
                if (isCurrent && !qState.completed) {
                    optionsHtml = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200"><p class="text-sm text-slate-500 mb-2 font-bold">點擊下方選項填入：</p><div class="flex flex-wrap gap-2">`;
                    step.options.forEach((opt, optIdx) => {
                        const optId = `opt-${stepIdx}-${optIdx}`;
                        // 檢查此選項是否已被使用
                        const isUsed = qState.slots[stepIdx].includes(opt);
                        optionsHtml += `<button id="${optId}" class="opt-btn px-5 py-2.5 bg-white border-2 border-slate-300 rounded-lg font-bold text-lg text-slate-700 hover:border-blue-400 hover:bg-blue-50 active:scale-95 transition-all shadow-sm" 
                            ${isUsed ? 'disabled' : ''} 
                            onclick="handleOptClick('${opt}', '${optId}', ${stepIdx})">${opt}</button>`;
                    });
                    optionsHtml += `</div></div>`;

                    // 檢查答案按鈕
                    optionsHtml += `
                        <div class="mt-4 flex justify-end">
                            <button onclick="checkAnswer(${stepIdx})" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-md hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-2">
                                檢查答案 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + contentHtml + optionsHtml;
                container.appendChild(card);
            });

            // 滾動到最新步驟
            setTimeout(() => {
                const latestCard = document.getElementById(`step-card-${qState.currentStep}`);
                if (latestCard) {
                    latestCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
        }

        // --- 互動邏輯 ---
        function handleOptClick(value, optId, stepIdx) {
            const qState = state[quizData[currentQIdx].id];
            const stepSlots = qState.slots[stepIdx];
            const slotCount = quizData[currentQIdx].steps[stepIdx].answers.length;

            // 找尋第一個空位
            let targetIdx = -1;
            for (let i = 0; i < slotCount; i++) {
                if (!stepSlots[i]) {
                    targetIdx = i;
                    break;
                }
            }

            if (targetIdx !== -1) {
                // 更新狀態
                stepSlots[targetIdx] = value;
                // 更新 UI
                const slotEl = document.getElementById(`slot-${stepIdx}-${targetIdx}`);
                slotEl.innerHTML = value;
                slotEl.classList.add('filled');
                slotEl.dataset.sourceId = optId; // 記住來源按鈕以便退回

                document.getElementById(optId).disabled = true;
            }
        }

        function handleSlotClick(stepIdx, slotIdx) {
            const qState = state[quizData[currentQIdx].id];
            const val = qState.slots[stepIdx][slotIdx];

            if (val) {
                const slotEl = document.getElementById(`slot-${stepIdx}-${slotIdx}`);
                const optId = slotEl.dataset.sourceId;

                // 清除狀態
                qState.slots[stepIdx][slotIdx] = null;
                // 更新 UI
                slotEl.innerHTML = '&nbsp;';
                slotEl.classList.remove('filled');
                delete slotEl.dataset.sourceId;

                // 恢復按鈕
                if (optId) {
                    const btn = document.getElementById(optId);
                    if (btn) btn.disabled = false;
                }
            }
        }

        function checkAnswer(stepIdx) {
            const q = quizData[currentQIdx];
            const qState = state[q.id];
            const userAns = qState.slots[stepIdx];
            const correctAns = q.steps[stepIdx].answers;

            // 檢查是否填滿
            const isFull = userAns.length === correctAns.length && !userAns.includes(null) && !userAns.includes(undefined);

            if (!isFull) {
                showToast('請將所有空格填滿喔！', 'warning');
                document.getElementById(`step-card-${stepIdx}`).classList.add('animate-shake');
                setTimeout(() => document.getElementById(`step-card-${stepIdx}`).classList.remove('animate-shake'), 300);
                return;
            }

            // 檢查正確性 (陣列比較)
            let isCorrect = true;
            for (let i = 0; i < correctAns.length; i++) {
                if (userAns[i] !== correctAns[i]) {
                    isCorrect = false;
                    break;
                }
            }

            const card = document.getElementById(`step-card-${stepIdx}`);

            if (isCorrect) {
                // 答對處理
                card.classList.add('animate-tada');
                showToast('答對了！很棒喔！', 'success');

                setTimeout(() => {
                    qState.currentStep++;

                    // 判斷是否全題完成
                    if (qState.currentStep >= q.steps.length) {
                        qState.currentStep = q.steps.length - 1; // 保持在最後一步
                        qState.completed = true;
                        renderNav(); // 更新打勾
                        renderSteps(); // 重新渲染最後狀態
                        setTimeout(() => {
                            showCompletionModal();
                        }, 500);
                    } else {
                        renderSteps(); // 解鎖下一步
                    }
                }, 1000);

            } else {
                // 答錯處理 (提示再想想，不清除答案)
                showToast('再想想看喔～', 'error');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 300);
            }
        }

        // --- UI 輔助功能 ---
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-10 left-1/2 transform -translate-x-1/2 px-8 py-3 rounded-full text-white font-bold text-lg shadow-xl transition-all duration-300 z-50 ${type === 'success' ? 'bg-green-500' :
                type === 'error' ? 'bg-red-500' : 'bg-orange-500'
                }`;

            toast.classList.remove('opacity-0', 'translate-y-4');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        function showCompletionModal() {
            const modal = document.getElementById('completion-modal');
            const inner = modal.querySelector('div');
            modal.classList.remove('hidden');
            // 觸發重繪以播放過渡動畫
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            inner.classList.remove('scale-95');
        }

        function closeModal(keepData) {
            const modal = document.getElementById('completion-modal');
            const inner = modal.querySelector('div');
            modal.classList.add('opacity-0');
            inner.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function resetCurrentQuestion() {
            const q = quizData[currentQIdx];
            state[q.id] = {
                currentStep: 0,
                slots: {},
                completed: false
            };
            q.steps.forEach((_, idx) => state[q.id].slots[idx] = []);

            closeModal();
            renderNav();
            renderSteps();
        }

        // 啟動程式
        window.onload = init;

    </script>
<script src="../progress.js"></script>
</body>
