<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比值與倍數關係 - 點擊填入版</title>
    <link rel="icon" href="../images/dog.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* 數學算式樣式 */
        .math {
            font-size: 32px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            margin: 0 10px;
        }

        .fraction span:first-child {
            border-bottom: 3px solid #334155;
            padding: 0 8px;
            min-width: 50px;
            text-align: center;
        }

        .fraction span:last-child {
            padding: 0 8px;
            min-width: 50px;
            text-align: center;
        }

        /* 填答格樣式 */
        .slot {
            display: inline-block;
            width: 60px;
            height: 54px;
            border-bottom: 4px solid #cbd5e1;
            text-align: center;
            vertical-align: middle;
            font-size: 36px;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.2s;
            background-color: transparent;
        }

        .slot.filled {
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
            border-radius: 8px 8px 0 0;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            color: #15803d;
            background-color: #f0fdf4;
        }

        .option-btn {
            transition: transform 0.1s, background-color 0.2s;
            touch-action: manipulation;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: #cbd5e1 !important;
        }

        .step-enter {
            animation: slideIn 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tada {
            animation: tada 0.8s ease-in-out;
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4 overflow-x-auto no-scrollbar py-1">
                <span class="font-bold text-slate-800 whitespace-nowrap bg-slate-100 px-3 py-1 rounded-lg">比值練習</span>
                <div id="nav-tabs" class="flex space-x-2">
                    <button onclick="switchTab(0)" id="tab-0"
                        class="px-5 py-2 rounded-xl bg-blue-600 text-white font-bold whitespace-nowrap shadow-sm transition-all">題目
                        1</button>
                    <button onclick="switchTab(1)" id="tab-1"
                        class="px-5 py-2 rounded-xl bg-white text-slate-600 font-bold whitespace-nowrap border border-slate-200 hover:bg-slate-50 transition-all">題目
                        2</button>
                    <button onclick="switchTab(2)" id="tab-2"
                        class="px-5 py-2 rounded-xl bg-white text-slate-600 font-bold whitespace-nowrap border border-slate-200 hover:bg-slate-50 transition-all">題目
                        3</button>
                </div>
            </div>
            <div class="flex items-center space-x-4 ml-4">
                <div class="text-lg font-bold text-orange-600 flex items-center">
                    <span class="mr-1">⏱️</span><span id="timer">07:00</span>
                </div>
                <div class="text-lg font-bold text-blue-700 flex items-center">
                    <span class="mr-1">⭐</span><span id="score">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full p-4 gap-6">

        <!-- 左側：題目固定區 -->
        <div class="w-full md:w-1/3">
            <div class="bg-white rounded-3xl shadow-xl p-8 sticky md:top-24 border border-slate-100">
                <h2 id="q-title"
                    class="text-2xl font-black mb-6 text-slate-800 border-b-4 border-blue-500 pb-2 inline-block">題目 1
                </h2>
                <div id="q-content" class="text-2xl leading-relaxed text-slate-700 font-medium">
                    <!-- 內容動態生成 -->
                </div>
                <div id="q-svg" class="mt-8 flex justify-center p-4 bg-slate-50 rounded-2xl">
                    <!-- SVG 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 右側：步驟解鎖區 -->
        <div class="w-full md:w-2/3 space-y-8" id="steps-container">
            <!-- 步驟由 JS 動態填入 -->
        </div>

    </main>

    <!-- 完成彈窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div
            class="bg-white rounded-[2rem] p-10 max-w-md w-full text-center shadow-2xl transform scale-90 transition-transform border-4 border-blue-100">
            <div class="text-7xl mb-6">🏆</div>
            <h3 class="text-3xl font-black text-slate-800 mb-3">挑戰成功！</h3>
            <p class="text-slate-500 mb-8 text-xl font-medium">你非常細心，<br>所有的比與比值都答對了！</p>
            <div class="flex flex-col space-y-4">
                <button onclick="resetCurrentApp()"
                    class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">再挑戰一次</button>
                <button onclick="toggleModal(false)"
                    class="w-full py-5 bg-slate-100 text-slate-600 rounded-2xl font-bold text-xl hover:bg-slate-200 transition-all">檢視答題結果</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "一、比值與倍數關係 (1)",
                content: "有<mark class='bg-yellow-100 px-1 rounded'>甲、乙</mark>兩個正方形，<br>甲周長為 <mark class='bg-blue-100 px-1 rounded'>8</mark> 公分，<br>乙周長為 <mark class='bg-green-100 px-1 rounded'>13</mark> 公分。",
                svg: `<svg width="220" height="130" viewBox="0 0 220 130">
                        <rect x="20" y="50" width="40" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" />
                        <text x="25" y="40" font-size="16" font-weight="bold" fill="#3b82f6">甲 (8)</text>
                        <rect x="110" y="20" width="70" height="70" fill="#f0fdf4" stroke="#10b981" stroke-width="3" />
                        <text x="125" y="15" font-size="16" font-weight="bold" fill="#10b981">乙 (13)</text>
                      </svg>`,
                steps: [
                    {
                        instruction: "(1) 甲周長和乙周長的比為何？",
                        type: "ratio",
                        slots: 2,
                        answer: ["8", "13"],
                        symbol: "：",
                        options: ["8", "13", "21", "5"]
                    },
                    {
                        instruction: "(2) 甲周長和乙周長的比值為何？",
                        type: "fraction",
                        slots: 2,
                        answer: ["8", "13"], // 分子在前，分母在後
                        options: ["8", "13", "5", "1"]
                    }
                ]
            },
            {
                id: 2,
                title: "一、比值與倍數關係 (2)",
                content: "裝有相同水量的杯子，<br>哥哥喝了 <mark class='bg-blue-100 px-1 rounded'>3</mark> 杯，<br>弟弟喝了 <mark class='bg-green-100 px-1 rounded'>2</mark> 杯。",
                svg: `<svg width="220" height="110" viewBox="0 0 220 110">
                        <path d="M30 25 L40 90 L70 90 L80 25" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" />
                        <text x="40" y="18" font-size="16" font-weight="bold" fill="#3b82f6">3 杯</text>
                        <path d="M120 25 L130 90 L160 90 L170 25" fill="#dcfce7" stroke="#10b981" stroke-width="3" />
                        <text x="130" y="18" font-size="16" font-weight="bold" fill="#10b981">2 杯</text>
                      </svg>`,
                steps: [
                    {
                        instruction: "(1) 哥哥和弟弟所喝水量的比為何？",
                        type: "ratio",
                        slots: 2,
                        answer: ["3", "2"],
                        symbol: "：",
                        options: ["3", "2", "5", "1"]
                    },
                    {
                        instruction: "(2) 哥哥和弟弟所喝水量的比值為何？",
                        type: "fraction",
                        slots: 2,
                        answer: ["3", "2"],
                        options: ["3", "2", "6", "5"]
                    }
                ]
            },
            {
                id: 3,
                title: "一、比值與倍數關係 (3)",
                content: "已知一杯鮮奶茶中，含有 <mark class='bg-blue-100 px-1 rounded'>2</mark> 份鮮奶和 <mark class='bg-orange-100 px-1 rounded'>5</mark> 份紅茶。",
                svg: `<svg width="220" height="160" viewBox="0 0 220 160">
                        <rect x="70" y="20" width="70" height="110" rx="8" fill="white" stroke="#94a3b8" stroke-width="3" />
                        <rect x="73" y="95" width="64" height="32" fill="#fffbeb" />
                        <text x="148" y="115" font-size="14" font-weight="bold" fill="#d97706">鮮奶(2)</text>
                        <rect x="73" y="23" width="64" height="72" fill="#78350f" />
                        <text x="148" y="65" font-size="14" font-weight="bold" fill="#78350f">紅茶(5)</text>
                        <text x="15" y="85" font-size="16" font-weight="bold" fill="#1e293b">整杯(?)</text>
                      </svg>`,
                steps: [
                    {
                        instruction: "思考：整杯鮮奶茶是幾份？ (2 + 5 = ?)",
                        type: "ratio",
                        slots: 1,
                        answer: ["7"],
                        options: ["5", "7", "2", "10"]
                    },
                    {
                        instruction: "(1) 鮮奶和整杯鮮奶茶的比為何？",
                        type: "ratio",
                        slots: 2,
                        answer: ["2", "7"],
                        symbol: "：",
                        options: ["2", "5", "7", "1"]
                    },
                    {
                        instruction: "(2) 鮮奶和整杯鮮奶茶的比值為何？",
                        type: "fraction",
                        slots: 2,
                        answer: ["2", "7"],
                        options: ["2", "5", "7", "9"]
                    }
                ]
            }
        ];

        let currentTabIndex = 0;
        let score = 0;
        let timeLeft = 420;
        let timerInterval;
        let gameState = {};

        function initGameState() {
            questions.forEach((_, idx) => {
                gameState[idx] = {
                    currentStep: 0,
                    completed: false,
                    stepData: []
                };
            });
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').textContent =
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function switchTab(index) {
            currentTabIndex = index;
            renderQuestion();
            updateTabUI();
        }

        function updateTabUI() {
            questions.forEach((_, idx) => {
                const tab = document.getElementById(`tab-${idx}`);
                if (idx === currentTabIndex) {
                    tab.className = "px-5 py-2 rounded-xl bg-blue-600 text-white font-bold whitespace-nowrap shadow-md transition-all";
                } else {
                    tab.className = "px-5 py-2 rounded-xl bg-white text-slate-600 font-bold whitespace-nowrap border border-slate-200 hover:bg-slate-50 transition-all";
                }
            });
        }

        function renderQuestion() {
            const q = questions[currentTabIndex];
            document.getElementById('q-title').textContent = `題目 ${currentTabIndex + 1}`;
            document.getElementById('q-content').innerHTML = q.content;
            document.getElementById('q-svg').innerHTML = q.svg;

            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            const state = gameState[currentTabIndex];

            q.steps.forEach((step, sIdx) => {
                if (sIdx > state.currentStep) return;

                const stepEl = document.createElement('div');
                const isCurrent = (sIdx === state.currentStep && !state.completed);
                const isDone = sIdx < state.currentStep || (state.completed && sIdx === q.steps.length - 1);

                stepEl.className = `bg-white rounded-[2rem] shadow-lg p-8 step-enter border-2 ${isCurrent ? 'border-blue-400' : 'border-transparent'} ${isDone ? 'bg-slate-50/50' : ''}`;

                stepEl.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-black ${isDone ? 'text-green-600' : 'text-slate-800'}">
                            步驟 ${sIdx + 1} ${isDone ? ' <span class="ml-2">✔ 已完成</span>' : ''}
                        </h3>
                    </div>
                    <p class="text-2xl mb-8 text-slate-700 font-bold">${step.instruction}</p>
                    
                    <div class="flex flex-col items-center justify-center gap-6 mb-8">
                        <div class="math">
                            ${renderLayout(step, sIdx, isDone)}
                        </div>
                    </div>

                    ${!isDone ? `
                    <div class="grid grid-cols-4 gap-4 mb-8">
                        ${step.options.map(opt => {
                    const isUsed = state.stepData[sIdx]?.includes(opt);
                    return `
                                <button onclick="fillSlot('${opt}', ${sIdx})" 
                                        id="opt-${sIdx}-${opt}"
                                        ${isUsed ? 'disabled' : ''}
                                        class="option-btn py-4 rounded-2xl bg-white text-blue-700 font-black text-3xl border-4 border-blue-100 hover:border-blue-300 hover:bg-blue-50 shadow-sm disabled:bg-slate-100">
                                    ${opt}
                                </button>
                            `;
                }).join('')}
                    </div>
                    <button onclick="checkAnswer(${sIdx})" 
                            class="w-full py-5 bg-orange-500 text-white rounded-[1.25rem] font-black text-2xl shadow-xl shadow-orange-100 hover:bg-orange-600 transform hover:-translate-y-1 transition-all">
                        檢查答案
                    </button>
                    ` : ''}
                `;
                container.appendChild(stepEl);
            });
        }

        function renderLayout(step, sIdx, isDone) {
            const state = gameState[currentTabIndex];
            const data = state.stepData[sIdx] || [];

            if (step.type === "fraction") {
                // 分數布局：分子 numerator, 分母 denominator
                const num = data[0] || '';
                const den = data[1] || '';
                return `
                    <div class="math">
                        比值＝
                        <div class="fraction">
                            <span class="slot ${num ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="${!isDone ? `clearSlot(${sIdx}, 0)` : ''}">${num}</span>
                            <span class="slot ${den ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="${!isDone ? `clearSlot(${sIdx}, 1)` : ''}">${den}</span>
                        </div>
                    </div>
                `;
            } else {
                // 普通比布局
                let html = '';
                for (let i = 0; i < step.slots; i++) {
                    const val = data[i] || '';
                    html += `<div class="slot ${val ? 'filled' : ''} ${isDone ? 'correct' : ''}" 
                                  onclick="${!isDone ? `clearSlot(${sIdx}, ${i})` : ''}">${val}</div>`;
                    if (i < step.slots - 1 && step.symbol) {
                        html += `<span class="text-4xl text-slate-400 mx-2">${step.symbol}</span>`;
                    }
                }
                return html;
            }
        }

        window.fillSlot = function (value, sIdx) {
            const state = gameState[currentTabIndex];
            if (!state.stepData[sIdx]) state.stepData[sIdx] = [];

            const step = questions[currentTabIndex].steps[sIdx];
            if (state.stepData[sIdx].length < step.slots) {
                state.stepData[sIdx].push(value);
                renderQuestion();
            }
        };

        window.clearSlot = function (sIdx, slotIdx) {
            const state = gameState[currentTabIndex];
            if (state.stepData[sIdx] && state.stepData[sIdx][slotIdx] !== undefined) {
                state.stepData[sIdx].splice(slotIdx, 1);
                renderQuestion();
            }
        };

        window.checkAnswer = function (sIdx) {
            const state = gameState[currentTabIndex];
            const step = questions[currentTabIndex].steps[sIdx];
            const userAns = state.stepData[sIdx] || [];

            if (userAns.length < step.slots) {
                showToast("還有空格沒填完喔！");
                return;
            }

            const isCorrect = userAns.every((val, i) => val === step.answer[i]);

            if (isCorrect) {
                score += 1;
                document.getElementById('score').textContent = score;

                if (sIdx < questions[currentTabIndex].steps.length - 1) {
                    state.currentStep++;
                    renderQuestion();
                    setTimeout(() => {
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }, 200);
                } else {
                    state.completed = true;
                    renderQuestion();
                    checkOverallCompletion();
                }
            } else {
                showToast("再想想看喔！比值是「前項」放在上面，「後項」放在下面。");
            }
        };

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = "toast fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-4 rounded-2xl shadow-2xl z-[200] animate-bounce font-bold text-lg";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function checkOverallCompletion() {
            const allDone = Object.values(gameState).every(s => s.completed);
            if (allDone) {
                setTimeout(() => toggleModal(true), 600);
            } else {
                showToast("這一題答對了！點擊上方按鈕做下一題。");
            }
        }

        window.toggleModal = function (show) {
            const modal = document.getElementById('finish-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        };

        window.resetCurrentApp = function () {
            timeLeft = 420;
            score = 0;
            document.getElementById('score').textContent = score;
            initGameState();
            currentTabIndex = 0;
            toggleModal(false);
            renderQuestion();
            updateTabUI();
            startTimer();
        };

        window.onload = () => {
            initGameState();
            renderQuestion();
            startTimer();
        };
    </script>
</body>

</html>
