            color: #cbd5e1;

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }

            animation: tada 1s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }

        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;

        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }

        .animate-float-up {

                    title: "第 8 題",
                    content: "已知一個等差級數的首項為 <mark>-8</mark>，末項為 <mark>-72</mark>，和為 <mark>-680</mark>，求此等差級數的公差。",
                    derivation: `\\begin{aligned} &\\text{1. 找項數：} S_n = \\frac{(a_1 + a_n) \\times n}{2} \\\\ &\\text{2. 找公差：} a_n = a_1 + (n - 1)d \\end{aligned}`,
                    steps: [
                        {
                            id: "p8-s1",
                            instruction: "【步驟一：找項數】將首項、末項、和代入公式：<br> (首 + 末) × 項數 ÷ 2 = 和",
                            layout: [
                                { type: 'text', value: '(' },
                                { type: 'slot', index: 0 },
                                { type: 'text', value: '+' },
                                { type: 'slot', index: 1 },
                                { type: 'text', value: ') \\times \\text{項數} \\div 2 =' },
                                { type: 'slot', index: 2 }
                            ],
                            correctAnswers: ["-8", "-72", "-680"],
                            options: ["-8", "-72", "-680", "17"]
                        },
                        {
                            id: "p8-s2",
                            instruction: "先計算括號內的首項加末項：<br> (-8) + (-72) = ?",
                            layout: [
                                { type: 'slot', index: 0 },
                                { type: 'text', value: '\\times \\text{項數} \\div 2 = -680' }
                            ],
                            correctAnswers: ["-80"],
                            options: ["-80", "80", "-680"]
                        },
                        {
                            id: "p8-s3",
                            instruction: "把 ÷ 2 移到等號右邊變成 × 2：<br> (-680) × 2 = ?",
                            layout: [
                                { type: 'text', value: '-80 \\times \\text{項數} =' },
                                { type: 'slot', index: 0 }
                            ],
                            correctAnswers: ["-1360"],
                            options: ["-1360", "1360", "-680"]
                        },
                        {
                            id: "p8-s4",
                            instruction: "最後計算除法求出項數：<br> (-1360) ÷ (-80) = ?",
                            layout: [
                                { type: 'text', value: '\\text{項數} =' },
                                { type: 'slot', index: 0 }
                            ],
                            correctAnswers: ["17"],
                            options: ["17", "-17", "-1360"]
                        },
                        {
                            id: "p8-s5",
                            instruction: "【步驟二：找公差】將首項、剛算出的項數、末項代入公式：<br> 首 + (項 - 1) × d = 末",
                            layout: [
                                { type: 'text', value: '(' },
                                { type: 'slot', index: 0 },
                                { type: 'text', value: ') + (' },
                                { type: 'slot', index: 1 },
                                { type: 'text', value: '- 1) \\times d = (' },
                                { type: 'slot', index: 2 },
                                { type: 'text', value: ')' }
                            ],
                            correctAnswers: ["-8", "17", "-72"],
                            options: ["-8", "17", "-72", "-4"]
                        },
                        {
                            id: "p8-s6",
                            instruction: "先計算括號內的項數減 1：<br> 17 - 1 = ?",
                            layout: [
                                { type: 'text', value: '-8 +' },
                                { type: 'slot', index: 0 },
                                { type: 'text', value: '\\times d = -72' }
                            ],
                            correctAnswers: ["16"],
                            options: ["16", "18", "17"]
                        },
                        {
                            id: "p8-s7",
                            instruction: "將首項移到等號右邊相減：<br> (-72) - (-8) = ?",
                            layout: [
                                { type: 'text', value: '16 \\times d =' },
                                { type: 'slot', index: 0 }
                            ],
                            correctAnswers: ["-64"],
                            options: ["-64", "-80", "-72"]
                        },
                        {
                            id: "p8-s8",
                            instruction: "最後計算除法求出公差 d：<br> (-64) ÷ 16 = ?",
                            layout: [
                                { type: 'text', value: 'd =' },
                                { type: 'slot', index: 0 }
                            ],
                            correctAnswers: ["-4"],
                            options: ["-4", "4", "-64"]
                        }
                    ]
                }
            ]
        };

        // --- 狀態管理 ---
        let currentProblemIndex = 0;
        let activeStepIndex = 0; // 當前正在作答的步驟

        // 記錄每題的進度 { problemId: { stepIndex: 0, answers: {'p1-s1': ['33']}, completed: false } }
        let progressState = {};

        // 記錄步驟嘗試次數 (答錯一次就不給分)
        let attemptCounts = {};

        // 分數管理：依據檔案名稱獨立計分
        const appFilename = window.location.pathname.split('/').pop().split('.')[0] || 'unit';
        const SCORE_KEY = 'math_score_' + appFilename;
        let scoreData = JSON.parse(localStorage.getItem(SCORE_KEY)) || [];
        
        // 每次重新整理頁面都是一次「新的練習」
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        let currentSession = { time: timeStr, score: 0 };
        scoreData.unshift(currentSession);
        if (scoreData.length > 20) scoreData.pop(); // 保留最近 20 次紀錄
        localStorage.setItem(SCORE_KEY, JSON.stringify(scoreData));

        let earnedSteps = {}; // 記錄本次練習已經給過分的步驟，避免重做刷分

        // --- 初始化 ---
        function init() {
            // 初始化進度狀態
            appData.problems.forEach((p, idx) => {
                progressState[idx] = { stepIndex: 0, answers: {}, completed: false };
                p.steps.forEach(s => { attemptCounts[s.id] = 0; });
            });

            updateScoreDisplay();
            renderNav();
            loadProblem(0);
        }

        // --- 渲染導覽列 ---
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';

            appData.problems.forEach((prob, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-6 py-2 rounded-full font-bold text-lg transition-all ${index === currentProblemIndex
                    ? 'bg-blue-600 text-white shadow-md transform scale-105'
                    : 'bg-white text-blue-600 border border-blue-200 hover:bg-blue-50'
                    }`;
                btn.innerHTML = `${prob.title} ${progressState[index].completed ? '<span class="text-green-300 ml-1">✔</span>' : ''}`;
                btn.onclick = () => loadProblem(index);
                container.appendChild(btn);
            });
        }

        // --- 載入單一題目 ---
        function loadProblem(index) {
            currentProblemIndex = index;
            const problem = appData.problems[index];
            const state = progressState[index];
            activeStepIndex = state.stepIndex;

            // 1. 更新左側題目區
            document.getElementById('problem-title').innerText = problem.title;
            document.getElementById('problem-desc').innerHTML = problem.content;

            // 渲染題目文字內的數學式
            renderMathInElement(document.getElementById('problem-desc'), {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                ],
                throwOnError: false
            });

            // 渲染 KaTeX 推導
            const derivationEl = document.getElementById('problem-derivation');
            katex.render(problem.derivation, derivationEl, { displayMode: true, throwOnError: false });

            // 2. 更新導覽列視覺
            renderNav();

            // 3. 渲染右側步驟區
            renderSteps();

            // 滾動到頂部
            if (window.innerWidth < 768) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById('steps-container').scrollTop = 0;
            }
        }

        // --- 渲染所有步驟 ---
        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            const problem = appData.problems[currentProblemIndex];
            const state = progressState[currentProblemIndex];

            problem.steps.forEach((step, index) => {
                const isCompleted = index < activeStepIndex || state.completed;
                const isActive = index === activeStepIndex && !state.completed;
                const isLocked = index > activeStepIndex && !state.completed;

                // 建立卡片
                const card = document.createElement('div');
                card.id = `step-card-${index}`;
                card.className = `bg-white rounded-2xl shadow-sm border-2 p-6 transition-all duration-500 relative
                    ${isActive ? 'border-blue-400 ring-4 ring-blue-50 transform scale-[1.02] z-10' : 'border-transparent'}
                    ${isLocked ? 'opacity-40 pointer-events-none filter grayscale-[0.5]' : ''}
                    ${isCompleted ? 'border-green-200 bg-green-50/30' : ''}`;

                // 標題與完成圖示
                const headerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-black ${isCompleted ? 'text-green-600' : 'text-blue-800'} flex items-center">
                            步驟 ${index + 1}
                            ${isCompleted ? '<svg class="w-6 h-6 ml-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </h3>
                    </div>
                    <p class="text-lg text-gray-700 font-bold mb-6">${step.instruction}</p>
                `;

                // 數學式與填答格區域
                const answersHtml = state.answers[step.id] || Array(step.correctAnswers.length).fill('');

                let equationHTML = '<div class="flex items-center flex-wrap gap-2 text-2xl font-bold font-serif mb-6 bg-gray-50 p-4 rounded-xl">';

                if (step.layout) {
                    step.layout.forEach(item => {
                        if (item.type === 'text') {
                            equationHTML += `<span class="katex-render-target" data-expr="${item.value}"></span>`;
                        } else if (item.type === 'slot') {
                            const val = answersHtml[item.index];
                            const slotClass = `slot ${val ? 'filled' : ''} ${isCompleted ? 'completed' : ''}`;
                            const originData = val ? `data-val="${val}"` : '';
                            equationHTML += `<button class="${slotClass}" onclick="handleSlotClick(${index}, ${item.index}, this)" ${originData}>${val || ''}</button>`;
                        }
                    });
                }
                equationHTML += '</div>';

                // 選項區域 (已完成的步驟隱藏選項)
                let optionsHTML = '';
                if (!isCompleted) {
                    optionsHTML = `<div class="flex flex-wrap gap-3 mb-6" id="options-${step.id}">`;
                    step.options.forEach((opt, optIndex) => {
                        // 檢查該選項是否已被填入
                        const isUsed = answersHtml.includes(opt);
                        optionsHTML += `<button class="option-btn" ${isUsed ? 'disabled' : ''} onclick="handleOptionClick(${index}, '${opt}', this)">${opt}</button>`;
                    });
                    optionsHTML += `</div>`;
                }

                // 按鈕與回饋區
                let actionHTML = '';
                if (!isCompleted) {
                    actionHTML = `
                        <div class="mt-4">
                            <button onclick="checkStep(${index})" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xl font-black shadow-md transition-colors">
                                檢查答案
                            </button>
                            <p id="feedback-${step.id}" class="text-red-500 mt-3 text-center font-bold text-lg hidden transition-opacity">再想想看哦！</p>
                        </div>
                    `;
                }

                card.innerHTML = headerHTML + equationHTML + optionsHTML + actionHTML;
                container.appendChild(card);

                // 渲染整個卡片內的文字數學式 ($...$)
                renderMathInElement(card, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });

                // 渲染 KaTeX
                const katexTargets = card.querySelectorAll('.katex-render-target');
                katexTargets.forEach(target => {
                    katex.render(target.dataset.expr, target, { throwOnError: false });
                });
            });

            // 若整題完成，顯示再做一次按鈕在底部
            if (state.completed) {
                const restartBtn = document.createElement('button');
                restartBtn.className = "w-full mt-6 py-4 bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-700 rounded-xl text-xl font-bold shadow-sm transition-colors";
                restartBtn.innerText = "重新練習本題";
                restartBtn.onclick = () => {
                    progressState[currentProblemIndex] = { stepIndex: 0, answers: {}, completed: false };
                    appData.problems[currentProblemIndex].steps.forEach(s => { attemptCounts[s.id] = 0; });
                    loadProblem(currentProblemIndex);
                };
                container.appendChild(restartBtn);
            }
        }

        // --- 點擊選項填入 ---
        function handleOptionClick(stepIndex, value, btnElement) {
            const stepId = appData.problems[currentProblemIndex].steps[stepIndex].id;
            let currentAnswers = progressState[currentProblemIndex].answers[stepId] || [];
            const maxSlots = appData.problems[currentProblemIndex].steps[stepIndex].correctAnswers.length;

            // 初始化陣列
            if (currentAnswers.length === 0) currentAnswers = Array(maxSlots).fill('');

            // 尋找第一個空格
            const emptyIndex = currentAnswers.indexOf('');
            if (emptyIndex !== -1) {
                // 更新狀態
                currentAnswers[emptyIndex] = value;
                progressState[currentProblemIndex].answers[stepId] = currentAnswers;

                // 重新渲染該步驟以更新 UI (隱藏錯誤訊息等)
                updateStepUI(stepIndex);
            }
        }

        // --- 點擊空格清除 ---
        function handleSlotClick(stepIndex, slotIndex, slotElement) {
            const stepId = appData.problems[currentProblemIndex].steps[stepIndex].id;
            // 已完成的步驟不能修改
            if (progressState[currentProblemIndex].completed || stepIndex < activeStepIndex) return;

            let currentAnswers = progressState[currentProblemIndex].answers[stepId];
            if (!currentAnswers || !currentAnswers[slotIndex]) return;

            // 清除狀態
            currentAnswers[slotIndex] = '';
            progressState[currentProblemIndex].answers[stepId] = currentAnswers;

            // 重新渲染以更新選項按鈕狀態
            updateStepUI(stepIndex);
        }

        // --- 局部更新步驟 UI ---
        function updateStepUI(stepIndex) {
            const step = appData.problems[currentProblemIndex].steps[stepIndex];
            const currentAnswers = progressState[currentProblemIndex].answers[step.id] || [];
            const card = document.getElementById(`step-card-${stepIndex}`);

            // 更新 Slots
            const slots = card.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                const val = currentAnswers[i];
                slot.innerText = val || '';
                if (val) {
                    slot.classList.add('filled');
                    slot.dataset.val = val;
                } else {
                    slot.classList.remove('filled');
                    delete slot.dataset.val;
                }
            });

            // 更新選項按鈕狀態
            const optionsContainer = document.getElementById(`options-${step.id}`);
            if (optionsContainer) {
                const btns = optionsContainer.querySelectorAll('.option-btn');
                btns.forEach(btn => {
                    // 如果這個按鈕的值在答案陣列中，則禁用
                    // 注意：如果有重複的選項值，這會把相同值的按鈕都禁用，
                    // 為了簡化邏輯且符合本題情境，我們用 filter 算數量
                    const valCountInAnswers = currentAnswers.filter(v => v === btn.innerText).length;

                    // 這裡的邏輯：如果在 DOM 中前面的同值按鈕已經被禁用了，就禁用這個。
                    // 為了穩定，直接重新比對。若答案中有這個值，禁用它。
                    // 假設選項不重複，或者重複時一起禁用 (本題選項設計無重複)
                    if (currentAnswers.includes(btn.innerText)) {
                        btn.disabled = true;
                    } else {
                        btn.disabled = false;
                    }
                });
            }

            // 隱藏錯誤提示
            const feedback = document.getElementById(`feedback-${step.id}`);
            if (feedback) feedback.classList.add('hidden');
        }

        // --- 檢查答案 ---
        function checkStep(stepIndex) {
            const step = appData.problems[currentProblemIndex].steps[stepIndex];
            const userAnswers = progressState[currentProblemIndex].answers[step.id] || [];
            const correctAnswers = step.correctAnswers;
            const card = document.getElementById(`step-card-${stepIndex}`);
            const feedback = document.getElementById(`feedback-${step.id}`);

            // 檢查是否填滿
            const emptyCount = correctAnswers.length - userAnswers.filter(a => a !== '').length;
            if (emptyCount > 0) {
                feedback.innerText = "請將空格填滿哦！";
                feedback.classList.remove('hidden');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 500);
                return;
            }

            // 比對答案
            let isCorrect = true;
            for (let i = 0; i < correctAnswers.length; i++) {
                if (userAnswers[i] !== correctAnswers[i]) isCorrect = false;
            }

            if (isCorrect) {
                // 答對了！
                card.classList.add('animate-tada');

                // 計分邏輯 (第一次答對且尚未給過分才給滿分，防止重做刷分)
                if (attemptCounts[step.id] === 0 && !earnedSteps[step.id]) {
                    earnedSteps[step.id] = true;
                    currentSession.score += 10;
                    scoreData[0] = currentSession;
                    localStorage.setItem(SCORE_KEY, JSON.stringify(scoreData));
                    updateScoreDisplay();
                    triggerScoreAnimation(10);
                }

                setTimeout(() => {
                    // 解鎖下一步
                    activeStepIndex++;
                    progressState[currentProblemIndex].stepIndex = activeStepIndex;

                    if (activeStepIndex >= appData.problems[currentProblemIndex].steps.length) {
                        // 整題完成
                        progressState[currentProblemIndex].completed = true;
                        renderNav(); // 更新上方 ✔ 號
                        showCompletionModal();
                    }

                    renderSteps(); // 重新渲染整個右側區塊

                    // 平滑滾動到下一個卡片
                    if (activeStepIndex < appData.problems[currentProblemIndex].steps.length) {
                        const nextCard = document.getElementById(`step-card-${activeStepIndex}`);
                        if (nextCard) {
                            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }, 1000); // 動畫結束後執行

            } else {
                // 答錯
                attemptCounts[step.id]++;
                feedback.innerText = "答錯囉！這步已經沒有分數了，但請重新選出正確答案吧！";
                feedback.classList.remove('hidden');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 500);
                
                // 自動清掉這步的錯誤作答，強制得重選
                progressState[currentProblemIndex].answers[step.id] = [];
                updateStepUI(stepIndex);
            }
        }

        // --- 分數與歷程系統 ---
        function triggerScoreAnimation(points) {
            const btn = document.getElementById('score-btn');
            if (btn) {
                // 按鈕縮放動畫
                btn.classList.add('animate-tada');
                setTimeout(() => btn.classList.remove('animate-tada'), 1000);

                // 飄字動畫
                const floatText = document.createElement('div');
                floatText.className = 'absolute -top-6 -right-2 text-red-500 font-black text-2xl animate-float-up pointer-events-none drop-shadow-md z-50';
                floatText.innerText = '+' + points;
                btn.appendChild(floatText);
                setTimeout(() => floatText.remove(), 1000);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('total-score-display').innerText = `${currentSession.score} 分`;
            
            const modalScoreEl = document.getElementById('modal-total-score');
            if(modalScoreEl) modalScoreEl.innerText = currentSession.score;

            const list = document.getElementById('score-history-list');
            if(list) {
                list.innerHTML = '';
                if (scoreData.length <= 1 && currentSession.score === 0) {
                    list.innerHTML = '<li class="text-gray-500 text-center py-4">目前還沒有紀錄哦，開始挑戰吧！</li>';
                    return;
                }

                scoreData.forEach((session, idx) => {
                    const isCurrent = idx === 0;
                    list.innerHTML += `
                        <li class="flex justify-between items-center border-b border-gray-200 pb-2 ${isCurrent ? 'bg-yellow-50 rounded p-2' : ''}">
                            <div>
                                <span class="text-sm text-gray-400 mr-2">${session.time}</span>
                                <span class="font-bold ${isCurrent ? 'text-red-700' : 'text-gray-700'}">${isCurrent ? '本次練習' : '過去練習紀錄'}</span>
                            </div>
                            <span class="font-black ${isCurrent ? 'text-red-500' : 'text-green-600'}">${session.score} 分</span>
                        </li>
                    `;
                });
            }
        }

        function toggleScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function clearScoreHistory() {
            if (confirm('確定要清除所有分數紀錄嗎？')) {
                currentSession.score = 0;
                scoreData = [currentSession];
                earnedSteps = {};
                localStorage.setItem(SCORE_KEY, JSON.stringify(scoreData));
                updateScoreDisplay();
                toggleScoreModal();
            }
        }

        // --- 完成視窗控制 ---
        function showCompletionModal() {
            // 計算本題獲得的分數
            const problem = appData.problems[currentProblemIndex];
            const earnedScore = problem.steps.reduce((score, s) => attemptCounts[s.id] === 0 ? score + 10 : score, 0);
            const scoreDisplay = document.getElementById('concept-score');
            if (scoreDisplay) scoreDisplay.innerHTML = '+' + earnedScore + ' <span class="text-2xl">分</span>';

            const modal = document.getElementById('completion-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // 動畫進場
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function closeCompletionModal(reset) {
            const modal = document.getElementById('completion-modal');

            // 動畫退場
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');

                if (reset) {
                    // 清除進度並重來
                    progressState[currentProblemIndex] = { stepIndex: 0, answers: {}, completed: false };
                    appData.problems[currentProblemIndex].steps.forEach(s => { attemptCounts[s.id] = 0; });
                    loadProblem(currentProblemIndex);
                } else {
                    // 保留並重新渲染顯示重做按鈕
                    renderSteps();
                }
            }, 300);
        }

        // 啟動應用程式
        window.onload = init;

    </script>
<script src="../progress.js"></script>
