<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正比例關係互動解題</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }

        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .slot {
            width: 80px;
            height: 50px;
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            transition: all 0.3s;
            background-color: white;
        }

        .slot:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .slot.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            animation: pulse-blue 1.5s infinite;
        }

        @keyframes pulse-blue {
            0% {
                box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0px rgba(59, 130, 246, 0);
            }
        }

        .step-container {
            transition: all 0.5s ease-out;
            opacity: 0;
            transform: translateY(20px);
            display: none;
        }

        .step-container.unlocked {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .check-mark {
            display: none;
            color: #22c55e;
            animation: scale-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scale-in {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        /* 自定義捲軸 */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="h-screen flex flex-col">

    <!-- 導覽列 -->
    <nav class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-4">
            <span class="text-xl font-bold text-blue-700">二、正比例關係</span>
            <div class="flex gap-2 ml-4">
                <button onclick="switchProblem(0)" id="btn-p0"
                    class="px-4 py-1 rounded-full border-2 border-blue-200 bg-blue-50 text-blue-700 font-medium hover:bg-blue-100 transition">第
                    1 題</button>
                <button onclick="switchProblem(1)" id="btn-p1"
                    class="px-4 py-1 rounded-full border-2 border-transparent text-gray-500 font-medium hover:bg-gray-100 transition">第
                    2 題</button>
                <button onclick="switchProblem(2)" id="btn-p2"
                    class="px-4 py-1 rounded-full border-2 border-transparent text-gray-500 font-medium hover:bg-gray-100 transition">第
                    3 題</button>
            </div>
        </div>
        <div class="flex items-center gap-8">
            <div class="text-lg font-bold text-slate-600">
                得分：<span id="score-display" class="text-blue-600">0</span>
            </div>
            <div class="text-lg font-bold text-red-500 bg-red-50 px-4 py-1 rounded-lg border border-red-100">
                ⏱ 剩餘時間：<span id="timer-display">07:00</span>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex overflow-hidden">
        <!-- 左側：題目顯示 -->
        <div class="w-1/3 bg-slate-50 border-r p-8 flex flex-col justify-center">
            <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200">
                <div class="text-sm font-bold text-blue-500 mb-2" id="prob-num-label">QUESTION 01</div>
                <h2 id="prob-text" class="text-3xl font-bold text-slate-800 leading-relaxed mb-6">
                    已知 y 和 x 成正比，且 x = 3 時，y = -18。
                </h2>
                <div class="space-y-4 text-xl text-slate-600">
                    <p class="flex items-center gap-2"><span
                            class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-bold">1</span>
                        求 x、y 的關係式。</p>
                    <p class="flex items-center gap-2"><span
                            class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-bold">2</span>
                        當 x = 12 時，y 是多少？</p>
                </div>
            </div>
        </div>

        <!-- 右側：步驟解題區 -->
        <div id="workspace" class="flex-1 p-10 overflow-y-auto custom-scroll bg-white">
            <div id="steps-container" class="max-w-2xl mx-auto space-y-12">
                <!-- 步驟內容由 JS 動態生成 -->
            </div>
        </div>
    </main>

    <!-- 結算視窗 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-bold mb-2">完成練習！</h2>
            <p id="final-stats" class="text-xl text-slate-600 mb-8 font-medium">總得分：0 分 | 用時：00:00</p>
            <div class="flex gap-4">
                <button onclick="location.reload()"
                    class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold text-xl hover:bg-blue-700 transition shadow-lg">再做一次</button>
                <button onclick="document.getElementById('modal-overlay').style.display='none'"
                    class="flex-1 py-4 bg-slate-200 text-slate-700 rounded-2xl font-bold text-xl hover:bg-slate-300 transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const problems = [
            {
                id: 0,
                text: "已知 y 和 x 成正比，且 x = 3 時，y = -18。",
                sub1: "求 x、y 的關係式。",
                sub2: "當 x = 12 時，y 是多少？",
                steps: [
                    {
                        title: "步驟 1：設正比關係式",
                        html: `因為 y 與 x 成正比，設 <span class="math">y = kx</span><br>將 x = 3, y = -18 代入：<br><span class="math"><input type="text" class="slot" data-ans="-18"> = k × <input type="text" class="slot" data-ans="3"></span>`,
                    },
                    {
                        title: "步驟 2：求出常數 k",
                        html: `<span class="math">k = <input type="text" class="slot" data-ans="-6"></span>`,
                    },
                    {
                        title: "步驟 3：寫出關係式",
                        html: `關係式為：<span class="math">y = <input type="text" class="slot" data-ans="-6"> x</span>`,
                    },
                    {
                        title: "步驟 4：代入求值",
                        html: `將 x = 12 代入關係式：<br><span class="math">y = -6 × <input type="text" class="slot" data-ans="12"></span><br><span class="math">y = <input type="text" class="slot" data-ans="-72"></span>`,
                    }
                ]
            },
            {
                id: 1,
                text: "已知 y 和 x 成正比，且 x = 5 時，y = 15。",
                sub1: "求 x、y 的關係式。",
                sub2: "當 x = -4 時，y 是多少？",
                steps: [
                    {
                        title: "步驟 1：設正比關係式",
                        html: `設 <span class="math">y = kx</span><br>將 x = 5, y = 15 代入：<br><span class="math"><input type="text" class="slot" data-ans="15"> = k × <input type="text" class="slot" data-ans="5"></span>`,
                    },
                    {
                        title: "步驟 2：求出常數 k",
                        html: `<span class="math">k = <input type="text" class="slot" data-ans="3"></span>`,
                    },
                    {
                        title: "步驟 3：寫出關係式",
                        html: `關係式為：<span class="math">y = <input type="text" class="slot" data-ans="3"> x</span>`,
                    },
                    {
                        title: "步驟 4：代入求值",
                        html: `將 x = -4 代入：<br><span class="math">y = 3 × (<input type="text" class="slot" data-ans="-4">)</span><br><span class="math">y = <input type="text" class="slot" data-ans="-12"></span>`,
                    }
                ]
            },
            {
                id: 2,
                text: "已知 y 和 x 成正比，且 x = -4 時，y = 18。",
                sub1: "求 x、y 的關係式。",
                sub2: "當 x = 1 時，y 是多少？",
                steps: [
                    {
                        title: "步驟 1：設正比關係式",
                        html: `設 <span class="math">y = kx</span><br>將 x = -4, y = 18 代入：<br><span class="math"><input type="text" class="slot" data-ans="18"> = k × (<input type="text" class="slot" data-ans="-4">)</span>`,
                    },
                    {
                        title: "步驟 2：求出常數 k",
                        html: `<span class="math">k = <input type="text" class="slot" data-ans="-4.5"></span> (可用小數表示)`,
                    },
                    {
                        title: "步驟 3：寫出關係式",
                        html: `關係式為：<span class="math">y = <input type="text" class="slot" data-ans="-4.5"> x</span>`,
                    },
                    {
                        title: "步驟 4：代入求值",
                        html: `將 x = 1 代入：<br><span class="math">y = -4.5 × <input type="text" class="slot" data-ans="1"></span><br><span class="math">y = <input type="text" class="slot" data-ans="-4.5"></span>`,
                    }
                ]
            }
        ];

        let currentProbIndex = 0;
        let score = 0;
        let totalStepsSolved = 0;
        let timeRemaining = 420; // 7 minutes
        let timerId;

        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const stepsContainer = document.getElementById('steps-container');
        const probText = document.getElementById('prob-text');
        const probNumLabel = document.getElementById('prob-num-label');

        function startTimer() {
            timerId = setInterval(() => {
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerId);
                    endGame();
                }
            }, 1000);
        }

        function switchProblem(index) {
            currentProbIndex = index;
            // 更新按鈕樣式
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`btn-p${i}`);
                if (i === index) {
                    btn.classList.add('border-blue-200', 'bg-blue-50', 'text-blue-700');
                    btn.classList.remove('border-transparent', 'text-gray-500');
                } else {
                    btn.classList.remove('border-blue-200', 'bg-blue-50', 'text-blue-700');
                    btn.classList.add('border-transparent', 'text-gray-500');
                }
            }

            probNumLabel.innerText = `QUESTION 0${index + 1}`;
            probText.innerText = problems[index].text;
            renderSteps(index);
        }

        function renderSteps(probIdx) {
            stepsContainer.innerHTML = '';
            problems[probIdx].steps.forEach((step, sIdx) => {
                const div = document.createElement('div');
                div.id = `step-${sIdx}`;
                div.className = `step-container bg-slate-50 p-6 rounded-2xl border border-slate-100 ${sIdx === 0 ? 'unlocked' : ''}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-blue-600 font-bold text-xl">${step.title}</h3>
                        <div id="check-${sIdx}" class="check-mark">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <div class="leading-relaxed text-slate-700 text-2xl">
                        ${step.html}
                    </div>
                `;
                stepsContainer.appendChild(div);
            });

            // 綁定輸入邏輯
            const allSlots = stepsContainer.querySelectorAll('.slot');
            allSlots.forEach((slot, idx) => {
                slot.inputMode = "decimal";

                slot.addEventListener('click', () => {
                    slot.value = '';
                    updateHighlight();
                });

                slot.addEventListener('input', (e) => {
                    // 只允許數字、負號、小數點
                    slot.value = slot.value.replace(/[^0-9.-]/g, '');

                    // 檢查本步驟所有空格
                    const currentStepDiv = slot.closest('.step-container');
                    const stepSlots = currentStepDiv.querySelectorAll('.slot');
                    const allFilled = Array.from(stepSlots).every(s => s.value.trim() !== '');

                    if (allFilled) {
                        checkStep(currentStepDiv);
                    } else if (slot.value.length >= slot.dataset.ans.length) {
                        // 自動跳轉下一個空格
                        const nextSlot = allSlots[idx + 1];
                        if (nextSlot && nextSlot.closest('.step-container').classList.contains('unlocked')) {
                            nextSlot.focus();
                        }
                    }
                });
            });

            updateHighlight();
        }

        function checkStep(stepDiv) {
            const slots = stepDiv.querySelectorAll('.slot');
            const stepIdx = parseInt(stepDiv.id.split('-')[1]);
            let isCorrect = true;

            slots.forEach(slot => {
                if (slot.value.trim() !== slot.dataset.ans) {
                    isCorrect = false;
                }
            });

            if (isCorrect) {
                // 答對了
                if (!stepDiv.dataset.solved) {
                    score++;
                    scoreDisplay.innerText = score;
                    stepDiv.dataset.solved = "true";
                }

                stepDiv.classList.add('bg-green-50', 'border-green-200');
                stepDiv.querySelector('.check-mark').style.display = 'block';
                slots.forEach(s => {
                    s.disabled = true;
                    s.classList.remove('active');
                });

                // 解鎖下一步
                const nextStep = document.getElementById(`step-${stepIdx + 1}`);
                if (nextStep) {
                    nextStep.classList.add('unlocked');
                    setTimeout(() => {
                        const firstSlot = nextStep.querySelector('.slot');
                        if (firstSlot) firstSlot.focus();
                        updateHighlight();
                    }, 500);
                } else {
                    // 本題完成，延遲切換下一題或結束
                    if (currentProbIndex < problems.length - 1) {
                        setTimeout(() => switchProblem(currentProbIndex + 1), 1500);
                    } else {
                        setTimeout(endGame, 1000);
                    }
                }
            } else {
                // 有錯不提示，讓學生自己檢查或提示再想想
                // 這裡可以加一個震動效果
            }
        }

        function updateHighlight() {
            // 清除所有高亮
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            // 找到第一個未填寫且解鎖的格子
            const allUnlockedSlots = Array.from(document.querySelectorAll('.step-container.unlocked .slot:not([disabled])'));
            const firstEmpty = allUnlockedSlots.find(s => s.value === '');
            if (firstEmpty) {
                firstEmpty.classList.add('active');
                firstEmpty.focus();
            }
        }

        function endGame() {
            clearInterval(timerId);
            const modal = document.getElementById('modal-overlay');
            const finalStats = document.getElementById('final-stats');
            const timeUsed = 420 - timeRemaining;
            const mins = Math.floor(timeUsed / 60);
            const secs = timeUsed % 60;

            finalStats.innerText = `總得分：${score} 分 | 用時：${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            modal.style.display = 'flex';
        }

        window.onload = () => {
            switchProblem(0);
            startTimer();
        };
    </script>
</body>

</html>
