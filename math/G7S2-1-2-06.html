<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二元一次聯立方程式互動練習</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="dog.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        /* 數學式呈現 */
        .math {
            font-size: 24px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .system {
            display: inline-flex;
            align-items: center;
            position: relative;
            padding-left: 15px;
            margin: 10px 0;
        }

        .system::before {
            content: "{";
            font-size: 60px;
            font-weight: 300;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .system-content {
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* 填答格設計 */
        .slot {
            width: 50px;
            height: 40px;
            border-bottom: 3px solid #94a3b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: #2563eb;
            font-size: 22px;
            vertical-align: middle;
        }

        .slot:hover {
            background-color: #f1f5f9;
            border-color: #3b82f6;
        }

        .slot.filled {
            border-bottom-color: #10b981;
        }

        /* 按鈕動效 */
        .btn-option {
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        .btn-option:active {
            transform: scale(0.95);
        }

        /* 步驟解鎖動畫 */
        .step-container {
            transition: all 0.5s ease-in-out;
        }

        .locked {
            opacity: 0.4;
            filter: blur(1px);
            pointer-events: none;
        }

        /* 滾動條隱藏 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 完成動畫 */
        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .animate-tada {
            animation: tada 0.6s ease-in-out;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-2 border-b">
            <div class="flex items-center w-full overflow-hidden">
                <span class="font-bold text-blue-700 whitespace-nowrap mr-4">單元：二元一次聯立方程式(二)</span>
                <div id="nav-list" class="flex gap-2 overflow-x-auto no-scrollbar py-1 flex-grow">
                    <!-- 題目按鈕會由 JS 生成 -->
                </div>
            </div>
            <div class="flex items-center gap-3 ml-4 whitespace-nowrap">
                <span id="score-display" class="font-bold text-orange-500 text-lg">⭐ 0</span>
                <button onclick="showRecords()"
                    class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold hover:bg-indigo-200 transition">成績紀錄</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full">

        <!-- 左側：題目固定區塊 -->
        <div id="problem-sidebar" class="w-full md:w-1/3 p-6 md:sticky md:top-14 h-fit">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-blue-100">
                <div class="mb-4">
                    <span id="level-tag"
                        class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">Level</span>
                    <h2 id="problem-title" class="text-2xl font-bold mt-2">第 1 題</h2>
                </div>

                <div class="math p-4 bg-gray-50 rounded-xl flex justify-center w-full">
                    <div class="system">
                        <div class="system-content">
                            <span id="eq1">2x + y = 11</span>
                            <span id="eq2">2x - y = 5</span>
                        </div>
                    </div>
                </div>

                <div class="mt-6 space-y-2 text-gray-600">
                    <p class="flex items-center"><span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span> 目標：先求 y，再求
                        x</p>
                    <p class="flex items-center"><span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span> 技巧：相減消去 2x
                    </p>
                </div>
            </div>
        </div>

        <!-- 右側：步驟解鎖流程 -->
        <div id="steps-container" class="w-full md:w-2/3 p-6 space-y-8 pb-32">
            <!-- 步驟會由 JS 動態生成 -->
        </div>

    </main>

    <!-- 完成視窗 Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[60]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-6xl mb-4">🏆</div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">太棒了！完成！</h3>
            <p id="success-msg" class="text-gray-600 mb-6">你成功的解開了這組聯立方程式！</p>
            <div class="flex gap-4">
                <button onclick="resetCurrentProblem()"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">再做一次</button>
                <button onclick="closeModal()"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 成績紀錄視窗 Modal -->
    <div id="records-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[60]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-lg w-full mx-4">
            <h3 class="text-2xl font-bold text-gray-800 mb-4 text-center">🏆 學習成績紀錄</h3>
            <div class="text-center mb-6">
                <span class="text-5xl font-bold text-orange-500" id="record-total-score">0</span>
                <span class="text-gray-500 font-bold text-xl"> / 50 分</span>
            </div>
            <div id="records-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-8">
                <!-- 由 JS 產生 -->
            </div>
            <button onclick="hideRecords()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">關閉紀錄</button>
        </div>
    </div>

    <!-- 底部通知提示 -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full opacity-0 transition-opacity pointer-events-none z-50">
        請填滿所有空格
    </div>

    <script>
        const problems = [
            { id: 1, level: "Level 1: 全提示", eq1: [2, 1, 11], eq2: [2, -1, 5], ans: [6, 6, 3, 3, 3, 8, 4] },
            { id: 2, level: "Level 1: 全提示", eq1: [2, 1, 13], eq2: [2, -1, 7], ans: [6, 6, 3, 3, 3, 10, 5] },
            { id: 3, level: "Level 2: 部分提示", eq1: [2, 1, 12], eq2: [2, -1, 4], ans: [8, 8, 4, 4, 8, 4] },
            { id: 4, level: "Level 3: 低提示", eq1: [2, 1, 21], eq2: [2, -1, 11], ans: [10, 10, 5, 5, 16, 8] },
            { id: 5, level: "Level 4: 獨立挑戰", eq1: [2, 1, 23], eq2: [2, -1, 13], ans: [23, 13, 10, 5, 23, 5, 18, 9] }
        ];

        let currentProblemIndex = 0;
        let currentStepIndex = 0;
        let score = 0;
        let userProgress = Array(problems.length).fill(null).map(() => ({ step: 0, answers: [] }));

        // 初始化導覽列
        function initNav() {
            const nav = document.getElementById('nav-list');
            problems.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${idx}`;
                btn.className = `px-4 py-1 rounded-full whitespace-nowrap font-medium transition ${idx === 0 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.innerText = `題目 ${p.id}`;
                btn.onclick = () => switchProblem(idx);
                nav.appendChild(btn);
            });
        }

        function switchProblem(index) {
            // 保存進度（這裡簡單處理，因為互動主要是即時的）
            currentProblemIndex = index;
            currentStepIndex = 0;

            // 更新導覽 UI
            problems.forEach((p, idx) => {
                const btn = document.getElementById(`nav-btn-${idx}`);
                const isSolved = p.solved ? ' <span class="text-green-500 ml-1">✔</span>' : '';
                btn.className = `px-4 py-1 rounded-full whitespace-nowrap font-medium transition ${idx === index ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.innerHTML = `題目 ${p.id}${isSolved}`;
            });

            renderProblem();
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `⭐ ${score}`;
            // 更新當前導覽按鈕顯示打勾
            const btn = document.getElementById(`nav-btn-${currentProblemIndex}`);
            if (!btn.innerHTML.includes('✔')) {
                btn.innerHTML += ' <span class="text-green-500 ml-1">✔</span>';
            }
        }

        function showRecords() {
            const grid = document.getElementById('records-grid');
            grid.innerHTML = '';
            problems.forEach(p => {
                const isSolved = p.solved;
                grid.innerHTML += `
                    <div class="flex flex-col items-center justify-center py-3 px-1 rounded-xl shadow-sm ${isSolved ? 'bg-green-50 border-2 border-green-400' : 'bg-gray-50 border-2 border-gray-200'}">
                        <span class="font-bold ${isSolved ? 'text-green-700' : 'text-gray-400'}">第 ${p.id} 題</span>
                        <span class="text-2xl mt-1">${isSolved ? '⭐' : '🔒'}</span>
                    </div>
                `;
            });
            document.getElementById('record-total-score').innerText = score;
            document.getElementById('records-modal').classList.remove('hidden');
        }

        function hideRecords() {
            document.getElementById('records-modal').classList.add('hidden');
        }

        function renderProblem() {
            const p = problems[currentProblemIndex];
            document.getElementById('level-tag').innerText = p.level;
            document.getElementById('problem-title').innerText = `第 ${p.id} 題`;
            document.getElementById('eq1').innerText = `${p.eq1[0]}x + y = ${p.eq1[2]}`;
            document.getElementById('eq2').innerText = `${p.eq2[0]}x - y = ${p.eq2[2]}`;

            const container = document.getElementById('steps-container');
            container.innerHTML = ''; // 清空

            // 建立步驟
            const stepsData = getStepsStructure(p);
            stepsData.forEach((step, idx) => {
                const stepEl = document.createElement('div');
                stepEl.id = `step-${idx}`;
                stepEl.className = `step-container bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500 ${idx > 0 ? 'locked' : ''}`;

                let html = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold flex items-center">
                            <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">${idx + 1}</span>
                            ${step.title}
                            <span id="step-check-${idx}" class="ml-2 hidden text-green-500 font-bold">✔ 完成</span>
                        </h3>
                    </div>
                    <div class="text-2xl font-semibold mb-6 flex flex-col items-start space-y-4 w-full text-gray-800">
                        ${step.content}
                    </div>
                    <div id="options-${idx}" class="flex flex-wrap gap-2 mt-4">
                        ${renderOptions(step.options, idx)}
                    </div>
                    <div class="mt-6 flex justify-end">
                        <button id="check-btn-${idx}" onclick="checkAnswer(${idx})" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md">檢查答案</button>
                    </div>
                `;
                stepEl.innerHTML = html;
                container.appendChild(stepEl);
            });

            // 初始化填答格點擊
            initSlots();
        }

        function getStepsStructure(p) {
            // 根據 Level 返回不同的步驟結構
            const level = p.id <= 4 ? 1 : (p.id <= 8 ? 2 : (p.id <= 10 ? 3 : 4));
            const ans = p.ans;

            if (level === 1) {
                return [
                    {
                        title: "第一步：求 y",
                        content: `<div class="flex items-center">2y = <span class="slot" data-ans="${ans[0]}"></span></div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[1]}"></span> ÷ 2</div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[2]}"></span></div>`,
                        options: [ans[0], ans[1], ans[2], 2, 5, 8].sort(() => Math.random() - 0.5)
                    },
                    {
                        title: "第二步：代入求 x",
                        content: `<div class="flex items-center">2x + y = ${p.eq1[2]}</div>
                                  <div class="flex items-center">2x + <span class="slot" data-ans="${ans[3]}"></span> = ${p.eq1[2]}</div>
                                  <div class="flex items-center">2x = ${p.eq1[2]} - <span class="slot" data-ans="${ans[4]}"></span></div>
                                  <div class="flex items-center">2x = <span class="slot" data-ans="${ans[5]}"></span></div>
                                  <div class="flex items-center">x = <span class="slot" data-ans="${ans[6]}"></span></div>`,
                        options: [ans[3], ans[4], ans[5], ans[6], 1, 11].sort(() => Math.random() - 0.5)
                    }
                ];
            } else if (level === 2) {
                return [
                    {
                        title: "第一步：求 y",
                        content: `<div class="flex items-center">2y = <span class="slot" data-ans="${ans[0]}"></span> <span class="text-gray-400 text-lg ml-2">(${p.eq1[2]} - ${p.eq2[2]})</span></div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[1]}"></span> ÷ 2</div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[2]}"></span></div>`,
                        options: [ans[0], ans[1], ans[2], 2, 4, 10].sort(() => Math.random() - 0.5)
                    },
                    {
                        title: "第二步：代入求 x",
                        content: `<div class="flex items-center">2x + ( <span class="slot" data-ans="${ans[3]}"></span> ) = ${p.eq1[2]}</div>
                                  <div class="flex items-center">2x = <span class="slot" data-ans="${ans[4]}"></span></div>
                                  <div class="flex items-center">x = <span class="slot" data-ans="${ans[5]}"></span></div>`,
                        options: [ans[3], ans[4], ans[5], 2, 10, 14].sort(() => Math.random() - 0.5)
                    }
                ];
            } else if (level === 3) {
                return [
                    {
                        title: "第一步：求 y",
                        content: `<div class="flex items-center">${p.eq1[2]} - ${p.eq2[2]} = <span class="slot" data-ans="${ans[0]}"></span></div>
                                  <div class="flex items-center">2y = <span class="slot" data-ans="${ans[1]}"></span></div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[2]}"></span></div>`,
                        options: [ans[0], ans[1], ans[2], 2, 10, 15].sort(() => Math.random() - 0.5)
                    },
                    {
                        title: "第二步：代入求 x",
                        content: `<div class="flex items-center">2x + <span class="slot" data-ans="${ans[3]}"></span> = ${p.eq1[2]}</div>
                                  <div class="flex items-center">2x = <span class="slot" data-ans="${ans[4]}"></span></div>
                                  <div class="flex items-center">x = <span class="slot" data-ans="${ans[5]}"></span></div>`,
                        options: [ans[3], ans[4], ans[5], 2, 5, 12].sort(() => Math.random() - 0.5)
                    }
                ];
            } else {
                return [
                    {
                        title: "第一步：求 y",
                        content: `<div class="flex items-center">2y = <span class="slot" data-ans="${ans[0]}"></span> - <span class="slot" data-ans="${ans[1]}"></span></div>
                                  <div class="flex items-center">2y = <span class="slot" data-ans="${ans[2]}"></span></div>
                                  <div class="flex items-center">y = <span class="slot" data-ans="${ans[3]}"></span></div>`,
                        options: [ans[0], ans[1], ans[2], ans[3], 2, 8, 15].sort(() => Math.random() - 0.5)
                    },
                    {
                        title: "第二步：求 x",
                        content: `<div class="flex items-center">2x = <span class="slot" data-ans="${ans[4]}"></span> - <span class="slot" data-ans="${ans[5]}"></span></div>
                                  <div class="flex items-center">2x = <span class="slot" data-ans="${ans[6]}"></span></div>
                                  <div class="flex items-center">x = <span class="slot" data-ans="${ans[7]}"></span></div>`,
                        options: [ans[4], ans[5], ans[6], ans[7], 2, 10, 18].sort(() => Math.random() - 0.5)
                    }
                ];
            }
        }

        function renderOptions(options, stepIdx) {
            return options.map(opt => `
                <button class="btn-option bg-white border-2 border-blue-200 text-blue-700 font-bold px-5 py-2 rounded-xl shadow-sm hover:border-blue-500" 
                        onclick="fillSlot('${opt}', this, ${stepIdx})">
                    ${opt}
                </button>
            `).join('');
        }

        function initSlots() {
            document.querySelectorAll('.slot').forEach(slot => {
                slot.onclick = () => {
                    if (slot.innerText !== "") {
                        const val = slot.innerText;
                        const stepIdx = parseInt(slot.closest('.step-container').id.split('-')[1]);
                        // 恢復按鈕
                        const buttons = document.querySelectorAll(`#options-${stepIdx} button`);
                        for (let btn of buttons) {
                            if (btn.innerText === val && btn.disabled) {
                                btn.disabled = false;
                                btn.classList.remove('opacity-30');
                                break;
                            }
                        }
                        slot.innerText = "";
                        slot.classList.remove('filled');
                    }
                };
            });
        }

        function fillSlot(val, btn, stepIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            for (let slot of slots) {
                if (slot.innerText === "") {
                    slot.innerText = val;
                    slot.classList.add('filled');
                    btn.disabled = true;
                    btn.classList.add('opacity-30');
                    break;
                }
            }
        }

        function checkAnswer(stepIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const slots = stepEl.querySelectorAll('.slot');
            let allFilled = true;
            let allCorrect = true;

            slots.forEach(slot => {
                if (slot.innerText === "") allFilled = false;
                if (slot.innerText != slot.getAttribute('data-ans')) allCorrect = false;
            });

            if (!allFilled) {
                showToast("請填滿所有空格");
                return;
            }

            if (allCorrect) {
                // 正確
                stepEl.classList.add('animate-tada', 'bg-green-50', 'border-green-500');
                document.getElementById(`step-check-${stepIdx}`).classList.remove('hidden');
                document.getElementById(`check-btn-${stepIdx}`).classList.add('hidden');
                document.getElementById(`options-${stepIdx}`).classList.add('hidden');

                setTimeout(() => {
                    stepEl.classList.remove('animate-tada');
                    unlockNextStep(stepIdx);
                }, 600);
            } else {
                // 錯誤
                showToast("再想想看喔，數字好像不對！");
            }
        }

        function unlockNextStep(currentIdx) {
            const nextStep = document.getElementById(`step-${currentIdx + 1}`);
            if (nextStep) {
                nextStep.classList.remove('locked');
                nextStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                // 全部完成
                const p = problems[currentProblemIndex];
                let msg = "你成功的解開了這組聯立方程式！";

                if (!p.solved) {
                    p.solved = true;
                    score += 10;
                    updateScoreDisplay();
                    msg = "太棒了！你獲得了 10 分！⭐";
                }

                document.getElementById('success-msg').innerText = msg;
                document.getElementById('success-modal').classList.remove('hidden');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2000);
        }

        function resetCurrentProblem() {
            closeModal();
            renderProblem();
        }

        function closeModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }

        // 初始化
        window.onload = () => {
            problems.forEach(p => p.solved = false);
            initNav();
            renderProblem();
        };
    </script>
<script src="../progress.js"></script>
</body>

</html>
