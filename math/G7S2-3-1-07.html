<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比例式運算互動解題</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        .math {
            font-size: 26px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            vertical-align: middle;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            vertical-align: middle;
        }

        .fraction span:first-child {
            border-bottom: 2px solid #000;
            padding: 0 4px;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 54px;
            height: 54px;
            border: 3px dashed #cbd5e1;
            border-radius: 12px;
            margin: 0 4px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: white;
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
        }

        .slot.filled {
            border-style: solid;
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #15803d;
        }

        .slot.error-filled {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        .option-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-2deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.05) rotate(2deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.05) rotate(-2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .animate-tada {
            animation: tada 0.6s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .animate-shake {
            animation: shake 0.15s ease-in-out 2;
        }

        .nav-item.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="flex items-center justify-between px-4 py-3 max-w-7xl mx-auto w-full">
            <div class="flex items-center gap-4 overflow-x-auto no-scrollbar whitespace-nowrap">
                <span class="font-black text-blue-700 text-xl tracking-tight">比例式運算</span>
                <div id="nav-btns" class="flex gap-2"></div>
            </div>
            <div class="flex items-center gap-3 font-mono">
                <div class="bg-blue-600 text-white px-4 py-1.5 rounded-full shadow-inner flex items-center gap-2">
                    <span class="text-xs opacity-80">SCORE</span>
                    <span id="global-score" class="font-bold text-lg">0</span>
                </div>
                <div
                    class="bg-amber-100 text-amber-700 px-4 py-1.5 rounded-full border border-amber-200 hidden md:flex items-center gap-2">
                    <span id="timer" class="font-bold">07:00</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full">
        <!-- 左側：題目 -->
        <aside class="w-full md:w-1/3 p-6 md:sticky md:top-[68px] h-auto md:h-[calc(100vh-68px)] bg-white border-r">
            <div id="problem-content" class="space-y-6"></div>
        </aside>

        <!-- 右側：步驟區 -->
        <section id="steps-area" class="w-full md:w-2/3 p-6 space-y-10 bg-gray-50 pb-40">
            <!-- 步驟動態生成 -->
        </section>
    </main>

    <!-- 結算彈窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-10 max-w-sm w-full text-center shadow-2xl">
            <div class="text-7xl mb-6">🎯</div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">練習完成！</h2>
            <p class="text-slate-500 mb-8 text-lg">你的最終得分是 <span id="final-score"
                    class="text-3xl font-black text-blue-600">0</span> 分</p>
            <div class="flex flex-col gap-3">
                <button onclick="resetApp()"
                    class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition-all shadow-lg active:scale-95">再挑戰一次</button>
                <button onclick="closeModal()"
                    class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold text-lg hover:bg-slate-200 transition-all">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const PROBLEMS = [
            {
                id: 1,
                title: "第 1 題：分數比例式",
                desc: "若 <div class='math'><div class='fraction'><span>x</span><span>4</span></div> = <div class='fraction'><span>y</span><span>9</span></div></div>，求 <mark class='bg-yellow-200 px-1'>2x : y</mark> 的比。",
                steps: [
                    { text: "根據比例式，我們可以知道 x 和 y 的比例：", display: "x : y = [ ] : [ ]", answer: ["4", "9"], options: ["4", "9", "2", "1"] },
                    { text: "題目要求 2x : y。我們將 x 以 4 代入，y 以 9 代入：", display: "2 × [ ] : [ ]", answer: ["4", "9"], options: ["4", "9", "8", "2"] },
                    { text: "計算乘法結果：", display: "最後的比為 [ ] : [ ]", answer: ["8", "9"], options: ["8", "9", "4", "2"] }
                ]
            },
            {
                id: 2,
                title: "第 2 題：係數比例式",
                desc: "若 <mark class='bg-yellow-200 px-1'>7x = 9y</mark>，求 <mark class='bg-yellow-200 px-1'>x : y</mark> 的比。",
                steps: [
                    { text: "根據「外項乘積等於內項乘積」，要得到 7x = 9y，則 x:y 為：", display: "x : y = [ ] : [ ]", answer: ["9", "7"], options: ["9", "7", "7", "9"] },
                    { text: "檢查：[ ] 乘 x = [ ] 乘 y", answer: ["7", "9"], display: "[ ] 乘 x = [ ] 乘 y", options: ["7", "9", "x", "y"] }
                ]
            },
            {
                id: 3,
                title: "第 3 題：比例代入運算(一)",
                desc: "若 <mark class='bg-yellow-200 px-1'>5x = 3y</mark>，求 <mark class='bg-yellow-200 px-1'>(4x - y) : (4y - x)</mark> 的比。",
                steps: [
                    { text: "第一步，找出 x : y：", display: "x : y = [ ] : [ ]", answer: ["3", "5"], options: ["3", "5", "5", "3"] },
                    { text: "計算前項 (4x - y)，代入 x=3, y=5：", display: "4 × [ ] - [ ] = [ ]", answer: ["3", "5", "7"], options: ["3", "5", "7", "12"] },
                    { text: "計算後項 (4y - x)，代入 x=3, y=5：", display: "4 × [ ] - [ ] = [ ]", answer: ["5", "3", "17"], options: ["5", "3", "17", "20"] },
                    { text: "寫出最後的比：", display: "結果為 [ ] : [ ]", answer: ["7", "17"], options: ["7", "17", "3", "5"] }
                ]
            },
            {
                id: 4,
                title: "第 4 題：比例代入運算(二)",
                desc: "若 <mark class='bg-yellow-200 px-1'>3x = 2y</mark>，求 <mark class='bg-yellow-200 px-1'>(3x + y) : (3x - y)</mark> 的比。",
                steps: [
                    { text: "找出 x : y：", display: "x : y = [ ] : [ ]", answer: ["2", "3"], options: ["2", "3", "3", "2"] },
                    { text: "計算前項 (3x + y)：", display: "3 × [ ] + [ ] = [ ]", answer: ["2", "3", "9"], options: ["2", "3", "9", "6"] },
                    { text: "計算後項 (3x - y)：", display: "3 × [ ] - [ ] = [ ]", answer: ["2", "3", "3"], options: ["2", "3", "3", "1"] },
                    { text: "將 9 : 3 化為最簡單整數比：", display: "最後結果為 [ ] : [ ]", answer: ["3", "1"], options: ["3", "1", "9", "3"] }
                ]
            }
        ];

        let currentProblemIdx = 0;
        let score = 0;
        let timeLeft = 420;
        let timerId = null;

        // 狀態追蹤
        let problemStates = PROBLEMS.map(p => p.steps.map(() => ({
            isCorrect: false,
            hasError: false,
            isScored: false
        })));

        function init() {
            renderNav();
            loadProblem(0);
            startTimer();
            updateScoreUI();
        }

        function renderNav() {
            const container = document.getElementById('nav-btns');
            container.innerHTML = '';
            PROBLEMS.forEach((p, i) => {
                const btn = document.createElement('button');
                const isDone = problemStates[i].every(s => s.isCorrect);
                btn.className = `nav-item px-5 py-2 rounded-xl text-sm font-bold transition-all ${i === currentProblemIdx ? 'active' : 'bg-white text-slate-500 hover:bg-slate-100'} ${isDone ? 'border-2 border-green-400' : 'border border-transparent'}`;
                btn.innerText = `題目 ${i + 1}${isDone ? ' ✓' : ''}`;
                btn.onclick = () => loadProblem(i);
                container.appendChild(btn);
            });
        }

        function loadProblem(index) {
            currentProblemIdx = index;
            renderNav();

            const prob = PROBLEMS[index];
            document.getElementById('problem-content').innerHTML = `
                <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-black tracking-tight">${prob.title}</h2>
                </div>
                <div class="bg-white p-6 rounded-2xl border-2 border-blue-50 shadow-sm">
                    <p class="text-slate-400 mb-3 font-bold text-xs uppercase tracking-widest">Question</p>
                    <div class="text-2xl font-medium leading-relaxed text-slate-800">${prob.desc}</div>
                </div>
                <div class="p-4 bg-blue-50/50 rounded-xl border border-blue-100 italic text-sm text-blue-600">
                    💡 提示：必須先答對目前步驟，才能解鎖下一步。若檢查答案時出錯，該步驟將不再計分。
                </div>
            `;

            const stepsArea = document.getElementById('steps-area');
            stepsArea.innerHTML = '';

            let foundIncomplete = false;
            prob.steps.forEach((step, sIdx) => {
                if (!foundIncomplete) {
                    renderStep(sIdx);
                    if (!problemStates[index][sIdx].isCorrect) foundIncomplete = true;
                }
            });
        }

        function renderStep(stepIdx) {
            const prob = PROBLEMS[currentProblemIdx];
            const step = prob.steps[stepIdx];
            const state = problemStates[currentProblemIdx][stepIdx];

            const stepDiv = document.createElement('div');
            stepDiv.className = `step-container bg-white p-6 rounded-3xl shadow-sm border-l-8 ${state.isCorrect ? 'border-green-500' : 'border-blue-500'} relative mb-6 animate-in fade-in slide-in-from-bottom-4 duration-500`;
            stepDiv.id = `step-box-${stepIdx}`;

            let displayHtml = step.display.replace(/\[ \]/g, () => `<div class="slot" data-step="${stepIdx}"></div>`);

            stepDiv.innerHTML = `
                <div class="flex justify-between items-center mb-5">
                    <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-black uppercase">Step ${stepIdx + 1}</span>
                    <div class="flex items-center gap-2">
                        ${state.hasError ? '<span class="text-red-500 text-xs font-bold bg-red-50 px-2 py-1 rounded">⚠️ 已失分</span>' : ''}
                        ${state.isCorrect ? '<span class="text-green-600 font-bold">✓ 已完成</span>' : ''}
                    </div>
                </div>
                <p class="text-xl text-slate-700 font-medium mb-6">${step.text}</p>
                <div class="flex flex-wrap items-center gap-3 mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-inner">
                    ${displayHtml}
                </div>
                ${!state.isCorrect ? `
                    <div class="flex flex-wrap gap-3 mb-6">
                        ${step.options.map(opt => `
                            <button class="option-btn px-6 py-3 bg-white border-2 border-slate-200 rounded-2xl font-bold text-xl text-slate-700 shadow-sm hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all" 
                                onclick="handleOptionClick('${opt}', ${stepIdx})">${opt}</button>
                        `).join('')}
                    </div>
                    <button onclick="checkStep(${stepIdx})" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold text-xl shadow-lg hover:bg-black active:scale-[0.98] transition-all">檢查答案</button>
                    <p id="msg-${stepIdx}" class="mt-4 text-red-500 font-bold text-center hidden"></p>
                ` : ''}
            `;

            document.getElementById('steps-area').appendChild(stepDiv);

            const slots = stepDiv.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                if (!state.isCorrect) {
                    slot.onclick = () => clearSlot(slot);
                } else {
                    slot.innerText = step.answer[i];
                    slot.classList.add('correct');
                    slot.style.cursor = 'default';
                }
            });

            if (stepIdx > 0 && !state.isCorrect) {
                stepDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function handleOptionClick(val, stepIdx) {
            const stepBox = document.getElementById(`step-box-${stepIdx}`);
            const slots = Array.from(stepBox.querySelectorAll('.slot'));
            const emptySlot = slots.find(s => !s.innerText);

            if (emptySlot) {
                emptySlot.innerText = val;
                emptySlot.classList.add('filled');
                emptySlot.classList.remove('error-filled');

                const btns = Array.from(stepBox.querySelectorAll('.option-btn'));
                const clickedBtn = btns.find(b => b.innerText === val && !b.disabled);
                if (clickedBtn) clickedBtn.disabled = true;
            }
        }

        function clearSlot(slot) {
            const val = slot.innerText;
            if (!val) return;
            slot.innerText = '';
            slot.classList.remove('filled', 'error-filled');
            const stepBox = slot.closest('.step-container');
            const btns = Array.from(stepBox.querySelectorAll('.option-btn'));
            const disabledBtn = btns.find(b => b.innerText === val && b.disabled);
            if (disabledBtn) disabledBtn.disabled = false;
        }

        function checkStep(stepIdx) {
            const prob = PROBLEMS[currentProblemIdx];
            const step = prob.steps[stepIdx];
            const state = problemStates[currentProblemIdx][stepIdx];
            const stepBox = document.getElementById(`step-box-${stepIdx}`);
            const slots = Array.from(stepBox.querySelectorAll('.slot'));
            const msg = document.getElementById(`msg-${stepIdx}`);

            if (slots.some(s => !s.innerText)) {
                msg.innerText = "🚨 還有空格沒填完喔！";
                msg.classList.remove('hidden');
                return;
            }

            const userAnswers = slots.map(s => s.innerText);
            const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(step.answer);

            if (isCorrect) {
                state.isCorrect = true;

                // 只有在沒錯過且沒加過分時加分
                if (!state.hasError && !state.isScored) {
                    score++;
                    state.isScored = true;
                    updateScoreUI();
                } else {
                    state.isScored = true; // 即使沒分也要標記已結算
                }

                slots.forEach(s => s.classList.add('correct'));
                msg.classList.add('hidden');
                stepBox.classList.add('animate-tada');

                setTimeout(() => {
                    loadProblem(currentProblemIdx);
                    checkAllFinished();
                }, 700);

            } else {
                // 只要檢查時不正確，該步即失分
                state.hasError = true;
                msg.innerText = "❌ 答錯了！此步已不計分，請修正後繼續。";
                msg.classList.remove('hidden');
                stepBox.classList.add('animate-shake');
                slots.forEach(s => s.classList.add('error-filled'));
                setTimeout(() => stepBox.classList.remove('animate-shake'), 400);
            }
        }

        function updateScoreUI() {
            document.getElementById('global-score').innerText = score;
        }

        function startTimer() {
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    showFinalModal();
                }
            }, 1000);
        }

        function checkAllFinished() {
            const allDone = problemStates.every(p => p.every(s => s.isCorrect));
            if (allDone) showFinalModal();
        }

        function showFinalModal() {
            document.getElementById('final-score').innerText = score;
            document.getElementById('finish-modal').classList.remove('hidden');
            clearInterval(timerId);
        }

        function resetApp() {
            score = 0;
            updateScoreUI();
            timeLeft = 420;
            problemStates = PROBLEMS.map(p => p.steps.map(() => ({
                isCorrect: false,
                hasError: false,
                isScored: false
            })));
            currentProblemIdx = 0;
            closeModal();
            init();
        }

        function closeModal() {
            document.getElementById('finish-modal').classList.add('hidden');
        }

        window.onload = init;
    </script>
</body>

</html>
