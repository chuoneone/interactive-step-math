<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一、二次項係數為1，常數項為正數</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff;
        }
        .step-container {
            transition: all 0.5s ease-in-out;
            opacity: 1;
        }
        .step-locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.8);
        }
        .highlight {
            background-color: #fef08a;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
            color: #b45309;
        }
        .highlight-blue {
            background-color: #bae6fd;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
            color: #0369a1;
        }
        input {
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
        }
        .nav-btn {
            transition: all 0.2s;
        }
        .nav-btn.active {
            background-color: #3b82f6;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .sign-text {
            display: inline-block;
            width: 1.5rem;
            text-align: center;
            transition: opacity 0.2s;
        }
        .nav-scroll::-webkit-scrollbar { height: 8px; }
        .nav-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .nav-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* 表格樣式 */
        .factor-row {
            transition: background-color 0.3s;
        }
        .factor-row:hover {
            background-color: #f8fafc;
        }
        .factor-row.selected {
            background-color: #eff6ff;
            border: 2px solid #3b82f6;
        }

        /* 卡片樣式 */
        .factor-card {
            transition: all 0.2s;
            cursor: pointer;
        }
        .factor-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-color: #93c5fd;
        }
        .factor-card.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px #bfdbfe;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <!-- 導覽列 -->
    <div class="w-full max-w-4xl mb-6 bg-white rounded-xl shadow-sm p-4">
        <div class="flex overflow-x-auto pb-2 gap-3 nav-scroll" id="nav-container"></div>
    </div>

    <!-- 標題區 -->
    <header class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-6 mb-6 text-center border-b-4 border-blue-400">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">一、二次項係數為1，常數項為正數</h1>
        <p class="text-slate-500">先列出所有組合，再找出正確的答案！</p>
    </header>

    <!-- 題目區 -->
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-md p-8 mb-6 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-blue-400"></div>
        <p class="text-lg text-slate-600 mb-4">請對下式進行因式分解：</p>
        <div class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wider font-mono">
            x² <span id="eq-sign-1" class="sign-text">+</span> <span id="eq-b" class="highlight-blue">7</span>x <span id="eq-sign-2" class="sign-text">+</span> <span id="eq-c" class="highlight">10</span>
        </div>
        <div id="clue-container" class="mt-6 flex justify-center gap-8 text-sm md:text-base text-slate-500 transition-opacity duration-500">
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-blue-200 rounded block"></span>
                <span id="label-b">一次項係數 (相加目標)</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-yellow-200 rounded block"></span>
                <span>常數項 (相乘目標)</span>
            </div>
        </div>
    </div>

    <!-- 步驟區 -->
    <div class="w-full max-w-4xl space-y-6">

        <!-- 步驟一：列表找數字 (Q1-Q4 顯示，Q5+ 隱藏) -->
        <div id="step1" class="step-container bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">1</div>
                <h2 class="text-xl font-bold text-slate-700">找出正確的組合</h2>
            </div>
            
            <div id="step1-hint-text" class="mb-4 text-lg">
                請找出相乘等於 <span id="s1-c" class="highlight">10</span>，
                相加等於 <span id="s1-b" class="highlight-blue">7</span> 的那一組。
            </div>
            
            <!-- 容器：根據題目難度會渲染不同內容 -->
            <div id="step1-content" class="bg-slate-50 p-4 rounded-lg overflow-hidden">
                <!-- JS 動態生成 -->
            </div>
        </div>

        <!-- 步驟二：填入圖形 -->
        <div id="step2" class="step-container step-locked bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
             <div class="flex items-center gap-3 mb-4">
                <div id="s2-badge" class="bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">2</div>
                <h2 id="s2-title" class="text-xl font-bold text-slate-700">填入十字交乘圖</h2>
            </div>
            <p id="s2-desc" class="mb-4 text-lg">將你剛剛選出的數字填進去。</p>

            <div class="flex justify-center">
                <div class="relative w-[300px] h-[200px] bg-slate-50 rounded-xl border border-slate-200">
                    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 300 200">
                        <line x1="80" y1="40" x2="220" y2="160" stroke="#94a3b8" stroke-width="3" />
                        <line x1="80" y1="160" x2="220" y2="40" stroke="#94a3b8" stroke-width="3" />
                    </svg>
                    <div class="absolute top-[30px] left-[50px] text-2xl font-mono font-bold text-slate-700">x</div>
                    <div class="absolute bottom-[30px] left-[50px] text-2xl font-mono font-bold text-slate-700">x</div>
                    <div class="absolute top-[30px] right-[50px] flex items-center gap-1">
                        <span id="cross-sign-1" class="text-xl font-bold text-slate-400 sign-text">+</span>
                        <input type="number" id="cross-input-1" class="w-16 h-12 text-center text-2xl font-bold border-2 border-blue-300 rounded-lg shadow-sm" placeholder="?">
                    </div>
                    <div class="absolute bottom-[30px] right-[50px] flex items-center gap-1">
                        <span id="cross-sign-2" class="text-xl font-bold text-slate-400 sign-text">+</span>
                        <input type="number" id="cross-input-2" class="w-16 h-12 text-center text-2xl font-bold border-2 border-blue-300 rounded-lg shadow-sm" placeholder="?">
                    </div>
                </div>
            </div>
             <div class="mt-4 text-center">
                <button onclick="checkStep2()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-8 rounded-full shadow-md transition text-lg">檢查圖形</button>
                <div id="feedback2" class="mt-3 h-8 font-bold text-lg"></div>
            </div>
        </div>

        <!-- 步驟三：寫出答案 -->
        <div id="step3" class="step-container step-locked bg-white rounded-xl shadow-md p-6 border-l-8 border-slate-300">
             <div class="flex items-center gap-3 mb-4">
                <div id="s3-badge" class="bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">3</div>
                <h2 class="text-xl font-bold text-slate-700">寫出最後答案</h2>
            </div>
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 text-2xl md:text-3xl font-mono text-slate-700 bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 border-dashed">
                <span>( x <span id="final-sign-1" class="sign-text">+</span> <input type="number" id="final-1" class="w-20 h-14 text-center border-b-4 border-slate-400 bg-transparent focus:border-blue-500" placeholder="?"> )</span>
                <span>( x <span id="final-sign-2" class="sign-text">+</span> <input type="number" id="final-2" class="w-20 h-14 text-center border-b-4 border-slate-400 bg-transparent focus:border-blue-500" placeholder="?"> )</span>
            </div>
            <div class="mt-6 text-center">
                <button id="final-submit-btn" onclick="checkStep3()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transition text-xl">提交答案</button>
                <div id="feedback3" class="mt-3 h-8 font-bold text-lg"></div>
            </div>
        </div>

        <!-- 完成 -->
        <div id="completion" class="hidden w-full max-w-4xl bg-green-100 border-2 border-green-400 rounded-xl p-8 mt-6 text-center">
            <h2 class="text-3xl font-bold text-green-700 mb-2">🎉 挑戰成功！</h2>
            <p class="text-green-600 text-lg mb-4">這題解決了，繼續前進吧！</p>
            <button id="next-btn" onclick="nextQuestion()" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg shadow hover:bg-green-700 transition outline-none ring-2 ring-offset-2 ring-green-500 focus:ring-4">挑戰下一題</button>
        </div>
    </div>

    <script>
        // --- 資料與邏輯 ---
        function getFactorPairs(n, signB) {
            const pairs = [];
            const limit = Math.floor(Math.sqrt(n));
            for(let i = 1; i <= limit; i++) {
                if (n % i === 0) {
                    let a = i;
                    let b = n / i;
                    if (signB === '-') {
                        a = -a;
                        b = -b;
                    }
                    pairs.push([a, b]);
                }
            }
            return pairs;
        }

        const questions = [
            { b: 7, c: 10, sign1: '+', sign2: '+', mode: 'guided' }, // Q1 (2 pairs)
            { b: 15, c: 36, sign1: '+', sign2: '+', mode: 'guided' }, // Q2 (5 pairs)
            { b: 12, c: 35, sign1: '+', sign2: '+', mode: 'input' },  // Q3 (2 pairs)
            { b: 7, c: 12, sign1: '-', sign2: '+', opSign: '-', mode: 'input' }, // Q4 (3 pairs)
            
            // --- Q5 開始跳過步驟一，直接進入圖形 ---
            { b: 19, c: 48, sign1: '-', sign2: '+', opSign: '-', mode: 'input', skipStep1: true }, 
            { b: 8, c: 15, sign1: '-', sign2: '+', opSign: '-', mode: 'input_less_hint', skipStep1: true },
            { b: 9, c: 20, sign1: '-', sign2: '+', opSign: '-', mode: 'minimal', skipStep1: true }, 
            { b: 8, c: 16, sign1: '+', sign2: '+', opSign: '+', mode: 'challenge', skipStep1: true } 
        ];

        // 計算答案與因數對
        questions.forEach(q => {
            const isNeg = q.sign1 === '-';
            const actualB = isNeg ? -q.b : q.b;
            q.pairs = getFactorPairs(q.c, isNeg ? '-' : '+');
            q.ans = q.pairs.find(p => p[0] + p[1] === actualB);
            if(!q.ans) console.error("Error: No valid pair found for", q);
        });

        let currentQIndex = 0;
        let step1Validated = false;

        window.onload = function() {
            createNavButtons();
            loadQuestion(0);
            setupEventListeners();
        };

        // 設定動態符號與 Enter 鍵
        function setupEventListeners() {
            const inputIds = ['cross-input-1', 'cross-input-2', 'final-1', 'final-2'];
            const signIds = ['cross-sign-1', 'cross-sign-2', 'final-sign-1', 'final-sign-2'];

            inputIds.forEach((id, idx) => {
                const input = document.getElementById(id);
                const sign = document.getElementById(signIds[idx]);

                // 動態符號顯示：負數時隱藏 "+"
                input.addEventListener('input', () => {
                    const val = parseFloat(input.value);
                    if (val < 0) {
                        sign.style.display = 'none'; // 負數時隱藏
                    } else {
                        sign.style.display = 'inline-block'; // 正數或空值時顯示
                    }
                });

                // Enter 鍵支援
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        if (id.startsWith('cross')) checkStep2();
                        else checkStep3();
                    }
                });
            });
        }

        function createNavButtons() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.innerText = `第 ${i+1} 題`;
                btn.onclick = () => loadQuestion(i);
                btn.id = `btn-q${i}`;
                btn.className = 'nav-btn flex-shrink-0 px-4 py-2 bg-white border-2 border-blue-200 rounded-lg font-bold text-slate-600 hover:bg-blue-50';
                container.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const q = questions[index];
            step1Validated = false;

            // UI 重置 (按鈕樣式)
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active', 'border-blue-500', 'bg-blue-50');
                else btn.classList.remove('active', 'border-blue-500', 'bg-blue-50');
            });
            document.getElementById(`btn-q${index}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            resetInterface();

            // 題目顯示
            document.getElementById('eq-b').innerText = q.b;
            document.getElementById('eq-c').innerText = q.c;
            document.getElementById('eq-sign-1').innerText = q.sign1;
            document.getElementById('eq-sign-2').innerText = q.sign2;
            document.getElementById('label-b').innerText = `一次項係數 (相加為 ${q.sign1 === '-' ? '-' : ''}${q.b})`;
            document.getElementById('s1-c').innerText = q.c;
            document.getElementById('s1-b').innerText = (q.sign1 === '-' ? '-' : '') + q.b;

            // --- 判斷是否跳過步驟一 ---
            if (q.skipStep1) {
                // 隱藏步驟一
                document.getElementById('step1').style.display = 'none';
                
                // 直接解鎖步驟二，並調整標題與引導語
                step1Validated = true; // 視為已通過
                const step2 = document.getElementById('step2');
                step2.classList.remove('step-locked');
                step2.classList.add('border-blue-500');
                step2.classList.remove('border-slate-300');
                
                // 更新步驟二的顯示 (因為變成第一步，調整編號或文字)
                document.getElementById('s2-badge').innerText = "1"; 
                document.getElementById('s3-badge').innerText = "2"; 
                document.getElementById('s2-title').innerText = "直接挑戰：填入十字交乘圖";
                
                const targetSum = (q.sign1 === '-' ? '-' : '') + q.b;
                document.getElementById('s2-desc').innerHTML = `請找出相乘為 <span class="font-bold">${q.c}</span>，且相加為 <span class="font-bold text-blue-600">${targetSum}</span> 的兩個數，填入圖中。`;

                // 自動對焦
                setTimeout(() => document.getElementById('cross-input-1').focus(), 100);

            } else {
                // 正常顯示步驟一 (Q1-Q4)
                document.getElementById('step1').style.display = 'block';
                document.getElementById('s2-badge').innerText = "2";
                document.getElementById('s3-badge').innerText = "3";
                document.getElementById('s2-title').innerText = "填入十字交乘圖";
                document.getElementById('s2-desc').innerText = "將你剛剛選出的數字填進去。";

                // Step 1 提示控制
                const hint = document.getElementById('step1-hint-text');
                const clue = document.getElementById('clue-container');
                if (q.mode === 'minimal' || q.mode === 'challenge') {
                    hint.style.display = 'none';
                    clue.style.opacity = '0.2';
                } else {
                    hint.style.display = 'block';
                    clue.style.opacity = '1';
                }

                // 渲染步驟一內容
                if (q.pairs.length > 3) {
                    renderFactorCards(q);
                } else {
                    renderFactorTable(q);
                }
            }

            // 符號更新：強制所有步驟使用 "+" 符號，避免雙重負號 (例如 x - -3)
            // 學生輸入負數時會自帶負號，所以 x + (-3) 是正確顯示
            document.getElementById('cross-sign-1').innerText = '+';
            document.getElementById('cross-sign-2').innerText = '+';
            document.getElementById('final-sign-1').innerText = '+';
            document.getElementById('final-sign-2').innerText = '+';
            
            // 重置符號顯示狀態 (避免被上一題的隱藏影響)
            ['cross-sign-1', 'cross-sign-2', 'final-sign-1', 'final-sign-2'].forEach(id => {
                document.getElementById(id).style.display = 'inline-block';
            });
            
            // 完成按鈕
            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerText = "全部完成！";
                nextBtn.onclick = null; 
            } else {
                nextBtn.innerText = "挑戰下一題";
                nextBtn.onclick = nextQuestion;
            }
        }

        // --- 模式 A: 表格輸入 ---
        function renderFactorTable(q) {
            const container = document.getElementById('step1-content');
            let html = `
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="text-slate-500 border-b-2 border-slate-200">
                            <th class="pb-2 w-1/2">乘法組合 (相乘 = ${q.c})</th>
                            <th class="pb-2 w-1/4">相加結果</th>
                            <th class="pb-2 w-1/4">選擇</th>
                        </tr>
                    </thead>
                    <tbody id="factor-table-body">
            `;
            
            q.pairs.forEach((pair, idx) => {
                const val1 = (q.mode === 'guided') ? pair[0] : '';
                const readOnly1 = (q.mode === 'guided') ? 'readonly' : '';
                const bg1 = (q.mode === 'guided') ? 'bg-slate-100' : 'bg-white';

                html += `
                    <tr class="factor-row border-b border-slate-100">
                        <td class="py-3">
                            <div class="flex items-center justify-center gap-2">
                                <input type="number" id="f-${idx}-1" class="w-16 p-2 border rounded text-center font-mono font-bold text-lg ${bg1}" value="${val1}" ${readOnly1} placeholder="?">
                                <span class="text-slate-400">×</span>
                                <input type="number" id="f-${idx}-2" class="w-16 p-2 border rounded text-center font-mono font-bold text-lg" placeholder="?">
                                <span class="text-slate-400">= ${q.c}</span>
                            </div>
                        </td>
                        <td class="py-3">
                            <span id="sum-${idx}" class="font-bold text-slate-400 text-xl opacity-0 transition-opacity">?</span>
                        </td>
                        <td class="py-3">
                            <button id="sel-${idx}" onclick="selectPair(${idx})" class="opacity-50 cursor-not-allowed bg-slate-200 text-slate-400 font-bold py-1 px-4 rounded transition" disabled>選擇</button>
                        </td>
                    </tr>
                `;
            });
            
            html += `</tbody></table>
                <div class="mt-4 text-center">
                    <button id="check-factors-btn" onclick="checkFactors()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-8 rounded-full shadow-md transition text-lg">檢查乘法組合</button>
                    <div id="feedback1" class="mt-3 h-8 font-bold text-lg"></div>
                </div>`;
            
            container.innerHTML = html;

            // 綁定 Enter 鍵
             q.pairs.forEach((pair, idx) => {
                const inp1 = document.getElementById(`f-${idx}-1`);
                const inp2 = document.getElementById(`f-${idx}-2`);
                const handleEnter = (e) => {
                    if (e.key === 'Enter') {
                        if (idx === q.pairs.length - 1 && (e.target === inp2 || (e.target === inp1 && q.mode !== 'guided'))) {
                            checkFactors();
                        } else {
                            const nextInput = document.getElementById(`f-${idx}-2`) || document.getElementById(`f-${idx+1}-1`);
                            if(e.target === inp1 && !inp2.readOnly) inp2.focus();
                            else if(document.getElementById(`f-${idx+1}-1`)) document.getElementById(`f-${idx+1}-1`).focus();
                            else checkFactors();
                        }
                    }
                };
                inp1.addEventListener('keydown', handleEnter);
                inp2.addEventListener('keydown', handleEnter);
            });
        }

        // --- 模式 B: 卡片篩選 ---
        function renderFactorCards(q) {
            const container = document.getElementById('step1-content');
            let html = `
                <p class="text-center text-slate-500 mb-4">這題組合比較多，老師幫你列出來了。請你算算看，哪一組加起來是 <span class="font-bold text-blue-600">${(q.sign1 === '-' ? '-' : '') + q.b}</span>？</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            `;

            q.pairs.forEach((pair, idx) => {
                html += `
                    <div id="card-${idx}" class="factor-card bg-white border-2 border-slate-200 rounded-xl p-4 flex flex-col items-center gap-3" onclick="activateCard(${idx})">
                        <div class="text-xl font-mono text-slate-600 font-bold">
                            ${pair[0]} × ${pair[1]} = ${q.c}
                        </div>
                        <div id="card-verify-${idx}" class="hidden w-full flex flex-col items-center animate-fade-in">
                            <div class="flex items-center gap-2 text-slate-700 font-bold">
                                <span>${pair[0]} + ${pair[1]} = </span>
                                <input type="number" id="card-sum-${idx}" class="w-16 p-1 border-2 border-blue-300 rounded text-center font-mono text-lg" placeholder="?" onclick="event.stopPropagation()">
                            </div>
                            <button onclick="event.stopPropagation(); confirmCardSum(${idx})" class="mt-2 w-full bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-1 rounded transition">確認</button>
                        </div>
                        <div id="card-msg-${idx}" class="text-sm font-bold h-5"></div>
                    </div>
                `;
            });

            html += `</div><div id="feedback1" class="mt-3 h-8 font-bold text-lg text-center"></div>`;
            container.innerHTML = html;
        }

        // --- 模式 B 的邏輯 ---
        function activateCard(idx) {
            // 隱藏其他卡片的輸入框
            document.querySelectorAll('[id^="card-verify-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.factor-card').forEach(el => el.classList.remove('ring-2', 'ring-blue-400', 'bg-blue-50'));
            
            const card = document.getElementById(`card-${idx}`);
            const verify = document.getElementById(`card-verify-${idx}`);
            
            card.classList.add('ring-2', 'ring-blue-400', 'bg-blue-50');
            verify.classList.remove('hidden');
            
            const input = document.getElementById(`card-sum-${idx}`);
            setTimeout(() => input.focus(), 100);

            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.stopPropagation();
                    confirmCardSum(idx);
                }
            };
        }

        function confirmCardSum(idx) {
            const q = questions[currentQIndex];
            const pair = q.pairs[idx];
            const input = document.getElementById(`card-sum-${idx}`);
            const userSum = parseInt(input.value);
            const actualSum = pair[0] + pair[1];
            const targetB = (q.sign1 === '-') ? -q.b : q.b;
            const msgEl = document.getElementById(`card-msg-${idx}`);

            if (isNaN(userSum)) {
                msgEl.innerText = "請輸入數字";
                msgEl.className = "text-sm font-bold h-5 text-red-500";
                return;
            }

            if (userSum !== actualSum) {
                msgEl.innerText = "算錯囉，再試一次";
                msgEl.className = "text-sm font-bold h-5 text-red-500";
                input.classList.add('border-red-400');
                return;
            }

            input.classList.remove('border-red-400');
            input.classList.add('border-green-400', 'bg-green-50');
            
            if (actualSum === targetB) {
                msgEl.innerText = "正確！就是這組！";
                msgEl.className = "text-sm font-bold h-5 text-green-600";
                document.getElementById(`card-${idx}`).classList.add('border-green-500', 'bg-green-100');
                showFeedback('feedback1', `太棒了！ ${pair[0]} + ${pair[1]} = ${targetB}，完全正確！`, true);
                step1Validated = true;
                unlockStep('step2');
            } else {
                msgEl.innerText = `總和是 ${actualSum}，不是 ${targetB}`;
                msgEl.className = "text-sm font-bold h-5 text-orange-500";
            }
        }

        // --- 模式 A 的邏輯 ---
        function checkFactors() {
            const q = questions[currentQIndex];
            let allCorrect = true;

            q.pairs.forEach((pair, idx) => {
                const i1 = document.getElementById(`f-${idx}-1`);
                const i2 = document.getElementById(`f-${idx}-2`);
                const v1 = parseInt(i1.value);
                const v2 = parseInt(i2.value);
                const prod = v1 * v2;
                
                if (isNaN(prod) || prod !== q.c) {
                    allCorrect = false;
                    i1.classList.add('border-red-400', 'bg-red-50');
                    i2.classList.add('border-red-400', 'bg-red-50');
                } else {
                    i1.classList.remove('border-red-400', 'bg-red-50');
                    i2.classList.remove('border-red-400', 'bg-red-50');
                    i1.classList.add('border-green-400', 'bg-green-50');
                    i2.classList.add('border-green-400', 'bg-green-50');
                    
                    if (q.sign1 === '-' && (v1 > 0 || v2 > 0)) {
                         allCorrect = false; 
                         showFeedback('feedback1', `乘積是 ${q.c} 沒錯，但題目的一次項是負的，想一下因數應該是正還是負？`, false);
                         return;
                    }
                }
            });

            if (allCorrect) {
                step1Validated = true;
                showFeedback('feedback1', '乘法組合全對！現在請看「相加結果」，選出正確的那一組。', true);
                
                q.pairs.forEach((pair, idx) => {
                    const v1 = parseInt(document.getElementById(`f-${idx}-1`).value);
                    const v2 = parseInt(document.getElementById(`f-${idx}-2`).value);
                    const sum = v1 + v2;
                    
                    const sumSpan = document.getElementById(`sum-${idx}`);
                    sumSpan.innerText = sum;
                    sumSpan.classList.remove('opacity-0');
                    sumSpan.classList.add('text-slate-700');

                    const btn = document.getElementById(`sel-${idx}`);
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-200', 'text-slate-400');
                    btn.classList.add('bg-blue-100', 'text-blue-600', 'hover:bg-blue-200', 'border', 'border-blue-200');
                });

                document.getElementById('check-factors-btn').style.display = 'none';
            } else {
                if (!document.getElementById('feedback1').innerText.includes('負')) {
                    showFeedback('feedback1', `有些格子填錯囉，乘起來要是 ${q.c} 喔！`, false);
                }
            }
        }

        function selectPair(idx) {
            if (!step1Validated) return;
            
            document.querySelectorAll('.factor-row').forEach(r => r.classList.remove('selected'));
            document.querySelectorAll('[id^="sel-"]').forEach(b => {
                b.innerText = "選擇";
                b.classList.remove('bg-green-500', 'text-white');
                b.classList.add('bg-blue-100', 'text-blue-600');
            });

            const row = document.getElementById(`sel-${idx}`).closest('tr');
            row.classList.add('selected');
            const btn = document.getElementById(`sel-${idx}`);
            btn.innerText = "已選擇";
            btn.classList.remove('bg-blue-100', 'text-blue-600');
            btn.classList.add('bg-green-500', 'text-white');

            const q = questions[currentQIndex];
            const v1 = parseInt(document.getElementById(`f-${idx}-1`).value);
            const v2 = parseInt(document.getElementById(`f-${idx}-2`).value);
            const sum = v1 + v2;
            const targetB = (q.sign1 === '-') ? -q.b : q.b;

            if (sum === targetB) {
                showFeedback('feedback1', `答對了！ ${v1} + ${v2} = ${targetB}，完全符合！`, true);
                unlockStep('step2');
            } else {
                showFeedback('feedback1', `選錯囉，這一組加起來是 ${sum}，但我們要找的是 ${targetB}。`, false);
            }
        }

        // --- 共用 ---
        function checkStep2() {
            const v1 = parseInt(document.getElementById('cross-input-1').value);
            const v2 = parseInt(document.getElementById('cross-input-2').value);
            const q = questions[currentQIndex];
            
            const isCorrect = (v1 === q.ans[0] && v2 === q.ans[1]) || (v1 === q.ans[1] && v2 === q.ans[0]);

            if (isCorrect) {
                showFeedback('feedback2', '填寫正確！', true);
                unlockStep('step3');
            } else {
                // 這裡新增判斷：如果是跳過步驟一的題目，要給予特別提示
                if (q.skipStep1) {
                    const targetSum = (q.sign1 === '-' ? '-' : '') + q.b;
                    let msg = `不對喔！提示：找兩個數，相乘是 ${q.c}，相加是 ${targetSum}`;
                    
                    // 如果乘積對了但相加錯，可以給更細的提示
                    const userProd = v1 * v2;
                    if (userProd === q.c) {
                        msg = `乘積是 ${q.c} 沒錯，但這兩個數相加不是 ${targetSum} 喔！再找找看別的組合。`;
                    }
                    showFeedback('feedback2', msg, false);
                } else {
                    // 原本的提示
                    showFeedback('feedback2', `請填入步驟一選出的那兩個數字 (${q.ans[0]} 和 ${q.ans[1]})`, false);
                }
            }
        }

        function checkStep3() {
             const v1 = parseInt(document.getElementById('final-1').value);
             const v2 = parseInt(document.getElementById('final-2').value);
             const q = questions[currentQIndex];
             
             const isCorrect = (v1 === q.ans[0] && v2 === q.ans[1]) || (v1 === q.ans[1] && v2 === q.ans[0]);

             if (isCorrect) {
                 showFeedback('feedback3', '完美！完全正確！', true);
                 document.getElementById('completion').classList.remove('hidden');
                 document.getElementById('completion').scrollIntoView({ behavior: 'smooth' });
                 setTimeout(() => document.getElementById('next-btn').focus(), 100);
             } else {
                 showFeedback('feedback3', '括號裡的數字要跟圖形一樣喔！', false);
             }
        }

        function resetInterface() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.querySelectorAll('[id^="feedback"]').forEach(f => f.innerHTML = '');
            document.getElementById('step1').classList.remove('opacity-50');
            document.getElementById('step2').classList.add('step-locked', 'border-slate-300');
            document.getElementById('step2').classList.remove('border-blue-500');
            document.getElementById('step3').classList.add('step-locked', 'border-slate-300');
            document.getElementById('step3').classList.remove('border-blue-500');
            document.getElementById('completion').classList.add('hidden');
            const checkBtn = document.getElementById('check-factors-btn');
            if(checkBtn) checkBtn.style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function unlockStep(stepId) {
            const step = document.getElementById(stepId);
            step.classList.remove('step-locked');
            step.classList.add('border-blue-500'); 
            step.classList.remove('border-slate-300');
            const firstInput = step.querySelector('input');
            if (firstInput) setTimeout(() => firstInput.focus(), 100);
            setTimeout(() => step.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
        }

        function showFeedback(elementId, message, isCorrect) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = isCorrect ? 'mt-3 h-8 font-bold text-lg text-green-600' : 'mt-3 h-8 font-bold text-lg text-red-500';
        }

        function nextQuestion() {
            if (currentQIndex < questions.length - 1) {
                loadQuestion(currentQIndex + 1);
            }
        }
    </script>
<script src="../progress.js"></script>
</body>
</html>
