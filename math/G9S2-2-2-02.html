<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學-點擊版 (九下 2-2 樹狀圖)</title>
    <link rel="icon" href="../images/dog.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎數學式呈現規則 */
        .math {
            font-size: 26px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            vertical-align: middle;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            line-height: 1.1;
            margin: 0 4px;
            vertical-align: middle;
        }

        .fraction>div:last-child {
            border-bottom: 2px solid #000;
            padding: 0 4px 2px 4px;
            margin-bottom: 2px;
        }

        .power {
            font-size: 18px;
            vertical-align: super;
            margin-left: 2px;
            color: #e63946;
        }

        .sqrt::before {
            content: "√";
            font-size: 28px;
            margin-right: 2px;
        }

        .abs::before {
            content: "|";
        }

        .abs::after {
            content: "|";
        }

        .mixed {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            vertical-align: middle;
        }

        /* 互動元素樣式 */
        mark {
            background-color: #fef08a;
            padding: 0 4px;
            border-radius: 4px;
            color: #1e3a8a;
            font-weight: bold;
        }

        .slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            border-bottom: 4px solid #60a5fa;
            /* blue-400 */
            background-color: #eff6ff;
            /* blue-50 */
            color: #1e3a8a;
            /* blue-900 */
            font-weight: bold;
            font-size: 1.25rem;
            margin: 0 4px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        .slot.filled {
            background-color: #dbeafe;
            /* blue-100 */
            border-color: #2563eb;
            /* blue-600 */
        }

        .slot.completed {
            background-color: #dcfce7;
            /* green-100 */
            border-color: #16a34a;
            /* green-600 */
            color: #14532d;
            /* green-900 */
            cursor: default;
        }

        /* 動畫 */
        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .animate-tada {
            animation: tada 1s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 隱藏捲軸但保持可捲動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <nav class="bg-white shadow-md z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
            <div class="flex items-center gap-4 w-full">
                <!-- 單元名稱 -->
                <div class="font-bold text-lg text-blue-800 whitespace-nowrap hidden sm:block">
                    九下 2-2 機率 (樹狀圖)
                </div>

                <!-- 題號滑動區 -->
                <div class="flex-1 overflow-x-auto no-scrollbar py-2" id="nav-questions">
                    <div class="flex gap-2 w-max px-2" id="nav-buttons-container">
                        <!-- 動態生成題號按鈕 -->
                    </div>
                </div>

                <!-- 分數與計時 -->
                <div
                    class="flex items-center gap-4 whitespace-nowrap bg-blue-50 px-4 py-2 rounded-full border border-blue-100">
                    <div class="font-bold text-blue-600 flex items-center gap-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z">
                            </path>
                        </svg>
                        <span id="score-display">0</span> 分
                    </div>
                    <div class="font-bold text-gray-600 flex items-center gap-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="timer-display">07:00</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 (左右兩欄) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-7xl mx-auto w-full">

        <!-- 左側：題目區 (md 以上固定) -->
        <section
            class="md:w-5/12 lg:w-1/3 bg-yellow-50/50 p-6 md:p-8 overflow-y-auto border-b md:border-b-0 md:border-r border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-l-4 border-yellow-400 pl-3" id="q-title">題目</h2>
            <div class="text-lg leading-relaxed text-gray-700 space-y-2" id="q-text">
                <!-- 動態載入題目 -->
            </div>
            <!-- 若有SVG配圖可放此 -->
            <div id="q-svg" class="mt-6 flex justify-center"></div>
        </section>

        <!-- 右側：步驟解鎖區 -->
        <section class="md:w-7/12 lg:w-2/3 p-4 md:p-8 overflow-y-auto bg-white relative scroll-smooth"
            id="steps-container">
            <!-- 動態載入步驟 -->
        </section>

    </main>

    <!-- 完成視窗 Modal -->
    <div id="completion-modal"
        class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl transform scale-95 opacity-0 transition-all duration-300"
            id="modal-content">
            <div class="text-center">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="text-3xl font-bold text-gray-800 mb-2">太棒了！全部完成！</h3>
                <p class="text-gray-600 mb-6 text-lg">你獲得了 <span id="final-score"
                        class="font-bold text-blue-600 text-2xl">0</span> 分，繼續保持！</p>

                <div class="flex gap-4 justify-center">
                    <button onclick="resetAll()"
                        class="px-6 py-3 bg-blue-100 text-blue-700 rounded-xl font-bold hover:bg-blue-200 transition-colors">
                        再做一次
                    </button>
                    <button onclick="closeModal()"
                        class="px-6 py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition-colors shadow-lg shadow-green-500/30">
                        關閉視窗
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 浮動提示 Toast -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-full shadow-lg font-bold transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50">
        提示訊息
    </div>

    <script>
        /**
         * 題型標記：組合與機率 (利用樹狀圖/乘法原理找出所有可能與條件情況)
         * 設計原則：引導特教生先算出全部的組合(乘法)，再找出符合條件的組合數，最後組成機率分數。
         */
        const quizData = [
            {
                id: 1,
                title: "題 1：衣服與褲子搭配",
                text: "小傑有 <mark>紅、白、藍、黑</mark> 4件不同顏色的上衣，<mark>A、B</mark> 2條不同樣式的褲子，任一件上衣都可以和任一條褲子搭配，回答下列問題：<br><br>(1)若要從上衣及褲子中各任意選出一種，則共有多少種選擇方式？<br>(2)若被選到的機會都相同，則選到 <mark>黑色上衣搭配B褲子</mark> 的機率是多少？",
                steps: [
                    {
                        desc: "步驟 1：計算選擇方式總數",
                        html: `上衣有 [4] 件，褲子有 [2] 條。<br>搭配方式共有 4 × 2 = [8] 種。`
                    },
                    {
                        desc: "步驟 2：計算指定搭配的機率",
                        html: `「黑色上衣搭配B褲子」只有 [1] 種情況。<br>機率是：<span class="math"><div class="fraction"><div>[8]</div><div>[1]</div></div></span>`
                    }
                ]
            },
            {
                id: 2,
                title: "題 2：硬幣與骰子",
                text: "同時投擲一枚公正的 <mark>硬幣</mark> 與一顆公正的 <mark>骰子</mark>，回答下列問題：<br><br>(1)出現硬幣為 <mark>正面</mark> 且骰子點數為 <mark>偶數</mark> 的機率是多少？<br>(2)出現硬幣為 <mark>反面</mark> 且骰子點數 <mark>小於4</mark> 的機率是多少？",
                steps: [
                    {
                        desc: "步驟 1：計算全部組合數",
                        html: `硬幣有 [2] 種 (正、反)，骰子有 [6] 種點數。<br>全部共有 2 × 6 = [12] 種結果。`
                    },
                    {
                        desc: "步驟 2：正面且偶數的機率",
                        html: `硬幣正面 ([1] 種) 且骰子偶數 (2、4、6 共 [3] 種)。<br>情況有 1 × 3 = [3] 種。<br>機率是：<span class="math"><div class="fraction"><div>[12]</div><div>[3]</div></div> = <div class="fraction"><div>[4]</div><div>[1]</div></div></span>`
                    },
                    {
                        desc: "步驟 3：反面且小於 4 的機率",
                        html: `硬幣反面 ([1] 種) 且骰子小於 4 (1、2、3 共 [3] 種)。<br>情況有 1 × 3 = [3] 種。<br>機率是：<span class="math"><div class="fraction"><div>[12]</div><div>[3]</div></div> = <div class="fraction"><div>[4]</div><div>[1]</div></div></span>`
                    }
                ]
            },
            {
                id: 3,
                title: "題 3：兩顆骰子",
                text: "同時投擲 <mark>兩顆公正的骰子</mark>，回答下列問題：<br><br>(1)出現點數 <mark>皆為1</mark> 的機率是多少？<br>(2)出現點數 <mark>皆為質數</mark> 的機率是多少？",
                steps: [
                    {
                        desc: "步驟 1：計算全部組合數",
                        html: `第一顆骰子有 [6] 種，第二顆骰子有 [6] 種。<br>兩顆骰子共有 6 × 6 = [36] 種結果。`
                    },
                    {
                        desc: "步驟 2：皆為 1 的機率",
                        html: `點數皆為 1 只有 (1, 1) 共 [1] 種情況。<br>機率是：<span class="math"><div class="fraction"><div>[36]</div><div>[1]</div></div></span>`
                    },
                    {
                        desc: "步驟 3：皆為質數的機率",
                        html: `質數有 2、3、5 共 [3] 個。<br>第一顆是質數有 [3] 種，第二顆也是質數有 [3] 種。<br>情況共有 3 × 3 = [9] 種。<br>機率是：<span class="math"><div class="fraction"><div>[36]</div><div>[9]</div></div> = <div class="fraction"><div>[4]</div><div>[1]</div></div></span>`
                    }
                ]
            }
        ];

        // 應用程式狀態
        const state = {
            currentQIdx: 0,
            score: 0,
            timer: 420, // 7 分鐘
            timerInterval: null,
            progress: {}, // 紀錄每題完成的步驟 index: { 0: 2, 1: 0 ... }
            isModalOpen: false
        };

        // 初始化 progress
        quizData.forEach((q, idx) => { state.progress[idx] = 0; });

        // DOM 元素
        const els = {
            navBtns: document.getElementById('nav-buttons-container'),
            score: document.getElementById('score-display'),
            timer: document.getElementById('timer-display'),
            qTitle: document.getElementById('q-title'),
            qText: document.getElementById('q-text'),
            stepsContainer: document.getElementById('steps-container'),
            toast: document.getElementById('toast'),
            modal: document.getElementById('completion-modal'),
            modalContent: document.getElementById('modal-content'),
            finalScore: document.getElementById('final-score')
        };

        // --- 初始化 ---
        function init() {
            renderNav();
            loadQuestion(0);
            startTimer();
            setupEventListeners();
        }

        // --- 渲染導覽列 ---
        function renderNav() {
            els.navBtns.innerHTML = quizData.map((q, idx) => `
                <button onclick="loadQuestion(${idx})" id="nav-btn-${idx}" 
                    class="px-4 py-2 rounded-full font-bold whitespace-nowrap transition-colors border-2 
                    ${idx === state.currentQIdx ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300'}">
                    題目 ${idx + 1}
                </button>
            `).join('');
        }

        function updateNavStyle() {
            quizData.forEach((q, idx) => {
                const btn = document.getElementById(`nav-btn-${idx}`);
                if (btn) {
                    if (idx === state.currentQIdx) {
                        btn.className = "px-4 py-2 rounded-full font-bold whitespace-nowrap transition-colors border-2 bg-blue-600 text-white border-blue-600 shadow-md";
                    } else {
                        // 檢查是否該題已全部完成
                        const isDone = state.progress[idx] >= quizData[idx].steps.length;
                        if (isDone) {
                            btn.className = "px-4 py-2 rounded-full font-bold whitespace-nowrap transition-colors border-2 bg-green-100 text-green-700 border-green-300";
                            btn.innerHTML = `題目 ${idx + 1} <svg class="w-4 h-4 inline pb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                        } else {
                            btn.className = "px-4 py-2 rounded-full font-bold whitespace-nowrap transition-colors border-2 bg-white text-gray-600 border-gray-200 hover:border-blue-300";
                            btn.innerHTML = `題目 ${idx + 1}`;
                        }
                    }
                }
            });
        }

        // --- 載入題目 ---
        function loadQuestion(idx) {
            state.currentQIdx = idx;
            const q = quizData[idx];

            // 更新左側
            els.qTitle.textContent = q.title;
            els.qText.innerHTML = q.text;

            updateNavStyle();
            renderSteps();
        }

        // --- 渲染步驟 ---
        function renderSteps() {
            const qIdx = state.currentQIdx;
            const q = quizData[qIdx];
            const currentStepIdx = state.progress[qIdx];

            let html = '';

            q.steps.forEach((step, idx) => {
                // 只渲染已完成和當前的步驟
                if (idx > currentStepIdx) return;

                const isCompleted = idx < currentStepIdx;
                const isActive = idx === currentStepIdx;

                let currentStepAnswers = [];
                // 解析模板 HTML，替換 [ans] 為 slot
                let stepContent = step.html.replace(/\[(\d+)\]/g, (match, ans) => {
                    if (isCompleted) {
                        return `<span class="slot completed">${ans}</span>`;
                    } else {
                        currentStepAnswers.push(ans);
                        // 動態生成 ID 用於對應選項
                        const slotId = `slot-${qIdx}-${idx}-${Math.random().toString(36).substr(2, 5)}`;
                        return `<span class="slot" id="${slotId}" data-ans="${ans}" data-opt-id=""></span>`;
                    }
                });

                // 生成選項按鈕 (僅在 active 時顯示，並打亂順序增加一點點挑戰)
                let optionsHtml = '';
                if (isActive) {
                    // 自動從挖空需要的答案中建立選項池，確保重複選項的數量完全足夠
                    let shuffledOptions = [...currentStepAnswers].sort(() => Math.random() - 0.5);
                    optionsHtml = `
                        <div class="mt-6 p-4 bg-blue-50/50 rounded-xl border border-blue-100" id="options-area-${idx}">
                            <div class="text-sm text-blue-700 font-bold mb-3 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                點擊下方選項填入空格
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${shuffledOptions.map((opt, oIdx) => {
                        const optId = `opt-${qIdx}-${idx}-${oIdx}`;
                        return `<button class="option-btn px-5 py-2.5 bg-white border-2 border-blue-300 text-blue-800 font-bold text-lg rounded-lg shadow-sm hover:bg-blue-50 hover:border-blue-500 hover:shadow transform active:scale-95 transition-all" 
                                        id="${optId}" data-val="${opt}">${opt}</button>`;
                    }).join('')}
                            </div>
                            <div class="mt-6 flex justify-end">
                                <button class="check-btn px-6 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition-colors flex items-center gap-2" data-step="${idx}">
                                    檢查答案 
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                }

                // 步驟外框
                const borderClass = isCompleted ? 'border-green-200 bg-green-50/30' : 'border-blue-200 bg-white shadow-md shadow-blue-100/50';
                const opacityClass = isCompleted ? 'opacity-80' : 'opacity-100';
                const statusBadge = isCompleted ?
                    `<span class="ml-auto flex items-center gap-1 text-green-600 font-bold bg-green-100 px-3 py-1 rounded-full text-sm animate-tada">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 完成
                    </span>` : '';

                html += `
                    <div class="mb-6 rounded-2xl border-2 ${borderClass} ${opacityClass} overflow-hidden transition-all duration-500" id="step-box-${idx}">
                        <div class="px-5 py-3 border-b border-gray-100 bg-gray-50/50 flex items-center">
                            <h3 class="font-bold text-gray-700 text-lg flex items-center gap-2">
                                <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm">${idx + 1}</span>
                                ${step.desc}
                            </h3>
                            ${statusBadge}
                        </div>
                        <div class="p-5 md:p-6 text-xl leading-loose text-gray-800">
                            ${stepContent}
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });

            els.stepsContainer.innerHTML = html;

            // 如果有新的 active 步驟，平滑捲動過去
            setTimeout(() => {
                const activeBox = document.getElementById(`step-box-${currentStepIdx}`);
                if (activeBox) {
                    activeBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
        }

        // --- 事件監聽 (事件委派) ---
        function setupEventListeners() {
            els.stepsContainer.addEventListener('click', (e) => {
                // 1. 點擊選項按鈕
                if (e.target.closest('.option-btn')) {
                    const btn = e.target.closest('.option-btn');
                    handleOptionClick(btn);
                }

                // 2. 點擊填答格 (解除填寫)
                else if (e.target.closest('.slot:not(.completed)')) {
                    const slot = e.target.closest('.slot');
                    handleSlotClick(slot);
                }

                // 3. 點擊檢查按鈕
                else if (e.target.closest('.check-btn')) {
                    const btn = e.target.closest('.check-btn');
                    checkAnswer(parseInt(btn.dataset.step));
                }
            });
        }

        // --- 處理選項點擊 ---
        function handleOptionClick(btn) {
            const val = btn.dataset.val;
            const optId = btn.id;

            // 找當前步驟第一個未填的 slot
            const qIdx = state.currentQIdx;
            const stepIdx = state.progress[qIdx];
            const stepBox = document.getElementById(`step-box-${stepIdx}`);

            const emptySlot = Array.from(stepBox.querySelectorAll('.slot')).find(s => !s.textContent);

            if (emptySlot) {
                emptySlot.textContent = val;
                emptySlot.dataset.optId = optId; // 記住是哪個按鈕填入的
                emptySlot.classList.add('filled');

                // 隱藏按鈕 (不移除，保留位置避免跳動，或用 display:none)
                btn.classList.add('hidden');
            }
        }

        // --- 處理格子點擊 (清除) ---
        function handleSlotClick(slot) {
            if (!slot.textContent) return; // 已經是空的

            const optId = slot.dataset.optId;
            const btn = document.getElementById(optId);

            // 清空格子
            slot.textContent = '';
            slot.dataset.optId = '';
            slot.classList.remove('filled');

            // 恢復按鈕
            if (btn) {
                btn.classList.remove('hidden');
            }
        }

        // --- 檢查答案 ---
        function checkAnswer(stepIdx) {
            const qIdx = state.currentQIdx;
            const stepBox = document.getElementById(`step-box-${stepIdx}`);
            const slots = Array.from(stepBox.querySelectorAll('.slot'));

            // 1. 檢查是否全填
            const hasEmpty = slots.some(s => !s.textContent);
            if (hasEmpty) {
                showToast('⚠️ 請填滿所有空格再檢查哦！', 'bg-yellow-500');
                stepBox.classList.add('animate-shake');
                setTimeout(() => stepBox.classList.remove('animate-shake'), 400);
                return;
            }

            // 2. 核對答案
            const isCorrect = slots.every(s => s.textContent === s.dataset.ans);

            if (isCorrect) {
                // 答對
                showToast('🎉 答對了！', 'bg-green-500');
                state.score += 10;
                updateScore();

                // 更新進度
                state.progress[qIdx]++;

                // 重新渲染步驟 (會自動解鎖下一題並套用完成樣式)
                renderSteps();
                updateNavStyle();

                // 檢查是否全部完成
                checkAllCompleted();

            } else {
                // 答錯
                showToast('❌ 再想想看，答案不太對哦。', 'bg-red-500');
                stepBox.classList.add('animate-shake');
                setTimeout(() => stepBox.classList.remove('animate-shake'), 400);
                // 依據規則：不得清除學生已填寫內容，讓他們自己點擊修改
            }
        }

        // --- UI 輔助函數 ---
        function showToast(msg, bgClass) {
            els.toast.textContent = msg;
            els.toast.className = `fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg font-bold transition-all duration-300 z-50 text-white ${bgClass} opacity-100 translate-y-0`;

            setTimeout(() => {
                els.toast.classList.remove('opacity-100', 'translate-y-0');
                els.toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }

        function updateScore() {
            els.score.textContent = state.score;
        }

        // --- 計時器 ---
        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);

            state.timerInterval = setInterval(() => {
                if (state.timer <= 0) {
                    clearInterval(state.timerInterval);
                    return;
                }
                state.timer--;
                const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
                const s = (state.timer % 60).toString().padStart(2, '0');
                els.timer.textContent = `${m}:${s}`;
            }, 1000);
        }

        // --- 完成檢查與 Modal ---
        function checkAllCompleted() {
            const allDone = quizData.every((q, idx) => state.progress[idx] >= q.steps.length);
            if (allDone && !state.isModalOpen) {
                clearInterval(state.timerInterval);
                els.finalScore.textContent = state.score;

                els.modal.classList.remove('hidden');
                // 延遲一點點讓 display block 作用後再加 opacity 達到漸變效果
                setTimeout(() => {
                    els.modal.classList.remove('opacity-0');
                    els.modalContent.classList.remove('scale-95', 'opacity-0');
                    els.modalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
                state.isModalOpen = true;
            }
        }

        function closeModal() {
            els.modal.classList.add('opacity-0');
            els.modalContent.classList.remove('scale-100', 'opacity-100');
            els.modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                els.modal.classList.add('hidden');
                state.isModalOpen = false;
            }, 300);
        }

        function resetAll() {
            closeModal();
            state.score = 0;
            state.timer = 420;
            updateScore();
            quizData.forEach((q, idx) => { state.progress[idx] = 0; });
            startTimer();
            loadQuestion(0); // 回到第一題
        }

        // 啟動應用程式
        init();

    </script>
</body>

</html>
