<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 單元七：描點判斷方程式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; user-select: none; }
        .math { font-size: 24px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .slot {
            display: inline-block; min-width: 44px; height: 44px; border-bottom: 3px solid #94a3b8;
            margin: 0 4px; text-align: center; line-height: 44px; vertical-align: bottom;
            cursor: pointer; transition: all 0.2s; color: #2563eb; font-weight: bold;
            border-radius: 4px 4px 0 0; padding: 0 8px;
        }
        .slot.filled { border-bottom-color: #2563eb; background-color: #eff6ff; }
        .slot.correct { border-bottom-color: #10b981; color: #10b981; background-color: #ecfdf5; }
        .option-btn { transition: all 0.2s; touch-action: manipulation; }
        .option-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: scale(0.9); }
        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .tada { animation: tada 0.8s both; }
        .step-container { transition: all 0.5s ease; max-height: 0; overflow: hidden; opacity: 0; pointer-events: none; }
        .step-container.active { max-height: 2000px; opacity: 1; margin-bottom: 1.5rem; pointer-events: auto; }
        .coordinate-grid line { stroke: #e2e8f0; stroke-width: 1; }
        .coordinate-axis { stroke: #475569; stroke-width: 2; }
        .plot-point { fill: #ef4444; transition: all 0.3s; r: 0; animation: pointAppear 0.5s forwards; }
        @keyframes pointAppear { to { r: 6; } }
        .plot-line { stroke: #3b82f6; stroke-width: 3; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 1.5s forwards; }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  <link rel="icon" href="../images/dog.png" type="image/png">
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center p-2 no-scrollbar overflow-x-auto whitespace-nowrap">
            <span class="font-bold text-blue-600 px-4 border-r border-slate-200">單元七：描點判斷</span>
            <div id="nav-btns" class="flex gap-2 ml-2"></div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- 左側：圖形顯示區 -->
            <div class="w-full md:w-1/3 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:sticky md:top-20">
                    <h2 class="text-xl font-bold mb-4 text-slate-800">觀察點位與方向</h2>
                    <div class="mb-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <p class="text-lg font-bold text-blue-800" id="q-title">題目 1</p>
                        <div class="text-slate-700 mt-2 leading-relaxed" id="q-text"></div>
                    </div>

                    <div class="relative w-full aspect-square bg-white border border-slate-200 rounded-lg overflow-hidden shadow-inner">
                        <svg id="coordinate-plane" viewBox="0 0 300 300" class="w-full h-full">
                            <g class="coordinate-grid" id="grid-lines"></g>
                            <line x1="0" y1="150" x2="300" y2="150" class="coordinate-axis" />
                            <line x1="150" y1="0" x2="150" y2="300" class="coordinate-axis" />
                            <text x="285" y="140" font-size="14" font-style="italic" fill="#475569">x</text>
                            <text x="160" y="15" font-size="14" font-style="italic" fill="#475569">y</text>
                            <text x="135" y="165" font-size="14" fill="#475569">O</text>
                            <!-- 刻度提示 -->
                            <line x1="170" y1="145" x2="170" y2="155" stroke="#475569" stroke-width="1" />
                            <line x1="145" y1="130" x2="155" y2="130" stroke="#475569" stroke-width="1" />
                            <g id="drawing-layer"></g>
                        </svg>
                    </div>

                    <div id="result-box" class="mt-6 p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl text-center hidden">
                        <p class="text-slate-500 text-sm">這條線的方程式為：</p>
                        <div class="math text-blue-600 mt-1" id="final-equation-display"></div>
                    </div>
                </div>
            </div>

            <!-- 右側：步驟區 -->
            <div class="w-full md:w-2/3" id="steps-container"></div>
        </div>
    </div>

    <div id="success-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modal-content">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">正確判定！</h2>
            <p class="text-slate-600 mb-8" id="modal-desc">透過描點，我們可以很清楚地看到直線的規律。</p>
            <div class="space-y-3">
                <button onclick="nextQuestOrReset()" id="modal-next-btn" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors">下一題</button>
                <button onclick="closeModal()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1, fading: "全引導", points: [{x: 5, y: 5}, {x: 5, y: -2}],
                text: "直線通過 <mark class='bg-yellow-100 px-1'>(5, 5)</mark> 與 <mark class='bg-yellow-100 px-1'>(5, -2)</mark>，請判斷方程式。",
                steps: [
                    { title: "步驟一：描出點位", content: "點 A(5, 5) 與 點 B(5, -2) <br> 請點擊按鈕在左圖標示出來： <br> <button onclick='renderPoints()' class='mt-2 px-6 py-2 bg-red-500 text-white rounded-lg font-bold shadow-md' id='btn-plot-1'>描繪這兩個點</button>", autoCheck: true },
                    { title: "步驟二：觀察連線方向", content: "將兩點連起來後，這是一條： <br> <span class='slot' data-ans='鉛垂線'></span> (垂直 x 軸)", opts: ["鉛垂線", "水平線"] },
                    { title: "步驟三：找出相同座標", content: "這兩點的 <span class='slot' data-ans='x'></span> 座標都一樣，數值為 <span class='slot' data-ans='5'></span>", opts: ["x", "y", "5", "-2"] },
                    { title: "步驟四：寫出方程式", content: "因為 x 座標固定不變，所以方程式為： <br> <span class='slot' data-ans='x'></span> = <span class='slot' data-ans='5'></span>", opts: ["x", "y", "5"] }
                ]
            },
            {
                id: 2, fading: "中引導", points: [{x: 3, y: -4}, {x: -1, y: -4}],
                text: "直線通過 <mark class='bg-yellow-100 px-1'>(3, -4)</mark> 與 <mark class='bg-yellow-100 px-1'>(-1, -4)</mark>，請判斷方程式。",
                steps: [
                    { title: "步驟一：描點觀察", content: "點 A(3, -4) 與 點 B(-1, -4) <br> <button onclick='renderPoints()' class='mt-2 px-6 py-2 bg-red-500 text-white rounded-lg font-bold shadow-md' id='btn-plot-2'>標示點位</button>", autoCheck: true },
                    { title: "步驟二：觀察連線特徵", content: "兩點的 <span class='slot' data-ans='y'></span> 座標相同，都是 <span class='slot' data-ans='-4'></span> <br> 這是一條 <span class='slot' data-ans='水平線'></span>", opts: ["x", "y", "-4", "3", "水平線", "鉛垂線"] },
                    { title: "步驟三：寫出方程式", content: "方程式為： <span class='slot' data-ans='y'></span> = <span class='slot' data-ans='-4'></span>", opts: ["y", "x", "-4", "3"] }
                ]
            },
            {
                id: 3, fading: "低引導", points: [{x: -2, y: 1}, {x: -2, y: 6}],
                text: "直線通過 <mark class='bg-yellow-100 px-1'>(-2, 1)</mark> 與 <mark class='bg-yellow-100 px-1'>(-2, 6)</mark>。求其方程式。",
                steps: [
                    { title: "步驟一：描點分析", content: "點 A(-2, 1) 與 點 B(-2, 6) <br> <button onclick='renderPoints()' class='mt-2 px-6 py-2 bg-red-500 text-white rounded-lg font-bold shadow-md' id='btn-plot-3'>標示點位</button>", autoCheck: true },
                    { title: "步驟二：自行判斷方程式", content: "觀察發現 <span class='slot' data-ans='x'></span> 座標恆定，方程式為： <br> <span class='slot' data-ans='x'></span> = <span class='slot' data-ans='-2'></span>", opts: ["x", "y", "-2", "1", "6"] }
                ]
            },
            {
                id: 4, fading: "自主練習", points: [{x: 0, y: 2}, {x: 7, y: 2}],
                text: "直線通過 <mark class='bg-yellow-100 px-1'>(0, 2)</mark> 與 <mark class='bg-yellow-100 px-1'>(7, 2)</mark>。求其方程式。",
                steps: [
                    { title: "步驟一：描點", content: "標示點位並觀察： <br> <button onclick='renderPoints()' class='mt-2 px-6 py-2 bg-red-500 text-white rounded-lg font-bold shadow-md' id='btn-plot-4'>標示點位</button>", autoCheck: true },
                    { title: "步驟二：寫出方程式", content: "方程式為： <br> <span class='slot' data-ans='y'></span> = <span class='slot' data-ans='2'></span>", opts: ["y", "x", "2", "0", "7"] }
                ]
            }
        ];

        let curIdx = 0;
        let pointsPlotted = false;

        function init() {
            const nav = document.getElementById('nav-btns');
            nav.innerHTML = questions.map((q, i) => `
                <button onclick="loadQuest(${i})" class="nav-btn px-4 py-1.5 rounded-full font-bold transition-all ${i===0?'bg-blue-600 text-white shadow-md':'bg-slate-100 text-slate-500 hover:bg-slate-200'}">題目 ${q.id}</button>
            `).join('');
            drawGrid();
            loadQuest(0);
        }

        function drawGrid() {
            const g = document.getElementById('grid-lines');
            g.innerHTML = '';
            for (let i = 0; i <= 300; i += 20) {
                const l1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l1.setAttribute("x1", i); l1.setAttribute("y1", 0); l1.setAttribute("x2", i); l1.setAttribute("y2", 300);
                g.appendChild(l1);
                const l2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l2.setAttribute("x1", 0); l2.setAttribute("y1", i); l2.setAttribute("x2", 300); l2.setAttribute("y2", i);
                g.appendChild(l2);
            }
        }

        function loadQuest(idx) {
            curIdx = idx;
            pointsPlotted = false;
            const q = questions[idx];
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.className = `nav-btn px-4 py-1.5 rounded-full font-bold transition-all ${i===idx?'bg-blue-600 text-white shadow-md':'bg-slate-100 text-slate-500 hover:bg-slate-200'}`;
            });

            document.getElementById('q-title').innerText = `題目 (${q.id}) - ${q.fading}`;
            document.getElementById('q-text').innerHTML = q.text;
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('drawing-layer').innerHTML = '';

            const container = document.getElementById('steps-container');
            container.innerHTML = q.steps.map((s, si) => `
                <div id="step-${si}" class="step-container ${si===0?'active':''}">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-blue-500">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold flex items-center gap-2"><span class="bg-blue-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm">${si+1}</span> ${s.title}</h3>
                            <span id="step-${si}-status" class="text-green-500 font-bold hidden">✔ 完成</span>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl mb-4 text-xl leading-relaxed">${s.content}</div>
                        ${s.opts ? `<div class="flex flex-wrap gap-2" id="opts-${si}">${s.opts.map((o, oi) => `<button data-oid="${si}-${oi}" onclick="tapOpt(${si}, '${o}', this)" class="option-btn min-w-[3rem] h-12 px-3 bg-white border-2 border-slate-200 rounded-lg font-bold text-slate-700">${o}</button>`).join('')}</div>` : ''}
                        <button onclick="checkStep(${si})" id="check-${si}" class="mt-6 w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100">${s.autoCheck ? '完成描點' : '檢查答案'}</button>
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.slot').forEach(s => {
                s.onclick = () => {
                    if (s.classList.contains('correct')) return;
                    const oid = s.dataset.boundOid;
                    if (oid) document.querySelector(`[data-oid="${oid}"]`).disabled = false;
                    s.innerText = ''; s.classList.remove('filled'); delete s.dataset.boundOid;
                };
            });
        }

        function renderPoints() {
            if (pointsPlotted) return;
            const q = questions[curIdx];
            const l = document.getElementById('drawing-layer');
            q.points.forEach(p => {
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", 150 + p.x*20); c.setAttribute("cy", 150 - p.y*20);
                c.setAttribute("class", "plot-point");
                l.appendChild(c);
            });
            pointsPlotted = true;
            toast("描點完成，請觀察兩點的方向！");
        }

        function tapOpt(si, val, btn) {
            const slots = document.querySelectorAll(`#step-${si} .slot`);
            for (let s of slots) {
                if (!s.innerText) {
                    s.innerText = val; s.classList.add('filled');
                    s.dataset.boundOid = btn.dataset.oid;
                    btn.disabled = true; return;
                }
            }
        }

        function checkStep(si) {
            const q = questions[curIdx];
            if (q.steps[si].autoCheck && !pointsPlotted) {
                toast("請先點擊描繪點位的按鈕！");
                return;
            }

            const step = document.getElementById(`step-${si}`);
            const slots = step.querySelectorAll('.slot');
            let filled = true, ok = true;
            slots.forEach(s => { if(!s.innerText) filled = false; if(s.innerText !== s.dataset.ans) ok = false; });

            if(!filled) { toast("請完成本步驟所有空格"); return; }
            if(ok) {
                slots.forEach(s => { s.classList.add('correct', 'tada'); s.onclick = null; });
                document.getElementById(`step-${si}-status`).classList.remove('hidden');
                const optBox = document.getElementById(`opts-${si}`);
                if (optBox) optBox.classList.add('hidden');
                document.getElementById(`check-${si}`).classList.add('hidden');

                const next = document.getElementById(`step-${si+1}`);
                if(next) {
                    next.classList.add('active');
                    setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
                } else {
                    finishQuest();
                }
            } else { toast("觀察不夠仔細喔，再看一次！"); }
        }

        function finishQuest() {
            const q = questions[curIdx];
            const eqDisplay = document.getElementById('final-equation-display');
            document.getElementById('result-box').classList.remove('hidden');
            
            // 最後自動連線
            const l = document.getElementById('drawing-layer');
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            const commonX = q.points[0].x === q.points[1].x;
            if (commonX) {
                line.setAttribute("x1", 150 + q.points[0].x*20); line.setAttribute("y1", 0);
                line.setAttribute("x2", 150 + q.points[0].x*20); line.setAttribute("y2", 300);
                eqDisplay.innerText = `x = ${q.points[0].x}`;
            } else {
                line.setAttribute("x1", 0); line.setAttribute("y1", 150 - q.points[0].y*20);
                line.setAttribute("x2", 300); line.setAttribute("y2", 150 - q.points[0].y*20);
                eqDisplay.innerText = `y = ${q.points[0].y}`;
            }
            line.setAttribute("class", "plot-line");
            l.appendChild(line);

            setTimeout(showSuccess, 2000);
        }

        function toast(m) {
            const t = document.createElement('div');
            t.className = "fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full z-[200]";
            t.innerText = m; document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function showSuccess() {
            document.getElementById('success-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-content').classList.remove('scale-90');
            document.getElementById('modal-next-btn').innerText = curIdx < questions.length - 1 ? "下一題" : "從頭練習";
        }

        function closeModal() {
            document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-content').classList.add('scale-90');
        }

        function nextQuestOrReset() {
            closeModal();
            if(curIdx < questions.length - 1) loadQuest(curIdx + 1);
            else loadQuest(0);
        }

        window.onload = init;
    </script>
<script src="../progress.js"></script>
  <script src="../quiz-kit.js"></script>
</body>
</html>
