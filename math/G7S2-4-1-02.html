<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <style>
        /* 數學式專用 CSS */
        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .fraction span:first-child {
            border-bottom: 2px solid #000;
            padding: 0 4px;
        }

        /* 藍色格動態閃爍高亮 */
        @keyframes flash-blue {

            0%,
            100% {
                border-color: #3b82f6;
                background-color: #eff6ff;
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
            }

            50% {
                border-color: #93c5fd;
                background-color: #f8fafc;
            }
        }

        /* 紫色格動態閃爍高亮 */
        @keyframes flash-violet {

            0%,
            100% {
                border-color: #8b5cf6;
                background-color: #f5f3ff;
                box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.4);
            }

            50% {
                border-color: #c084fc;
                background-color: #f8fafc;
            }
        }

        /* 黃色格動態閃爍高亮 */
        @keyframes flash-amber {

            0%,
            100% {
                border-color: #f59e0b;
                background-color: #fffbeb;
                box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.4);
            }

            50% {
                border-color: #fcd34d;
                background-color: #f8fafc;
            }
        }

        /* 綠色格動態閃爍高亮 */
        @keyframes flash-emerald {

            0%,
            100% {
                border-color: #10b981;
                background-color: #ecfdf5;
                box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.4);
            }

            50% {
                border-color: #6ee7b7;
                background-color: #f8fafc;
            }
        }

        .active-blue {
            animation: flash-blue 1.5s infinite ease-in-out;
        }

        .active-violet {
            animation: flash-violet 1.5s infinite ease-in-out;
        }

        .active-amber {
            animation: flash-amber 1.5s infinite ease-in-out;
        }

        .active-emerald {
            animation: flash-emerald 1.5s infinite ease-in-out;
        }

        /* 答錯時的左右抖動動畫 */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 漸顯與平滑轉換 */
        .fade-in {
            transition: all 0.5s ease-out;
        }

        /* 隱藏滾動條但保持滾動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

        `,
                slots: [
                    { id: "q6-s1", order: 1, type: "frac-num", placeholder: "分子", answer: "y", value: "", colorClass: "blue" },
                    { id: "q6-s2", order: 2, type: "frac-den", placeholder: "分母", answer: "4", value: "", colorClass: "violet" },
                    { id: "q6-s3", order: 3, type: "sub", placeholder: "減數", answer: "2", value: "", colorClass: "violet" },
                    { id: "q6-s4", order: 4, type: "sign", placeholder: "符號", answer: ">", value: "", colorClass: "amber" },
                    { id: "q6-s5", order: 5, type: "num", placeholder: "數字", answer: "10", value: "", colorClass: "emerald" }
                ],
                options: ["y", "4", "2", ">", "10", "5", "y-2", "<"],
                isEligible: true,
                isCorrect: false
            }
        ];

        // 全域變數定義
        let currentQuestionIdx = 0;
        let score = 0;
        let secondsLeft = 420; // 7分鐘預設
        let timerInterval = null;
        let isFinished = false;

        // 深拷貝一份遊戲題目狀態
        let activeQuestions = JSON.parse(JSON.stringify(questionsData));

        // 打亂選項數組
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 初始化所有選項打亂 (每個步驟在最一開始即固定打亂)
        function initializeShuffledOptions() {
            activeQuestions.forEach(q => {
                q.shuffledOptions = shuffle([...q.options]);
            });
        }

        // Web Audio 音效產生器 (無外部依賴)
        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                if (type === 'correct') {
                    // 清脆上升雙音
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start();

                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); // E5
                    gain.gain.setValueAtTime(0.08, ctx.currentTime + 0.12);

                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    // 低沉錯誤警告
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.frequency.setValueAtTime(180.00, ctx.currentTime); // F3
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start();

                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) {
                console.log("瀏覽器音效不支援或被阻擋");
            }
        }

        // 動態發射炫麗彩色亮粉 (Confetti) 效果
        function triggerConfetti() {
            const container = document.getElementById('confetti-container');
            if (!container) return;
            container.innerHTML = '';

            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#fbbf24', '#8b5cf6', '#ec4899'];
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'absolute w-3 h-3 rounded-full opacity-90';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';

                // 隨動放射角度
                const angle = Math.random() * Math.PI * 2;
                const velocity = 6 + Math.random() * 12;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 2; // 稍向上偏升

                container.appendChild(p);

                let x = 0;
                let y = 0;
                let gravity = 0.35;
                let currentVx = vx;
                let currentVy = vy;

                const interval = setInterval(() => {
                    x += currentVx;
                    y += currentVy;
                    currentVy += gravity;
                    p.style.transform = `translate(${x}px, ${y}px) scale(${1 - y / 350})`;
                    p.style.opacity = `${1 - y / 400}`;

                    if (y > 350) {
                        clearInterval(interval);
                        p.remove();
                    }
                }, 16);
            }
        }

        // 啟動與倒數計時器
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    finishGame(true); // 時間到，結算
                    return;
                }
                secondsLeft--;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            const displayStr = `倒數 ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = displayStr;

            // 最後一分鐘紅色警示
            if (secondsLeft < 60) {
                document.getElementById('timer-display').parentElement.classList.add('text-red-400', 'animate-pulse');
            } else {
                document.getElementById('timer-display').parentElement.classList.remove('text-red-400', 'animate-pulse');
            }
        }

        // 切換題目並重新渲染
        function switchQuestion(idx) {
            currentQuestionIdx = idx;
            renderTabs();
            renderQuestionLeftPanel();
            renderStepsRightPanel();
        }

        // 渲染上方題目導覽分頁
        function renderTabs() {
            const container = document.getElementById('nav-tabs');
            container.innerHTML = '';

            activeQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full text-sm font-extrabold transition-all duration-200 flex items-center gap-1.5 shrink-0 select-none shadow-sm`;

                if (idx === currentQuestionIdx) {
                    btn.classList.add('bg-white', 'text-indigo-800', 'scale-105', 'ring-2', 'ring-indigo-300');
                } else {
                    if (q.isCorrect) {
                        btn.classList.add('bg-emerald-700', 'text-emerald-100', 'hover:bg-emerald-600');
                    } else {
                        btn.classList.add('bg-indigo-700', 'text-indigo-200', 'hover:bg-indigo-600', 'hover:text-white');
                    }
                }

                // 加上通關勾勾
                let checkMarkHtml = '';
                if (q.isCorrect) {
                    checkMarkHtml = `<span class="text-xs bg-emerald-500 text-white rounded-full p-0.5">✔</span>`;
                }

                btn.innerHTML = `${q.shortName} ${checkMarkHtml}`;
                btn.onclick = () => switchQuestion(idx);
                container.appendChild(btn);
            });

        // 渲染左側題目說明與插圖
        function renderQuestionLeftPanel() {
            const q = activeQuestions[currentQuestionIdx];
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-svg-container').innerHTML = q.svgIcon;
            document.getElementById('q-scenario').innerHTML = q.scenario;
        }

        // 找出當前「最前方未填寫」的空格 ID
        function getNextActiveSlotId(q) {
            if (!q || q.isCorrect) return null;
            // 依 order 欄位排序
            const sortedSlots = [...q.slots].sort((a, b) => a.order - b.order);
            for (let s of sortedSlots) {
                if (!s.value) return s.id;
            }
            return null;
        }

        // 取得填答格樣式（動態結合顏色提示與閃爍機制）
        function getSlotStyles(slot, isActive, isCorrect) {
            // 基礎樣式
            const base = "min-w-[65px] md:min-w-[80px] h-[48px] md:h-[56px] border-2 border-dashed rounded-xl flex items-center justify-center font-black text-sm md:text-base transition-all duration-150 select-none cursor-pointer";

            if (isCorrect) {
                // 完成狀態（全部變綠）
                return `${base} bg-emerald-50 border-emerald-500 text-emerald-700 border-solid`;
            }

            if (slot.value) {
                // 已有填寫值
                if (slot.colorClass === 'blue') return `${base} bg-blue-100 border-blue-500 text-blue-800 border-solid scale-105 shadow-sm`;
                if (slot.colorClass === 'violet') return `${base} bg-violet-100 border-violet-500 text-violet-800 border-solid scale-105 shadow-sm`;
                if (slot.colorClass === 'amber') return `${base} bg-amber-100 border-amber-500 text-amber-800 border-solid scale-105 shadow-sm`;
                if (slot.colorClass === 'emerald') return `${base} bg-emerald-100 border-emerald-500 text-emerald-800 border-solid scale-105 shadow-sm`;
            } else {
                // 尚未填寫
                if (isActive) {
                    // 正處於編輯高亮
                    if (slot.colorClass === 'blue') return `${base} active-blue`;
                    if (slot.colorClass === 'violet') return `${base} active-violet`;
                    if (slot.colorClass === 'amber') return `${base} active-amber`;
                    if (slot.colorClass === 'emerald') return `${base} active-emerald`;
                } else {
                    // 靜態未選取
                    if (slot.colorClass === 'blue') return `${base} bg-white border-blue-200 text-blue-300 hover:border-blue-300`;
                    if (slot.colorClass === 'violet') return `${base} bg-white border-violet-200 text-violet-300 hover:border-violet-300`;
                    if (slot.colorClass === 'amber') return `${base} bg-white border-amber-200 text-amber-300 hover:border-amber-300`;
                    if (slot.colorClass === 'emerald') return `${base} bg-white border-emerald-200 text-emerald-300 hover:border-emerald-300`;
                }
            }
            return base;
        }

        // 點擊選項 → 填入空格
        function fillActiveSlot(optionText) {
            const q = activeQuestions[currentQuestionIdx];
            if (q.isCorrect) return;

            const activeId = getNextActiveSlotId(q);
            if (!activeId) return; // 沒有剩餘空格

            const slot = q.slots.find(s => s.id === activeId);
            if (slot) {
                slot.value = optionText;
                playSound('correct'); // 短促提示聲
                renderStepsRightPanel();
            }
        }

        // 點擊空格 → 清空該格
        function clearSlot(slotId) {
            const q = activeQuestions[currentQuestionIdx];
            if (q.isCorrect) return; // 答對後便鎖定無法修改

            const slot = q.slots.find(s => s.id === slotId);
            if (slot) {
                slot.value = "";
                renderStepsRightPanel();
            }
        }

        // 檢查整行式子是否正確
        function checkEquationAnswer() {
            const q = activeQuestions[currentQuestionIdx];
            const cardEl = document.getElementById(`equation-card`);

            // 1. 防呆：檢查是否有空格未填寫
            const hasEmpty = q.slots.some(s => !s.value);
            if (hasEmpty) {
                showFeedback("請先點擊按鈕，填滿式子中所有的空格喔！", "warning");
                if (cardEl) {
                    cardEl.classList.add('animate-shake');
                    setTimeout(() => cardEl.classList.remove('animate-shake'), 400);
                }
                return;
            }

            // 2. 比對所有 slots 是否完全正確
            let isAllCorrect = true;
            q.slots.forEach(s => {
                if (s.value.trim() !== s.answer.trim()) {
                    isAllCorrect = false;
                }
            });

            if (isAllCorrect) {
                q.isCorrect = true;
                playSound('correct');
                triggerConfetti();

                // 若從未答錯，則加 1 分
                if (q.isEligible) {
                    score += 1;
                    updateScoreDisplay();
                }

                showFeedback("太棒了！列式完全正確！ ✔", "success");

                // 延遲重繪與導引
                setTimeout(() => {
                    renderStepsRightPanel();
                    renderTabs();
                    autoProceedAndScroll();
                }, 1000);

            } else {
                playSound('wrong');
                q.isEligible = false; // 本題已失去獲得該分資格，但仍需修正至正確
                showFeedback("算式好像有點不對喔...再想想看！可以點擊錯誤的格子清空它。", "error");

                if (cardEl) {
                    cardEl.classList.add('animate-shake');
                    setTimeout(() => cardEl.classList.remove('animate-shake'), 400);
                }
            }
        }

            const container = document.getElementById(`feedback-box`);
            if (!container) return;

            container.innerHTML = "";
            let colorClass = "text-amber-600 bg-amber-50 border-amber-200";
            if (type === "success") colorClass = "text-emerald-700 bg-emerald-50 border-emerald-200 animate-bounce";
            if (type === "error") colorClass = "text-rose-700 bg-rose-50 border-rose-200 font-extrabold";

            container.className = `p-3 rounded-xl border text-sm font-bold mt-4 text-center transition-all duration-300 ${colorClass}`;
            container.innerText = message;
        }

        function autoProceedAndScroll() {
            const isAllCompleted = activeQuestions.every(q => q.isCorrect);
            if (isAllCompleted) {
                finishGame(false);
                return;

            // 不會自動暴力跳題，給予按鈕讓學生自行確認進度，提升自主掌控權
        }

                }`;

            // 標題與通關標記
            const headerHtml = `

                    actionBtn = `
            <button onclick="finishGame(false)" 
              class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold px-7 py-3 rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all duration-150 select-none animate-bounce"
            >
              🏁 送出結算成績
            </button>
          `;
                }

                footerHtml = `
          <div class="mt-6 pt-6 border-t border-slate-100 bg-emerald-50/40 p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h4 class="text-emerald-800 text-base font-black">🎉 超級厲害！本題列式完全正確！</h4>
              <p class="text-xs text-emerald-600 font-bold">你在這個題目上展現了極佳的觀察力與邏輯力！</p>
            </div>
            ${actionBtn}
          </div>
        `;
            }

            mainCard.innerHTML = `
        ${headerHtml}
        ${slotsHtml}
        ${colorLegendsHtml}
        ${optionsBtnHtml}
        ${footerHtml}
        <div id="feedback-box" class="hidden"></div>
      `;

            container.appendChild(mainCard);
        }

        // 當學生完成所有題目或時間結束
        function finishGame(isTimeUp = false) {
            isFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            // 計算作答花費時間
            const elapsedTotalSeconds = 420 - secondsLeft;
            const mins = Math.floor(elapsedTotalSeconds / 60);
            const secs = elapsedTotalSeconds % 60;
            const timeStr = `${mins.toString().padStart(2, '0')} 分 ${secs.toString().padStart(2, '0')} 秒`;

            // 填充 Modal
            document.getElementById('modal-score').innerText = `${score} / 6 分`;
            document.getElementById('modal-time').innerText = timeStr;

            if (isTimeUp) {
                document.getElementById('modal-title').innerText = "⏰ 時間到囉！不要氣餒！";
                document.getElementById('modal-title').className = "text-2xl font-black text-rose-600";
            } else {
                document.getElementById('modal-title').innerText = "🎉 太棒了！你完成了所有練習！";
                document.getElementById('modal-title').className = "text-2xl font-black text-slate-800";
            }

            // 展開 Modal
            const modal = document.getElementById('completion-modal');
            const card = document.getElementById('modal-card');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        // 再做一次 (重置整個遊戲狀態)
        function resetWholeGame() {
            score = 0;
            secondsLeft = 420;
            isFinished = false;

            // 完全重置題目狀態與填寫值
            activeQuestions = JSON.parse(JSON.stringify(questionsData));
            initializeShuffledOptions();

            // 重置 UI
            updateScoreDisplay();
            updateTimerDisplay();
            switchQuestion(0);

            // 關閉視窗
            closeModalOnly();

            // 重啟計時器
            startTimer();
        }

        // 關閉視窗 (保留現有完成狀態不重置)
        function closeModalOnly() {
            const modal = document.getElementById('completion-modal');
            const card = document.getElementById('modal-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }

        // 網頁載入執行初始化
        window.onload = function () {
            initializeShuffledOptions();
            updateScoreDisplay();
            updateTimerDisplay();

            // 預設渲染第一題
            switchQuestion(0);

            // 啟動 7 分鐘計時
            startTimer();
        };
    </script>
</body>

</html>
