        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }

        /* 閃爍的高亮外框與底色，引導特教生填答 */
        @keyframes pulse-highlight {

            0%,
            100% {
                border-color: #3b82f6;
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
                background-color: #eff6ff;
            }

            50% {
                border-color: #60a5fa;
                box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
                background-color: #dbeafe;
            }
        }

        .active-slot {
            animation: pulse-highlight 1.6s infinite ease-in-out;
        }

        /* 步驟解鎖時的平滑淡入動畫 */
        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-fade-in {
            animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 錯誤時的左右抖動動畫 */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>

    <script>
        // --- 音效生成器 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                // 短促的點擊確認聲
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'clear') {
                // 清除按鈕的下降聲
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                // 答對的清脆和弦上升音
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + idx * 0.06);
                    g.gain.setValueAtTime(0.08, now + idx * 0.06);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.3);
                    o.start(now + idx * 0.06);
                    o.stop(now + idx * 0.06 + 0.3);
                });
            } else if (type === 'incorrect') {
                // 答錯時溫和的低沈雙音 (不會過度驚嚇特教生)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

                    {

        ];

        // --- STREAMING_CHUNK: 系統核心狀態變數與初始化 ---
        let currentQuestionIdx = 0; // 當前在第幾題 (0-4)
        let score = 0;              // 目前總得分
        let timerVal = 420;         // 7分鐘計時 (秒)
        let timerInterval = null;
        let isFinished = false;

        // 答題紀錄器：紀錄每題、每步驟的完成狀況與是否曾答錯(錯了不能拿該步的分數，但要能訂正)
        // 結構: scoreRecord[qIndex][stepIndex] = { completed: false, failedOnce: false }
        const scoreRecord = Array.from({ length: 5 }, () =>
            Array.from({ length: 3 }, () => ({ completed: false, failedOnce: false }))
        );

        // 亂序陣列輔助函數 (不影響原始資料)
        function shuffleArray(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        // 初始化頁面
        function initApp() {
            renderNavTabs();
            loadQuestion(0);
            startTimer();
            updateScoreboard();
        }

        // --- STREAMING_CHUNK: 導覽列與進度更新 ---
        function renderNavTabs() {
            const navContainer = document.getElementById('nav-tabs');
            navContainer.innerHTML = '';

            // 新增最左側的單元名稱做為導覽開頭 (配合手機版自適應)
            const label = document.createElement('div');
            label.className = "text-slate-400 font-extrabold text-xs px-2 whitespace-nowrap";
            label.innerText = "⭐ 挑戰進度:";
            navContainer.appendChild(label);

            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `nav-tab-${idx}`;
                btn.className = getTabStyle(idx);
                btn.innerText = q.title;
                btn.onclick = () => {
                    playSound('click');
                    loadQuestion(idx);
                };
                navContainer.appendChild(btn);
            });
        }

        function getTabStyle(idx) {
            const baseStyle = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-200 shadow-sm whitespace-nowrap active:scale-95 ";

            // 判斷該題是否全數步驟皆已完成
            const isQComplete = scoreRecord[idx].every(step => step.completed);

            if (idx === currentQuestionIdx) {
                return baseStyle + "bg-indigo-600 text-white ring-2 ring-indigo-300";
            } else if (isQComplete) {
                return baseStyle + "bg-emerald-100 text-emerald-800 border border-emerald-200 hover:bg-emerald-200";
            } else {
                return baseStyle + "bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200";
            }
        }

        // 更新計分板
        function updateScoreboard() {
            document.getElementById('score-display').innerText = score;
        }

        // --- STREAMING_CHUNK: 天平動態視覺更新邏輯 ---
        function updateBalanceVisual(qIdx, stepIdx, stepCompleted) {
            const q = questionsData[qIdx];
            const beam = document.getElementById('balance-beam');
            const leftText = document.getElementById('balance-left-text');
            const rightText = document.getElementById('balance-right-text');
            const signText = document.getElementById('balance-sign-text');
            const balanceHint = document.getElementById('balance-hint');

            // 預設天平狀態
            let currentAngle = 0;
            let leftVal = "?";
            let rightVal = "?";
            let signVal = "?";

            // 根據答題進度更新物理天平外觀
            if (stepIdx === 0 && !stepCompleted) {
                // 步驟 1 未完成
                currentAngle = 0;
                leftVal = "?";
                rightVal = "?";
                signVal = "?";
                balanceHint.innerText = "先找出主角與比較值，放入天平左右秤盤吧！";
            } else if (stepIdx === 0 && stepCompleted) {
                // 步驟 1 完成 (主角、比較值填妥)
                currentAngle = q.tiltAngle * 0.5; // 微傾斜，引導思考關係符號
                leftVal = q.leftTarget;
                rightVal = q.rightTarget;
                signVal = "?";
                balanceHint.innerText = "很好！主角與比較值已放上秤盤。請判斷中間的關係符號！";
            } else if (stepIdx === 1 && !stepCompleted) {
                // 正在作答步驟 2 (關係符號)
                currentAngle = q.tiltAngle * 0.5;
                leftVal = q.leftTarget;
                rightVal = q.rightTarget;
                signVal = "?";
                balanceHint.innerText = "點擊符號來完成天平！";
            } else if (stepIdx === 1 && stepCompleted) {
                // 步驟 2 完成 (關係符號正確填入)
                currentAngle = q.tiltAngle; // 完整傾斜
                leftVal = q.leftTarget;
                rightVal = q.rightTarget;
                signVal = q.relation;
                balanceHint.innerText = `天平向${q.relation === '>' ? '左側下沉（左邊較重、較大）' : '右側下沉（右邊較重、左邊較小）'}，完全吻合不等關係！`;
            } else {
                // 步驟 3 進行中或已完成
                currentAngle = q.tiltAngle;
                leftVal = q.leftTarget;
                rightVal = q.rightTarget;
                signVal = q.relation;
                balanceHint.innerText = "太棒了！您已成功寫出完美的不等式！";
            }

            // 執行 SVG 旋轉動畫
            beam.style.transform = `rotate(${currentAngle}deg)`;
            leftText.textContent = leftVal;
            rightText.textContent = rightVal;
            signText.textContent = signVal;
        }

        // --- STREAMING_CHUNK: 動態渲染步驟流程 ---
        function loadQuestion(qIdx) {
            currentQuestionIdx = qIdx;

            // 更新導覽列外觀
            renderNavTabs();

            const q = questionsData[qIdx];
            // 更新左側題幹內文
            document.getElementById('question-statement-box').innerHTML = q.statement;

            // 渲染右側步驟流程
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            q.steps.forEach((step, sIdx) => {
                // 判斷步驟的可存取狀態
                const isCompleted = scoreRecord[qIdx][sIdx].completed;
                const isActive = sIdx === 0 || scoreRecord[qIdx][sIdx - 1].completed; // 首步或前一步完成才解鎖

                // 建立步驟容器元件
                const stepCard = document.createElement('div');
                stepCard.id = `step-card-${qIdx}-${sIdx}`;
                stepCard.className = `bg-white rounded-2xl shadow-md border-2 p-6 transition-all duration-300 step-fade-in ${isCompleted
                    ? 'border-emerald-300 bg-emerald-50/20'
                    : isActive
                        ? 'border-indigo-400 ring-2 ring-indigo-100 active'
                        : 'border-slate-100 opacity-60 pointer-events-none filter grayscale'
                    }`;

                // 步驟標題列
                const header = document.createElement('div');
                header.className = "flex items-center justify-between mb-4 pb-2 border-b border-slate-100";
                header.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 text-xs font-extrabold rounded-lg ${isCompleted
                        ? 'bg-emerald-100 text-emerald-800'
                        : isActive
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-200 text-slate-500'
                    }">步驟 ${sIdx + 1}</span>
            <span class="font-bold text-slate-700">${step.desc}</span>
          </div>
          <span class="text-sm font-bold text-emerald-600 flex items-center gap-1">
            ${isCompleted ? '✔ 完成' : isActive ? '⏳ 填寫中...' : '🔒 尚未解鎖'}
          </span>
        `;
                stepCard.appendChild(header);

                // 題目與 Slot (填空槽) 內容
                const contentArea = document.createElement('div');
                contentArea.className = "my-4 text-slate-700 text-lg leading-loose";
                contentArea.innerHTML = step.html;
                stepCard.appendChild(contentArea);

                // 根據填空狀態顯示選項按鈕
                if (isActive && !isCompleted) {
                    // 選項按鈕容器 (打亂排序)
                    const optionsContainer = document.createElement('div');
                    optionsContainer.className = "mt-4 p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-wrap gap-2.5 items-center justify-center";
                    optionsContainer.innerHTML = `<span class="text-xs font-bold text-slate-400 w-full text-center mb-1">📋 點擊下方選項填入藍色框框：</span>`;

                    const shuffledOptions = shuffleArray(step.options);
                    shuffledOptions.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = "px-4 py-2 bg-white hover:bg-slate-100 active:scale-95 text-slate-800 font-extrabold text-lg border border-slate-300 rounded-xl shadow-sm transition hover:border-indigo-400";
                        btn.innerText = opt;
                        btn.onclick = () => fillSlot(opt);
                        optionsContainer.appendChild(btn);
                    });
                    stepCard.appendChild(optionsContainer);

                    // 檢查答案按鈕
                    const checkBtn = document.createElement('button');
                    checkBtn.id = `check-btn-${qIdx}-${sIdx}`;
                    checkBtn.className = "mt-4 w-full bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white font-bold py-3 px-6 rounded-xl transition duration-150 shadow-md shadow-indigo-100 flex items-center justify-center gap-2";
                    checkBtn.innerHTML = `<span>檢查答案</span> <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;
                    checkBtn.onclick = () => checkStepAnswer(qIdx, sIdx);
                    stepCard.appendChild(checkBtn);
                }

                container.appendChild(stepCard);

                // 如果是正活躍中的步驟，做高亮初始化
                if (isActive && !isCompleted) {
                    focusFirstEmptySlot(stepCard);
                }

                // 如果該步驟已填寫完，將正確答案套上已完成樣式
                if (isCompleted) {
                    const slots = stepCard.querySelectorAll('.slot-box');
                    slots.forEach((slot, slotIdx) => {
                        slot.textContent = step.correct[slotIdx];
                        slot.className = "border-2 border-emerald-500 bg-emerald-50 text-emerald-800 rounded-lg px-4 py-2 min-w-[60px] h-[45px] inline-flex items-center justify-center font-black text-xl mx-1";
                    });
                }
            });

            // 根據當前最高未完成步驟，更新天平
            const activeStepIdx = scoreRecord[qIdx].findIndex(step => !step.completed);
            updateBalanceVisual(qIdx, activeStepIdx === -1 ? 2 : activeStepIdx, activeStepIdx === -1);
        }

        // --- STREAMING_CHUNK: 點擊填入與格子點擊清除機制 ---
        function focusFirstEmptySlot(stepCard) {
            const slots = stepCard.querySelectorAll('.slot-box');

            // 清除所有格子的高亮樣式
            slots.forEach(slot => {
                slot.classList.remove('active-slot');
                // 還原基本樣式
                if (!slot.textContent.trim()) {
                    slot.className = "slot-box border-2 border-dashed border-blue-400 bg-blue-50/50 rounded-lg px-4 py-2 min-w-[60px] h-[45px] inline-flex items-center justify-center font-bold text-xl cursor-pointer transition-all duration-200 mx-1";
                } else {
                    slot.className = "slot-box border-2 border-solid border-indigo-400 bg-indigo-50/30 text-indigo-900 rounded-lg px-4 py-2 min-w-[60px] h-[45px] inline-flex items-center justify-center font-bold text-xl cursor-pointer transition-all duration-200 mx-1";
                }
            });

            // 尋找第一個未填寫的格子
            let targetFound = false;
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i].textContent.trim()) {
                    slots[i].classList.add('active-slot');
                    targetFound = true;
                    break;
                }
            }
        }

        // 點擊選項填入空格
        function fillSlot(value) {
            const activeCard = document.querySelector('.step-card-active, .active');
            if (!activeCard) return;

            const activeSlot = activeCard.querySelector('.active-slot');
            if (activeSlot) {
                activeSlot.textContent = value;
                playSound('click');
                focusFirstEmptySlot(activeCard);
            }
        }

        // 點擊已填寫空格清空內容並重新高亮
        document.getElementById('steps-container').addEventListener('click', (e) => {
            if (e.target.classList.contains('slot-box')) {
                const stepCard = e.target.closest('.active');
                // 唯有目前正活躍、未完成的步驟卡片才能點擊清除
                if (!stepCard) return;

                if (e.target.textContent.trim()) {
                    e.target.textContent = '';
                    playSound('clear');
                    focusFirstEmptySlot(stepCard);
                }
            }
        });

        // --- STREAMING_CHUNK: 檢查答案、計分與解鎖流程 ---
        function checkStepAnswer(qIdx, sIdx) {
            const stepCard = document.getElementById(`step-card-${qIdx}-${sIdx}`);
            const stepData = questionsData[qIdx].steps[sIdx];
            const slots = stepCard.querySelectorAll('.slot-box');

            // 1. 防呆檢查：是否有空格未填
            let hasEmpty = false;
            const userAnswers = [];
            slots.forEach(slot => {
                const text = slot.textContent.trim();
                userAnswers.push(text);
                if (!text) hasEmpty = true;
            });

            if (hasEmpty) {
                showToast("⚠️ 請填滿所有空格！", "bg-amber-500");
                playSound('incorrect');
                // 卡片抖動
                stepCard.classList.add('error-shake');
                setTimeout(() => stepCard.classList.remove('error-shake'), 400);
                return;
            }

            // 2. 對答案
            let isCorrect = true;
            for (let i = 0; i < stepData.correct.length; i++) {
                if (userAnswers[i] !== stepData.correct[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                // 答對處理
                scoreRecord[qIdx][sIdx].completed = true;

                // 判斷是否是一次作答就對（不曾錯過才有分）
                if (!scoreRecord[qIdx][sIdx].failedOnce) {
                    score += 1;
                }

                playSound('correct');
                showToast("🌟 太棒了！答對囉！", "bg-emerald-500");
                createConfetti();
                updateScoreboard();

                // 刷新當前題目頁面
                loadQuestion(qIdx);

                // 平滑滾動至下一步，或者切換至下一題
                setTimeout(() => {
                    if (sIdx < 2) {
                        // 解鎖當前題目下一個步驟
                        const nextCard = document.getElementById(`step-card-${qIdx}-${sIdx + 1}`);
                        if (nextCard) {
                            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        // 步驟三（全題完成）
                        handleQuestionComplete(qIdx);
                    }
                }, 1000);

            } else {
                // 答錯處理（錯一次就不能拿分了，但要他繼續訂正到對）
                scoreRecord[qIdx][sIdx].failedOnce = true;
                playSound('incorrect');
                showToast("❌ 再想想看喔！加油！", "bg-rose-500");

                // 插入或更新卡片下方的錯誤引導文字，而不清除格子
                let hintMsg = stepCard.querySelector('.error-hint-msg');
                if (!hintMsg) {
                    hintMsg = document.createElement('div');
                    hintMsg.className = "error-hint-msg text-sm text-rose-500 font-bold mt-2 text-center animate-bounce";
                    stepCard.appendChild(hintMsg);
                }
                hintMsg.innerText = "💡 答案不對喔！你可以點選格子清空，再重新挑戰！";

                // 卡片抖動
                stepCard.classList.add('error-shake');
                setTimeout(() => stepCard.classList.remove('error-shake'), 400);
            }
        }

        // 處理當前大題全部完成
        function handleQuestionComplete(qIdx) {
            renderNavTabs(); // 更新題號分頁顏色 (變成綠色代表完成)

            // 檢查是否全部五題都作答完成
            const allDone = scoreRecord.every(q => q.every(step => step.completed));

            if (allDone) {
                finishGame(true); // 完美通關
            } else {
                // 還有題目未完，引導前往
                let nextUnsolved = scoreRecord.findIndex(q => !q.every(step => step.completed));
                if (nextUnsolved !== -1) {
                    showToast(`🎉 第 ${qIdx + 1} 題完成！2秒後自動跳轉至第 ${nextUnsolved + 1} 題...`, "bg-indigo-600");
                    setTimeout(() => {
                        loadQuestion(nextUnsolved);
                    }, 2000);
                }
            }
        }

        // --- STREAMING_CHUNK: 計時器功能設計 ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerVal > 0 && !isFinished) {
                    timerVal--;
                    updateTimerDisplay();
                } else if (timerVal <= 0) {
                    clearInterval(timerInterval);
                    finishGame(false); // 時間到
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerVal / 60);
            const seconds = timerVal % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = display;

            if (timerVal <= 60) {
                timerEl.parentElement.classList.add('animate-pulse', 'bg-rose-100', 'border-rose-300', 'text-rose-800');
                timerEl.parentElement.classList.remove('bg-amber-50', 'border-amber-200', 'text-amber-800');
            } else {
                timerEl.parentElement.classList.remove('animate-pulse', 'bg-rose-100', 'border-rose-300', 'text-rose-800');
                timerEl.parentElement.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
            }
        }

        // 結束挑戰 (時間到 或 完美全對)
        function finishGame(perfect) {
            isFinished = true;
            clearInterval(timerInterval);

            const modal = document.getElementById('finish-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const scoreEl = document.getElementById('modal-final-score');
            const timeEl = document.getElementById('modal-time-spent');

            // 計算花費時間
            const elapsed = 420 - timerVal;
            const min = Math.floor(elapsed / 60);
            const sec = elapsed % 60;
            timeEl.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            scoreEl.innerText = `${score} / 15`;

            if (perfect) {
                title.innerText = "🎉 恭喜！完美全數過關";
                desc.innerText = "太厲害了！你用驚人的數理邏輯與專注力拼出了所有的不等式，是今天的不等式天平大師！";
                // 大放煙火
                for (let i = 0; i < 5; i++) {
                    setTimeout(createConfetti, i * 400);
                }
            } else {
                title.innerText = "⏳ 挑戰時間結束！";
                desc.innerText = "時間到了喔，沒關係，你已經做得很好了！多練習幾次，你一定能列得更順手！";
            }

            modal.classList.remove('pointer-events-none');
            modal.classList.add('opacity-100');
        }

        // --- STREAMING_CHUNK: 視窗回饋控制、Toast 與煙火 Canvas ---
        // Toast 浮動提醒
        function showToast(message, bgColor) {
            const toast = document.getElementById('toast-message');
            const text = document.getElementById('toast-text');

            toast.className = `fixed bottom-6 right-6 transform transition-all duration-300 z-50 flex items-center gap-2 px-5 py-3 rounded-2xl shadow-2xl font-bold text-white text-base ${bgColor}`;
            text.innerText = message;

            // 浮入
            toast.classList.remove('translate-y-20', 'opacity-0');

            setTimeout(() => {
                // 浮出
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 再做一次 重設所有狀態
        document.getElementById('btn-restart').onclick = () => {
            playSound('click');
            score = 0;
            timerVal = 420;
            isFinished = false;

            // 重設紀錄
            for (let q = 0; q < 5; q++) {
                for (let s = 0; s < 3; s++) {
                    scoreRecord[q][s].completed = false;
                    scoreRecord[q][s].failedOnce = false;
                }
            }

            // 關閉視窗
            closeModal();
            initApp();
        };

        // 關閉視窗 (保留現有結果)
        document.getElementById('btn-close-modal').onclick = closeModal;

        function closeModal() {
            playSound('click');
            const modal = document.getElementById('finish-modal');
            modal.classList.add('pointer-events-none');
            modal.classList.remove('opacity-100');
        }

        // --- STREAMING_CHUNK: 極簡 Canvas 煙火/紙屑動畫 ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * -10 - 4;
                this.gravity = 0.3;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.alpha = 1;
            }
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createConfetti() {
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight;
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(startX + (Math.random() * 100 - 50), startY));
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // 啟動教具網頁
        window.onload = function () {
            initApp();
        }
    </script>
</body>

</html>
