<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比值的比較大小 (通分加強版) - 點擊填入</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* 數學算式穩定呈現，不跳動 */
        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 80px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            margin: 0 4px;
        }

        .fraction span:first-child {
            border-bottom: 3px solid #334155;
            padding: 0 8px;
            min-width: 50px;
            text-align: center;
        }

        .fraction span:last-child {
            padding: 0 8px;
            min-width: 50px;
            text-align: center;
        }

        /* 填答格 - 穩定樣式 */
        .slot {
            display: inline-block;
            width: 55px;
            height: 52px;
            border: 2px solid #e2e8f0;
            border-bottom: 4px solid #94a3b8;
            margin: 0 2px;
            text-align: center;
            vertical-align: middle;
            font-size: 28px;
            color: #1e40af;
            cursor: pointer;
            border-radius: 8px;
            background-color: white;
            line-height: 50px;
        }

        .slot.filled {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #166534;
        }

        .slot-long {
            width: 150px;
        }

        /* 動畫僅用於新步驟解鎖 */
        .step-unlock {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-btn:disabled {
            opacity: 0.3;
            background-color: #f1f5f9 !important;
            color: #94a3b8 !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b border-blue-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4 overflow-x-auto no-scrollbar py-1">
                <span class="font-black text-blue-700 whitespace-nowrap bg-blue-50 px-3 py-1 rounded-lg">單元三：比較大小
                    (通分版)</span>
                <div id="nav-tabs" class="flex space-x-2">
                    <!-- JS 動態生成 -->
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-lg font-bold text-orange-600">⏱️ <span id="timer">07:00</span></div>
                <div class="text-xl font-black text-blue-700 bg-blue-50 px-4 py-1 rounded-full">得分: <span
                        id="score">0</span></div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full p-4 gap-6">

        <!-- 左側：題目區 (Sticky) -->
        <div class="w-full md:w-1/3">
            <div class="bg-white rounded-3xl shadow-xl p-8 sticky md:top-24 border border-blue-50">
                <h2 id="q-title" class="text-2xl font-black mb-4 text-blue-800 border-l-8 border-blue-500 pl-4">載入中...
                </h2>
                <div id="q-content" class="text-2xl leading-relaxed text-slate-700 font-medium">
                    <!-- 內容 -->
                </div>
                <div id="q-math-hint" class="mt-8 p-6 bg-blue-50 rounded-2xl border-2 border-blue-100">
                    <p class="text-blue-800 font-bold mb-2">💡 學習小撇步：</p>
                    <p class="text-blue-600">分母不同時，我們要先變成「一樣的分母」才好比較喔！</p>
                </div>
            </div>
        </div>

        <!-- 右側：步驟區 -->
        <div class="w-full md:w-2/3 space-y-6" id="steps-container">
            <!-- 步驟內容 -->
        </div>

    </main>

    <!-- 完成彈窗 -->
    <div id="finish-modal"
        class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-12 max-w-md w-full text-center shadow-2xl border-b-8 border-blue-500">
            <div class="text-7xl mb-6">🎯</div>
            <h3 class="text-3xl font-black text-slate-800 mb-2">太棒了！</h3>
            <p class="text-slate-500 mb-8 text-xl">你成功學會了用「通分」來比較大小！</p>
            <button onclick="location.reload()"
                class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-2xl shadow-lg hover:bg-blue-700 transition-all">再玩一次</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "題目 1：打擊率比較",
                content: "恰恰打擊 <mark class='bg-blue-100'>24</mark> 次，安打 <mark class='bg-pink-100'>16</mark> 支；<br>智勝打擊 <mark class='bg-green-100'>18</mark> 次，安打 <mark class='bg-pink-100'>12</mark> 支。<br>誰的打擊率高？",
                steps: [
                    { desc: "寫出恰恰的比值：", type: "frac", ans: ["16", "24"], options: ["16", "24", "12", "18"] },
                    { desc: "寫出智勝的比值：", type: "frac", ans: ["12", "18"], options: ["16", "24", "12", "18"] },
                    { desc: "將兩人約分（都變成最簡單的分數）：", type: "compare_frac", ans: ["2", "3", "2", "3"], options: ["2", "3", "4", "6"], label1: "恰恰", label2: "智勝" },
                    { desc: "所以兩人的打擊率：", type: "text", ans: ["一樣高"], options: ["恰恰", "智勝", "一樣高"] }
                ]
            },
            {
                id: 2,
                title: "題目 2：命中率比較",
                content: "紅隊出手 <mark class='bg-red-100'>30</mark> 次，進球 <mark class='bg-blue-100'>20</mark> 次；<br>白隊出手 <mark class='bg-slate-100'>18</mark> 次，進球 <mark class='bg-green-100'>10</mark> 次。<br>誰比較準？",
                steps: [
                    { desc: "寫出紅隊的比值：", type: "frac", ans: ["20", "30"], options: ["20", "30", "10", "18"] },
                    { desc: "寫出白隊的比值：", type: "frac", ans: ["10", "18"], options: ["20", "30", "10", "18"] },
                    { desc: "通分（分母都變成 90）：", type: "compare_frac", ans: ["60", "90", "50", "90"], options: ["60", "90", "50", "18"], label1: "紅隊", label2: "白隊" },
                    { desc: "分子 60 比 50 大，所以：", type: "text", ans: ["紅隊"], options: ["紅隊", "白隊", "一樣準"] }
                ]
            },
            {
                id: 3,
                title: "題目 3：銷售速度",
                content: "甲店 <mark class='bg-blue-100'>30</mark> 分賣出 <mark class='bg-pink-100'>200</mark> 個；<br>乙店 <mark class='bg-green-100'>40</mark> 分賣出 <mark class='bg-pink-100'>250</mark> 個。<br>誰比較快？",
                steps: [
                    { desc: "寫出甲店比值：", type: "frac", ans: ["200", "30"], options: ["200", "30", "250", "40"] },
                    { desc: "寫出乙店比值：", type: "frac", ans: ["250", "40"], options: ["200", "30", "250", "40"] },
                    { desc: "通分（分母都變成 120）：", type: "compare_frac", ans: ["800", "120", "750", "120"], options: ["800", "120", "750", "40"], label1: "甲店", label2: "乙店" },
                    { desc: "比較分子後發現：", type: "text", ans: ["甲店"], options: ["甲店", "乙店", "一樣快"] }
                ]
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let timeLeft = 420;
        let timerInterval;
        let gameState = {};

        function init() {
            const tabs = document.getElementById('nav-tabs');
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.id = `tab-${i}`;
                btn.className = `px-4 py-2 rounded-xl font-bold whitespace-nowrap transition-all ${i === 0 ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200'}`;
                btn.textContent = `題目 ${i + 1}`;
                btn.onclick = () => switchTab(i);
                tabs.appendChild(btn);
                gameState[i] = { step: 0, done: false, inputs: {}, attemptCounts: {} };
            });
            render();
            startTimer();
        }

        function switchTab(i) {
            currentIdx = i;
            questions.forEach((_, idx) => {
                document.getElementById(`tab-${idx}`).className = idx === i
                    ? "px-4 py-2 rounded-xl bg-blue-600 text-white font-bold whitespace-nowrap shadow-md"
                    : "px-4 py-2 rounded-xl bg-white text-slate-500 font-bold whitespace-nowrap border border-slate-200";
            });
            render();
        }

        function render() {
            const q = questions[currentIdx];
            const s = gameState[currentIdx];
            document.getElementById('q-title').textContent = q.title;
            document.getElementById('q-content').innerHTML = q.content;

            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            q.steps.forEach((step, sIdx) => {
                if (sIdx > s.step) return;
                const isNew = (sIdx === s.step && !s.done);
                const isDone = sIdx < s.step || (s.done && sIdx === q.steps.length - 1);

                const div = document.createElement('div');
                // 只有最新解鎖的步驟有動畫
                div.className = `bg-white rounded-[2rem] p-8 shadow-sm border-2 ${isDone ? 'border-green-100 bg-green-50/20' : 'border-blue-400'} ${isNew ? 'step-unlock' : ''}`;

                div.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-black text-blue-500 uppercase tracking-widest">Step ${sIdx + 1} ${isDone ? '✔' : ''}</span>
                    </div>
                    <p class="text-2xl font-black mb-6 text-slate-800">${step.desc}</p>
                    <div class="flex justify-center mb-8">${renderInputs(step, sIdx, isDone)}</div>
                    ${!isDone ? renderOptions(step, sIdx) : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderInputs(step, sIdx, isDone) {
            const data = gameState[currentIdx].inputs;
            if (step.type === "frac") {
                const n = data[`${sIdx}-0`] || '';
                const d = data[`${sIdx}-1`] || '';
                return `
                    <div class="math">
                        <div class="fraction">
                            <span class="slot ${n ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},0)">${n}</span>
                            <span class="slot ${d ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},1)">${d}</span>
                        </div>
                    </div>
                `;
            } else if (step.type === "compare_frac") {
                const n1 = data[`${sIdx}-0`] || '';
                const d1 = data[`${sIdx}-1`] || '';
                const n2 = data[`${sIdx}-2`] || '';
                const d2 = data[`${sIdx}-3`] || '';
                return `
                    <div class="flex flex-col md:flex-row items-center gap-8">
                        <div class="flex items-center">
                            <span class="text-lg font-bold text-slate-400 mr-2">${step.label1}</span>
                            <div class="fraction">
                                <span class="slot ${n1 ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},0)">${n1}</span>
                                <span class="slot ${d1 ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},1)">${d1}</span>
                            </div>
                        </div>
                        <div class="text-4xl text-slate-300">...</div>
                        <div class="flex items-center">
                            <span class="text-lg font-bold text-slate-400 mr-2">${step.label2}</span>
                            <div class="fraction">
                                <span class="slot ${n2 ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},2)">${n2}</span>
                                <span class="slot ${d2 ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},3)">${d2}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const val = data[`${sIdx}-0`] || '';
                return `<div class="slot slot-long ${val ? 'filled' : ''} ${isDone ? 'correct' : ''}" onclick="clearInput(${sIdx},0)">${val}</div>`;
            }
        }

        function renderOptions(step, sIdx) {
            return `
                <div class="grid grid-cols-4 gap-3 mb-6">
                    ${step.options.map(opt => `
                        <button onclick="fill('${opt}', ${sIdx})" id="btn-${sIdx}-${opt}"
                                class="option-btn py-4 rounded-2xl bg-white text-blue-700 font-black text-2xl border-4 border-blue-50 hover:bg-blue-50 transition-all">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <button onclick="check(${sIdx})" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-2xl shadow-xl hover:bg-blue-700 active:scale-95 transition-all">檢查答案</button>
            `;
        }

        window.fill = (val, sIdx) => {
            const s = gameState[currentIdx];
            const step = questions[currentIdx].steps[sIdx];
            const slots = (step.type === "compare_frac") ? 4 : (step.type === "frac" ? 2 : 1);

            for (let i = 0; i < slots; i++) {
                if (!s.inputs[`${sIdx}-${i}`]) {
                    s.inputs[`${sIdx}-${i}`] = val;
                    render(); // 重新渲染時不帶動畫
                    return;
                }
            }
        };

        window.clearInput = (sIdx, i) => {
            const s = gameState[currentIdx];
            if (!s.done && s.step === sIdx) {
                delete s.inputs[`${sIdx}-${i}`];
                render();
            }
        };

        window.check = (sIdx) => {
            const s = gameState[currentIdx];
            const step = questions[currentIdx].steps[sIdx];
            const slots = (step.type === "compare_frac") ? 4 : (step.type === "frac" ? 2 : 1);
            const user = [];
            for (let i = 0; i < slots; i++) user.push(s.inputs[`${sIdx}-${i}`]);

            if (user.includes(undefined)) return showToast("請先填滿格子喔！");

            const isCorrect = user.every((v, i) => v === step.ans[i]);

            // 初始化該步驟的嘗試次數
            if (s.attemptCounts[sIdx] === undefined) s.attemptCounts[sIdx] = 0;

            if (isCorrect) {
                // 只有第一次就答對才加分
                if (s.attemptCounts[sIdx] === 0) {
                    score += 1;
                    document.getElementById('score').textContent = score;
                }

                if (sIdx < questions[currentIdx].steps.length - 1) {
                    s.step++;
                } else {
                    s.done = true;
                }
                render(); // 這裡解鎖新步驟會觸發 CSS 動畫
                if (s.done) checkAll();
            } else {
                s.attemptCounts[sIdx]++; // 增加錯誤嘗試次數
                showToast("再試一次看看！確認分子跟分母的位置。");
            }
        };

        function checkAll() {
            if (Object.values(gameState).every(g => g.done)) {
                setTimeout(() => document.getElementById('finish-modal').classList.remove('hidden'), 500);
            } else {
                showToast("答對了！可以挑戰下一題。");
            }
        }

        function showToast(m) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = "toast fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-4 rounded-2xl shadow-2xl z-[200] font-bold animate-bounce";
            t.textContent = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        init();
    </script>
</body>

</html>
