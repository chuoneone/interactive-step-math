<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒狀圖繪製練習</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f1f5f9;
        }

        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 54px;
            height: 44px;
            border-bottom: 3px solid #cbd5e1;
            margin: 0 4px;
            cursor: pointer;
            font-weight: 700;
            color: #1e40af;
            background: #f8fafc;
            border-radius: 4px 4px 0 0;
            padding: 0 10px;
            font-size: 18px;
            transition: all .2s;
        }

        .slot.filled {
            border-bottom-color: #3b82f6;
            background: #eff6ff;
        }

        .slot.correct {
            border-bottom-color: #22c55e;
            color: #15803d;
            background: #f0fdf4;
            pointer-events: none;
        }

        .slot.wrong {
            border-bottom-color: #ef4444;
            color: #dc2626;
            background: #fef2f2;
        }

        .step-card {
            opacity: .4;
            pointer-events: none;
            transform: translateY(10px);
            transition: all .4s ease;
        }

        .step-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .step-card.completed {
            opacity: 1;
            border-left: 6px solid #22c55e;
        }

        .opt-btn {
            transition: all .15s;
            font-weight: 700;
            font-size: 16px;
        }

        .opt-btn:active {
            transform: scale(.95);
        }

        .opt-btn.used {
            opacity: .25;
            pointer-events: none;
        }

        /* Box plot SVG styles */
        .bp-zone {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
        }

        .bp-slot {
            cursor: pointer;
            transition: all .2s;
            fill: #eff6ff;
            stroke: #93c5fd;
            stroke-width: 2;
        }

        .bp-slot:hover {
            fill: #dbeafe;
            stroke: #3b82f6;
        }

        .bp-slot.bp-filled {
            fill: #dcfce7;
            stroke: #22c55e;
            stroke-width: 2.5;
        }

        .bp-slot.bp-correct {
            fill: #bbf7d0;
            stroke: #16a34a;
            stroke-width: 3;
            pointer-events: none;
        }

        .bp-slot.bp-wrong {
            fill: #fee2e2;
            stroke: #ef4444;
            stroke-width: 2.5;
        }

        @keyframes tada {

            0%,
            100% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(.92) rotate(-2deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.06) rotate(2deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.06) rotate(-2deg);
            }
        }

        @keyframes score-pop {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
                color: #f59e0b;
            }
        }

        .animate-tada {
            animation: tada .6s ease-in-out;
        }

        .animate-score {
            animation: score-pop .5s ease-out;
        }

        .nav-active {
            background: #3b82f6 !important;
            color: #fff !important;
            border-color: #2563eb !important;
        }

        .custom-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Start / record modal */
        .modal-backdrop {
            background: rgba(15, 23, 42, .65);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- ====== 頂部 ====== -->
    <header class="bg-white sticky top-0 z-30 border-b shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
            <div id="nav-container" class="flex gap-2 overflow-x-auto custom-scroll py-1 flex-grow"></div>
            <div class="flex items-center gap-3 ml-2 shrink-0">
                <div id="timer-box"
                    class="hidden items-center gap-1 bg-sky-50 border border-sky-200 rounded-full px-3 py-1">
                    <span class="text-sky-600 text-xs font-bold">⏱</span>
                    <span id="timer-val" class="text-sky-700 font-black text-sm min-w-[38px] text-center">7:00</span>
                </div>
                <div class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-full px-4 py-1">
                    <span class="text-amber-600 text-xs font-bold uppercase">Score</span>
                    <span id="score-val" class="text-xl font-black text-amber-700 min-w-[40px] text-center">0</span>
                </div>
                <button onclick="showLeaderboard()"
                    class="text-xs bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-full px-3 py-1 font-bold hover:bg-indigo-200 transition">排行榜</button>
            </div>
        </div>
    </header>

    <!-- ====== 主體 ====== -->
    <main class="flex-grow flex flex-col md:flex-row max-w-5xl mx-auto w-full gap-0">

        <!-- 左：題目資料 -->
        <aside id="prob-sidebar" class="w-full md:w-80 shrink-0 p-4 md:sticky md:top-14 h-fit">
            <div class="bg-white rounded-2xl shadow border border-slate-100 p-5">
                <div class="flex items-center gap-2 mb-3">
                    <span id="prob-label" class="text-xs font-bold bg-blue-600 text-white px-2 py-0.5 rounded-full">題目
                        1</span>
                    <span id="prob-level" class="text-xs text-slate-400 font-bold"></span>
                </div>
                <p class="text-sm text-slate-500 mb-2">資料（由小到大排列）：</p>
                <div id="prob-data" class="flex flex-wrap gap-1.5 text-base font-bold text-slate-700 mb-4"></div>
                <div class="bg-purple-50 border border-purple-100 rounded-xl p-3 text-sm space-y-2">
                    <p class="font-bold text-purple-700 mb-1">📋 五數摘要</p>
                    <div class="grid grid-cols-1 gap-1 text-slate-700">
                        <div class="flex justify-between"><span class="text-slate-500">最小值</span><span id="five-min"
                                class="font-black text-purple-600">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Q1（下四分位）</span><span id="five-q1"
                                class="font-black text-purple-600">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">中位數</span><span id="five-med"
                                class="font-black text-purple-600">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Q3（上四分位）</span><span id="five-q3"
                                class="font-black text-purple-600">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">最大值</span><span id="five-max"
                                class="font-black text-purple-600">—</span></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右：步驟 -->
        <section class="flex-grow p-4 pb-32 space-y-6" id="steps-container"></section>
    </main>

    <!-- ====== 完成 Modal ====== -->
    <div id="modal-done" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <div class="text-5xl mb-3">🎉</div>
            <h3 class="text-2xl font-bold text-slate-800 mb-1">完成！</h3>
            <p id="done-msg" class="text-slate-500 mb-6">這題盒狀圖畫好了！</p>
            <div class="flex gap-3">
                <button onclick="resetProblem()"
                    class="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">再做一次</button>
                <button onclick="closeModal('modal-done')"
                    class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">下一題</button>
            </div>
        </div>
    </div>

    <!-- ====== 開始 Modal ====== -->
    <div id="modal-start" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <div class="text-5xl mb-3">📦</div>
            <h3 class="text-2xl font-bold text-slate-800 mb-1">盒狀圖繪製練習</h3>
            <p class="text-slate-500 text-sm mb-5">輸入名字，挑戰 7 分鐘計時賽！</p>
            <input id="player-name" type="text" placeholder="你的名字" maxlength="10"
                class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-center font-bold text-lg mb-4 focus:border-blue-400 outline-none">
            <button onclick="startGame()"
                class="w-full py-4 bg-blue-600 text-white font-bold text-lg rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition">開始挑戰！</button>
        </div>
    </div>

    <!-- ====== 排行榜 Modal ====== -->
    <div id="modal-lb" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold text-slate-800 mb-4 text-center">🏆 排行榜</h3>
            <div id="lb-list" class="space-y-2 mb-6 max-h-72 overflow-y-auto custom-scroll"></div>
            <button onclick="closeModal('modal-lb')"
                class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">關閉</button>
        </div>
    </div>

    <!-- ====== 結算 Modal ====== -->
    <div id="modal-end" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <div class="text-5xl mb-3" id="end-emoji">⏰</div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">時間到！</h3>
            <p class="text-slate-500 mb-2">完成 <span id="end-done" class="font-bold text-blue-600"></span> 題</p>
            <p class="text-3xl font-black text-amber-500 mb-6"><span id="end-score"></span> 分</p>
            <button onclick="closeModal('modal-end'); showLeaderboard();"
                class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">查看排行榜</button>
        </div>
    </div>

    <!-- ====== Toast ====== -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800 text-white rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none z-50 text-sm font-bold">
    </div>

    <script>
        const LB_KEY = 'math_leaderboard_G9_boxplot';
        const TIMER_SECONDS = 420;

        // ============ 題目資料 ============
        const problems = [
            {
                id: 1, level: '☆ Level 1',
                data: [2, 5, 7, 9, 12, 14, 18],
                five: { min: 2, q1: 5, med: 9, q3: 14, max: 18 },
                range: [0, 20], scale: 2,
                hint: '共 7 筆 → 中位數第 4 筆，Q1 第 2 筆，Q3 第 6 筆'
            },
            {
                id: 2, level: '☆ Level 1',
                data: [3, 6, 8, 10, 13, 15, 20],
                five: { min: 3, q1: 6, med: 10, q3: 15, max: 20 },
                range: [0, 22], scale: 2,
                hint: '共 7 筆 → 中位數第 4 筆，Q1 第 2 筆，Q3 第 6 筆'
            },
            {
                id: 3, level: '★ Level 2',
                data: [4, 7, 9, 11, 13, 16, 18, 22],
                five: { min: 4, q1: 8, med: 12, q3: 17, max: 22 },
                range: [0, 25], scale: 2,
                hint: '共 8 筆（偶數）→ Q1=(7+9)÷2=8，Median=(11+13)÷2=12，Q3=(16+18)÷2=17'
            },
            {
                id: 4, level: '★ Level 2',
                data: [5, 10, 15, 20, 25, 30, 35, 40],
                five: { min: 5, q1: 12.5, med: 22.5, q3: 32.5, max: 40 },
                range: [0, 45], scale: 5,
                hint: '共 8 筆 → Q1=(10+15)÷2=12.5，Median=(20+25)÷2=22.5，Q3=(30+35)÷2=32.5'
            },
            {
                id: 5, level: '★★ Level 3',
                data: [12, 18, 21, 25, 28, 31, 35, 39, 44],
                five: { min: 12, q1: 21, med: 28, q3: 35, max: 44 },
                range: [10, 50], scale: 5,
                hint: '共 9 筆 → 中位數第 5 筆=28，Q1 左半第 2 筆=21，Q3 右半第 2 筆=35'
            },
            {
                id: 6, level: '★★ Level 3',
                data: [15, 22, 27, 31, 36, 41, 46, 50, 55, 60],
                five: { min: 15, q1: 29, med: 38.5, q3: 48, max: 60 },
                range: [10, 65], scale: 5,
                hint: '共 10 筆 → Q1=(27+31)÷2=29，Median=(36+41)÷2=38.5，Q3=(46+50)÷2=48'
            }
        ];

        // ============ 狀態 ============
        let currentIdx = 0;
        let activeStep = 0;
        let totalScore = 0;
        let solvedCount = 0;
        let timeLeft = TIMER_SECONDS;
        let timerInterval = null;
        let playerName = '';
        let selectedBpSlot = null; // for box plot step

        // ============ 開始遊戲 ============
        function startGame() {
            const inp = document.getElementById('player-name');
            playerName = inp.value.trim() || '匿名';
            closeModal('modal-start');
            document.getElementById('timer-box').classList.remove('hidden');
            document.getElementById('timer-box').classList.add('flex');
            startTimer();
            renderNav();
            switchProblem(0);
        }

        function startTimer() {
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-val').textContent = `${m}:${s.toString().padStart(2, '0')}`;
            if (timeLeft <= 60) document.getElementById('timer-val').classList.add('text-red-600');
        }

        function endGame() {
            const finalScore = solvedCount * 1000 + timeLeft;
            totalScore = finalScore;
            saveRecord(playerName, solvedCount, timeLeft, finalScore);
            document.getElementById('end-emoji').textContent = solvedCount >= 4 ? '🏆' : '⏰';
            document.getElementById('end-done').textContent = solvedCount;
            document.getElementById('end-score').textContent = finalScore;
            document.getElementById('modal-end').classList.remove('hidden');
        }

        // ============ 排行榜 ============
        function saveRecord(name, done, remain, score) {
            let lb = JSON.parse(localStorage.getItem(LB_KEY) || '[]');
            lb.push({ name, done, remain, score, date: new Date().toLocaleDateString('zh-TW') });
            lb.sort((a, b) => b.score - a.score);
            lb = lb.slice(0, 10);
            localStorage.setItem(LB_KEY, JSON.stringify(lb));
        }

        function showLeaderboard() {
            const lb = JSON.parse(localStorage.getItem(LB_KEY) || '[]');
            const list = document.getElementById('lb-list');
            if (!lb.length) { list.innerHTML = '<p class="text-center text-slate-400 py-4">尚無紀錄</p>'; }
            else {
                list.innerHTML = lb.map((r, i) => `
            <div class="flex items-center justify-between px-4 py-3 rounded-xl ${i === 0 ? 'bg-amber-50 border-2 border-amber-300' : 'bg-slate-50 border border-slate-200'}">
                <div class="flex items-center gap-3">
                    <span class="font-black text-lg ${i === 0 ? 'text-amber-500' : 'text-slate-400'}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`}</span>
                    <div><p class="font-bold text-slate-700">${r.name}</p><p class="text-xs text-slate-400">${r.date} · 完成 ${r.done} 題</p></div>
                </div>
                <span class="font-black text-amber-600 text-xl">${r.score}</span>
            </div>`).join('');
            }
            document.getElementById('modal-lb').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if (id === 'modal-done' && currentIdx < problems.length - 1) {
                switchProblem(currentIdx + 1);
            }
        }

        // ============ 導覽列 ============
        function renderNav() {
            const c = document.getElementById('nav-container');
            c.innerHTML = problems.map((p, i) => `
        <button onclick="switchProblem(${i})" id="nav-btn-${i}"
            class="px-4 py-1.5 rounded-full border-2 bg-white text-slate-500 font-bold hover:border-blue-400 transition-all whitespace-nowrap text-sm">
            題目 ${p.id}
        </button>`).join('');
        }

        function switchProblem(idx) {
            currentIdx = idx;
            activeStep = 0;
            selectedBpSlot = null;
            document.querySelectorAll('[id^="nav-btn-"]').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`nav-btn-${idx}`)?.classList.add('nav-active');
            loadProblem(idx);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============ 載入題目 ============
        function loadProblem(idx) {
            const p = problems[idx];
            document.getElementById('prob-label').textContent = `題目 ${p.id}`;
            document.getElementById('prob-level').textContent = p.level;

            // 資料顯示
            const dp = document.getElementById('prob-data');
            dp.innerHTML = p.data.map(v => `<span class="px-3 py-1.5 bg-blue-50 border-2 border-blue-200 rounded-xl text-blue-700">${v}</span>`).join('');

            // 直接顯示五數摘要
            document.getElementById('five-min').textContent = p.five.min;
            document.getElementById('five-q1').textContent = p.five.q1;
            document.getElementById('five-med').textContent = p.five.med;
            document.getElementById('five-q3').textContent = p.five.q3;
            document.getElementById('five-max').textContent = p.five.max;

            renderSteps(p);
        }

        // ============ 渲染步驟（只有盒狀圖）============
        function renderSteps(p) {
            const container = document.getElementById('steps-container');
            const opts = [p.five.min, p.five.q1, p.five.med, p.five.q3, p.five.max].map(String).sort(() => Math.random() - 0.5);

            container.innerHTML = `
    <div id="step-1" class="step-card bg-white rounded-3xl shadow border-2 border-slate-200 border-l-4 p-6 active">
        <div class="flex items-center gap-3 mb-4">
            <span class="w-8 h-8 rounded-xl bg-purple-100 text-purple-600 font-black flex items-center justify-center">📦</span>
            <h3 class="font-bold text-slate-800 text-lg">點選左側數值，填入盒狀圖各位置</h3>
            <span id="check-1" class="hidden text-green-500 text-sm font-bold">✔ 完成</span>
        </div>
        <p class="text-xs text-slate-400 mb-4 bg-slate-50 p-3 rounded-xl">先點選下方數值按鈕（反白），再點擊圖中對應的空格（?）填入。點錯的格子可以重新點擊覆蓋。</p>

        <div id="opts-1" class="flex flex-wrap gap-2 justify-center mb-5">
            ${opts.map(v => `<button onclick="selectBpOpt(this,'${v}')" class="opt-btn px-5 py-2.5 bg-white border-2 border-slate-200 rounded-2xl hover:border-purple-400 hover:bg-purple-50 shadow-sm text-purple-700" data-val="${v}">${v}</button>`).join('')}
        </div>

        <div class="bp-zone p-4 overflow-x-auto">
            <svg id="bp-svg" width="520" height="180" viewBox="0 0 520 180" class="w-full max-w-full">
                <line x1="40" y1="130" x2="490" y2="130" stroke="#94a3b8" stroke-width="2"/>
                <g id="bp-ticks"></g>
                <g id="bp-elements"></g>
                <g id="bp-labels"></g>
            </svg>
        </div>

        <button onclick="checkStep2()" class="w-full mt-4 py-4 bg-slate-800 text-white font-bold rounded-2xl hover:bg-purple-600 transition flex items-center justify-center gap-2">
            <span>檢查盒狀圖</span><span class="text-xs bg-white/20 px-2 py-0.5 rounded">+30 分</span>
        </button>
    </div>`;

            drawBoxPlot(p);
        }

        // (Step 1 removed – five-number summary is shown directly in sidebar)

        // ============ Step 2 Box Plot SVG ============
        const SVG_LEFT = 40, SVG_RIGHT = 490, SVG_Y = 90, SVG_H = 50;
        let bpData = {}; // { min, q1, med, q3, max, posMin, posQ1, posMed, posQ3, posMax }

        function drawBoxPlot(p) {
            const totalRange = p.range[1] - p.range[0];
            const drawW = SVG_RIGHT - SVG_LEFT;

            function toX(v) {
                return SVG_LEFT + (v - p.range[0]) / totalRange * drawW;
            }

            const posMin = toX(p.five.min);
            const posQ1 = toX(p.five.q1);
            const posMed = toX(p.five.med);
            const posQ3 = toX(p.five.q3);
            const posMax = toX(p.five.max);

            bpData = {
                posMin, posQ1, posMed, posQ3, posMax,
                min: p.five.min, q1: p.five.q1, med: p.five.med, q3: p.five.q3, max: p.five.max
            };

            // Ticks
            const ticksG = document.getElementById('bp-ticks');
            ticksG.innerHTML = '';
            const step = p.scale;
            for (let v = p.range[0]; v <= p.range[1]; v += step) {
                const x = toX(v);
                ticksG.innerHTML += `<line x1="${x}" y1="127" x2="${x}" y2="133" stroke="#94a3b8" stroke-width="1.5"/>
            <text x="${x}" y="148" text-anchor="middle" font-size="11" fill="#94a3b8">${v}</text>`;
            }

            // Draw box plot skeleton (whiskers & box shell, no fills yet)
            const el = document.getElementById('bp-elements');
            el.innerHTML = `
        <!-- Left whisker -->
        <line id="bp-wl" x1="${posMin}" y1="${SVG_Y}" x2="${posQ1}" y2="${SVG_Y}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
        <!-- Right whisker -->
        <line id="bp-wr" x1="${posQ3}" y1="${SVG_Y}" x2="${posMax}" y2="${SVG_Y}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
        <!-- Box outline -->
        <rect id="bp-box" x="${posQ1}" y="${SVG_Y - SVG_H / 2}" width="${posQ3 - posQ1}" height="${SVG_H}"
              fill="#ede9fe" fill-opacity="0.5" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3" rx="4"/>
        <!-- Median line placeholder -->
        <line id="bp-med-line" x1="${posMed}" y1="${SVG_Y - SVG_H / 2}" x2="${posMed}" y2="${SVG_Y + SVG_H / 2}" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,3"/>
    `;

            // 5 label slots on SVG
            const labelsG = document.getElementById('bp-labels');
            const labelDefs = [
                { id: 'bp-lbl-min', x: posMin, role: 'min', label: '最小值' },
                { id: 'bp-lbl-q1', x: posQ1, role: 'q1', label: 'Q1' },
                { id: 'bp-lbl-med', x: posMed, role: 'med', label: '中位數' },
                { id: 'bp-lbl-q3', x: posQ3, role: 'q3', label: 'Q3' },
                { id: 'bp-lbl-max', x: posMax, role: 'max', label: '最大值' },
            ];

            labelsG.innerHTML = labelDefs.map(d => `
        <g id="${d.id}" data-role="${d.role}" onclick="clickBpSlot('${d.role}')" class="cursor-pointer">
            <rect class="bp-slot" x="${d.x - 22}" y="${SVG_Y - SVG_H / 2 - 36}" width="44" height="28" rx="6"/>
            <text x="${d.x}" y="${SVG_Y - SVG_H / 2 - 16}" text-anchor="middle" font-size="12" font-weight="700"
                  fill="#3b82f6" id="${d.id}-text">?</text>
            <text x="${d.x}" y="${SVG_Y + SVG_H / 2 + 18}" text-anchor="middle" font-size="11" fill="#6b7280">${d.label}</text>
        </g>`).join('');
        }

        let selectedOptVal = null;
        let selectedOptBtn = null;
        const bpFilled = {};

        function selectBpOpt(btn, val) {
            // Deselect previous
            if (selectedOptBtn) selectedOptBtn.classList.remove('ring-2', 'ring-purple-400', 'bg-purple-100');
            if (selectedOptBtn === btn) { selectedOptBtn = null; selectedOptVal = null; return; }
            selectedOptBtn = btn;
            selectedOptVal = val;
            btn.classList.add('ring-2', 'ring-purple-400', 'bg-purple-100');
        }

        function clickBpSlot(role) {
            if (!selectedOptVal) { showToast('請先點選上方數值按鈕！'); return; }

            // Mark previous opt as used
            if (bpFilled[role]) {
                // restore old opt
                restoreBpOpt(bpFilled[role]);
            }
            bpFilled[role] = selectedOptVal;

            // Update SVG text
            const txtEl = document.getElementById(`bp-lbl-${role}-text`);
            const rectEl = document.getElementById(`bp-lbl-${role}`).querySelector('rect');
            txtEl.textContent = selectedOptVal;
            rectEl.classList.add('bp-filled');

            // Deselect opt
            selectedOptBtn.classList.add('used');
            selectedOptBtn.classList.remove('ring-2', 'ring-purple-400', 'bg-purple-100');
            selectedOptBtn = null; selectedOptVal = null;
        }

        function restoreBpOpt(val) {
            const btns = document.querySelectorAll('#opts-1 .opt-btn');
            for (const btn of btns) {
                if (btn.dataset.val == val && btn.classList.contains('used')) {
                    btn.classList.remove('used'); return;
                }
            }
        }

        function checkStep2() {
            const p = problems[currentIdx];
            const five = p.five;
            const roles = ['min', 'q1', 'med', 'q3', 'max'];
            const allFilled = roles.every(r => bpFilled[r] !== undefined);
            if (!allFilled) { showToast('請填滿所有五個位置！'); return; }

            let allCorrect = true;
            roles.forEach(role => {
                const userVal = parseFloat(bpFilled[role]);
                const correct = five[role];
                const g = document.getElementById(`bp-lbl-${role}`);
                const rect = g.querySelector('rect');
                const txt = g.querySelector('text');
                if (Math.abs(userVal - correct) < 0.01) {
                    rect.classList.remove('bp-filled', 'bp-wrong'); rect.classList.add('bp-correct');
                    txt.setAttribute('fill', '#16a34a');
                } else {
                    rect.classList.remove('bp-filled', 'bp-correct'); rect.classList.add('bp-wrong');
                    txt.setAttribute('fill', '#dc2626');
                    allCorrect = false;
                }
            });

            if (!allCorrect) { showToast('有幾個位置不對，再檢查看看！'); return; }

            // All correct - finalize box plot visuals
            finalizeBoxPlot();
            const step1 = document.getElementById('step-1');
            step1.classList.add('completed', 'animate-tada');
            document.getElementById('check-1').classList.remove('hidden');
            document.querySelector('#step-1 button:last-child').classList.add('hidden');
            document.getElementById('opts-1').classList.add('hidden');
            setTimeout(() => { step1.classList.remove('animate-tada'); showDone(); }, 650);
            addScore(30);
            solvedCount++;
        }

        function finalizeBoxPlot() {
            // Solidify the dashed lines/box
            const wl = document.getElementById('bp-wl');
            const wr = document.getElementById('bp-wr');
            const box = document.getElementById('bp-box');
            const med = document.getElementById('bp-med-line');
            if (wl) { wl.removeAttribute('stroke-dasharray'); wl.setAttribute('stroke', '#64748b'); wl.setAttribute('stroke-width', '2.5'); }
            if (wr) { wr.removeAttribute('stroke-dasharray'); wr.setAttribute('stroke', '#64748b'); wr.setAttribute('stroke-width', '2.5'); }
            if (box) { box.removeAttribute('stroke-dasharray'); box.setAttribute('fill', '#ede9fe'); box.setAttribute('fill-opacity', '0.9'); box.setAttribute('stroke', '#7c3aed'); box.setAttribute('stroke-width', '2.5'); }
            if (med) { med.removeAttribute('stroke-dasharray'); med.setAttribute('stroke', '#7c3aed'); med.setAttribute('stroke-width', '3'); }
            // Whisker caps
            const el = document.getElementById('bp-elements');
            el.innerHTML += `<line x1="${bpData.posMin}" y1="${SVG_Y - 10}" x2="${bpData.posMin}" y2="${SVG_Y + 10}" stroke="#64748b" stroke-width="2.5"/>
                     <line x1="${bpData.posMax}" y1="${SVG_Y - 10}" x2="${bpData.posMax}" y2="${SVG_Y + 10}" stroke="#64748b" stroke-width="2.5"/>`;
        }

        function showDone() {
            document.getElementById('done-msg').textContent = `太棒了！盒狀圖畫完了！`;
            document.getElementById('modal-done').classList.remove('hidden');
        }

        function resetProblem() {
            closeModalOnly('modal-done');
            bpFilled.__reset = true;
            Object.keys(bpFilled).forEach(k => delete bpFilled[k]);
            selectedOptVal = null; selectedOptBtn = null;
            loadProblem(currentIdx);
        }

        function closeModalOnly(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // ============ Utilities ============
        function addScore(pts) {
            totalScore += pts;
            const el = document.getElementById('score-val');
            el.textContent = totalScore;
            el.classList.add('animate-score');
            setTimeout(() => el.classList.remove('animate-score'), 500);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2000);
        }

        // Fix closeModal to not auto-switch when clicking X on other modals
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if (id === 'modal-done') {
                bpFilled.__reset = true;
                Object.keys(bpFilled).forEach(k => delete bpFilled[k]);
                selectedOptVal = null; selectedOptBtn = null;
                if (currentIdx < problems.length - 1) switchProblem(currentIdx + 1);
            }
        }
    </script>
<script src="../progress.js"></script>
</body>

</html>
