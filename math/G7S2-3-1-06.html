<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數學 - 外 × 外 = 內 × 內</title>
    <link rel="icon" href="../images/dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
        }

        .math-display {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 2px;
        }

        .slot {
            width: 60px;
            height: 60px;
            border: 3px dashed #94a3b8;
            border-radius: 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            font-size: 24px;
            color: #1e40af;
        }

        .slot.filled {
            border: 4px solid #3b82f6;
            background-color: #eff6ff;
            font-weight: bold;
        }

        .slot.filled:hover::after {
            content: '✕';
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ef4444;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot.correct {
            border-color: #10b981;
            background-color: #f0fdf4;
            color: #047857;
            cursor: default;
        }

        .slot.correct:hover::after {
            display: none;
        }

        @keyframes tada {
            0% {
                transform: scale(1);
            }

            10%,
            20% {
                transform: scale(0.9) rotate(-3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale(1.1) rotate(3deg);
            }

            40%,
            60%,
            80% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .tada {
            animation: tada 0.8s;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        mark.outer {
            background-color: #fee2e2;
            color: #b91c1c;
            border-radius: 4px;
            padding: 0 4px;
        }

        mark.inner {
            background-color: #dbeafe;
            color: #1d4ed8;
            border-radius: 4px;
            padding: 0 4px;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .var-x {
            color: #4f46e5;
            font-style: italic;
            font-weight: 900;
        }
    </style>
</head>

<body class="h-screen overflow-hidden flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-white border-b shadow-sm flex-none">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar whitespace-nowrap">
                <span class="font-bold text-slate-700 text-lg border-r pr-4">比例式：全自主解題</span>
                <div id="nav-buttons" class="flex gap-2">
                    <!-- 題目按鈕 -->
                </div>
            </div>
            <div class="flex items-center gap-6 ml-4 whitespace-nowrap">
                <div class="text-xl font-mono font-bold text-red-500 bg-red-50 px-3 py-1 rounded-lg">⏳ <span
                        id="timer">07:00</span></div>
                <div class="bg-blue-600 text-white px-4 py-1 rounded-full font-bold shadow-sm">得分: <span
                        id="total-score">0</span></div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- 左側：題目區域 -->
        <section class="md:w-1/3 bg-white border-r p-6 overflow-y-auto">
            <div class="mb-8">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg">當前比例式</span>
                </h2>
                <div id="sidebar-content" class="space-y-6">
                    <!-- 顯示比例式 -->
                </div>
            </div>

            <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-5 shadow-sm">
                <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2 text-lg">
                    💡 小秘訣
                </h3>
                <div class="space-y-3 text-slate-600 text-lg leading-relaxed">
                    <p><mark class="outer font-bold">外項</mark>：最左邊與最右邊</p>
                    <p><mark class="inner font-bold">內項</mark>：中間那兩個</p>
                    <p class="font-bold text-indigo-600">外 × 外 = 內 × 內</p>
                </div>
                <div class="mt-5 pt-4 border-t border-slate-200 text-sm text-blue-600 font-bold">
                    ※ 請記得連變數 <span class="var-x text-base">x</span> 也要親自填入格子中喔！
                </div>
            </div>
        </section>

        <!-- 右側：填答區 -->
        <section id="step-container" class="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-6 pb-24">
            <!-- 由 JS 生成步驟 -->
        </section>

    </main>

    <!-- 底部選項區 -->
    <div class="bg-white border-t p-6 flex-none shadow-[0_-4px_20px_rgba(0,0,0,0.08)]">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-center gap-4" id="options-grid">
            <!-- 由 JS 生成按鈕 -->
        </div>
    </div>

    <!-- 完成彈窗 -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-slate-900/70 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-10 max-w-sm w-full text-center shadow-2xl scale-110">
            <div class="text-8xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-3xl font-black mb-2 text-slate-800">挑戰成功！</h2>
            <p id="modal-result" class="text-slate-500 mb-8 font-medium text-lg"></p>
            <div class="flex gap-4">
                <button onclick="resetGame()"
                    class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition active:scale-95">再挑戰一次</button>
                <button onclick="closeModal()"
                    class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-2xl font-bold hover:bg-slate-200 transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1, ratio: ["1", "x", "2", "4"],
                inner: ["x", "2"], outer: ["1", "4"],
                step2Ans: { coeff: 2, result: 4 }, step3Ans: 2, options: [1, 2, 4, 8]
            },
            {
                id: 2, ratio: ["2", "x", "4", "8"],
                inner: ["x", "4"], outer: ["2", "8"],
                step2Ans: { coeff: 4, result: 16 }, step3Ans: 4, options: [2, 4, 8, 16]
            },
            {
                id: 3, ratio: ["3", "6", "1", "x"],
                inner: ["6", "1"], outer: ["3", "x"],
                step2Ans: { coeff: 3, result: 6 }, step3Ans: 2, options: [1, 2, 3, 6]
            },
            {
                id: 4, ratio: ["5", "10", "x", "2"],
                inner: ["10", "x"], outer: ["5", "2"],
                step2Ans: { coeff: 10, result: 10 }, step3Ans: 1, options: [1, 2, 5, 10]
            },
            {
                id: 5, ratio: ["x", "3", "4", "6"],
                inner: ["3", "4"], outer: ["x", "6"],
                step2Ans: { coeff: 6, result: 12 }, step3Ans: 2, options: [2, 3, 4, 6, 12]
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let timeLeft = 420;
        let timerInterval;
        let isGameOver = false;

        const userProgress = questions.map(() => ({
            currentStep: 1,
            s1: [null, null, null, null],
            s2: [null, null, null],
            s3: null,
            isCorrect: false
        }));

        const navContainer = document.getElementById('nav-buttons');
        const sidebarContent = document.getElementById('sidebar-content');
        const stepContainer = document.getElementById('step-container');
        const optionsGrid = document.getElementById('options-grid');
        const scoreDisplay = document.getElementById('total-score');
        const timerDisplay = document.getElementById('timer');

        window.onload = () => {
            initNav();
            loadQuestion(0);
            startTimer();
        };

        function initNav() {
            navContainer.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${i}`;
                const done = userProgress[i].isCorrect;
                btn.className = `px-5 py-2 rounded-xl font-bold transition-all border-2 text-lg ${i === currentIdx ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' :
                    done ? 'bg-green-100 text-green-700 border-green-300' : 'bg-slate-100 text-slate-500 border-slate-200'
                    }`;
                btn.innerText = `題目 ${q.id}${done ? ' ✔' : ''}`;
                btn.onclick = () => loadQuestion(i);
                navContainer.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            currentIdx = index;
            initNav();
            const q = questions[index];
            const prog = userProgress[index];

            sidebarContent.innerHTML = `
                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 text-center shadow-inner">
                    <div class="math-display">
                        <mark class="outer">${q.ratio[0]}</mark> : 
                        <mark class="inner">${q.ratio[1]}</mark> = 
                        <mark class="inner">${q.ratio[2]}</mark> : 
                        <mark class="outer">${q.ratio[3]}</mark>
                    </div>
                </div>
            `;

            renderSteps(q, prog);
            renderOptions(q.options, prog.isCorrect);
        }

        function renderSteps(q, prog) {
            stepContainer.innerHTML = '';

            // Step 1: 外乘 = 內乘
            const step1 = document.createElement('div');
            step1.className = `bg-white p-6 rounded-2xl border-2 transition-all ${prog.currentStep > 1 ? 'border-green-200 bg-slate-50 opacity-90' : 'border-indigo-400 shadow-lg'}`;
            step1.innerHTML = `
                <h3 class="font-bold text-slate-700 mb-4 flex items-center">
                    <span class="w-8 h-8 rounded-full ${prog.currentStep > 1 ? 'bg-green-500' : 'bg-indigo-600'} text-white flex items-center justify-center mr-2 text-sm">${prog.currentStep > 1 ? '✔' : '1'}</span>
                    第一步：列出「外外相乘 = 內內相乘」
                </h3>
                <div class="flex items-center gap-2 text-2xl font-bold justify-center flex-wrap">
                    <div onclick="clearSlot(1, 0)" class="slot ${prog.s1[0] ? 'filled' : ''} ${prog.currentStep > 1 ? 'correct' : ''}">${prog.s1[0] || ''}</div>
                    <span>×</span>
                    <div onclick="clearSlot(1, 1)" class="slot ${prog.s1[1] ? 'filled' : ''} ${prog.currentStep > 1 ? 'correct' : ''}">${prog.s1[1] || ''}</div>
                    <span class="mx-2">=</span>
                    <div onclick="clearSlot(1, 2)" class="slot ${prog.s1[2] ? 'filled' : ''} ${prog.currentStep > 1 ? 'correct' : ''}">${prog.s1[2] || ''}</div>
                    <span>×</span>
                    <div onclick="clearSlot(1, 3)" class="slot ${prog.s1[3] ? 'filled' : ''} ${prog.currentStep > 1 ? 'correct' : ''}">${prog.s1[3] || ''}</div>
                </div>
                ${prog.currentStep === 1 ? `<button onclick="checkStep(1)" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow transition-all">檢查列式</button>` : ''}
            `;
            stepContainer.appendChild(step1);

            // Step 2: 化簡
            if (prog.currentStep >= 2) {
                const step2 = document.createElement('div');
                step2.className = `bg-white p-6 rounded-2xl border-2 transition-all ${prog.currentStep > 2 ? 'border-green-200 bg-slate-50 opacity-90' : 'border-indigo-400 shadow-lg animate-fade-in'}`;
                step2.innerHTML = `
                    <h3 class="font-bold text-slate-700 mb-4 flex items-center">
                        <span class="w-8 h-8 rounded-full ${prog.currentStep > 2 ? 'bg-green-500' : 'bg-indigo-600'} text-white flex items-center justify-center mr-2 text-sm">${prog.currentStep > 2 ? '✔' : '2'}</span>
                        第二步：化簡算式（例如填 2 和 x）
                    </h3>
                    <div class="flex items-center gap-2 text-2xl font-bold justify-center">
                        <div onclick="clearSlot(2, 0)" class="slot ${prog.s2[0] ? 'filled' : ''} ${prog.currentStep > 2 ? 'correct' : ''}">${prog.s2[0] || ''}</div>
                        <div onclick="clearSlot(2, 1)" class="slot ${prog.s2[1] ? 'filled' : ''} ${prog.currentStep > 2 ? 'correct' : ''}">${prog.s2[1] || ''}</div>
                        <span class="mx-2">=</span>
                        <div onclick="clearSlot(2, 2)" class="slot ${prog.s2[2] ? 'filled' : ''} ${prog.currentStep > 2 ? 'correct' : ''}">${prog.s2[2] || ''}</div>
                    </div>
                    ${prog.currentStep === 2 ? `<button onclick="checkStep(2)" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow transition-all">檢查化簡</button>` : ''}
                `;
                stepContainer.appendChild(step2);
            }

            // Step 3: 結果
            if (prog.currentStep >= 3) {
                const step3 = document.createElement('div');
                step3.className = `bg-white p-6 rounded-2xl border-2 transition-all ${prog.isCorrect ? 'border-green-500 bg-green-50 tada' : 'border-indigo-400 shadow-lg animate-fade-in'}`;
                step3.innerHTML = `
                    <h3 class="font-bold text-slate-700 mb-4 flex items-center">
                        <span class="w-8 h-8 rounded-full ${prog.isCorrect ? 'bg-green-600' : 'bg-indigo-600'} text-white flex items-center justify-center mr-2 text-sm">${prog.isCorrect ? '✔' : '3'}</span>
                        第三步：求出 x 的最終答案
                    </h3>
                    <div class="flex items-center gap-3 text-2xl font-bold justify-center">
                        <span class="var-x text-3xl">x</span>
                        <span>=</span>
                        <div id="slot-x" onclick="clearSlot(3, 0)" class="slot ${prog.s3 !== null ? 'filled' : ''} ${prog.isCorrect ? 'correct' : ''}">${prog.s3 || ''}</div>
                    </div>
                    ${!prog.isCorrect ? `<button onclick="checkStep(3)" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow transition-all">完成這題</button>` : ''}
                `;
                stepContainer.appendChild(step3);
            }
        }

        function renderOptions(opts, disabled) {
            optionsGrid.innerHTML = '';
            if (disabled) {
                optionsGrid.innerHTML = '<p class="text-slate-400 font-bold py-4 text-xl">這題已經完成囉！</p>';
                return;
            }

            // 加入 x 選項
            const allOpts = [...opts, 'x'];
            allOpts.forEach(val => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-16 h-16 md:w-20 md:h-20 bg-white border-2 border-slate-200 rounded-2xl text-2xl md:text-3xl font-black shadow-md flex items-center justify-center transition-all hover:bg-blue-50 ${val === 'x' ? 'text-indigo-600 italic font-black border-indigo-200' : 'text-slate-700'}`;
                btn.innerText = val;
                btn.onclick = () => fillActiveSlot(val);
                optionsGrid.appendChild(btn);
            });
        }

        function fillActiveSlot(val) {
            const prog = userProgress[currentIdx];
            if (prog.isCorrect) return;

            if (prog.currentStep === 1) {
                const idx = prog.s1.indexOf(null);
                if (idx !== -1) prog.s1[idx] = val;
            } else if (prog.currentStep === 2) {
                const idx = prog.s2.indexOf(null);
                if (idx !== -1) prog.s2[idx] = val;
            } else if (prog.currentStep === 3) {
                prog.s3 = val;
            }
            loadQuestion(currentIdx);
        }

        function clearSlot(step, idx) {
            const prog = userProgress[currentIdx];
            if (prog.isCorrect || prog.currentStep !== step) return;

            if (step === 1) prog.s1[idx] = null;
            if (step === 2) prog.s2[idx] = null;
            if (step === 3) prog.s3 = null;
            loadQuestion(currentIdx);
        }

        function checkStep(stepNum) {
            const q = questions[currentIdx];
            const prog = userProgress[currentIdx];

            if (stepNum === 1) {
                if (prog.s1.includes(null)) { showToast("還有格子沒填喔！"); return; }

                // 交換律驗證
                const pairA = [String(prog.s1[0]), String(prog.s1[1])].sort();
                const pairB = [String(prog.s1[2]), String(prog.s1[3])].sort();

                const correctOuter = [...q.outer].sort();
                const correctInner = [...q.inner].sort();

                const isOuterInner = (JSON.stringify(pairA) === JSON.stringify(correctOuter) && JSON.stringify(pairB) === JSON.stringify(correctInner));
                const isInnerOuter = (JSON.stringify(pairA) === JSON.stringify(correctInner) && JSON.stringify(pairB) === JSON.stringify(correctOuter));

                if (isOuterInner || isInnerOuter) {
                    prog.currentStep = 2;
                    showToast("太棒了！列式完全正確。");
                } else {
                    showToast("列式不對喔，檢查一下是不是外項配外項。");
                }
            } else if (stepNum === 2) {
                if (prog.s2.includes(null)) { showToast("請把格子填滿！"); return; }

                // 驗證化簡後的係數與 x，以及等號右邊結果
                const leftPair = [String(prog.s2[0]), String(prog.s2[1])].sort();
                const correctLeft = [String(q.step2Ans.coeff), 'x'].sort();
                const correctRight = String(q.step2Ans.result);

                if (JSON.stringify(leftPair) === JSON.stringify(correctLeft) && String(prog.s2[2]) === correctRight) {
                    prog.currentStep = 3;
                    showToast("正確！最後一步：求出 x。");
                } else {
                    showToast("化簡有誤，請再檢查乘法運算。");
                }
            } else if (stepNum === 3) {
                if (prog.s3 === null) { showToast("還沒填 x 的答案喔！"); return; }
                if (Number(prog.s3) === q.step3Ans) {
                    prog.isCorrect = true;
                    score++;
                    scoreDisplay.innerText = score;
                    showToast("恭喜完成！");
                    initNav();
                    setTimeout(() => {
                        if (currentIdx < questions.length - 1) loadQuestion(currentIdx + 1);
                        else checkFinish();
                    }, 1500);
                } else {
                    showToast("答案不對喔，再算算看！");
                }
            }
            loadQuestion(currentIdx);
        }

        function showToast(msg) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = "toast fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 animate-bounce font-bold text-lg text-center";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isGameOver) return;
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerDisplay.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function checkFinish() {
            if (userProgress.every(s => s.isCorrect)) endGame();
        }

        function endGame() {
            isGameOver = true;
            clearInterval(timerInterval);
            const taken = 420 - timeLeft;
            const m = Math.floor(taken / 60);
            const s = taken % 60;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            document.getElementById('modal-result').innerText = `作答時間：${m}分${s}秒\n挑戰得分：${score} / ${questions.length}`;
        }

        function resetGame() {
            score = 0; timeLeft = 420; currentIdx = 0; isGameOver = false;
            userProgress.forEach(p => {
                p.currentStep = 1; p.s1 = [null, null, null, null]; p.s2 = [null, null, null]; p.s3 = null; p.isCorrect = false;
            });
            scoreDisplay.innerText = "0";
            closeModal();
            loadQuestion(0);
            startTimer();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
        }
    </script>
</body>

</html>
