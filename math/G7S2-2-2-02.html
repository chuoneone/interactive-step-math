<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 畫二元一次方程式的圖形</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            user-select: none;
        }

        .math {
            font-size: 24px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .slot {
            display: inline-block;
            width: 44px;
            height: 44px;
            border-bottom: 3px solid #94a3b8;
            margin: 0 4px;
            text-align: center;
            line-height: 44px;
            vertical-align: bottom;
            cursor: pointer;
            transition: all 0.2s;
            color: #2563eb;
            font-weight: bold;
            background-color: transparent;
            border-radius: 4px 4px 0 0;
        }

        .slot.filled {
            border-bottom-color: #2563eb;
            background-color: #eff6ff;
        }

        .slot.correct {
            border-bottom-color: #10b981;
            color: #10b981;
            background-color: #ecfdf5;
        }

        .option-btn {
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .option-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            transform: scale(0.9);
            border-color: transparent;
        }

        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .tada {
            animation: tada 0.8s both;
        }

        .step-container {
            transition: all 0.5s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .step-container.active {
            max-height: 2000px;
            opacity: 1;
            margin-bottom: 1.5rem;
            pointer-events: auto;
        }

        .coordinate-grid line {
            stroke: #e2e8f0;
            stroke-width: 1;
        }

        .coordinate-axis {
            stroke: #475569;
            stroke-width: 2;
        }

        .plot-point {
            fill: #ef4444;
            transition: all 0.3s;
        }

        .plot-line {
            stroke: #3b82f6;
            stroke-width: 3;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 1.5s forwards;
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
  <link rel="icon" href="../images/dog.png" type="image/png">
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- 導覽列 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center p-2 no-scrollbar overflow-x-auto whitespace-nowrap">
            <span class="font-bold text-blue-600 px-4 border-r border-slate-200">二元一次方程式圖形</span>
            <div id="nav-btns" class="flex gap-2 ml-2">
                <!-- 按鈕由 JS 生成 -->
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- 左側：題目與圖形 -->
            <div class="w-full md:w-1/3 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:sticky md:top-20">
                    <h2 class="text-xl font-bold mb-4 text-slate-800" id="main-title">二、畫二元一次方程式的圖形</h2>
                    <div class="mb-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <p class="text-lg font-bold text-blue-800" id="q-number-display">題目 (1)</p>
                        <div class="math mt-2" id="equation-display">
                            <!-- 由 JS 生成 -->
                        </div>
                    </div>

                    <!-- SVG 座標平面 -->
                    <div class="relative w-full aspect-square bg-white border border-slate-200 rounded-lg overflow-hidden shadow-inner">
                        <svg id="coordinate-plane" viewBox="0 0 300 300" class="w-full h-full">
                            <g class="coordinate-grid" id="grid-lines"></g>
                            <line x1="0" y1="150" x2="300" y2="150" class="coordinate-axis" />
                            <line x1="150" y1="0" x2="150" y2="300" class="coordinate-axis" />
                            <path d="M 295 145 L 300 150 L 295 155" fill="none" stroke="#475569" stroke-width="2" />
                            <path d="M 145 5 L 150 0 L 155 5" fill="none" stroke="#475569" stroke-width="2" />
                            <text x="285" y="140" font-size="14" font-style="italic" fill="#475569">x</text>
                            <text x="160" y="15" font-size="14" font-style="italic" fill="#475569">y</text>
                            <text x="135" y="165" font-size="14" font-style="italic" fill="#475569">O</text>
                            <text x="170" y="165" font-size="14" fill="#475569">1</text>
                            <text x="135" y="135" font-size="14" fill="#475569">1</text>
                            <line x1="170" y1="145" x2="170" y2="155" stroke="#475569" stroke-width="2" />
                            <line x1="145" y1="130" x2="155" y2="130" stroke="#475569" stroke-width="2" />
                            <g id="drawing-layer"></g>
                        </svg>
                    </div>

                    <!-- 表格 -->
                    <div class="mt-6 border-2 border-slate-200 rounded-lg overflow-hidden bg-white">
                        <table class="w-full text-center">
                            <tr class="bg-slate-50 border-b border-slate-200">
                                <th class="py-2 border-r border-slate-200 w-16 italic text-xl">x</th>
                                <td class="py-2 border-r border-slate-200 text-xl font-bold" id="td-x1">0</td>
                                <td class="py-2 text-xl font-bold" id="td-x2">1</td>
                            </tr>
                            <tr>
                                <th class="py-2 border-r border-slate-200 italic text-xl">y</th>
                                <td class="py-2 border-r border-slate-200 h-12" id="table-y1"></td>
                                <td class="py-2 h-12" id="table-y2"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 右側：互動步驟 -->
            <div class="w-full md:w-2/3" id="steps-container">
                <!-- 內容由 JS 動態切換生成 -->
            </div>
        </div>
    </div>

    <!-- 完成視窗 -->
    <div id="success-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modal-content">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">太棒了！</h2>
            <p class="text-slate-600 mb-8" id="modal-text">你已經成功完成本題的圖形繪製！</p>
            <div class="space-y-3">
                <button onclick="resetCurrentQuestion()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors">再做一次</button>
                <button onclick="closeModal()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "題目 (1)",
                equationHtml: '<mark class="bg-yellow-200 px-1 rounded">2x</mark> - <mark class="bg-yellow-200 px-1 rounded">y</mark> = <mark class="bg-yellow-200 px-1 rounded">0</mark>',
                xValues: [0, 1],
                lineFunc: (x) => 2 * x,
                steps: [
                    {
                        title: "當 x = 0 時，求 y 的值",
                        contentHtml: '2 &times; <span class="slot" data-ans="0"></span> - y = 0 <br> &rArr; 0 - y = 0 <br> &rArr; y = <span class="slot" data-ans="0"></span>',
                        options: ["0", "0", "1", "2"] // 兩個 0 供點擊
                    },
                    {
                        title: "當 x = 1 時，求 y 的值",
                        contentHtml: '2 &times; <span class="slot" data-ans="1"></span> - y = 0 <br> &rArr; <span class="slot" data-ans="2"></span> - y = 0 <br> &rArr; y = <span class="slot" data-ans="2"></span>',
                        options: ["1", "2", "2", "0"]
                    },
                    {
                        title: "找出兩個點的座標",
                        contentHtml: '第一點：( 0 , <span class="slot" data-ans="0"></span> ) <br> 第二點：( 1 , <span class="slot" data-ans="2"></span> )',
                        options: ["0", "1", "2"]
                    }
                ]
            },
            {
                id: 2,
                title: "題目 (2)",
                equationHtml: '<mark class="bg-yellow-200 px-1 rounded">x</mark> + <mark class="bg-yellow-200 px-1 rounded">y</mark> = <mark class="bg-yellow-200 px-1 rounded">0</mark>',
                xValues: [0, 1],
                lineFunc: (x) => -1 * x,
                steps: [
                    {
                        title: "當 x = 0 時，求 y 的值",
                        contentHtml: '<span class="slot" data-ans="0"></span> + y = 0 <br> &rArr; y = <span class="slot" data-ans="0"></span>',
                        options: ["0", "0", "1", "-1"]
                    },
                    {
                        title: "當 x = 1 時，求 y 的值",
                        contentHtml: '<span class="slot" data-ans="1"></span> + y = 0 <br> &rArr; y = <span class="slot" data-ans="-1"></span>',
                        options: ["1", "-1", "0"]
                    },
                    {
                        title: "找出兩個點的座標",
                        contentHtml: '第一點：( 0 , <span class="slot" data-ans="0"></span> ) <br> 第二點：( 1 , <span class="slot" data-ans="-1"></span> )',
                        options: ["0", "1", "-1"]
                    }
                ]
            }
        ];

        let currentIdx = 0;
        let progress = [0, 0]; // 記錄每題解鎖到第幾個步驟

        // 初始化
        function init() {
            renderNav();
            renderQuestion(0);
            drawGrid();
        }

        function drawGrid() {
            const gridGroup = document.getElementById('grid-lines');
            gridGroup.innerHTML = '';
            for (let i = 0; i <= 300; i += 20) {
                const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                vLine.setAttribute("x1", i); vLine.setAttribute("y1", 0);
                vLine.setAttribute("x2", i); vLine.setAttribute("y2", 300);
                gridGroup.appendChild(vLine);
                const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                hLine.setAttribute("x1", 0); hLine.setAttribute("y1", i);
                hLine.setAttribute("x2", 300); hLine.setAttribute("y2", i);
                gridGroup.appendChild(hLine);
            }
        }

        function renderNav() {
            const container = document.getElementById('nav-btns');
            container.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `mx-1 px-5 py-2 rounded-full font-bold transition-all ${index === currentIdx ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`;
                btn.innerText = `題目 ${q.id}`;
                btn.onclick = () => switchQuestion(index);
                container.appendChild(btn);
            });
        }

        function switchQuestion(index) {
            currentIdx = index;
            renderNav();
            renderQuestion(index);
            // 滾動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestion(idx) {
            const q = questions[idx];
            document.getElementById('q-number-display').innerText = q.title;
            document.getElementById('equation-display').innerHTML = q.equationHtml;
            document.getElementById('td-x1').innerText = q.xValues[0];
            document.getElementById('td-x2').innerText = q.xValues[1];
            document.getElementById('table-y1').innerText = '';
            document.getElementById('table-y2').innerText = '';
            document.getElementById('drawing-layer').innerHTML = '';

            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            q.steps.forEach((step, sIdx) => {
                const stepDiv = document.createElement('div');
                stepDiv.id = `step-${sIdx}`;
                stepDiv.className = `step-container ${sIdx === 0 ? 'active' : ''}`;
                stepDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-blue-500">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold flex items-center gap-2 text-slate-700">
                                <span class="bg-blue-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm">${sIdx + 1}</span>
                                ${step.title}
                            </h3>
                            <span id="step-${sIdx}-status" class="text-green-500 font-bold hidden flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                完成
                            </span>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl mb-4 text-xl leading-relaxed text-slate-800">
                            ${step.contentHtml}
                        </div>
                        <div class="flex flex-wrap gap-3 mt-4" id="options-${sIdx}"></div>
                        <button onclick="checkStep(${sIdx})" id="check-btn-${sIdx}" class="mt-6 w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-100">檢查答案</button>
                    </div>
                `;
                container.appendChild(stepDiv);
                renderOptions(sIdx);
            });

            // 最後一步：繪圖按鈕
            const finalStep = document.createElement('div');
            finalStep.id = `step-${q.steps.length}`;
            finalStep.className = `step-container`;
            finalStep.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-indigo-500">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold flex items-center gap-2 text-slate-700">
                            <span class="bg-indigo-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm">${q.steps.length + 1}</span>
                            完成圖形
                        </h3>
                    </div>
                    <p class="text-slate-600 mb-6">兩點決定一條直線。點擊按鈕連結兩點完成圖形！</p>
                    <button onclick="finishGraph()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all transform hover:scale-[1.02] shadow-xl shadow-indigo-100 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        繪製直線並完成
                    </button>
                </div>
            `;
            container.appendChild(finalStep);

            // 設置 Slot 點擊事件
            const slots = container.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.onclick = () => clearSlot(slot);
            });
        }

        function renderOptions(sIdx) {
            const container = document.getElementById(`options-${sIdx}`);
            const q = questions[currentIdx];
            const step = q.steps[sIdx];
            
            container.innerHTML = '';
            step.options.forEach((val, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-14 h-14 bg-white border-2 border-slate-200 rounded-xl text-xl font-bold text-slate-700 shadow-sm hover:border-blue-400 hover:text-blue-600 focus:outline-none flex items-center justify-center";
                btn.innerText = val;
                btn.dataset.val = val;
                btn.dataset.oid = `${sIdx}-${oIdx}`; // 唯一識別碼
                btn.onclick = () => fillNextSlot(sIdx, btn);
                container.appendChild(btn);
            });
        }

        function fillNextSlot(sIdx, btn) {
            const stepDiv = document.getElementById(`step-${sIdx}`);
            const slots = stepDiv.querySelectorAll('.slot');
            for (let slot of slots) {
                if (!slot.innerText) {
                    slot.innerText = btn.innerText;
                    slot.classList.add('filled');
                    slot.dataset.boundBtn = btn.dataset.oid;
                    btn.disabled = true;
                    return;
                }
            }
        }

        function clearSlot(slot) {
            if (!slot.innerText || slot.classList.contains('correct')) return;
            const btnId = slot.dataset.boundBtn;
            const btn = document.querySelector(`[data-oid="${btnId}"]`);
            if (btn) btn.disabled = false;
            slot.innerText = '';
            slot.classList.remove('filled');
            delete slot.dataset.boundBtn;
        }

        function checkStep(sIdx) {
            const q = questions[currentIdx];
            const stepDiv = document.getElementById(`step-${sIdx}`);
            const slots = stepDiv.querySelectorAll('.slot');
            
            let allFilled = true;
            let allCorrect = true;

            slots.forEach(slot => {
                if (!slot.innerText) allFilled = false;
                if (slot.innerText !== slot.dataset.ans) allCorrect = false;
            });

            if (!allFilled) {
                toast("請填滿所有空格");
                return;
            }

            if (allCorrect) {
                slots.forEach(slot => {
                    slot.classList.add('correct', 'tada');
                    slot.onclick = null;
                });
                document.getElementById(`step-${sIdx}-status`).classList.remove('hidden');
                document.getElementById(`options-${sIdx}`).classList.add('hidden');
                document.getElementById(`check-btn-${sIdx}`).classList.add('hidden');

                // 填入表格
                if (sIdx === 0) {
                    const y1 = q.steps[0].slots ? q.steps[0].slots[q.steps[0].slots.length-1] : q.steps[0].options.find(o => true); 
                    // 這裡直接拿正確答案
                    const lastSlotVal = Array.from(slots).pop().innerText;
                    document.getElementById('table-y1').innerText = lastSlotVal;
                    document.getElementById('table-y1').className = "py-2 border-r border-slate-200 text-blue-600 font-bold text-xl";
                } else if (sIdx === 1) {
                    const lastSlotVal = Array.from(slots).pop().innerText;
                    document.getElementById('table-y2').innerText = lastSlotVal;
                    document.getElementById('table-y2').className = "py-2 text-blue-600 font-bold text-xl";
                } else if (sIdx === 2) {
                    drawPoints();
                }

                // 解鎖下一步
                const nextStep = document.getElementById(`step-${sIdx + 1}`);
                if (nextStep) {
                    nextStep.classList.add('active');
                    setTimeout(() => {
                        nextStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 400);
                }
            } else {
                toast("再想想看喔，代入計算有沒有錯誤？");
            }
        }

        function drawPoints() {
            const q = questions[currentIdx];
            const layer = document.getElementById('drawing-layer');
            
            // 計算點位 (0, y1), (1, y2)
            const pts = [
                { x: q.xValues[0], y: q.lineFunc(q.xValues[0]) },
                { x: q.xValues[1], y: q.lineFunc(q.xValues[1]) }
            ];

            pts.forEach(p => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                // 1 單位 = 20px, 中心點是 (150, 150)
                circle.setAttribute("cx", 150 + p.x * 20);
                circle.setAttribute("cy", 150 - p.y * 20);
                circle.setAttribute("r", 6);
                circle.setAttribute("class", "plot-point");
                layer.appendChild(circle);
            });
        }

        function finishGraph() {
            const q = questions[currentIdx];
            const layer = document.getElementById('drawing-layer');
            
            // 繪製穿過整個網格的直線
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            // 延長線端點計算 (x從-7到7)
            const xMin = -7, xMax = 7;
            line.setAttribute("x1", 150 + xMin * 20);
            line.setAttribute("y1", 150 - q.lineFunc(xMin) * 20);
            line.setAttribute("x2", 150 + xMax * 20);
            line.setAttribute("y2", 150 - q.lineFunc(xMax) * 20);
            line.setAttribute("class", "plot-line");
            layer.appendChild(line);

            setTimeout(() => {
                showSuccess();
            }, 1600);
        }

        function toast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[200] transition-all duration-300";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 2000);
        }

        function showSuccess() {
            const modal = document.getElementById('success-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-90');
        }

        function closeModal() {
            const modal = document.getElementById('success-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.add('scale-90');
        }

        function resetCurrentQuestion() {
            closeModal();
            renderQuestion(currentIdx);
        }

        window.onload = init;
    </script>
<script src="../progress.js"></script>
  <script src="../quiz-kit.js"></script>
</body>
</html>
