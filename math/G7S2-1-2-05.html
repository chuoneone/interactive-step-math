<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解二元一次式 L</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 核心數學式 CSS (依照規範) */
        .math {
            font-size: 28px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 1px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .fraction span:first-child {
            border-bottom: 2px solid #000;
            padding: 0 4px;
        }

        .power {
            font-size: 18px;
            vertical-align: super;
            margin-left: 2px;
            color: #e63946;
        }

        .sqrt::before {
            content: "√";
            font-size: 28px;
            margin-right: 2px;
        }

        .abs::before {
            content: "|";
        }

        .abs::after {
            content: "|";
        }

        .mixed {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        /* 聯立方程式大括號 */
        .system-brace {
            font-size: 80px;
            font-weight: 300;
            line-height: 1;
            margin-right: 8px;
            color: #333;
            display: flex;
            align-items: center;
        }

        .system-eqs {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 互動元素自訂樣式 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f7f6;
            color: #2c3e50;
        }

        .slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.5rem;
            height: 3.5rem;
            padding: 0 0.5rem;
            margin: 0 0.25rem;
            border-bottom: 4px solid #cbd5e1;
            background-color: #f8fafc;
            color: transparent;
            /* 未填入時隱藏文字 */
            font-size: 1.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 0.5rem 0.5rem 0 0;
            transition: all 0.2s ease;
            font-family: 'Times New Roman', Times, serif;
            vertical-align: middle;
        }

        .slot.filled {
            color: #1d4ed8;
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
        }

        .slot.correct {
            color: #15803d;
            border-bottom-color: #22c55e;
            background-color: #f0fdf4;
            cursor: default;
        }

        .option-btn {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .option-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: scale(0.95);
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            color: #64748b;
        }

        /* 步驟列狀態 (無卡片設計) */
        .step-row {
            transition: all 0.5s ease;
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .step-row.active {
            opacity: 1;
            pointer-events: auto;
            filter: grayscale(0%);
        }

        .step-row.completed {
            opacity: 1;
            pointer-events: auto;
            filter: grayscale(0%);
        }

        /* Tada 動畫 */
        @keyframes tada {
            0% {
                transform: scale3d(1, 1, 1);
            }

            10%,
            20% {
                transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
            }

            30%,
            50%,
            70%,
            90% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
            }

            40%,
            60%,
            80% {
                transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
            }

            100% {
                transform: scale3d(1, 1, 1);
            }
        }

        .animate-tada {
            animation: tada 0.8s ease-in-out;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col md:flex-row">

    <!-- 左側導覽列 (手機版維持上方橫向滑動，桌機版改為左側直列) -->
    <aside
        class="w-full md:w-64 lg:w-72 bg-white shadow-lg md:h-screen md:sticky top-0 z-50 flex flex-col flex-shrink-0">
        <div class="p-6 border-b border-gray-100 flex items-center justify-center md:justify-start">
            <h1 class="font-bold text-2xl text-indigo-700 tracking-wide">二元一次式 L</h1>
        </div>
        <!-- 導覽按鈕容器 -->
        <nav class="flex-1 overflow-x-auto md:overflow-y-auto hide-scrollbar p-4 flex flex-row md:flex-col gap-3"
            id="nav-buttons">
            <!-- JS 動態產生按鈕 -->
        </nav>
    </aside>

    <!-- 主要內容區 (單一白板佈局) -->
    <main class="flex-1 w-full px-4 py-8 md:px-8 flex flex-col items-center overflow-x-hidden">

        <!-- 統一的大白板區塊 -->
        <div
            class="bg-white rounded-3xl shadow-lg p-6 md:p-12 border-t-8 border-indigo-500 w-full max-w-3xl flex flex-col items-center relative overflow-hidden">

            <!-- 目前得分浮動標籤 -->
            <div
                class="absolute top-4 right-4 bg-yellow-100 text-yellow-800 px-4 py-1 rounded-full font-bold text-sm shadow-sm flex items-center">
                <svg class="w-4 h-4 mr-1 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                    </path>
                </svg>
                本題得分: <span id="current-score-display" class="ml-1 text-lg">100</span>
            </div>

            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center self-start w-full border-b pb-4"
                id="problem-title">
                <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                    </path>
                </svg>
                題目資訊
            </h2>

            <!-- 聯立方程式顯示區 -->
            <div class="flex items-stretch justify-center py-4 mb-2">
                <div class="system-brace text-gray-800">{</div>
                <div class="system-eqs math text-3xl" id="problem-equations">
                    <!-- JS 動態插入 -->
                </div>
            </div>

            <!-- 前置靜態算式區 (代入過程等) -->
            <div class="w-full flex flex-col items-center math text-3xl text-gray-700 mb-6 gap-2" id="problem-context">
                <!-- JS 動態插入 -->
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-px bg-gray-200 mb-8"></div>

            <!-- 下方：步驟解鎖流程 (無卡片、緊密排列) -->
            <section class="w-full flex flex-col gap-2 pb-10 items-center" id="steps-container">
                <!-- JS 動態產生連續的算式步驟 -->
            </section>

        </div>

    </main>

    <!-- 完成視窗 Modal (含計分回饋) -->
    <div id="completion-modal"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center shadow-2xl transform scale-95 opacity-0 transition-all duration-300 relative overflow-hidden"
            id="modal-content">

            <!-- 裝飾背景 -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-100 rounded-full opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-indigo-100 rounded-full opacity-50"></div>

            <!-- 動態圖示區 -->
            <div id="modal-icon-container"
                class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 relative z-10 shadow-md">
                <!-- JS 動態插入圖示 -->
            </div>

            <!-- 得分顯示 -->
            <div class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-2 relative z-10"
                id="modal-score">
                100 分
            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-2 relative z-10" id="modal-title">太棒了！</h3>
            <p class="text-md text-gray-600 mb-8 relative z-10 font-bold" id="modal-feedback">你已經完成這一題了！</p>

            <div class="flex gap-4 justify-center relative z-10">
                <button onclick="closeModal()"
                    class="px-5 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold text-md hover:bg-gray-200 transition">關閉視窗</button>
                <button onclick="retryCurrentQuestion()"
                    class="px-5 py-3 bg-indigo-600 text-white rounded-xl font-bold text-md hover:bg-indigo-700 shadow-md hover:shadow-lg transition">再挑戰一次</button>
            </div>
        </div>
    </div>

    <!-- 訊息提示 (Toast) -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 font-bold text-lg flex items-center">
        <span id="toast-icon" class="mr-2"></span>
        <span id="toast-msg"></span>
    </div>

    <script>
        // --- 題庫資料 (包含加減消去與新增的代入消去) ---
        const questionsData = [
            // --- 加減消去法 (1-6) ---
            {
                id: 1, title: "第 1 題 (加減)", equations: ["3x + 3y = 33", "3x - 2y = -7"], context: [],
                steps: [
                    { template: "5y = [slot]", answers: ["40"], options: ["5", "8", "33", "40"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["40", "5"], options: ["5", "8", "33", "40"] },
                    { template: "y = [slot]", answers: ["8"], options: ["5", "8", "40"] }
                ]
            },
            {
                id: 2, title: "第 2 題 (加減)", equations: ["6x + y = 23", "6x - y = -7"], context: [],
                steps: [
                    { template: "2y = [slot]", answers: ["30"], options: ["2", "7", "15", "23", "30"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["30", "2"], options: ["2", "7", "15", "30"] },
                    { template: "y = [slot]", answers: ["15"], options: ["2", "7", "15", "30"] }
                ]
            },
            {
                id: 3, title: "第 3 題 (加減)", equations: ["x + 2y = 8", "x - y = 2"], context: [],
                steps: [
                    { template: "3y = [slot]", answers: ["6"], options: ["2", "3", "6", "8"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["6", "3"], options: ["2", "3", "6", "8"] },
                    { template: "y = [slot]", answers: ["2"], options: ["1", "2", "3", "6"] }
                ]
            },
            {
                id: 4, title: "第 4 題 (加減)", equations: ["3x + 3y = 19", "3x - 2y = 4"], context: [],
                steps: [
                    { template: "5y = [slot]", answers: ["15"], options: ["3", "4", "5", "15", "19"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["15", "5"], options: ["3", "4", "5", "15"] },
                    { template: "y = [slot]", answers: ["3"], options: ["2", "3", "4", "5"] }
                ]
            },
            {
                id: 5, title: "第 5 題 (加減)", equations: ["5x + 3y = 27", "5x - y = 9"], context: [],
                steps: [
                    { template: "4y = [slot]", answers: ["18"], options: ["4", "9", "18", "27"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["18", "4"], options: ["4", "5", "9", "18"] },
                    { template: "y = [slot]", answers: ["4.5"], options: ["3", "4.5", "5", "9"] }
                ]
            },
            {
                id: 6, title: "第 6 題 (加減)", equations: ["2x + 2y = 24", "2x - y = -4"], context: [],
                steps: [
                    { template: "3y = [slot]", answers: ["28"], options: ["4", "24", "28"] },
                    { template: "y = [slot] &divide; [slot]", answers: ["28", "3"], options: ["2", "3", "4", "28"] },
                    { template: "y = [slot]", answers: ["28/3"], options: ["8", "9", "28/3", "24"] }
                ]
            },
            // --- 代入消去法 (7-9 新增) ---
            {
                id: 7,
                title: "第 7 題 (代入)",
                equations: ["x + 3y = 3", "x - y = -1"],
                context: [
                    "<span class='text-blue-600 text-2xl'>代入 y = 1</span>",
                    "x + 3 &times; 1 = 3",
                    "x + 3 = 3",
                    "x = 3 - 3"
                ],
                steps: [
                    {
                        template: "x = [slot]",
                        answers: ["0"],
                        options: ["-1", "0", "1", "3"] // 包含推導結果0
                    }
                ]
            },
            {
                id: 8,
                title: "第 8 題 (代入)",
                equations: ["x + y = 3", "x - y = 1"],
                context: [
                    "<span class='text-blue-600 text-2xl'>已知 y = 2</span>",
                    "x + <span class='text-blue-600'>1</span> = 3" // 依照圖片原樣呈現算式
                ],
                steps: [
                    {
                        template: "x = 3 - [slot]",
                        answers: ["1"],
                        options: ["1", "2", "3"]
                    },
                    {
                        template: "x = [slot]",
                        answers: ["2"],
                        options: ["1", "2", "3"]
                    }
                ]
            },
            {
                id: 9,
                title: "第 9 題 (代入)",
                equations: ["2x + 2y = 6", "2x - y = 3"],
                context: [
                    "<span class='text-blue-600 text-2xl'>代入 y = 1</span>",
                    "2x + 2 &times; 1 = 6"
                ],
                steps: [
                    {
                        template: "2x + [slot] = 6",
                        answers: ["2"],
                        options: ["1", "2", "3", "6"]
                    },
                    {
                        template: "2x = [slot] - [slot]",
                        answers: ["6", "2"],
                        options: ["1", "2", "3", "6"]
                    },
                    {
                        template: "2x = [slot]",
                        answers: ["4"],
                        options: ["2", "4", "6"]
                    },
                    {
                        template: "x = [slot] &divide; [slot]",
                        answers: ["4", "2"],
                        options: ["2", "4", "6"]
                    },
                    {
                        template: "x = [slot]",
                        answers: ["2"],
                        options: ["1", "2", "3", "4", "6"]
                    }
                ]
            },
            // --- 第 10 題 (新增：往前挖空代入步驟) ---
            {
                id: 10,
                title: "第 10 題 (代入)",
                equations: ["3x + 2y = 16", "x - y = 2"],
                context: [
                    "<span class='text-blue-600 text-2xl'>代入 y = 2</span>"
                ],
                steps: [
                    {
                        template: "3x + 2 &times; [slot] = 16",
                        answers: ["2"],
                        options: ["1", "2", "3", "16"]
                    },
                    {
                        template: "3x + [slot] = 16",
                        answers: ["4"],
                        options: ["2", "4", "8", "16"]
                    },
                    {
                        template: "3x = [slot] - [slot]",
                        answers: ["16", "4"],
                        options: ["2", "3", "4", "16"]
                    },
                    {
                        template: "3x = [slot]",
                        answers: ["12"],
                        options: ["4", "12", "16"]
                    },
                    {
                        template: "x = [slot] &divide; [slot]",
                        answers: ["12", "3"],
                        options: ["2", "3", "4", "12"]
                    },
                    {
                        template: "x = [slot]",
                        answers: ["4"],
                        options: ["2", "3", "4", "12"]
                    }
                ]
            }
        ];

        // --- 全域狀態 ---
        let currentQuestionIndex = 0;
        let currentStepIndex = 0;
        let userAnswers = {};
        let currentQuestionMistakes = 0; // 記錄本題錯誤次數
        let questionScores = JSON.parse(localStorage.getItem('mathInteractiveScores')) || {}; // 記錄各題最高得分，並從本機讀取

        // --- 初始化 ---
        function init() {
            renderNavbar();
            loadQuestion(0);
        }

        // --- 繪製導覽列 ---
        function renderNavbar() {
            const nav = document.getElementById('nav-buttons');
            nav.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                // 手機版：維持橫向膠囊按鈕；桌機版：改為滿寬的圓角矩形按鈕
                btn.className = `flex-shrink-0 md:w-full text-center md:text-left px-4 py-3 md:py-4 md:px-5 rounded-full md:rounded-xl font-bold text-base md:text-lg transition-all border-2 ${idx === currentQuestionIndex ? 'bg-indigo-100 text-indigo-800 border-indigo-300 shadow-sm md:-translate-y-1' : 'bg-white text-gray-500 border-gray-100 hover:bg-gray-50 hover:border-gray-200'}`;

                // 處理分數標籤
                let scoreBadge = '';
                if (questionScores[idx] !== undefined) {
                    let badgeColor = 'bg-gray-200 text-gray-700'; // 預設防錯顏色
                    if (questionScores[idx] === 100) badgeColor = 'bg-yellow-200 text-yellow-800';
                    else if (questionScores[idx] >= 80) badgeColor = 'bg-green-200 text-green-800';
                    else if (questionScores[idx] >= 60) badgeColor = 'bg-blue-200 text-blue-800';
                    else badgeColor = 'bg-rose-200 text-rose-800';

                    scoreBadge = `<span class="ml-2 inline-flex items-center text-xs md:text-sm font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">${questionScores[idx]}分</span>`;
                }

                btn.innerHTML = `<div class="flex flex-row items-center justify-between w-full whitespace-nowrap"><span>${q.title}</span>${scoreBadge}</div>`;
                btn.onclick = () => loadQuestion(idx);
                nav.appendChild(btn);
            });
        }

        // --- 載入題目 ---
        function loadQuestion(index) {
            currentQuestionIndex = index;
            currentStepIndex = 0;
            userAnswers = {};
            currentQuestionMistakes = 0; // 重置錯誤次數
            updateScoreDisplay(); // 更新畫面分數

            const q = questionsData[index];
            renderNavbar();

            // 1. 渲染題目資訊
            document.getElementById('problem-title').innerHTML = `
                <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                ${q.title}
            `;

            const eqsContainer = document.getElementById('problem-equations');
            eqsContainer.innerHTML = q.equations.map(eq => `<div>${eq}</div>`).join('');

            // 1.5 渲染前置靜態算式 (若有)
            const ctxContainer = document.getElementById('problem-context');
            if (q.context && q.context.length > 0) {
                ctxContainer.innerHTML = q.context.map(ctx => `<div>${ctx}</div>`).join('');
                ctxContainer.style.display = 'flex';
            } else {
                ctxContainer.innerHTML = '';
                ctxContainer.style.display = 'none';
            }

            // 2. 渲染下方連續步驟
            const stepsContainer = document.getElementById('steps-container');
            stepsContainer.innerHTML = '';

            q.steps.forEach((step, sIdx) => {
                userAnswers[sIdx] = new Array(step.answers.length).fill(null);

                let templateHtml = step.template;
                let slotCounter = 0;
                while (templateHtml.includes('[slot]')) {
                    templateHtml = templateHtml.replace('[slot]', `<span class="slot" data-step="${sIdx}" data-slot-idx="${slotCounter}" onclick="handleSlotClick(this)"></span>`);
                    slotCounter++;
                }

                const shuffledOptions = [...step.options].sort(() => Math.random() - 0.5);
                const optionsHtml = shuffledOptions.map(opt => `
                    <button class="option-btn px-5 py-3 bg-white border-2 border-indigo-400 text-indigo-700 rounded-xl font-bold text-2xl shadow-sm hover:bg-indigo-50 flex items-center justify-center min-w-[3.5rem]" 
                            onclick="handleOptionClick(this, ${sIdx}, '${opt}')" data-opt-val="${opt}">
                        ${opt}
                    </button>
                `).join('');

                const row = document.createElement('div');
                row.id = `step-row-${sIdx}`;
                row.className = `step-row flex flex-col items-center w-full transition-all duration-500`;

                row.innerHTML = `
                    <div class="math mb-3 justify-center w-full text-3xl flex items-center relative min-h-[4rem]">
                        ${templateHtml}
                        <span id="status-icon-${sIdx}" class="hidden absolute right-0 md:-right-8 text-green-500">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </span>
                    </div>
                    
                    <div id="options-area-${sIdx}" class="w-full max-w-md bg-indigo-50/60 rounded-2xl p-5 mb-8 border border-indigo-100 shadow-inner flex flex-col items-center">
                        <div class="text-sm text-indigo-800 mb-3 font-bold flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            點選下方數字填入空格
                        </div>
                        <div class="flex flex-wrap justify-center gap-3 mb-5">
                            ${optionsHtml}
                        </div>
                        <button id="check-btn-${sIdx}" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 shadow-md transition flex items-center w-full md:w-auto justify-center" onclick="checkStep(${sIdx})">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            檢查答案
                        </button>
                    </div>
                `;
                stepsContainer.appendChild(row);
            });

            updateStepVisibility();
        }

        // --- 更新目前分數顯示 ---
        function updateScoreDisplay() {
            // 每錯一次扣 10 分，最低 0 分
            const currentScore = Math.max(0, 100 - (currentQuestionMistakes * 10));
            const scoreDisplay = document.getElementById('current-score-display');
            scoreDisplay.innerText = currentScore;

            // 分數變低時稍微改變顏色提醒
            if (currentScore < 60) {
                scoreDisplay.parentElement.className = 'absolute top-4 right-4 bg-red-100 text-red-800 px-4 py-1 rounded-full font-bold text-sm shadow-sm flex items-center';
            } else {
                scoreDisplay.parentElement.className = 'absolute top-4 right-4 bg-yellow-100 text-yellow-800 px-4 py-1 rounded-full font-bold text-sm shadow-sm flex items-center';
            }
        }

        // --- 點擊選項 ---
        function handleOptionClick(btnElement, stepIdx, value) {
            const slots = document.querySelectorAll(`.slot[data-step="${stepIdx}"]`);
            let targetSlot = null;
            let targetSlotIdx = -1;

            for (let i = 0; i < slots.length; i++) {
                if (!slots[i].classList.contains('filled') && !slots[i].classList.contains('correct')) {
                    targetSlot = slots[i];
                    targetSlotIdx = i;
                    break;
                }
            }

            if (targetSlot) {
                targetSlot.innerText = value;
                targetSlot.classList.add('filled');
                targetSlot.dataset.sourceBtn = value;
                userAnswers[stepIdx][targetSlotIdx] = value;
                btnElement.disabled = true;
            } else {
                showToast('空格都填滿囉，請點擊「檢查答案」！', 'info');
            }
        }

        // --- 清除 Slot ---
        function handleSlotClick(slotElement) {
            if (slotElement.classList.contains('correct')) return;
            if (!slotElement.classList.contains('filled')) return;

            const stepIdx = slotElement.dataset.step;
            const slotIdx = slotElement.dataset.slotIdx;
            const value = slotElement.innerText;

            slotElement.innerText = '';
            slotElement.classList.remove('filled');
            delete slotElement.dataset.sourceBtn;
            userAnswers[stepIdx][slotIdx] = null;

            const buttons = document.querySelectorAll(`#options-area-${stepIdx} .option-btn`);
            for (let btn of buttons) {
                if (btn.disabled && btn.dataset.optVal === value) {
                    btn.disabled = false;
                    break;
                }
            }
        }

        // --- 檢查答案 ---
        function checkStep(stepIdx) {
            const q = questionsData[currentQuestionIndex];
            const currentStepData = q.steps[stepIdx];
            const currentAnswers = userAnswers[stepIdx];

            if (currentAnswers.includes(null)) {
                showToast('請填滿所有空格喔！', 'warning');
                return;
            }

            let isAllCorrect = true;
            const slots = document.querySelectorAll(`.slot[data-step="${stepIdx}"]`);

            for (let i = 0; i < currentAnswers.length; i++) {
                if (currentAnswers[i] !== currentStepData.answers[i]) {
                    isAllCorrect = false;
                    break;
                }
            }

            if (isAllCorrect) {
                // 答對邏輯
                slots.forEach(slot => {
                    slot.classList.remove('filled');
                    slot.classList.add('correct');
                    slot.classList.add('animate-tada');
                });

                const row = document.getElementById(`step-row-${stepIdx}`);
                row.classList.remove('active');
                row.classList.add('completed');

                document.getElementById(`status-icon-${stepIdx}`).classList.remove('hidden');
                document.getElementById(`options-area-${stepIdx}`).style.display = 'none';
                document.getElementById(`check-btn-${stepIdx}`).style.display = 'none';

                if (stepIdx < q.steps.length - 1) {
                    // 解鎖下一步
                    showToast('答對了！繼續下一步！', 'success');
                    currentStepIndex++;
                    setTimeout(() => {
                        updateStepVisibility();
                        document.getElementById(`step-row-${currentStepIndex}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 800);
                } else {
                    // 全部完成，結算分數
                    showToast('完美！本題計算完成！', 'success');
                    const finalScore = Math.max(0, 100 - (currentQuestionMistakes * 10));

                    // 記錄最高分並即時更新導覽列顯示
                    questionScores[currentQuestionIndex] = Math.max(questionScores[currentQuestionIndex] || 0, finalScore);
                    localStorage.setItem('mathInteractiveScores', JSON.stringify(questionScores)); // 儲存分數至瀏覽器本機端
                    renderNavbar();

                    setTimeout(() => {
                        openScoreModal(finalScore);
                    }, 1200);
                }
            } else {
                // 答錯邏輯：扣分並提示
                currentQuestionMistakes++;
                updateScoreDisplay();

                showToast('再想想看，答案不太對喔！(扣10分)', 'error');
                const row = document.getElementById(`step-row-${stepIdx}`);
                row.style.transform = 'translateX(-5px)';
                setTimeout(() => row.style.transform = 'translateX(5px)', 100);
                setTimeout(() => row.style.transform = 'translateX(0)', 200);
            }
        }

        function updateStepVisibility() {
            const q = questionsData[currentQuestionIndex];
            for (let i = 0; i < q.steps.length; i++) {
                const row = document.getElementById(`step-row-${i}`);
                if (i === currentStepIndex) {
                    row.classList.add('active');
                    row.classList.remove('completed');
                } else if (i < currentStepIndex) {
                    row.classList.remove('active');
                    row.classList.add('completed');
                } else {
                    row.classList.remove('active', 'completed');
                }
            }
        }

        // --- Toast 訊息 ---
        let toastTimeout;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-msg');

            text.innerText = msg;

            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 z-50 font-bold text-lg flex items-center bg-green-600 text-white';
                icon.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            } else if (type === 'error' || type === 'warning') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 z-50 font-bold text-lg flex items-center bg-rose-500 text-white';
                icon.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            } else {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 z-50 font-bold text-lg flex items-center bg-blue-600 text-white';
                icon.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }

            toast.style.opacity = '1';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        // --- 計分 Modal 控制 ---
        function openScoreModal(score) {
            const modal = document.getElementById('completion-modal');
            const content = document.getElementById('modal-content');
            const scoreEl = document.getElementById('modal-score');
            const titleEl = document.getElementById('modal-title');
            const feedbackEl = document.getElementById('modal-feedback');
            const iconContainer = document.getElementById('modal-icon-container');

            scoreEl.innerText = `${score} 分`;

            // 根據分數給予不同回饋與圖示
            if (score === 100) {
                iconContainer.className = "w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 relative z-10 shadow-md";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
                titleEl.innerText = "完美無瑕！";
                feedbackEl.innerText = "完全掌握了解題技巧，太厲害了！";
                titleEl.className = "text-2xl font-bold text-yellow-600 mb-2 relative z-10";
            } else if (score >= 80) {
                iconContainer.className = "w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 relative z-10 shadow-md";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>`;
                titleEl.innerText = "表現優異！";
                feedbackEl.innerText = "觀念很正確，只差一點點就完美囉！";
                titleEl.className = "text-2xl font-bold text-green-600 mb-2 relative z-10";
            } else if (score >= 60) {
                iconContainer.className = "w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 relative z-10 shadow-md";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
                titleEl.innerText = "繼續加油！";
                feedbackEl.innerText = "多練習幾次，一定會越來越順手！";
                titleEl.className = "text-2xl font-bold text-blue-600 mb-2 relative z-10";
            } else {
                iconContainer.className = "w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 relative z-10 shadow-md";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>`;
                titleEl.innerText = "不要灰心！";
                feedbackEl.innerText = "跟著步驟慢慢來，觀念釐清最重要！";
                titleEl.className = "text-2xl font-bold text-rose-600 mb-2 relative z-10";
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('completion-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function retryCurrentQuestion() {
            closeModal();
            setTimeout(() => {
                loadQuestion(currentQuestionIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        window.onload = init;
    </script>
<script src="../progress.js"></script>
</body>

</html>
