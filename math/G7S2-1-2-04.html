<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加減消去法</title>
    <link rel="icon" href="dog.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fafaf9;
            color: #292524;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .math-text {
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.05em;
        }

        .var-x {
            color: #0369a1;
            font-weight: bold;
            font-style: italic;
        }

        .var-y {
            color: #be123c;
            font-weight: bold;
            font-style: italic;
        }

        /* 直式對齊樣式 */
        .vertical-math {
            display: inline-grid;
            grid-template-columns: auto auto auto auto auto;
            gap: 0 0.5rem;
            align-items: center;
            text-align: right;
            padding: 1rem;
        }

        .vertical-line {
            grid-column: 1 / span 5;
            height: 2px;
            background-color: #44403c;
            margin: 0.5rem 0;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 答錯震動動畫 */
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .tab-active {
            border-bottom: 4px solid #0d9488;
            color: #0d9488;
            font-weight: bold;
        }

        .tab-inactive {
            border-bottom: 4px solid transparent;
            color: #78716c;
        }

        /* 選項按鈕樣式 */
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #e7e5e4;
            color: #44403c;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .option-btn:hover {
            border-color: #14b8a6;
            background-color: #f0fdfa;
            color: #0f766e;
        }

        .option-btn.wrong {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        .option-btn.correct {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }
    </style>
</head>

<body class="min-h-screen pb-12">

    <!-- Chosen Palette: Warm Neutrals with Teal Actions, single column layout for extreme focus -->
    <!-- Application Structure Plan: Simplified to a single centered column. Removed charts. The practice section is now a step-by-step state machine. Users click options instead of typing. Correct answers reveal the next part of the vertical calculation, mimicking a teacher solving it on a board step-by-step. -->
    <!-- Visualization & Content Choices: 
         1. Interactive Vertical Equation Solver -> Goal: Organize & Learn -> Method: HTML Grid + JS State Machine -> Justification: Eliminates typing friction, enforces correct logic flow step-by-step, keeps visual alignment perfect. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <header class="bg-white shadow-sm border-b border-stone-200 sticky top-0 z-10 transition-all duration-300">
        <div
            class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="dog.png" alt="icon" class="h-10 w-10 object-contain">
                <div>
                    <h1 class="text-2xl font-black text-teal-800 tracking-tight">數學助教 3️⃣數題數題</h1>
                    <p class="text-sm text-stone-500 font-medium mt-1">二元一次聯立方程式：加減消去法 (直式演練)</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="G7S2-1-2-03.html"
                    class="bg-teal-100 text-teal-800 hover:bg-teal-200 px-4 py-2 rounded-lg font-bold transition-colors text-sm flex items-center">
                    ⬅️ 上一個概念
                </a>
                <div
                    class="flex items-center text-xl gap-2 bg-teal-50 text-teal-800 font-bold px-4 py-2 rounded-full border border-teal-200 transition-transform duration-300 score-container">
                    ⭐ <span id="score-display">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">

        <nav class="flex space-x-8 mb-8 border-b border-stone-200 justify-center">
            <button id="tab-demo" class="pb-3 px-6 text-xl transition-colors duration-200 tab-active"
                onclick="switchTab('demo')">
                一、 直式示範
            </button>
            <button id="tab-practice" class="pb-3 px-6 text-xl transition-colors duration-200 tab-inactive"
                onclick="switchTab('practice')">
                二、 實戰演練
            </button>
        </nav>

        <!-- 第一部分：示範 -->
        <section id="section-demo" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 sm:p-10 border border-stone-100 flex flex-col">
                <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center justify-center">
                    <span
                        class="bg-amber-100 text-amber-800 w-10 h-10 rounded-full inline-flex items-center justify-center mr-3 text-xl">教</span>
                    直式解題步驟示範
                </h2>

                <div id="demo-steps-container" class="space-y-6 flex-grow">
                    <div id="demo-step-1" class="hidden bg-blue-50 p-6 rounded-xl border border-blue-100 fade-in">
                        <h3 class="font-bold text-blue-800 text-lg mb-4 text-center">第一步：對齊方程式</h3>
                        <div
                            class="math-text text-3xl flex justify-center py-6 bg-white rounded-xl border border-blue-200 shadow-sm">
                            <div class="vertical-math">
                                <span></span><span><span class="var-x">x</span></span><span>+ 3<span
                                        class="var-y">y</span></span><span>=</span><span>3</span>
                                <span></span><span><span class="var-x">x</span></span><span>- <span
                                        class="var-y">y</span></span><span>=</span><span>-1</span>
                            </div>
                        </div>
                    </div>

                    <div id="demo-step-2" class="hidden bg-indigo-50 p-6 rounded-xl border border-indigo-100 fade-in">
                        <h3 class="font-bold text-indigo-800 text-lg mb-4 text-center">第二步：畫線相減 (上減下)</h3>
                        <div
                            class="math-text text-3xl flex justify-center py-6 bg-white rounded-xl border border-indigo-200 shadow-sm">
                            <div class="vertical-math">
                                <span></span><span><span class="var-x">x</span></span><span>+ 3<span
                                        class="var-y">y</span></span><span>=</span><span>3</span>
                                <span class="text-red-500 font-bold">-</span><span>(<span
                                        class="var-x">x</span>)</span><span>- (<span
                                        class="var-y">y</span>)</span><span>=</span><span>(-1)</span>
                                <div class="vertical-line"></div>
                                <span></span><span class="text-stone-300">0</span><span class="font-bold">4<span
                                        class="var-y">y</span></span><span>=</span><span class="font-bold">4</span>
                            </div>
                        </div>
                        <p class="text-indigo-700 mt-4 text-center font-bold bg-indigo-100 py-2 rounded">注意負號：3y 減去 (-y)
                            會變成 3y + y = 4y！</p>
                    </div>

                    <div id="demo-step-3"
                        class="hidden bg-purple-50 p-6 rounded-xl border border-purple-100 fade-in text-center">
                        <h3 class="font-bold text-purple-800 text-lg mb-4">第三步：求出第一個未知數</h3>
                        <p
                            class="font-bold text-purple-900 math-text text-3xl bg-white py-4 rounded-xl border border-purple-200 shadow-sm">
                            4<span class="var-y">y</span> = 4 ➔ <span class="var-y">y</span> = 1
                        </p>
                    </div>

                    <div id="demo-step-4"
                        class="hidden bg-teal-50 p-6 rounded-xl border border-teal-100 fade-in text-center">
                        <h3 class="font-bold text-teal-800 text-lg mb-4">第四步：代入求出第二個未知數</h3>
                        <p class="text-stone-700 mb-4 text-lg">把 <span class="var-y">y</span> = 1 代入第二個式子：<span
                                class="var-x">x</span> - 1 = -1</p>
                        <p
                            class="font-bold text-teal-900 math-text text-3xl bg-white py-4 rounded-xl border border-teal-200 shadow-sm">
                            <span class="var-x">x</span> = 0
                        </p>
                    </div>
                </div>

                <div class="mt-8 flex justify-center">
                    <button id="btn-demo-next" onclick="nextDemoStep()"
                        class="w-full sm:w-2/3 bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-md text-xl">
                        顯示下一步
                    </button>
                    <button id="btn-demo-reset" onclick="resetDemo()"
                        class="hidden w-full sm:w-2/3 bg-stone-200 text-stone-700 hover:bg-stone-300 font-bold py-4 px-8 rounded-xl transition-all text-xl">
                        重看一次
                    </button>
                </div>
            </div>
        </section>

        <!-- 第二部分：實戰演練 -->
        <section id="section-practice" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 sm:p-10 border border-stone-100">
                <div class="flex flex-wrap justify-center gap-3 mb-8" id="practice-buttons"></div>

                <div class="bg-stone-50 p-6 sm:p-8 rounded-xl border border-stone-200 flex flex-col items-center">
                    <h3 class="text-xl font-bold text-stone-700 mb-6" id="practice-title">目前練習</h3>

                    <!-- 動態直式顯示區 -->
                    <div class="bg-white p-6 sm:p-8 rounded-xl border border-stone-300 mb-8 text-center text-4xl math-text shadow-sm min-w-[300px]"
                        id="practice-equation-display">
                        <!-- JS 注入直式 -->
                    </div>

                    <!-- 互動問答區 -->
                    <div class="w-full max-w-lg bg-white p-6 rounded-xl border-2 border-teal-100 shadow-inner"
                        id="interactive-area">
                        <h4 class="text-xl font-bold text-teal-800 mb-6 text-center" id="question-text">準備好開始解題了嗎？</h4>
                        <div class="flex flex-col gap-4" id="options-container">
                            <!-- JS 注入選項按鈕 -->
                        </div>
                        <div id="success-message" class="hidden text-center fade-in mt-4">
                            <div class="text-5xl mb-4">🎉</div>
                            <h4 class="text-2xl font-bold text-green-600 mb-2">太棒了！完全正確！</h4>
                            <p class="text-lg text-stone-600 font-bold" id="final-answer-text"></p>
                            <button onclick="nextPractice()"
                                class="mt-6 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-xl text-lg w-full transition-colors">下一題</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 狀態管理
        const appState = {
            currentTab: 'demo',
            demoStep: 0,
            currentPracticeIdx: 0,
            currentPracticeSubStep: 0 // 0: initial, 1: result eq, 2: var 1, 3: var 2, 4: done
        };

        // 分數管理
        let totalScore = parseInt(localStorage.getItem('G7S2-1-2-04_score')) || 0;

        function updateScoreDisplay() {
            const scoreEl = document.getElementById('score-display');
            if (scoreEl) scoreEl.textContent = totalScore;
        }

        function addScore(points) {
            totalScore += points;
            localStorage.setItem('G7S2-1-2-04_score', totalScore);
            updateScoreDisplay();
            const scoreContainer = document.querySelector('.score-container');
            if (scoreContainer) {
                scoreContainer.classList.add('bg-yellow-200', 'scale-110');
                setTimeout(() => {
                    scoreContainer.classList.remove('bg-yellow-200', 'scale-110');
                }, 300);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateScoreDisplay();
        });

        // 題目與步驟資料
        const equationsData = {
            practices: [
                {
                    id: 1, a1: 1, b1: 2, c1: 5, a2: 1, b2: -1, c2: 2, ansX: 3, ansY: 1,
                    subSteps: [
                        { q: "步驟一：將兩式相減 (上減下)，剩下的式子是什麼？", opts: ["3y = 3", "y = 3", "3y = 7"], correct: 0 },
                        { q: "步驟二：3y = 3，所以 y 等於多少？", opts: ["y = 1", "y = 2", "y = 3"], correct: 0 },
                        { q: "步驟三：把 y = 1 代入式① (x + 2 = 5)，x 等於多少？", opts: ["x = 2", "x = 4", "x = 3"], correct: 2 }
                    ],
                    midEq: "3y", midAns: "3", firstVar: "y"
                },
                {
                    id: 2, a1: 1, b1: 4, c1: 10, a2: 1, b2: 1, c2: 4, ansX: 2, ansY: 2,
                    subSteps: [
                        { q: "步驟一：將兩式相減 (上減下)，剩下的式子是什麼？", opts: ["5y = 14", "3y = 6", "y = 6"], correct: 1 },
                        { q: "步驟二：3y = 6，所以 y 等於多少？", opts: ["y = 2", "y = 3", "y = 4"], correct: 0 },
                        { q: "步驟三：把 y = 2 代入式② (x + 2 = 4)，x 等於多少？", opts: ["x = 4", "x = 2", "x = 6"], correct: 1 }
                    ],
                    midEq: "3y", midAns: "6", firstVar: "y"
                },
                {
                    id: 3, a1: 1, b1: -3, c1: 1, a2: 1, b2: 2, c2: 11, ansX: 7, ansY: 2,
                    subSteps: [
                        { q: "步驟一：將兩式相減 (上減下)，剩下的式子是什麼？", opts: ["-y = 12", "5y = -10", "-5y = -10"], correct: 2 },
                        { q: "步驟二：-5y = -10，所以 y 等於多少？", opts: ["y = -2", "y = 2", "y = 5"], correct: 1 },
                        { q: "步驟三：把 y = 2 代入式② (x + 4 = 11)，x 等於多少？", opts: ["x = 7", "x = -7", "x = 5"], correct: 0 }
                    ],
                    midEq: "-5y", midAns: "-10", firstVar: "y"
                },
                {
                    id: 4, a1: 2, b1: 1, c1: 7, a2: 1, b2: 1, c2: 4, ansX: 3, ansY: 1,
                    subSteps: [
                        { q: "步驟一：這次 y 係數一樣，將兩式相減 (上減下) 後，會得到什麼？", opts: ["x = 3", "3x = 11", "x = 11"], correct: 0 },
                        { q: "步驟二：太好了，直接算出 x = 3！請點擊確認", opts: ["x = 2", "x = 3", "x = 4"], correct: 1 },
                        { q: "步驟三：把 x = 3 代入式② (3 + y = 4)，y 等於多少？", opts: ["y = 1", "y = -1", "y = 7"], correct: 0 }
                    ],
                    midEq: "x", midAns: "3", firstVar: "x"
                },
                {
                    id: 5, a1: 1, b1: 1, c1: 6, a2: 1, b2: -1, c2: 2, ansX: 4, ansY: 2,
                    subSteps: [
                        { q: "步驟一：將兩式相減 (上減下)，注意 y - (-y)，剩下的式子是什麼？", opts: ["0 = 4", "2y = 4", "2y = 8"], correct: 1 },
                        { q: "步驟二：2y = 4，所以 y 等於多少？", opts: ["y = 4", "y = 1", "y = 2"], correct: 2 },
                        { q: "步驟三：把 y = 2 代入式① (x + 2 = 6)，x 等於多少？", opts: ["x = 4", "x = 2", "x = 8"], correct: 0 }
                    ],
                    midEq: "2y", midAns: "4", firstVar: "y"
                }
            ]
        };

        // 頁籤切換
        function switchTab(tabId) {
            appState.currentTab = tabId;
            document.getElementById('tab-demo').className = tabId === 'demo' ? 'pb-3 px-6 text-xl tab-active' : 'pb-3 px-6 text-xl tab-inactive hover:text-stone-700';
            document.getElementById('tab-practice').className = tabId === 'practice' ? 'pb-3 px-6 text-xl tab-active' : 'pb-3 px-6 text-xl tab-inactive hover:text-stone-700';
            document.getElementById('section-demo').style.display = tabId === 'demo' ? 'block' : 'none';
            document.getElementById('section-practice').style.display = tabId === 'practice' ? 'block' : 'none';
            if (tabId === 'practice' && document.getElementById('practice-buttons').children.length === 0) {
                initPracticeUI();
            }
        }

        // 示範區邏輯
        function nextDemoStep() {
            appState.demoStep++;
            if (appState.demoStep <= 4) {
                document.getElementById(`demo-step-${appState.demoStep}`).classList.remove('hidden');
            }
            if (appState.demoStep >= 4) {
                document.getElementById('btn-demo-next').classList.add('hidden');
                document.getElementById('btn-demo-reset').classList.remove('hidden');
            }
        }

        function resetDemo() {
            appState.demoStep = 0;
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`demo-step-${i}`).classList.add('hidden');
            }
            document.getElementById('btn-demo-next').classList.remove('hidden');
            document.getElementById('btn-demo-reset').classList.add('hidden');
        }

        // 產生直式排版 (根據目前答對進度顯示)
        function generateVerticalMathHTML(p, step) {
            const b1Text = p.b1 >= 0 ? `+ ${p.b1 === 1 ? '' : p.b1}<span class="var-y">y</span>` : `- ${Math.abs(p.b1) === 1 ? '' : Math.abs(p.b1)}<span class="var-y">y</span>`;
            const b2Text = p.b2 >= 0 ? `+ ${p.b2 === 1 ? '' : p.b2}<span class="var-y">y</span>` : `- ${Math.abs(p.b2) === 1 ? '' : Math.abs(p.b2)}<span class="var-y">y</span>`;
            const a1Text = p.a1 === 1 ? '<span class="var-x">x</span>' : `${p.a1}<span class="var-x">x</span>`;
            const a2Text = p.a2 === 1 ? '<span class="var-x">x</span>' : `${p.a2}<span class="var-x">x</span>`;

            let html = `<div class="vertical-math">`;

            // 基礎方程式
            html += `<span></span><span>${a1Text}</span><span>${b1Text}</span><span>=</span><span>${p.c1}</span>`;

            if (step >= 1) { // 顯示相減符號與括號
                html += `<span class="text-red-500 font-bold fade-in">-</span><span class="fade-in">(${a2Text})</span><span class="fade-in">(${b2Text})</span><span class="fade-in">=</span><span class="fade-in">(${p.c2})</span>`;
                html += `<div class="vertical-line fade-in"></div>`;
            } else {
                html += `<span></span><span>${a2Text}</span><span>${b2Text}</span><span>=</span><span>${p.c2}</span>`;
            }

            if (step >= 2) { // 顯示相減結果
                let resX = p.firstVar === 'y' ? '<span class="text-stone-300">0</span>' : `<span class="font-bold">${p.midEq}</span>`;
                let resY = p.firstVar === 'x' ? '<span class="text-stone-300">0</span>' : `<span class="font-bold">${p.midEq}</span>`;
                html += `<span></span><span class="fade-in">${resX}</span><span class="fade-in">${resY}</span><span class="fade-in">=</span><span class="font-bold fade-in">${p.midAns}</span>`;
            }

            html += `</div>`;
            return html;
        }

        // 實戰區邏輯
        function initPracticeUI() {
            const btnContainer = document.getElementById('practice-buttons');
            equationsData.practices.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.innerText = `第 ${p.id} 題`;
                btn.className = 'bg-stone-200 text-stone-700 font-bold py-2 px-6 rounded-xl text-lg hover:bg-stone-300 transition-colors';
                btn.onclick = () => loadPractice(index, btn);
                btnContainer.appendChild(btn);
            });
            loadPractice(0, btnContainer.children[0]);
        }

        function loadPractice(index, activeBtn) {
            appState.currentPracticeIdx = index;
            appState.currentPracticeSubStep = 0; // 重置小步驟

            // 更新按鈕樣式
            const buttons = document.getElementById('practice-buttons').children;
            for (let b of buttons) {
                b.className = 'bg-stone-200 text-stone-700 font-bold py-2 px-6 rounded-xl text-lg hover:bg-stone-300 transition-colors';
            }
            if (activeBtn) activeBtn.className = 'bg-stone-800 text-white font-bold py-2 px-6 rounded-xl text-lg shadow';

            document.getElementById('practice-title').innerText = `第 ${equationsData.practices[index].id} 題`;
            document.getElementById('success-message').classList.add('hidden');
            document.getElementById('options-container').classList.remove('hidden');
            document.getElementById('question-text').classList.remove('hidden');

            renderPracticeState();
        }

        function renderPracticeState() {
            const p = equationsData.practices[appState.currentPracticeIdx];
            const step = appState.currentPracticeSubStep;

            // 1. 更新方程式畫面
            const display = document.getElementById('practice-equation-display');
            display.innerHTML = generateVerticalMathHTML(p, step);

            // 2. 更新問答區
            const qText = document.getElementById('question-text');
            const optsContainer = document.getElementById('options-container');

            optsContainer.innerHTML = ''; // 清空選項

            if (step === 0) {
                // 準備狀態
                qText.innerText = "準備好開始解題了嗎？";
                const startBtn = document.createElement('button');
                startBtn.className = 'bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-xl text-xl transition-colors shadow-sm';
                startBtn.innerHTML = '✏️ 開始畫線相減';
                startBtn.onclick = () => {
                    appState.currentPracticeSubStep = 1;
                    renderPracticeState();
                };
                optsContainer.appendChild(startBtn);
            }
            else if (step >= 1 && step <= 3) {
                // 答題狀態
                const stepData = p.subSteps[step - 1];
                qText.innerHTML = stepData.q.replace(/x/g, '<span class="var-x">x</span>').replace(/y/g, '<span class="var-y">y</span>');

                stepData.opts.forEach((optText, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn math-text';
                    btn.innerHTML = optText.replace(/x/g, '<span class="var-x">x</span>').replace(/y/g, '<span class="var-y">y</span>');
                    btn.onclick = () => handleOptionClick(btn, optIdx, stepData.correct);
                    optsContainer.appendChild(btn);
                });
            }
            else if (step === 4) {
                // 完成狀態
                qText.classList.add('hidden');
                optsContainer.classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
                document.getElementById('final-answer-text').innerHTML = `答案：<span class="var-x">x</span> = ${p.ansX} , <span class="var-y">y</span> = ${p.ansY}`;
            }
        }

        function handleOptionClick(btnElement, selectedIdx, correctIdx) {
            if (selectedIdx === correctIdx) {
                // 答對
                if (!btnElement.dataset.scored) {
                    addScore(10);
                    btnElement.dataset.scored = "true";
                }
                btnElement.classList.add('correct');
                // 延遲一下讓學生看到綠色，然後進入下一步
                setTimeout(() => {
                    appState.currentPracticeSubStep++;
                    renderPracticeState();
                }, 500);
            } else {
                // 答錯
                btnElement.classList.add('wrong', 'shake');
                setTimeout(() => {
                    btnElement.classList.remove('shake');
                    // 幾秒後恢復原狀，讓學生可以再選
                    setTimeout(() => {
                        btnElement.classList.remove('wrong');
                    }, 800);
                }, 500);
            }
        }

        function nextPractice() {
            let nextIdx = appState.currentPracticeIdx + 1;
            if (nextIdx >= equationsData.practices.length) {
                nextIdx = 0; // 回到第一題
            }
            const buttons = document.getElementById('practice-buttons').children;
            loadPractice(nextIdx, buttons[nextIdx]);
        }

    </script>
</body>

</html>
